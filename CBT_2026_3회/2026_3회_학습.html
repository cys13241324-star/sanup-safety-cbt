>책임 추궁이 아니라 재발 방지</u>.</p><p>조사할 때는 <strong>사실을 있는 그대로 · 신속하게 · 여러 사람이 · 책임 추궁보다 원인 규명을 앞세워</strong>한다. 이 넷이 재해조사의 원칙이다.<br><strong>책임을 묻기 시작하면 아무도 사실을 말하지 않는다</strong>. 그래서 조사는 <strong>사람이 아니라 원인을 향한다</strong>. <strong>「문책」·「처벌」</strong>이 보기에 끼면 대개 답이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">재해조사의 목적</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">목적</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>같은 재해가 되풀이되지 않도록 원인을 찾는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>설비상의 결함을 개선·시정하는 데 쓴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>재해의 구성요소와 분포를 알아 대책을 세운다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>근로자의 행동결함을 찾아 안전교육 자료로 쓴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>책임 소재를 밝혀 담당자를 평가한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>목적이 아니다</u></td></tr></tbody></table></div>", "nq": 3}, "card_erg_t037": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "스웨인(Swain)의 휴먼에러 분류", "front": "스웨인(Swain)의 휴먼에러 분류는?", "back": "<ul><li><strong>과잉행동 오류(Extraneous error)</strong>다. <strong>하지 않아도 될 일을 해서</strong> 생긴 오류다.</li><li><strong>수행 지연</strong>은 <strong>timing error</strong>다. <strong>commission error는 「했지만 잘못한」</strong> 오류다.</li><li><strong>생략 오류(omission error)</strong>다. <strong>해야 할 일을 빠뜨린</strong> 오류다.</li></ul><p><strong>◈ 암기</strong> <u>생략 · 작위 · 과잉 · 순서 · 시간</u>. · <u>안 함 · 잘못함 · 괜히 함 · 순서 바꿈 · 때를 놓침</u>.</p><p>다섯 가지를 <strong>안 했다 · 잘못했다 · 괜히 했다 · 순서를 바꿨다 · 때를 놓쳤다</strong>로 새기면 보기만 보고 고를 수 있다.<br><strong>commission과 timing을 바꿔치기</strong>하는 것이 이 유형의 단골 함정이다. <strong>「지연」이 보이면 timing</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">스웨인의 휴먼에러 — 행위로 나눈 분류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">우리말</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇인가</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Omission error</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생략 오류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">해야 할 일을 <u>빠뜨렸다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Commission error</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작위 오류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">했지만 <u>잘못했다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Extraneous error</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>과잉행동 오류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>하지 않아도 될 일</u>을 했다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Sequential error</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>순서 오류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">순서를 <u>뒤바꿨다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Timing error</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시간 오류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">너무 <u>빠르거나 늦었다</u></td></tr></tbody></table></div>", "nq": 3}, "card_erg_t038": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "FTA 의 논리 게이트", "front": "FTA 의 논리 게이트의 식은?", "back": "<ul><li><strong>OR 게이트</strong>다. 입력 가운데 <strong>하나만 일어나도</strong> 출력이 일어난다. 모두 일어나야 하는 것은 AND 게이트다.</li><li><strong>OR 게이트</strong>다. <strong>어느 하나만 일어나도</strong> 출력이 생기는 <strong>논리합</strong>의 관계다.</li></ul><p><strong>◈ 암기</strong> <u>하나만 나도 OR, 다 나야 AND</u>. · <u>어느 하나라도면 OR</u>.</p><p>확률로 보면 <strong>OR은 더하고(</strong>$1 - \\prod ( 1 - q_{i} )$<strong>), AND는 곱한다(</strong>$\\prod q_{i}$<strong>)</strong>. 그래서 <strong>AND로 묶인 구조가 훨씬 안전하다</strong>.<br><strong>논리합(OR)은 「또는」, 논리곱(AND)은 「그리고」</strong>다. 확률로는 <strong>OR는 </strong>$1 - ( 1 - P_{1} ) ( 1 - P_{2} )$<strong>, AND는 </strong>$P_{1} P_{2}$다.</p><div style=\"ma ip(실수)</strong>다. <strong>하려던 것은 맞는데 손이 다르게 움직인</strong> 경우다.<p><strong>◈ 암기</strong> <u>의도가 맞으면 Slip, 의도가 틀리면 Mistake</u>.</p><p><strong>Slip과 Lapse는 계획이 옳고 실행이 어긋난 것</strong>, <strong>Mistake는 계획 자체가 틀린 것</strong>, <strong>Violation은 고의</strong>다. 앞의 셋은 교육과 설계로, 마지막은 관리로 다룬다.</p><div style=\"margin:12px 0 2px;font-weight:700\">라스무센·리즌의 오류 분류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇이 잘못됐나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Slip</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>의도는 옳고 행동이 어긋남</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">오른쪽 버튼을 누르려다 왼쪽을 눌렀다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Lapse</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기억이 빠짐</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">해야 할 단계를 잊었다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Mistake</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>의도 자체가 틀림</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">잘못 판단해 잘못된 조작을 계획했다</td></tr><tr><td style=\"bo e=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">하는 일</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">1</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">목표와 성능명세 결정</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">무엇을 이루려는 시스템인가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">2</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">시스템의 정의</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">그 목표에 어떤 기능이 필요한가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">3</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기본 설계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사람과 기계에 기능을 나눔</u> · 직무분석 · 작업설계</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">4</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">인터페이스 설계</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">표시장치와 조종장치를 짬</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">5</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">보조물 설계</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">설명서 · 훈련도구 · 편의수단</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">6</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">시험과 평가</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">실제로 되는지 확인</td></tr></tbody></table></div>", "nq": 4}, "card_erg_t043": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "치명도 분석(CA)", "front": "치명도 분석(CA)는?", "back": "<strong>치명도 분석(CA, Criticality Analysis)</strong>이다. <strong>얼마나 치명적인가</strong>로 고장을 줄 세운다. FMEA와 짝을 지어 <strong>FMECA</strong>로 쓴다.<p><strong>◈ 암기</strong> <u>치명도를 재면 CA</u>.</p><p><strong>FMEA는 「어떤 영향」, CA는 「얼마나 치명적」</strong>이다. 둘을 합친 FMECA가 실무에서 쓰인다.</p><div style=\"margin:12px 0 2px;font-weight:700\">주요 위험분석 기법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 보나</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>PHA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">예비위험분석</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>맨 처음</u> 개략적으로 위험을 훑는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>FHA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">결함위험분석</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>분담 제작</u>하는 부분 시스템 사이의 위험</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>FMEA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">고장형태와 영향분석</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">고장이 <u>어떤 영향</u>을 미치나 — 정성적</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>CA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>치명도 분석</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>얼마나 치명적인가</u> — 정량적</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>ETA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">사건수 분석</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">초기 사건 뒤 <u>무슨 일이 이어지나</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>FTA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">결함수 분석</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">결과에서 <u>원인으로 거슬러</u> 올라간다</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t044": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "FMEA(고장형태와 영향분석)", "front": "FMEA(고장형태와 영향분석)은?", "back": "<ul><li><strong>FMEA</strong>다. <strong>고장 형태(Failure Mode)</strong>라는 말이 나오면 FMEA로 보면 된다.</li><li>FMEA는 <strong>한 번에 부품 하나의 고장</strong>만 본다. <strong>둘 이상이 동시에 고장 나는 경우에는 맞지 않는다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>「고장 형태」가 나오면 FMEA</u>. · <u>FMEA는 동시 고장에 약하다</u>.</p><p>FMEA는 <strong>귀납적이고 정성적</strong>이며 <strong>밑에서 위로</strong> 올라간다. FTA는 <strong>연역적이고 정량적</strong>이며 <strong>위에서 아래로</strong> 내려간다. 방향이 정반대다.<br><strong>FMEA는 부품 목록을 한 줄씩 짚어 「이것이 고장 나면?」</strong>을 묻는다 — <strong>표의 한 줄이 부품 하나이므로 동시 고장은 담기지 않는다</strong>. <strong>그것을 다루려면 FTA</strong>로 간다.</p><div style=\"margin:12px 0 2px;font-weight:700\">FMEA의 특징</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무엇</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>부품의 고장 형태와 그것이 시스템에 미치는 영향을 표로 정리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정성적 · 귀납적</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>장점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>양식이 간단하고 특별한 훈련 없이 쓸 수 있다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td rowspan=\"2\" style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>단점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>두 가지 이상이 동시에 고장 나는 경우에는 맞지 않는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>①</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>해석 영역이 물체에 한정되어 인적 원인 해석이 어렵다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>FTA와 다른 점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>FMEA는 원인에서 결과로(귀납), FTA는 결과에서 원인으로(연역)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t045": {"kind": "공식형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "정규분포를 따르는 수명의 신뢰도", "front": "정규분포를 따르는 수명의 신뢰도의 식은?", "back": "<ul><li>평균 10,000, 표준편차 200이다. $Z = ( 9 {,} 600 - 10 {,} 000 ) / 200 =-2$다. 9,600시간을 <strong>넘겨 살아 있을 확률</strong>이므로 $R = P ( Z &gt; - 2 ) = P ( Z \\le 2 ) = 0.9772$다.</li><li>$Z = ( 9 {,} 600 - 10 {,} 000 ) / 200 =-2$다. 9,600시간을 <strong>넘겨 살아 있을 확률</strong>이므로 $R = P ( Z &gt; - 2 ) = P ( Z \\le 2 ) = 0.9772$ 곧 <strong>97.72 [%]</strong>다.</li></ul><p><strong>◈ 암기</strong> $Z = ( t - \\mu ) / \\sigma$ — <u>음수면 대칭으로 뒤집는다</u>.</p><p>신뢰도는 <strong>그 시각까지 고장 나지 않을 확률</strong>이다. $Z$가 음수로 나오면 <strong>정규분포가 좌우대칭</strong>이므로 부호를 떼고 표를 그대로 읽으면 된다.<br>$Z$가 음수로 나오면 <strong>정규분포가 좌우대칭</strong>이므로 부호를 떼고 표를 그대로 읽는다. <strong>신뢰도는 「그 시각까지 버틸 확률」</strong>이라 오른쪽 꼬리를 본다.</p>", "nq": 2}, "card_erg_t046": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "직렬·병렬 결합 신뢰도", "front": "직렬·병렬 결합 신뢰도의 식은?", "back": "0.95 짜리 하나가 앞에 직렬로 있고, 그 뒤에 0.95와 0.90이 병렬로 붙어 있다. 병렬은 $1 - ( 1 - 0.95 ) ( 1 - 0.90 ) = 0.995$이고, 전체는 $0.95 \\times 0.995 \\fallingdotseq 0.9453$이다.<p><strong>◈ 암기</strong> <u>병렬 먼저 묶고, 그다음 곱한다</u>.</p><p><strong>직렬은 곱하고(</strong>$\\prod R_{i}$<strong>), 병렬은 고장 확률을 곱해 1에서 뺀다(</strong>$1 - \\prod ( 1 - R_{i} )$<strong>)</strong>. 섞여 있으면 <strong>병렬 덩어리를 먼저 하나로 묶은 뒤</strong> 직렬로 곱한다.</p>", "nq": 1}, "card_erg_t047": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "산소소비량의 계산", "front": "산소소비량의 계산의 식은?", "back": "배기량은 $90 / 5 = 18$ [L/min]이다. 질소는 몸에 쓰이지 않으므로 그 양으로 흡기량을 되돌린다. 배기 질소는 $100 - 16 - 4 = 80$ [%]이므로 $V_{1} = 18 \\times 0.80 / 0.79 = 18.228$ [L/min]이다. 산소소비량은 $18.228 \\times 0.21 - 18 \\times 0.16 = 3.828 - 2.88 \\fallingdotseq 0.948$ [L/min]이다.<p><strong>◈ 암기</strong> <u>질소로 흡기량을 되찾는다</u> — $V_{1} = V_{2} \\times N_{2} / 79$.</p><p>핵심은 <strong>질소는 소비되지도 생성되지도 않는다</strong>는 점이다. 그래서 <strong>질소량이 같다</strong>는 조건으로 흡기량을 되찾는다. 산소소비량 1 [L]은 약 <strong>5 [kcal]</strong>의 에너지에 해당한다.</p>", "nq": 1}, "card_erg_t032": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "인체계측 자료의 응용원칙", "front": "인체계측 자료의 응용원칙은?", "back": "<ul><li><strong>출입문</strong>은 가장 큰 사람이 지날 수 있어야 하므로 <strong>최대집단치(95 %tile)</strong>로 잡는다.</li><li><strong>평균치 설계</strong>다. 불특정 다수가 잠깐씩 쓰고 조절할 수도 없는 시설이라, 평균에 맞추는 것이 그나마 나은 선택이다.</li><li><strong>구조적 치수</strong>는 인체를 재는 <strong>방법</strong>을 가리키는 말이지 설계 원칙이 아니다. 응용원칙은 <strong>조절식 · 극단치 · 평균치</strong> 셋뿐이다.</li></ul><p><strong>◈ 암기</strong> <u>닿아야 하면 작은 사람(5), 지나가야 하면 큰 사람(95)</u>. · <u>조절이 안 되고 여럿이 잠깐 쓰면 평균치</u>.</p><p>우선순위는 <strong>조절식 &gt; 극단치 &gt; 평균치</strong>다. 평균치 설계는 어쩔 수 없을 때만 쓴다.<br>평균치 설계는 <strong>아무에게도 꼭 맞지 않는다</strong>는 약점이 있다. 그래서 조절식이 가능하면 언제나 조절식이 낫다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인체측정치 응용의 세 원칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원칙</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최대집단치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">95 %tile — 큰 사람 기준</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>출입문</u> · 통로 · 비상구 · 침대 길이</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최소집단치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">5 %tile — 작은 사람 기준</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">선반 높이 · 조작 버튼까지의 거리</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>조절식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">5~95 %tile을 담게</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">의자 높이 · 자동차 시트 · 책상</td></tr></tbody></table></div>", "nq": 6}, "card_erg_t048": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "작업환경관리", "mid": "실효온도(감각온도)", "front": "실효온도(감각온도)는?", "back": "<ul><li>실효온도는 <strong>온도 · 습도 · 공기 유동</strong> 세 가지로 정해진다. <strong>복사열은 들어가지 않는다</strong>. 복사열까지 넣은 것은 <strong>수정 실효온도(CET)</strong>다.</li><li><strong>실효온도(감각온도, effective temperature)</strong>다. <strong>온도 · 습도 · 기류</strong> 세 가지를 하나로 묶은 지수다.</li><li>실효온도는 <strong>몸의 온도가 아니라 둘레 환경의 온도</strong>를 다룬다. <strong>체온계로 입안을 재는</strong> 것과 관계없다.</li></ul><p><strong>◈ 암기</strong> <u>실효온도에 복사열은 없다</u>. · <u>온도 · 습도 · 기류 셋이면 실효온도</u>.</p><p><strong>실효온도는 셋, 수정 실효온도는 넷</strong>이다. 옥외 작업의 WBGT에 건구온도가 들어가는 것과 같은 이치로, <strong>햇볕(복사열)이 있으면 항목이 하나 늘어난다</strong>.<br><strong>「온도 · 습도 · 기류 셋을 묶었다」</strong>는 말이 실효온도를 가리킨다. <strong>옥스포드 지수와 불쾌지수는 기류를 넣지 않는다</strong>는 점에서 갈린다.</p><div style=\"margin:12px 0 2px;font-weight:700\">온열지수</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">지수</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 묶었나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>실효온도(감각온도)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>온도 · 습도 · 기류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>상대습도 100 [%] 기준</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>옥스포드 지수 WD</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>건구 · 습구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$0.85 W + 0.15 D$</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>WBGT</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>자연습구 · 흑구 · (건구)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">복사열까지</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>불쾌지수</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>건구 · 습구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>열압박지수 HSI</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>필요 발한량 대비 최대 발한량</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 3}, "card_erg_t049": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "조명 방식의 분류", "front": "조명 방식의 분류는?", "back": "<strong>국소조명</strong>이다. 필요한 자리만 밝게 한다. 정밀 작업에 쓴 V = \\pi \\times 0.3 \\times 500 \\fallingdotseq 471$ [m/min]이다.</li><li>$V = \\pi D N = \\pi \\times 0.2 \\times 300 \\fallingdotseq 188.5$ [m/min]이다.</li></ul><p><strong>◈ 암기</strong> $V = \\pi D N$ — <u>지름을 미터로 바꾼 뒤 곱한다</u>. · <u>지름을 미터로 바꿔 </u>$\\pi$<u>와 회전수를 곱한다</u>.</p><p>단위를 맞추는 것이 전부다. <strong>[m/min] 이면 D를 [m]로</strong>, <strong>[m/s] 면 </strong>$\\pi D N / 60$이다. 문제에서 [mm]로 준 지름을 그대로 쓰면 1,000배가 틀린다.<br><strong>[m/min] 이면 D를 [m]로</strong>, <strong>[m/s] 면 </strong>$\\pi D N / 60$이다. <strong>반지름이 아니라 지름</strong>을 쓴다는 것도 실수하기 쉬운 자리다.</p>", "nq": 2}, "card_mac_t037": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "휴대형 연삭기의 안전수칙", "front": "휴대형 연삭기의 안전수칙은?", "back": "숫돌을 갈아 끼우기 전에는 <strong>전선과 호스를 떼어 내야</strong> 한다. 붙여 두면 작업 중 갑자기 돌아 크게 다친다.<p><strong>◈ 암기</strong> <u>갈아 끼우기 전에 먼저 뽑는다</u>.</p><p>정비·교체의 대원칙은 <strong>에너지원을 먼저 끊는다</strong>는 것이다. 전기든 압축공기든 마찬가지다. 이것이 <strong>LOTO(잠금·표찰)</strong>의 뿌리다.</p>", "nq": 1}, "card_mac_t038": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "공기압축기의 작업 시작 전 점검", "front": "공기압축기의 작업 시작 전 점검은?", "back": "분해하기 전에는 <strong>내부의 압축공기를 완전히 빼내야</strong> 한다. 남은 압력으로 부품이 튀어 나가면 치명적이다.<p><strong>◈ 암기</strong> <u>압력을 먼저 빼고 연다</u>.</p><p>압축공기는 <strong>보이지 않는 에너지</strong>다. 정비 전 <strong>잔압 제거</strong>는 압력용기 작업의 첫 단계다.</p><p><em>근거 — 안전보건규칙 제35조 별표3</em></p>", "nq": 1}, "card_mac_t005": {"kind": "단답형", "fq": 3, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "기계설비의 위험점", "front": "기계설비의 위험점은?", "back": "<ul><li><strong>절단점</strong>은 <strong>회전하는 운동부 자체</strong> 또는 그 회전하는 기계 부분의 <strong>돌출부</strong>에서 생긴다. 다른 물체와 짝을 이루지 않고 <strong>단독으로</strong> 위험을 만든다는 점이 갈림길이다. 밀링 커터, 둥근톱 날, 벨트의 이음 부분이 그 예다.</li><li><strong>접선물림점</strong>이다. 회전체와 거기에 걸린 벨트·체인이 만나는 <strong>접선 방향</strong>으로 딸려 들어간다.</li><li><strong>끼임점(Shear point)</strong>이다. <strong>도는 것과 고정된 것 사이</strong>에서 생긴다.</li></ul><p><strong>◈ 암기</strong> <u>절단점만 짝이 없다</u>. · <u>벨트와 풀리, 체인과 스프로킷이면 접선물림</u>.</p><p>위험점 여섯 가지. <u>협착점(왕복 + 고정) · 끼임점(회전 + 고정) · 절단점(회전체 단독) · 물림점(회전 + 회전) · 접선물림점(회전체의 접선, 벨트와 풀리) · 회전말림점(회전축에 감김)</u>. <u>「무엇과 무엇 사이인가」</u>로 갈리며, 절단점만 짝이 없다.<br><strong>협착(왕복+고정) · 끼임(회전+고정) · 절단(회전체 단독) · 물림(회전+회전) · 접선물림(회전체의 접선) · 회전말림(축에 감김)</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">기계설비의 위험점 여섯 가지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">위험점</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇과 무엇 사이</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>협착점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>왕복운동 + 고정부</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">프레스 슬라이드 · 성형기</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>끼임점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>회전 + 고정부</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">연삭숫돌과 작업대 · 교반날개와 몸체</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>절단점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>회전체 자체의 운동</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">밀링 커터 · 목공 대패날</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle; 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 별표3</em></p>", "nq": 7}, "card_ele_t036": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "기계기구 외함 접지의 생략", "front": "기계기구 외함 접지의 생략은?", "back": "<ul><li>생략하려면 누전차단기가 <strong>정격감도전류 30 [mA] 이하, 동작시간 0.03초 이하</strong> 여야 한다. <strong>40 [mA] · 2초</strong>는 둘 다 기준을 넘으므로 <strong>접지를 해야 한다</strong>.</li><li>생략할 수 있는 것은 <strong>교류 대지전압 150 [V] 이하</strong>를 건조한 곳에 시설하는 경우다. <strong>300 [V]</strong>는 기준을 크게 넘는다.</li></ul><p><strong>◈ 암기</strong> <u>30 [mA] · 0.03초</u>라야 생략 — 40 [mA] · 2초는 안 된다. · <u>교류는 150 [V] 이하라야 생략</u>.</p><p>30 [mA] · 0.03초는 <strong>심실세동을 일으키지 않는 한계</strong>다. 이 값을 넘는 차단기는 접지를 대신할 수 없다.<br><strong>150 [V]</strong>라는 숫자가 두 곳에 나온다 — <strong>접지 대상의 기준</strong>과 <strong>접지 생략의 기준</strong>. 둘 다 대지전압 기준이며, <strong>교류 150 [V] / 직류 300 [V]</strong>로 다르다.</p><div style=\"margin:12px 0 2px;font-weight:700\">외함 접지를 생략할 수 있는 경우</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">경우</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>교류 대지전압 150 [V] 이하 · 직류 300 [V] 이하</u>를 건조한 곳에</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>300 [V] 교류가 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>저압용 기계기구를 건조한 목재의 마루 위에서 취급</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">사람이 대지와 끊겨 있다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>외함 주위에 절연대를 설치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">사람이 대지와 끊겨 있다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2중 절연구조의 기계기구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">절연이 두 겹</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>비접지식 전로에 절연변압기(2차 300 [V] 이하)를 써서 공급</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">대지로 흐르는 길이 없다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정격감도전류 30 [mA] 이하 · 동작시간 0.03초 이하</u>의 누전차단기 설치</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">차단기가 대신한다</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t037": {"kind": "단답형", "fq": 3, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "누전차단기(ELB)의 구성", "front": "누전차단기(ELB)의 구성은?", "back": "<strong>전력퓨즈</strong>는 단락·과전류를 끊는 별개의 보호기기다. 누전차단기 안에 들어 있지 않다.<p><strong>◈ 암기</strong> <u>ZCT · 검출부 · 차단장치</u> — 퓨즈는 별개.</p><p>원리는 <strong>들어간 전류와 나온 전류가 같아야 한다</strong>는 것이다. 차이가 나면 그만큼 어딘가로 새고 있다는 뜻이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">누전차단기의 구성</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구성요소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 하나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>영상변류기(ZCT)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>들어간 전류와 나온 전류의 차</u>를 잡아낸다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">누설전류를 감지</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>누전검출부</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기준을 넘으면 신호</u>를 낸다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">증폭·판정</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>차단장치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>회로를 끊는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">개폐기구</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>시험버튼</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>잘 도는지 확인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>한 달에 한 번</u> 눌러 본다</td></tr></tbody></table></div>", "nq": 1}, "card_ele_t038": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "교류 아크 용접기의 자동전격방지장치", "front": "교류 아크 용접기의 자동전격방지장치는?", "back": "<ul><li><strong>25 [V] 이하</strong>로 떨어뜨린다. 용접하지 않는 동안 홀더에 걸린 <strong>무부하 전압 60~95 [V]</strong>가 그대로 남아 있으면 감전 위험이 크기 때문이다.</li><li>거꾸로다. <strong>용접할 때는 주회로를 닫고(ON), 용접하지 않을 때 연다(OFF)</strong>. 아크가 끊긴 뒤 <strong>1초 이내에 25 [V] 이하</strong>로 떨어뜨린다.</li><li>접점방식(Magnet식)은 <strong>지동시간 1 ± 0.3초, 무부하전압 25 [V] 이하</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>1초 안에 25 [V] 아래로</u>. · <u>쉴 때 끊고, 용접할 때 붙인다</u>.</p><p><strong>1초 이내, 25 [V] 이하</strong> 두 숫자가 함께 나온다. 습윤한 장소나 철골 위처럼 위험한 곳에서는 <strong>반드시 설치</strong>해야 한다.<br>교류 아크 용접기의 무부하 전압은 <strong>60~95 [V]</strong>로 감전 위험이 크다. 그래서 <strong>쉬는 동안만 전압을 낮춰 두었다가, 용접봉이 모재에 닿는 순간 정상 전압을 공급</strong>한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">자동전격방지장치의 방식별 성능</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">지동시간</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무부하전압</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접점방식(Magnet식)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 ± 0.3초</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>25 [V] 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무접점방식(SCR·TRIAC식)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 ± 0.3초</u> 또는 <u>1.5 ± 0.06초</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>25 [V] 이하</u> (30 [V] 이하인 것도)</td></tr></tbody></table></div>", "nq": 3}, "card_ele_t039": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "전기 기계·기구 등의 충전부 방호", "front": "전기 기계·기구 등의 충전부 방호는?", "back": "<ul><li>충전부는 <strong>출입이 어려운 곳</strong>에 두어야 한다. <strong>드나들기 쉬운 트인 곳</strong>에 두고 표지만 붙이는 것은 방호가 아니다.</li><li><strong>관계자 외에도 쉽게 드나들 수 있는 곳</strong>에 충전부를 두는 것은 감전 위험을 키운다. 조문은 <strong>충전부를 관계자 외 출입금지 장소에 설치</strong>하도록 한다.</li></ul><p><strong>◈ 암기</strong> <u>숨기고 덮는다</u> — 드러내고 표지만 붙이지 않는다. · <u>덮거나 멀리 두거나</u>.</p><p>다섯 가지 방법 — <strong>절연물로 감싼다 · 폐쇄형 외함 · 방호망이나 절연 덮개 · 대지전압 30 [V] 이하의 충전부 · 출입이 어려운 곳에 두고 위험표시</strong>. <strong>「출입이 용이한」이 아니라 「어려운」</strong>이다.<br>대책은 두 갈래다 — <strong>덮거나(외함·방호망·절연물) 멀리 두거나(출입금지 장소·전주 위)</strong>. 보기 ④는 <strong>두 갈래 어디에도 들지 않고 오히려 반대</strong>다.</p><div style=\"margin:12px 0 2px;font-weight:700\">직접 접촉에 의한 감전방지 (규칙 제301조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>충전부가 노출되지 않도록 폐쇄형 외함구조로 할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>충전부에 충분한 절연효과가 있는 방호망이나 절연덮개를 설치할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>충전부는 내구성이 있는 절연물로 완전히 덮어 감쌀 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>발전소·변전소 등 관계자 외 출입금지 장소에 설치할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「출입이 가능한」이 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전주 위·철탑 위 등 사람이 접촉할 우려가 없는 곳에 설치할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제301조</em></p>", "nq": 2}, "card_ele_t040": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "안전전압", "front": "안전전압은?", "back": "우리나라의 안전전압은 <strong>30 [V]</strong>다. 나라마다 다른데, 우리 기준으로는 이 값이다.<p><strong>◈ 암기</strong> <u>우리나라는 30 [V]</u>.</p><p><strong>안전전압은 「이 아래면 감전되어도 위험하지 않다」는 값</strong>이다. 다만 <strong>물기가 있으면 이 값도 안전하지 않다</strong>. 인체 저항이 급격히 떨어지기 때문이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">나라별 안전전압</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">나라</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">안전전압</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>우리나라</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>30 [V]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">산업안전보건법 기준</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>독일</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">24 [V]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>영국</u></td><td style=\"border:1px sol 스 / 따로 접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1선 지락에도 계속 운전</u> — 병원·화학공장</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t019": {"kind": "단답형", "fq": 3, "subject": "전기위험방지기술", "chapter": "정전기", "mid": "정전기 발생에 영향을 주는 요인", "front": "정전기 발생에 영향을 주는 요인은?", "back": "<ul><li>방향이 거꾸로다. <strong>분리속도가 빠를수록 발생량이 많아진다</strong>. 빨리 떼어 낼수록 전하가 제자리로 되돌아갈 겨를이 없어 그대로 갈라지기 때문이다.</li><li>다섯 요인에 <strong>접촉시간</strong>은 없다. 있는 것은 <strong>접촉 면적과 압력</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>처음 접촉 때가 가장 크고, 나머지는 다 「클수록 많다」</u>. · <u>특성 · 표면 · 이력 · 면적과 압력 · 분리속도</u> — 시간은 없다.</p><p>정전기 발생의 5요인. <u>물체의 특성(대전서열이 멀수록 많다) · 표면 상태(거칠거나 오염되면 많다) · 대전 이력(처음이 가장 크다) · 접촉 면적과 압력(클수록 많다) · 분리속도(빠를수록 많다)</u>. 「<u>처음 하나만 줄어드는 쪽이고 나머지는 다 늘어나는 쪽</u>」으로 가른다.<br>다섯 가운데 <strong>이력만 「처음이 가장 크다」</strong>로 방향이 다르고, 나머지는 모두 <strong>클수록·빠를수록 많이 생긴다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">정전기 발생의 다섯 요인</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">요인</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">어떻게 영향을 주나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물체의 특성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>대전열에서 멀수록</u> 크다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물체의 표면상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>거칠거나 오염될수록</u> 크다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물체의 이력</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>처음 접촉할 때 가장 크다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">되풀이하면 줄어든다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접촉 면적과 압력</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>넓고 셀수록</u> 크다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시간이 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>분리 속도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>빠를수록</u> 크다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t054": {"kind": "공식형", "fq": 2, "subject": "전기위험방지기술", "chapter": "정전기", "mid": "도체구의 전위", "front": "도체구의 전위의 식은?", "back": "<ul><li>도체구의 전위는 $V = \\dfrac{1}{4 \\pi \\varepsilon_{0}} \\times \\dfrac{Q}{r} = 9 \\times 10^{9} \\times \\dfrac{Q}{r}$다. $9 \\times 10^{9} \\times 2 \\times 10^{-7} / 0.25 = 1 {,} 800 / 0.25 = 7 {,} 200$ [V] = <strong>7.2 [kV]</strong>다.</li><li>$V = 9 \\times 10^{9} \\times \\dfrac{Q}{r}$다. $r = 6 {,} 367 \\times 10^{3}$ [m]이므로 $V = 9 \\times 10^{9} \\times 1 / ( 6.367 \\times 10^{6} ) \\fallingdotseq 1 {,} 414$ [V]다.</li><li>$V = \\dfrac{1}{4 \\pi \\varepsilon_{0}} \\times \\dfrac{Q}{r} = 9 \\times 10^{9} \\times \\dfrac{2 \\times 10^{-7}}{0.25} = 7 {,} 200$ [V] = <strong>7.2 [kV]</strong>다.</li></ul><p><strong>◈ 암기</strong> $V = 9 \\times 10^{9} Q / r$ — <u>반지름은 미터로</u>. · $V = 9 \\times 10^{9} Q / r$.</p><p>$9 \\times 10^{9}$은 쿨롱 상수 $1 / 4 \\pi \\varepsilon_{0}$다. <strong>반지름을 [m]로 바꾸는 것</strong>이 실수하기 쉬운 자리다.<br>$V = \\dfrac{1}{4 \\pi \\varepsilon_{0}} \\times \\dfrac{Q}{r} = 9 \\times 10^{9} \\times \\dfrac{Q}{r}$다. <strong>반지름을 [m]로 바꾸는 것</strong>이 실수하기 쉬운 자리다 — 6,367 [km]는 $6.367 \\times 10^{6}$ [m]다.</p>", "nq": 3}, "card_chm_t038": {"kind": "단답형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "", "mid": "연소 생성물과 원소의 관계", "front": "연소 생성물과 원소의 관계는?", "back": "<strong>우레탄</strong>이다. 분자 안에 <strong>질소(N)</strong>가 들어 있어 탈 때 <strong>시안화수소(HCN)</strong>가 나온다. 건축 단열재로 널리 쓰여 실제 화재에서 사망 원인이 되는 일이 많다.<p><strong>◈ 암기</strong> <u>질소가 있으면 시안화수소</u>.</p><p>원소를 보면 무엇이 나올지 알 수 있다 — <strong>질소가 있으면 HCN·NOx</strong>, <strong>염소가 있으면 HCl</strong>, <strong>황이 있으면 SO₂</strong>다.</p>", "nq": 1}, "card_chm_t039": {"kind": "공식형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "", "mid": "메탄올(CH₃OH)의 성질", "front": "메탄올(CH₃OH)의 성질의 식은?", "back": "메탄올의 비중은 <strong>0.79로 1보다 작다</strong>. 증기비중은 <strong>1.11로 공기보다 무겁다</strong>. 두 군데가 다 거꾸로다.<p><strong>◈ 암기</strong> <u>액체는 가볍고, 증기는 무겁다</u>.</p><p><strong>액체의 비중은 물(1) 기준</strong>, <strong>증기비중은 공기(29) 기준</strong>이다. 메탄올의 분자량이 32이므로 $32 / 29 = 1.1$로 공기보다 무겁다. <strong>대부분의 유기용제 증기는 공기보다 무거워 바닥에 깔린다</strong>.</p>", "nq": 1}, "card_chm_t040": {"kind": "단답형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "인화점(flash point)", "front": "인화점(flash point)는?", "back": "인화점은 <strong>증기 농도가 연소하한(LFL)에 이르는 가장 낮은 액체 온도</strong>다. <strong>「하한」과 「가장 낮은」</strong> 두 낱말이 모두 맞아야 한다.<p><strong>◈ 암기</strong> <u>하한에 이르는 가장 낮은 온도</u>.</p><p>세 온도의 크기 순서는 <strong>인화점 &lt; 연소점 &lt; 발화점</strong>이다. 위험물 분류의 기준이 되는 것은 <strong>인화점</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인화점 · 연소점 · 발화점</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">용어</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">정의</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인화점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불씨를 대면 불이 붙는 가장 낮은 온도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">증기 농도가 <u>연소하한</u>에 이르는 온도</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>발화점(발화점)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불씨 없이 스스로 불이 붙는 최저 온도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">인화점보다 <u>훨씬 높다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>연소점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불이 붙어 계속 타는 최저 온도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">인화점보다 <u>5 ~ 10 [℃] 높다</u></td></tr></tbody></table></div>", "nq": 1}, "card_chm_t041": {"kind": "단답형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "소화의 방법", "front": "소화의 방법은?", "back": "<ul><li><strong>공기(산소)의 공급을 끊는 것</strong>이 질식소화다.</li><li><strong>냉각소화</strong>다. <strong>열을 빼앗아 발화점 아래로 온도를 끌어내린다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>열 · 산소 · 가연물 · 연쇄반응</u>을 하나씩 없앤다. · <u>열을 빼앗으면 냉각소화</u>.</p><p><strong>냉각·질식·제거는 물리적 소화</strong>, <strong>억제만 화학적 소화</strong>다. 연소의 4요소(가연물·산소·점화원·연쇄반응)에서 하나씩 떼어 내는 것이 각 방법이다.<br><strong>연소의 4요소(가연물 · 산소 · 점화원 · 연쇄반응)</strong>를 하나씩 없애는 것이 네 소화법이다 — <strong>「열에너지를 흡수」</strong>라는 말이 곧 점화원을 없애는 냉각소화다.</p><div style=\"margin:12px 0 2px;font-weight:700\">소화의 네 가지 방법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 없애나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>냉각소화</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>열</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>물</u>을 뿌려 온도를 낮춘다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>질식소화</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>산소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>포 · 이산화탄소 · 분말</u>로 덮는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제거소화</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가연물</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>밸브를 잠근다</u> · 산림의 나무를 벤다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>억제소화</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>연쇄반응</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>할론 · 분말</u> — 화학적 소화</td></tr></tbody></table></div>", "nq": 2}, "card_chm_t042": {"kind": "단답형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "분진폭발을 일으키는 물질", "front": "분진폭발을 일으키는 물질은?", "back": "<strong>마그네슘</strong>이다. 금속 가루는 대표적인 분진폭발 물질이다. 나머지는 애초에 <strong>가루가 되어 탈 수 없는</strong> 것들이다.<p><strong>◈ 암기</strong> <u>금속 가루 · 곡물 가루 · 석탄 가루</u>가 대표.</p><p>분진폭발이 일어나려면 다섯 조건이 갖춰져야 한다 — <strong>가연성 분진 · 미분 상태 · 공기 중 부유 · 폭발범위 안의 농도 · 점화원</strong>. <strong>이미 산화된 것(산화칼슘)과 기체(염소·에틸렌)</strong>는 애초에 첫 조건에 걸린다.</p>", "nq": 1}, "card_chm_t043": {"kind": "단답형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "폭발범위(폭발범위)에 영향을 주는 인자", "front": "폭발범위(폭발범위)에 영향을 주는 인자는?", "back": "압력이 오르면 <strong>상한계는 크게 올라가지만 하한계는 거의 변하지 않는다</strong>. 「둘 다 뚜렷이 오른다」는 틀렸다.<p><strong>◈ 암기</strong> <u>압력은 상한만 올린다</u>.</p><p>한 줄로 새기면 <strong>태우기 좋은 조건일수록 넓어진다</strong>이다. 다만 <strong>압력과 산소는 상한만 크게 밀어 올린다</strong>는 점이 다르다.</p><div style=\"margin:12px 0 2px;font-weight:700\">폭발범위를 넓히는 것과 좁히는 것</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇이 바뀌면</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">폭발범위</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>온도 상승</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle 2px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">계단참 간격</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>수직갱에 가설된 통로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">길이 <u>15 [m] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>10 [m] 이내마다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>건설공사용 비계다리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">높이 <u>8 [m] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>7 [m] 이내마다</u></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제23조</em></p>", "nq": 8}, "card_con_t040": {"kind": "공식형", "fq": 3, "subject": "건설안전기술", "chapter": "가시설물", "mid": "안전계수(안전율)", "front": "안전계수(안전율)의 식은?", "back": "$\\text{허용응력} = \\text{인장강도} \\div \\text{안전계수} = 2 {,} 000 / 4 = 500$ [MPa]이다.<p><strong>◈ 암기</strong> <u>강도를 안전계수로 나눈다</u>.</p><p>$S = \\dfrac{\\text{극한강도}}{\\text{허용응력}}$이므로 <strong>안전계수가 클수록 허용응력은 작아진다</strong>. 더 여유 있게 쓰겠다는 뜻이다.</p>", "nq": 1}, "card_con_t041": {"kind": "단답형", "fq": 3, "subject": "건설안전기술", "chapter": "가시설물", "mid": "터널 지보공의 조립·변경", "front": "터널 지보공의 조립·변경은?", "back": "긴압 정도는 <strong>고르게</strong> 해야 한다. <strong>차이가 나면 힘이 한쪽에 몰려</strong> 그 부재부터 무너진다.<p><strong>◈ 암기</strong> <u>긴압은 고르게</u>.</p><p><strong>힘을 고르게 나눈다</strong>가 지보공의 대원칙이다. 「최대한 차이나도록」처럼 <strong>원칙과 반대되는 말</strong>이 보이면 그것이 답이다.</p><p><em>근거 — 안전보건규칙 제364조</em></p>", "nq": 1}, "card_con_t042": {"kind": "단답형", "fq": 2, "subject": "건설안전기술", "chapter": "건설공구·장비", "mid": "차량계 건설기계 작업계획서", "front": "차량계 건설기계 작업계획서는?", "back": "작업계획서에 들어가는 것은 <strong>종류와 성능 · 운행경로 · 작업방법</strong> 셋뿐이다. <strong>유지보수방법</strong>은 들어가지 않는다.<p><strong>◈ 암기</strong> <u>종류와 성능 · 운행경로 · 작업방법</u> 셋.</p><p>작업계획서는 <strong>그 작업을 어떻게 안전하게 할 것인가</strong>를 적는 문서다. 정비는 작업이 끝난 뒤의 일이라 들어가지 않는다.</p><p><em>근거 — 안전보건규칙 제38조 별표4</em></p>", "nq": 1}, "card_con_t043": {"kind": "단답형", "fq": 1, "subject": "건설안전기술", "chapter": "건설공사 안전개요", "mid": "액상화(liquefaction)", "front": "액상화(liquefaction)은?", "back": "액상화는 <strong>지하수위가 높아 흙 속 물의 압력이 오를 때</strong> 생긴다. <strong>웰포인트 공법으로 지하수위를 직접 내리는 것</strong>이 가장 곧바로 듣는 대책이다.<p><strong>◈ 암기</strong> <u>물이 문제면 물을 뺀다</u> — 웰포인트.</p><p>느슨한 <strong>포화 사질토</strong>에 진동이 가해지면 <strong>간극수압이 급격히 올라 유효응력이 0이 되어</strong> 흙이 액체처럼 흐른다. 대책은 두 갈래 — <strong>물을 빼거나(웰포인트·배수) 흙을 조이거나(동다짐·다짐말뚝)</strong>.</p>", "nq": 1}, "card_con_t009": {"kind": "공식형", "fq": 3, "subject": "건설안전기술", "chapter": "건설공사 안전개요", "mid": "산업안전보건관리비 계상 및 사용기준 고시", "front": "산업안전보건관리비 계상 및 사용기준 고시의 식은?", "back": "<ul><li><strong>혹한·혹서에 오래 노출되어 건강장해가 우려되는 특정 근로자</strong>에게 주는 기능성 보호장구는 쓸 수 있다. 「특정 위험에 노출된 특정 근로자를 지키기 위한 것」이라는 점이 갈림길이다.</li><li><strong>근로자 재해예방 목적으로만 쓰는 CCTV</strong>는 안전시설비로 쓸 수 있다. 「그 목적으로만」이라는 단서가 갈림길이다.</li><li><strong>총 공사금액의 70 [%]</strong>를 대상액으로 본다.</li></ul><p><strong>◈ 암기</strong> <u>일률 지급 · 복리후생 · 일반 업무용 · 외부인용</u>이면 못 쓴다. · <u>「~만」이 붙으면 쓸 수 있다</u>.</p><p>판단 기준은 하나 — 「<strong>그 현장 근로자의 안전·보건을 위해 특정하게 쓰이는가</strong>」.<br>판단 기준은 하나 — 「<strong>그 현장 근로자의 안전·보건을 위해서만 쓰이는가</strong>」. 공사에 필요한 것, 민원용, 기계에 딸린 것은 쓸 수 없다.</p><div style=\"margin:12px 0 2px;font-weight:700\">공사 진척에 따른 산업안전보건관리비 사용기준</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">공정률</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">최소 사용기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td s ody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>0 ~ 4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>매우 느슨</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">액상화 위험</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4 ~ 10</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>느슨</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">이 문항의 답</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>10 ~ 30</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">보통</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">조밀한 편</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>30 ~ 50</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">조밀</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>50 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>매우 조밀</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_con_t047": {"kind": "단답형", "fq": 2, "subject": "건설안전기술", "chapter": "건설재해 대책", "mid": "추락의 방지", "front": "추락의 방지는?", "back": "<ul><li><strong>추락방호망</strong>이다. 작업발판을 놓기 어려운 곳에서 <strong>떨어지는 사람을 받아 낸다</strong>.</li><li><strong>추락방호망</strong>이다. 난간을 둘 수 없을 때 <strong>떨어지는 사람을 받아 낸다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>발판 → 방호망 → 안전대</u>.</p><p>순서가 있다 — <strong>작업발판을 먼저 설치하고, 그것이 어려우면 추락방호망을, 그것도 어려우면 안전대를</strong> 쓴다. 추락방호망은 두 번째 선택이다.<br>순서가 정해져 있다 — <strong>작업발판을 먼저, 어려우면 추락방호망을, 그것도 어려우면 안전대를</strong> 쓴다. 추락방호망도 설치하기 어려우면 <strong>안전대 착용 등 추락위험 방지조치</strong>를 한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">추락방호망의 설치 기준</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">설치 높이</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">작업면에서 <u>10 [m]를 초과하지 않게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">가까울수록 좋다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">수평면과의 각도</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>20° ~ 30°</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">내민 길이</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">벽면에서 <u>3 [m] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 1 <script>

 return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+':'+String(x).padStart(2,'0');}

 let h=`<div class="wrap"><div class="qh"><span class="qno">${String(q.n).padStart(3,'0')}</span>
  <span class="tag" style="background:${LV[q.lv][0]}">난이도 ${q.lv}·${LV[q.lv][1]}</span>
  <span class="tag" style="background:#6366f1">${q.kind}</span>
  <span class="tag" style="background:#f59e0b">빈출 ${'★'.repeat(q.fq)+'☆'.repeat(3-q.fq)}</span>
  <span class="subj">제${q.s}과목 ${D.subj[q.s-1]}</span>`;
 if(show){
   h+=`<span class="acts">
    <button class="mini${solOpen(q)?' on':''}" id="tsol">📖 해설 ${solOpen(q)?'닫기':'보기'}</button>
    ${q.card&&D.cards[q.card]?'<button class="mini cd" id="tcard">🃏 암기카드</button>':''}
   </span>`;
 }
 h+=`</div><div class="stem">${q.t}</div>`;
 if(q.cond)h+=`<div class="cond">${q.cond}</div>`;
 if(q.img)h+=`<img class="stemimg" src="img/${q.img}">`;
 for(let k=0;k<4;k++){
   let cls='opt';
   if(a===k+1)cls+=' sel';
   if(graded){ if(k+1===q.a)cls='opt right'; else if(a===k+1)cls='opt wrong'; }
   h+=`<button class="${cls}" data-k="${k+1}"><span class="n">${MARK[k]}</span><span>${q.c[k]}</span></button>`;
 }
 if(graded){
   h+= a===q.a ? `<div class="vline o">정답입니다 · 정답 ${q.a}번</div>`
              : `<div class="vline x">${a?'틀렸습니다 · 고른 답 '+a+'번 · ':'미응답 · '}정답 ${q.a}번</div>`;
 }
 if(show&&solOpen(q)){
   h+=`<div class="sol"><div class="lbl">해설</div><div>${q.sol}</div>`;
   if(q.w)h+=`<div class="lbl">오답 분석</div><div>${q.w}</div>`;
   if(q.pt)h+=`<div class="lbl g">관련 개념 · 암기</div><div class="box">${q.pt}</div>`;
   if(q.law)h+=q.law;
   h+=`</div>`;
 }
 return h+'</div>';
}

function render(){
 if(!S.started){intro();return;}
 if(!STUDY&&S.done&&S.i<0){result();return;}
 const q=D.q[S.i];
 $('#app').innerHTML=qHTML(q);
 $$('.opt').forEach(b=>b.onclick=()=>{
   S.ans[q.n]=+b.dataset.k;
   if(STUDY&&S.open[q.n]===undefined)S.open[q.n]=true;
   save();
   if(STUDY||S.done){render();}
   else{$$('.opt').forEach(x=>x.classList.toggle('sel',x===b));paint();}
 });
 const ts=$('#tsol'); if(ts)ts.onclick=()=>{S.open[q.n]=!solOpen(q);save();render();};
 const tc=$('#tcard'); if(tc)tc.onclick=()=>openCard(q.card);
 kx($('#app'));
 stat();
 $('#prev').disabled=S.i===0; $('#next').disabled=S.i===119;
 paint();
 window.scrollTo(0,0);
}

function stat(){
 const n=Object.keys(S.ans).length;
 if(STUDY){
   let ok=0; D.q.forEach(q=>{if(S.ans[q.n]===q.a)ok++;});
   $('#prog').innerHTML=`<b>${S.i+1}</b> / 120 · 푼 문항 <b>${n}</b> · 맞힘 <b>${ok}</b>`;
   const r=$('#rate');
   if(r)r.textContent=n?`정답률 ${Math.round(ok/n*100)}%`:'정답률 —';
 }else{
   $('#prog').innerHTML=S.done?`채점 완료`:`<b>${S.i+1}</b> / 120 · 푸는 중 <b>${n}</b>`;
 }
}

/* 암기카드 팝업 */
let mflip=false;
function openCard(id){
 const c=D.cards[id]; if(!c)return;
 mflip=false;
 $('#mbody').innerHTML=`<button class="mx" id="mx">✕</button>
  <div class="mcard" id="mcard">
   <div class="mface">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span class="stars">${'★'.repeat(c.fq)+'☆'.repeat(3-c.fq)}</span>
     <span>${c.subject}${c.chapter?' · '+c.chapter:''}</span>
     <span class="mcid">${id}</span></div>
    <div class="mq">${c.front}</div>
    <div class="mhint">카드를 누르면 뒤집힙니다 · Esc 닫기</div>
   </div>
   <div class="mface back">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span>${c.mid}</span><span class="mcid">${id}</span></div>
    <div class="ma">${c.back}</div>
    <div class="mfoot"><span>이 개념을 묻는 문항 ${c.nq}개</span>
     <a href="../_암기카드.html#${id}" target="_blank">카드 전체 보기 →</a></div>
   </div>
  </div>`;
 $('#modal').classList.add('on');
 kx($('#mbody'));
 fitCard(); setTimeout(fitCard,260);
 $('#mcard').onclick=()=>{mflip=!mflip;$('#mcard').classList.toggle('flip',mflip);};
 $('#mx').onclick=e=>{e.stopPropagation();closeCard();};
}
function fitCard(){
 const mc=$('#mcard'); if(!mc)return;
 mc.style.height='120px';
 const h=Math.max(...[...mc.querySelectorAll('.mface')].map(f=>f.scrollHeight));
 mc.style.height=Math.min(window.innerHeight*0.78,Math.max(300,h+4))+'px';
}
function closeCard(){$('#modal').classList.remove('on');}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeCard();};
window.addEventListener('resize',()=>{if($('#modal').classList.contains('on'))fitCard();});

function paint(){
 $$('.pg').forEach(b=>{
   const n=+b.dataset.n, q=D.q[n-1];
   const marked=STUDY?!!S.ans[n]:S.done;
   let c='pg';
   if(marked&&(STUDY||S.done))c+=(S.ans[n]===q.a?' ok':' no');
   else if(S.ans[n])c+=' done';
   if(n-1===S.i)c+=' cur';
   b.className=c;
 });
}

function submit(){
 if(STUDY||S.done)return;
 const un=120-Object.keys(S.ans).length;
 if(un>0&&!confirm('안 푼 문제가 '+un+'개 있습니다. 제출할까요?'))return;
 S.done=true;clearInterval(tick);save();S.i=-1;result();
}

function result(){
 const per=[0,0,0,0,0,0],tot=[0,0,0,0,0,0];
 let right=0;
 D.q.forEach(q=>{tot[q.s-1]++;if(S.ans[q.n]===q.a){per[q.s-1]++;right++;}});
 const scores=per.map((v,i)=>Math.round(v/tot[i]*100));
 const avg=Math.round(right/120*100);
 const pass=avg>=60&&scores.every(s=>s>=40);
 let h=`<div class="result"><div style="text-align:center;color:#64748b;font-size:13px">${D.title} · 채점 결과</div>
  <div class="score">${avg}<span style="font-size:20px;color:#94a3b8">점</span></div>
  <div style="text-align:center;color:#64748b;font-size:14px">120문항 중 <b>${right}</b>문항 정답 · 소요 ${fmt(S.elapsed)}</div>
  <div class="verdict ${pass?'pass':'fail'}">${pass?'합격':'불합격'}</div>
  <table class="stab"><tr><th>과목</th><th>맞힌 문항</th><th>점수</th></tr>`;
 for(let i=0;i<6;i++){
   h+=`<tr><td style="text-align:left">제${i+1}과목 ${D.subj[i]}</td>
    <td>${per[i]} / ${tot[i]}</td><td class="${scores[i]<40?'bad':''}">${scores[i]}</td></tr>`;
 }
 h+=`</table><div style="font-size:12.5px;color:#64748b;text-align:center">합격 — 과목당 40점 이상, 평균 60점 이상</div>
  <div class="rowbtns">
   <button class="nbtn pri" id="rw">틀린 문제만 다시 보기</button>
   <button class="nbtn" id="rall">전체 해설 보기</button>
   <button class="nbtn" id="rst">다시 풀기</button>
  </div></div>`;
 $('#app').innerHTML=h;
 paint(); stat();
 $('#rw').onclick=()=>{const bad=D.q.findIndex(q=>S.ans[q.n]!==q.a);S.i=bad<0?0:bad;render();};
 $('#rall').onclick=()=>{S.i=0;render();};
 $('#rst').onclick=()=>{if(confirm('답안을 지우고 처음부터 다시 풀까요?')){
   S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();startTimer();}};
}

function build(){
 let p='';
 for(let s=1;s<=6;s++){
   p+=`<div class="palhd">제${s}과목 ${D.subj[s-1]}</div><div class="palgrid">`;
   D.q.filter(q=>q.s===s).forEach(q=>{p+=`<button class="pg" data-n="${q.n}">${q.n}</button>`;});
   p+='</div>';
 }
 $('#pal').innerHTML=p;
 $$('.pg').forEach(b=>b.onclick=()=>{S.i=+b.dataset.n-1;save();render();$('#pal').classList.remove('open');});
}

$('#prev').onclick=()=>{if(S.i>0){S.i--;save();render();}};
$('#next').onclick=()=>{if(S.i<119){S.i++;save();render();}};
$('#palbtn').onclick=()=>$('#pal').classList.toggle('open');
const sb=$('#sub'); if(sb)sb.onclick=submit;
const rs=$('#reset'); if(rs)rs.onclick=()=>{if(confirm('푼 기록을 모두 지울까요?')){
 S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();}};
document.addEventListener('keydown',e=>{
 if($('#modal').classList.contains('on')){
   if(e.key==='Escape')closeCard();
   if(e.key===' '){e.preventDefault();$('#mcard').click();}
   return;
 }
 if(e.key==='ArrowLeft')$('#prev').click();
 if(e.key==='ArrowRight')$('#next').click();
 if('1234'.includes(e.key)){const b=$$('.opt')[+e.key-1];if(b)b.click();}
 if(e.key==='s'||e.key==='S'){const t=$('#tsol');if(t)t.click();}
 if(e.key==='c'||e.key==='C'){const t=$('#tcard');if(t)t.click();}
});
build();
const hm=location.hash.match(/^#q(\d+)/);
if(hm){S.started=1;S.i=Math.max(0,Math.min(119,+hm[1]-1));save();}
if(!STUDY&&S.done){if(hm){render();}else{S.i=-1;result();}}
else{render();if(S.started)startTimer();}
</script>
</body></html>
