:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">어긋난 보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>적절성(타당성)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>재려는 것을 실제로 재는가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">엉뚱한 것을 잰다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무오염성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>재려는 것 말고 다른 것이 섞이지 않았는가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">다른 변수가 끼어든다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기준척도의 신뢰성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>되풀이해도 같은 값이 나오는가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">잴 때마다 달라진다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>민감도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>차이를 가려낼 만큼 예민한가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">다 똑같이 나온다</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t069": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "인간의 정보처리 과정", "front": "인간의 정보처리 과정은?", "back": "3단계는 <strong>인식 및 감지 → 인지 및 정보처리 → 행동</strong>이다. <strong>반응단계</strong>라는 이름은 여기 없다.<p><strong>◈ 암기</strong> <u>감지 → 정보처리 → 행동</u>.</p><p><strong>착오의 세 과정(인지 · 판단 · 조치)</strong>과 나란히 놓인다. 감지에서 어긋나면 인지과정 착오, 판단에서 어긋나면 판단과정 착오, 행동에서 어긋나면 조치과정 착오다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인간의 정보처리 3단계</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대응하는 오류</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>① 인식 및 감지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>자극을 받아들인다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>인지과정의 착오</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>② 인지 및 정보처리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>헤아리고 판단한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>판단과정의 착오</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>③ 행동</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>몸을 움직인다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>조치과정의 착오</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t036": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "화학설비의 안전성 평가", "front": "화학설비의 안전성 평가는?", "back": "<ul><li><strong>취급물질</strong>은 <strong>정량적 평가</strong>의 항목이다. 양을 재어 점수를 매기기 때문이다.</li><li>정량적 평가 항목은 <strong>취급물질 · 화학설비의 용량 · 온도 · 압력 · 조작</strong> 다섯이다. <strong>훈련</strong>은 여기 없다.</li><li><strong>공정</strong>은 <strong>정성적 평가</strong> 항목이다. 정량적 평가는 <strong>취급물질 · 용량 · 온도 · 압력 · 조작</strong> 다섯이다.</li></ul><p><strong>◈ 암기</strong> 정량적 평가 다섯은 「<u>물 · 용 · 온 · 압 · 조</u>」. · <u>물 · 용 · 온 · 압 · 조</u>.</p><p>6단계는 <strong>관계 자료의 정비 → 정성적 평가 → 정량적 평가 → 안전대책 → 재해정보에 의한 재평가 → FTA에 의한 재평가</strong>다.<br>정량적 평가 다섯 항목은 <strong>물질 · 용량 · 온도 · 압력 · 조작</strong>이다. <strong>모두 숫자로 잴 수 있는 것</strong> 들이라 정량적이다. 훈련은 숫자로 재기 어렵다.</p><div style=\"margin:12px 0 2px;font-weight:700\">화학설비 안전성 평가의 항목</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">성격</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정성적 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">입지 조건 · 공장 내 배치 · 건조물 · 소방설비</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">있는가 없는가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정성적 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">원재료 · 중간재 · 제품 · 공정 · 수송과 저장</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">절차가 갖춰졌는가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정량적 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>취급물질</u> · 용량 · 온도 · 압력 · 조작</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">점수를 매긴다</td></tr></tbody></table></div>", "nq": 8}, "card_erg_t070": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "욕조곡선(bathtub curve)", "front": "욕조곡선(bathtub curve)는?", "back": "<ul><li><strong>스크리닝(선별)</strong>은 <strong>초기고장</strong>을 걸러 내는 방법이다. 마모고장 대책이 아니다.</li><li><strong>우발고장기간은 고장률이 낮고 일정</strong>하다. 그래서 <strong>일정형(CFR)</strong>이라 부르며, 이 구간이 <strong>설비의 실제 사용 기간</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>걸러 내면 초기, 미리 갈면 마모</u>. · <u>감소 · 일정 · 증가</u>.</p><p><strong>초기고장 대책 셋(번인 · 디버깅 · 스크리닝)</strong>은 모두 <strong>쓰기 전에 불량품을 걸러 낸다</strong>는 한 가지다. <strong>마모고장 대책은 예방보전</strong> 하나뿐이라고 잡아 두면 된다.<br><strong>처음에는 떨어지고(불량품이 걸러져) · 가운데는 평평하고(우연한 고장만) · 끝에는 올라간다(닳아서)</strong>. 이 세 구간의 모양이 곧 이름의 유래다.</p><div style=\"margin:12px 0 2px;font-weight:700\">욕조곡선의 세 구간</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구간</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">고장률</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원인</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대책</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>초기고장</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>감소형(DFR)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">설계·제조 결함</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>번인 · 디버깅 · 스크리닝</u> — 미리 걸러 낸다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>우발고장</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>일정형(CFR)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">우연한 과부하</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>예비품 준비</u> · 안전계수 확보</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>마모고장</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>증가형(IFR)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">마모·피로·노화</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>예방보전(PM)</u> · 정기 교체</td></tr></tbody></table></div>", "nq": 2}, "card_erg_t071": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "MORT(Management Oversight and Risk Tree)", "front": "MORT(Management Oversight and Risk Tree)는?", "back": "<strong>MORT(Management Oversight and Risk Tree)</strong>다. <strong>이미 안전한 곳에서 한 단계 더</strong> 끌어올리려고 만든 기법이다.<p><strong>◈ 암기</strong> <u>원자력이면 MORT, 사람이면 THERP</u>.</p><p><strong>「원자력」·「관리까지 폭넓게」</strong> 두 낱말이 나오면 MORT다. <strong>「인간 과오율」이 나오면 THERP</strong>다. 이 두 짝만 잡으면 이 유형은 풀린다.</p><div style=\"margin:12px 0 2px;font-weight:700\">주요 분석기법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">특징</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>MORT</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">관리 감독과 위험 트리</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>원자력</u> · <u>관리·설계·생산·보전까지 폭넓게</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>THERP</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">인간 과오율 예측기법</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>인간 신뢰도</u>를 정량적으로</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>FTA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">결함수 분석</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">결과에서 원인으로 — <u>연역적·정량적</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>DT</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">의사결정 나무</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">확률이 붙은 논리 전개도</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t010": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "직렬·병렬 신뢰도", "front": "직렬·병렬 신뢰도의 식은?", "back": "<ul><li>타이어는 <strong>하나만 터져도 차가 못 간다</strong>므로 <strong>직렬</strong>이다. 하나의 신뢰도가 $1 - 0.01 = 0.99$이고 넷이 직렬이므로 $0.99^{4} \\fallingdotseq 0.96$이다.</li><li>직렬은 곱한다. $0.6 \\times 0.9 = 0.54$다.</li><li>가운데 세 갈래를 먼저 묶는다. 위·아래 갈래는 직렬이라 $0.8 \\times 0.8 = 0.64$이고 가운데는 0.90이다. 병렬이므로 $1 - ( 1 - 0.64 ) ( 1 - 0.90 ) ( 1 - 0.64 ) = 1 - 0.36 \\times 0.10 \\times 0.36 = 0.98704$다. 앞뒤 0.75를 곱하면 $0.75 \\times 0.98704 \\times 0.75 \\fallingdotseq 0.5552$다.</li></ul><p><strong>◈ 암기</strong> <u>하나만 고장 나도 멈추면 직렬</u>, 하나가 고장 나도 버티면 병렬. · <u>직렬은 곱하기, 병렬은 1에서 빼기</u>.</p><p>직렬은 $R = R_{1} R_{2} \\cdots R_{n}$으로 부품이 늘수록 나빠지고, 병렬은 $R = 1 - ( 1 - R_{1} ) ( 1 - R_{2} ) \\cdots$로 늘수록 좋아진다.<br><strong>직렬은 </strong>$\\prod R_{i}$<strong>, 병렬은 </strong>$1 - \\prod ( 1 - R_{i} )$다. <strong>직렬은 가장 약한 것보다 더 낮아지고, 병렬은 가장 강한 것보다 더 높아진다</strong>.</p>", "nq": 3}, "card_erg_t045": {"kind": "공식형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "정규분포를 따르는 수명의 신뢰도", "front": "정규분포를 따르는 수명의 신뢰도의 식은?", "back": "<ul><li>평균 10,000, 표준편차 200이다. $Z = ( 9 {,} 600 - 10 {,} 000 ) / 200 =-2$다. 9,600시간을 <strong>넘겨 살아 있을 확률</strong>이므로 $R = P ( Z &gt; - 2 ) = P ( Z \\le 2 ) = 0.9772$다.</li><li>$Z = ( 9 {,} 600 - 10 {,} 000 ) / 200 =-2$다. 9,600시간을 <strong>넘겨 살아 있을 확률</strong>이므로 $R = P ( Z &gt; - 2 ) = P ( Z \\le 2 ) = 0.9772$ 곧 <strong>97.72 [%]</strong>다.</li></ul><p><strong>◈ 암기</strong> $Z = ( t - \\mu ) / \\sigma$ — <u>음수면 대칭으로 뒤집는다</u>.</p><p>신뢰도는 <strong>그 시각까지 고장 나지 않을 확률</strong>이다. $Z$가 음수로 나오면 <strong>정규분포가 좌우대칭</strong>이므로 부호를 떼고 표를 그대로 읽으면 된다.<br>$Z$가 음수로 나오면 <strong>정규분포가 좌우대칭</strong>이므로 부호를 떼고 표를 그대로 읽는다. <strong>신뢰도는 「그 시각까지 버틸 확률」</strong>이라 오른쪽 꼬리를 본다.</p>", "nq": 2}, "card_erg_t032": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "인체계측 자료의 응용원칙", "front": "인체계측 자료의 응용원칙은?", "back": "<ul><li><strong>출입문</strong>은 가장 큰 사람이 지날 수 있어야 하므로 <strong>최대집단치(95 %tile)</strong>로 잡는다.</li><li><strong>평균치 설계</strong>다. 불특정 다수가 잠깐씩 쓰고 조절할 수도 없는 시설이라, 평균에 맞추는 것이 그나마 나은 선택이다.</li><li><strong>구조적 치수</strong>는 인체를 재는 <strong>방법</strong>을 가리키는 말이지 설계 원칙이 아니다. 응용원칙은 <strong>조절식 · 극단치 · 평균치</strong> 셋뿐이다.</li></ul><p><strong>◈ 암기</strong> <u>닿아야 하면 작은 사람(5), 지나가야 하면 큰 사람(95)</u>. · <u>조절이 안 되고 여럿이 잠깐 쓰면 평균치</u>.</p><p>우선순위는 <strong>조절식 &gt; 극단치 &gt; 평균치</strong>다. 평균치 설계는 어쩔 수 없을 때만 쓴다.<br>평균치 설계는 <strong>아무에게도 꼭 맞지 않는다</strong>는 약점이 있다. 그래서 조절식이 가능하면 언제나 조절식이 낫다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인체측정치 응용의 세 원칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원칙</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최대집단치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">95 %tile — 큰 사람 기준</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>출입문</u> · 통로 · 비상구 · 침대 길이</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최소집단치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">5 %tile — 작은 사람 기준</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">선반 높이 · 조작 버튼까지의 거리</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>조절식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">5~95 %tile을 담게</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">의자 높이 · 자동차 시트 · 책상</td></tr></tbody></table></div>", "nq": 6}, "card_erg_t072": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "생리학적 측정법", "front": "생리학적 측정법은?", "back": "<strong>산소 소비량 측정</strong>이다. 온몸이 쓴 에너지를 그대로 나타내므로 <strong>전신 육체활동</strong>에 알맞다.<p><strong>◈ 암기</strong> <u>전신은 산소소비량</u>.</p><p>가르는 물음 — <strong>온몸인가 한 근육인가, 몸인가 마음인가</strong>. <strong>전신 = 산소소비량</strong>, <strong>국부 근육 = 근전도</strong>, <strong>정신 = 플리커·GSR</strong>로 짝지으면 된다.</p><div style=\"margin:12px 0 2px;font-weight:700\">생리학적 측정법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">측정</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 재나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">알맞은 대상</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>산소 소비량 · 에너지대사율(RMR)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>온몸이 쓴 에너지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전신 육체활동</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>근전도(EMG)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>국부 근육의 활동전위</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>특정 근육의 피로</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>심전도(ECG)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">심장의 전기활동</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">순환계 부담</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>플리커(Flicker)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>깜박임을 가려내는 한계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정신적 피로</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>피부전기반사(GSR)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>피부의 전기저항 변화</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정신적 긴장 · 정서</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>뇌파(EEG)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">뇌의 전기활동</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">각성 수준</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t073": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "작업환경관리", "mid": "실효온도(effective temperature)", "front": "실효온도(effective temperature)는?", "back": "<strong>실효온도(감각온도)</strong>다. <strong>온도 · 습도 · 공기 유동</strong> 세 가지를 하나의 수치로 묶는다.<p><strong>◈ 암기</strong> <u>실효온도에 복사열은 없다</u>.</p><p><strong>실효온도는 셋, 수정 실효온도는 넷</strong>이다. 「상대습도 100 [%] 일 때의 건구온도」라는 정의가 곧 <strong>습도를 기준에 못박아 하나의 수치로 바꾼다</strong>는 뜻이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">온열조건의 지수</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">지수</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 묶나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>실효온도(ET)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>온도 · 습도 · 공기 유동</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>복사열은 들어가지 않는다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>수정 실효온도(CET)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">실효온도 + <u>복사열</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">흑구온도를 쓴다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>옥스퍼드 지수(WD)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$0.85 W + 0.15 D$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>습구 0.85 + 건구 0.15</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>WBGT</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">습구 · 흑구 · 건구</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>옥외(햇볕 있음)에만 건구온도</u>가 든다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>열압박지수(HSI)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">필요 발한량 ÷ 최대 발한량</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t074": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "화학설비의 안전성 평가 단계", "front": "화학설비의 안전성 평가 단계는?", "back": "<ul><li><strong>제4단계는 안전대책</strong>이다.</li><li><strong>「작업환경 평가」</strong>라는 단계는 없다.</li></ul><p><strong>◈ 암기</strong> <u>자료 · 정성 · 정량 · 대책 · 재평가</u>. · <u>자 · 정성 · 정량 · 대책 · 재 · 재</u>.</p><p><strong>5단계까지가 본래의 안전성 평가이고, 제6단계 FTA 재평가는 뒤에 덧붙은 것</strong>이라 「5단계」와 「6단계」가 함께 쓰인다. 문항이 「5단계 중 4단계」라 물어도 <strong>안전대책</strong>으로 같다.<br>여섯 단계를 <strong>자료 → 정성 → 정량 → 대책 → 재평가 → 재평가</strong>로 새긴다. <strong>뒤의 둘이 모두 재평가</strong>라는 점이 특징이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">안전성 평가 6단계</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 하나</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>관계 자료의 정비 검토</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">설계도 · 공정도 · 물질 자료</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정성적 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">입지 조건 · 배치 · 건조물 · 소방설비 · 원재료 · 공정</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정량적 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">취급물질 · 용량 · 온도 · 압력 · 조작 — A~D 등급</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안전대책</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>설비 대책과 관리 대책</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>5</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>재해정보에 의한 재평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">비슷한 사고 사례로 다시 본다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>6</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>FTA에 의한 재평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">등급 Ⅰ·Ⅱ 에 적용</td></tr></tbody></table></div>", "nq": 2}, "card_erg_t018": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "FTA 와 FMEA 의 대비", "front": "FTA 와 FMEA 의 대비는?", "back": "<ul><li>FTA는 <strong>복잡하고 대형화된 시스템</strong>의 신뢰성과 안전성을 분석하는 기법이다. 정상사상을 먼저 정하고 그 원인을 거꾸로 파고드는 <strong>연역적·하향식(top-down)</strong> 기법이며, 각 사상의 확률을 알면 <strong>정량적 계산도 된다</strong>.</li><li>FTA는 각 사상의 확률을 넣으면 <strong>정량적 분석도 된다</strong>. 「정성적 분석만」이 틀렸다.</li><li>FTA는 <strong>톱다운(Top-Down)</strong> 방식이다. <strong>정상사상에서 시작해 아래로 원인을 캐 내려간다</strong>. 바텀업은 FMEA다.</li></ul><p><strong>◈ 암기</strong> <u>FTA는 연역·하향·정량 가능, FMEA는 귀납·상향·정성</u>. · <u>FTA는 위에서 아래로, 정량도 된다</u>.</p><p><u>FTA는 연역적·하향식·정량 가능</u>, <u>FMEA는 귀납적·상향식·정성 중심</u>이다. FTA는 1962년 벨연구소가 미니트맨 미사일의 발사 제어 시스템을 분석하며 만든 기법이라, 처음부터 <u>크고 복잡한 시스템</u>을 겨냥하고 있었다.<br><strong>FTA는 연역적·하향식·정량 가능</strong>, <strong>FMEA는 귀납적·상향식·정성 중심</strong>이다. 1962년 벨연구소가 미니트맨 미사일 발사 제어를 분석하며 만들었다.</p><div style=\"margin:12px 0 2px;font-weight:700\">FTA와 FMEA</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">FTA</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">FMEA</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">방향</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위에서 아래로 (Top-Down)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>아래에서 위로 (Bottom-Up)</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">논리</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>연역적</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>귀납적</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">분석</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정량적 가능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"> 인한 피해 방지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지락사고 시 대지전위 상승 억제와 절연강도 경감</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「상승유도·증가」가 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지락사고 시 보호계전기의 신속한 동작</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정전기 축적 방지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기기의 오동작 방지(노이즈 대책)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t072": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "인체의 전기저항", "front": "인체의 전기저항은?", "back": "<ul><li><strong>통전경로</strong>는 <strong>전류가 어디로 흐르는가</strong>를 말할 뿐, <strong>피부 저항 자체를 바꾸지는 않는다</strong>. 위험도에는 영향을 주지만 저항의 인자는 아니다.</li><li>물에 젖으면 <strong>약 1/25로</strong> 떨어진다. 1/12는 <strong>땀에 젖었을 때</strong>의 값이다.</li><li><strong>인가전압이 클수록 피부저항은 크게 떨어진다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>통전경로는 위험도를 가르지 저항을 바꾸지 않는다</u>. · <u>땀 1/12, 물 1/25</u>.</p><p>인체 저항의 어림값 — <strong>피부 저항 약 2,500 [Ω], 내부 저항 약 500 [Ω]</strong>. <strong>젖으면 1/25까지</strong> 떨어져 같은 전압에서도 훨씬 위험해진다.<br><strong>땀은 1/12, 물은 1/25</strong> 두 숫자를 짝으로 잡아 둔다. <strong>젖을수록 훨씬 위험</strong> 하다는 것이 요지이며, 물기 있는 장소의 누전차단기를 <strong>15 [mA]</strong>로 낮추는 근거이기도 하다.</p><div style=\"margin:12px 0 2px;font-weight:700\">피부 전기저항에 영향을 주는 것</div><div style=\"overflow-x:auto\">< xt-align:center;\"><u>수분(땀)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>젖을수록 저항이 작다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">1/12 ~ 1/25로 떨어진다</td></tr></tbody></table></div>", "nq": 3}, "card_ele_t002": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "누전차단기의 시설", "front": "누전차단기의 시설의 식은?", "back": "<ul><li><strong>50 [V]를 초과</strong>하는 저압 기계기구로서 사람이 쉽게 접촉할 우려가 있는 곳에 시설하는 것에는 누전차단기를 설치한다. 50 [V]는 국제적으로 <strong>교류에서 사람이 견딜 수 있다고 보는 한계</strong>로 삼는 값이다.</li><li>물기가 있는 곳은 <strong>인체 저항이 크게 떨어져</strong> 더 엄격하게 잡는다. 일반 장소의 30 [mA] 대신 <strong>15 [mA] 이하</strong>, 동작시간은 <strong>0.03초 이하</strong>다.</li><li><strong>사용전압 50 [V]를 넘으면</strong> 누전차단기를 달아야 한다. 50 [V] 아래는 감전되어도 위험이 낮다고 본다.</li></ul><p><strong>◈ 암기</strong> <u>일반 30, 물기 15</u> — 시간은 둘 다 0.03초. · <u>50 [V] 넘으면 누전차단기</u>.</p><p>「<u>50 [V] 초과</u>」가 기준값이다. 안전보건규칙 제304조가 정하는 <u>대상 장소(물기·도전성 높은 장소, 임시배선 등)</u> 와는 별개의 규정이니 섞지 않는다.<br>30 [mA]·0.03초는 Dalziel의 심실세동 한계 $I = 165 / \\sqrt{T}$에서 나온 값이다. 물기가 있으면 그 여유가 사라진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">누전차단기의 정격감도전류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">설치 장소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">정격감도전류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">동작시간</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">일반 장소</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>30 [mA] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.03초 이내</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물기 있는 장소</u> (욕실·화장실 등)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>15 [mA] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.03초 이내</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">인체 감전보호용</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">30 [mA] 이하</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">0.03초 이내</td></tr></tbody></table></div><p><em>근거 — 한국전기설비규정(KEC) 211.2.4</em></p>", "nq": 6}, "card_ele_t033": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "접지", "mid": "목적에 따른 접지의 분류", "front": "목적에 따른 접지의 분류는?", "back": "<ul><li><strong>등전위 접지</strong>다. 모든 금속부를 서로 이어 <strong>전위차를 없앤다</strong>. 전위차가 없으면 사람을 통해 전류가 흐르지 않는다.</li><li>피뢰기의 기능 손상을 막는 것은 <strong>피뢰용 접지</strong>다. <strong>기능용 접지는 전자기 잡음을 없애 설비가 제 기능을 하도록</strong> 하는 접지다.</li></ul><p><strong>◈ 암기</strong> <u>전위를 같게 만들면 등전위 접지</u>. · <u>피뢰기는 피뢰용 접지</u>.</p><p>감전은 <strong>전압이 높아서가 아니라 두 지점 사이에 전위차가 있어서</strong> 일어난다. 등전위 접지는 그 전제 자체를 없앤다.<br><strong>「피뢰기」가 나오면 피뢰용 접지</strong>다. 기능용 접지는 <strong>사람의 안전이 아니라 설비의 정상 동작</strong>을 위한 것이라 결이 다르다.</p><div style=\"margin:12px 0 2px;font-weight:700\">목적에 따른 접지의 분류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">목적</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>계통 접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">고압과 저압의 혼촉을 막음</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">변압기 중성점 접지</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기기 접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">누전된 기기로부터 감전을 막음</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">금속제 외함 접지</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>등전위 접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전위차를 없앰</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>병원 수술실 · 의료기기</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>노이즈방지용 접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">전자기 잡음을 없앰</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">통신·계측 설비</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지락검출용 접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">보호계전기를 확실히 동작시킴</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t038": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "교류 아크 용접기의 자동전격방지장치", "front": "교류 아크 용접기의 자동전격방지장치는?", "back": "<ul><li><strong>25 [V] 이하</strong>로 떨어뜨린다. 용접하지 않는 동안 홀더에 걸린 <strong>무부하 전압 60~95 [V]</strong>가 그대로 남아 있으면 감전 위험이 크기 때문이다.</li><li>거꾸로다. <strong>용접할 때는 주회로를 닫고(ON), 용접하지 않을 때 연다(OFF)</strong>. 아크가 끊긴 뒤 <strong>1초 이내에 25 [V] 이하</strong>로 떨어뜨린다.</li><li>접점방식(Magnet식)은 <strong>지동시간 1 ± 0.3초, 무부하전압 25 [V] 이하</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>1초 안에 25 [V] 아래로</u>. · <u>쉴 때 끊고, 용접할 때 붙인다</u>.</p><p><strong>1초 이내, 25 [V] 이하</strong> 두 숫자가 함께 나온다. 습윤한 장소나 철골 위처럼 위험한 곳에서는 <strong>반드시 설치</strong>해야 한다.<br>교류 아크 용접기의 무부하 전압은 <strong>60~95 [V]</strong>로 감전 위험이 크다. 그래서 <strong>쉬는 동안만 전압을 낮춰 두었다가, 용접봉이 모재에 닿는 순간 정상 전압을 공급</strong>한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">자동전격방지장치의 방식별 성능</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">지동시간</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무부하전압</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접점방식(Magnet식)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 ± 0.3초</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>25 [V] 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무접점방식(SCR·TRIAC식)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 ± 0.3초</u> 또는 <u>1.5 ± 0.06초</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>25 [V] 이하</u> (30 [V] 이하인 것도)</td></tr></tbody></table></div>", "nq": 3}, "card_ele_t073": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기설비", "mid": "충전전로 인근에서의 작업", "front": "충전전로 인근에서의 작업은?", "back": "<strong>300 [cm] 이내로 접근할 수 없다</strong>. 50 [kV] 까지는 <strong>300 [cm]</strong>이고, <strong>50 [kV]를 넘으면 10 [kV] 마다 10 [cm] 씩 더</strong> 띄운다.<p><strong>◈ 암기</strong> <u>사람 300 [cm], 장비 10 [m]</u>.</p><p><strong>차량이나 기계장치</strong>는 따로 정한다 — <strong>충전전로에서 10 [m] 이상 이격</strong>, 대지전압 50 [kV] 초과 시 <strong>10 [kV] 마다 10 [cm] 씩 추가</strong>. 사람은 3 [m], 장비는 10 [m]다.</p><div style=\"margin:12px 0 2px;font-weight:700\">유자격자가 아닌 근로자의 접근 한계</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대지전압</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">접근 한계거리</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>50 [kV] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>300 [cm]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">이 문항</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>50 [kV] 초과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>300 [cm] + 10 [kV] 마다 10 [cm]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제321조</em></p>", "nq": 1}, "card_ele_t074": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "", "mid": "표준 충격파형 1.2 times 50 [μs]", "front": "표준 충격파형 1.2 times 50 [μs]는?", "back": "<strong>1.2 [μs]는 파두장, 50 [μs]는 파미장</strong>이다. 파두장은 <strong>꼭짓값까지 오르는 시간</strong>, 파미장은 <strong>꼭짓값의 절반으로 떨어질 때까지의 시간</strong>이다.<p><strong>◈ 암기</strong> <u>앞이 파두장, 뒤가 파미장</u>.</p><p>벼락이 칠 때의 전압 파형을 본떠 만든 시험 파형이다. <strong>빠르게 치솟았다가 천천히 사그라진다</strong>는 벼락의 특징이 두 숫자에 담겨 있다.</p>", "nq": 1}, "card_ele_t075": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "폭발위험장소의 구분", "front": "폭발위험장소의 구분은?", "back": "<ul><li><strong>탱크 안 액면 위의 공간</strong>은 <strong>늘 증기로 차 있으므로 0종 장소</strong>다.</li><li><strong>2종 장소</strong>다. <strong>평소에는 없고, 이상이 생겼을 때만 잠깐</strong> 생기는 곳이다.</li><li><strong>「23종 장소」는 없다</strong>. 분진은 <strong>20 · 21 · 22종</strong> 셋뿐이다.</li></ul><p><strong>◈ 암기</strong> <u>액면 위 공간은 0종</u>. · <u>늘 0종, 가끔 1종, 이상 시 2종</u>.</p><p><strong>「탱크 안」이면 0종, 「탱크 밖 개구부 부근」이면 1종</strong>으로 가르면 대부분 맞는다. <strong>0종 장소에는 본질안전 방폭구조 ia 만</strong> 쓸 수 있다.<br>세 장소를 시간으로 가른다 — <strong>0종은 늘, 1종은 가끔(정상 운전 중), 2종은 이상 시에만 잠깐</strong>. <strong>2종 장소에는 n(비점화) 방폭구조</strong>까지 쓸 수 있다.</p><div style=\"margin:12px 0 2px;font-weight:700\">위험장소의 구분</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">가스가 있는 정도</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>0종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>계속 또는 장시간 존재</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>탱크 안 액면 상부의 공간부</u> · 개방용기 내부</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정상 운전 중 때때로 생김</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>벤트 개구부 부근 · 점검수리 시 밸브 부근 · 충전 중 개구부 부근</u> · 맨홀 부근</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이상 시에만 잠깐</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">환기가 잘 되는 곳 · 밀폐 용기가 손상될 때만</td></tr></tbody></table></div>", "nq": 6}, "card_ele_t076": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "내압(耐壓) 방폭구조 d 와 최대안전틈새", "front": "내압(耐壓) 방폭구조 d 와 최대안전틈새는?", "back": "틈을 좁히면 <strong>화염이 그 틈을 지나며 열을 빼앗겨 식는다</strong>. 그래서 밖의 가스에 불을 붙이지 못한다.<p><strong>◈ 암기</strong> <u>좁은 틈을 지나며 화염이 식는다</u>.</p><p>이 틈이 <strong>화염일주한계(최대안전틈새)</strong>이고, 그 값으로 <strong>기기그룹 ⅡA · ⅡB · ⅡC</strong>를 나눈다. <strong>틈이 좁아야 하는 가스일수록 위험</strong>하다.</p>", "nq": 1}, "card_ele_t024": {"kind": "공식형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기 일반", "mid": "정전기 에너지와 착화한계전압", "front": "정전기 에너지와 착화한계전압의 식은?", "back": "<ul><li>$W = \\dfrac{1}{2} C V^{2}$에서 $V = \\sqrt{2 W / C}$다. $V = \\sqrt{2 \\times 0.2 \\times 10^{-3} / ( 10 \\times 10^{-12} )} = \\sqrt{4 \\times 10^{7}} \\fallingdotseq 6 {,} 325$ [V]다.</li><li>$V = \\sqrt{2 W / C}$다. $V = \\sqrt{2 \\times 0.019 \\times 10^{-3} / ( 1 {,} 000 \\times 10^{-12} )} = \\sqrt{3.8 \\times 10^{4}} \\fallingdotseq 195$ [V]다.</li><li>$V = \\sqrt{2 W / C}$다. $V 수 있다</strong>」는 전제 위에 선다. 그래서 잠금·표찰로 막고, 그래도 들어올 경우를 대비해 단락접지를 건다.</p><div style=\"margin:12px 0 2px;font-weight:700\">정전작업의 절차 (규칙 제319조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">순서</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>①</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>모든 전원을 도면·배선도로 확인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">빠뜨린 전원이 없게</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>②</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전원을 차단</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>차단기로 먼저 끊는다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>③</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>각 단로기를 개방하고 확인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>부하 차단 뒤에 연다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>④</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>잠금장치와 꼬리표 부착</u></td><td sty <script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
if(!S.open)S.open={};

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

 return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+':'+String(x).padStart(2,'0');}

 clearInterval(tick);tick=setInterval(()=>{
  if(S.done)return;

 },1000);}

function intro(){

  <p style="margin-top:14px;font-size:13px">답만 고르고 끝에 제출합니다.

 </div>`;

}

function solOpen(q){

}

 if(show){

   </span>`;
 }
 h+=`</div><div class="stem">${q.t}</div>`;

 }
 if(graded){
   h+= a===q.a ? `<div class="vline o">정답입니다 · 정답 ${q.a}번</div>`
              : `<div class="vline x">${a?'틀렸습니다 · 고른 답 '+a+'번 · ':'미응답 · '}정답 ${q.a}번</div>`;
 }
 if(show&&solOpen(q)){
   h+=`<div class="sol"><div class="lbl">해설</div><div>${q.sol}</div>`;
   if(q.w)h+=`<div class="lbl">오답 분석</div><div>${q.w}</div>`;
   if(q.pt)h+=`<div class="lbl g">관련 개념 · 암기</div><div class="box">${q.pt}</div>`;
   if(q.law)h+=q.law;
   h+=`</div>`;
 }
 return h+'</div>';
}

function render(){
 if(!S.started){intro();return;}
 if(!STUDY&&S.done&&S.i<0){result();return;}
 const q=D.q[S.i];
 $('#app').innerHTML=qHTML(q);
 $$('.opt').forEach(b=>b.onclick=()=>{
   S.ans[q.n]=+b.dataset.k;
   if(STUDY&&S.open[q.n]===undefined)S.open[q.n]=true;
   save();
   if(STUDY||S.done){render();}
   else{$$('.opt').forEach(x=>x.classList.toggle('sel',x===b));paint();}
 });
 const ts=$('#tsol'); if(ts)ts.onclick=()=>{S.open[q.n]=!solOpen(q);save();render();};
 const tc=$('#tcard'); if(tc)tc.onclick=()=>openCard(q.card);
 kx($('#app'));
 stat();
 $('#prev').disabled=S.i===0; $('#next').disabled=S.i===119;
 paint();
 window.scrollTo(0,0);
}

function stat(){
 const n=Object.keys(S.ans).length;
 if(STUDY){
   let ok=0; D.q.forEach(q=>{if(S.ans[q.n]===q.a)ok++;});
   $('#prog').innerHTML=`<b>${S.i+1}</b> / 120 · 푼 문항 <b>${n}</b> · 맞힘 <b>${ok}</b>`;
   const r=$('#rate');
   if(r)r.textContent=n?`정답률 ${Math.round(ok/n*100)}%`:'정답률 —';
 }else{
   $('#prog').innerHTML=S.done?`채점 완료`:`<b>${S.i+1}</b> / 120 · 푸는 중 <b>${n}</b>`;
 }
}

/* 암기카드 팝업 */
let mflip=false;
function openCard(id){
 const c=D.cards[id]; if(!c)return;
 mflip=false;
 $('#mbody').innerHTML=`<button class="mx" id="mx">✕</button>
  <div class="mcard" id="mcard">
   <div class="mface">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span class="stars">${'★'.repeat(c.fq)+'☆'.repeat(3-c.fq)}</span>
     <span>${c.subject}${c.chapter?' · '+c.chapter:''}</span>
     <span class="mcid">${id}</span></div>
    <div class="mq">${c.front}</div>
    <div class="mhint">카드를 누르면 뒤집힙니다 · Esc 닫기</div>
   </div>
   <div class="mface back">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span>${c.mid}</span><span class="mcid">${id}</span></div>
    <div class="ma">${c.back}</div>
    <div class="mfoot"><span>이 개념을 묻는 문항 ${c.nq}개</span>
     <a href="../_암기카드.html#${id}" target="_blank">카드 전체 보기 →</a></div>
   </div>
  </div>`;
 $('#modal').classList.add('on');
 kx($('#mbody'));
 fitCard(); setTimeout(fitCard,260);
 $('#mcard').onclick=()=>{mflip=!mflip;$('#mcard').classList.toggle('flip',mflip);};
 $('#mx').onclick=e=>{e.stopPropagation();closeCard();};
}
function fitCard(){
 const mc=$('#mcard'); if(!mc)return;
 mc.style.height='120px';
 const h=Math.max(...[...mc.querySelectorAll('.mface')].map(f=>f.scrollHeight));
 mc.style.height=Math.min(window.innerHeight*0.78,Math.max(300,h+4))+'px';
}
function closeCard(){$('#modal').classList.remove('on');}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeCard();};
window.addEventListener('resize',()=>{if($('#modal').classList.contains('on'))fitCard();});

function paint(){
 $$('.pg').forEach(b=>{
   const n=+b.dataset.n, q=D.q[n-1];
   const marked=STUDY?!!S.ans[n]:S.done;
   let c='pg';
   if(marked&&(STUDY||S.done))c+=(S.ans[n]===q.a?' ok':' no');
   else if(S.ans[n])c+=' done';
   if(n-1===S.i)c+=' cur';
   b.className=c;
 });
}

function submit(){
 if(STUDY||S.done)return;
 const un=120-Object.keys(S.ans).length;
 if(un>0&&!confirm('안 푼 문제가 '+un+'개 있습니다. 제출할까요?'))return;
 S.done=true;clearInterval(tick);save();S.i=-1;result();
}

function result(){
 const per=[0,0,0,0,0,0],tot=[0,0,0,0,0,0];
 let right=0;
 D.q.forEach(q=>{tot[q.s-1]++;if(S.ans[q.n]===q.a){per[q.s-1]++;right++;}});
 const scores=per.map((v,i)=>Math.round(v/tot[i]*100));
 const avg=Math.round(right/120*100);
 const pass=avg>=60&&scores.every(s=>s>=40);
 let h=`<div class="result"><div style="text-align:center;color:#64748b;font-size:13px">${D.title} · 채점 결과</div>
  <div class="score">${avg}<span style="font-size:20px;color:#94a3b8">점</span></div>
  <div style="text-align:center;color:#64748b;font-size:14px">120문항 중 <b>${right}</b>문항 정답 · 소요 ${fmt(S.elapsed)}</div>
  <div class="verdict ${pass?'pass':'fail'}">${pass?'합격':'불합격'}</div>
  <table class="stab"><tr><th>과목</th><th>맞힌 문항</th><th>점수</th></tr>`;
 for(let i=0;i<6;i++){
   h+=`<tr><td style="text-align:left">제${i+1}과목 ${D.subj[i]}</td>
    <td>${per[i]} / ${tot[i]}</td><td class="${scores[i]<40?'bad':''}">${scores[i]}</td></tr>`;
 }
 h+=`</table><div style="font-size:12.5px;color:#64748b;text-align:center">합격 — 과목당 40점 이상, 평균 60점 이상</div>
  <div class="rowbtns">
   <button class="nbtn pri" id="rw">틀린 문제만 다시 보기</button>
   <button class="nbtn" id="rall">전체 해설 보기</button>
   <button class="nbtn" id="rst">다시 풀기</button>
  </div></div>`;
 $('#app').innerHTML=h;
 paint(); stat();
 $('#rw').onclick=()=>{const bad=D.q.findIndex(q=>S.ans[q.n]!==q.a);S.i=bad<0?0:bad;render();};
 $('#rall').onclick=()=>{S.i=0;render();};
 $('#rst').onclick=()=>{if(confirm('답안을 지우고 처음부터 다시 풀까요?')){
   S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();startTimer();}};
}

function build(){
 let p='';
 for(let s=1;s<=6;s++){
   p+=`<div class="palhd">제${s}과목 ${D.subj[s-1]}</div><div class="palgrid">`;
   D.q.filter(q=>q.s===s).forEach(q=>{p+=`<button class="pg" data-n="${q.n}">${q.n}</button>`;});
   p+='</div>';
 }
 $('#pal').innerHTML=p;
 $$('.pg').forEach(b=>b.onclick=()=>{S.i=+b.dataset.n-1;save();render();$('#pal').classList.remove('open');});
}

$('#prev').onclick=()=>{if(S.i>0){S.i--;save();render();}};
$('#next').onclick=()=>{if(S.i<119){S.i++;save();render();}};
$('#palbtn').onclick=()=>$('#pal').classList.toggle('open');
const sb=$('#sub'); if(sb)sb.onclick=submit;
const rs=$('#reset'); if(rs)rs.onclick=()=>{if(confirm('푼 기록을 모두 지울까요?')){
 S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();}};
document.addEventListener('keydown',e=>{
 if($('#modal').classList.contains('on')){
   if(e.key==='Escape')closeCard();
   if(e.key===' '){e.preventDefault();$('#mcard').click();}
   return;
 }
 if(e.key==='ArrowLeft')$('#prev').click();
 if(e.key==='ArrowRight')$('#next').click();
 if('1234'.includes(e.key)){const b=$$('.opt')[+e.key-1];if(b)b.click();}
 if(e.key==='s'||e.key==='S'){const t=$('#tsol');if(t)t.click();}
 if(e.key==='c'||e.key==='C'){const t=$('#tcard');if(t)t.click();}
});
build();
const hm=location.hash.match(/^#q(\d+)/);
if(hm){S.started=1;S.i=Math.max(0,Math.min(119,+hm[1]-1));save();}
if(!STUDY&&S.done){if(hm){render();}else{S.i=-1;result();}}
else{render();if(S.started)startTimer();}
</script>
</body></html>
