은 ÷10</u>.</p><p>강도율은 1,000시간 기준이라 10만 시간으로 바꾸면 <strong>100배</strong>, 도수율은 100만 시간 기준이라 <strong>10분의 1</strong>이 된다.<br><strong>환산강도율 = 강도율 × 100</strong>, <strong>환산도수율 = 도수율 ÷ 10</strong>이다. 강도율은 1,000시간 기준이라 100배, 도수율은 100만 시간 기준이라 10분의 1이 된다.</p><div style=\"margin:12px 0 2px;font-weight:700\">환산 지표 — 평생 10만 시간 기준</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">지표</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">계산</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>환산강도율</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">강도율 <u>× 100</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">평생 잃는 근로손실일수</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>환산도수율</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">도수율 <u>÷ 10</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">평생 겪는 재해 건수</td></tr></tbody></table></div>", "nq": 3}, "card_erg_t021": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "FT 의 정상사상 확률과 신뢰도", "front": "FT 의 정상사상 확률과 신뢰도의 식은?", "back": "정상사상의 발생확률을 구한 뒤 <strong>1에서 빼면 신뢰도</strong>다. 부품마다 0.1이므로 AND 게이트는 곱하고 OR 게이트는 $1 - ( 1 - q_{1} ) ( 1 - q_{2} )$로 묶어 올라간다. 이 FT 에서는 정상사상 확률이 0.0019이므로 신뢰도는 <strong>0.9981</strong>이다.<p><strong>◈ 암기</strong> <u>고장확률을 먼저 구하고 1에서 뺀다</u>.</p><p><strong>AND는 곱하고 OR는 여집합으로 묶는다</strong>. $R = 1 - P ( T )$로 마무리한다.</p>", "nq": 1}, "card_erg_t022": {"kind": "용어형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "사정효과(range effect)", "front": "사정효과(range effect)란?", "back": "<strong>사정효과(range effect)</strong>다. 눈으로 보지 않고 손을 움직이면 <strong>짧은 거리는 지나치고 긴 거리는 못 미친다</strong>. 몸이 평균 거리 쪽으로 끌려가기 때문이다.<p><strong>◈ 암기</strong> <u>짧으면 넘고 길면 모자란다</u> — 평균 쪽으로 끌린다.</p><p>계기판을 보지 않고 조작해야 하는 자리라면, <strong>촉각 부호화</strong>로 손끝이 위치를 알아채게 만들어야 한다.</p>", "nq": 1}, "card_erg_t023": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "컷셋(Cut Set)과 패스셋(Path Set)", "front": "컷셋(Cut Set)과 패스셋(Path Set)는?", "back": "<ul><li><strong>컷셋</strong>은 그 안의 기본사상이 모두 일어나면 정상사상이 생기는 집합이고, <strong>최소 패스셋</strong>은 그것들이 모두 일어나지 않으면 정상사상이 생기지 않는 집합이라 <strong>시스템의 신뢰성</strong>을 나타낸다.</li><li><strong>패스셋</strong>은 그 안의 기본사상이 <strong>모두 일어나지 않으면 정상사상이 일어나지 않는</strong> 집합이다. 곧 <strong>시스템을 살려 두는</strong> 조합이다.</li><li><strong>고장이 발생하지 않도록 하는 집합</strong>은 <strong>패스셋</strong>이다. 최소 컷셋은 반대로 <strong>고장을 일으키는</strong> 최소한의 집합이다.</li></ul><p><strong>◈ 암기</strong> <u>컷셋은 위험성, 패스셋은 안전성</u>. · <u>컷은 끊어 죽이고, 패스는 통해 살린다</u>.</p><p>최소 컷셋의 <strong>크기가 작을수록</strong> 그 시스템은 취약하다. 하나만 무너져도 끝나는 자리가 있다는 뜻이기 때문이다.<br>한 문장으로 — <strong>최소 컷셋은 위험, 최소 패스셋은 신뢰성</strong>. 이 대비가 이 유형 문제를 거의 다 가른다.</p><div style=\"margin:12px 0 2px;font-weight:700\">컷셋과 패스셋</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 나타내나</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>컷셋</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">모두 일어나면 정상사상이 생기는 집합</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시스템의 위험성</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최소 컷셋</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">더 줄일 수 없는 컷셋</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>취약점</u> — 작을수록 위험</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>패스셋</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">모두 일어나지 않으면 정상사상이 안 생기는 집합</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시스템의 안전성</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최소 패스셋</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">더 줄일 수 없는 패스셋</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>신뢰성</u></td></tr></tbody></table></div>", "nq": 3}, "card_erg_t024": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "부품 배치의 네 원칙", "front": "부품 배치의 네 원칙은?", "back": "<strong>기능별 배치의 원칙</strong>이다. 이름 그대로 기능이 서로 이어지는 것끼리 모아 둔다.<p><strong>◈ 암기</strong> 「<u>중 · 빈 · 기 · 순</u>」.</p><p>앞의 둘(중요성·사용 빈도)은 <strong>어디에 둘 것인가</strong>를 정하고, 뒤의 둘(기능별·사용 순서)은 <strong>어떻게 묶을 것인가</strong>를 정한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">부품 배치의 네 원칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원칙</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 따지나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>중요성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">목표 달성에 얼마나 결정적인가</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">비상정지 버튼을 손 닿는 곳에</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>사용 빈도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">얼마나 자주 쓰는가</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">자주 쓰는 스위치를 가까이</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기능별 배치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">기능이 서로 이어지는가</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">계측기끼리 · 조작기끼리 모음</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>사용 순서</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">쓰는 차례가 정해져 있는가</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">점화 → 가속 → 제동 순으로</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t025": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "Fail Safe 의 기능적 분류", "front": "Fail Safe 의 기능적 분류는?", "back": "<strong>Fail Operational</strong>이다. 고장이 나도 <strong>다음 점검 때까지 기능을 유지</strong> 한다. 셋 중 안전 수준이 가장 높다.<p><strong>◈ 암기</strong> <u>Passive 정지 &lt; Active 경보 후 잠시 &lt; Operational 계속</u>.</p><p><strong>Fail Safe는 기계의 고장</strong>, <strong>Fool Proof는 사람의 실수</strong>를 전제한다. 무엇을 전제하는지로 가른다.</p><div style=\"margin:12px 0 2px;font-weight:700\">Fail Safe의 기능적 분류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">고장이 나면</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Fail Passive</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">곧바로 정지한다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">가장 흔한 방식</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Fail Active</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">경보를 내며 잠시 운전을 잇는다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">경보 뒤 자동 정지</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Fail Operational</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>다음 점검까지 기능을 유지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">다경로 구조 · 여러 대 병렬</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t026": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "인간-기계 시스템의 설계 6단계", "front": "인간-기계 시스템의 설계 6단계는?", "back": "<ul><li><strong>기본 설계(3단계)</strong>에서 사람과 기계에 각각 무엇을 맡길지 나눈다. 여기서 직무분석과 작업설계도 함께 이루어진다.</li><li>직무분석은 <strong>제3단계 기본 설계</strong>에서 한다. 기능을 사람과 기계에 나눠 주고 나면 <strong>사람이 맡을 일이 무엇인지</strong> 따져야 하기 때문이다.</li><li><strong>화면 설계</strong>는 <strong>제4단계 인터페이스 설계</strong>다. 기본설계에 드는 것은 <strong>기능 할당 · 인간 성능 요건 명세 · 직무분석 · 작업 설계</strong> 넷이다.</li></ul><p><strong>◈ 암기</strong> 기능 배분은 <u>3단계 기본 설계</u>. · <u>직무분석은 3단계</u>.</p><p>기능 배분의 기준은 <strong>사람이 잘하는 일과 기계가 잘하는 일</strong>이다. 사람은 판단·융통성·예외 처리에, 기계는 반복·정밀·기억·힘에 강하다.<br>제3단계 기본 설계에 드는 것이 넷이다 — <strong>기능의 할당 · 인간 성능 요건 명세 · 직무분석 · 작업 설계</strong>. 이 넷이 통째로 문제에 나온다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인간-기계 시스템 설계 6단계</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">하는 일</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">1</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">목표와 성능명세 결정</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">무엇을 이루려는 시스템인가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">2</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">시스템의 정의</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">그 목표에 어떤 기능이 필요한가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">3</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기본 설계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사람과 기계에 기능을 나눔</u> · 직무분석 · 작업설계</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">4</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">인터페이스 설계</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">표시장치와 조종장치를 짬</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">5</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">보조물 설계</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">설명서 · 훈련도구 · 편의수단</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">6</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">시험과 평가</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">실제로 되는지 확인</td></tr></tbody></table></div>", "nq": 4}, "card_erg_t027": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "Technology Assessment(기술개발의 종합평가)", "front": "Technology Assessment(기술개발의 종합평가)는?", "back": "<strong>Technology Assessment(기술개발의 종합평가)</strong>다. 기술이 가져올 <strong>효율과 위험을 함께</strong> 재어 개발 여부를 판단한다.<p><strong>◈ 암기</strong> <u>효율과 위험을 함께 보면 TA</u>.</p><p>네 가지가 층을 이룬다 — <strong>TA(기술 전반) → SA(설비 안전성) → RA(위험성) → RM(위험 관리)</strong>.</p>", "nq": 1}, "card_erg_t028": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "HAZOP(위험과 운전 분석)", "front": "HAZOP(위험과 운전 분석)은?", "back": "HAZOP은 <strong>여러 분야 전문가가 모여 공정을 하나하나 훑는</strong> 방식이라 <strong>시간과 비용이 많이 든다</strong>. 오히려 단점이다.<p><strong>◈ 암기</strong> 장점은 <u>쉽고 팀으로 한다</u>, 단점은 <u>오래 걸리고 비싸다</u>.</p><p><strong>가이드워드</strong>로 설계 의도에서 벗어난 상태를 찾아낸다 — No/Not · More/Less · As well as · Part of · Reverse · Other than.</p>", "nq": 1}, "card_erg_t029": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "욕조곡선의 세 구간", "front": "욕조곡선의 세 구간은?", "back": "<strong>마모 고장기간</strong>이다. 부품이 닳으면서 고장률이 점점 올라간다. 이 구간의 대책은 <strong>수명 전에 계획적으로 교체</strong>하는 예방보전이다.<p><strong>◈ 암기</strong> <u>감소 → 일정 → 증가</u>, 증가하는 쪽이 마모.</p><p>구간마다 대책이 다르다 — <strong>초기는 걸러내기(디버깅·번인), 우발은 상황 관리, 마모는 교체</strong>. <strong>예방보전이 통하지 않는 구간은 우발 고장기</strong>라는 물음이 자주 나온다.</p>", "nq": 1}, "card_erg_t030": {"kind": "공식형", "fq": 3, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "지수분포와 일정 고장률", "front": "지수분포와 일정 고장률의 식은?", "back": "고장률이 <strong>일정</strong>하면 고장간격은 <strong>지수분포</strong>를 따른다. 욕조곡선의 <strong>우발 고장기</strong>가 이에 해당한다.<p><strong>◈ 암기</strong> <u>고장률이 일정하면 지수분포</u>, $\\mathrm{MTBF} = 1 / \\lambda$.</p><p>지수분포에서 신뢰도는 $R ( t ) = e^{-\\lambda t}$이고 $\\mathrm{MTBF} = 1 / \\lambda$다. <strong>평균 고장률과 평균 수명은 역수 관계</strong>다.</p>", "nq": 1}, "card_erg_t031": {"kind": "공식형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "MTBF 와 고장률의 관계", "front": "MTBF 와 고장률의 관계의 식은?", "back": "$\\mathrm{MTBF} = 1 / \\lambda$이므로 <strong>반비례</strong>다. 고장률이 커질수록 수명은 짧아진다. 「정비례」는 방향이 거꾸로다.<p><strong>◈ 암기</strong> $\\mathrm{MTBF} = 1 / \\lambda$ — <u>반비례</u>.</p><p><strong>디레이팅(derating)</strong>은 부품을 정격보다 낮은 부하로 쓰는 것이다. 여유를 두면 덜 상하므로 수명이 늘어난다.</p>", "nq": 1}, "card_erg_t032": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "인체계측 자료의 응용원칙", "front": "인체계측 자료의 응용원칙은?", "back": "<ul><li><strong>출입문</strong>은 가장 큰 사람이 지날 수 있어야 하므로 <strong>최대집단치(95 %tile)</strong>로 잡는다.</li><li><strong>평균치 설계</strong>다. 불특정 다수가 잠깐씩 쓰고 조절할 수도 없는 시설이라, 평균에 맞추는 것이 그나마 나은 선택이다.</li><li><strong>구조적 치수</strong>는 인체를 재는 <strong>방법</strong>을 가리키는 말이지 설계 원칙이 아니다. 응용원칙은 <strong>조절식 · 극단치 · 평균치</strong> 셋뿐이다.</li></ul><p><strong>◈ 암기</strong> <u>닿아야 하면 작은 사람(5), 지나가야 하면 큰 사람(95)</u>. · <u>조절이 안 되고 여럿이 잠깐 쓰면 평균치</u>.</p><p>우선순위는 <strong>조절식 &gt; 극단치 &gt; 평균치</strong>다. 평균치 설계는 어쩔 수 없을 때만 쓴다.<br>평균치 설계는 <strong>아무에게도 꼭 맞지 않는다</strong>는 약점이 있다. 그래서 조절식이 가능하면 언제나 조절식이 낫다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인체측정치 응용의 세 원칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원칙</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최대집단치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">95 %tile — 큰 사람 기준</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>출입문</u> · 통로 · 비상구 · 침대 길이</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최소집단치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">5 %tile — 작은 사람 기준</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">선반 높이 · 조작 버튼까지의 거리</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>조절식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">5~95 %tile을 담게</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">의자 높이 · 자동차 시트 · 책상</td></tr></tbody></table></div>", "nq": 6}, "card_erg_t014": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "작업환경관리", "mid": "습구흑구온도지수(WBGT)", "front": "습구흑구온도지수(WBGT)의 식은?", "back": "<ul><li><strong>햇볕이 있는 옥외</strong>는 건구온도까지 넣는 식을 쓴다. $\\mathrm{WBGT} = 0.7 \\times \\text{자연습구} + 0.2 \\times \\text{흑구} + 0.1 \\times \\text{건구}$이므로 $0.7 \\times 20 + 0.2 \\times 18 + 0.1 \\times 30 = 14 + 3.6 + 3 = 20.6$ [℃]다.</li><li>옥내 또는 햇볕 없는 옥외는 $0.7 \\times \\text{자연습구} + 0.3 \\times \\text{흑구}$다. 두 계수의 합이 <strong>1</strong>이 되어야 한다.</li><li>실내(태양광선이 없는 곳)는 $\\mathrm{WBGT} = 0.7 \\mathrm{NWB} + 0.3 GT$다.</li></ul><p><strong>◈ 암기</strong> <u>자연습구 0.7은 언제나 같고, 건구 0.1은 햇볕이 있을 때만</u>. · <u>실내는 0.7 + 0.3, 옥외는 0.7 + 0.2 + 0.1</u>.</p><p>WBGT 두 가지 식. <u>옥내 또는 햇볕 없는 옥외 : 0.7 자연습구 + 0.3 흑구</u>, <u>햇볕 있는 옥외 : 0.7 자연습구 + 0.2 흑구 + 0.1 건구</u>. <u>자연습구의 가중치 0.7은 어느 경우에나 같고, 건구는 햇볕이 있을 때만 0.1로 들어간다</u>는 점이 갈림길이다.<br>햇볕이 있는 옥외는 $0.7 \\times \\text{자연습구} + 0.2 \\times \\text{흑구} + 0.1 \\times \\text{건구}$다.</p><div style=\"margin:12px 0 2px;font-weight:700\">WBGT의 두 식</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>실내 · 옥외(태양광선 없음)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$0.7 \\mathrm{NWB} + 0.3 GT$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>두 항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>옥외(태양광선 있음)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$0.7 \\mathrm{NWB} + 0.2 GT + 0.1 DB$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>세 항</u></td></tr></tbody></table></div>", "nq": 3}, "card_erg_t017": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "양립성의 네 가지", "front": "양립성의 네 가지는?", "back": "<ul><li><strong>양식(modality) 양립성</strong>은 <strong>자극을 받는 감각과 반응하는 방식이 서로 맞는가</strong>를 말한다. <strong>귀로 들려주고 입으로 답하게 하는 것</strong>이 그 예다. 반대로 소리로 물어보고 손으로 버튼을 누르게 하면 그만큼 반응이 느려진다.</li><li>양립성은 <strong>공간 · 운동 · 개념 · 양식</strong> 네 가지다. 「감성의 양립성」은 없다.</li><li><strong>양식(modality) 양립성</strong>이다. <strong>귀로 들었으면 입으로 답하는</strong> 것처럼 자극과 응답의 <strong>감각 양식이 맞는</strong> 경우다.</li></ul><p><strong>◈ 암기</strong> <u>공간(위치) · 운동(방향) · 개념(뜻) · 양식(감각과 반응)</u>. · 「<u>공 · 운 · 개 · 양</u>」 — 감성은 없다.</p><p>양립성 네 가지. <u>공간(위치) · 운동(방향) · 개념(뜻) · 양식(감각과 반응의 방식)</u>. 양립성이 어긋난 설계는 평소에는 그럭저럭 쓰이다가 <u>급할 때 반드시 실수를 부른다</u>. 이것이 양립성이 안전의 문제인 이유다.<br>양립성이 어긋난 설계는 평소에는 그럭저럭 쓰이다가 <strong>급할 때 반드시 실수를 부른다</strong>. 이것이 양립성이 안전의 문제인 까닭이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">양립성의 네 가지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>공간적 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>배치가 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">오른쪽 버너는 오른쪽 손잡이</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>운동 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>움직임이 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">시계 방향으로 돌리면 증가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>개념적 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>뜻이 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>빨강은 뜨거움, 파랑은 차가움</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>양식 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>자극과 응답의 감각 양식이 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>들으면 말로 답한다</u></td></tr></tbody></table></div>", "nq": 7}, "card_erg_t018": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "FTA 와 FMEA 의 대비", "front": "FTA 와 FMEA 의 대비는?", "back": "<ul><li>FTA는 <strong>복잡하고 대형화된 시스템</strong>의 신뢰성과 안전성을 분석하는 기법이다. 정상사상을 먼저 정하고 그 원인을 거꾸로 파고드는 <strong>연역적·하향식(top-down)</strong> 기법이며, 각 사상의 확률을 알면 <strong>정량적 계산도 된다</strong>.</li><li>FTA는 각 사상의 확률을 넣으면 <strong>정량적 분석도 된다</strong>. 「정성적 분석만」이 틀렸다.</li><li>FTA는 <strong>톱다운(Top-Down)</strong> 방식이다. <strong>정상사상에서 시작해 아래로 원인을 캐 내려간다</strong>. 바텀업은 FMEA다.</li></ul><p><strong>◈ 암기</strong> <u>FTA는 연역·하향·정량 가능, FMEA는 귀납·상향·정성</u>. · <u>FTA는 위에서 아래로, 정량도 된다</u>.</p><p><u>FTA는 연역적·하향식·정량 가능</u>, <u>FMEA는 귀납적·상향식·정성 중심</u>이다. FTA는 1962년 벨연구소가 미니트맨 미사일의 발사 제어 시스템을 분석하며 만든 기법이라, 처음부터 <u>크고 복잡한 시스템</u>을 겨냥하고 있었다.<br><strong>FTA는 연역적·하향식·정량 가능</strong>, <strong>FMEA는 귀납적·상향식·정성 중심</strong>이다. 1962년 벨연구소가 미니트맨 미사일 발사 제어를 분석하며 만들었다.</p><div style=\"margin:12px 0 2px;font-weight:700\">FTA와 FMEA</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">FTA</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">FMEA</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">방향</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위에서 아래로 (Top-Down)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>아래에서 위로 (Bottom-Up)</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">논리</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>연역적</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>귀납적</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">분석</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정량적 가능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정성적</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">잘하는 것</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>여러 원인이 얽힌 재해</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>부품 하나하나의 고장 영향</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">한계</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">숨은 원인을 빠뜨릴 수 있다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">여러 고장이 겹친 경우에 약하다</td></tr></tbody></table></div>", "nq": 3}, "card_erg_t033": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "정보량 H = log_2 n", "front": "정보량 H = log_2 n의 식은?", "back": "$H = \\log_{2} n = \\log_{2} 64 = 6$ [bit]다. <strong>2를 몇 번 곱해야 64가 되는가</strong>를 묻는 것과 같다.<p><strong>◈ 암기</strong> <u>2를 몇 번 곱해야 그 수가 되는가</u> — 64는 6번.</p><p>확률이 서로 다르면 $H = \\sum p_{i} \\log_{2} ( 1 / p_{i} )$로 구한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">대안 수와 정보량</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대안 수</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">정보량</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">2</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">1 [bit]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">켜짐/꺼짐</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">4</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">2 [bit]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">8</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">3 [bit]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">16</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">4 [bit]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">32</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">5 [bit]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>64</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>6 [bit]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">이 문항</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t034": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "소음의 합성", "front": "소음의 합성의 식은?", "back": "데시벨은 로그 값이라 <strong>그냥 더하지 못한다</strong>. 세기로 되돌려 더한 뒤 다시 데시벨로 바꾼다. $L = 10 \\log ( 10^{8.0} + 10^{8.6} + 10^{7.8} ) \\fallingdotseq 87.5$ [dB]다.<p><strong>◈ 암기</strong> <u>데시벨은 더하지 말고 세기로 되돌려 더한다</u>.</p><p><strong>같은 크기의 소음 두 개를 합치면 3 [dB] 만 오른다</strong>. 소음원이 두 배가 되어도 체감은 크게 달라지지 않는다는 뜻이며, 반대로 <strong>가장 큰 소음원 하나를 줄이는 것</strong>이 가장 효과가 크다.</p>", "nq": 1}, "card_erg_t035": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "작업기억의 세 가지 코드", "front": "작업기억의 세 가지 코드는?", "back": "작업기억으로 넘길 때의 코드는 <strong>시각 · 음성 · 의미</strong> 셋이다. <strong>촉각코드</strong>는 여기에 들지 않는다.<p><strong>◈ 암기</strong> 「<u>시 · 음 · 의</u>」 — 촉각은 없다.</p><p>작업기억은 용량이 <strong>7 ± 2 청크</strong>로 제한되고 보유 시간이 수십 초로 짧다. 그래서 작업 지시는 <strong>한 번에 서너 가지</strong>로 나누고 적어 주는 편이 낫다.</p>", "nq": 1}, "card_erg_t036": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "화학설비의 안전성 평가", "front": "화학설비의 안전성 평가는?", "back": "<ul><li><strong>취급물질</strong>은 <strong>정량적 평가</strong>의 항목이다. 양을 재어 점수를 매기기 때문이다.</li><li>정량적 평가 항목은 <strong>취급물질 · 화학설비의 용량 · 온도 · 압력 · 조작</strong> 다섯이다. <strong>훈련</strong>은 여기 없다.</li><li><strong>공정</strong>은 <strong>정성적 평가</strong> 항목이다. 정량적 평가는 <strong>취급물질 · 용량 · 온도 · 압력 · 조작</strong> 다섯이다.</li></ul><p><strong>◈ 암기</strong> 정량적 평가 다섯은 「<u>물 · 용 · 온 · 압 · 조</u>」. · <u>물 · 용 · 온 · 압 · 조</u>.</p><p>6단계는 <strong>관계 자료의 정비 → 정성적 평가 → 정량적 평가 → 안전대책 → 재해정보에 의한 재평가 → FTA에 의한 재평가</strong>다.<br>정량적 평가 다섯 항목은 <strong>물질 · 용량 · 온도 · 압력 · 조작</strong>이다. <strong>모두 숫자로 잴 수 있는 것</strong> 들이라 정량적이다. 훈련은 숫자로 재기 어렵다.</p><div style=\"margin:12px 0 2px;font-weight:700\">화학설비 안전성 평가의 항목</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">성격</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정성적 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">입지 조건 · 공장 내 배치 · 건조물 · 소방설비</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">있는가 없는가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정성적 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">원재료 · 중간재 · 제품 · 공정 · 수송과 저장</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">절차가 갖춰졌는가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정량적 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>취급물질</u> · 용량 · 온도 · 압력 · 조작</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">점수를 매긴다</td></tr></tbody></table></div>", "nq": 8}, "card_mac_t020": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "플레이너 작업의 안전대책", "front": "플레이너 작업의 안전대책은?", "back": "칩 브레이커는 칩을 <strong>짧게 끊는</strong> 장치다. 「길게 되도록」은 반대다. 길게 이어진 칩은 뜨겁고 날카로워 손을 베거나 몸에 감긴다.<p><strong>◈ 암기</strong> <u>칩 브레이커는 칩을 끊는다</u> — 길게 만드는 장치가 아니다.</p><p>플레이너는 <strong>테이블이 왕복</strong>하고 셰이퍼는 <strong>바이트가 왕복</strong>한다. 둘 다 왕복 구간에 사람이 서지 않도록 <strong>방책</strong>을 세운다.</p>", "nq": 1}, "card_mac_t021": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "연삭숫돌의 파괴 원인", "front": "연삭숫돌의 파괴 원인은?", "back": "<ul><li>플랜지 지름이 숫돌의 <strong>1/3 이상</strong>인 것은 <strong>법이 요구하는 정상 상태</strong>다. 오히려 <strong>1/3 미만</strong>이면 숫돌을 제대로 붙들지 못해 깨진다.</li><li><strong>숫돌의 정면(원주면)을 쓰는 것이 올바른 사용법</strong>이다. 파괴 원인이 되는 것은 오히려 <strong>측면을 쓰는 것</strong>이다.</li><li>플랜지가 <strong>작을 때</strong>가 파괴 원인이다. 크면 숫돌을 더 넓게 잡아 주므로 오히려 안전하다.</li></ul><p><strong>◈ 암기</strong> <u>플랜지는 1/3 이상이 정상</u> — 모자라야 위험. · <u>정면은 옳고 측면이 위험하다</u>.</p><p>파괴 원인 — <strong>속도 초과 · 균열 · 충격 · 편심 · 무리한 측면 연삭 · 플랜지 부족</strong>. 일반 숫돌은 <strong>측면 연삭용이 아니다</strong>.<br>연삭기의 숫자 — <strong>작업 시작 전 1분 이상, 교체 후 3분 이상 시운전</strong>, <strong>플랜지 지름은 숫돌 지름의 1/3 이상</strong>, <strong>덮개는 지름 5 [cm] 이상인 숫돌에 설치</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">연삭숫돌의 파괴 원인</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">파괴 원인</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>회전속도가 너무 빠를 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">원심력이 강도를 넘는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>숫돌의 측면을 사용할 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정면(원주면)이 정상 사용면</u>이다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>큰 충격을 줬을 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">취성 재료라 충격에 약하다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>회전중심이 어긋났을 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">편심 진동이 생긴다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>숫돌에 균열이 있을 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">작업 전 <u>음향검사</u>로 확인</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>플랜지가 현저히 작을 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>숫돌 지름의 1/3 이상</u> 이어야 한다</td></tr></tbody></table></div>", "nq": 4}, "card_mac_t001": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "공작기계 공통 안전수칙", "front": "공작기계 공통 안전수칙은?", "back": "<ul><li>강력 절삭일수록 일감을 <strong>바이스에 깊게</strong> 물려야 한다. 짧게 물리면 큰 절삭력에 일감이 튕겨 나간다. 「강력하게 깎으니 단단히 잡는다」로 생각하면 방향이 가르면 된다.</li><li>회전하는 기계에서 <strong>장갑은 금물</strong>이다. 커터에 장갑이 물리면 손이 통째로 딸려 들어간다.</li></ul><p><strong>◈ 암기</strong> <u>회전 기계에는 장갑을 끼지 않는다</u>.</p><p>공작기계 공통 3금지. <u>회전 중 칩 제거 금지 · 회전 중 측정 금지 · 장갑 착용 금지</u>. 밀링은 여기에 <u>커터 날에 손 대지 않기(반드시 브러시 사용)</u>가 더해진다.<br>세 가지가 공통이다 — <strong>회전 중 칩 제거 금지 · 회전 중 측정 금지 · 장갑 착용 금지</strong>.</p>", "nq": 2}, "card_mac_t022": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "양중기 과부하방지장치", "front": "양중기 과부하방지장치는?", "back": "<ul><li>방호장치를 손보는 동안 양중기가 함께 멈추면 <strong>매달린 화물을 내릴 수 없어</strong> 더 위험해진다. 조문은 <strong>임의로 무력화할 수 없는 구조</strong>를 요구한다.</li><li><strong>방호장치의 기능을 없애면 양중기가 작동하지 않아야</strong> 한다. 「제거해도 작동한다」면 방호장치를 달아 둔 뜻이 사라진다.</li></ul><p><strong>◈ 암기</strong> <u>과부하방지장치는 정격하중을 넘으면 작동</u>. · <u>방호장치를 떼면 기계도 선다</u>.</p><p>설계의 바탕은 「<strong>고장이나 보수 중에도 사람이 더 위험해지지 않게</strong>」다. 선택지 ④의 「권하 허용」이 바로 그 발상이다.<br>방호장치의 대원칙은 <strong>떼어 내면 기계가 서야 한다</strong>는 것이다. <strong>인터록(연동)</strong>의 기본 생각이며, <strong>「제거해도 작동」·「해제할 수 있는」</strong>이라는 말이 붙으면 대개 오답이다.</p><p><em>근거 — 방호장치 안전인증 고시</em></p>", "nq": 2}, "card_mac_t012": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "프레스 방호장치의 종류", "front": "프레스 방호장치의 종류는?", "back": "<ul><li><strong>손쳐내기식</strong>이다. 막대가 좌우로 오가며 위험구역에 남은 손을 <strong>밀어낸다</strong>. 접근거부형에 든다.</li><li><strong>양수조작식</strong>은 손을 떼면 <strong>슬라이드가 즉시 멈춰야</strong> 하므로 급정지 기구가 있어야 쓸 수 있다. 광전자식도 마찬가지다.</li><li><strong>손쳐내기식(push away)</strong>이다. <strong>막대가 좌우로 오가며 손을 밀어낸다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>확동식에는 손쳐내기·수인·게이트 가드</u> 세 가지만. · <u>급정지가 필요한 것은 양수조작식과 광전자식</u>.</p><p><strong>확동식(핀) 클러치</strong>는 한 번 물리면 1행정을 끝까지 마쳐 도중에 멈출 수 없다. 그래서 <strong>정지시켜야 작동하는 양수조작식·광전자식은 쓸 수 없다</strong>.<br><strong>확동식(핀) 클러치</strong>는 한 번 물리면 1행정을 끝까지 마쳐 도중에 멈출 수 없다. 그래서 급정지가 필요한 양수조작식·광전자식을 쓸 수 없다.</p><div style=\"margin:12px 0 2px;font-weight:700\">프레스 방호장치와 쓸 수 있는 클러치</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방호장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">확동식에 쓸 수 있나</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>손쳐내기식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">막대가 손을 밀어냄</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">가능</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>수인식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">손목을 끈으로 당겨 뺌</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">가능</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>게이트 가드식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">문이 닫혀야 작동</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">가능</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">양수조작식</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">두 손으로 눌러야 작동</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불가</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">광전자식</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">빛을 가리면 정지</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불가</u></td></tr></tbody></table></div>", "nq": 3}, "card_mac_t023": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "사출성형기 등의 방호장치", "front": "사출성형기 등의 방호장치는?", "back": "<ul><li>게이트 가드식은 <strong>문을 닫아야만 동작</strong>하는 것이 연동구조다. 「닫지 않아도 동작」하면 방호장치가 아니다.</li><li>게이트 가드식은 <strong>문을 닫아야 비로소 기계가 움직이는</strong> 연동구조라야 한다. 「문을 닫지 않아도 동작」은 정반대다.</li></ul><p><strong>◈ 암기</strong> <u>연동은 「닫아야 돈다」</u> — 반대로 적으면 오답. · <u>문이 닫혀야 움직인다</u>.</p><p><strong>연동(interlock)</strong>은 「조건이 갖춰져야 움직인다」는 뜻이다. 문이 열려 있으면 아예 동작하지 않게 만드는 것이 핵심이다.<br><strong>연동(interlock)</strong>은 <strong>문이 닫혀야 작동하고, 열리면 멈추는</strong> 구조다. 「닫지 않아도 동작한다」면 연동이 아니라 그냥 문이 달린 것일 뿐이다.</p><p><em>근거 — 안전보건규칙 제121조</em></p>", "nq": 2}, "card_mac_t024": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "자분탐상시험(MT)", "front": "자분탐상시험(MT)는?", "back": "<ul><li><strong>자분탐상(MT)</strong>이다. 자기를 걸면 표면의 결함에서 자속이 새어 나오고, 거기에 자분이 모여 결함이 드러난다. <strong>강자성체(철·니켈 등)</strong> 에만 쓸 수 있다.</li><li><strong>자분탐상시험(MT)</strong>이다. <strong>새어 나온 자속에 자분이 모여 눈에 보이는 무늬</strong>를 만든다.</li></ul><p><strong>◈ 암기</strong> <u>자화해서 새어 나오는 자속을 보면 MT</u>. · <u>강자성체의 표면은 자분탐상</u>.</p><p>표면 계열 셋을 가른다 — <strong>MT는 자석에 붙는 것, ET는 전기가 통하는 것, PT는 아무거나(열린 결함만)</strong>.<br><strong>「강자성체」와 「누설자속」</strong> 두 낱말이 곧 자분탐상을 가리킨다 — <strong>자석에 붙는 재료라야 쓸 수 있다</strong>. <strong>결과가 눈에 보인다</strong>는 점도 함께 잡아 둔다.</p><div style=\"margin:12px 0 2px;font-weight:700\">비파괴검사의 갈래</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 보나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">적용 대상</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">한계</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>MT 자분</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">표면·표면 바로 밑</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>강자성체만</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">비자성체 불가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>PT 침투</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">표면에 열린 결함</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">재질 무관</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">속은 못 본다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>ET 와전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">표면·표면 바로 밑</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>도체만</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">형상 제약</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>UT 초음파</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">내부, 깊이까지</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">대부분</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">기록성 약함</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>RT 방사선</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">내부, 필름 기록</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">대부분</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">피폭 위험</td></tr></tbody></table></div>", "nq": 2}, "card_mac_t005": {"kind": "단답형", "fq": 3, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "기계설비의 위험점", "front": "기계설비의 위험점은?", "back": "<ul><li><strong>절단점</strong>은 <strong>회전하는 운동부 자체</strong> 또는 그 회전하는 기계 부분의 <strong>돌출부</strong>에서 생긴다. 다른 물체와 짝을 이루지 않고 <strong>단독으로</strong> 위험을 만든다는 점이 갈림길이다. 밀링 커터, 둥근톱 날, 벨트의 이음 부분이 그 예다.</li><li><strong>접선물림점</strong>이다. 회전체와 거기에 걸린 벨트·체인이 만나는 <strong>접선 방향</strong>으로 딸려 들어간다.</li><li><strong>끼임점(Shear point)</strong>이다. <strong>도는 것과 고정된 것 사이</strong>에서 생긴다.</li></ul><p><strong>◈ 암기</strong> <u>절단점만 짝이 없다</u>. · <u>벨트와 풀리, 체인과 스프로킷이면 접선물림</u>.</p><p>위험점 여섯 가지. <u>협착점(왕복 + 고정) · 끼임점(회전 + 고정) · 절단점(회전체 단독) · 물림점(회전 + 회전) · 접선물림점(회전체의 접선, 벨트와 풀리) · 회전말림점(회전축에 감김)</u>. <u>「무엇과 무엇 사이인가」</u>로 갈리며, 절단점만 짝이 없다.<br><strong>협착(왕복+고정) · 끼임(회전+고정) · 절단(회전체 단독) · 물림(회전+회전) · 접선물림(회전체의 접선) · 회전말림(축에 감김)</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">기계설비의 위험점 여섯 가지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">위험점</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇과 무엇 사이</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>협착점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>왕복운동 + 고정부</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">프레스 슬라이드 · 성형기</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>끼임점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>회전 + 고정부</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">연삭숫돌과 작업대 · 교반날개와 몸체</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>절단점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>회전체 자체의 운동</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">밀링 커터 · 목공 대패날</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물림점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12 g>24 [cm]</strong>다.</li></ul><p><strong>◈ 암기</strong> $D_{m} = 1.6 T_{m}$, $T_{m}$은 <u>(1/개소수 + 1/2) × 60,000/SPM</u>. · <u>1,600 × 시간</u> — 답은 [mm].</p><p>계수 <strong>1.6</strong>은 사람 손의 접근속도 <strong>1.6 [m/s]</strong>에서 왔다. 광전자식은 $D = 1.6 ( T_{l} + T_{s} )$로 식이 다르다.<br>1,600 [mm/s]는 <strong>사람 손이 움직이는 속도</strong>로 잡은 값이다. <strong>손이 위험구역에 닿기 전에 슬라이드가 내려와 버리도록</strong> 두 손 버튼을 그만큼 떨어뜨려 둔다.</p><div style=\"margin:12px 0 2px;font-weight:700\">프레스 방호장치의 안전거리</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방호장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>양수기동식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$D_{m} = 1 {,} 600 T_{m}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$T_{m}$은 <u>하사점 도달시간</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>양수조작식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$D = 1 {,} 600 ( T_{l} + T_{s} )$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">급정지시간</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>광전자식(감응식)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$D = 1 {,} 600 ( T_{l} + T_{s  거꾸로다. <strong>전원을 먼저 차단한 뒤 단로기를 개방</strong>한다. 부하가 걸린 채 단로기를 열면 <strong>아크가 크게 튀어</strong> 화상과 화재로 이어진다.</li></ul><p><strong>◈ 암기</strong> 정전작업 5단계 — <u>차단 · 잠금표찰 · 방전 · 검전 · 단락접지</u>. · <u>차단이 먼저, 단로기 개방이 나중</u>.</p><p>안전보건규칙 제319조(정전전로에서의 전기작업). 정전작업 순서는 <u>① 전로 차단 → ② 개폐기 잠금과 표찰 부착 → ③ 잔류전하 방전 → ④ 검전기로 충전 여부 확인 → ⑤ 단락접지</u>다. 검전기는 반드시 <u>정격 전압에 맞는 것</u>을 쓰고, 사용 전후에 알려진 충전부에서 동작을 확인한다.<br>정전작업은 「<strong>전기가 다시 올 수 있다</strong>」는 전제 위에 선다. 그래서 잠금·표찰로 막고, 그래도 들어올 경우를 대비해 단락접지를 건다.</p><div style=\"margin:12px 0 2px;font-weight:700\">정전작업의 절차 (규칙 제319조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">순서</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>①</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>모든 전원을 도면·배선도로 확인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">빠뜨린 전원이 없게</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>②</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전원을 차단</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>차단기로 먼저 끊는다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>③</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>각 단로기를 개방하고 확인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>부하 차단 뒤에 연다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>④</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>잠금장치와 꼬리표 부착</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">남이 못 넣게</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>⑤</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>잔류전하 방전</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">콘덴서·케이블</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>⑥</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>검전기로 충전 여부 확인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">눈으로 믿지 않는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>⑦</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>단락 접지기구로 단락 접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">그래도 들어올 경우를 대비</td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제319조</em></p>", "nq": 5}, "card_ele_t003": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "누전차단기의 설치 예외", "front": "누전차단기의 설치 예외는?", "back": "<ul><li><strong>절연대 위</strong>에서 쓰는 기계·기구는 사람이 대지와 끊겨 있어 전류가 몸을 지나 땅으로 흐를 길이 없다. 그래서 누전차단기 설치 대상에서 빠진다.</li><li>생략할 수 있는 것은 <strong>대지전압 150 [V] 이하</strong>를 물기 없는 곳에 시설하는 경우다. 200 [V]는 이를 넘으므로 <strong>누전차단기를 달아야 한다</strong>.</li></ul><p><strong>◈ 암기</strong> 예외 셋 — <u>이중절연 · 절연대 위 · 비접지방식</u>. · <u>대지전압 150 [V] 이하</u>라야 생략 — 200은 안 된다.</p><p>안전보건규칙 제304조(누전차단기에 의한 감전방지). 예외는 <u>이중절연 구조 · 절연대 위 사용 · 비접지방식 전원(절연변압기 2차 300 [V] 이하, 3 [kVA] 이하)</u> 세 가지다. 전부 <u>「접지 없이도 감전되지 않는 구조」</u>라는 공통점이 있다.<br>생략의 논리는 하나다 — <strong>누전차단기가 없어도 감전될 길이 없는 경우</strong>. 건조·절연·이중절연·비접지방식이 모두 그런 경우다.</p><p><em>근거 — 안전보건규칙 제304조</em></p>", "nq": 2}, "card_ele_t023": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "특고압용 기계·기구의 울타리", "front": "특고압용 기계·기구의 울타리는?", "back": "35 [kV] 이하이면 <strong>울타리 높이 + 충전부까지의 거리 ≥ 5 [m]</strong>다.<p><strong>◈ 암기</strong> <u>35 [kV] 이하는 5 [m], 그 위는 6 [m]</u>.</p><p>울타리 자체의 높이는 <strong>2 [m] 이상</strong> 이어야 하며, 지표면과 울타리 하단 사이는 <strong>15 [cm] 이하</strong>로 한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">울타리 높이와 충전부까지 거리의 합</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">사용전압</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">합계 거리</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>35 [kV] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>5 [m] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">35 [kV] 초과 160 [kV] 이하</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>6 [m] 이상</u> xt-align:left;\">흰색</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">2</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">17,000 [V]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>25,500 [V]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">노란색</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">3</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">26,500 [V]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>39,750 [V]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">녹색</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">4</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">36,000 [V]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">54,000 [V]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">등색</td></tr></tbody></table></div>", "nq": 1}, "card_ele_t026": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "위험장소의 구분과 방폭구조", "front": "위험장소의 구분과 방폭구조는?", "back": "0종 장소에는 <strong>본질안전 방폭구조 ia</strong>만 쓸 수 있다. <strong>2중 고장까지</strong> 점화되지 않음을 보장하기 때문이다.<p><strong>◈ 암기</strong> <u>0종은 ia뿐</u>.</p><p><strong>ia는 2중 고장까지, ib는 1중 고장까지</strong> 안전을 보장한다. 이 한 줄이 문제 대부분을 가른다.</p><div style=\"margin:12px 0 2px;font-weight:700\">위험장소별로 쓸 수 있는 방폭구조</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">가스가 있는 정도</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">쓸 수 있는 구조</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>0종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">계속 또는 장시간 존재</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>ia뿐</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">정상 운전 중 때때로 생김</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">ia · ib · d · p · o · e · m · q</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">이상 시에만 잠깐</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">위의 것 모두 + <u>n</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t007": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "IP 보호등급", "front": "IP 보호등급은?", "back": "<ul><li>IP 등급은 <strong>두 자리 숫자</strong>로 되어 있다. <strong>앞자리(제1 특성 숫자)는 고체(분진·이물)에 대한 보호</strong>, <strong>뒷자리(제2 특성 숫자)는 물에 대한 보호</strong>다. 앞자리가 1이면 <strong>지름 50 [mm] 이상</strong>의 고체를 막는다는 뜻이다.</li><li>유입 방폭구조의 변압기는 <strong>IP66</strong>이 최소 등급이다. 앞자리 6은 <strong>완전 방진</strong>, 뒷자리 6은 <strong>강한 분사수에 견딤</strong>을 뜻한다.</li></ul><p><strong>◈ 암기</strong> <u>앞자리는 고체(먼지), 뒷자리는 물</u>. · <u>앞은 먼지, 뒤는 물</u> — 유입 변압기는 IP66.</p><p>IP(Ingress Protection) 등급. <u>앞자리는 고체, 뒷자리는 물</u>. 앞자리 1은 50 [mm], 2는 12.5 [mm], 3은 2.5 [mm], 4는 1 [mm], 5는 방진, 6은 완전 방진이다. 「<u>앞은 먼지, 뒤는 물</u>」 한 줄만 알면 선택지 절반이 걸러진다.<br><strong>앞자리는 고체(먼지), 뒷자리는 물</strong>이다. 앞자리 5는 방진, 6은 완전 방진이며 뒷자리 5는 분사수, 6은 강한 분사수다.</p><div style=\"margin:12px 0 2px;font-weight:700\">IP 보호등급 — 앞자리는 고체, 뒷자리는 물</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">숫자</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">제1 특성 (고체·분진)</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">제2 특성 (물)</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">0</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">보호 없음</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">보호 없음</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">1</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>지름 50 [mm] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">수직으로 떨어지는 물방울</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">2</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">지름 12.5 [mm] 이상</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">15° 기울여 떨어지는 물방울</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">3</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">지름 2.5 [mm] 이상</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">60° 범위의 물보라</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">4</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">지름 1 [mm] 이상</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">모든 방향의 물보라</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">5</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">방진 — 먼지가 조금 들어와도 지장 없음</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">모든 방향의 분사수</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">6</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">완전 방진</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">강한 분사수</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t010": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "기기보호등급(EPL)", "front": "기기보호등급(EPL)은?", "back": "<ul><li>EPL의 뒤 글자는 보호 수준을 나타내며 <strong>a(매우 높음) · b(높음) · c(강화된)</strong> 세 가지다. 다만 <strong>광산용 M은 Ma와 Mb 두 가지뿐</strong>이라 <strong>Mc는 없다</strong>.</li><li>EPL은 <strong>Equipment Protection Level(기기보호등급)</strong>의 줄임말이다. 「Explosion」이 아니다. 폭발성 가스 분위기에서 보호등급이 가장 높은 것이 <strong>EPL Ga</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>M 에만 c가 없다</u> — Ma·Mb뿐. · <u>EPL은 Equipment</u> — Ga가 가장 높다.</p><p>EPL(Equipment Protection Level). 앞 글자는 대상 분위기 — <u>G(gas) · D(dust) · M(mine)</u>. 뒤 글자는 보호 수준 — <u>a · b · c</u>. 조합은 <u>Ga/Gb/Gc · Da/Db/Dc · Ma/Mb</u>로 여덟 가지이며, <u>M 에만 c가 없다</u>는 것이 갈림길이다.<br>앞 글자는 대상 분위기 — <strong>G(가스) · D(분진) · M(광산)</strong>. 뒤 글자는 보호 수준 — <strong>a(가장 높음) · b(높음) · c(강화된)</strong>. <strong>M 에는 c가 없다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">기기보호등급(EPL)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대상</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조합</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">G — 가스</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">Ga · Gb · Gc</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">Ga는 0종 장소용</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">D — 분진</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">Da · Db · Dc</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">Da는 20종 장소용</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">M — 광산</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>Ma · Mb</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>Mc는 없다</u> — 갈림길</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t027": {"kind": "공식형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기 일반", "mid": "정전기의 전하량과 에너지", l-align:middle;text-align:center;\"><u>ⅡC</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수소 · 아세틸렌</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">0.5 [mm] 미만</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">0.45 미만</td></tr></tbody></table></div><p><em>근거 — KS C IEC 60079-0</em></p>", "nq": 1}, "card_ele_t030": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기설비", "mid": "절연물의 열화 요인", "front": "절연물의 열화 요인은?", "back": "<strong>정격전압</strong>은 그 기기가 견디도록 만들어진 정상 전압이다. 절연을 상하게 하는 것은 <strong>정격을 넘는 과전압·이상전압</strong>이다.<p><strong>◈ 암기</strong> <u>정격은 정상, 과전압이 문제</u>.</p><p>네 갈래 — <strong>기계적(진동·충격) · 화학적(산화·흡습) · 열적(온도) · 전기적(과전압·부분방전)</strong>. 대개 여러 요인이 겹쳐 진행된다.</p>", "nq": 1}, "card_ele_t031": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기화재", "mid": "트래킹(tracking) 현상", "front": "트래킹(tracking) 현상은?", "back": "<strong>트래킹</strong>이다. 절연물 표면에 먼지와 습기가 쌓여 미소 방전이 되풀이되면서 <strong>탄화 통로(트랙)</strong>가 생기고 결국 단락된다.<p><strong>◈ 암기</strong> <u>표면에 탄화 통로가 생기면 트래킹</u>.</p><p>콘센트에 먼지가 쌓여 불이 나는 <strong>먼지 트래킹</strong>이 대표 사례다. 주기적인 청소가 실질적인 화재 예방이 된다.</p>", "nq": 1}, "card_ele_t032": {"kind": "공식형", "fq": 2, "subject": "전기위험방지기술", "chapter": "접지", "mid": "저압 전선로의 절연저항", "front": "저압 전선로의 절연저항의 식은?", "back": "누설전류는 최대공급전류의 <strong>1/2,000 이하</strong> 여야 한다. $I = 20 {,} 000 / ( \\sqrt{3} \\times 220 ) = 52.5$ [A]이고 상전류 기준으로 $I_{g} = 52.5 / 2 {,} 000 = 0.02625$ [A]다. $R = 220 / \\sqrt{3} / 0.02625 \\fallingdotseq 8 {,} 383$ [Ω]이다.<p><strong>◈ 암기</strong> <u>누설은 1/2,000 이하</u>.</p><p><strong>누설전류는 최대공급전류의 1/2,000 이하</strong>라는 조건에서 출발한다. 옴의 법칙으로 저항을 되돌려 구하면 된다.</p>", "nq": 1}, "card_ele_t033": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "접지", "mid": "목적에 따른 접지의 분류", "front": "목적에 따른 접지의 분류는?", "back": "<ul><li><strong>등전위 접지</strong>다. 모든 금속부를 서로 이어 <strong>전위차를 없앤다</strong>. 전위차가 없으면 사람을 통해 전류가 흐르지 않는다.</li><li>피뢰기의 기능 손상을 막는 것은 <strong>피뢰용 접지</strong>다. <strong>기능용 접지는 전자기 잡음을 없애 설비가 제 기능을 하도록</strong> 하는 접지다.</li></ul><p><strong>◈ 암기</strong> <u>전위를 같게 만들면 등전위 접지</u>. · <u>피뢰기는 피뢰용 접지</u>.</p><p>감전은 <strong>전압이 높아서가 아니라 두 지점 사이에 전위차가 있어서</strong> 일어난다. 등전위 접지는 그 전제 자체를 없앤다.<br><strong>「피뢰기」가 나오면 피뢰용 접지</strong>다. 기능용 접지는 <strong>사람의 안전이 아니라 설비의 정상 동작</strong>을 위한 것이라 결이 다르다.</p><div style=\"margin:12px 0 2px;font-weight:700\">목적에 따른 접지의 분류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">목적</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>계통 접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">고압과 저압의 혼촉을 막음</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">변압기 중성점 접지</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기기 접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">누전된 기기로부터 감전을 막음</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">금속제 외함 접지</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>등전위 접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전위차를 없앰</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>병원 수술실 · 의료기기</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>노이즈방지용 접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">전자기 잡음을 없앰</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">통신·계측 설비</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지락검출용 접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">보호계전기를 확실히 동작시킴</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t034": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "정전기", "mid": "정전기 발생의 요인과 대책", "front": "정전기 발생의 요인과 대책은?", "back": "접촉 면적이 <strong>클수록 정전기가 많이</strong> 생긴다. 「크게 하여야 한다」는 방향이 거꾸로다.<p><strong>◈ 암기</strong> <u>접촉 면적은 작게, 유속은 느리게, 습도는 높게</u>.</p><p>발생 5요인 — <strong>물체의 특성 · 표면 상태 · 대전 이력 · 접촉 면적과 압력 · 분리 속도</strong>. <strong>처음 접촉 때가 가장 크고, 나머지는 모두 「클수록·빠를수록 많다」</strong>는 방향이다.</p>", "nq": 1}, "card_ele_t035": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "정전기", "mid": "제전기의 제전효율", "front": "제전기의 제전효율은?", "back": "제전기를 달았으면 <strong>90 [%] 이상</strong>의 제전효율이 나와야 한다. 그 아래면 달아 놓고도 전하가 남아 위험하다.<p><strong>◈ 암기</strong> <u>제전효율 90 [%] 이상</u>.</p><p>제전기는 <strong>공기를 이온화</strong>해 반대 극성 이온으로 전하를 중화한다. 종류는 <strong>전압인가식 · 자기방전식 · 방사선식</strong>이며, <strong>부도체에도 통한다</strong>는 것이 큰 장점이다.</p>", "nq": 1}, "card_chm_t021": {"kind": "단답형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "유해화학물질", "mid": "최소발화에너지(MIE)", "front": "최소발화에너지(MIE)는?", "back": "<ul><li><strong>에틸렌</strong>이 약 0.07 [mJ]로 가장 작다. 최소발화에너지가 작다는 것은 <strong>아주 작은 불꽃에도 불이 붙는다</strong>는 뜻이다.</li><li><strong>수소(H₂)</strong>가 약 0.019 [mJ]로 가장 작다.</li><li><strong>산소 중에서 최소발화에너지가 더 낮다</strong>. <strong>산소가 많을수록 작은 불꽃에도 붙는다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>작을수록 위험</u> — 이황화탄소 0.009 &lt; 수소 0.019 &lt; 에틸렌 0.07. · <u>수소 0.019 — 이 보기 중 가장 작다</u>.</p><p>MIE는 <strong>온도·압력·산소농도가 높을수록 작아지고</strong>, 화학양론 농도 부근에서 가장 작다. 사람이 느끼는 정전기 방전이 1~10 [mJ]이므로, 이 값들은 <strong>느끼지도 못하는 방전으로 불이 붙는</strong> 수준이다.<br><strong>수소와 아세틸렌이 ⅡC 그룹</strong>인 것과 같은 뿌리다. <strong>적은 에너지로도 불이 붙으므로 가장 엄격한 방폭구조</strong>를 쓴다.</p><div style=\"margin:12px 0 2px;font-weight:700\">주요 물질의 최소발화에너지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">물질</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">MIE</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>이황화탄소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.009 [mJ]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">가장 작다 — 유속 1 [m/s] 이하로 제한</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>수소 · 아세틸렌</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.019 [mJ]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">ⅡC 그룹</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>에틸렌</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.07 [mJ]</u></td><td style=\"bo (금속망·다공판)을 지나며 화염이 식어</strong> 안쪽으로 번지지 못한다. <strong>인화점 60 [℃] 이상인 액체</strong> 탱크에는 화염방지기 대신 <strong>통기밸브</strong>를 달 수 있다.</p><p><em>근거 — 안전보건규칙 제269조</em></p>", "nq": 5}, "card_chm_t004": {"kind": "공식형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "가스의 위험도", "front": "가스의 위험도의 식은?", "back": "<ul><li>위험도는 $H = \\dfrac{U - L}{L}$로 구한다. <strong>상한과 하한의 차가 클수록, 하한이 낮을수록</strong> 위험도가 크다. 표의 값을 각각 대입해 큰 것부터 늘어놓으면 C – D – B – A 순이 된다.</li><li>$H = \\dfrac{U - L}{L} = \\dfrac{9.5 - 2.2}{2.2} = \\dfrac{7.3}{2.2} \\fallingdotseq 3.32$다.</li><li>$H = \\dfrac{U - L}{L} = \\dfrac{74 - 12.5}{12.5} = \\dfrac{61.5}{12.5} = 4.92$다.</li></ul><p><strong>◈ 암기</strong> $H = ( U - L ) / L$ — <u>분모가 하한</u>이라 하한이 낮을수록 크다. · $H = ( \\text{상한} - \\text{하한} ) \\div \\text{하한}$ — <u>분모는 하한</u>.</p><p>위험도 $H = ( U - L ) / L$. 대표값 — <u>아세틸렌 2.5~81 [%]이므로 H = 31.4</u>로 압도적으로 크고, <u>수소 4~75 [%] 이면 H = 17.75</u>, <u>메탄 5~15 [%] 이면 H = 2</u>다. <u>분모가 하한</u>이라는 점 때문에 하한이 낮은 가스가 크게 유리해진다.<br><strong>분모가 하한</strong>이므로 하한이 낮은 가스가 크게 유리해진다. 상한이 아무리 높아도 하한이 높으면 위험도는 작다.</p><div style=\"margin:12px 0 2px;font-weight:700\">주요 가스의 위험도</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">가스</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">폭발범위</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">위험도 H</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>아세틸렌</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">2.5 ~ 81 [%]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle >」. · 가장 실질적인 대책은 <u>쌓인 분진의 청소</u>.</p><p>분진폭발을 <u>「터지는 순간은 약하지만 오래 타고 크게 부순다」</u>. 연소속도·폭발압력은 가스폭발보다 작지만 <u>연소시간·발생에너지·파괴력</u>은 크다. 가장 실질적인 대책은 <u>쌓인 분진의 청소</u>다.<br>한 줄로 — 「<strong>터지는 순간은 약하지만 오래 타고 크게 부순다</strong>」. 연소속도와 폭발압력은 가스폭발보다 작지만 <strong>연소시간·발생에너지·파괴력</strong>은 크다.</p><div style=\"margin:12px 0 2px;font-weight:700\">분진폭발과 가스폭발</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">분진폭발</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">가스폭발</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">연소속도</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>느리다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>빠르다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">연소시간</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>길다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>짧다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">발생에너지</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>크다(수 배 ~ 수십 배)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;te
