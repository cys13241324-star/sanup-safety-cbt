"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원리</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 말하나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">열쇳말</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>자기활동의 원리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">학습자가 <u>스스로 활동</u> 하게 한다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">자발성</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>개별화의 원리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>각자의 요구와 능력</u>에 맞춘다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>알맞은</u> — 이 문제의 열쇳말</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>사회화의 원리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>공동 학습</u>으로 사회성을 기른다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">함께</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>통합의 원리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전인</u>으로서 통합적으로 지도한다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">전체</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>직관의 원리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>실물이나 표본</u>을 직접 보여 준다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">구체물</td></tr></tbody></table></div>", "nq": 3}, "card_mgt_t239": {"kind": "단답형", "fq": 1, "subject": "안전관리론", "chapter": "안전보건교육", "mid": "동기유발요인", "front": "동기유발요인은?", "back": "<ul><li><strong>자세</strong>는 <strong>태도</strong>이지 밖에서 주는 동기유발요인이 아니다.</li><li><strong>회피</strong>는 <strong>물러나는 것</strong>이라 동기를 일으키는 요소가 아니다.</li></ul><p><strong>◈ 암기</strong> <u>자세는 동기유발요인이 아니다</u>. · <u>회피는 동기유발요인이 아니다</u>.</p><p><strong>동기유발요인은 「밖에서 주어 사람을 움직이게 하는 것」</strong>이다 — <strong>자세는 사람이 이미 가지고 있는 마음가짐</strong>이라 갈래가 다르다.<br><strong>동기유발요인은 「사람을 앞으로 나아가게 하는 것」</strong>이다 — <strong>회피는 뒤로 물러나는 것</strong>이라 방향이 반대다.</p><div style=\"margin:12px 0 2px;font-weight:700\">구체적인 동기유발요인</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">요인</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기회 · 참여 · 인정 · 승진</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안정 · 경제 · 성과 · 권력</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>적응도 · 통제 · 감독 · competition(경쟁)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>자세</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>동기유발요인이 아니다</u> — 태도에 속한다</td></tr></tbody></table></div>", "nq": 2}, "card_mgt_t195": {"kind": "단답형", "fq": 1, "subject": "안전관리론", "chapter": "안전점검·인증", "mid": "안전모의 성능기준", "front": "안전모의 성능기준은?", "back": "<ul><li><strong>1 [%] 미만</strong>이다. <strong>물에 담갔을 때 물을 빨아들이면 절연성능이 떨어지기</strong> 때문이다.</li><li><strong>내열성</strong>은 성능기준 항목이 아니다.</li></ul><p><strong>◈ 암기</strong> <u>질량 증가율 1 [%] 미만</u>. · <u>내열성이 아니라 난연성</u>.</p><p><strong>E(전기)가 붙은 안전모만 내수성과 내전압성 시험</strong>을 한다. <strong>물을 먹으면 전기가 통하므로</strong> 질량 증가율을 1 [%] 미만으로 막는다.<br><strong>여섯 항목이 「뚫림 · 충격 · 전압 · 물 · 불 · 턱끈」</strong>이다 — <strong>불에 관한 것은 「난연성」이지 「내열성」이 아니다</strong>. <strong>한 낱말만 바꿔 놓았다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">안전모의 성능시험 기준</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">시험</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대상</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>내수성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>질량 증가율 1 [%] 미만</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>AE · ABE</u> (내전압성이 있는 것)</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>내전압성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>교류 20 [kV]에서 1분간 견디고 누설전류 10 [mA] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>AE · ABE</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>내관통성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>관통거리 9.5 [mm] 이하</u> (AE · ABE) · 11.1 [mm] 이하 (AB)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>충격흡수성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전달충격력 4,450 [N] 미만</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 보호구 안전인증 고시</em></p>", "nq": 2}, "card_mgt_t268": {"kind": "단답형", "fq": 1, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "통계적 원인분석", "front": "통계적 원인분석은?", "back": "<strong>「위험분포도」라는 분석방법은 없다</strong>.<p><strong>◈ 암기</strong> <u>파레토 · 특성요인 · 크로스 · 관리도</u>.</p><p><strong>네 방법이 「막대(파레토) · 생선뼈(특성요인) · 표(크로스) · 꺾은선(관리도)」</strong>로 그림 모양이 다 다르다. <strong>「분포도」는 그 넷에 없다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">통계적 원인분석의 방법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>파레토도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사고의 유형·기인물 등을 큰 순서대로 막대로 그린다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">중점 대상을 찾는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>특성요인도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>결과(특성)에 원인을 생선뼈 모양으로 잇는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">어골도</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>클로즈(크로스)분석</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>두 요인의 관계를 표로 나타낸다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">2개 이상의 상호관계</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>관리도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>월별 재해건수의 추이를 관리선으로 본다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">UCL · CL · LCL</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험분포도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>없는 이름</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_mgt_t269": {"kind": "공식형", "fq": 1, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "도수율", "front": "도수율의 식은?", "back": "연근로시간은 $1 {,} 000 \\times 48 \\times 50 \\times 0.97 = 2 {,} 328 {,} 000$ 시간이다. $\\dfrac{100}{2 {,} 328 {,} 000} \\times 10^{6} \\fallingdotseq 42.96$이다.<p><strong>◈ 암기</strong> <u>결근시간은 빼고 셈한다</u>.</p><p><strong>「실제로 일한 시간」이 분모</strong>다 — <strong>결근한 3%는 일하지 않았으므로 빼야</strong> 한다. <strong>빼지 않은 값이 보기에 함께 놓여</strong> 있다.</p><div style=\"margin:12px 0 2px;font-weight:700\">도수율의 셈</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">셈</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>① 총 근로시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1,000 × 48 × 50 = 2,400,000 시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>② 결근 3%를 뺀다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>2,400,000 × 0.97 = 2,328,000 시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>여기서 갈린다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>③ 도수율</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{100}{2 {,} 328 {,} 000} \\times 10^{6} = 42.96$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>결근을 빼지 않으면</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>41.67</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>③으로 끌린다</u></td></tr></tbody></table></div>", "nq": 1}, "card_mgt_t270": {"kind": "단답형", "fq": 2, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "파레토도", "front": "파레토도는?", "back": "<strong>파레토도</strong>다. <strong>큰 것부터 차례로 늘어놓아 중점 대상을 찾는다</strong>.<p><strong>◈ 암기</strong> <u>큰 순서대로 도표화하면 파레토도</u>.</p><p><strong>「큰 순서대로」</strong>라는 말이 곧 파레토도다 — <strong>앞의 몇 항목이 전체의 대부분을 차지한다(2 : 8 법칙)</strong>는 데서 나온 방법이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">통계적 원인분석의 방법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">쓰임</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>파레토도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>분류항목을 큰 순서대로 막대로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>중점 관리대상을 고른다</u> · 이 문항</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>특성요인도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>결과와 원인을 생선뼈 모양으로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">원인을 낱낱이 펼친다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>클로즈(크로스)분석</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>두 요인의 관계를 표로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>관리도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>월별 추이를 관리선과 견준다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">목표관리</td></tr></tbody></table></div>", "nq": 1}, "card_mgt_t243": {"kind": "공식형", "fq": 1, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "강도율", "front": "강도율의 식은?", "back": "<ul><li>강도율은 <strong>연근로시간 1,000시간당 근로손실일수</strong>다. <strong>「건수」가 아니라 「일수」</strong>다.</li><li>연근로시간은 $300 \\times 48 \\times 50 = 720 {,} 000$ 시간이다. $\\dfrac{800}{720 {,} 000} \\times 1 {,} 000 \\fallingdotseq 1.11$이다.</li><li>$\\text{강도율} = \\dfrac{\\text{근로손실일수}}{\\text{연근로시간수}} \\times 1 {,} 000$$\\text{근로손실일수} = 0.4 \\times \\dfrac{1 {,} 000 \\times 2 {,} 400}{1 {,} 000} = 960 \\, \\text{일}$</li></ul><p><strong>◈ 암기</strong> <u>강도율은 1,000시간당 근로손실일수</u>. · $\\text{강도율} = \\dfrac{\\text{근로손실일수}}{\\text{연근로시간}} \\times 1 {,} 000$.</p><p><strong>도수율은 「몇 번」, 강도율은 「며칠」</strong>이다 — <strong>강도율이 「건」으로 적힌 보기는 그것만으로 걸러진다</strong>. <strong>분모가 1,000시간이라는 것도 도수율(100만 시간)과 다르다</strong>.<br><strong>재해건수 200건은 도수율에 쓰는 값</strong>이라 이 문항에서는 쓰이지 않는다 — <strong>문제에 준 값을 다 쓰려 하면 틀린다</strong>. <strong>강도율에 필요한 것은 「근로손실일수」와 「연근로시간」</strong> 둘뿐이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">재해율 지표가 뜻하는 것</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">지표</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>강도율</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{근로손실일수}}{\\text{연근로시간수}} \\times 1 {,} 000$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1,000시간당 잃은 날수</u> · 이 문항</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>도수율</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{재해건수}}{\\text{연근로시간수}} \\times 10^{6}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">100만 시간당 재해건수</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>연천인율</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{연간 재해자수}}{\\text{연평균 근로자수}} \\times 1 {,} 000$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">근로자 1,000명당 재해자수</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>종합재해지수</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\sqrt{\\text{도수율} \\times \\text{강도율}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 4}, "card_erg_t285": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "미니멀 컷셋", "front": "미니멀 컷셋은?", "back": "<strong>다른 컷셋을 품고 있는 것을 걷어 내고 남은</strong> 컷셋이 미니멀 컷셋이다.<p><strong>◈ 암기</strong> <u>남을 품은 컷셋을 걷어 낸 것</u>.</p><p><strong>「미니멀」이라는 말이 곧 「더 줄일 수 없다」</strong>는 뜻이다 — <strong>컷셋 {A, B} 가 있으면 {A, B, C} 는 군더더기라 걷어 낸다</strong>. <strong>③은 컷셋의 정의일 뿐 「미니멀」이 빠져</strong> 있다.</p><div style=\"margin:12px 0 2px;font-weight:700\">컷셋 · 미니멀 컷셋 · 패스셋</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>컷셋</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>동시에 일어나면 정상사상이 나는 기본사상의 집합</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>③이 이 설명</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>미니멀 컷셋</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>컷셋 가운데 다른 컷셋을 품은 것을 걷어 내고 남은 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>① — 이 문항</u> · 더 줄일 수 없는 최소 집합</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertic ;vertical-align:middle;text-align:left;\"><u>①②③은 그 가운데 하나씩</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t287": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "휴먼에러의 분류", "front": "휴먼에러의 분류는?", "back": "<strong>규칙 기반 착오</strong>다. <strong>몸에 밴 규칙(우측 통행)을 그 규칙이 통하지 않는 곳에 그대로 적용</strong>했다.<p><strong>◈ 암기</strong> <u>익숙한 규칙을 엉뚱한 데 쓰면 규칙 기반 착오</u>.</p><p><strong>「규칙은 알고 있는데 그 규칙이 여기서는 통하지 않는다」</strong>는 것이 규칙 기반 착오다 — <strong>아예 몰랐다면 지식 기반, 알고도 어겼다면 위반</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">라스무센·리즌의 휴먼에러 분류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>숙련 기반 에러</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>익숙한 동작을 하다 실수하거나 잊는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">실수(slip) · 건망증(lapse)</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>규칙 기반 착오</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>아는 규칙을 잘못 적용한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>우측통행 나라의 규칙을 좌측통행 나라에서</u> · 이 문항</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지식 기반 착오</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>아는 것이 모자라 판단을 그르친다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">처음 겪는 상황</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위반(violation)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>알면서 일부러 어긴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t288": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "페일세이프의 구조", "front": "페일세이프의 구조는?", "back": "넷은 <strong>다경로하중구조 · 하중경감구조 · 교대구조 · 중복구조</strong>다. <strong>「격리구조」는 들지 않는다</strong>.<p><strong>◈ 암기</strong> <u>다경로 · 하중경감 · 교대 · 중복</u>.</p><p><strong>넷이 모두 「하중을 어떻게 나눠 받나」</strong>를 말한다 — <strong>여러 길로 · 나눠서 · 대신 · 겹쳐서</strong>. <strong>「격리」는 떼어 놓는 것</strong>이라 하중과 관계가 없다.</p><div style=\"margin:12px 0 2px;font-weight:700\">페일세이프(fail safe)의 구조적 방법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구조</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>다경로하중구조</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>하중이 여러 길로 나뉘어 하나가 끊겨도 버틴다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>하중경감구조</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>한 부재가 망가지면 다른 부재가 하중을 나눠 받는다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>교대구조</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>예비 부재가 대신 받는다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>중복구조</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>같은 것을 겹쳐 둔다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>격리구조</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>페일세이프의 구조가 아니다</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t229": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "위험조정기술", "front": "위험조정기술은?", "back": "<ul><li>넷은 <strong>회피 · 감축 · 보류 · 전가</strong>다. <strong>「확인」은 들지 않는다</strong>.</li><li>넷은 <strong>회피 · 감축 · 보류 · 전가</strong>다. <strong>「책임」은 들지 않는다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>회피 · 감축 · 보류 · 전가</u>.</p><p><strong>「피하고 · 줄이고 · 떠안고 · 넘긴다」</strong> 넷이다. <strong>「확인」은 위험을 찾아내는 일(위험분석)이지 조정하는 방법이 아니다</strong>.<br><strong>「피하고 · 줄이고 · 떠안고 · 넘긴다」</strong> 넷이다 — <strong>네 낱말이 모두 「위험을 어떻게 다룰까」</strong> 인데 <strong>「책임」은 그 결과를 누가 지느냐</strong>의 문제다.</p><div style=\"margin:12px 0 2px;font-weight:700\">위험조정기술 네 가지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기술</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>회피(avoidance)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위험한 일을 아예 하지 않는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>감축(reduction)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>일어날 확률이나 크기를 줄인다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">방호장치 · 교육</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>보류(retention)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작은 위험은 스스로 떠안는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">자가보험</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전가(transfer)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>남에게 넘긴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>보험 가입 · 도급</u></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t224": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "인간-기계 시스템 설계의 단계", "front": "인간-기계 시스템 설계의 단계는?", "back": "<ul><li><strong>보조물 설계</strong>는 <strong>제5단계</strong>다. 기본설계 단계의 성능 특성이 아니다.</li><li><strong>제2단계 시스템의 정의</strong>에서 <strong>목표를 이루려면 어떤 기능이 필요한가</strong>를 정한다.</li><li><strong>기본설계(제3단계)</strong>다. <strong>기능을 나누고 직무를 짜는</strong> 단계다.</li></ul><p><strong>◈ 암기</strong> <u>보조물 설계는 5단계</u>. · <u>기능 정의는 2단계</u>.</p><p><strong>기본설계에서 정하는 인간 성능 요건은 「속도 · 정확성 · 사용자 만족 · 익히는 데 드는 시간」</strong> 넷이다. <strong>보조물은 그 뒤에 만드는 물건</strong>이라 단계가 다르다.<br><strong>「목표(1) → 기능(2) → 기능의 배분과 직무(3) → 계면(4) → 보조물(5) → 평가(6)」</strong>로 좁혀 든다. <strong>「기능을 정의」한다는 말이 그대로 2단계의 이름</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인간-기계 시스템 설계의 6단계</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>목표와 성능명세의 결정</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시스템의 정의</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기본설계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기능 할당 · 인간 성능 요건 명세 · 직무분석 · 작업설계</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>계면(인터페이스) 설계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">표시장치와 조종장치</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>5</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>촉진물(보조물) 설계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>지시서 · 설명서 · 훈련도구</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>6</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시험과 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 3}, "card_erg_t289": {"kind": "용어형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "인간의 오류모형", "front": "인간의 오류모형이란?", "back": "<strong>실수(slip)</strong>다. <strong>하려던 일은 맞는데 손이 다르게 움직인</strong> 것이다.<p><strong>◈ 암기</strong> <u>해석은 맞고 행동이 어긋나면 실수</u>.</p><p><strong>「머리는 맞고 손이 틀렸으면 실수, 머리부터 틀렸으면 착오」</strong>다 — <strong>「해석은 정확하나」라는 단서가 그대로 실수</strong>를 가리킨다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인간의 오류모형</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">모형</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>착오(mistake)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>상황이나 목표의 해석 자체가 틀렸다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">가려던 곳을 잘못 알았다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>실수(slip)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>해석은 맞는데 행동이 어긋났다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>누르려던 것과 다른 버튼을 눌렀다</u> · 이 문항</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>건망증(lapse)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기억이 끊겨 해야 할 일을 잊었다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위반(violation)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>알면서 일부러 어겼다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t290": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "위험성 평가 매트릭스", "front": "위험성 평가 매트릭스는?", "back": "<strong>「전혀 발생하지 않는(impossible)」</strong>이라는 등급은 없다.<p><strong>◈ 암기</strong> <u>「전혀 발생하지 않는」 등급은 없다</u>.</p><p><strong>「전혀 없다」고 잘라 말할 수 있는 위험은 없다</strong> — <strong>그래서 가장 낮은 등급도 「극히 ~하지 않을 것 같은」</strong>이라는 조심스러운 말로 둔다. <strong>위험강도는 파국적 · 위기적 · 한계적 · 무시가능</strong> 넷이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">MIL-STD-882B의 발생빈도 다섯 등급</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">등급</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>자주 발생하는(frequent)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>보통 발생하는(reasonably probable)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>가끔 발생하는(occasional)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>거의 발생하지 않는(remote)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>극히 발생하지 않을 것 같은(extremely improbable)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전혀 발생하지 않는(impossible)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>없는 등급</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t245": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "FMEA 의 고장평점법", "f  하는 것은 <strong>정량적 판독</strong>을 위한 것이다.</li></ul><p><strong>◈ 암기</strong> <u>숫자를 그대로 보이면 정량적</u>. · <u>세부 확대는 정량적 판독</u>.</p><p><strong>정성적 표시장치도 바탕은 숫자</strong>지만, <strong>그 숫자를 「정상 · 주의 · 위험」 같은 구간으로 바꿔 보여 준다</strong>. <strong>숫자를 그대로 보여 주면 정량적</strong>이다.<br><strong>정성적 판독은 「정확한 값이 아니라 상태를 본다」</strong> — <strong>정상인가 · 오르는가 · 범위 안인가</strong>. <strong>「세부를 확대해 정확히 읽는다」는 정량적</strong> 쪽이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">정량적 표시장치와 정성적 표시장치</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">정량적 표시장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">정성적 표시장치</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">무엇을 보나</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정확한 값</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>대략의 값 · 변화 추세 · 정상 여부</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">형태</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>계수형(숫자) · 동침형 · 동목형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>색 부호 · 형상 부호 · 구간 표시</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">보기</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전력계의 숫자 · 디지털 온도계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>자동차 연료계 · 정상/주의/위험 구간</u></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t298": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "정성적 평가의 항목", "front": "정성적 평가의 항목은?", "back": "<strong>원재료와 중간제품</strong>은 <strong>운전관계</strong> 항목이다.<p><strong>◈ 암기</strong> <u>원재료·중간제품은 운전관계</u>.</p><p><strong>「어디에 · 어떻게 배치해 · 무엇으로 지었나」는 설계, 「무엇을 · 어떤 공정으로 다루나」는 운전</strong>이다. <strong>물질의 이름이 나오면 운전관계</strong>다.</p><div style=\"margin:12px 0 2px;font-weight:700\">안전성 평가 제2단계 — 정성적 평가</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>설계관계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>입지조건 · 공장 내 배치 · 건조물 · 소방설비</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>짓는 데 관한 것</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>운전관계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>원재료·중간체·제품 · 공정 · 수송·저장 · 공정기기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>돌리는 데 관한 것</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t299": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "시각 영역의 구분", "front": "시각 영역의 구분은?", "back": "<strong>유도시야</strong>의 설명만 옳다. <strong>①②③은 판별·유효·보조시야의 뜻을 서로 바꿔</strong> 놓았다.<p><strong>◈ 암기</strong> <u>공간좌표 감각에 영향을 주면 유도시야</u>.</p><p><strong>「판별 → 유효 → 유도 → 보조」</strong> 순으로 넓어지고 흐려진다 — <strong>가운데가 또렷하고 가장자리로 갈수록 「있다」는 것만 안다</strong>. <strong>①과 ②의 설명이 서로 바뀌어</strong> 있다.</p><div style=\"margin:12px 0 2px;font-weight:700\">작업자의 시각 영역</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">시야</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>판별시야</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시력·색판별 등 시각 기능이 뛰어나 정밀도 높은 정보를 받는 범위</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>②가 이 설명</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>유효시야</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안구운동만으로 주시해 순간적으로 특정 정보를 받는 범위</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>①이 이 설명</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>유도시야</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정보의 존재만 알아챌 뿐이나 공간좌표 감각에 영향을 주는 범위</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>④ — 이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>보조시야</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>거의 식별되지 않고 머리를 돌려야 주시할 수 있는 범위</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>③은 유효시야 밖의 설명과 뒤섞였다</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t300": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "음량의 척도", "front": "음량의 척도는?", "back": "<strong>HSI(열압박지수)</strong>는 <strong>더위</strong>를 나타내는 지수다. 음량과 관계없다.<p><strong>◈ 암기</strong> <u>HSI는 열압박지수</u>.</p><p><strong>셋은 소리, 하나는 더위</strong>다 — <strong>HSI의 H가 Heat</strong>라는 것만 알면 곧 갈린다. <strong>phon과 sone의 관계(10 [phon] 마다 2배)</strong>도 함께 잡아 둔다.</p><div style=\"margin:12px 0 2px;font-weight:700\">음량의 척도</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">척도</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>dB(데시벨)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>음압수준</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>phon(폰)</u></td>  solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>10% 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t287": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "전격 재해의 범위", "front": "전격 재해의 범위는?", "back": "<strong>전격 재해는 감전 그 자체와 그로 인한 2차 재해(추락 · 전도)를 아우른다</strong>.<p><strong>◈ 암기</strong> <u>2차적인 추락·전도까지 아우른다</u>.</p><p><strong>감전 자체보다 「놀라 떨어져」 다치는 일이 더 잦다</strong> — <strong>그래서 전격 재해에 2차 재해까지 넣는다</strong>. <strong>①③④는 모두 범위를 지나치게 좁힌</strong> 설명이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">전격 재해</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1차 재해</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>감전에 의한 상해</u> — 심실세동 · 화상 · 근육 수축</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2차 재해</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>감전에 놀라 떨어지거나 넘어져 다치는 것</u> — 추락 · 전도</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>범위</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>두 가지를 모두 아우른다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정전기 재해</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>에너지가 작아 사망은 드물지만 놀라 떨어지는 2차 재해가 흔하다</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t288": {"kind": "공식형", "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "심실세동전류", "front": "심실세동전류의 식은?", "back": "<ul><li><strong>치사적 전류</strong>다. <strong>심장이 잔떨림에 빠져 피를 돌리지 못한다</strong>.</li><li>$I = \\dfrac{165}{\\sqrt{T}} = \\dfrac{165}{\\sqrt{1}} = 165 \\, \\mathrm{mA}$</li></ul><p><strong>◈ 암기</strong> <u>심실세동전류는 치사적 전류</u>. · <u>심실세동전류 = 165 ÷ √T mA</u>.</p><p><strong>다섯 이름이 「느낌 → 아픔 → 뗄 수 있음 → 못 뗌 → 죽음」</strong> 순으로 이어진다 — <strong>심실세동이 마지막</strong>이라 치사적이다.<br><strong>165라는 수와 「√T로 나눈다」</strong> 두 가지만 외우면 된다 — <strong>통전시간이 길수록 더 작은 전류로도 심실세동</strong>이 일어난다.</p><div style=\"margin:12px 0 2px;font-weight:700\">통전전류의 이름과 뜻</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">전류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최소감지전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">찌릿함을 느낀다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>고통한계전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>7 ~ 8 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">참을 수 있는 한계</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>가수(이탈가능)전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>10 ~ 15 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">스스로 손을 뗄 수 있다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>불수(마비한계)전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>20 ~ 50 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">근육이 굳어 손을 뗄 수 없다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>심실세동전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>50 ~ 100 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>치사적 전류</u> · 이 문항</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t289": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "", "mid": "화염일주한계와 폭발등급", "front": "화염일주한계와 폭발등급은?", "back": "<strong>내용적 8,000 [cm³], 접합면 안길이 25 [mm]</strong>다.<p><strong>◈ 암기</strong> <u>내용적 8,000 [cm³], 안길이 25 [mm]</u>.</p><p><strong>보기의 0.4와 0.6은 폭발등급의 경계값</strong>이라 눈에 익어 끌린다 — <strong>여기서 묻는 것은 「용기의 치수」</strong>이지 등급의 경계가 아니다. <strong>8,000 [cm³]와 25 [mm]</strong>라는 짝을 잡아 둔다.</p><div style=\"margin:12px 0 2px;font-weight:700\">폭발등급 측정용 표준용기</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">값</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>내용적</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>8,000 [cm³]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">= 8 [L]</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>반구상 플랜지 접합면의 안길이</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>25 [mm]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>재는 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>화염일주한계(최대안전틈새 · MESG)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>폭발등급 1등급</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.6 [mm] 초과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">메탄 · 프로판</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>폭발등급 2등급</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.4 [mm] 초과 0.6 [mm] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">에틸렌</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>폭발등급 3등급</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.4 [mm] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">수소 · 아세틸렌</td></tr></tbody></table></div>", "nq": 1}, "card_ele_t290": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "", "mid": "과도전류의 허용한계", "front": "과도전류의 허용한계의 식은?", "back": "<strong>40 [mA] 이하</strong>다.<p><strong>◈ 암기</strong> <u>파두장 700 [μs]는 40 [mA]</u>.</p><p><strong>「오래 흐를수록 견딜 수 있는 전류가 작아진다」</strong>는 방향은 심실세동전류 $I = 165 / \\sqrt{T}$와 같다. <strong>보기가 10배씩 벌어져 있어 자릿수만 맞춰도</strong> 좁혀진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인체의 과도전류 허용한계</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무엇</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>아주 짧은 시간 흐르는 과도전류가 인체에 견딜 수 있는 파고치의 한계</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>관계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>파두장이 길수록(오래 흐를수록) 허용 파고치가 작아진다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>파두장 700 [μs]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>40 [mA] 이하</u> · 이 문항</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>통전경로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>손에서 발까지</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t291": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "유입방폭구조와 IP 등급", "front": "유입방폭구조와 IP 등급은?", "back": "<strong>IP66</strong>이다. <strong>기름이 새거나 물이 들어가면 방폭이 무너지기</strong> 때문이다.<p><strong>◈ 암기</strong> <u>유입방폭구조는 IP66 이상</u>.</p><p><strong>유입방폭구조는 「불꽃이 나는 부분을 기름에 담가」</strong> 두는 것이다 — <strong>기름이 새거나 물·먼지가 들어가면 그 원리가 무너진다</strong>. <strong>그래서 가장 높은 축인 IP66</strong>을 요구한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">IP 등급의 읽는 법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">자리</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>첫째 자리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>고체(먼지)를 얼마나 막나</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>6 = 완전 방진</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>둘째 자리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>물을 얼마나 막나</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>6 = 강한 물줄기에도 견딤</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>IP66</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>먼지가 전혀 들어가지 않고 강한 물줄기에도 견딘다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>유입방폭구조 o의 최소 등급</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t232": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "위험장소의 분류", "front": "위험장소의 분류는?", "back": "<ul><li><strong>장소에 걸맞은 방폭구조를 고르고 과하지도 모자라지도 않게 맞추기</strong> 위해서다.</li><li><strong>2종 장소</strong>다. <strong>이상이 생겼을 때에만 잠깐 폭발분위기가 만들어진다</strong>.</li><li><strong>0종 장소</strong>다. <strong>「지속적으로 또는 장기간」</strong>이라는 말이 곧 0종이다.</li></ul><p><strong>◈ 암기</strong> <u>방폭설비 선정과 방폭 협조</u>. · <u>이상 시에만 위험하면 2종</u>.</p><p><strong>0종에 값싼 설비를 두면 위험하고, 2종에 본질안전을 다 깔면 낭비</strong>다 — <strong>「균형 있는 방폭 협조」</strong>라는 말이 그 뜻이다.<br><strong>「늘 · 가끔 · 이상 시」</strong> 세 마디로 갈린다. <strong>「부식 · 열화 · 파손 · 고장」처럼 정상이 아닌 사태를 전제하는 말이 붙으면 2종</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">위험장소를 나누는 까닭</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>목적</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>장소마다 알맞은 방폭전기설비를 고르기 위해</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>방폭 협조</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위험의 정도와 설비의 등급을 균형 있게 맞춘다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>과하면</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>돈이 많이 든다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>모자라면</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>폭발 위험이 남는다</u></td></tr></tbody></table></div>", "nq": 3}, "card_ele_t292": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "폭발위험장소의 설정", "front": "폭발위험장소의 설정은?", "back": "<strong>종이 같은 가연성 물질</strong>은 <strong>불에는 타지만 폭발분위기를 만들지는 않는다</strong>.<p><strong>◈ 암기</strong> <u>덩어리진 가연물은 화재위험장소</u>.</p><p><strong>폭발은 「공기와 고루 섞인 기체나 가루」</strong>라 <td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>④ 인체전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>175 ÷ 3,000 = 58 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t295": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기설비", "mid": "저압전로의 절연저항", "front": "저압전로의 절연저항은?", "back": "옛 기준으로 <strong>400 [V] 미만은 0.3 [MΩ] 이상</strong>이다.<p><strong>◈ 암기</strong> <u>옛 기준 400 [V] 미만은 0.3 [MΩ]</u>.</p><p><strong>옛 기준은 「0.1 · 0.2 · 0.3 · 0.4」 네 칸</strong> 이었고 <strong>380 [V]는 400 [V] 미만이라 0.3</strong>이다. <strong>KEC는 이를 세 줄로 줄이고 값도 올렸다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">저압전로의 절연저항</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">전로의 사용전압</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">절연저항</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>SELV · PELV</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.5 [MΩ] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">시험전압 DC 250 [V]</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>FELV · 500 [V] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1.0 [MΩ] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">DC 500 [V]</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>500 [V] 초과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1.0 [MΩ] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">DC 1,000 [V]</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>옛 기준</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>400 [V] 미만 0.3 [MΩ], 400 [V] 이상 0.4 [MΩ]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t296": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기설비", "mid": "전동기 간선의 과전류차단기", "front": "전동기 간선의 과전류차단기의 식은?", "back": "전동기 정격전류의 합은 45 [A], 그 밖의 부하는 60 [A]다. 간선의 허용전류는 $45 \\times 1.1 + 60 = 109.5$ [A]이므로 차단기는 $45 \\times 3 + 60 = 195$ [A] 이하이면서 허용전류의 2.5배 이하 — <strong>보기 가운데 200 [A]</strong>이 답이다.<p><strong>◈ 암기</strong> <u>전동기 합 × 3 + 그 밖의 부하</u>.</p><p><strong>전동기는 기동할 때 정격의 몇 배가 흐르므로 차단기를 넉넉히</strong> 잡는다 — <strong>「전동기 정격의 3배 + 그 밖의 부하」</strong>와 <strong>「간선 허용전류의 2.5배」</strong> 가운데 작은 쪽으로 정한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">전동기 간선의 과전류차단기</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전동기 정격전류의 합</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>20 + 25 = 45 [A]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>그 밖의 부하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>10 × 6 = 60 [A]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>간선의 허용전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>45 × 1.1 + 60 = 109.5 [A]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">합이 50 [A] 이하이면 1.25배</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>차단기의 정격</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전동기 합 × 3 + 그 밖의 부하 = 195 [A]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">허용전류의 2.5배와 견주어 작은 쪽</td></tr></tbody></table></div>", "nq": 1}, "card_ele_t079": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기화재", "mid": "피뢰기의 설치장소", "front": "피뢰기의 설치장소는?", "back": "<ul><li>배전용 변압기의 <strong>고압측</strong>에 단다. <strong>저압측</strong>이 아니다.</li><li><strong>저압 수용장소</strong>는 피뢰기 설치대상이 아니다. <strong>특고압에서 공급받는 수용장소</strong>라야 한다.</li></ul><p><strong>◈ 암기</strong> <u>배전용 변압기는 고압측</u>. · <u>저압 수용장소는 대상이 아니다</u>.</p><p><strong>벼락은 가공전선을 타고 들어온다</strong>. 그래서 <strong>들어오는 쪽(고압측·인입구)</strong>에 달아 <strong>안쪽 설비로 넘어가기 전에</strong> 대지로 흘려보낸다.<br><strong>네 장소가 모두 「고압·특고압이 드나드는 목」</strong>이다 — <strong>벼락 서지는 그 목을 타고 들어온다</strong>. <strong>저압까지 내려온 뒤에는 변압기가 이미 막아 준다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">피뢰기의 설치장소 네 곳</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">설치장소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>발전소·변전소의 가공전선 인입구 및 인출구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">중요 설비를 지킨다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>고압 가공전선로에 접속하는 배전용 변압기의 고압측 및 특고압측</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>저압측이 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>고압 가공전선로로부터 공급받는 수용장소의 인입구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">수용가 보호</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>가공전선로와 지중전선로가 접속되는 곳</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">임피던스가 달라 반사파가 생긴다</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t221": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "접지", "mid": "접지의 원리", "front": "접지의 원리의 식은?", "back": "<ul><li><strong>흙 자체는 전기가 잘 통하지 않는다</strong>. <strong>단면적이 사실상 무한히 넓어</strong> 전체 저항이 0에 가까워지는 것이다.</li><li><strong>흙 자체는 전기가 잘 통하지 않는다</strong>. <strong>단면적이 사실상 무한히 넓어</strong> 전체 저항이 작아지는 것이다.</li></ul><p><strong>◈ 암기</strong> <u>넓어서 저항이 0에 가깝다</u>. · <u>넓어서 저항이 작다</u>.</p><p>$R = \\rho \\dfrac{l}{A}$에서 <strong>대지는 A가 사실상 무한대</strong>라 <strong>저항률 </strong>$\\rho$<strong>가 커도 전체 저항이 작아진다</strong>. <strong>저항의 대부분은 전극 가까운 좁은 곳에서 생기므로</strong> <strong>전극을 깊고 넓게 묻는 것</strong>이 효과가 크다.<br>$R = \\rho \\dfrac{l}{A}$에서 <strong>대지는 A가 사실상 무한대</strong>라 <strong>저항률이 커도 전체 저항이 작아진다</strong>. <strong>성분을 드는 보기 셋은 모두 걸러진다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">대지를 접지로 쓰는 까닭</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>대지는 넓어 전류가 지날 길이 무수히 많다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$R = \\rho \\dfrac{l}{A}$에서 <u>A가 무한대</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>그래서 전체 저항이 0에 가깝다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>흙의 성분(규소·알루미나·철분)은 까닭이 아니다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>흙 자체는 저항이 크다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접지저항의 대부분은 전극 바로 둘레에서 생긴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">전극을 깊고 넓게 · 접지저항 저감제</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t297": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "접지", "mid": "정전기와 배관 내 유속", "front": "정전기와 배관 내 유속은?", "back": "이황화탄소처럼 <strong>위험한 액체는 유속을 1 [m/s] 이하</strong>로 낮춘다. <strong>「2.5 [m/s] 이상」이 정반대</strong>다.<p><strong>◈ 암기</strong> <u>이황화탄소는 1 [m/s] 이하</u>.</p><p><strong>유동대전은 유속이 빠를수록 커진다</strong> — <strong>위험한 액체일수록 천천히 흘려야</strong> 한다. <strong>「2.5 [m/s] 이상으로 한다」는 방향이 정반대</strong>다.</p><div style=\"margin:12px 0 2px;font-weight:700\">배관 내 유속의 제한</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">유속</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>이황화탄소 등 위험성이 높은 액체</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 [m/s] 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>저항률 10¹⁰ [Ω·cm] 미만인 도전성 위험물</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>7 [m/s] 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물이나 기체를 혼합한 비수용성 위험물</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 [m/s] 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>그 밖의 위험물</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>관 지름에 따라 정한 값 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>까닭</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>유속이 빠를수록 유동대전이 커진다</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t223": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "정전기", "mid": "정전기의 발생요인", "front": "정전기의 발생요인은?", "back": "<ul><li><strong>물의 음이온</strong>은 정전기 발생요인이 아니다.</li><li><strong>물체의 질량</strong>은 정전기 발생요인이 아니다.</li><li><strong>표면이 오염되면 정전기 발생이 커진다</strong>. 나머지 셋은 <strong>방향이 모두 뒤집혀</strong> 있다.</li></ul><p><strong>◈ 암기</strong> <u>특성 · 표면 · 이력 · 면적압력 · 분리속도</u>. · <u>표면이 오염되면 커진다</u>.</p><p>다섯 요인은 <strong>특성 · 표면상태 · 이력 · 접촉면적과 압력 · 분리속도</strong>다. <strong>물은 오히려 습도를 높여 정전기를 줄이는 쪽</strong>이라 발생요인 목록에 들어가지 않는다.<br><strong>다섯 요인이 모두 「닿는 면과 떨어지는 방식」</strong>에 관한 것이다 — <strong>질량은 무게일 뿐 전하가 갈리는 것과 무관</strong>하다.</p><div style=\"margin:12px 0 2px;font-weight:700\">정전기 발생에 영향을 주는 요인</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">요인</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물체의 특성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>대전서열이 멀수록 크다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물체의 표면상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>거칠거나 오염되면 크다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-ali ;\">위험</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>니트로셀룰로오스 + 알코올</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>낮다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>적셔 두면 마찰·충격에 안정</u> · 이 문항</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>나트륨 + 알코올</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">알코올과 반응해 수소 발생</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>염소산칼륨(산화성) + 유황(가연성)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">산소를 주는 쪽 + 받는 쪽</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>황화인(가연성) + 무기과산화물(산화성)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">같은 짝</td></tr></tbody></table></div>", "nq": 1}, "card_chm_t052": {"kind": "공식형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "불활성화(퍼지)", "front": "불활성화(퍼지)의 식은?", "back": "<ul><li><strong>일산화탄소는 그 자체가 가연성 가스</strong>다. 폭발범위가 12.5~74 [%]로 넓어 오히려 위험을 키운다.</li><li>압력퍼지가 <strong>더 빠르다</strong>. <strong>불활성기체를 밀어 넣는 것이 공기를 빼내는 것보다 빠르기</strong> 때문이다.</li><li><strong>수증기</strong>는 <strong>응축해 사라지므
