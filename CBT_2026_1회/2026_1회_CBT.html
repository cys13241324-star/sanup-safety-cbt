>르 샤틀리에 식</strong>으로 따로 구한다. $\\dfrac{100}{L} = \\sum \\dfrac{V_{i}}{L_{i}}$ 로 하한을, $\\dfrac{100}{U} = \\sum \\dfrac{V_{i}}{U_{i}}$ 로 상한을 구하면 <strong>3.75 ~ 13.21 [%]</strong>가 나온다.", "w": "② 하한을 잘못 구했다.<br>③ 하한과 상한 모두 어긋난다.<br>④ 상한을 잘못 구했다.", "pt": "<strong>혼합가스의 폭발범위 계산</strong><br>혼합가스의 폭발범위는 <u>하한과 상한을 각각 따로</u> 계산한다. 한 번의 계산으로 둘 다 나오지 않는다는 점이 실수하기 쉬운 대목이다. 부피분율의 합이 100이 되는지 먼저 확인하는 습관을 들이면 계산 실수를 줄일 수 있다.<p><strong>◈ 암기</strong> <u>하한과 상한을 각각 따로</u> 계산한다.</p>", "law": "", "card": "card_chm_t020"}, {"n": 101, "s": 6, "a": 4, "lv": 1, "fq": 2, "kind": "개념형", "t": "달비계에 사용하는 와이어로프의 사용금지 기준으로 옳지 않은 것은?", "c": ["이음매가 있는 것", "열과 전기 충격에 의해 손상된 것", "지름의 감소가 공칭지름의 7%를 초과하는 것", "와이어로프의 한 꼬임에서 끊어진 소선의 수가 7% 이상 인 것"], "cond": "", "img": "", "sol": "소선 절단 기준은 <strong>한 꼬임에서 10 [%] 이상</strong>이다. 7 [%] 가 아니다. <strong>지름 감소는 7 [%] 초과, 소선 절단은 10 [%] 이상</strong>으로 두 숫자가 서로 다른데, 이를 바꿔 놓는 것이 자주 나오는 함정이다.", "w": "① 이음매가 있는 것은 쓸 수 없다.<br>② 열과 전기 충격으로 손상된 것도 쓸 수 없다.<br>③ 지름 감소가 공칭지름의 7 [%] 를 초과하면 쓸 수 없다.", "pt": "<strong>안전보건규칙 제63조·제166조 — 와이어로프의 사용금지 기준</strong><br>안전보건규칙 제63조(달비계의 구조) 및 제166조. 폐기 기준 다섯 — <u>이음매가 있는 것 · 한 꼬임에서 소선 10 [%] 이상 절단 · 지름 감소 7 [%] 초과 · 꼬인 것 · 심하게 변형되거나 부식된 것 · 열이나 전기충격으로 손상된 것</u>. 「<u>소선 10, 지름 7</u>」로 붙든다.<p><strong>◈ 암기</strong> <u>소선 10 [%], 지름 7 [%]</u> — 두 숫자가 다르다.</p>", "law": "<details class=law><summary>⚖ 근거 법령 — 산업안전보건기준에 관한 규칙 제63조 · 산업안전보건기준에 관한 규칙 제166조<span class=eff>산업안전보건기준에 관한 규칙 시행 2026. 3. 2.</span></summary><div class=lawin><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C63%EC%A1%B0\" target=\"_blank\">제63조(달비계의 구조)</a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.</span></div><div class=t><div class=ln>① 사업주는 곤돌라형 달비계를 설치하는 경우에는 다음 각 호의 사항을 준수해야 한다. &lt;개정 2021.11.19&gt;</div><div class=ln> 1. 다음 각 목의 어느 하나에 해당하는 와이어로프를 달비계에 사용해서는 아니 된다.</div><div class=ln> 가. 이음매가 있는 것</div><div class=\"ln hit\"> 나. 와이어로프의 한 꼬임[(스트랜드(strand)를 말한다. 이하 같다)]에서 끊어진 소선(素線)[필러(pillar)선은 제외한다)]의 수가 10퍼센트 이상(비자전로프의 경우에는 <mark>끊어진 소선의 수가</mark> 와이어로프 호칭지름의 6배 길이 이내에서 4개 이상이거나 호칭지름 30배 길이 이내에서 8개 이상)인 것<span class=here>이 문항이 묻는 자리</span></div><div class=ln> 다. 지름의 감소가 공칭지름의 7퍼센트를 초과하는 것</div><div class=ln> 라. 꼬인 것</div><div class=\"ln hit\"> 마. <mark>심하게 변형되거나 부식된 것</mark><span class=here>이 문항이 묻는 자리</span></div><div class=ln> 바. 열과 전기충격에 의해 손상된 것</div><div class=ln> 2. 다음 각 목의 어느 하나에 해당하는 달기 체인을 달비계에 사용해서는 아니 된다.</div><div class=ln> 가. 달기 체인의 길이가 달기 체인이 제조된 때의 길이의 5퍼센트를 초과한 것</div><div class=ln> 나. 링의 단면지름이 달기 체인이 제조된 때의 해당 링의 지름의 10퍼센트를 초과하여 감소한 것</div><div class=ln> 다. 균열이 있거나 심하게 변형된 것</div><div class=ln> 3. 삭제&lt;2021.11.19&gt;</div><div class=ln> 4. 달기 강선 및 달기 강대는 심하게 손상ㆍ변형 또는 부식된 것을 사용하지 않도록 할 것</div><div class=ln> 5. 달기 와이어로프, 달기 체인, 달기 강선, 달기 강대는 한쪽 끝을 비계의 보 등에, 다른 쪽 끝을 내민 보, 앵커볼트 또는 건축물의 보 등에 각각 풀리지 않도록 설치할 것</div><div class=ln> 6. 작업발판은 폭을 40센티미터 이상으로 하고 틈새가 없도록 할 것</div><div class=ln> 7. 작업발판의 재료는 뒤집히거나 떨어지지 않도록 비계의 보 등에 연결하거나 고정시킬 것</div><div class=ln> 8. 비계가 흔들리거나 뒤집히는 것을 방지하기 위하여 비계의 보ㆍ작업발판 등에 버팀을 설치하는 등 필요한 조치를 할 것</div><div class=ln> 9. 선반 비계에서는 보의 접속부 및 교차부를 철선ㆍ이음철물 등을 사용하여 확실하게 접속시키거나 단단하게 연결시킬 것</div><div class=ln> 10. 근로자의 추락 위험을 방지하기 위하여 다음 각 목의 조치를 할 것</div><div class=ln> 가. 달비계에 구명줄을 설치할 것</div><div class=ln> 나. 근로자에게 안전대를 착용하도록 하고 근로자가 착용한 안전줄을 달비계의 구명줄에 체결(締結)하도록 할 것</div><div class=ln> 다. 달비계에 안전난간을 설치할 수 있는 구조인 경우에는 달비계에 안전난간을 설치할 것</div><div class=ln>② 사업주는 작업의자형 달비계를 설치하는 경우에는 다음 각 호의 사항을 준수해야 한다. &lt;신설 2021.11.19&gt;</div><div class=ln> 1. 달비계의 작업대는 나무 등 근로자의 하중을 견딜 수 있는 강도의 재료를 사용하여 견고한 구조로 제작할 것</div><div class=ln> 2. 작업대의 4개 모서리에 로프를 매달아 작업대가 뒤집히거나 떨어지지 않도록 연결할 것</div><div class=ln> 3. 작업용 섬유로프는 콘크리트에 매립된 고리, 건축물의 콘크리트 또는 철재 구조물 등 2개 이상의 견고한 고정점에 풀리지 않도록 결속(結束)할 것</div><div class=ln> 4. 작업용 섬유로프와 구명줄은 다른 고정점에 결속되도록 할 것</div><div class=ln> 5. 작업하는 근로자의 하중을 견딜 수 있을 정도의 강도를 가진 작업용 섬유로프, 구명줄 및 고정점을 사용할 것</div><div class=ln> 6. 근로자가 작업용 섬유로프에 작업대를 연결하여 하강하는 방법으로 작업을 하는 경우 근로자의 조종 없이는 작업대가 하강하지 않도록 할 것</div><div class=ln> 7. 작업용 섬유로프 또는 구명줄이 결속된 고정점의 로프는 다른 사람이 풀지 못하게 하고 작업 중임을 알리는 경고표지를 부착할 것</div><div class=ln> 8. 작업용 섬유로프와 구명줄이 건물이나 구조물의 끝부분, 날카로운 물체 등에 의하여 절단되거나 마모(磨耗)될 우려가 있는 경우에는 로프에 이를 방지할 수 있는 보호 덮개를 씌우는 등의 조치를 할 것</div><div class=ln> 9. 달비계에 다음 각 목의 작업용 섬유로프 또는 안전대의 섬유벨트를 사용하지 않을 것</div><div class=ln> 가. 꼬임이 끊어진 것</div><div class=ln> 나. 심하게 손상되거나 부식된 것</div><div class=ln> 다. 2개 이상의 작업용 섬유로프 또는 섬유벨트를 연결한 것</div><div class=ln> 라. 작업높이보다 길이가 짧은 것</div><div class=ln> 10. 근로자의 추락 위험을 방지하기 위하여 다음 각 목의 조치를 할 것</div><div class=ln> 가. 달비계에 구명줄을 설치할 것</div><div class=ln> 나. 근로자에게 안전대를 착용하도록 하고 근로자가 착용한 안전줄을 달비계의 구명줄에 체결(締結)하도록 할 것</div></div></div><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C166%EC%A1%B0\" target=\"_blank\">제166조(이음매가 있는 와이어로프 등의 사용 금지)</a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.</span></div><div class=t><div class=\"ln hit\">제166조(<mark>이음매가 있는</mark> 와이어로프 등의 사용 금지) 와이어 로프의 사용에 관하여는 제63조제1항제1호를 준용한다. 이 경우 \"달비계\"는 \"양중기\"로 본다. &lt;개정 2021.11.19, 2022.10.18&gt;<span class=here>이 문항이 묻는 자리</span></div></div></div></div></details>", "card": "card_con_t001"}, {"n": 102, "s": 6, "a": 3, "lv": 2, "fq": 3, "kind": "개념형", "t": "작업장 출입구 설치 시 준수해야 할 사항으로 옳지 않은 것은?", "c": ["출입구의 위치·수 및 크기가 작업장의 용도와 특성에 맞 도록 한다.", "출입구에 문을 설치하는 경우에는 근로자가 쉽게 열고 닫을 수 있도록 한다.", "주된 목적이 하역운반기계용인 출입구에는 보행자용 출 입구를 따로 설치하지 않는다.", "계단이 출입구와 바로 연결된 경우에는 작업자의 안전한 통행을 위하여 그 사이에 1.2m 이상 거리를 두거나 안 내표지 또는 비상벨 등을 설치한다."], "cond": "", "img": "", "sol": "하역운반기계용 출입구에는 <strong>보행자용 출입구를 따로 설치</strong> 해야 한다. 사람과 기계가 같은 문을 쓰면 충돌은 시간 문제다. <strong>사람과 차를 분리</strong> 하는 것이 통로 안전의 기본 원칙이다.", "w": "① 위치·수·크기를 용도와 특성에 맞게 한다.<br>② 문은 근로자가 쉽게 열고 닫을 수 있어야 한다.<br>④ 계단이 출입구와 바로 이어지면 1.2 [m] 이상 거리를 두거나 안내표지·비상벨을 설치한다.", "pt": "<strong>안전보건규칙 제11조 — 작업장의 출입구</strong><br>안전보건규칙 제11조(작업장의 출입구). 그 밖에 <u>출입구 문을 자동문으로 하는 경우 근로자가 위험해질 우려가 있으면 즉시 정지·개방되도록</u> 하고, <u>하역운반기계 통로와 출입구가 접하면 비상등·비상벨·경보장치</u>를 설치한다.", "law": "<details class=law><summary>⚖ 근거 법령 — 산업안전보건기준에 관한 규칙 제11조<span class=eff>산업안전보건기준에 관한 규칙 시행 2026. 3. 2.</span></summary><div class=lawin><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C11%EC%A1%B0\" target=\"_blank\">제11조(작업장의 출입구)</a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.</span></div><div class=t><div class=ln>사업주는 작업장에 출입구(비상구는 제외한다. 이하 같다)를 설치하는 경우 다음 각 호의 사항을 준수하여야 한다.</div><div class=ln> 1. 출입구의 위치, 수 및 크기가 작업장의 용도와 특성에 맞도록 할 것</div><div class=ln> 2. 출입구에 문을 설치하는 경우에는 근로자가 쉽게 열고 닫을 수 있도록 할 것</div><div class=\"ln hit\"> 3. <mark>주된 목적이 하역운반기계용인 출입구에는</mark> 인접하여 <mark>보행자용 출입구를 따로 설치</mark>할 것<span class=here>이 문항이 묻는 자리</span></div><div class=ln> 4. 하역운반기계의 통로와 인접하여 있는 출입구에서 접촉에 의하여 근로자에게 위험을 미칠 우려가 있는 경우에는 비상등ㆍ비상벨 등 경보장치를 할 것</div><div class=ln> 5. 계단이 출입구와 바로 연결된 경우에는 작업자의 안전한 통행을 위하여 그 사이에 1.2미터 이상 거리를 두거나 안내표지 또는 비상벨 등을 설치할 것. 다만, 출입구에 문을 설치하지 아니한 경우에는 그러하지 아니하다.</div></div></div></div></details>", "card": "card_con_t002"}, {"n": 103, "s": 6, "a": 2, "lv": 2, "fq": 3, "kind": "개념형", "t": "강관틀비계를 조립하여 사용하는 경우 준수해야할 기준으 로 옳지 않은 것은?", "c": ["수직방향으로 6m, 수평방향으로 8m 이내마다 벽이음을 할 것", "높이가 20m를 초과하거나 중량물의 적재를 수반하는 작 업을 할 경우에는 주틀 간의 간격을 2.4m 이하로 할 것", "길이가 띠장 방향으로 4m 이하이고 높이가 10m를 초과 하는 경우에는 10m 이내마다 띠장 방향으로 버팀기둥을 설치할 것", "주틀 간에 교차 가새를 설치하고 최상층 및 5층 이내마 다 수평재를 설치할 것"], "cond": "", "img": "", "sol": "높이가 20 [m] 를 초과하거나 중량물 적재를 수반하는 작업을 할 때는 주틀 간의 간격을 <strong>1.8 [m] 이하</strong>로 해야 한다. 2.4 [m] 가 아니다. 조건이 가혹할수록 간격을 <strong>좁혀야</strong> 한다는 방향으로 생각하면 된다.", "w": "① 벽이음은 수직 6 [m], 수평 8 [m] 이내마다 한다(별표5).<br>③ 띠장 방향 길이 4 [m] 이하이고 높이 10 [m] 초과면 10 [m] 이내마다 버팀기둥을 세운다.<br>④ 주틀 간에 교차 가새를 설치하고 최상층과 5층 이내마다 수평재를 넣는다.", "pt": "<strong>안전보건규칙 제62조 — 강관틀비계</strong><br>안전보건규칙 제62조(강관틀비계). 숫자 묶음 — <u>벽이음 수직 6 [m]·수평 8 [m] · 높이 20 [m] 초과 시 주틀 간격 1.8 [m] 이하 · 교차 가새와 5층 이내마다 수평재 · 버팀기둥 10 [m] 이내마다</u>. 단관비계의 벽이음은 <u>수직·수평 모두 5 [m]</u>로 다르다.<p><strong>◈ 암기</strong> 틀비계 벽이음 <u>수직 6 · 수평 8</u>, 20 [m] 초과면 주틀 <u>1.8 [m] 이하</u>.</p>", "law": "<details class=law><summary>⚖ 근거 법령 — 산업안전보건기준에 관한 규칙 제62조<span class=eff>산업안전보건기준에 관한 규칙 시행 2026. 3. 2.</span></summary><div class=lawin><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C62%EC%A1%B0\" target=\"_blank\">제62조(강관틀비계)</a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.</span></div><div class=t><div class=ln>사업주는 강관틀 비계를 조립하여 사용하는 경우 다음 각 호의 사항을 준수하여야 한다.</div><div class=ln> 1. 비계기둥의 밑둥에는 밑받침 철물을 사용하여야 하며 밑받침에 고저차(高低差)가 있는 경우에는 조절형 밑받침철물을 사용하여 각각의 강관틀비계가 항상 수평 및 수직을 유지하도록 할 것</div><div class=ln> 2. 높이가 20미터를 초과하거나 중량물의 적재를 수반하는 작업을 할 경우에는 주틀 간의 간격을 1.8미터 이하로 할 것</div><div class=\"ln hit\"> 3. 주틀 간에 교차 가새를 설치하고 최상층 및 <mark>5층 이내마다 수평재</mark>를 설치할 것<span class=here>이 문항이 묻는 자리</span></div><div class=ln> 4. 수직방향으로 6미터, 수평방향으로 8미터 이내마다 벽이음을 할 것</div><div class=ln> 5. 길이가 띠장 방향으로 4미터 이하이고 높이가 10미터를 초과하는 경우에는 10미터 이내마다 띠장 방향으로 버팀기둥을 설치할 것</div></div></div></div></details>", "card": "card_con_t003"}, {"n": 104, "s": 6, "a": 2, "lv": 1, "fq": 3, "kind": "개념형", "t": "추락방지용 방망 중 그물코의 크기가 5cm인 매듭방망 신 품의 인장강도는 최소 몇 kg이상이어야 하는가?", "c": ["60", "110", "150", "200"], "cond": "", "img": "", "sol": "<strong>매듭방망, 그물코 5 [cm], 신품</strong>은 <strong>110 [kg] 이상</strong>이다. 그물코가 작을수록 실이 촘촘해 한 가닥에 걸리는 힘이 작아지므로 요구 강도도 낮아진다.<div style=\"margin:12px 0 2px;font-weight:700\">추락방호망 방망사의 인장강도</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">그물코 / 종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">신품</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">폐기 시</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">10 [cm] 매듭 없는 방망</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">240 [kg]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">150 [kg]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">10 [cm] 매듭 방망</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">200 [kg]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">135 [kg]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">5 [cm] 매듭 방망</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>110 [kg]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">60 [kg]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">답</td></tr></tbody></table></div><img src=\"img/safe_A_2026_01_104_exp1.png\"><em>방망사 인장강도 — 그물코가 작을수록 요구 강도도 낮다</em>", "w": "① 60 [kg] 은 그물코 5 [cm] 매듭방망의 <strong>폐기 시</strong> 기준이다.<br>③ 150 [kg] 은 그물코 10 [cm] 매듭방망의 폐기 시 기준이다.<br>④ 200 [kg] 은 그물코 10 [cm] <strong>매듭 없는</strong> 방망의 신품 기준이다.", "pt": "<strong>추락재해방지 표준안전작업지침 — 방망사의 인장강도</strong><br>「추락재해방지 표준안전작업지침」 및 방망 성능기준. 표로 붙든다 — <u>10 [cm] 매듭 없음 : 신품 240 / 폐기 150</u>, <u>10 [cm] 매듭 : 신품 200 / 폐기 135</u>, <u>5 [cm] 매듭 : 신품 110 / 폐기 60</u>. 방망의 처짐은 <u>짧은 변 길이의 12 [%] 이상</u>, 작업면에서 망까지 <u>수직거리 10 [m] 이내</u>, 내민 길이는 벽면에서 <u>3 [m] 이상</u>이다.<p><strong>◈ 암기</strong> <u>10 매듭없음 240/150 · 10 매듭 200/135 · 5 매듭 110/60</u>.</p>", "law": "", "card": "card_con_t004"}, {"n": 105, "s": 6, "a": 1, "lv": 2, "fq": 1, "kind": "개념형", "t": "항타기 또는 항발기의 사용 시 준수사항으로 옳지 않은 것 은?", "c": ["증기나 공기를 차단하는 장치를 작업관리자가 쉽게 조작 할 수 있는 위치에 설치한다.", "해머의 운동에 의하여 증기호스 또는 공기호스와 해머의 접속부가 파손되거나 벗겨지는 것을 방지하기 위하여 그 접속부가 아닌 부위를 선정하여 증기호스 또는 공기호스 를 해머에 고정시킨다.", "항타기나 항발기의 권상장치의 드럼에 권상용 와이어로 프가 꼬인 경우에는 와이어로프에 하중을 걸어서는 안된 다.", "항타기나 항발기의 권상장치에 하중을 건 상태로 정지하 여 두는 경우에는 쐐기장치 또는 역회전방지용 브레이크 를 사용하여 제동하는 등 확실하게 정지시켜 두어야 한 다."], "cond": "", "img": "", "sol": "차단장치는 <strong>운전자</strong>가 쉽게 조작할 수 있는 위치에 두어야 한다. 「작업관리자」가 아니다. 위험한 순간에 즉시 끊어야 하는 것은 <strong>기계를 직접 다루는 사람</strong> 이기 때문이다.", "w": "② 호스는 접속부가 아닌 부위를 골라 해머에 고정한다. 접속부에 힘이 걸리면 벗겨진다.<br>③ 권상용 와이어로프가 꼬였으면 하중을 걸어서는 안 된다.<br>④ 하중을 건 채 정지할 때는 쐐기장치나 역회전방지용 브레이크로 확실히 제동한다.", "pt": "<strong>안전보건규칙 제215조~제218조 — 항타기·항발기</strong><br>안전보건규칙 제215조(권상용 와이어로프의 사용 금지)·제217조·제218조. 「<u>누가 조작하는가</u>」를 바꿔 놓는 것이 흔한 함정이다. 비상 조작은 언제나 <u>그 자리에 있는 사람</u>이 할 수 있어야 한다.", "law": "<details class=law><summary>⚖ 근거 법령 — 산업안전보건기준에 관한 규칙 제215조 · 산업안전보건기준에 관한 규칙 제218조 · 산업안전보건기준에 관한 규칙 제217조<span class=eff>산업안전보건기준에 관한 규칙 시행 2026. 3. 2.</span></summary><div class=lawin><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C215%EC%A1%B0\" target=\"_blank\">제215조</a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.</span></div><div class=t><div class=ln>제215조 삭제 &lt;2022.10.18&gt;</div></div></div><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C218%EC%A1%B0\" target=\"_blank\">제218조(말뚝 등을 끌어올릴 경우의 조치)</a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.</span></div><div class=t><div class=ln>① 사업주는 항타기를 사용하여 말뚝 및 널말뚝 등을 끌어올리는 경우에는 그 훅 부분이 드럼 또는 도르래의 바로 아래에 위치하도록 하여 끌어올려야 한다.</div><div class=ln>② 항타기에 체인블록 등의 장치를 부착하여 말뚝 또는 널말뚝 등을 끌어 올리는 경우에는 제1항을 준용한다.</div></div></div><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C217%EC%A1%B0\" target=\"_blank\">제217조(사용 시의 조치 등)</a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.</span></div><div class=t><div class=ln>① 사업주는 압축공기를 동력원으로 하는 항타기나 항발기를 사용하는 경우에는 다음 각 호의 사항을 준수하여야 한다. &lt;개정 2022.10.18&gt;</div><div class=ln> 1. 해머의 운동에 의하여 공기호스와 해머의 접속부가 파손되거나 벗겨지는 것을 방지하기 위하여 그 접속부가 아닌 부위를 선정하여 공기호스를 해머에 고정시킬 것</div><div class=\"ln hit\"> 2. 공기를 차단하는 장치를 해머의 운전자가 <mark>쉽게 조작할 수 있는 위치에</mark> 설치할 것<span class=here>이 문항이 묻는 자리</span></div><div class=ln>② 사업주는 항타기나 항발기의 권상장치의 드럼에 권상용 와이어로프가 꼬인 경우에는 와이어로프에 하중을 걸어서는 아니 된다.</div><div class=ln>③ 사업주는 항타기나 항발기의 권상장치에 하중을 건 상태로 정지하여 두는 경우에는 쐐기장치 또는 역회전방지용 브레이크를 사용하여 제동하는 등 확실하게 정지시켜 두어야 한다.</div></div></div></div></details>", "card": "card_con_t005"}, {"n": 106, "s": 6, "a": 3, "lv": 1, "fq": 2, "kind": "개념형", "t": "건설업 산업안전보건관리비 계상 및 사용기준은 산업재해 보상 보험법의 적용을 받는 공사 중 총 공사금액이 얼마 이상인 공사에 적용하는가? (단, 전기공사업법, 정보통신공 사업법에 의한 공사는 제외)", "c": ["4천만원", "3천만원", "2천만원", "1천만원"], "cond": "", "img": "", "sol": "총 공사금액 <strong>2천만원 이상</strong>인 공사에 적용한다.", "w": "① 4천만원이라는 기준은 없다.<br>② 3천만원이라는 기준은 없다.<br>④ 1천만원이라는 기준은 없다.", "pt": "<strong>산업안전보건법 제72조 — 산업안전보건관리비의 계상</strong><br>(건설공사 등의 산업안전보건관리비 계상 등), 「건설업 산업안전보건관리비 계상 및 사용기준」 고시. 흐름은 <u>발주자가 계상 → 시공자가 사용 → 매월 사용명세서 작성 → 공사 종료 후 1년간 보존</u>이다.<p><strong>◈ 암기</strong> <u>총 공사금액 2천만원 이상</u>.</p><p><strong>⚠ 주의사항</strong> 계상기준과 사용항목이 <u>고용노동부고시 제2024-53호(시행 2025. 1. 1.)</u>로 개정됐다. <u>스마트 안전장비 구입·임대비</u>와 <u>심폐소생술 교육 등 비상시 대비 훈련비</u>가 새로 사용 가능해졌으므로, 옛 기출의 「사용 불가」 선택지는 지금 기준으로 다시 봐야 한다.</p>", "law": "<details class=law><summary>⚖ 근거 법령 — 산업안전보건법 제72조<span class=eff>산업안전보건법 시행 2026. 8. 1.</span></summary><div class=lawin><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EB%B2%95/%EC%A0%9C72%EC%A1%B0\" target=\"_blank\">제72조(건설공사 등의 산업안전보건관리비 계상 등)</a><span class=eff>산업안전보건법 · 시행 2026. 8. 1.</span></div><div class=t><div class=\"ln hit\">① 건설공사발주자가 도급계약을 체결하거나 건설공사의 시공을 주도하여 총괄ㆍ관리하는 자(건설공사발주자로부터 건설공사를 최초로 도급받은 수급인은 제외한다)가 건설공사 사업 계획을 수립할 때에는 고용노동부장관이 정하여 고시하는 바에 따라 산업재해 예방을 위하여 사용하는 비용(이하 \"산업안전보건관리비\"라 한다)을 도급금액 또는 사업비에 계상(計上)하여야 한다. &lt;개정 2020.6.9&gt;<span class=here>이 문항이 묻는 자리</span></div><div class=ln>② 고용노동부장관은 산업안전보건관리비의 효율적인 사용을 위하여 다음 각 호의 사항을 정할 수 있다.</div><div class=ln> 1. 사업의 규모별ㆍ종류별 계상 기준</div><div class=ln> 2. 건설공사의 진척 정도에 따른 사용비율 등 기준</div><div class=ln> 3. 그 밖에 산업안전보건관리비의 사용에 필요한 사항</div><div class=ln>③ 건설공사도급인은 산업안전보건관리비를 제2항에서 정하는 바에 따라 사용하고 고용노동부령으로 정하는 바에 따라 그 사용명세서를 작성하여 보존하여야 한다. &lt;개정 2020.6.9&gt;</div><div class=ln>④ 선박의 건조 또는 수리를 최초로 도급받은 수급인은 사업 계획을 수립할 때에는 고용노동부장관이 정하여 고시하는 바에 따라 산업안전보건관리비를 사업비에 계상하여야 한다.</div><div class=ln>⑤ 건설공사도급인 또는 제4항에 따른 선박의 건조 또는 수리를 최초로 도급받은 수급인은 산업안전보건관리비를 산업재해 예방 외의 목적으로 사용해서는 아니 된다. &lt;개정 2020.6.9&gt;</div></div></div></div></details>", "card": "card_con_t006"}, {"n": 107, "s": 6, "a": 4, "lv": 1, "fq": 1, "kind": "개념형", "t": "토사붕괴 원인으로 옳지 않은 것은?", "c": ["경사 및 기울기 증가", "성토높이의 증가", "건설기계 등 하중작용", "토사중량의 감소"], "cond": "", "img": "", "sol": "토사 중량이 <strong>줄면</strong> 무너뜨리려는 힘도 줄어 오히려 안정해진다. 붕괴는 <strong>무너뜨리려는 힘(활동력)이 버티는 힘(전단저항)을 넘을 때</strong> 일어나므로, 중량 감소는 원인이 아니다.", "w": "① 경사가 급해지면 활동력이 커진다.<br>② 성토를 높이면 하중이 늘어난다.<br>③ 건설기계의 하중도 활동력을 키운다.", "pt": "<strong>토사붕괴의 원인 — 활동력과 전단저항</strong><br>붕괴의 힘겨루기. <u>활동력(중량 · 경사 · 상재하중 · 진동 · 수압)</u>이 <u>전단저항(점착력 c + 마찰 σtanφ)</u>을 넘으면 무너진다. 대책도 이 틀에서 나온다 — <u>기울기 완화와 하중 제거(활동력 줄이기)</u>, <u>배수(수압 줄이기)</u>, <u>흙막이·억지말뚝(저항 늘리기)</u>.<p><strong>◈ 암기</strong> <u>활동력이 전단저항을 넘으면 무너진다</u> — 중량 감소는 오히려 안정.</p>", "law": "", "card": "card_con_t007"}, {"n": 108, "s": 6, "a": 3, "lv": 2, "fq": 1, "kind": "개념형", "t": "건설용 리프트의 붕괴 등을 방지하기 위해 받침의 수를 증 가 시키는 등 안전조치를 하여야 하는 순간풍속 기준은?", "c": ["초당 15미터 초과", "초당 25미터 초과", "초당 35미터 초과", "초당 45미터 초과"], "cond": "", "img": "", "sol": "순간풍속이 <strong>초당 35 [m] 를 초과</strong> 할 우려가 있으면 받침의 수를 늘리는 등 붕괴 방지 조치를 한다.<div style=\"margin:12px 0 2px;font-weight:700\">순간풍속에 따른 조치</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">풍속</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">근거</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">10 [m/s] 초과</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">타워크레인 <u>설치·수리·점검·해체</u> 중지</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">규칙 제37조</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">15 [m/s] 초과</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">타워크레인 <u>운전작업</u> 중지</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">규칙 제37조</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">30 [m/s] 초과</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">옥외 주행크레인 <u>이탈방지장치</u> 작동</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">규칙 제140조</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">35 [m/s] 초과</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">건설용 리프트 <u>붕괴 방지</u> 조치</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">규칙 제154조</td></tr></tbody></table></div><img src=\"img/safe_A_2026_01_108_exp1.png\"><em>강풍 시 조치 기준 — 작업 중지는 낮은 값, 구조물 보호는 높은 값</em>", "w": "① 초당 15 [m] 는 타워크레인 <strong>운전작업 중지</strong> 기준이다.<br>② 초당 25 [m] 라는 기준은 없다.<br>④ 초당 45 [m] 라는 기준은 없다.", "pt": "<strong>안전보건규칙 제154조 — 강풍 시 붕괴 방지</strong><br>안전보건규칙 제154조(붕괴 등의 방지). 풍속 숫자 묶음 — <u>10 [m/s] 초과 타워크레인 설치·해체 중지 · 15 [m/s] 초과 타워크레인 운전 중지 · 30 [m/s] 초과 옥외 주행크레인 이탈방지장치 작동 · 35 [m/s] 초과 건설용 리프트 붕괴 방지 조치</u>. 「<u>작업 중지는 낮은 값, 구조물 보호는 높은 값</u>」으로 갈린다.<p><strong>◈ 암기</strong> <u>10 설치해체 · 15 운전 · 30 이탈방지 · 35 리프트</u>.</p>", "law": "<details class=law><summary>⚖ 근거 법령 — 산업안전보건기준에 관한 규칙 제154조<span class=eff>산업안전보건기준에 관한 규칙 시행 2026. 3. 2.</span></summary><div class=lawin><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C154%EC%A1%B0\" target=\"_blank\">제154조(붕괴 등의 방지)</a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.</span></div><div class=t><div class=ln>① 사업주는 지반침하, 불량한 자재사용 또는 헐거운 결선(結線) 등으로 리프트가 붕괴되거나 넘어지지 않도록 필요한 조치를 하여야 한다.</div><div class=\"ln hit\">② 사업주는 순간풍속이 <mark>초당 35미터</mark>를 초과하는 바람이 불어올 우려가 있는 경우 <mark>건설용 리프트</mark>(지하에 설치되어 있는 것은 제외한다)에 대하여 받침의 수를 증가시키는 등 그 붕괴 등을 방지하기 위한 조치를 하여야 한다. &lt;개정 2022.10.18&gt;<span class=here>이 문항이 묻는 자리</span></div></div></div></div></details>", "card": "card_con_t008"}, {"n": 109, "s": 6, "a": 2, "lv": 1, "fq": 2, "kind": "개념형", "t": "건설업 산업안전보건관리비 계상 및 사용기준에 따른 안전 관리비의 개인보호구 및 안전장구 구입비 항목에서 안전관 리비로 사용이 가능한 경우는?", "c": ["안전·보건관리자가 선임되지 않은 현장에서 안전·보건업 무를 담당하는 현장관계자용 무전기, 카메라, 컴퓨터, 프 린터 등 업무용 기기", "혹한·혹서에 장기간 노출로 인해 건강장해를 일으킬 우 려가 있는 경우 특정 근로자에게 지급되는 기능성 보호 장구", "근로자에게 일률적으로 지급하는 보냉·보온장구", "감리원이나 외부에서 방문하는 인사에게 지급하는 보호 구"], "cond": "", "img": "", "sol": "<strong>혹한·혹서에 오래 노출되어 건강장해가 우려되는 특정 근로자</strong>에게 주는 기능성 보호장구는 쓸 수 있다. 「특정 위험에 노출된 특정 근로자를 지키기 위한 것」이라는 점이 갈림길이다.", "w": "① 업무용 기기는 안전관리 업무에 쓰더라도 일반 업무용이라 쓸 수 없다.<br>③ 일률적으로 지급하는 보냉·보온장구는 복리후생 성격이라 쓸 수 없다.<br>④ 감리원이나 방문객에게 주는 보호구는 그 현장 근로자용이 아니라 쓸 수 없다.", "pt": "<strong>산업안전보건관리비 계상 및 사용기준 고시</strong><br>판단 기준은 하나 — 「<strong>그 현장 근로자의 안전·보건을 위해 특정하게 쓰이는가</strong>」.<p><strong>◈ 암기</strong> <u>일률 지급 · 복리후생 · 일반 업무용 · 외부인용</u>이면 못 쓴다.</p><p><strong>⚠ 주의사항</strong> 고시 <u>제2024-53호(2025. 1. 1. 시행)</u>로 사용항목이 넓어졌다. 스마트 안전장비 구입·임대비와 심폐소생술 교육비 등이 새로 들어왔으므로, 2024년 이전 기출의 「사용 불가」 판단은 항목별로 다시 확인해야 한다.</p>", "law": "", "card": "card_con_t009"}, {"n": 110, "s": 6, "a": 2, "lv": 1, "fq": 1, "kind": "개념형", "t": "흙막이벽 근입깊이를 깊게하고, 전면의 굴착부분을 남겨두 어 흙의 중량으로 대항하게 하거나, 굴착예정부분의 일부 를 미리 굴착하여 기초콘크리트를 타설하는 등의 대책과 가장 관계가 깊은 것은?", "c": ["파이핑현상이 있을 때", "히빙현상이 있을 때", "지하수위가 높을 때", "굴착깊이가 깊을 때"], "cond": "", "img": "", "sol": "<strong>히빙(heaving)</strong> 대책이다. 연약한 점토지반에서 <strong>배면 흙의 무게에 눌려 굴착 바닥이 부풀어 오르는</strong> 현상이므로, <strong>근입깊이를 늘려 흙이 돌아 들어오는 길을 막고</strong>, <strong>앞쪽 흙을 남겨 두어 그 무게로 눌러 주는</strong> 것이 대책이 된다.<img src=\"img/safe_A_2026_01_110_exp1.png\"><em>히빙과 보일링 — 점토냐 모래냐로 갈린다</em>", "w": "① 파이핑은 모래지반에서 물길이 뚫리는 현상으로, 차수와 수위 저하가 주된 대책이다.<br>③ 지하수위가 높은 것은 보일링·파이핑 쪽 조건이다.<br>④ 굴착깊이만으로는 어느 현상인지 가려지지 않는다.", "pt": "<strong>히빙(heaving)과 그 대책</strong><br>지반으로 가른다. <u>점토지반은 히빙(무게에 눌려 바닥이 솟음)</u>, <u>모래지반은 보일링·파이핑(물이 솟구쳐 흙이 끓음)</u>. 대책은 둘 다 <u>근입깊이 증가</u>가 공통이지만, 히빙은 <u>하중 대항</u>, 보일링은 <u>수위 저하와 차수</u>에 무게를 둔다.<p><strong>◈ 암기</strong> <u>점토는 히빙, 모래는 보일링</u>. 대책은 둘 다 근입깊이 증가.</p>", "law": "", "card": "card_con_t010"}, {"n": 111, "s": 6, "a": 4, "lv": 1, "fq": 1, "kind": "개념형", "t": "사면지반 개량공법으로 옳지 않은 것은?", "c": ["전기 화학적 공법", "석회 안정처리 공법", "이온 교환 방법", "옹벽 공법"], "cond": "", "img": "", "sol": "<strong>옹벽 공법</strong>은 구조물을 세워 흙을 붙들어 두는 <strong>구조물 보강공법</strong>이다. 흙 자체의 성질을 좋게 하는 지반 개량공법이 아니다.<div style=\"margin:12px 0 2px;font-weight:700\">사면 안정공법 두 갈래</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">갈래</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 하나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지반 개량공법</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">흙 자체를 좋게 만든다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">전기화학적 · 석회 안정처리 · 이온교환 · 주입</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>구조물 보강공법</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">구조물로 흙을 붙든다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>옹벽</u> · 억지말뚝 · 앵커 · 록볼트</td></tr></tbody></table></div>", "w": "① 전기 화학적 공법은 지반 개량공법이다.<br>② 석회 안정처리 공법도 지반 개량공법이다.<br>③ 이온 교환 방법도 지반 개량공법이다.", "pt": "<strong>사면 안정공법의 분류</strong><br>여기에 <strong>억제공(사면 기울기 완화·배수)</strong>을 더해 세 갈래로 보기도 한다. 배수는 간극수압을 낮추는 가장 값싼 대책이다.<p><strong>◈ 암기</strong> <u>흙을 고치면 개량, 구조물로 붙들면 보강</u>.</p>", "law": "", "card": "card_con_t011"}, {"n": 112, "s": 6, "a": 2, "lv": 2, "fq": 3, "kind": "개념형", "t": "이동식 비계를 조립하여 작업을 하는 경우의 준수기준으로 옳지 않은 것은?", "c": ["비계의 최상부에서 작업을 할 때에는 안전난간을 설치하 여야 한다.", "작업발판의 최대적재하중은 400kg을 초과하지 않도록 한다.", "승강용 사다리는 견고하게 설치하여야 한다.", "작업발판은 항상 수평을 유지하고 작업발판 위에서 안전 난간을 딛고 작업을 하거나 받침대 또는 사다리를 사용 하여 작업하지 않도록 한다."], "cond": "", "img": "", "sol": "이동식 비계 작업발판의 최대적재하중은 <strong>250 [kg] 을 초과하지 않도록</strong> 한다. 400 [kg] 은 <strong>강관비계의 비계기둥 간 적재하중</strong> 기준이라 서로 다른 값이다.", "w": "① 최상부에서 작업할 때는 안전난간을 설치한다.<br>③ 승강용 사다리를 견고하게 설치한다.<br>④ 작업발판은 수평을 유지하고, 그 위에서 난간을 딛거나 사다리를 얹어 쓰지 않는다.", "pt": "<strong>안전보건규칙 제68조 — 이동식 비계</strong><br>안전보건규칙 제68조(이동식 비계). 그 밖에 <u>바퀴에 브레이크·쐐기 등으로 갑작스러운 이동을 막고, 아웃트리거를 설치하며, 사람이나 짐을 실은 채 이동하지 않는다</u>. 「<u>이동식 250, 강관비계 400</u>」을 갈라 둔다.<p><strong>◈ 암기</strong> <u>이동식 250 [kg], 강관비계 400 [kg]</u>.</p>", "law": "<details class=law><summary>⚖ 근거 법령 — 산업안전보건기준에 관한 규칙 제68조<span class=eff>산업안전보건기준에 관한 규칙 시행 2026. 3. 2.</span></summary><div class=lawin><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C68%EC%A1%B0\" target=\"_blank\">제68조(이동식비계)</a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.</span></div><div class=t><div class=ln>사업주는 이동식비계를 조립하여 작업을 하는 경우에는 다음 각 호의 사항을 준수하여야 한다. &lt;개정 2019.10.15, 2024.6.28&gt;</div><div class=\"ln hit\"> 1. 이동식비계의 바퀴에는 뜻밖의 갑작스러운 이동 또는 전도를 방지하기 위하여 <mark>브레이크ㆍ쐐기 등으로</mark> 바퀴를 고정시킨 다음 비계의 일부를 견고한 시설물에 고정하거나 아웃트리거를 설치하는 등 필요한 조치를 할 것<span class=here>이 문항이 묻는 자리</span></div><div class=ln> 2. 승강용사다리는 견고하게 설치할 것</div><div class=ln> 3. 비계의 최상부에서 작업을 하는 경우에는 안전난간을 설치할 것</div><div class=ln> 4. 작업발판은 항상 수평을 유지하고 작업발판 위에서 안전난간을 딛고 작업을 하거나 받침대 또는 사다리를 사용하여 작업하지 않도록 할 것</div><div class=\"ln hit\"> 5. <mark>작업발판의 최대적재하중은</mark> 250킬로그램<mark>을 초과하지 않도록</mark> 할 것<span class=here>이 문항이 묻는 자리</span></div></div></div></div></details>", "card": "card_con_t012"}, {"n": 113, "s": 6, "a": 4, "lv": 2, "fq": 1, "kind": "개념형", "t": "가설공사 표준안전 작업지침에 따른 통로발판을 설치하여 사용함에 있어 준수사항으로 옳지 않은 것은?", "c": ["추락의 위험이 있는 곳에는 안전난간이나 철책을 설치하 여야 한다.", "작업발판의 최대폭은 1.6m 이내이어야 한다.", "비계발판의 구조에 따라 최대 적재하중을 정하고 이를 초과하지 않도록 하여야 한다.", "발판을 겹쳐 이음하는 경우 장선 위에서 이음을 하고 겹 침길이는 10cm 이상으로 하여야 한다."], "cond": "", "img": "", "sol": "겹침길이는 <strong>20 [cm] 이상</strong> 이어야 한다. 10 [cm] 로는 발판이 밀려 빠질 수 있다. <strong>장선 위에서 이음</strong> 한다는 조건은 맞다.", "w": "① 추락 위험이 있는 곳에는 안전난간이나 철책을 설치한다.<br>② 작업발판의 최대폭은 1.6 [m] 이내로 한다.<br>③ 구조에 따라 최대 적재하중을 정하고 지킨다.", "pt": "<strong>가설공사 표준안전작업지침 — 통로발판</strong><br>발판 관련 숫자. <u>작업발판 폭 40 [cm] 이상(달비계는 20 [cm] 이상) · 발판재료 간 틈 3 [cm] 이하 · 통로발판 최대폭 1.6 [m] 이내 · 겹침이음 20 [cm] 이상</u>. 「<u>40 과 3</u>」, 「<u>1.6 과 20</u>」을 각각 묶어 둔다.<p><strong>◈ 암기</strong> <u>폭 40 · 틈 3</u>, 통로발판 <u>최대폭 1.6 [m] · 겹침 20 [cm]</u>.</p>", "law": "", "card": "card_con_t013"}, {"n": 114, "s": 6, "a": 2, "lv": 2, "fq": 1, "kind": "개념형", "t": "철골건립준비를 할 때 준수하여야 할 사항으로 옳지 않은 것은?", "c": ["지상 작업장에서 건립준비 및 기계기구를 배치할 경우에 는 낙하물의 위험이 없는 평탄한 장소를 선정하여 정비 하여야 한다.", "건립작업에 다소 지장이 있다하더라도 수목은 제거하거 나 이설하여서는 안된다.", "사용전에 기계기구에 대한 정비 및 보수를 철저히 실시 하여야 한다.", "기계에 부착된 앵카 등 고정장치와 기초구조 등을 확인 하여야 한다."], "cond": "", "img": "", "sol": "건립작업에 지장이 되는 <strong>수목은 제거하거나 옮겨 심어야</strong> 한다. 나무가 걸리적거리면 크레인 붐이 닿거나 부재가 걸려 사고가 난다.", "w": "① 낙하물 위험이 없는 평탄한 장소를 골라 정비한다.<br>③ 사용 전에 기계기구를 정비·보수한다.<br>④ 앵커 등 고정장치와 기초구조를 확인한다.", "pt": "<strong>철골공사의 건립준비</strong><br>철골공사의 준비 단계. 「<u>부지 정리 · 수목 정리 · 인접 구조물 조사 · 기계 정비 · 고정장치 확인</u>」. 철골 건립작업을 중지해야 하는 기상 조건도 함께 붙든다 — <u>풍속 10 [m/s] 이상 · 강우량 1 [mm/h] 이상 · 강설량 1 [cm/h] 이상</u>.", "law": "", "card": "card_con_t014"}, {"n": 115, "s": 6, "a": 3, "lv": 1, "fq": 1, "kind": "개념형", "t": "토사붕괴에 따른 재해를 방지하기 위한 흙막이 지보공 부 재로 옳지 않은 것은?", "c": ["흙막이판", "말뚝", "턴버클", "띠장"], "cond": "", "img": "", "sol": "<strong>턴버클</strong>은 와이어로프나 강봉의 <strong>길이를 조절하고 팽팽하게 당기는 부속품</strong>이지 흙막이 지보공의 부재가 아니다.<div style=\"margin:12px 0 2px;font-weight:700\">흙막이 지보공의 구성과 점검</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">부재</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">하는 일</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">정기점검 항목</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">흙막이판</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">흙이 무너져 들어오는 것을 직접 막음</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">손상·변형·부식·변위·탈락</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">말뚝 (엄지말뚝)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">흙막이판을 지지하는 기둥</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">위와 같음</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">띠장</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">말뚝을 가로로 이어 힘을 전달</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">접속부·부착부·교차부의 상태</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">버팀보 / 어스앵커</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">띠장이 받은 힘을 최종 지지</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">버팀대의 긴압 정도</td></tr></tbody></table></div>", "w": "① 흙막이판은 흙이 무너져 들어오는 것을 직접 막는 판이다.<br>② 말뚝(엄지말뚝·H-pile)은 흙막이판을 지지하는 기둥이다.<br>④ 띠장은 말뚝을 가로로 이어 버팀보에 힘을 전달하는 부재다.", "pt": "<strong>흙막이 지보공의 구성과 정기점검</strong><br>흙막이 지보공의 구성. <u>흙막이판 → 말뚝(엄지말뚝) → 띠장 → 버팀보(또는 어스앵커)</u> 순으로 힘이 전달된다. 정기점검 항목은 <u>부재의 손상·변형·부식·변위·탈락 · 버팀대의 긴압 정도 · 부재 접속부·부착부·교차부의 상태 · 침하 정도</u> 네 가지다.<p><strong>◈ 암기</strong> <u>흙막이판 → 말뚝 → 띠장 → 버팀보</u> 순으로 힘이 전달된다.</p>", "law": "", "card": "card_con_t015"}, {"n": 116, "s": 6, "a": 3, "lv": 2, "fq": 1, "kind": "개념형", "t": "가설구조물의 특징으로 옳지 않은 것은?", "c": ["연결재가 적은 구조로 되기 쉽다.", "부재 결합이 간략하여 불안전 결합이다.", "구조물이라는 개념이 확고하여 조립의 정밀도가 높다.", "사용부재는 과소단면이거나 결함재가 되기 쉽다."], "cond": "", "img": "", "sol": "오히려 반대다. 가설구조물은 <strong>임시로 쓰는 것이라는 인식 탓에 구조물이라는 개념이 흐릿하고, 조립의 정밀도가 낮다</strong>. 이것이 가설구조물 붕괴 사고의 뿌리다.", "w": "① 연결재가 적은 구조가 되기 쉽다.<br>② 부재 결합이 간단해 불안전한 결합이 되기 쉽다.<br>④ 사용 부재가 단면이 작거나 이미 손상된 것이 되기 쉽다.", "pt": "<strong>가설구조물의 특징</strong><br>가설구조물의 4대 문제. <u>연결재 부족 · 불안전 결합 · 정밀도 낮음 · 부재 불량</u>. 뿌리는 「<u>어차피 임시니까</u>」라는 인식이다. 그래서 법은 <u>조립도 작성과 정기점검</u>을 강제하고, 일정 규모 이상이면 <u>설계변경 요청 제도</u>까지 두었다.", "law": "", "card": "card_con_t016"}, {"n": 117, "s": 6, "a": 4, "lv": 1, "fq": 1, "kind": "개념형", "t": "건설작업용 타워크레인의 안전장치로 옳지 않은 것은?", "c": ["권과 방지장치", "과부하 방지장치", "비상정지 장치", "호이스트 스위치"], "cond": "", "img": "", "sol": "<strong>호이스트 스위치</strong>는 화물을 올리고 내리는 <strong>조작 스위치</strong>이지 안전장치가 아니다.", "w": "① 권과방지장치는 훅이 지나치게 감겨 올라가는 것을 막는다.<br>② 과부하방지장치는 정격하중을 넘으면 동작을 멈춘다.<br>③ 비상정지장치는 즉시 정지시킨다.", "pt": "<strong>안전보건규칙 제134조 — 타워크레인의 방호장치</strong><br>방호장치는 <strong>권과방지 · 과부하방지 · 비상정지 · 제동장치</strong>이며, 여기에 선회 제한 리밋 스위치·트롤리 내외측 제어장치·훅 해지장치가 더해진다.<p><strong>◈ 암기</strong> <u>조작하는 것인가, 막아 주는 것인가</u>로 가른다.</p>", "law": "<details class=law><summary>⚖ 근거 법령 — 산업안전보건기준에 관한 규칙 제134조<span class=eff>산업안전보건기준에 관한 규칙 시행 2026. 3. 2.</span></summary><div class=lawin><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C134%EC%A1%B0\" target=\"_blank\">제134조(방호장치의 조정)</a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.</span></div><div class=t><div class=\"ln hit\">① 사업주는 다음 각 호의 양중기에 과부하방지장치, 권과방지장치(捲過防止裝置), 비상정지장치 및 제동장치, 그 밖의 방호장치[(승강기의 파이널 리미트 스위치(final limit switch), 속도조절기, 출입문 인터 록(inter lock) 등을 말한다]가 정상적으로 작동될 수 있도록 미리 조정해 두어야 한다. &lt;개정 2017.3.3, 2019.4.19&gt;<span class=here>이 문항이 묻는 자리</span></div><div class=ln> 1. 크레인</div><div class=ln> 2. 이동식 크레인</div><div class=ln> 3. 삭제&lt;2019.4.19&gt;</div><div class=ln> 4. 리프트</div><div class=ln> 5. 곤돌라</div><div class=ln> 6. 승강기</div><div class=ln>② 제1항제1호 및 제2호의 양중기에 대한 권과방지장치는 훅ㆍ버킷 등 달기구의 윗면(그 달기구에 권상용 도르래가 설치된 경우에는 권상용 도르래의 윗면)이 드럼, 상부 도르래, 트롤리프레임 등 권상장치의 아랫면과 접촉할 우려가 있는 경우에 그 간격이 0.25미터 이상[(직동식(直動式) 권과방지장치는 0.05미터 이상으로 한다)]이 되도록 조정하여야 한다.</div><div class=ln>③ 제2항의 권과방지장치를 설치하지 않은 크레인에 대해서는 권상용 와이어로프에 위험표시를 하고 경보장치를 설치하는 등 권상용 와이어로프가 지나치게 감겨서 근로자가 위험해질 상황을 방지하기 위한 조치를 하여야 한다.</div></div></div></div></details>", "card": "card_con_t017"}, {"n": 118, "s": 6, "a": 3, "lv": 2, "fq": 2, "kind": "개념형", "t": "옥외에 설치되어 있는 주행크레인에 대하여 이탈방지장치 를 작동시키는 등 그 이탈을 방지하기 위한 조치를 하여야 하는 순간풍속에 대한 기준으로 옳은 것은?", "c": ["순간풍속이 초당 10m를 초과하는 바람이 불어올 우려가 있는 경우", "순간풍속이 초당 20m를 초과하는 바람이 불어올 우려가 있는 경우", "순간풍속이 초당 30m를 초과하는 바람이 불어올 우려가 있는 경우", "순간풍속이 초당 40m를 초과하는 바람이 불어올 우려가 있는 경우"], "cond": "", "img": "", "sol": "순간풍속이 <strong>초당 30 [m] 를 초과</strong> 할 우려가 있으면 옥외 주행크레인의 이탈방지장치를 작동시킨다.<div style=\"margin:12px 0 2px;font-weight:700\">순간풍속에 따른 조치</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">풍속</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">근거</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">10 [m/s] 초과</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">타워크레인 <u>설치·수리·점검·해체</u> 중지</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">규칙 제37조</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">15 [m/s] 초과</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">타워크레인 <u>운전작업</u> 중지</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">규칙 제37조</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>30 [m/s] 초과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>옥외 주행크레인 이탈방지장치</u> 작동</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">규칙 제140조</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">35 [m/s] 초과</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">건설용 리프트 <u>붕괴 방지</u> 조치</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">규칙 제154조</td></tr></tbody></table></div><img src=\"img/safe_A_2026_01_118_exp1.png\"><em>강풍 시 조치 기준 — 작업 중지는 낮은 값, 구조물 보호는 높은 값</em>", "w": "① 초당 10 [m] 는 타워크레인 설치·해체 중지 기준이다.<br>② 초당 20 [m] 라는 기준은 없다.<br>④ 초당 40 [m] 라는 기준도 없다.", "pt": "<strong>안전보건규칙 제140조 — 폭풍에 의한 이탈 방지</strong><br>사람이 하는 작업은 낮은 풍속에서 멈추게 하고, 구조물을 지키는 조치는 높은 풍속에서 한다.<p><strong>◈ 암기</strong> <u>10 설치해체 · 15 운전 · 30 이탈방지 · 35 리프트</u>.</p>", "law": "<details class=law><summary>⚖ 근거 법령 — 산업안전보건기준에 관한 규칙 제140조<span class=eff>산업안전보건기준에 관한 규칙 시행 2026. 3. 2.</span></summary><div class=lawin><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C140%EC%A1%B0\" target=\"_blank\">제140조(폭풍에 의한 이탈 방지)</a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.</span></div><div class=t><div class=\"ln hit\">제140조(폭풍에 의한 이탈 방지) 사업주는 순간풍속이 초당 30미터를 <mark>초과하는 바람이 불어올 우려가 있는 경우</mark> 옥외에 설치되어 있는 주행 크레인에 대하여 이탈방지장치를 작동시키는 등 이탈 방지를 위한 조치를 하여야 한다.<span class=here>이 문항이 묻는 자리</span></div></div></div></div></details>", "card": "card_con_t018"}, {"n": 119, "s": 6, "a": 2, "lv": 1, "fq": 2, "kind": "개념형", "t": "흙 속의 전단응력을 증대시키는 원인에 해당하지 않는 것 은?", "c": ["자연 또는 인공에 의한 지하공동의 형성", "함수비의 감소에 따른 흙의 단위체적 중량의 감소", "지진, 폭파에 의한 진동 발생", "균열내에 작용하는 수압증가"], "cond": "", "img": "", "sol": "흙이 마르면 무게가 줄어 <strong>무너뜨리려는 힘도 줄어든다</strong>. 전단응력을 키우는 것이 아니라 낮추는 쪽이다.", "w": "① 지하공동이 생기면 위쪽 흙을 받치지 못해 응력이 커진다.<br>③ 진동은 순간적으로 큰 힘을 더한다.<br>④ 균열 속 수압은 흙을 밀어내 응력을 키운다.", "pt": "<strong>전단응력을 키우는 원인과 전단강도를 낮추는 원인</strong><br>붕괴는 <strong>전단응력(무너뜨리려는 힘)이 전단강도(버티는 힘)를 넘을 때</strong> 일어난다. 전단응력을 키우는 것은 하중 증가·경사 증가·진동·수압이고, 전단강도를 낮추는 것은 함수비 증가·간극수압 상승·점착력 감소다.<p><strong>◈ 암기</strong> <u>무게가 늘면 응력이 커지고, 물이 스며들면 강도가 낮아진다</u>.</p>", "law": "", "card": "card_con_t019"}, {"n": 120, "s": 6, "a": 4, "lv": 1, "fq": 3, "kind": "개념형", "t": "콘크리트 타설작업을 하는 경우 준수하여야 할 사항으로 옳지 않은 것은?", "c": ["당일의 작업을 시작하기 전에 해당 작업에 관한 거푸집 동바리등의 변형ㆍ변위 및 지반의 침하 유무 등을 점검 하고 이상이 있으면 보수할 것", "콘크리트를 타설하는 경우에는 편심이 발생하지 않도록 골고루 분산하여 타설할 것", "설계도서상의 콘크리트 양생기간을 준수하여 거푸집동바 리등을 해체할 것", "작업 중에는 거푸집동바리등의 변형ㆍ변위 및 침하 유무 등을 감시할 수 있는 감시자를 배치하여 이상이 있으면 작업을 중지하지 아니하고, 즉시 충분한 보강조치를 실"], "cond": "", "img": "", "sol": "이상이 발견되면 <strong>작업을 중지하고</strong> 근로자를 대피시킨 뒤 보강한다. 「중지하지 아니하고 보강」은 사람을 위험 속에 두는 것이라 조문과 반대다.", "w": "① 작업 시작 전 거푸집 동바리와 지반 침하를 점검하고 보수한다.<br>② 편심이 생기지 않도록 골고루 나누어 붓는다.<br>③ 설계도서의 양생기간을 지켜 해체한다.", "pt": "<strong>안전보건규칙 제334조 — 콘크리트 타설작업</strong><br>거푸집 붕괴의 대표 원인이 <strong>집중 타설과 과속 타설</strong>이다. 한 곳에 몰아 부으면 측압이 급격히 커진다.<p><strong>◈ 암기</strong> 이상이 보이면 <u>먼저 멈추고 대피</u>, 보강은 그다음.</p>", "law": "<details class=law><summary>⚖ 근거 법령 — 산업안전보건기준에 관한 규칙 제334조<span class=eff>산업안전보건기준에 관한 규칙 시행 2026. 3. 2.</span></summary><div class=lawin><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C334%EC%A1%B0\" target=\"_blank\">제334조(콘크리트의 타설작업)</a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.</span></div><div class=t><div class=ln>사업주는 콘크리트 타설작업을 하는 경우에는 다음 각 호의 사항을 준수해야 한다. &lt;개정 2023.11.14&gt;</div><div class=ln> 1. 당일의 작업을 시작하기 전에 해당 작업에 관한 거푸집 및 동바리의 변형ㆍ변위 및 지반의 침하 유무 등을 점검하고 이상이 있으면 보수할 것</div><div class=\"ln hit\"> 2. 작업 중에는 감시자를 배치하는 등의 방법으로 거푸집 및 동바리의 변형ㆍ변위 및 침하 유무 등을 확인해야 하며, 이상이 있으면 <mark>작업을 중지하고</mark> 근로자를 대피시킬 것<span class=here>이 문항이 묻는 자리</span></div><div class=ln> 3. 콘크리트 타설작업 시 거푸집 붕괴의 위험이 발생할 우려가 있으면 충분한 보강조치를 할 것</div><div class=ln> 4. 설계도서상의 콘크리트 양생기간을 준수하여 거푸집 및 동바리를 해체할 것</div><div class=ln> 5. 콘크리트를 타설하는 경우에는 편심이 발생하지 않도록 골고루 분산하여 타설할 것</div></div></div></div></details>", "card": "card_con_t020"}], "cards": {"card_mgt_t001": {"kind": "단답형", "fq": 1, "subject": "안전관리론", "chapter": "", "mid": "유해·위험작업의 근로시간 제한", "front": "유해·위험작업의 근로시간 제한은?", "back": "고압실 내 작업과 잠수작업은 <strong>1일 6시간, 1주 34시간</strong>을 넘길 수 없다. 높은 기압에 오래 있으면 몸에 녹아든 질소가 감압 과정에서 기포로 변해 <strong>잠함병(감압병)</strong>을 일으킨다. 노출 시간을 줄이는 것 말고는 막을 방법이 없다.<p><strong>◈ 암기</strong> <u>6과 34</u> — 일반 근로시간 8과 40보다 각각 짧다.</p><p>(유해·위험작업에 대한 근로시간 제한 등) 제1항, 시행령 제99조.</p><p><em>근거 — 산업안전보건법 제139조 · 시행령 제99조</em></p>", "nq": 1}, "card_mgt_t002": {"kind": "단답형", "fq": 1, "subject": "안전관리론", "chapter": "", "mid": "보험급여의 종류", "front": "보험급여의 종류는?", "back": "<strong>생산손실비용</strong>은 사업주가 떠안는 <strong>간접손실</strong>이다. 보험급여는 다친 근로자와 그 유족에게 나가는 돈이다.<p><strong>◈ 암기</strong> 「<u>요 · 휴 · 장 · 간 · 유 · 상 · 장 · 직</u>」 여덟 가지.</p><p>(보험급여의 종류와 산정 기준 등).</p><div style=\"margin:12px 0 2px;font-weight:700\">산재보험 급여 여덟 가지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">급여</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">언제 받나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">요양급여</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">업무상 부상·질병으로 치료가 필요할 때</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">4일 이상 요양</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">휴업급여</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">요양으로 일을 못 해 임금을 못 받을 때</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">평균임금의 70 [%]</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">장해급여</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">치유 뒤 장해가 남았을 때</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">연금 또는 일시금</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">간병급여</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">치유 뒤에도 간병이 필요할 때</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">상시·수시</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">유족급여</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">업무상 사유로 사망했을 때</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">연금이 원칙</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">상병보상연금</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">2년 넘게 요양하며 중증일 때</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">휴업급여 대신</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">장례비</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">사망했을 때 장제를 지낸 사람에게</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">평균임금 120일분</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">직업재활급여</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">장해가 남은 근로자의 직업복귀</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">훈련비·수당</td></tr></tbody></table></div><p><em>근거 — 산업재해보상보험법 제36조</em></p>", "nq": 1}, "card_mgt_t003": {"kind": "용어형", "fq": 1, "subject": "안전관리론", "chapter": "보호구", "mid": "안전보건표지의 종류와 기본모형", "front": "안전보건표지의 종류와 기본모형이란?", "back": "기본모형이 <strong>사각형</strong>이면 <strong>안내표지</strong>다. 급할 때는 글자를 읽을 겨를이 없으므로 모양만 보고도 뜻이 갈리게 만들어 두었다.<p><strong>◈ 암기</strong> <u>금지는 원+사선 · 경고는 삼각 · 지시는 원 · 안내는 사각</u>.</p><p>산업안전보건법 시행규칙 별표6(종류와 형태), 별표7(기본모형). 크기는 안전거리 L 에 따라 정해진다.</p><p><em>근거 — 시행규칙 별표6·별표7</em></p>", "nq": 1}, "card_mgt_t004": {"kind": "단답형", "fq": 2, "subject": "안전관리론", "chapter": "", "mid": "일반건강진단", "front": "일반건강진단은?", "back": "<ul><li>일반건강진단은 <strong>사무직 2년에 1회 이상</strong>, <strong>사무직 외 1년에 1회 이상</strong>이다. 사무직이 더 뜸한 것은 유해인자에 노출될 일이 적기 때문이다.</li><li><strong>사무직은 2년에 1회 이상, 그 밖의 근로자는 1년에 1회 이상</strong>이다.</li></ul><p><strong>◈ 암기</strong> 「<u>일 · 특 · 배 · 수 · 임</u>」 다섯 가지. · <u>사무직 2년, 그 밖 1년</u>.</p><p>(일반건강진단), 시행규칙 제197조.<br><strong>사무직이 더 뜸하다</strong>는 것 하나로 네 보기 가운데 둘이 걸러진다. <strong>「사무직 2년, 그 밖 1년」</strong>이라는 짝 하나로 끝난다.</p><div style=\"margin:12px 0 2px;font-weight:700\">건강진단 다섯 가지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대상</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">주기·시기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">일반</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">모든 근로자</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">사무직 <u>2년 1회 이상</u> / 그 밖 <u>1년 1회 이상</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">특수</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">유해인자 노출 업무·야간작업 종사자</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">유해인자별 6~24개월</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">배치전</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">특수건강진단 대상 업무에 새로 배치</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">배치 전</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">수시</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">직업성 천식·피부염 등 증상이 보일 때</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">그때그때</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">임시</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">같은 부서에 유사 질병이 잇따를 때</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">관서장 명령</td></tr></tbody></table></div><p><em>근거 — 산업안전보건법 제129조 · 시행규칙 제197조</em></p>", "nq": 2}, "card_mgt_t005": {"kind": "단답형", "fq": 3, "subject": "안전관리론", "chapter": "무재해운동", "mid": "위험예지훈련 4라운드", "front": "위험예지훈련 4라운드는?", "back": "<ul><li>4라운드의 마지막은 <strong>목표설정</strong>이다. 위험예지훈련은 사고가 난 뒤 원인을 캐는 활동이 아니라, 작업 전에 위험을 짚고 <strong>오늘 지킬 것 하나</strong>를 정하는 활동이다. 원인을 캐는 것은 재해조사다.</li><li><strong>현상파악 → 본질추구 → 대책수립 → 목표설정</strong>이다. 무엇이 위험한지 꺼내고, 그중 핵심을 고르고, 대책을 내고, 오늘 지킬 것 하나를 정한다.</li><li><strong>「안전평가」</strong>라는 라운드는 없다. 넷은 <strong>현상파악 · 본질추구 · 대책수립 · 행동목표 설정</strong>이다.</li></ul><p><strong>◈ 암기</strong> 「<u>현 · 본 · 대 · 목</u>」. · <u>현상파악 · 본질추구 · 대책수립 · 행동목표</u>.</p><p>4R 뒤에 <strong>터치 앤드 콜</strong>로 다짐하며 마무리한다.<br>흐름은 <strong>보고 → 캐고 → 세우고 → 다짐한다</strong>다. 마지막 4R 에서 <strong>「~를 하자, 좋아!」라고 소리쳐 확인</strong> 하는 것이 이 훈련의 특징이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">위험예지훈련 4라운드</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">라운드</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 하나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">묻는 말</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1R</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>현상파악</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어떤 위험이 있나</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">「어떤 위험이 숨어 있는가?」</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2R</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>본질추구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>무엇이 진짜 문제인가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">「이것이 위험의 요점이다」</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3R</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>대책수립</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어떻게 할 것인가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">「당신이라면 어떻게 하겠는가?」</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4R</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>행동목표 설정</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>무엇을 지킬 것인가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">「우리는 이렇게 한다」</td></tr></tbody></table></div>", "nq": 6}, "card_mgt_t006": {"kind": "단답형", "fq": 1, "subject": "안전관리론", "chapter": "보호구", "mid": "지시표
