)$. 이 문제처럼 모든 교집합이 같은 값이면 계수가 <u>-3+1 = -2</u>로 정리된다. 컷셋 두 개면 계수가 -1 이라는 점과 짝지어 외운다.</p>", "nq": 1}, "card_erg_t002": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "FTA 논리게이트", "front": "FTA 논리게이트는?", "back": "<strong>부정 게이트(NOT gate)</strong>다. 입력이 참이면 출력이 거짓, 입력이 거짓이면 출력이 참으로 <strong>뒤집힌다</strong>.<p><strong>◈ 암기</strong> <u>값을 뒤집는 것은 부정 게이트 하나뿐</u>.</p><p>FTA 게이트. 기본은 <u>AND(모두 일어나야)</u>와 <u>OR(하나만 일어나도)</u>이고, 여기에 조건을 붙인 것이 <u>수정 게이트(억제·조합·배타적 OR·우선적 AND·위험지속)</u>다. 부정 게이트만 유일하게 <u>값을 뒤집는다</u>.</p>", "nq": 1}, "card_erg_t003": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "최소 컷셋과 최소 패스셋", "front": "최소 컷셋과 최소 패스셋은?", "back": "컷셋은 <strong>그 사상이 모두 일어나면 정상사상이 일어나는 조합</strong>이고, 최소 컷셋은 그중 <strong>더 줄일 수 없는</strong> 것이다. 부울 대수로 정리한 뒤 남는 항 가운데 다른 항을 포함하는 것을 지우면 최소 컷셋이 나온다.<p><strong>◈ 암기</strong> <u>컷셋은 위험성, 패스셋은 안전성</u>. 컷셋이 작을수록 취약하다.</p><p>컷셋과 패스셋. <u>최소 컷셋은 시스템의 위험성</u>(그것만 무너지면 끝나는 지점), <u>최소 패스셋은 시스템의 안전성</u>(그것만 살아 있으면 버티는 지점)을 나타낸다. 최소 컷셋의 <u>크기가 작을수록 취약</u> 하다.</p>", "nq": 1}, "card_erg_t004": {"kind": "용어형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "인간공학의 정의와 기본 철학", "front": "인간공학의 정의와 기본 철학이란?", "back": "방향이 거꾸로다. 인간공학은 <strong>기계와 작업을 사람에게 맞추는</strong> 학문이다(fitting the task to the man). 사람을 기계에 맞추라는 것은 인간공학이 나오기 전의 낡은 발상이며, 그렇게 하면 사람이 무리하다 다친다.<p>인간공학의 기본 철학. <u>「사람을 일에 맞추지 말고 일을 사람에게 맞춘다」</u>. 이 한 줄이 인간공학 문항의 절반을 가른다. 위험성 감소대책에서 공학적 대책이 관리적 대책보다 앞서는 것도 같은 뿌리다.</p>", "nq": 1}, "card_erg_t005": {"kind": "공식형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "phon 과 sone", "front": "phon 과 sone의 식은?", "back": "<ul><li><strong>1 sone 은 1,000 [Hz] 순음이 40 [dB] 일 때의 음량</strong>으로 정의한다. 「천 헤르츠, 사십 데시벨」을 묶어 외운다.</li><li>1,000 [Hz] 에서는 <strong>dB = phon</strong>이다. $\\mathrm{sone} = 2^{( \\mathrm{phon} - 40 ) / 10}$ 이므로 60 [phon] 은 $2^{2} = 4$ [sone] 이다. 4배면 16 [sone] 이고, $16 = 2^{4}$ 이므로 $\\mathrm{phon} = 40 + 40 = 80$ 이다.</li><li><strong>1,000 [Hz] 에서는 dB 과 phon 이 같다</strong>. 70 [dB] 이면 <strong>70 [phon]</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>1,000 [Hz] · 40 [dB] = 1 sone</u>. phon 10 오르면 sone 2배. · <u>10 phon 오르면 크기는 2배</u>.</p><p>음량의 두 척도. <u>phon 은 1,000 [Hz] 순음과 같게 들리는 음압수준(dB)</u>이고, <u>sone 은 그 크기를 비율로 나타낸 값</u>이다. 관계식은 $\\mathrm{sone} = 2^{( \\mathrm{phon} - 40 ) / 10}$ 이며, <u>phon 이 10 오를 때마다 sone 은 2배</u>가 된다. 40 phon = 1 sone 이 출발점이다.<br><strong>10 [phon] 이 오를 때마다 sone 은 두 배</strong>가 된다. 「몇 배 크게 들린다」는 문제는 반드시 <strong>sone</strong>으로 옮겨 풀어야 한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">phon 과 sone</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">phon</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">sone</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">40</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1,000 [Hz] 순음 40 [dB]</u>가 기준</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">50</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">2</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">phon 이 10 오르면 sone 은 2배</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">60</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">4</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">70</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">8</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">80</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">16</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 음량의 척도</em></p>", "nq": 4}, "card_erg_t006": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "인간공학 기준 척도의 4요건", "front": "인간공학 기준 척도의 4요건은?", "back": "<strong>무오염성(freedom from contamination)</strong>은 <strong>재려는 것 말고 다른 것이 섞여 들어가지 않아야 한다</strong>는 요건이다. 예를 들어 작업 능률을 재려는데 측정값이 그날의 실내 온도에 좌우된다면 그 척도는 오염된 것이다.<p><strong>◈ 암기</strong> 「<u>적 · 무 · 신 · 민</u>」 — 적절성은 「맞는 것을 재나」, 무오염성은 「딴 것이 안 섞였나」.</p><p><u>적절성(타당성) · 무오염성 · 신뢰성 · 민감도</u>. 「<strong>적 · 무 · 신 · 민</strong>」으로 외운다. 적절성과 무오염성은 헷갈리기 쉬운데, <u>적절성은 「맞는 것을 재는가」, 무오염성은 「딴 것이 안 섞였는가」</u>로 갈린다.</p>", "nq": 1}, "card_erg_t007": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "통화이해도 척도", "front": "통화이해도 척도는?", "back": "<strong>통화 간섭 수준(PSIL, Preferred-octave Speech Interference Level)</strong>이다. 소음의 옥타브 밴드 음압수준을 평균 내어 <strong>잡음이 말소리를 얼마나 방해하는가</strong>를 추정한다.<p><strong>◈ 암기</strong> <u>PSIL 은 잡음, AI 는 신호 대 잡음비, 이해도 점수는 실제로 알아들은 비율</u>.</p><p>네 가지. <u>명료도 지수(AI) · 통화 간섭 수준(PSIL) · 이해도 점수 · 소음기준곡선(NC)</u>. 무엇을 재는지로 가른다 — <u>PSIL 은 잡음 쪽</u>, <u>AI 는 신호 대 잡음비</u>, <u>이해도 점수는 사람이 실제로 알아들은 비율</u>.</p>", "nq": 1}, "card_erg_t008": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "시스템 수명주기와 위험분석 기법", "front": "시스템 수명주기와 위험분석 기법은?", "back": "<ul><li><strong>PHA(예비위험분석)</strong>다. 시스템을 어떻게 만들지 아직 구상만 하고 있는 <strong>개념 형성 단계</strong>에서 「이 시스템에 어떤 위험이 있을 수 있는가」를 크게 훑어보는 최초의 분석이다.</li><li><strong>운전단계(운용단계)</strong>가 마지막이다. 만들어 쓰기 시작한 뒤가 가장 나중이다.</li></ul><p><strong>◈ 암기</strong> <u>예비(P)가 가장 먼저</u> — 구상기 PHA → 설계기 FHA·FMEA·FTA → 운용기 O&amp;SHA. · <u>구 · 정 · 개 · 생 · 운</u> — 운전이 마지막.</p><p>시스템 수명주기와 분석기법의 짝. <u>구상기 PHA → 설계·개발기 FHA·FMEA·FTA → 생산기 안전성 검토 → 운용기 O&amp;SHA</u>. 「<u>예비(P)가 가장 먼저</u>」라는 이름 자체가 힌트다.<br><strong>단계마다 알맞은 분석기법</strong>이 있다. <strong>PHA 는 맨 처음(구상단계)</strong>에 하는 것이 특징이라 「예비(preliminary)」라는 이름이 붙었다.</p><div style=\"margin:12px 0 2px;font-weight:700\">시스템 수명주기의 다섯 단계와 위험분석</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">주요 분석</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>구상단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>PHA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 먼저 하는 개략 분석</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정의(사양결정)단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>FHA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">분담 제작 부분의 위험</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>개발단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>FMEA · FTA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">설계 확정</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생산단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">품질관리</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">제조</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>5</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>운전(운용)단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안전점검 · O&amp;SHA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>마지막</u></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t009": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "예비위험분석(PHA)의 위험성 범주", "front": "예비위험분석(PHA)의 위험성 범주는?", "back": "PHA 의 네 범주는 <strong>파국적 · 중대 · 한계적 · 무시가능</strong>이다. 「수용가능」이 아니라 <strong>무시가능(negligible)</strong>이다.<p><strong>◈ 암기</strong> 「<u>파 · 중 · 한 · 무</u>」 — 넷째는 수용가능이 아니라 <u>무시가능</u>.</p><p>PHA 는 <strong>구상 단계</strong>에서 하는 최초의 위험분석이라, 위험을 네 등급으로 크게 훑는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">PHA 의 위험성 4범주</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">범주</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조치</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>파국적 catastrophic</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">사망 또는 시스템 완전 손실</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">설계 변경 필수</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>중대 critical</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">심각한 부상, 시스템 중대 손상</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">즉시 시정</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>한계적 marginal</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">경미한 부상, 제어 가능</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">통제하며 운용</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무시가능 negligible</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">부상이나 손상이 없음</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">조치 불필요</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t010": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "직렬·병렬 신뢰도", "front": "직렬·병렬 신뢰도의 식은?", "back": "<ul><li>타이어는 <strong>하나만 터져도 차가 못 간다</strong>므로 <strong>직렬</strong>이다. 하나의 신뢰도가 $1 - 0.01 = 0.99$ 이고 넷이 직렬이므로 $0.99^{4} \\fallingdotseq 0.96$ 이다.</li><li>직렬은 곱한다. $0.6 \\times 0.9 = 0.54$ 다.</li><li>가운데 세 갈래를 먼저 묶는다. 위·아래 갈래는 직렬이라 $0.8 \\times 0.8 = 0.64$ 이고 가운데는 0.90 이다. 병렬이므로 $1 - ( 1 - 0.64 ) ( 1 - 0.90 ) ( 1 - 0.64 ) = 1 - 0.36 \\times 0.10 \\times 0.36 = 0.98704$ 다. 앞뒤 0.75 를 곱하면 $0.75 \\times 0.98704 \\times 0.75 \\fallingdotseq 0.5552$ 다.</li></ul><p><strong>◈ 암기</strong> <u>하나만 고장 나도 멈추면 직렬</u>, 하나가 고장 나도 버티면 병렬. · <u>직렬은 곱하기, 병렬은 1에서 빼기</u>.</p><p>직렬은 $R = R_{1} R_{2} \\cdots R_{n}$ 으로 부품이 늘수록 나빠지고, 병렬은 $R = 1 - ( 1 - R_{1} ) ( 1 - R_{2} ) \\cdots$ 로 늘수록 좋아진다.<br><strong>직렬은 </strong>$\\prod R_{i}$<strong>, 병렬은 </strong>$1 - \\prod ( 1 - R_{i} )$다. <strong>직렬은 가장 약한 것보다 더 낮아지고, 병렬은 가장 강한 것보다 더 높아진다</strong>.</p>", "nq": 3}, "card_erg_t011": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "신뢰성·보전성 지표와 가용도", "front": "신뢰성·보전성 지표와 가용도의 식은?", "back": "<strong>MTTR(Mean Time To Repair, 평균수리시간)</strong>이다. <strong>보전도</strong>를 나타내는 지표이며, 짧을수록 좋다.<p><strong>◈ 암기</strong> <u>MTBF·MTTF 는 신뢰도, MTTR 는 보전도</u>.</p><p>신뢰성과 보전성의 구분. <u>신뢰도는 「잘 고장 나지 않는가」(MTBF · MTTF)</u>, <u>보전도는 「빨리 고칠 수 있는가」(MTTR)</u>다. 둘을 합친 것이 가용도 $A = \\mathrm{MTBF} / ( \\mathrm{MTBF} + \\mathrm{MTTR} )$ 이며, $\\mathrm{MTBF} = \\mathrm{MTTF} + \\mathrm{MTTR}$ 의 관계도 함께 외운다.</p><div style=\"margin:12px 0 2px;font-weight:700\">신뢰성·보전성 지표</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">지표</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 나타내나</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">MTBF</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">고장과 고장 사이의 평균 시간</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>신뢰도</u> — 수리하며 쓰는 설비</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">MTTF</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">고장까지의 평균 시간</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>신뢰도</u> — 수리하지 않는 부품</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">MTTR</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">평균 수리시간</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>보전도</u> — 짧을수록 좋다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">가용도</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">MTBF ÷ (MTBF + MTTR)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">쓸 수 있는 시간의 비율</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t012": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "OWAS", "front": "OWAS는?", "back": "OWAS 는 <strong>허리 · 팔(상지) · 다리(하지) · 하중(무게)</strong> 네 가지를 코드로 매겨 자세를 평가한다. 네 요소를 모두 보므로 정답은 ④다. 사진이나 동영상으로 자세를 찍어 코드만 매기면 되므로 <strong>현장에서 빠르게 쓸 수 있다</strong>는 것이 이 기법의 장점이다.<p><strong>◈ 암기</strong> <u>허리 · 상지 · 하지 · 하중</u> 네 가지 모두 본다.</p><p>의 비교. <u>OWAS(허리·상지·하지·하중, 전신 자세)</u>, <u>RULA(상지 중심)</u>, <u>REBA(전신, 간병 등 예측 어려운 자세)</u>, <u>NLE/LI(들기 작업의 무게 한계)</u>. 무엇을 보려는지로 고른다.</p><p><em>근거 — 근골격계 작업분석 기법</em></p>", "nq": 1}, "card_erg_t013": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "스트레인의 생리적 측정 척도", "front": "스트레인의 생리적 측정 척도는?", "back": "<strong>육체적 동적 활동</strong>은 <strong>심박수·산소소비량</strong>으로 잰다. <strong>GSR(피부전기반사)</strong>은 손바닥의 땀 분비에 따른 전기저항 변화를 보는 것이라 <strong>정서적 긴장</strong>을 재는 척도다. 몸을 얼마나 썼는지와는 상관이 없다.<p><strong>◈ 암기</strong> <u>EEG 뇌파 · EOG 눈 · EMG 근육 · GSR 땀(정서)</u>.</p><p>생리적 측정 척도. <u>EEG 뇌파(인지) · EOG 안구운동(정신운동) · EMG 근전도(국부 근육) · ECG 심전도와 산소소비량(전신 동적 활동) · GSR 피부전기반사(정서적 긴장)</u>. 「어디를 재는가」로 짝지으면 된다.</p>", "nq": 1}, "card_erg_t014": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "작업환경관리", "mid": "습구흑구온도지수(WBGT)", "front": "습구흑구온도지수(WBGT)의 식은?", "back": "<ul><li><strong>햇볕이 있는 옥외</strong>는 건구온도까지 넣는 식을 쓴다. $\\mathrm{WBGT} = 0.7 \\times \\text{자연습구} + 0.2 \\times \\text{흑구} + 0.1 \\times \\text{건구}$ 이므로 $0.7 \\times 20 + 0.2 \\times 18 + 0.1 \\times 30 = 14 + 3.6 + 3 = 20.6$ [℃] 다.</li><li>옥내 또는 햇볕 없는 옥외는 $0.7 \\times \\text{자연습구} + 0.3 \\times \\text{흑구}$ 다. 두 계수의 합이 <strong>1</strong>이 되어야 한다.</li><li>실내(태양광선이 없는 곳)는 $\\mathrm{WBGT} = 0.7 \\mathrm{NWB} + 0.3 GT$ 다.</li></ul><p><strong>◈ 암기</strong> <u>자연습구 0.7 은 언제나 같고, 건구 0.1 은 햇볕이 있을 때만</u>. · <u>실내는 0.7 + 0.3, 옥외는 0.7 + 0.2 + 0.1</u>.</p><p>WBGT 두 가지 식. <u>옥내 또는 햇볕 없는 옥외 : 0.7 자연습구 + 0.3 흑구</u>, <u>햇볕 있는 옥외 : 0.7 자연습구 + 0.2 흑구 + 0.1 건구</u>. <u>자연습구의 가중치 0.7 은 어느 경우에나 같고, 건구는 햇볕이 있을 때만 0.1 로 들어간다</u>는 점이 갈림길이다.<br>햇볕이 있는 옥외는 $0.7 \\times \\text{자연습구} + 0.2 \\times \\text{흑구} + 0.1 \\times \\text{건구}$ 다.</p><div style=\"margin:12px 0 2px;font-weight:700\">WBGT 의 두 식</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>실내 · 옥외(태양광선 없음)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$0.7 \\mathrm{NWB} + 0.3 GT$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>두 항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>옥외(태양광선 있음)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$0.7 \\mathrm{NWB} + 0.2 GT + 0.1 DB$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>세 항</u></td></tr></tbody></table></div>", "nq": 3}, "card_erg_t015": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "HAZOP 의 가이드워드", "front": "HAZOP 의 가이드워드는?", "back": "<ul><li><strong>Other than 은 「완전한 대체」</strong>, 곧 의도한 것과 <strong>전혀 다른 것이 일어남</strong>을 뜻한다. 「기타 환경적인 요인」이 아니다.</li><li><strong>OTHER THAN</strong>이다. <strong>완전히 다른 것으로 바뀐</strong> 상태를 뜻한다.</li><li><strong>Other than 은 「완전한 대체」</strong>다. <strong>「기타 환경적인 요인」</strong>이라는 뜻이 아니다.</li></ul><p><strong>◈ 암기</strong> <u>양은 More/Less, 질은 As well as / Part of</u>. Other than 은 완전한 대체. · <u>완전히 다른 것 = OTHER THAN</u>.</p><p><u>No/Not(설계 의도의 완전한 부정) · More/Less(양적 증감) · As well as(질적 증가) · Part of(질적 감소) · Reverse(설계 의도와 반대) · Other than(완전한 대체)</u>. <u>양적인 것은 More/Less, 질적인 것은 As well as / Part of</u>로 짝지어 두면 된다.<br><strong>AS WELL AS 와 PART OF 는 양이 아니라 성질</strong>을 말한다. <strong>MORE/LESS 가 양</strong> 쪽이다. 이 대비가 가장 자주 물어진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">HAZOP 의 가이드워드</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">가이드워드</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 가리키나</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>NO / NOT</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>설계 의도의 완전한 부정</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">전혀 일어나지 않음</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>MORE / LESS</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>양의 증가 또는 감소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">유량·압력·온도가 많거나 적음</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>AS WELL AS</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>성질상의 증가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">의도한 것에 <u>덧붙여</u> 다른 것도</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>PART OF</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>성질상의 감소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">의도한 것의 <u>일부만</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>REVERSE</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>설계 의도와 반대</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">역류</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>OTHER THAN</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>완전한 대체</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전혀 다른 것</u>으로 바뀜</td></tr></tbody></table></div>", "nq": 4}, "card_erg_t016": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "명순응과 암순응", "front": "명순응과 암순응은?", "back": "완전한 <strong>암조응(암순응)</strong>에는 <strong>30 ~ 40분</strong>이 걸린다. 간상세포의 시홍(로돕신)이 다시 만들어지는 데 그만큼 시간이 필요하기 때문이다.<p><strong>◈ 암기</strong> <u>어두워지는 데 30~40분, 밝아지는 데 1~3분</u>.</p><p>순응의 비대칭. <u>어두워지는 데는 30 ~ 40분, 밝아지는 데는 1 ~ 3분</u>으로 크게 다르다. 터널 입구에 조명을 두어 밝기를 서서히 낮추는 것, 야간작업 전에 미리 어두운 곳에서 눈을 적응시키는 것이 모두 이 성질에서 나온 대책이다. <u>적색 조명</u>은 간상세포를 자극하지 않아 암조응을 지키면서도 볼 수 있게 해 준다.</p>", "nq": 1}, "card_erg_t017": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "양립성의 네 가지", "front": "양립성의 네 가지는?", "back": "<ul><li><strong>양식(modality) 양립성</strong>은 <strong>자극을 받는 감각과 반응하는 방식이 서로 맞는가</strong>를 말한다. <strong>귀로 들려주고 입으로 답하게 하는 것</strong>이 그 예다. 반대로 소리로 물어보고 손으로 버튼을 누르게 하면 그만큼 반응이 느려진다.</li><li>양립성은 <strong>공간 · 운동 · 개념 · 양식</strong> 네 가지다. 「감성의 양립성」은 없다.</li><li><strong>양식(modality) 양립성</strong>이다. <strong>귀로 들었으면 입으로 답하는</strong> 것처럼 자극과 응답의 <strong>감각 양식이 맞는</strong> 경우다.</li></ul><p><strong>◈ 암기</strong> <u>공간(위치) · 운동(방향) · 개념(뜻) · 양식(감각과 반응)</u>. · 「<u>공 · 운 · 개 · 양</u>」 — 감성은 없다.</p><p>양립성 네 가지. <u>공간(위치) · 운동(방향) · 개념(뜻) · 양식(감각과 반응의 방식)</u>. 양립성이 어긋난 설계는 평소에는 그럭저럭 쓰이다가 <u>급할 때 반드시 실수를 부른다</u>. 이것이 양립성이 안전의 문제인 이유다.<br>양립성이 어긋난 설계는 평소에는 그럭저럭 쓰이다가 <strong>급할 때 반드시 실수를 부른다</strong>. 이것이 양립성이 안전의 문제인 까닭이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">양립성의 네 가지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>공간적 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>배치가 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">오른쪽 버너는 오른쪽 손잡이</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>운동 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>움직임이 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">시계 방향으로 돌리면 증가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>개념적 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>뜻이 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>빨강은 뜨거움, 파랑은 차가움</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>양식 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>자극과 응답의 감각 양식이 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>들으면 말로 답한다</u></td></tr></tbody></table></div>", "nq": 7}, "card_erg_t018": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "FTA 와 FMEA 의 대비", "front": "FTA 와 FMEA 의 대비는?", "back": "<ul><li>FTA 는 <strong>복잡하고 대형화된 시스템</strong>의 신뢰성과 안전성을 분석하는 기법이다. 정상사상을 먼저 정하고 그 원인을 거꾸로 파고드는 <strong>연역적·하향식(top-down)</strong> 기법이며, 각 사상의 확률을 알면 <strong>정량적 계산도 된다</strong>.</li><li>FTA 는 각 사상의 확률을 넣으면 <strong>정량적 분석도 된다</strong>. 「정성적 분석만」이 틀렸다.</li><li>FTA 는 <strong>톱다운(Top-Down)</strong> 방식이다. <strong>정상사상에서 시작해 아래로 원인을 캐 내려간다</strong>. 바텀업은 FMEA 다.</li></ul><p><strong>◈ 암기</strong> <u>FTA 는 연역·하향·정량 가능, FMEA 는 귀납·상향·정성</u>. · <u>FTA 는 위에서 아래로, 정량도 된다</u>.</p><p><u>FTA 는 연역적·하향식·정량 가능</u>, <u>FMEA 는 귀납적·상향식·정성 중심</u>이다. FTA 는 1962년 벨연구소가 미니트맨 미사일의 발사 제어 시스템을 분석하며 만든 기법이라, 처음부터 <u>크고 복잡한 시스템</u>을 겨냥하고 있었다.<br><strong>FTA 는 연역적·하향식·정량 가능</strong>, <strong>FMEA 는 귀납적·상향식·정성 중심</strong>이다. 1962년 벨연구소가 미니트맨 미사일 발사 제어를 분석하며 만들었다.</p><div style=\"margin:12px 0 2px;font-weight:700\">FTA 와 FMEA</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">FTA</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">FMEA</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">방향</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위에서 아래로 (Top-Down)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>아래에서 위로 (Bottom-Up)</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">논리</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>연역적</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>귀납적</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">분석</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정량적 가능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정성적</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">잘하는 것</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>여러 원인이 얽힌 재해</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>부품 하나하나의 고장 영향</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">한계</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">숨은 원인을 빠뜨릴 수 있다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">여러 고장이 겹친 경우에 약하다</td></tr></tbody></table></div>", "nq": 3}, "card_erg_t019": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "조도의 역제곱 법칙", "front": "조도의 역제곱 법칙의 식은?", "back": "조도는 <strong>거리의 제곱에 반비례</strong> 한다. 광도 $I = 300 \\times 3^{2} = 2 {,} 700$ [cd] 이므로 2 [m] 지점은 $2 {,} 700 / 2^{2} = 675$ [lux] 다.<p><strong>◈ 암기</strong> <u>거리가 절반이면 조도는 4배</u>.</p><p>$E = I / r^{2}$. 국소조명이 전반조명보다 적은 전력으로 밝기를 얻는 것도, 후드의 제어풍속이 거리에 따라 급격히 떨어지는 것도 같은 꼴의 관계다.</p>", "nq": 1}, "card_erg_t020": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "광속 · 광도 · 조도 · 휘도", "front": "광속 · 광도 · 조도 · 휘도의 식은?", "back": "<strong>조도</strong>는 광원의 세기가 아니라 <strong>물체의 표면에 도달하는 빛의 양</strong>이다. 광원 자체의 세기는 <strong>광도</strong>다.<p><strong>◈ 암기</strong> <u>광도는 나가는 쪽, 조도는 닿는 쪽, 휘도는 되돌아오는 쪽</u>.</p><p>조도는 $E = I / r^{2}$ 로 <strong>거리의 제곱에 반비례</strong> 한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">빛에 관한 네 가지 용어</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">용어</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단위</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>광속</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">광원이 내보내는 빛의 총량</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">lm (루멘)</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>광도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">광원 자체의 세기</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">cd (칸델라)</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>조도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">표면에 도달하는 빛의 양</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">lx (럭스)</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>휘도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">표면에서 반사·방출되는 빛의 양</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">cd/m²</td></tr></tbody></table></div>", "nq": 1}, "card_mac_t001": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "공작기계 공통 안전수칙", "front": "공작기계 공통 안전수칙은?", "back": "<ul><li>강력 절삭일수록 일감을 <strong>바이스에 깊게</strong> 물려야 한다. 짧게 물리면 큰 절삭력에 일감이 튕겨 나간다. 「강력하게 깎으니 단단히 잡는다」로 생각하면 방향이 가르면 된다.</li><li>회전하는 기계에서 <strong>장갑은 금물</strong>이다. 커터에 장갑이 물리면 손이 통째로 딸려 들어간다.</li></ul><p><strong>◈ 암기</strong> <u>회전 기계에는 장갑을 끼지 않는다</u>.</p><p>공작기계 공통 3금지. <u>회전 중 칩 제거 금지 · 회전 중 측정 금지 · 장갑 착용 금지</u>. 밀링은 여기에 <u>커터 날에 손 대지 않기(반드시 브러시 사용)</u>가 더해진다.<br>세 가지가 공통이다 — <strong>회전 중 칩 제거 금지 · 회전 중 측정 금지 · 장갑 착용 금지</strong>.</p>", "nq": 2}, "card_mac_t002": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "연삭기의 안전기준", "front": "연삭기의 안전기준은?", "back": "<ul><li><strong>작업 시작 전에는 1분 이상</strong> 시험운전을 한다. 숫돌은 눈에 안 보이는 균열이 있으면 고속 회전 중 산산조각 나므로, 사람이 없는 상태에서 먼저 돌려 보는 것이다.</li><li><strong>작업 시작 전 1분 이상, 숫돌 교체 후 3분 이상</strong> 시운전한다. <strong>③만 기준을 채운다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>작업 전 1분, 교체 후 3분</u>.</p><p>안전보건규칙 제122조(연삭기 덮개), 제123조. 숫자 묶음 — <u>작업 시작 전 1분 이상 · 교체 후 3분 이상 · 워크레스트 간격 3 [mm] 이내 · 플랜지 지름 숫돌의 1/3 이상 · 덮개 인장강도 274.5 [MPa] 이상</u>.<br><strong>「받침대 3mm, 조정편 5mm, 시운전 1분과 3분, 인장강도 274.5MPa」</strong>다 — <strong>네 보기가 모두 그 값을 조금씩 어긋나게 놓았고 하나만 제자리</strong>다.</p><div style=\"margin:12px 0 2px;font-weight:700\">연삭기의 안전기준</div 5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>덮개 재료의 인장강도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>274.5 MPa 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「224MPa」은 모자라다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>덮개 설치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>지름 5cm 이상의 연삭숫돌</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제122조·제123조</em></p>", "nq": 2}, "card_mac_t003": {"kind": "공식형", "fq": 3, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "연삭숫돌 플랜지", "front": "연삭숫돌 플랜지의 식은?", "back": "평형플랜지의 지름은 숫돌 바깥지름의 <strong>1/3 이상</strong> 이어야 하므로 $150 \\times 1 / 3 = 50$ [mm] 이상이다. 플랜지가 작으면 숫돌을 제대로 붙들지 못해 회전 중 깨진다.<p><strong>◈ 암기</strong> <u>플랜지 1/3 · 받침대 3 [mm] · 1분과 3분 · 274.5 [MPa]</u>.</p><p>안전보건규칙 제122조. <u>「1/3 이상」</u>이라는 비율 하나만 알면 숫돌 지름이 얼마로 바뀌어도 풀린다. 문제가 <u>최소값</u>을 묻는지 확인하는 습관이 필요하다.</p><div style=\"margin:12px 0 2px;font-weight:700\">연삭기 숫자 묶음</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">플랜지 지름</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">숫돌 지름의 <u>1/3 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">작으면 숫돌을 못 잡아 파열</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">워크레스트 간격</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>3 [mm] 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">벌어지면 공작물이 끼어 들어감</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">작업 시작 전 시운전</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1분 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">보이지 않는 균열을 걸러냄</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">숫돌 교체 후 시운전</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>3분 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">새 숫돌은 더 오래 돌려 본다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">덮개 인장강도</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>274.5 [MPa] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">파편을 막아야 함</td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제122조</em></p>", "nq": 1}, "card_mac_t004": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "방호장치의 분류 다섯 가지", "front": "방호장치의 분류 다섯 가지는?", "back": "<strong>위치제한형 방호장치</strong>다. 프레스의 <strong>양수조작식</strong>이 대표다. 두 손이 버튼 위에 있으면 손이 금형 사이에 있을 수 없다는 논리를 쓴다. 그래서 두 버튼 사이를 <strong>300 [mm] 이상</strong> 벌려 한 손으로 누르지 못하게 한다.<p><strong>◈ 암기</strong> <u>접근거부형은 밀어내고, 접근반응형은 멈춘다</u>.</p><p><u>격리형(덮개·울) · 위치제한형(양수조작식) · 접근거부형(손쳐내기식) · 접근반응형(광전자식) · 포집형(연삭기 칩 비산 방지)</u>. <u>접근거부형은 밀어내고, 접근반응형은 멈춘다</u>는 차이도 자주 나온다.</p>", "nq": 1}, "card_mac_t005": {"kind": "단답형", "fq": 3, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "기계설비의 위험점", "front": "기계설비의 위험점은?", "back": "<ul><li><strong>절단점</strong>은 <strong>회전하는 운동부 자체</strong> 또는 그 회전하는 기계 부분의 <strong>돌출부</strong>에서 생긴다. 다른 물체와 짝을 이루지 않고 <strong>단독으로</strong> 위험을 만든다는 점이 갈림길이다. 밀링 커터, 둥근톱 날, 벨트의 이음 부분이 그 예다.</li><li><strong>접선물림점</strong>이다. 회전체와 거기에 걸린 벨트·체인이 만나는 <strong>접선 방향</strong>으로 딸려 들어간다.</li><li><strong>끼임점(Shear point)</strong>이다. <strong>도는 것과 고정된 것 사이</strong>에서 생긴다.</li></ul><p><strong>◈ 암기</strong> <u>절단점만 짝이 없다</u>. · <u>벨트와 풀리, 체인과 스프로킷이면 접선물림</u>.</p><p>위험점 여섯 가지. <u>협착점(왕복 + 고정) · 끼임점(회전 + 고정) · 절단점(회전체 단독) · 물림점(회전 + 회전) · 접선물림점(회전체의 접선, 벨트와 풀리) · 회전말림점(회전축에 감김)</u>. <u>「무엇과 무엇 사이인가」</u>로 갈리며, 절단점만 짝이 없다.<br><strong>협착(왕복+고정) · 끼임(회전+고정) · 절단(회전체 단독) · 물림(회전+회전) · 접선물림(회전체의 접선) · 회전말림(축에 감김)</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">기계설비의 위험점 여섯 가지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">위험점</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇과 무엇 사이</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>협착점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>왕복운동 + 고정부</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">프레스 슬라이드 · 성형기</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>끼임점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>회전 + 고정부</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">연삭숫돌과 작업대 · 교반날개와 몸체</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>절단점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>회전체 자체의 운동</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">밀링 커터 · 목공 대패날</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물림점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>회전 + 회전 (반대 방향)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>롤러기 · 기어</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접선물림점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>회전체의 접선 방향</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">벨트와 풀리 · 체인과 스프로킷</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>회전말림점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>돌출된 회전부</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">회전축 · 커플링 · 드릴</td></tr></tbody></table></div>", "nq": 10}, "card_mac_t006": {"kind": "공식형", "fq": 2, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "안전율(안전계수)", "front": "안전율(안전계수)의 식은?", "back": "<ul><li>$\\text{안전율} = \\dfrac{\\text{극한강도}}{\\text{허용응력}}$ 이므로 $\\text{허용응력} = 250 / 4 = 62.5$ [N/mm²] 다.</li><li>$\\dfrac{25}{4} = 6.25$ [kg/mm²] 이다.</li><li>안전도는 <strong>인장강도 ÷ 내압</strong>이다. $1 \\rightarrow 40 / 50 = 0.80$, $2 \\rightarrow 50 / 60 = 0.83$, $3 \\rightarrow 55 / 70 = 0.79$ 이므로 <strong>2 - 1 - 3</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>허용응력 = 인장강도 ÷ 안전율</u>. · <u>안전도 = 인장강도 ÷ 내압</u>.</p><p>$S = \\dfrac{\\text{극한강도}}{\\text{허용응력}} = \\dfrac{\\text{파단하중}}{\\text{안전하중}}$. 안전율은 <u>모르는 것에 대한 여유</u>다. 재료가 불균일하거나 하중이 반복되거나 사용 조건이 가혹할수록 크게 잡는다.<br><strong>안전율은 「몇 배로 버티게 해 두었나」</strong>다 — <strong>클수록 안전하지만 재료가 낭비</strong> 된다. <strong>허용응력은 그 배수만큼 낮춰 놓은 값</strong>이므로 나눗셈이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">안전율과 허용응력</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전율</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$S = \\dfrac{\\text{극한강도} ( \\text{인장강도} )}{\\text{허용응력}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>허용응력</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{극한강도}}{\\text{안전율}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전율의 다른 꼴</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{파단하중}}{\\text{안전하중}}$, $\\dfrac{\\text{파괴하중}}{\\text{최대사용하중}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 6}, "card_mac_t007": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "선반의 방호장치", "front": "선반의 방호장치는?", "back": "<ul><li><strong>칩 브레이커</strong>다. 바이트에 홈이나 턱을 만들어 칩이 길게 이어지지 못하고 짧게 부러지도록 한다. 길게 감긴 칩은 뜨겁고 날카로워 손을 베거나 몸에 감긴다.</li><li><strong>쉴드(실드)</strong>다. 투명한 가림막으로 칩과 절삭유가 튀는 것을 막는다.</li><li><strong>슬라이딩</strong>은 미끄러져 움직이는 동작을 가리키는 말이지 방호장치가 아니다.</li></ul><p><strong>◈ 암기</strong> <u>튀는 것을 막으면 쉴드</u>. · <u>쉴드 · 척 커버 · 칩 브레이커 · 브레이크</u>.</p><p>네 가지. <u>칩 브레이커(칩을 끊음) · 척 커버(척을 덮음) · 실드(칩 비산 방지) · 브레이크(급정지)</u>. 여기에 가늘고 긴 공작물을 받치는 <u>방진구</u>가 더해진다.<br>네 가지 — <strong>칩 브레이커(칩을 끊음) · 척 커버(척을 덮음) · 쉴드(비산 방지) · 브레이크(급정지)</strong>. 가늘고 긴 공작물에는 <strong>방진구</strong>를 쓴다.</p><div style=\"margin:12px 0 2px;font-weight:700\">선반의 방호장치</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 막나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>쉴드</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>칩과 절삭유 튐</u></td><td s  <u>스프링 · 중추 · 지렛대</u> 셋.</p><p>안전보건규칙 제116조(압력방출장치). 압력방출장치는 <u>1년에 1회 이상</u> 국가교정기관에서 교정받은 압력계로 작동시험을 하고 납으로 봉인한다. 다만 공정안전보고서 이행수준 평가결과가 우수한 사업장은 <u>4년에 1회 이상</u>으로 완화된다.<br>셋 모두 <strong>「어떤 힘으로 밸브를 눌러 두는가」</strong>로 갈린다 — <strong>용수철 · 추 · 지렛대</strong>. <strong>플런저는 펌프의 부품 이름</strong>이라 결이 다르다.</p><div style=\"margin:12px 0 2px;font-weight:700\">보일러의 방호장치</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">작동 조건</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">압력방출장치</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">2개 이상이면 하나는 <u>최고사용압력 이하</u>, 나머지는 <u>1.05배 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">1년 1회 이상 작동시험</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">압력제한스위치</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">최고사용압력에 이르기 전 연소를 차단</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">버너 제어</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">고저수위 조절장치</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">수위가 낮아지면 경보·차단</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">저수위 사고 방지</td></tr><tr><td sty
