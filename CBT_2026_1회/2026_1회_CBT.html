 함께 넘는 것만 비파괴검사를 요구한다.</li><li><strong>회전축 중량 1톤 초과, 원주속도 초당 120 [m] 이상</strong>인 고속회전체다.</li><li><strong>회전축 중량 1톤 초과 + 원주속도 초당 120m 이상</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>1톤 초과이고 120 [m/s] 이상</u> — 둘 다 넘어야 한다. · <u>1톤 초과, 초당 120 [m] 이상</u>.</p><p>안전보건규칙 제115조(비파괴검사의 실시). 회전시험 자체는 <u>전용 시험실이나 견고한 격벽으로 격리된 장소</u>에서 한다. 「<u>1톤과 120</u>」을 묶어 외운다.<br><strong>「1톤 초과」와 「초당 120 [m] 이상」 두 조건을 모두 갖춰야</strong> 한다 — <strong>무겁고 빠른 것이 터지면 파편이 총알처럼 날아간다</strong>. <strong>고속회전체 자체의 정의는 초당 25 [m]</strong>로 다르다.</p><div style=\"margin:12px 0 2px;font-weight:700\">고속회전체의 안전기준</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>비파괴검사 대상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>회전축 중량 1톤 초과 + 원주속도 초당 120 [m] 이상</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>회전시험 중의 위험 방지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전용 시험실에서 하거나 견고한 격벽을 설치</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>고속회전체의 정의</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>원주속도가 초당 25 [m] 를 넘는 회전체</u></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제115조</em></p>", "nq": 3}, "card_mac_t017": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "운반·양중기", "mid": "지게차의 작업 상태별 안정도", "front": "지게차의 작업 상태별 안정도는?", "back": "하역작업 시 <strong>전후 안정도는 4 [%] 이내</strong>(5톤 이상은 3.5 [%])다. 20 [%] 가 아니다. 짐을 들어 올린 상태는 무게중심이 높아 조금만 기울어도 넘어가므로 <strong>가장 엄격한</strong> 기준이 붙는다.<p><strong>◈ 암기</strong> <u>하역 4·6, 주행 18·(15+1.1V)</u> — 하역은 작고 주행은 크다.</p><p>안전보건규칙 제3편, 「지게차 안정도 기준」. 네 값 — <u>하역 전후 4 [%] · 하역 좌우 6 [%] · 주행 전후 18 [%] · 주행 좌우 (15 + 1.1V) [%]</u>. <u>하역은 작고 주행은 크다</u>는 방향만 알면 된다.</p><div style=\"margin:12px 0 2px;font-weight:700\">지게차 안정도</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">상태</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방향</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">하역작업 시 (기준 부하)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">전후</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>4 [%] 이내</u> (5톤 이상은 3.5 [%])</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">하역작업 시 (기준 부하)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">좌우</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>6 [%] 이내</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">주행 시 (기준 무부하)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">전후</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>18 [%] 이내</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">주행 시 (기준 무부하)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">좌우</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>(15 + 1.1V) [%] 이내</u></td></tr></tbody></table></div>", "nq": 1}, "card_mac_t018": {"kind": "공식형", "fq": 1, "subject": "기계위험방지기술", "chapter": "운반·양중기", "mid": "줄걸이 각도와 장력", "front": "줄걸이 각도와 장력의 식은?", "back": "$T = \\dfrac{W}{2 \\cos ( \\theta / 2 )}$ 이므로 $T = 3 / ( 2 \\times \\cos 27.5 ^{\\circ} ) = 3 / ( 2 \\times 0.8870 ) = 1.69$, 곧 <strong>약 1.7 [kN]</strong>이다.<p><strong>◈ 암기</strong> <u>0°면 W/2, 120°면 W</u> — 벌어질수록 커진다. 현장은 60° 이내.</p><p>각도가 벌어질수록 장력이 커진다. <u>0°면 W/2, 60°면 약 0.58W, 120°면 W</u>로, <u>120°를 넘으면 로프 한 가닥에 화물 무게보다 큰 힘</u>이 걸린다. 그래서 현장에서 <u>60° 이내</u>를 지키라고 한다.</p>", "nq": 1}, "card_mac_t019": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "프레스·전단기", "mid": "금형의 설치·해체·운반 안전", "front": "금형의 설치·해체·운반 안전은?", "back": "<ul><li>T홈 안길이는 설치 볼트 지름의 <strong>2배 이상</strong> 이어야 한다. 「1/2 이하」는 반대다. 볼트가 얕게 물리면 큰 프레스 하중에 빠져 금형이 떨어진다.</li><li>T홈 안길이는 설치 볼트 지름의 <strong>2배 이상</strong> 이어야 한다. 「직경 이하」로 얕게 물리면 큰 프레스 하중에 볼트가 빠져 금형이 떨어진다.</li></ul><p><strong>◈ 암기</strong> <u>T홈 안길이는 볼트 지름의 2배 이상</u>.</p><p>금형 취급의 원칙. <u>「깊게 물리고, 튀어나온 것은 줄이고, 부딪히지 않게 받친다」</u>. 금형 교체 중 슬라이드 아래에 몸이 들어갈 때는 반드시 <u>안전블록</u>을 끼운다. 전기적 잠금만으로는 오작동을 막지 못한다.<br>금형 교체 중 슬라이드 아래에 몸이 들어갈 때는 반드시 <strong>안전블록</strong>을 끼운다. 전기적 잠금만으로는 오작동을 막지 못한다.</p>", "nq": 2}, "card_ele_t001": {"kind": "공식형", "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "감전 경로의 등가회로", "front": "감전 경로의 등가회로의 식은?", "back": "저항이 모두 <strong>직렬</strong>로 이어진다. $R = 10 + 1 + 20 = 31$ [kΩ] 이므로 $I = 90 / 31 {,} 000 = 0.0029$ [A], 곧 <strong>약 2.90 [mA]</strong>다.<p><strong>◈ 암기</strong> 저항은 <u>모두 직렬로 더한다</u>.</p><p>전류는 <u>손 접촉저항 → 인체 내부저항 → 발과 대지의 접촉저항</u>을 차례로 지나므로 모두 더한다. 교류 아크용접기의 무부하 전압이 70~80 [V] 로 높은 것이 위험의 뿌리이며, 그래서 <u>자동전격방지장치</u>로 아크가 꺼지면 25 [V] 이하로 낮춘다.</p>", "nq": 1}, "card_ele_t002": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "누전차단기의 시설", "front": "누전차단기의 시설의 식은?", "back": "<ul><li><strong>50 [V] 를 초과</strong> 하는 저압 기계기구로서 사람이 쉽게 접촉할 우려가 있는 곳에 시설하는 것에는 누전차단기를 설치한다. 50 [V] 는 국제적으로 <strong>교류에서 사람이 견딜 수 있다고 보는 한계</strong>로 삼는 값이다.</li><li>물기가 있는 곳은 <strong>인체 저항이 크게 떨어져</strong> 더 엄격하게 잡는다. 일반 장소의 30 [mA] 대신 <strong>15 [mA] 이하</strong>, 동작시간은 <strong>0.03초 이하</strong>다.</li><li><strong>사용전압 50 [V] 를 넘으면</strong> 누전차단기를 달아야 한다. 50 [V] 아래는 감전되어도 위험이 낮다고 본다.</li></ul><p><strong>◈ 암기</strong> <u>일반 30, 물기 15</u> — 시간은 둘 다 0.03초. · <u>50 [V] 넘으면 누전차단기</u>.</p><p>「<u>50 [V] 초과</u>」가 기준값이다. 안전보건규칙 제304조가 정하는 <u>대상 장소(물기·도전성 높은 장소, 임시배선 등)</u> 와는 별개의 규정이니 섞지 않는다.<br>30 [mA]·0.03초는 Dalziel 의 심실세동 한계 $I = 165 / \\sqrt{T}$ 에서 나온 값이다. 물기가 있으면 그 여유가 사라진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">누전차단기의 정격감도전류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">설치 장소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">정격감도전류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">동작시간</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">일반 장소</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>30 [mA] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.03초 이내</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물기 있는 장소</u> (욕실·화장실 등)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>15 [mA] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.03초 이내</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">인체 감전보호용</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">30 [mA] 이하</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">0.03초 이내</td></tr></tbody></table></div><p><em>근거 — 한국전기설비규정(KEC) 211.2.4</em></p>", "nq": 6}, "card_ele_t003": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "누전차단기의 설치 예외", "front": "누전차단기의 설치 예외는?", "back": "<ul><li><strong>절연대 위</strong>에서 쓰는 기계·기구는 사람이 대지와 끊겨 있어 전류가 몸을 지나 땅으로 흐를 길이 없다. 그래서 누전차단기 설치 대상에서 빠진다.</li><li>생략할 수 있는 것은 <strong>대지전압 150 [V] 이하</strong>를 물기 없는 곳에 시설하는 경우다. 200 [V] 는 이를 넘으므로 <strong>누전차단기를 달아야 한다</strong>.</li></ul><p><strong>◈ 암기</strong> 예외 셋 — <u>이중절연 · 절연대 위 · 비접지방식</u>. · <u>대지전압 150 [V] 이하</u> 라야 생략 — 200 은 안 된다.</p><p>안전보건규칙 제304조(누전차단기에 의한 감전방지). 예외는 <u>이중절연 구조 · 절연대 위 사용 · 비접지방식 전원(절연변압기 2차 300 [V] 이하, 3 [kVA] 이하)</u> 세 가지다. 전부 <u>「접지 없이도 감전되지 않는 구조」</u>라는 공통점이 있다.<br>생략의 논리는 하나다 — <strong>누전차단기가 없어도 감전될 길이 없는 경우</strong>. 건조·절연·이중절연·비접지방식이 모두 그런 경우다.</p><p><em>근거 — 안전보건규칙 제304조</em></p>", "nq": 2}, "card_ele_t004": {"kind": "공식형", "fq": 3, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "Dalziel 의 심실세동 전류식", "front": "Dalziel 의 심실세동 전류식의 식은?", "back": "$W = I^{2} R T$ 이다. $I = 165 / \\sqrt{1} = 165$ [mA] $= 0.165$ [A] 이므로 $W = ( 0.165 )^{2} \\times 500 \\times 1 = 0.027225 \\times 500 = 13.6$ [J] 다.<p><strong>◈ 암기</strong> $I = 165 / \\sqrt{T}$ [mA], $W = I^{2} R T$. <u>1초에 13.6 [J]</u>.</p><p>$I = 165 / \\sqrt{T}$ [mA] (체중 70 [kg] 기준, 통전시간 T 는 초). 위험한계 에너지는 $W = I^{2} R T$ 로 구하며 대략 <u>13.6 [J]</u>이 나온다. 통전시간이 <u>4배가 되면 위험전류는 절반</u>이 되므로, 누전차단기의 동작시간을 짧게 하는 것이 결정적이다.</p>", "nq": 1}, "card_ele_t005": {"kind": "단답형", "fq": 3, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "감전사고의 방지대책", "front": "감전사고의 방지대책은?", "back": "<ul><li><strong>정격표시</strong>는 그 기기를 어떤 조건에서 쓰라고 알려 주는 <strong>사용 정보</strong>이지 감전을 막는 조치가 아니다. 표시를 붙였다고 해서 사람이 충전부에 닿는 것이 막히지는 않는다.</li><li>충전부에는 <strong>통전망이 아니라 절연 덮개나 방호망</strong>을 씌워야 한다. <strong>전기가 통하는 망</strong>을 씌우면 오히려 감전 위험이 커진다.</li><li><strong>사고가 난 뒤의 처리 절차</strong>는 <strong>사후 대응</strong>이다. 감전을 막는 예방 대책이 아니다.</li></ul><p><strong>◈ 암기</strong> <u>통전망이 아니라 절연망</u>. · <u>사후 처리는 예방이 아니다</u>.</p><p>의 두 갈래. <u>직접 접촉 방지(절연 · 방호 · 격리 · 폐쇄형 외함)</u>와 <u>간접 접촉 방지(보호접지 · 누전차단기 · 이중절연 · 등전위본딩 · 비접지 전원)</u>. 표지·교육은 이 조치들에 <u>더해서</u> 붙이는 것이지 대신할 수 없다.<br>충전부 방호의 다섯 가지 — <strong>절연물로 감싼다 · 폐쇄형 외함 · 방호망이나 절연 덮개 · 대지전압 30 [V] 이하 · 출입이 어려운 곳에 두고 위험표시</strong>. <strong>모두 「전기가 안 통하게」</strong> 하는 쪽이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">감전 방지대책</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대책</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원리</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>보호접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>새는 전류를 땅으로 보낸다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>누전차단기 설치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>새면 곧바로 끊는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>절연방호구 사용</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>충전부와 사람 사이를 가로막는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>이중절연기기 · 안전전압 사용</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>애초에 위험을 없앤다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정격 표시</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>성능을 알린다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>감전 방지가 아니다</u></td></tr></tbody></table></div>", "nq": 4}, "card_ele_t006": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "전격사의 세 가지 기전", "front": "전격사의 세 가지 기전은?", "back": "<strong>내장파열</strong>은 추락이나 충돌 같은 <strong>기계적 충격</strong>으로 생기는 손상이지 전류가 몸을 지나며 일으키는 죽음의 경로가 아니다.<p>전격사의 3대 기전. <u>심실세동(혈액순환 정지) · 호흡중추 마비(호흡 정지) · 흉부 수축에 의한 질식</u>. 셋 다 <u>전류가 몸을 지나며 신경과 근육을 교란</u> 해서 생긴다. 그래서 응급조치의 핵심이 <u>심폐소생술</u>이다.</p>", "nq": 1}, "card_ele_t007": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "IP 보호등급", "front": "IP 보호등급은?", "back": "<ul><li>IP 등급은 <strong>두 자리 숫자</strong>로 되어 있다. <strong>앞자리(제1 특성 숫자)는 고체(분진·이물)에 대한 보호</strong>, <strong>뒷자리(제2 특성 숫자)는 물에 대한 보호</strong>다. 앞자리가 1이면 <strong>지름 50 [mm] 이상</strong>의 고체를 막는다는 뜻이다.</li><li>유입 방폭구조의 변압기는 <strong>IP66</strong>이 최소 등급이다. 앞자리 6은 <strong>완전 방진</strong>, 뒷자리 6은 <strong>강한 분사수에 견딤</strong>을 뜻한다.</li></ul><p><strong>◈ 암기</strong> <u>앞자리는 고체(먼지), 뒷자리는 물</u>. · <u>앞은 먼지, 뒤는 물</u> — 유입 변압기는 IP66.</p><p>IP(Ingress Protection) 등급. <u>앞자리는 고체, 뒷자리는 물</u>. 앞자리 1은 50 [mm], 2는 12.5 [mm], 3은 2.5 [mm], 4는 1 [mm], 5는 방진, 6은 완전 방진이다. 「<u>앞은 먼지, 뒤는 물</u>」 한 줄만 알면 선택지 절반이 걸러진다.<br><strong>앞자리는 고체(먼지), 뒷자리는 물</strong>이다. 앞자리 5는 방진, 6은 완전 방진이며 뒷자리 5는 분사수, 6은 강한 분사수다.</p><div style=\"margin:12px 0 2px;font-weight:700\">IP 보호등급 — 앞자리는 고체, 뒷자리는 물</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">숫자</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">제1 특성 (고체·분진)</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">제2 특성 (물)</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">0</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">보호 없음</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">보호 없음</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">1</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>지름 50 [mm] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">수직으로 떨어지는 물방울</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">2</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">지름 12.5 [mm] 이상</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">15° 기울여 떨어지는 물방울</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">3</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">지름 2.5 [mm] 이상</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">60° 범위의 물보라</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">4</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">지름 1 [mm] 이상</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">모든 방향의 물보라</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">5</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">방진 — 먼지가 조금 들어와도 지장 없음</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">모든 방향의 분사수</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">6</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">완전 방진</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">강한 분사수</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t008": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "", "mid": "전자파 인체보호기준", "front": "전자파 인체보호기준은?", "back": "송·배전선로 등에서 일반인이 상시 노출되는 한도는 <strong>전계 3.5 [kV/m] 이하, 자계 83.3 [μT] 이하</strong>다.<p><strong>◈ 암기</strong> <u>3.5 와 83.3</u>을 한 묶음으로.</p><p>국제비이온화방사보호위원회(ICNIRP) 권고를 받아들인 값이다.</p><p><em>근거 — 전기설비기술기준</em></p>", "nq": 1}, "card_ele_t009": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "분진 위험장소의 구분", "front": "분진 위험장소의 구분은?", "back": "<strong>20종 장소</strong>다. 분진 위험장소는 <strong>20 · 21 · 22종</strong>으로 나누며, 가스의 0 · 1 · 2종에 각각 대응한다. 「지속적으로 또는 장기간 또는 빈번히」가 가장 위험한 등급을 가리키는 표현이다.<p><strong>◈ 암기</strong> <u>가스 0/1/2 ↔ 분진 20/21/22</u>.</p><p>위험장소의 대응. <u>가스 0/1/2종 ↔ 분진 20/21/22종</u>. 앞에 20을 붙인다고 생각하면 쉽다. 분진은 가스와 달리 <u>쌓인 층의 단열 효과로 기기 표면온도가 올라가는 것</u>도 함께 봐야 한다.</p><p><em>근거 — KS C IEC 60079-10-2</em></p>", "nq": 1}, "card_ele_t010": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "기기보호등급(EPL)", "front": "기기보호등급(EPL)은?", "back": "<ul><li>EPL 의 뒤 글자는 보호 수준을 나타내며 <strong>a(매우 높음) · b(높음) · c(강화된)</strong> 세 가지다. 다만 <strong>광산용 M 은 Ma 와 Mb 두 가지뿐</strong>이라 <strong>Mc 는 없다</strong>.</li><li>EPL 은 <strong>Equipment Protection Level(기기보호등급)</strong>의 줄임말이다. 「Explosion」이 아니다. 폭발성 가스 분위기에서 보호등급이 가장 높은 것이 <strong>EPL Ga</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>M 에만 c 가 없다</u> — Ma·Mb 뿐. · <u>EPL 은 Equipment</u> — Ga 가 가장 높다.</p><p>EPL(Equipment Protection Level). 앞 글자는 대상 분위기 — <u>G(gas) · D(dust) · M(mine)</u>. 뒤 글자는 보호 수준 — <u>a · b · c</u>. 조합은 <u>Ga/Gb/Gc · Da/Db/Dc · Ma/Mb</u>로 여덟 가지이며, <u>M 에만 c 가 없다</u>는 것이 갈림길이다.<br>앞 글자는 대상 분위기 — <strong>G(가스) · D(분진) · M(광산)</strong>. 뒤 글자는 보호 수준 — <strong>a(가장 높음) · b(높음) · c(강화된)</strong>. <strong>M 에는 c 가 없다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">기기보호등급(EPL)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대상</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조합</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">G — 가스</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">Ga · Gb · Gc</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">Ga 는 0종 장소용</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">D — 분진</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">Da · Db · Dc</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">Da 는 20종 장소용</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">M — 광산</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>Ma · Mb</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>Mc 는 없다</u> — 갈림길</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t011": {"kind": "단답형", "fq": 3, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "내압 방폭구조(d)의 세 조건", "front": "내압 방폭구조(d)의 세 조건은?", "back": "<strong>습기 침투 보호</strong>는 IP 등급이 맡는 방수·방진의 문제이지 내압 방폭구조의 조건이 아니다. 내압 방폭구조는 <strong>안에서 터져도 밖으로 옮겨 붙지 않게</strong> 하는 데 목적이 있다.<p><strong>◈ 암기</strong> <u>① 압력에 견딜 것 ② 화염이 새 나가지 않을 것 ③ 표면온도가 낮을 것</u>.</p><p>화염이 좁은 틈을 지나며 식어 밖에 불을 옮기지 못하는 원리다. 그 틈의 한계값이 <strong>최대안전틈새(MESG)</strong>이며, 폭발등급 ⅡA·ⅡB·ⅡC 를 가르는 기준이 된다.</p>", "nq": 1}, "card_ele_t012": {"kind": "공식형", "fq": 3, "subject": "전기위험방지기술", "chapter": "전기 일반", "mid": "교류 아크용접기의 허용사용률", "front": "교류 아크용접기의 허용사용률의 식은?", "back": "$\\text{허용사용률} = ( \\dfrac{\\text{정격} 2 \\text{차 전류}}{\\text{실제 사용전류}} )^{2} \\times \\text{정격사용률}$ 이므로 $( 500 / 250 )^{2} \\times 10 = 40$ [%] 다.<p><strong>◈ 암기</strong> 전류를 <u>절반으로 줄이면 사용률은 4배</u>.</p><p>용접기의 발열은 <strong>전류의 제곱</strong>에 비례하므로, 정격보다 작은 전류를 쓰면 그 제곱의 비만큼 더 오래 쓸 수 있다.</p>", "nq": 1}, "card_ele_t013": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기설비", "mid": "정전전로에서의 전기작업", "front": "정전전로에서의 전기작업은?", "back": "<ul><li><strong>검전기</strong>다. 전기가 살아 있는지(충전 여부)를 확인하는 기구이며, 정전작업 순서에서 <strong>잔류전하 방전 뒤</strong>에 쓴다.</li><li><strong>실수로 송전되거나 다른 선과 닿아 전기가 들어와도</strong> 단락접지가 전류를 대지로 흘려 작업자를 지킨다.</li><li>순서가 거꾸로다. <strong>전원을 먼저 차단한 뒤 단로기를 개방</strong> 한다. 부하가 걸린 채 단로기를 열면 <strong>아크가 크게 튀어</strong> 화상과 화재로 이어진다.</li></ul><p><strong>◈ 암기</strong> 정전작업 5단계 — <u>차단 · 잠금표찰 · 방전 · 검전 · 단락접지</u>. · <u>차단이 먼저, 단로기 개방이 나중</u>.</p><p>안전보건규칙 제319조(정전전로에서의 전기작업). 정전작업 순서는 <u>① 전로 차단 → ② 개폐기 잠금과 표찰 부착 → ③ 잔류전하 방전 → ④ 검전기로 충전 여부 확인 → ⑤ 단락접지</u>다. 검전기는 반드시 <u>정격 전압에 맞는 것</u>을 쓰고, 사용 전후에 알려진 충전부에서 동작을 확인한다.<br>정전작업은 「<strong>전기가 다시 올 수 있다</strong>」는 전제 위에 선다. 그래서 잠금·표찰로 막고, 그래도 들어올 경우를 대비해 단락접지를 건다.</p><div style=\"margin:12px 0 2px;font-weight:700\">정전작업의 절차 (규칙 제319조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">순서</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>①</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>모든 전원을 도면·배선도로 확인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">빠뜨린 전원이 없게</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>②</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전원을 차단</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>차단기로 먼저 끊는다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>③</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>각 단로기를 개방하고 확인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>부하 차단 뒤에 연다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>④</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>잠금장치와 꼬리표 부착</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">남이 못 넣게</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>⑤</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>잔류전하 방전</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">콘덴서·케이블</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>⑥</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>검전기로 충전 여부 확인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">눈으로 믿지 않는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>⑦</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>단락 접지기구로 단락 접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">그래도 들어올 경우를 대비</td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제319조</em></p>", "nq": 5}, "card_ele_t014": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기설비", "mid": "충전전로에서의 전기작업", "front": "충전전로에서의 전기작업은?", "back": "대지전압 50 [kV] 이하이면 <strong>300 [cm] 이내</strong>로 접근하지 못하게 한다. 400 [cm] 가 아니다. 50 [kV] 를 넘으면 <strong>10 [kV] 마다 10 [cm] 씩</strong> 거리를 늘린다.<p><strong>◈ 암기</strong> 유자격자가 아니면 <u>50 [kV] 이하는 300 [cm]</u>, 넘으면 <u>10 [kV] 마다 10 [cm]</u> 더.</p><p><strong>절연용 보호구는 사람이 입는 것</strong>(안전모·장갑·장화), <strong>절연용 방호구는 충전부에 씌우는 것</strong>(절연관·절연시트)이다.</p><p><em>근거 — 안전보건규칙 제321조</em></p>", "nq": 1}, "card_ele_t015": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기설비", "mid": "개폐기의 조작 순서", "front": "개폐기의 조작 순서는?", "back": "넣을 때는 <strong>전원 쪽에서 부하 쪽으로</strong> 간다. 곧 <strong>메인 → 분전반 → 전동기용</strong>이다. 끌 때는 반대로 <strong>부하 쪽에서 전원 쪽으로</strong> 간다.<p><strong>◈ 암기</strong> <u>넣을 때는 위에서 아래로, 끊을 때는 아래에서 위로</u>.</p><p>「<u>넣을 때는 위에서 아래로, 끊을 때는 아래에서 위로</u>」. 이렇게 해야 개폐 순간에 큰 부하전류가 한꺼번에 흐르지 않아 아크와 접점 손상이 줄어든다. 정전작업에서 차단 순서를 부하 쪽부터 잡는 것도 같은 이치다.</p>", "nq": 1}, "card_ele_t016": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기화재", "mid": "피뢰기의 구비 성능", "front": "피뢰기의 구비 성능은?", "back": "<strong>제한전압은 낮아야</strong> 한다. 제한전압이란 피뢰기가 뇌서지를 흘려보내는 동안 기기에 걸리는 전압이므로, <strong>낮을수록 기기를 잘 지킨다</strong>. 높으면 피뢰기를 달아 놓고도 기기가 상한다.<p><strong>◈ 암기</strong> <u>전압은 낮게, 능력은 크게</u>.</p><p>피뢰기의 4대 성능. <u>충격 방전 개시전압은 낮게 · 제한전압은 낮게 · 뇌전류 방전 능력은 크게 · 속류 차단은 확실하게</u>. <u>「전압 관련은 낮게, 능력 관련은 크게」</u>로 묶으면 된다. 피뢰기는 <u>전기설비</u>를, 피뢰침은 <u>건물</u>을 지킨다는 구분도 함께 본다.</p>", "nq": 1}, "card_ele_t017": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "접지", "mid": "정전기 재해의 방지대책", "front": "정전기 재해의 방지대책은?", "back": "<ul><li>방향이 거꾸로다. 유속이 빠를수록 <strong>유동대전</strong>이 심해지므로 <strong>유속을 제한</strong> 해야 한다. 특히 이황화탄소는 최소발화에너지가 매우 작아(약 0.009 [mJ]) 아주 작은 방전에도 불이 붙으므로 <strong>1 [m/s] 이하</strong>로 더 엄격하게 묶는다.</li><li><strong>절연성 바퀴를 달면 전하가 빠져나갈 길이 막힌다</strong>. <strong>도전성 바퀴</strong>를 달아 대지로 흘려보내야 한다.</li></ul><p><strong>◈ 암기</strong> <u>도체는 접지, 부도체는 가습·제전기, 액체는 유속 제한</u>. · <u>정전기는 길을 터 줘야 빠진다</u>.</p><p>정전기 대책은 대상에 따라 갈린다. <u>도체는 접지</u>, <u>부도체는 가습·제전기·도전성 재료 혼입</u>, <u>액체 이송은 유속 제한</u>. 「빠르게 = 안전」이라는 직관이 여기서는 정반대라는 점이 함정이다.<br>네 보기가 모두 같은 한 가지를 말한다 — <strong>전하가 대지로 빠져나갈 길을 만든다</strong>. <strong>「절연성」이라는 말이 나오면 정전기 대책에서는 대개 오답</strong>이다.</p>", "nq": 2}, "card_ele_t018": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "접지", "mid": "정전기의 제거 방법", "front": "정전기의 제거 방법은?", "back": "<ul><li><strong>항온(일정한 온도) 유지</strong>는 정전기와 직접 상관이 없다. 정전기에 영향을 주는 것은 온도가 아니라 <strong>습도</strong>다. 습도가 낮으면 전하가 빠져나가지 못해 쌓인다.</li><li><strong>건조시키면 표면의 수분막이 사라져</strong> 절연저항이 커지고, 전하가 빠져나가지 못한다.</li></ul><p><strong>◈ 암기</strong> <u>온도가 아니라 습도</u> — 상대습도 60~70 [%]. · <u>말리면 쌓이고, 적시면 빠진다</u>.</p><p>정전기 제거의 다섯 가지. <u>접지 · 가습(상대습도 60~70 [%]) · 제전기 설치 · 도전성 재료 사용 · 유속 제한</u>. <u>온도가 아니라 습도</u>라는 점이 갈림길이다.<br><strong>상대습도 60~70 [%]</strong>를 유지하면 물체 표면에 얇은 수분막이 생겨 전하가 흘러 나간다. 겨울에 정전기가 잦은 것도 공기가 건조하기 때문이다.</p>", "nq": 2}, "card_ele_t019": {"kind": "단답형", "fq": 3, "subject": "전기위험방지기술", "chapter": "정전기", "mid": "정전기 발생에 영향을 주는 요인", "front": "정전기 발생에 영향을 주는 요인은?", "back": "<ul><li>방향이 거꾸로다. <strong>분리속도가 빠를수록 발생량이 많아진다</strong>. 빨리 떼어 낼수록 전하가 제자리로 되돌아갈 겨를이 없어 그대로 갈라지기 때문이다.</li><li>다섯 요인에 <strong>접촉시간</strong>은 없다. 있는 것은 <strong>접촉 면적과 압력</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>처음 접촉 때가 가장 크고, 나머지는 다 「클수록 많다」</u>. · <u>특성 · 표면 · 이력 · 면적과 압력 · 분리속도</u> — 시간은 없다.</p><p>정전기 발생의 5요인. <u>물체의 특성(대전서열이 멀수록 많다) · 표면 상태(거칠거나 오염되면 많다) · 대전 이력(처음이 가장 크다) · 접촉 면적과 압력(클수록 많다) · 분리속도(빠를수록 많다)</u>. 「<u>처음 하나만 줄어드는 쪽이고 나머지는 다 늘어나는 쪽</u>」으로 가른다.<br>다섯 가운데 <strong>이력만 「처음이 가장 크다」</strong>로 방향이 다르고, 나머지는 모두 <strong>클수록·빠를수록 많이 생긴다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">정전기 발생의 다섯 요인</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">요인</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">어떻게 영향을 주나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물체의 특성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>대전열에서 멀수록</u> 크다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물체의 표면상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>거칠거나 오염될수록</u> 크다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물체의 이력</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>처음 접촉할 때 가장 크다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">되풀이하면 줄어든다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접촉 면적과 압력</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>넓고 셀수록</u> 크다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시간이 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>분리 속도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>빠를수록</u> 크다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t020": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "정전기", "mid": "정전기로 인한 화재·폭발 방지", "front": "정전기로 인한 화재·폭발 방지는?", "back": "<strong>드라이클리닝설비</strong>다. 인화성 유기용제를 쓰면서 옷감을 세차게 돌리므로, <strong>가연성 증기(연료)</strong>와 <strong>마찰에 의한 정전기(점화원)</strong>가 한자리에서 함께 생긴다. 연소의 요소가 저절로 모이는 셈이다.<p>안전보건규칙 제325조(정전기로 인한 화재 폭발 등 방지). 접지 등의 조치를 해야 하는 설비로 <u>인화성 액체를 이송하는 설비 · 위험물 탱크차 · 드라이클리닝설비 · 인쇄기 · 도포기 · 분체 취급 설비</u> 등을 열거한다. 공통점은 <u>「가연성 물질 + 마찰·유동」</u>이다.</p><p><em>근거 — 안전보건규칙 제325조</em></p>", "nq": 1}, "card_chm_t001": {"kind": "단답형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "", "mid": "폭발의 예방과 방호", "front": "폭발의 예방과 방호는?", "back": "<strong>불활성화(이너팅)</strong>는 산소 농도를 최소산소농도 아래로 낮춰 <strong>폭발이 아예 일어나지 않게 하는</strong> 예방 대책이다. 나머지 셋은 <strong>폭발이 일어난 뒤</strong> 피해를 줄이는 방호(protection) 대책이다.<p>예방과 방호의 구분. <u>예방(prevention)</u>은 「일어나지 않게」이고 <u>방호(protection)</u>는 「일어나도 피해를 줄이게」다. 불활성화·점화원 제거는 예방이고, <u>억제 · 방산 · 봉쇄 · 격리</u>는 방호다. 문제가 어느 쪽을 묻는지 먼저 가려야 한다.</p>", "nq": 1}, "card_chm_t002": {"kind": "용어형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "", "mid": "인화성 가스의 정의", "front": "인화성 가스의 정의란?", "back": "<strong>하한이 13 [%] 이하이거나 상하한의 차가 12 [%] 이상</strong>인 가스를 인화성 가스로 본다. 「<strong>13 과 12</strong>」를 묶어 외운다.<p><strong>◈ 암기</strong> <u>13 과 12</u> — 하한 13 [%] 이하 또는 상하한 차 12 [%] 이상.</p><p>안전보건규칙 별표1(위험물질의 종류) 제3호 인화성 가스. 두 조건 중 <u>하나만 만족해도</u> 인화성 가스다. 「하한이 낮아서 위험하거나, 범위가 넓어서 위험하거나」 둘 중 하나면 규제 대상으로 삼는다는 뜻이다.</p><p><em>근거 — 안전보건규칙 별표1</em></p>", "nq": 1}, "card_chm_t003": {"kind": "공식형", "fq": 3, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "르 샤틀리에의 혼합가스 폭발범위", "front": "르 샤틀리에의 혼합가스 폭발범위의 식은?", "back": "<ul><li>$\\dfrac{100}{L} = \\sum \\dfrac{V_{i}}{L_{i}}$ 이므로, 하한이 높은 <strong>메탄이 적게 섞일수록</strong> 혼합가스의 하한이 낮아진다. 메탄 20 [%] 인 ①이 가장 낮다. $100 / L = 20 / 5 + 30 / 2 + 50 / 2.1 = 42.81$ 이므로 $L = 2.34$ [%] 다.</li><li>르 샤틀리에 식 $\\dfrac{100}{L} = \\sum \\dfrac{V_{i}}{L_{i}}$ 다. 3:1 이므로 75 [%] 와 25 [%] 다. $\\dfrac{100}{L} = \\dfrac{75}{2.5} + \\dfrac{25}{5.0} = 30 + 5 = 35$ 이므로 $L = 100 / 35 \\fallingdotseq 2.9$ [vol%] 다.</li><li>가연성 가스만 100 [%] 로 환산한다. 합이 5 [%] 이므로 메탄 20, 헥산 40, 에틸렌 40 [%] 다. $\\dfrac{100}{L} = \\dfrac{20}{5.0} + \\dfrac{40}{1.1} + \\dfrac{40}{2.7} = 4 + 36.36 + 14.81 = 55.17$ 이므로 $L = 100 / 55.17 \\fallingdotseq 1.8$ [vol%] 다.</li></ul><p><strong>◈ 암기</strong> <u>하한이 낮은 가스가 많이 섞일수록 혼합가스의 하한도 낮아진다</u>. · $\\dfrac{100}{L} = \\sum \\dfrac{V_{i}}{L_{i}}$ — <u>몫을 더한 뒤 뒤집는다</u>.</p><p>르 샤틀리에 식. <u>분모에 각 성분의 폭발범위</u>를 넣고 부피분율을 나눠 더한다. 직관으로는 <u>「하한이 낮은 가스가 많이 섞일수록 혼합가스의 하한도 낮아진다」</u>는 방향만 알아도 선택지를 고를 수 있어 계산을 아낄 수 있다.<br><strong>분모에 각 성분의 폭발범위</strong>가 들어간다. 그래서 <strong>하한이 낮은 성분이 결과를 크게 끌어내린다</strong>. 단순 평균으로 구하면 반드시 틀린다.</p>", "nq": 6}, "card_chm_t004": {"kind": "공식형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "가스의 위험도", "front": "가스의 위험도의 식은?", "back": "<ul><li>위험도는 $H = \\dfrac{U - L}{L}$ 로 구한다. <strong>상한과 하한의 차가 클수록, 하한이 낮을수록</strong> 위험도가 크다. 표의 값을 각각 대입해 큰 것부터 늘어놓으면 C – D – B – A 순이 된다.</li><li>$H = \\dfrac{U - L}{L} = \\dfrac{9.5 - 2.2}{2.2} = \\dfrac{7.3}{2.2} \\fallingdotseq 3.32$ 다.</li><li>$H = \\dfrac{U - L}{L} = \\dfrac{74 - 12.5}{12.5} = \\dfrac{61.5}{12.5} = 4.92$ 다.</li></ul><p><strong>◈ 암기</strong> $H = ( U - L ) / L$ — <u>분모가 하한</u>이라 하한이 낮을수록 크다. · $H = ( \\text{상한} - \\text{하한} ) \\div \\text{하한}$ — <u>분모는 하한</u>.</p><p>위험도 $H = ( U - L ) / L$. 대표값 — <u>아세틸렌 2.5~81 [%] 이므로 H = 31.4</u>로 압도적으로 크고, <u>수소 4~75 [%] 이면 H = 17.75</u>, <u>메탄 5~15 [%] 이면 H = 2</u>다. <u>분모가 하한</u>이라는 점 때문에 하한이 낮은 가스가 크게 유리해진다.<br><strong>분모가 하한</strong>이므로 하한이 낮은 가스가 크게 유리해진다. 상한이 아무리 높아도 하한이 높으면 위험도는 작다.</p><div style=\"margin:12px 0 2px;font-weight:700\">주요 가스의 위험도</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">가스</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">폭발범위</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">위험도 H</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>아세틸렌</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">2.5 ~ 81 [%]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>31.4</u> — 가장 크다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>수소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">4 ~ 75 [%]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>17.8</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">이황화탄소</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">1.2 ~ 44 [%]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">35.7</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">프로판</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">2.1 ~ 9.5 [%]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">3.5</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>메탄</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">5 ~ 15 [%]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>2.0</u> — 작다</td></tr></tbody></table></div>", "nq": 4}, "card_chm_t005": {"kind": "공식형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "금속과 물의 반응", "front": "금속과 물의 반응의 식은?", "back": "<ul><li>$2 \\mathrm{Al} + 6 H_{2} O \\rightarrow 2 \\mathrm{Al} ( OH )_{3} + 3 H_{2}$ 로 <strong>수소</strong>가 나온다. 수소는 폭발범위가 4~75 [%] 로 매우 넓어, 금속화재에 물을 뿌리면 불을 끄기는커녕 <strong>수소 폭발</strong>을 부른다.</li><li><strong>구리(Cu)</strong>다. <strong>이온화 경향이 수소보다 낮아</strong> 물이나 산과 반응해 수소를 내지 않는다.</li></ul><p><strong>◈ 암기</strong> <u>알루미늄·마그네슘·나트륨 → 수소</u>, 카바이드 → 아세틸렌, 탄화알루미늄 → 메탄. · <u>구리는 수소보다 오른쪽</u>.</p><p><u>알루미늄·마그네슘·나트륨·칼륨 → 수소</u>, <u>탄화칼슘(카바이드) → 아세틸렌</u>, <u>탄화알루미늄 → 메탄</u>. 그래서 D급 금속화재에는 물을 쓰지 않고 <u>건조사·팽창질석·팽창진주암</u>으로 덮는다.<br>이온화 경향은 <strong>K &gt; Ca &gt; Na &gt; Mg &gt; Al &gt; Zn &gt; Fe &gt; Ni &gt; Sn &gt; Pb &gt; (H) &gt; Cu &gt; Hg &gt; Ag &gt; Pt &gt; Au</strong> 순이다. <strong>수소(H)보다 오른쪽에 있으면 수소를 밀어내지 못한다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">이온화 경향과 물과의 반응</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">금속</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">물과의 반응</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>K · Ca · Na</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>찬물과도 격렬히 반응</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수소 발생</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Mg · Al · Zn · Fe</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>뜨거운 물이나 수증기와 반응</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수소 발생</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Cu · Hg · Ag · Pt · Au</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>반응하지 않는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수소를 내지 않는다</u></td></tr></tbody></table></div>", "nq": 2}, "card_chm_t006": {"kind": "공식형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "Jones 식과 완전연소 조성농도", "front": "Jones 식과 완전연소 조성농도의 식은?", "back": "완전연소 조성농도 $C_{\\mathrm{st}} = \\dfrac{100}{1 + 4.773 ( n + \\dfrac{m - 2 f - 2 l}{4} )}$ 에서 부탄은 $n = 4$, $m = 10$ 이므로 $C_{\\mathrm{st}} = 100 / ( 1 + 4.773 \\times 6.5 ) = 3.12$ [%] 다. Jones 식은 $\\mathrm{LFL} = 0.55 C_{\\mathrm{st}}$ 이므로 $0.55 \\times 3.12 = 1.7$ [%] 다.<p><strong>◈ 암기</strong> <u>하한 0.55 </u>$C_{\\mathrm{st}}$<u>, 상한 3.50 </u>$C_{\\mathrm{st}}$.</p><p>Jones 식. <u>하한 </u>$\\mathrm{LFL} = 0.55 C_{\\mathrm{st}}$, <u>상한 </u>$\\mathrm{UFL} = 3.50 C_{\\mathrm{st}}$. 먼저 완전연소 조성농도를 구한 뒤 계수를 곱하는 두 단계다. 탄화수소 $C_{n} H_{m}$ 의 산소 몰수는 $n + m / 4$ 라는 것만 알면 $C_{\\mathrm{st}}$ 는 바로 나온다.</p>", "nq": 1}, "card_chm_t007": {"kind": "단답형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "인화점 · 연소점 · 발화점", "front": "인화점 · 연소점 · 발화점은?", "back": "<ul><li><strong>인화점</strong>이다. 액체가 증발해 만든 증기가 <strong>폭발하한계에 막 닿는 온도</strong>이며, 이때 점화원을 대면 불이 붙는다.</li><li>연소점은 <strong>최고온도가 아니라 최저온도</strong>다. <strong>불이 붙은 뒤 스스로 타기를 이어 갈 수 있는 가장 낮은 온도</strong>를 말한다.</li></ul><p><strong>◈ 암기</strong> <u>셋 다 최저온도</u>.</p><p>세 온도의 크기 관계. <u>인화점 &lt; 연소점 &lt; 발화점</u>. 인화점은 「점화원이 있으면 붙는 온도」, 발화점은 「점화원이 없어도 붙는 온도」라는 점이 결정적 차이다. 인화성 액체의 위험도를 가르는 첫 기준이 인화점이다.<br>세 온도가 모두 <strong>「최저온도」</strong>다. <strong>「최고온도」로 바꿔 놓는 것</strong>이 이 유형의 함정이다. 크기는 <strong>인화점 &lt; 연소점 &lt; 발화점</strong> 순이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인화점 · 연소점 · 발화점</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">용어</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">관계</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인화점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불씨를 대면 순간 불이 붙는 최저온도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 낮다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>연소점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>붙은 불이 계속 타는 최저온도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>인화점보다 5 ~ 10 [℃] 높다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>발화점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불씨 없이 스스로 불붙는 최저온도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 높다</u></td></tr></tbody></table></div>", "nq": 2}, "card_chm_t008": {"kind": "단답형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "폭발범위에 영향을 주는 요인", "front": "폭발범위에 영향을 주는 요인은?", "back": "<ul><li>압력과도 상관이 있다. <strong>압력이 올라가면 폭발범위가 대체로 넓어진다</strong>(특히 상한이 크게 올라간다). 분자끼리 충돌할 기회가 늘기 때문이다.</li><li>온도가 오르면 <strong>폭발하한계는 낮아진다</strong>. <strong>더 묽어도 불이 붙는다</strong>.</li><li><strong>압력이 올라도 하한계는 거의 변하지 않는다</strong>. <strong>압력은 상한계만 크게 밀어 올린다</strong>.</li></ul><p><strong>◈ 암기</strong> 넓히는 것은 <u>온도↑ 압력↑ 산소↑</u>, 좁히는 것은 <u>불활성기체</u>뿐. · <u>온도가 오르면 하한은 낮아진다</u>.</p><p>폭발범위를 넓히는 조건. <u>온도↑ · 압력↑ · 산소농도↑</u>. 좁히는 것은 <u>불활성기체 첨가</u> 뿐이며, 이것이 <u>이너팅</u>이 대책이 되는 근거다. 다만 <u>일산화탄소는 예외</u>로 압력이 올라가면 오히려 범위가 좁아진다는 점도 알아 둔다.<br><strong>온도든 압력이든 산소든 「올리면 폭발범위가 넓어진다」</strong>는 방향은 하나다 — <strong>넓어진다는 것은 하한이 내려가고 상한이 올라간다</strong>는 뜻이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">온도·압력과 폭발범위</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조건</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">하한계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">상한계</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>온도가 오르면</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>낮아진다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높아진다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>압력이 오르면</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>거의 변하지 않는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>크게 높아진다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>산소농도가 오르면</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>거의 변하지 않는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>크게 높아진다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>결과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>폭발범위가 넓어진다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 3}, "card_chm_t009": {"kind": "단답형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "화염방지기의 설치", "front": "화염방지기의 설치는?", "back": "<ul><li><strong>설비의 상단</strong>에 설치한다. 증기와 가스는 위로 올라가 통기관을 통해 대기로 나가므로, 밖에서 들어오려는 화염을 막을 자리도 그 통기관 끝, 곧 <strong>설비의 상단</strong>이다.</li><li><strong>설비의 상단</strong>에 설치한다. 증기와 가스는 위로 올라가 통기관으로 빠져나가므로, 밖에서 들어오려는 화염을 막을 자리도 그 끝이다.</li><li><strong>화염방지기(flame arrester)</strong>다. 숨을 쉬듯 증기를 내보내고 공기를 들이는 통기구에 달아 <strong>밖의 불이 안으로 들어오지 못하게</strong> 한다.</li></ul><p><strong>◈ 암기</strong> <u>증기는 위로 간다</u> — 그래서 상단. · <u>숨 쉬는 구멍에 달면 화염방지기</u>.</p><p>안전보건규칙 제269조(화염방지기의 설치 등). 원리는 내압 방폭구조와 같다 — <u>좁은 틈(금속망·다공판)을 지나며 화염이 식어</u> 안쪽으로 번지지 못한다. 다만 <u>인화점이 섭씨 60도 이상인 액체</u>를 저장하는 탱크에는 화염방지기 대신 <u>통기밸브</u>를 달 수 있다.<br>원리는 내압 방폭구조와 같다. <strong>좁은 틈(금속망·다공판)을 지나며 화염이 식어</strong> 안쪽으로 번지지 못한다. <strong>인화점 60 [℃] 이상인 액체</strong> 탱크에는 화염방지기 대신 <strong>통기밸브</strong>를 달 수 있다.</p><p><em>근거 — 안전보건규칙 제269조</em></p>", "nq": 5}, "card_chm_t010": {"kind": "공식형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "위험물", "mid": "제3류 위험물의 저장방법", "front": "제3류 위험물의 저장방법의 식은?", "back": "<strong>탄화칼슘(카바이드)</strong>은 물과 만나면 $\\mathrm{CaC}_{2} + 2 H_{2} O \\rightarrow \\mathrm{Ca} ( OH )_{2} + C_{2} H_{2}$ 로 <strong>아세틸렌</strong>을 내며 발열한다. 아세틸렌은 폭발범위가 2.5~81 [%] 로 대단히 넓어 곧바로 폭발로 이어진다. 그래서 <strong>밀폐 용기에 넣어 건조한 곳</strong>에 둔다.<p><strong>◈ 암기</strong> <u>황린은 물속, 나트륨은 석유 속, 카바이드는 건조한 밀폐</u>.</p><p>제3류 위험물의 저장법이 갈린다. <u>황린은 물속에(자연발화성이라 공기를 막아야 함)</u>, <u>나트륨·칼륨은 석유 속에(금수성이라 물을 막아야 함)</u>, <u>탄화칼슘은 건조한 밀폐 용기에</u>. 같은 류인데 정반대라 자주 나온다.</p>", "nq": 1}, "card_chm_t011": {"kind": "단답형", "fq": 3, "subject": "화학설비위험방지기술", "chapter": "유해화학물질", "mid": "분진폭발의 특징", "front": "분진폭발의 특징은?", "back": "<ul><li>분진폭발은 <strong>압력이 화염보다 먼저 퍼져 나간다</strong>. 그래서 아직 불길이 닿지 않은 곳의 쌓인 분진이 압력파에 날려 올라가고, 뒤이어 화염이 닿으면 <strong>2차 폭발</strong>이 일어난다. 2차 폭발이 1차보다 큰 피해를 내는 이유가 여기 있다.</li><li><strong>2차·3차 폭발</strong>이 분진폭발의 가장 무서운 특징이다. 1차 폭발의 압력파가 쌓인 분진을 날려 올리고, 뒤이어 화염이 닿으면 더 큰 폭발이 난다.</li><li><strong>입자 크기와 부유성</strong>은 분진폭발의 핵심 변수다. 입자가 작을수록 표면적이 넓어 잘 타고, 잘 떠 있어야 폭발할 수 있다.</li></ul><p><strong>◈ 암기</strong> 「<u>터지는 순간은 약하지만 오래 타고 크게 부순다</u>」. · 가장 실질적인 대책은 <u>쌓인 분진의 청소</u>.</p><p>분진폭발을 <u>「터지는 순간은 약하지만 오래 타고 크게 부순다」</u>. 연소속도·폭발압력은 가스폭발보다 작지만 <u>연소시간·발생에너지·파괴력</u>은 크다. 가장 실질적인 대책은 <u>쌓인 분진의 청소</u>다.<br>한 줄로 — 「<strong>터지는 순간은 약하지만 오래 타고 크게 부순다</strong>」. 연소속도와 폭발압력은 가스폭발보다 작지만 <strong>연소시간·발생에너지·파괴력</strong>은 크다.</p><div style=\"margin:12px 0 2px;font-weight:700\">분진폭발과 가스폭발</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">분진폭발</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">가스폭발</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">연소속도</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>느리다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>빠르다</u rong> <u>흙막이판 → 말뚝 → 띠장 → 버팀보</u> 순으로 힘이 전달된다.</p><p>흙막이 지보공의 구성. <u>흙막이판 → 말뚝(엄지말뚝) → 띠장 → 버팀보(또는 어스앵커)</u> 순으로 힘이 전달된다. 정기점검 항목은 <u>부재의 손상·변형·부식·변위·탈락 · 버팀대의 긴압 정도 · 부재 접속부·부착부·교차부의 상태 · 침하 정도</u> 네 가지다.</p><div style=\"margin:12px 0 2px;font-weight:700\">흙막이 지보공의 구성과 점검</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">부재</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">하는 일</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">정기점검 항목</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">흙막이판</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">흙이 무너져 들어오는 것을 직접 막음</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">손상·변형·부식·변위·탈락</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">말뚝 (엄지말뚝)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">흙막이판을 지지하는 기둥</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">위와 같음</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">띠장</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">말뚝을 가로로 이어 힘을 전달</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">접속부·부착부·교차부의 상태</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">버팀보 / 어스앵커</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">띠장이 받은 힘을 최종 지지</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">버팀대의 긴압 정도</td></tr></tbody></table></div>", "nq": 1}, "card_con_t016": {"kind": "용어형", "fq": 1, "subject": "건설안전기술", "chapter": "건설재해 대책", "mid": "가설구조물의 특징", "front": "가설구조물의 특징이란?", "back": "<ul><li>오히려 반대다. 가설구조물은 <strong>임시로 쓰는 것이라는 인식 탓에 구조물이라는 개념이 흐릿하고, 조립의 정밀도가 낮다</strong>. 이것이 가설구조물 붕괴 사고의 뿌리다.</li><li>가설구조물은 <strong>결합이 간단한 대신 연결부가 약하다</strong>. 「견고하다」는 반대다.</li></ul><p><strong>◈ 암기</strong> <u>간단한 대신 약하다</u>.</p><p>가설구조물의 4대 문제. <u>연결재 부족 · 불안전 결합 · 정밀도 낮음 · 부재 불량</u>. 뿌리는 「<u>어차피 임시니까</u>」라는 인식이다. 그래서 법은 <u>조립도 작성과 정기점검</u>을 강제하고, 일정 규모 이상이면 <u>설계변경 요청 제도</u>까지 두었다.<br>네 가지 문제점 — <strong>연결부가 약하다 · 부재가 얇고 결합이 단순하다 · 구조물이라는 의식이 낮아 조립 정밀도가 떨어진다 · 사용 부재가 과소 단면이거나 결함재인 경우가 많다</strong>. 모두 <strong>「임시로 쓴다」는 생각</strong>에서 비롯한다.</p>", "nq": 2}, "card_con_t017": {"kind": "단답형", "fq": 1, "subject": "건설안전기술", "chapter": "양중·해체", "mid": "타워크레인의 방호장치", "front": "타워크레인의 방호장치는?", "back": "<strong>호이스트 스위치</strong>는 화물을 올리고 내리는 <strong>조작 스위치</strong>이지 안전장치가 아니다.<p><strong>◈ 암기</strong> <u>조작하는 것인가, 막아 주는 것인가</u>로 가른다.</p><p>방호장치는 <strong>권과방지 · 과부하방지 · 비상정지 · 제동장치</strong>이며, 여기에 선회 제한 리밋 스위치·트롤리 내외측 제어장치·훅 해지장치가 더해진다.</p><p><em>근거 — 안전보건규칙 제134조</em></p>", "nq": 1}, "card_con_t018": {"kind": "단답형", "fq": 2, "subject": "건설안전기술", "chapter": "양중·해체", "mid": "폭풍에 의한 이탈 방지", "front": "폭풍에 의한 이탈 방지는?", "back": "순간풍속이 <strong>초당 30 [m] 를 초과</strong> 할 우려가 있으면 옥외 주행크레인의 이탈방지장치를 작동시킨다.<p><strong>◈ 암기</strong> <u>10 설치해체 · 15 운전 · 30 이탈방지 · 35 리프트</u>.</p><p>사람이 하는 작업은 낮은 풍속에서 멈추게 하고, 구조물을 지키는 조치는 높은 풍속에서 한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">순간풍속에 따른 조치</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">풍속</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">근거</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">10 [m/s] 초과</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">타워크레인 <u>설치·수리·점검·해체</u> 중지</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">규칙 제37조</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">15 [m/s] 초과</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">타워크레인 <u>운전작업</u> 중지</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">규칙 제37조</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>30 [m/s] 초과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>옥외 주행크레인 이탈방지장치</u> 작동</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">규칙 제140조</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">35 [m/s] 초과</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">건설용 리프트 <u>붕괴 방지</u> 조치</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">규칙 제154조</td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제140조</em></p>", "nq": 1}, "card_con_t019": {"kind": "단답형", "fq": 2, "subject": "건설안전기술", "chapter": "건설공사 안전개요", "mid": "전단응력을 키우는 원인과 전단강도를 낮추는 원인", "front": "전단응력을 키우는 원인과 전단강도를 낮추는 원인은?", "back": "흙이 마르면 무게가 줄어 <strong>무너뜨리려는 힘도 줄어든다</strong>. 전단응력을 키우는 것이 아니라 낮추는 쪽이다.<p><strong>◈ 암기</strong> <u>무게가 늘면 응력이 커지고, 물이 스며들면 강도가 낮아진다</u>.</p><p>붕괴는 <strong>전단응력(무너뜨리려는 힘)이 전단강도(버티는 힘)를 넘을 때</strong> 일어난다. 전단응력을 키우는 것은 하중 증가·경사 증가·진동·수압이고, 전단강도를 낮추는 것은 함수비 증가·간극수압 상승·점착력 감소다.</p>", "nq": 1}, "card_con_t020": {"kind": "단답형", "fq": 3, "subject": "건설안전기술", "chapter": "건설공사 안전개요", "mid": "콘크리트 타설작업", "front": "콘크리트 타설작업은?", "back": "<ul><li>이상이 발견되면 <strong>작업을 중지하고</strong> 근로자를 대피시킨 뒤 보강한다. 「중지하지 아니하고 보강」은 사람을 위험 속에 두는 것이라 조문과 반대다.</li><li>진동기를 지나치게 쓰면 <strong>재료가 분리되어 오히려 품질이 떨어지고, 거푸집에 측압이 커져</strong> 터질 수 있다. 「많을수록 좋다」는 틀렸다.</li><li><strong>A 는 변형, B 는 지반의 침하 유무</strong>다.</li></ul><p><strong>◈ 암기</strong> 이상이 보이면 <u>먼저 멈추고 대피</u>, 보강은 그다음. · <u>진동기는 적당히</u> — 많이 쓰면 재료가 갈린다.</p><p>거푸집 붕괴의 대표 원인이 <strong>집중 타설과 과속 타설</strong>이다. 한 곳에 몰아 부으면 측압이 급격히 커진다.<br>거푸집에 걸리는 <strong>측압</strong>은 <strong>타설 속도가 빠를수록 · 온도가 낮을수록 · 슬럼프가 클수록 · 다짐이 셀수록</strong> 커진다. 진동기를 과하게 쓰면 이 가운데 마지막 항이 커진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">콘크리트 타설작업 시의 준수사항 (규칙 제334조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">준수사항</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>작업 시작 전 거푸집동바리등의 변형·변위 및 지반의 침하 유무를 점검하고 이상이 있으면 보수할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>A: 변형, B: 지반의 침하 유무</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>작업 중에는 감시자를 배치하는 등 이상을 발견하면 즉시 작업을 중지하고 근로자를 대피시킬 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>콘크리트 타설작업 시 거푸집 붕괴의 위험이 발생할 우려가 있으면 충분한 보강조치를 할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>설계도서상의 콘크리트 양생기간을 준수하여 거푸집동바리등을 해체할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>편심이 발생하지 않도록 골고루 분산하여 타설할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제334조</em></p>", "nq": 5}}};</script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const STUDY=MODE==='study';
const KEY=(STUDY?'safestudy_':'safecbt_')+D.round;
let S={i:0,ans:{},open:{},started:STUDY?1:0,elapsed:0,done:false};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
if(!S.open)S.open={};
if(STUDY)S.started=1;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function kx(el){if(window.renderMathInElement)renderMathInElement(el,{delimiters:[
 {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}

const MARK=['①','②','③','④'];
const LV={1:['#10b981','쉬움'],2:['#f59e0b','보통'],3:['#ef4444','어려움']};

function fmt(s){const m=Math.floor(s/60),x=s%60;
 return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+':'+String(x).padStart(2,'0');}

let tick=null;
function startTimer(){
 if(STUDY)return;
 clearInterval(tick);tick=setInterval(()=>{
  if(S.done)return;
  S.elapsed++;const left=D.limit-S.elapsed;
  const t=$('#timer'); if(!t)return;
  t.textContent=left>0?fmt(left):'00:00:00';
  t.classList.toggle('warn',left<600);
  if(left<=0)submit();
  if(S.elapsed%10===0)save();
 },1000);}

function intro(){
 $('#app').innerHTML=`<div class="wrap intro">
  <h2>${D.title}</h2>
  <p>6과목 120문항 · 시험시간 3시간</p>
  <p>합격 기준 — 과목당 40점 이상, 전 과목 평균 60점 이상</p>
  <p style="margin-top:14px;font-size:13px">답만 고르고 끝에 제출합니다.
   해설과 암기카드는 채점한 뒤에 열립니다.</p>
  <button class="big" id="go">시험 시작</button>
  ${Object.keys(S.ans).length?'<div style="margin-top:12px;font-size:13px;color:#64748b">이어서 풀면 지난번 답안이 그대로 살아 있습니다</div>':''}
 </div>`;
 $('#go').onclick=()=>{S.started=1;save();render();startTimer();};
}

// 해설이 열려 있는가 — 직접 여닫은 적이 있으면 그 뜻을 따른다
function solOpen(q){
 if(S.open[q.n]!==undefined)return S.open[q.n];
 return S.done||(STUDY&&!!S.ans[q.n]);
}

function qHTML(q){
 const a=S.ans[q.n], graded=(STUDY&&a)||S.done, show=STUDY||S.done;
 let h=`<div class="wrap"><div class="qh"><span class="qno">${String(q.n).padStart(3,'0')}</span>
  <span class="tag" style="background:${LV[q.lv][0]}">난이도 ${q.lv}·${LV[q.lv][1]}</span>
  <span class="tag" style="background:#6366f1">${q.kind}</span>
  <span class="tag" style="background:#f59e0b">빈출 ${'★'.repeat(q.fq)+'☆'.repeat(3-q.fq)}</span>
  <span class="subj">제${q.s}과목 ${D.subj[q.s-1]}</span>`;
 if(show){
   h+=`<span class="acts">
    <button class="mini${solOpen(q)?' on':''}" id="tsol">📖 해설 ${solOpen(q)?'닫기':'보기'}</button>
    ${q.card&&D.cards[q.card]?'<button class="mini cd" id="tcard">🃏 암기카드</button>':''}
   </span>`;
 }
 h+=`</div><div class="stem">${q.t}</div>`;
 if(q.cond)h+=`<div class="cond">${q.cond}</div>`;
 if(q.img)h+=`<img class="stemimg" src="img/${q.img}">`;
 for(let k=0;k<4;k++){
   let cls='opt';
   if(a===k+1)cls+=' sel';
   if(graded){ if(k+1===q.a)cls='opt right'; else if(a===k+1)cls='opt wrong'; }
   h+=`<button class="${cls}" data-k="${k+1}"><span class="n">${MARK[k]}</span><span>${q.c[k]}</span></button>`;
 }
 if(graded){
   h+= a===q.a ? `<div class="vline o">정답입니다 · 정답 ${q.a}번</div>`
              : `<div class="vline x">${a?'틀렸습니다 · 고른 답 '+a+'번 · ':'미응답 · '}정답 ${q.a}번</div>`;
 }
 if(show&&solOpen(q)){
   h+=`<div class="sol"><div class="lbl">해설</div><div>${q.sol}</div>`;
   if(q.w)h+=`<div class="lbl">오답 분석</div><div>${q.w}</div>`;
   if(q.pt)h+=`<div class="lbl g">관련 개념 · 암기</div><div class="box">${q.pt}</div>`;
   if(q.law)h+=q.law;
   h+=`</div>`;
 }
 return h+'</div>';
}

function render(){
 if(!S.started){intro();return;}
 if(!STUDY&&S.done&&S.i<0){result();return;}
 const q=D.q[S.i];
 $('#app').innerHTML=qHTML(q);
 $$('.opt').forEach(b=>b.onclick=()=>{
   S.ans[q.n]=+b.dataset.k;
   if(STUDY&&S.open[q.n]===undefined)S.open[q.n]=true;
   save();
   if(STUDY||S.done){render();}
   else{$$('.opt').forEach(x=>x.classList.toggle('sel',x===b));paint();}
 });
 const ts=$('#tsol'); if(ts)ts.onclick=()=>{S.open[q.n]=!solOpen(q);save();render();};
 const tc=$('#tcard'); if(tc)tc.onclick=()=>openCard(q.card);
 kx($('#app'));
 stat();
 $('#prev').disabled=S.i===0; $('#next').disabled=S.i===119;
 paint();
 window.scrollTo(0,0);
}

function stat(){
 const n=Object.keys(S.ans).length;
 if(STUDY){
   let ok=0; D.q.forEach(q=>{if(S.ans[q.n]===q.a)ok++;});
   $('#prog').innerHTML=`<b>${S.i+1}</b> / 120 · 푼 문항 <b>${n}</b> · 맞힘 <b>${ok}</b>`;
   const r=$('#rate');
   if(r)r.textContent=n?`정답률 ${Math.round(ok/n*100)}%`:'정답률 —';
 }else{
   $('#prog').innerHTML=S.done?`채점 완료`:`<b>${S.i+1}</b> / 120 · 푸는 중 <b>${n}</b>`;
 }
}

/* 암기카드 팝업 */
let mflip=false;
function openCard(id){
 const c=D.cards[id]; if(!c)return;
 mflip=false;
 $('#mbody').innerHTML=`<button class="mx" id="mx">✕</button>
  <div class="mcard" id="mcard">
   <div class="mface">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span class="stars">${'★'.repeat(c.fq)+'☆'.repeat(3-c.fq)}</span>
     <span>${c.subject}${c.chapter?' · '+c.chapter:''}</span>
     <span class="mcid">${id}</span></div>
    <div class="mq">${c.front}</div>
    <div class="mhint">카드를 누르면 뒤집힙니다 · Esc 닫기</div>
   </div>
   <div class="mface back">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span>${c.mid}</span><span class="mcid">${id}</span></div>
    <div class="ma">${c.back}</div>
    <div class="mfoot"><span>이 개념을 묻는 문항 ${c.nq}개</span>
     <a href="../_암기카드.html#${id}" target="_blank">카드 전체 보기 →</a></div>
   </div>
  </div>`;
 $('#modal').classList.add('on');
 kx($('#mbody'));
 fitCard(); setTimeout(fitCard,260);
 $('#mcard').onclick=()=>{mflip=!mflip;$('#mcard').classList.toggle('flip',mflip);};
 $('#mx').onclick=e=>{e.stopPropagation();closeCard();};
}
function fitCard(){
 const mc=$('#mcard'); if(!mc)return;
 mc.style.height='120px';
 const h=Math.max(...[...mc.querySelectorAll('.mface')].map(f=>f.scrollHeight));
 mc.style.height=Math.min(window.innerHeight*0.78,Math.max(300,h+4))+'px';
}
function closeCard(){$('#modal').classList.remove('on');}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeCard();};
window.addEventListener('resize',()=>{if($('#modal').classList.contains('on'))fitCard();});

function paint(){
 $$('.pg').forEach(b=>{
   const n=+b.dataset.n, q=D.q[n-1];
   const marked=STUDY?!!S.ans[n]:S.done;
   let c='pg';
   if(marked&&(STUDY||S.done))c+=(S.ans[n]===q.a?' ok':' no');
   else if(S.ans[n])c+=' done';
   if(n-1===S.i)c+=' cur';
   b.className=c;
 });
}

function submit(){
 if(STUDY||S.done)return;
 const un=120-Object.keys(S.ans).length;
 if(un>0&&!confirm('안 푼 문제가 '+un+'개 있습니다. 제출할까요?'))return;
 S.done=true;clearInterval(tick);save();S.i=-1;result();
}

function result(){
 const per=[0,0,0,0,0,0],tot=[0,0,0,0,0,0];
 let right=0;
 D.q.forEach(q=>{tot[q.s-1]++;if(S.ans[q.n]===q.a){per[q.s-1]++;right++;}});
 const scores=per.map((v,i)=>Math.round(v/tot[i]*100));
 const avg=Math.round(right/120*100);
 const pass=avg>=60&&scores.every(s=>s>=40);
 let h=`<div class="result"><div style="text-align:center;color:#64748b;font-size:13px">${D.title} · 채점 결과</div>
  <div class="score">${avg}<span style="font-size:20px;color:#94a3b8">점</span></div>
  <div style="text-align:center;color:#64748b;font-size:14px">120문항 중 <b>${right}</b>문항 정답 · 소요 ${fmt(S.elapsed)}</div>
  <div class="verdict ${pass?'pass':'fail'}">${pass?'합격':'불합격'}</div>
  <table class="stab"><tr><th>과목</th><th>맞힌 문항</th><th>점수</th></tr>`;
 for(let i=0;i<6;i++){
   h+=`<tr><td style="text-align:left">제${i+1}과목 ${D.subj[i]}</td>
    <td>${per[i]} / ${tot[i]}</td><td class="${scores[i]<40?'bad':''}">${scores[i]}</td></tr>`;
 }
 h+=`</table><div style="font-size:12.5px;color:#64748b;text-align:center">합격 — 과목당 40점 이상, 평균 60점 이상</div>
  <div class="rowbtns">
   <button class="nbtn pri" id="rw">틀린 문제만 다시 보기</button>
   <button class="nbtn" id="rall">전체 해설 보기</button>
   <button class="nbtn" id="rst">다시 풀기</button>
  </div></div>`;
 $('#app').innerHTML=h;
 paint(); stat();
 $('#rw').onclick=()=>{const bad=D.q.findIndex(q=>S.ans[q.n]!==q.a);S.i=bad<0?0:bad;render();};
 $('#rall').onclick=()=>{S.i=0;render();};
 $('#rst').onclick=()=>{if(confirm('답안을 지우고 처음부터 다시 풀까요?')){
   S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();startTimer();}};
}

function build(){
 let p='';
 for(let s=1;s<=6;s++){
   p+=`<div class="palhd">제${s}과목 ${D.subj[s-1]}</div><div class="palgrid">`;
   D.q.filter(q=>q.s===s).forEach(q=>{p+=`<button class="pg" data-n="${q.n}">${q.n}</button>`;});
   p+='</div>';
 }
 $('#pal').innerHTML=p;
 $$('.pg').forEach(b=>b.onclick=()=>{S.i=+b.dataset.n-1;save();render();$('#pal').classList.remove('open');});
}

$('#prev').onclick=()=>{if(S.i>0){S.i--;save();render();}};
$('#next').onclick=()=>{if(S.i<119){S.i++;save();render();}};
$('#palbtn').onclick=()=>$('#pal').classList.toggle('open');
const sb=$('#sub'); if(sb)sb.onclick=submit;
const rs=$('#reset'); if(rs)rs.onclick=()=>{if(confirm('푼 기록을 모두 지울까요?')){
 S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();}};
document.addEventListener('keydown',e=>{
 if($('#modal').classList.contains('on')){
   if(e.key==='Escape')closeCard();
   if(e.key===' '){e.preventDefault();$('#mcard').click();}
   return;
 }
 if(e.key==='ArrowLeft')$('#prev').click();
 if(e.key==='ArrowRight')$('#next').click();
 if('1234'.includes(e.key)){const b=$$('.opt')[+e.key-1];if(b)b.click();}
 if(e.key==='s'||e.key==='S'){const t=$('#tsol');if(t)t.click();}
 if(e.key==='c'||e.key==='C'){const t=$('#tcard');if(t)t.click();}
});
build();
const hm=location.hash.match(/^#q(\d+)/);
if(hm){S.started=1;S.i=Math.max(0,Math.min(119,+hm[1]-1));save();}
if(!STUDY&&S.done){if(hm){render();}else{S.i=-1;result();}}
else{render();if(S.started)startTimer();}
</script>
</body></html>
