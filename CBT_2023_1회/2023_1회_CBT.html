<td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>장려하고 처벌한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">벌은 마지막 수단</td></tr></tbody></table></div>", "nq": 1}, "card_mgt_t189": {"kind": "단답형", "fq": 1, "subject": "안전관리론", "chapter": "안전점검·인증", "mid": "안전점검표(체크리스트)의 작성", "front": "안전점검표(체크리스트)의 작성은?", "back": "<strong>조치결과</strong>는 <strong>점검을 하고 난 뒤에 적는 것</strong>이다. 점검표에 미리 담을 항목이 아니다.<p><strong>◈ 암기</strong> <u>조치「사항」은 담고 조치「결과」는 담지 않는다</u>.</p><p>점검표는 <strong>점검하기 전에 만들어 두는 양식</strong>이다. <strong>「조치사항(무엇을 할 것인가)」은 미리 정해 두지만, 「조치결과(무엇을 했는가)」는 하고 나서</strong> 적는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">안전점검표에 담을 항목</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>점검대상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">무엇을 볼 것인가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>점검부분(점검개소)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>점검항목</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">어떤 상태를 볼 것인가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>점검주기 또는 기간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">언제</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>점검방법</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">어떻게</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>판정기준</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">무엇을 합격으로 볼 것인가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>조치사항</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어긋나면 무엇을 할 것인가</u> — 「조치결과」가 아니다</td></tr></tbody></table></div>", "nq": 1}, "card_mgt_t020": {"kind": "단답형", "fq": 2, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "재해예방의 4원칙", "front": "재해예방의 4원칙은?", "back": "<ul><li><strong>손실우연의 원칙</strong>이다. 같은 높이에서 떨어져도 멀쩡한 사람이 있고 사망하는 사람이 있다. 손실의 크기는 <strong>우연히</strong> 정해지므로 「필연적」은 틀렸다. <strong>손실이 작았다고 사고가 가벼웠던 것이 아니다</strong> — 아차사고를 그냥 넘기면 안 되는 근거다.</li><li><strong>사전준비의 원칙</strong>은 없다. 넷째는 <strong>예방가능의 원칙</strong>이다.</li><li><strong>원인 제거가 불가능하다</strong>는 말은 4원칙과 정면으로 어긋난다. <strong>원인계기의 원칙</strong>은 원인이 반드시 있다고 보고, <strong>예방가능의 원칙</strong>은 그 원인을 없애면 막을 수 있다고 본다.</li></ul><p><strong>◈ 암기</strong> 「<u>손 · 원 · 예 · 대</u>」. 답으로 가장 잦은 것은 <u>손실우연</u> — 「필연」·「비례」로 바꿔 놓는다. · <u>손 · 원 · 예 · 대</u> — 사전준비는 없다.</p><p>대책은 3E(기술·교육·규제)로 세운다.<br><strong>예방가능의 원칙</strong>이 나머지 셋을 떠받친다. 막을 수 있다고 보아야 원인을 찾고 대책을 세울 이유가 생긴다.</p><div style=\"margin:12px 0 2px;font-weight:700\">재해예방의 4원칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원칙</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">함의</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>손실우연의 원칙</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>같은 사고라도 손실 크기는 우연</u>이다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">손실이 작았다고 넘기면 안 된다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>원인계기의 원칙</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사고에는 반드시 원인</u>이 있다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">원인은 여럿이 이어져 있다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>예방가능의 원칙</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>천재를 뺀 인재는 모두 막을 수 있다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">이 원칙이 안전관리의 전제다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>대책선정의 원칙</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>원인에 맞는 대책</u>이 반드시 있다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">3E 로 세운다</td></tr></tbody></table></div>", "nq": 7}, "card_mgt_t153": {"kind": "단답형", "fq": 2, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "시몬즈(Simonds)의 재해손실비 산정", "front": "시몬즈(Simonds)의 재해손실비 산정은?", "back": "<ul><li><strong>영구 전노동불능 상해</strong>와 <strong>사망</strong>은 <strong>보험 코스트</strong>로 다룬다. 비보험 코스트의 네 갈래에 들지 않는다.</li><li><strong>A · B · C · D 는 각 상해 갈래의 비보험 코스트 평균치</strong>다. <strong>건수에 곱해 더하면 비보험 코스트 총액</strong>이 나온다.</li><li><strong>보험 코스트 + 비보험 코스트</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>사망과 영구 전노동불능은 보험 코스트</u>. · <u>A·B·C·D 는 비보험 코스트 평균치</u>.</p><p>비보험 코스트 네 갈래에 <strong>사망과 영구 전노동불능이 빠져 있다</strong>는 것이 요점이다. <strong>그 둘은 보험금으로 크게 메워지므로</strong> 따로 셈하지 않는다.<br><strong>보험 코스트는 그대로 더하고, 비보험 코스트는 갈래별 평균치에 건수를 곱해</strong> 더한다. <strong>사망과 영구 전노동불능은 네 갈래에 들지 않는다</strong> — 보험으로 크게 메워지기 때문이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">시몬즈의 재해손실비</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보험 코스트</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비보험 코스트</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">무엇</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>산재보험료</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>보험으로 메워지지 않는 실제 손실</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">갈래</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사망 · 영구 전노동불능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>영구 부분노동불능 · 일시 전노동불능 · 일시 부분노동불능 · 응급조치(8시간 미만 휴업) · 무상해 사고</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">식</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>총 재해손실비 = 보험 코스트 + 비보험 코스트</u></td></tr></tbody></table></div>", "nq": 3}, "card_mgt_t108": {"kind": "단답형", "fq": 1, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "기인물과 가해물", "front": "기인물과 가해물은?", "back": "<ul><li><strong>기인물은 선반</strong>이다. 재해를 일으킨 <strong>설비 그 자체</strong>를 가리킨다. 손가락에 직접 닿은 <strong>변속치차는 가해물</strong>이다.</li><li><strong>선반</strong>이다. <strong>재해를 일으킨 근원이 된 기계</strong> 이기 때문이다. <strong>직접 손을 다치게 한 가해물은 변속치차</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>뿌리는 기인물, 닿은 것은 가해물</u>. · <u>기인물은 기계 전체, 가해물은 닿은 부분</u>.</p><p><strong>기인물은 사고의 뿌리, 가해물은 상처를 낸 것</strong>이다. 둘이 같을 때도 있지만 이 사례처럼 다를 때가 많다. <strong>「무엇을 다루다 났나」가 기인물, 「무엇에 다쳤나」가 가해물</strong>이다.<br><strong>기인물은 「어디서 비롯되었나」, 가해물은 「무엇에 맞았나」</strong>다. <strong>기계 전체가 기인물, 그 가운데 손을 문 부분이 가해물</strong>인 경우가 많다.</p><div style=\"margin:12px 0 2px;font-weight:700\">기인물과 가해물</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기인물</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">가해물</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">뜻</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>재해를 일으킨 근원이 되는 기계·장치·환경</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>직접 사람에게 상처를 입힌 것</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">이 사례</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>선반</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>변속치차</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">보기 — 사다리에서 떨어져 바닥에 부딪힘</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사다리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>바닥</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">보기 — 크레인 짐이 떨어져 맞음</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>크레인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>떨어진 짐</u></td></tr></tbody></table></div>", "nq": 2}, "card_mgt_t083": {"kind": "공식형", "fq": 1, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "버드(Bird)의 재해구성비율", "front": "버드(Bird)의 재해구성비율의 식은?", "back": "<ul><li>버드의 비율은 <strong>1 : 10 : 30 : 600</strong>이고, <strong>물적손실만 있는 사고가 「30」</strong> 자리다. $180 / 30 = 6$ 배이므로 중상은 $1 \\times 6 = 6$ 건이다.</li><li>버드의 비율은 <strong>1 : 10 : 30 : 600</strong>이다. 경상 10 이 15 이면 <strong>1.5배</strong>이므로 무상해·무사고는 $600 \\times 1.5 = 900$ 건이다.</li></ul><p><strong>◈ 암기</strong> <u>버드 1 : 10 : 30 : 600</u>. · <u>버드는 1 : 10 : 30 : 600</u>.</p><p><strong>버드는 「물적손실만 있는 사고 30」을 따로 세운 것</strong>이 하인리히와 다른 점이다. 문제에서 <strong>「물적손실이 수반된 무상해 사고」</strong>라 했으므로 30 자리를 잡아야 한다.<br><strong>하인리히는 1 : 29 : 300 (세 칸), 버드는 1 : 10 : 30 : 600 (네 칸)</strong>이다. <strong>버드만 「물적 손해」라는 칸이 하나 더</strong> 있다는 점으로 갈린다.</p><div style=\"margin:12px 0 2px;font-weight:700\">하인리히와 버드의 재해구성비율</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">하인리히 1 : 29 : 300</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">버드 1 : 10 : 30 : 600</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>중상 또는 폐질</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>중상 또는 폐질</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>둘째</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>경상 29</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>경상(물적·인적 손상) 10</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>셋째</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>무상해사고 300</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>물적손실만 있는 사고 30</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>넷째</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">—</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>무상해·무손실 사고(아차사고) 600</u></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t123": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "라스무센의 인간행동 3분류", "front": "라스무센의 인간행동 3분류는?", "back": "<ul><li><strong>지식에 기초한 행동</strong>이다. <strong>처음 겪는 상황에서 따져 판단하다가 잘못</strong> 하는 경우다.</li><li><strong>지식에 기초한 행동</strong>이다. <strong>처음 겪는 낯선 상황에서 따져 판단하다가 잘못</strong> 하는 경우다.</li><li><strong>「경험 기반 행동」</strong>은 없다. 셋은 <strong>숙련(기능) · 규칙 · 지식</strong> 기반이다.</li></ul><p><strong>◈ 암기</strong> <u>분석과 의사결정이면 지식 기반</u>. · <u>낯선 상황의 분석 오류면 지식 기반</u>.</p><p>세 가지가 <strong>몸으로(기능) → 규칙으로(규칙) → 머리로(지식)</strong> 순으로 <strong>생각이 깊어지고 시간이 오래 걸린다</strong>. 물음에 붙은 <strong>「분석」·「의사결정」</strong>이 지식 기반을 가리킨다.<br>세 가지가 <strong>몸으로(기능) → 규칙으로(규칙) → 머리로(지식)</strong> 순으로 <strong>생각이 깊어지고 시간이 오래 걸린다</strong>. <strong>「친숙하지 않은」·「분석」·「의사결정」</strong>이 지식 기반을 가리킨다.</p><div style=\"margin:12px 0 2px;font-weight:700\">라스무센(Rasmussen)의 인간행동 3분류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">행동</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">언제</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">오류의 성격</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기능(숙련) 기반</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>몸에 밴 일을 할 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>깜빡함(slip · lapse)</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>규칙 기반</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>아는 규칙을 적용할 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>규칙을 잘못 고름</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지식 기반</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>처음 겪는 상황에서 따질 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>분석·의사결정의 오류</u></td></tr></tbody></table></div>", "nq": 3}, "card_erg_t185": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "불 대수와 흡수법칙", "front": "불 대수와 흡수법칙의 식은?", "back": "식으로 적으면 $T = ( X_{1} X_{2} ) ( X_{1} + X_{3} )$ 다. 전개하면 $X_{1} X_{2} X_{1} + X_{1} X_{2} X_{3} = X_{1} X_{2} + X_{1} X_{2} X_{3}$ 인데, <strong>흡수법칙(</strong>$A + AB = A$<strong>)</strong>으로 $T = X_{1} X_{2}$ 가 된다. 따라서 $T = 0.1 \\times 0.1 = 0.01$ 이다.<p><strong>◈ 암기</strong> <u>중복사상이 있으면 먼저 불 대수로 정리</u>.</p><p><strong>같은 기본사상(</strong>$X_{1}$<strong>)이 두 곳에 나오면 그냥 곱해서는 안 된다</strong>. <strong>먼저 불 대수로 정리해 미니멀 컷셋을 구한 뒤</strong> 계산한다. <strong>흡수법칙 </strong>$A + AB = A$를 쓰면 정리된다.</p><div style=\"margin:12px 0 2px;font-weight:700\">중복사상이 있을 때의 계산</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">계산</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">값</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>그대로 곱한 값</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$0.01 \\times 0.19 = 0.0019$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>①</u> — 흡수법칙을 놓친 값</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>불 대수로 정리한 뒤</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$X_{1} X_{2} = 0.01$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>②</u> — 맞는 값</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t083": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "기계 일반", "mid": "소음의 방지대책", "front": "소음의 방지대책은?", "back": "<ul><li><strong>음원 대책</strong>이 가장 효과적이다. <strong>소리가 나는 곳 자체를 없애거나 줄이는</strong> 것이라 근본 대책이다.</li><li><strong>귀마개와 귀덮개</strong>는 <strong>수음자(사람) 대책</strong>이다. 가장 소극적인 방법이다.</li><li><strong>「소음의 분배」</strong>라는 대책은 없다. <strong>소음을 나눈다고 줄어들지 않는다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>음원 → 경로 → 사람</u> 순. · <u>귀마개는 사람 쪽 대책</u>.</p><p>위험관리의 우선순위와 같은 논리다 — <strong>위험 자체를 없애는 쪽이 위, 사람이 견디게 하는 쪽이 아래</strong>. 보호구는 언제나 마지막이다.<br><strong>음원 → 전파경로 → 수음자</strong> 순으로 대책을 세운다. <strong>보호구는 언제나 마지막</strong>이며, 위험관리의 우선순위와 같은 논리다.</p><div style=\"margin:12px 0 2px;font-weight:700\">소음 대책의 우선순위</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">순위</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대책</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>음원 대책</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>소음원 제거·대체 · 저소음 기계로 교체 · 방음 커버 · 마찰 감소</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전파경로 대책</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>차음벽 · 흡음재 · 거리 두기 · 지향성 조절</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수음자 대책</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>귀마개 · 귀덮개</u> · 작업시간 단축 — 가장 소극적</td></tr></tbody></table></div>", "nq": 4}, "card_erg_t186": {"kind": "용어형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "인간공학의 정의", "front": "인간공학의 정의란?", "back": "<ul><li><strong>작업과 기계를 사람에게 맞추는</strong> 것이 인간공학이다. <strong>사람을 기계에 맞추는</strong> 것이 아니다.</li><li><strong>「customize engineering」</strong>은 인간공학을 가리키는 말이 아니다.</li></ul><p><strong>◈ 암기</strong> <u>기계를 사람에게 맞춘다</u>. · <u>ergonomics · human factors · human engineering</u>.</p><p>인간공학의 한 문장은 <strong>「사람을 기계에 맞추지 말고 기계를 사람에게 맞춘다」</strong>다. <strong>방향을 뒤집어 놓는 것</strong>이 이 유형의 단골 함정이다.<br><strong>셋 모두에 「human」이나 「ergon(일)」</strong>이 들어 있다 — <strong>「customize(맞춤 제작)」에는 사람도 일도 들어 있지 않다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">인간공학을 가리키는 말</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">용어</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>ergonomics</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>그리스어 ergon(일) + nomos(법칙)</u> — 유럽에서 주로</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>human factors</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>미국에서 주로</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>human engineering</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>human factors engineering</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>customize engineering</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>인간공학을 가리키는 말이 아니다</u></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t187": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "웨버(Weber)의 법칙", "front": "웨버(Weber)의 법칙의 식은?", "back": "<ul><li>$\\text{웨버비} = \\dfrac{\\Delta I}{I}$ 다. <strong>변화를 알아채는 데 필요한 차이(</strong>$\\Delta I$<strong>)를 원래 자극의 크기(</strong>$I$<strong>)로 나눈</strong> 값이다.</li><li><strong>웨버의 법칙</strong>이다. $\\text{웨버비} = \\dfrac{\\Delta I}{I}$ 가 일정하다는 것이 그 뜻이다.</li></ul><p><strong>◈ 암기</strong> $\\text{웨버비} = \\Delta I \\div I$.</p><p><strong>웨버비가 작을수록 예민</strong> 하다 — <strong>조금만 달라져도 알아챈다</strong>는 뜻이다. <strong>원래 자극이 클수록 변화를 알아채려면 더 크게 달라져야</strong> 한다는 것이 이 법칙의 요지다.<br><strong>원래 자극이 클수록 변화를 알아채려면 더 크게 달라져야</strong> 한다. <strong>조용한 방의 속삭임은 들리지만 시끄러운 곳에서는 큰 소리도 묻히는</strong> 것이 그 예다.</p><div style=\"margin:12px 0 2px;font-weight:700\">감각별 웨버비</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">감각</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">웨버비</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>시각(밝기)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>약 1/60</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 예민하다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>약 1/50</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>청각(음의 세기)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>약 1/10</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>후각</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>약 1/4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>미각(짠맛)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>약 1/3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 둔하다</u></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t135": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "명료도 지수(articulation index)", "front": "명료도 지수(articulation index)의 식은?", "back": "<ul><li><strong>명료도 지수(AI)</strong>다. <strong>옥타브대마다 신호와 잡음의 [dB] 차이에 가중치를 곱해 더한</strong> 값이다.</li><li>$AI = \\sum ( \\log ( S / N ) \\times \\text{가중치} ) = (-0.7 \\times 1 ) + ( 0.18 \\times 1 ) + ( 0.6 \\times 2 ) + ( 0.7 \\times 1 ) =-0.7 + 0.18 + 1.2 + 0.7 = 1.38$ 이다.</li></ul><p><strong>◈ 암기</strong> <u>가중치를 곱해 더하면 명료도 지수</u>. · $\\log ( S / N )$<u> × 가중치의 합</u>.</p><p><strong>「가중치를 곱해 합계」</strong>라는 말이 명료도 지수를 가리킨다. <strong>PSIL 은 그냥 평균</strong>이라 가중치가 없다. 이 한 낱말로 둘이 갈린다.<br><strong>각 옥타브대의 </strong>$\\log ( S / N )$<strong> 에 가중치를 곱해 모두 더한다</strong>. <strong>Ⅰ대의 값이 음수(−0.7)</strong>라 그냥 더하면 값이 줄어드는데, <strong>이 부호를 놓치면 다른 보기로 빠진다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">통화이해도의 척도</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">척도</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>명료도 지수 AI</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>옥타브대별 [dB] 차이 × 가중치의 합</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>통화 간섭 수준 PSIL</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>500 · 1,000 · 2,000 [Hz] 잡음의 평균</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>이해도 점수</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>올바로 알아들은 낱말의 백분율</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>소음 기준 곡선 NC</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>실내 소음을 평가하는 곡선</u></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t188": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "시스템 수명주기", "front": "시스템 수명주기는?", "back": "<strong>「분석단계」</strong>는 없다. 다섯은 <strong>구상 · 정의 · 개발 · 생산 · 운전</strong>이다.<p><strong>◈ 암기</strong> <u>구 · 정 · 개 · 생 · 운</u> 다섯.</p><p>다섯을 <strong>구 · 정 · 개 · 생 · 운</strong>으로 새긴다. <strong>「분석」은 각 단계에서 하는 일</strong>이지 단계 이름이 아니다.</p><div style=\"margin:12px 0 2px;font-weight:700\">시스템 수명주기 5단계</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">하는 일</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>구상단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>PHA</u> · 시스템 안전 목표 설정</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정의(사양결정)단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안전성 부문의 사양 결정 · SSPP 작성</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>개발단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>FMEA · FTA 등 위험분석 · 시제품 시험</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생산단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>품질관리 · 공정 안전</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>5</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>운전(배치)단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안전점검 기준 · 사고 조사</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t189": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "FMEA(고장형태 및 영향분석)", "front": "FMEA(고장형태 및 영향분석)은?", "back": "<strong>고장 발생을 최소로 하려는 경우</strong>다. <strong>부품 하나하나의 고장 형태와 그 영향을 미리 따져</strong> 설계를 고친다.<p><strong>◈ 암기</strong> <u>고장을 줄이려면 FMEA</u>.</p><p>FMEA 는 <strong>「이 부품이 이렇게 고장 나면 무슨 일이 벌어지나」</strong>를 부품마다 따지는 <strong>상향식 · 귀납적 · 정성적</strong> 기법이다. 그래서 <strong>설계 단계에서 고장을 줄이는 데</strong> 가장 쓸모 있다.</p>", "nq": 1}, "card_erg_t190": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "FMEA 의 고장 영향 평가", "front": "FMEA 의 고장 영향 평가는?", "back": "<strong>실제 손실이 예상됨</strong>이다.<p><strong>◈ 암기</strong> <u>0 없음 · 0~0.1 가능성 · 0.1~1 예상 · 1 발생</u>.</p><p>네 구간을 <strong>0 · 0~0.1 · 0.1~1 · 1</strong>로 나누고, <strong>없음 → 가능성 → 예상 → 발생</strong>으로 짝지어 둔다. <strong>「예상」과 「발생」을 바꿔 놓는 것</strong>이 함정이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">FMEA 의 고장 발생확률 β 와 영향</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">β 의 범위</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">고장의 영향</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>β = 1.00</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>실제 손실이 발생됨</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>반드시 손실</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>0.10 ≤ β &lt; 1.00</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>실제 손실이 예상됨</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>0 &lt; β &lt; 0.10</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>손실 발생의 가능성이 있음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>β = 0</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>손실의 영향이 없음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t145": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "직렬 시스템과 병렬 시스템", "front": "직렬 시스템과 병렬 시스템은?", "back": "<ul><li><strong>수명이 가장 짧은 것이 시스템을 정한다</strong>는 것은 <strong>직렬</strong>의 특성이다. 병렬은 <strong>가장 오래 가는 것</strong>이 시스템의 수명을 정한다.</li><li><strong>어느 한 부품이 고장 나면 시스템이 멈추는</strong> 것은 <strong>직렬</strong> 구조다. 병렬은 <strong>하나만 살아 있어도 돌아간다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>직렬은 가장 짧은 것, 병렬은 가장 긴 것</u>. · <u>하나만 고장 나도 멈추면 직렬</u>.</p><p>병렬은 <strong>여분(redundancy)</strong>을 두는 것이다. <strong>하나가 죽어도 남은 것이 대신하므로</strong> 요소를 더할수록 튼튼해진다. <strong>보기 ④만 직렬의 성질</strong>이다.<br><strong>직렬은 「모두 있어야 하고」, 병렬은 「하나만 있으면 된다」</strong>다. <strong>보기 ②가 「직렬이 낮다」고 이미 말하고 있으므로, ③이 그와 어긋난다</strong>는 점으로도 찾을 수 있다.</p><div style=\"margin:12px 0 2px;font-weight:700\">직렬 시스템과 병렬 시스템</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">직렬</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">병렬</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">신뢰도</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$R = R_{1} R_{2} \\cdots R_{n}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$R = 1 - ( 1 - R_{1} ) ( 1 - R_{2} ) \\cdots$</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">언제 정상</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>모두 정상이어야</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어느 하나만 정상이면</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">요소가 늘면</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>신뢰도가 떨어진다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>신뢰도가 올라간다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">수명</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 짧은 것이 정한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 긴 것이 정한다</u></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t164": {"kind": "용어형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "인체측정치의 응용 원리", "front": "인체측정치의 응용 원리란?", "back": "<ul><li>거꾸로다. <strong>넓이는 큰 사람에게(최대집단값), 깊이는 작은 사람에게(최소집단값)</strong> 맞춘다.</li><li><strong>의자 너비만 최대 집단치</strong>다. 나머지 셋은 모두 조절식이거나 최소 집단치로 잡는다.</li><li><strong>최대 집단치</strong>다. <strong>가장 큰 사람도 넘거나 빠져나가지 못하게</strong> 해야 한다.</li></ul><p><strong>◈ 암기</strong> <u>너비는 큰 사람, 깊이는 작은 사람</u>. · <u>너비는 최대, 깊이는 최소, 높이는 조절식</u>.</p><p>원칙은 하나 — <strong>모자라면 곤란한 치수는 큰 사람에게, 넘치면 곤란한 치수는 작은 사람에게</strong> 맞춘다. <strong>너비는 넓어도 탈이 없지만 깊이는 깊으면 오금이 눌려</strong> 탈이 난다.<br>원칙은 하나 — <strong>모자라면 곤란하면 큰 사람에게, 넘치면 곤란하면 작은 사람에게, 맞출 수 있으면 조절식</strong>이다. <strong>너비는 넓어도 탈이 없지만 깊이는 깊으면 오금이 눌린다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">의자 좌판의 설계 기준</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">치수</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">맞추는 대상</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>좌판의 너비</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>큰 사람</u> (최대집단값)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>넓으면 작은 사람도 앉을 수 있다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>좌판의 깊이</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작은 사람</u> (최소집단값)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>깊으면 작은 사람의 오금이 눌린다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>좌판의 높이</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작은 사람</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">발이 바닥에 닿아야 한다</td></tr></tbody></table></div>", "nq": 3}, "card_erg_t191": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "산소소비량에 의한 에너지소비량 산출", "front": "산소소비량에 의한 에너지소비량 산출의 식은?", "back": "분당 배기량은 20 [L/min], 흡기량은 $V_{i} = 20 \\times \\dfrac{77}{79} \\fallingdotseq 19.49$ [L/min] 이다. 산소소비량은 $19.49 \\times 0.21 - 20 \\times 0.20 \\fallingdotseq 0.093$ [L/min] 이고, 에너지소비량은 $0.093 \\times 5 \\fallingdotseq 0.46$ [kcal/min] 이다.<p><strong>◈ 암기</strong> <u>산소 1 [L] 는 약 5 [kcal]</u>.</p><p><strong>질소는 몸에서 쓰이지 않으므로 들이마신 양과 내쉰 양이 같다</strong> — 여기서 흡기량 식이 나온다. <strong>산소 1 [L] = 약 5 [kcal]</strong>라는 환산도 함께 외워 둔다.</p><div style=\"margin:12px 0 2px;font-weight:700\">산소소비량과 에너지소비량</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>흡기량</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$V_{i} = V_{e} \\times \\dfrac{100 - O_{2} - CO_{2}}{79}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>질소량이 같다는 데서 나온다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>산소소비량</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$V_{i} \\times 0.21 - V_{e} \\times O_{2}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>에너지소비량</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>산소소비량 × 5 [kcal/L]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>산소 1 [L] 는 약 5 [kcal]</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t048": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "작업환경관리", "mid": "실효온도(감각온도)", "front": "실효온도(감각온도)는?", "back": "<ul><li>실효온도는 <strong>온도 · 습도 · 공기 유동</strong> 세 가지로 정해진다. <strong>복사열은 들어가지 않는다</strong>. 복사열까지 넣은 것은 <strong>수정 실효온도(CET)</strong>다.</li><li><strong>실효온도(감각온도, effective temperature)</strong>다. <strong>온도 · 습도 · 기류</strong> 세 가지를 하나로 묶은 지수다.</li><li>실효온도는 <strong>몸의 온도가 아니라 둘레 환경의 온도</strong>를 다룬다. <strong>체온계로 입안을 재는</strong> 것과 관계없다.</li></ul><p><strong>◈ 암기</strong> <u>실효온도에 복사열은 없다</u>. · <u>온도 · 습도 · 기류 셋이면 실효온도</u>.</p><p><strong>실효온도는 셋, 수정 실효온도는 넷</strong>이다. 옥외 작업의 WBGT 에 건구온도가 들어가는 것과 같은 이치로, <strong>햇볕(복사열)이 있으면 항목이 하나 늘어난다</strong>.<br><strong>「온도 · 습도 · 기류 셋을 묶었다」</strong>는 말이 실효온도를 가리킨다. <strong>옥스포드 지수와 불쾌지수는 기류를 넣지 않는다</strong>는 점에서 갈린다.</p><div style=\"margin:12px 0 2px;font-weight:700\">온열지수</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">지수</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 묶었나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>실효온도(감각온도)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>온도 · 습도 · 기류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>상대습도 100 [%] 기준</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>옥스포드 지수 WD</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>건구 · 습구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$0.85 W + 0.15 D$</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>WBGT</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>자연습구 · 흑구 · (건구)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">복사열까지</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>불쾌지수</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>건구 · 습구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>열압박지수 HSI</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>필요 발한량 대비 최대 발한량</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 3}, "card_erg_t015": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "HAZOP 의 가이드워드", "front": "HAZOP 의 가이드워드는?", "back": "<ul><li><strong>Other than 은 「완전한 대체」</strong>, 곧 의도한 것과 <strong>전혀 다른 것이 일어남</strong>을 뜻한다. 「기타 환경적인 요인」이 아니다.</li><li><strong>OTHER THAN</strong>이다. <strong>완전히 다른 것으로 바뀐</strong> 상태를 뜻한다.</li><li><strong>Other than 은 「완전한 대체」</strong>다. <strong>「기타 환경적인 요인」</strong>이라는 뜻이 아니다.</li></ul><p><strong>◈ 암기</strong> <u>양은 More/Less, 질은 As well as / Part of</u>. Other than 은 완전한 대체. · <u>완전히 다른 것 = OTHER THAN</u>.</p><p><u>No/Not(설계 의도의 완전한 부정) · More/Less(양적 증감) · As well as(질적 증가) · Part of(질적 감소) · Reverse(설계 의도와 반대) · Other than(완전한 대체)</u>. <u>양적인 것은 More/Less, 질적인 것은 As well as / Part of</u>로 짝지어 두면 된다.<br><strong>AS WELL AS 와 PART OF 는 양이 아니라 성질</strong>을 말한다. <strong>MORE/LESS 가 양</strong> 쪽이다. 이 대비가 가장 자주 물어진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">HAZOP 의 가이드워드</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">가이드워드</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 가리키나</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>NO / NOT</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>설계 의도의 완전한 부정</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">전혀 일어나지 않음</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>MORE / LESS</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>양의 증가 또는 감소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">유량·압력·온도가 많거나 적음</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>AS WELL AS</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>성질상의 증가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">의도한 것에 <u>덧붙여</u> 다른 것도</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>PART OF</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>성질상의 감소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">의도한 것의 <u>일부만</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>REVERSE</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>설계 의도와 반대</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">역류</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>OTHER THAN</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>완전한 대체</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전혀 다른 것</u>으로 바뀜</td></tr></tbody></table></div>", "nq": 4}, "card_erg_t150": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "PHA(예비위험분석)", "front": "PHA(예비위험분석)은?", "back": "<ul><li><strong>PHA(예비위험분석)</strong>다. <strong>시스템 개발의 가장 이른 단계</strong>에서 정성적으로 훑는다.</li><li><strong>PHA(예비위험분석)</strong>다. <strong>가장 이른 단계에서 정성적으로 훑는다</strong>.</li><li><strong>PHA(예비위험분석)</strong>다. <strong>구상단계에서 가장 먼저 정성적으로 훑는다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>맨 처음의 정성적 해석은 PHA</u>. · <u>구상단계의 첫 해석은 PHA</u>.</p><p>PHA 는 위험을 네 등급으로 나눈다 — <strong>파국(catastrophic) · 중대(critical) · 한계(marginal) · 무시가능(negligible)</strong>. <strong>「최초 단계」·「정성적」</strong> 두 낱말이 PHA 를 가리킨다.<br><strong>PHA 의 P 가 Preliminary(예비)</strong>다. <strong>아직 설계도 없는 구상 단계에서 「무엇이 위험할까」를 먼저 훑는</strong> 것이라 가장 앞에 온다. <strong>네 등급을 파 · 위 · 한 · 무</strong>로 새긴다.</p><div style=\"margin:12px 0 2px;font-weight:700\">주요 시스템 위험분석 기법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">언제</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">성격</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>PHA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>예비위험분석</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 이른 단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정성적</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>FHA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>결함위험분석</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>분담 설계 단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">정성적 — 하청 부분</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>FMEA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>고장형태 및 영향분석</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">설계 단계</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">정성적 · 귀납적</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>FTA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>결함수분석</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">설계·운전 단계</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정량적 · 연역적</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>ETA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사건수분석</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">정량적 · 귀납적</td></tr></tbody></table></div>", "nq": 3}, "card_erg_t168": {"kind": "공식형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "Fitts 의 법칙", "front": "Fitts 의 법칙의 식은?", "back": "<ul><li><strong>표적이 작고 멀수록 오래 걸린다</strong>. $MT = a + b \\log_{2} ( \\dfrac{2 A}{W} )$ 에서 $A$ 는 거리, $W$ 는 표적의 너비다.</li><li><strong>표적의 색상</strong>은 식에 들어가지 않는다. $MT = a + b \\log_{2} ( \\dfrac{2 A}{W} )$ 에는 <strong>거리 </strong>$A$<strong> 와 너비 </strong>$W$만 나온다.</li></ul><p><strong>◈ 암기</strong> <u>작고 멀수록 오래 걸린다</u>. · <u>거리와 너비 둘뿐</u>.</p><p>상식과 같다 — <strong>멀고 작은 과녁일수록 맞히기 어렵고 오래 걸린다</strong>. 그래서 <strong>자주 쓰는 버튼은 크고 가까이</strong> 두어야 한다는 설계 지침이 나온다.<br><strong>거리와 크기, 두 가지뿐</strong>이다. <strong>색상 · 모양 · 밝기는 「찾는 데」 영향을 주지만 「손을 옮기는 시간」에는 들어가지 않는다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">Fitts 의 법칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조건</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이동시간</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>표적이 작을수록</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>길어진다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정확히 맞춰야 하니 조심스럽다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>거리가 멀수록</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>길어진다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>더 많이 움직여야 한다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>난이도 지수 ID</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\log_{2} ( 2 A / W )$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>거리에 비례, 너비에 반비례</u></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t180": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "시각·청각 표시장치의 선택", "front": "시각·청각 표시장치의 선택은?", "back": "<ul><li><strong>즉각적인 행동을 요구하지 않으면 시각</strong>이 낫다. 나머지 셋은 모두 청각이 나은 경우다.</li><li><strong>다시 볼 일이 없으면 청각</strong>이 낫다. 나머지 셋은 모두 시각이 나은 경우다.</li><li><strong>나중에 다시 볼 정보면 시각</strong>이 낫다. 나머지 셋은 모두 청각이 나은 경우다.</li></ul><p><strong>◈ 암기</stro rd_mac_t166": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "설비진단", "mid": "욕조곡선(bathtub curve)", "front": "욕조곡선(bathtub curve)는?", "back": "<strong>「수시고장」</strong>이라는 갈래는 없다. 셋은 <strong>초기 · 우발 · 마모</strong> 고장이다.<p><strong>◈ 암기</strong> <u>초기 · 우발 · 마모</u> 셋.</p><p>세 구간이 <strong>욕조 모양</strong>을 이룬다 — <strong>처음에는 높다가(초기) 낮게 이어지다가(우발) 끝에 다시 오른다(마모)</strong>. <strong>각 구간마다 대책이 다르다</strong>는 것이 요점이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">욕조곡선의 세 구간</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구간</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">고장률</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원인과 대책</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>초기고장</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>감소형(DFR)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>설계·제작 결함</u> → 디버깅 · 번인(길들이기)</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>우발고장</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>일정형(CFR)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>예기치 못한 사고</u> → 극한상황을 넘지 않게 관리</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>마모고장</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>증가형(IFR)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>부품의 노화</u> → 예방보전(PM)</td></tr></tbody></table></div>", "nq": 1}, "card_mac_t167": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "운반·양중기", "mid": "와이어로프의 구성 표기", "front": "와이어로프의 구성 표기는?", "back": "<strong>스트랜드(꼬임)의 수</strong>다. <strong>6 × 19 는 스트랜드 6개, 각 스트랜드마다 소선 19가닥</strong>이라는 뜻이다.<p><strong>◈ 암기</strong> <u>앞이 스트랜드, 뒤가 소선</u>.</p><p><strong>소선 → 스트랜드 → 로프</strong>라는 세 단계를 떠올리면 <strong>앞이 큰 단위(스트랜드), 뒤가 작은 단위(소선)</strong>라는 것이 자연스럽다.</p><div style=\"margin:12px 0 2px;font-weight:700\">와이어로프의 표기 「6 × 19」</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">자리</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>앞의 6</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>스트랜드(꼬임)의 수</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>심강을 감싸는 다발의 수</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>뒤의 19</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>한 스트랜드 안의 소선 수</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가는 강선의 가닥 수</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전체 소선</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>6 × 19 = 114 가닥</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_mac_t168": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "운반·양중기", "mid": "와이어로프의 꼬임 방식", "front": "와이어로프의 꼬임 방식은?", "back": "<strong>보통꼬임은 킹크(꼬임이 뒤틀려 매듭처럼 되는 것)가 적다</strong>. <strong>스트랜드와 소선의 꼬임 방향이 반대라 서로 풀리려는 힘이 상쇄</strong> 되기 때문이다.<p><strong>◈ 암기</strong> <u>보통꼬임은 킹크가 적다</u>.</p><p><strong>랭꼬임은 오래가지만 다루기 까다롭고, 보통꼬임은 덜 가지만 다루기 쉽다</strong>. <strong>크레인처럼 자주 감았다 풀었다 하는 곳에는 킹크가 적은 보통꼬임</strong>을 쓴다.</p><div style=\"margin:12px 0 2px;font-weight:700\">보통꼬임과 랭꼬임</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보통꼬임(regular lay)</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">랭꼬임(lang's lay)</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">꼬임 방향</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>스트랜드와 소선이 반대</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>같다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">킹크</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>적다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>잘 생긴다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">취급</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>쉽다 · 자체 형태를 잘 지킨다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">어렵다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">내마모성</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>낮다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높다</u> (소선의 접촉 길이가 길다)</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">수명</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>짧다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>길다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">쓰임</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>크레인 등 일반</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">광산 · 삭도 등</td></tr></tbody></table></div>", "nq": 1}, "card_mac_t117": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "작업시작 전 점검사항", "front": "작업시작 전 점검사항은?", "back": "<ul><li><strong>브레이크 및 클러치</strong>는 <strong>프레스</strong>의 점검사항이다. 컨베이어에는 없다.</li><li><strong>클러치 상태 점검</strong>이다. <strong>클러치가 고장 나면 슬라이드가 멈추지 않고 계속 내려온다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>브레이크·클러치는 프레스</u>. · <u>클러치와 브레이크가 첫째</u>.</p><p>컨베이어의 네 항목은 모두 <strong>돌리는 것(원동기·풀리) · 흘러내리지 않게(이탈 방지) · 세우는 것(비상정지) · 덮는 것(덮개)</strong>이다. <strong>「브레이크와 클러치」는 프레스</strong>의 것이다.<br>일곱 항목 가운데 <strong>클러치와 브레이크가 맨 앞</strong>에 놓여 있다. <strong>프레스 사고는 대개 「멈추지 않아서」 일어난다</strong> — 그것을 맡는 것이 클러치와 브레이크다.</p><div style=\"margin:12px 0 2px;font-weight:700\">컨베이어 작업시작 전 점검사항 (규칙 별표3)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">점검사항</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>원동기 및 풀리 기능의 이상 유무</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>이탈 등의 방지장치 기능의 이상 유무</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>비상정지장치 기능의 이상 유무</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>원동기·회전축·기어 및 풀리 등의 덮개 또는 울 등의 이상 유무</u></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 별표3</em></p>", "nq": 2}, "card_ele_t182": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "비접지 방식과 감전 방지", "front": "비접지 방식과 감전 방지는?", "back": "<strong>비접지 방식</strong>이다. <strong>전원이 대지와 끊어져 있으면 사람이 한 선에 닿아도 전류가 돌아갈 길이 없다</strong>.<p><strong>◈ 암기</strong> <u>돌아갈 길을 없애면 비접지</u>.</p><p>감전은 <strong>전류가 사람 몸을 지나 대지로 돌아갈 길이 있을 때</strong> 일어난다. <strong>그 길 자체를 없애는</strong> 것이 비접지 방식이다. 다만 <strong>지락을 알아채기 어려워</strong> 절연감시장치를 함께 둔다.</p><div style=\"margin:12px 0 2px;font-weight:700\">접지 방식과 감전 위험</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">접지계통</th><th style=\"border:1px solid .5 → 25 → 50 → 무제한</strong>으로 <strong>젖은 정도와 닿는 정도가 덜할수록 커진다</strong>. <strong>「대부분 젖음」은 제1종, 「현저히 젖음」은 제2종</strong>이라는 정도 차이에 유의한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">허용접촉전압의 종별</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종별</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">어떤 상태</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">허용접촉전압</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제1종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>인체의 대부분이 물에 젖어 있는 상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>2.5 [V] 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제2종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>금속제 기계장치나 구조물에 몸의 일부가 늘 닿아 있는 상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>25 [V] 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제3종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>통상의 인체 상태로 접촉전압이 가해지면 위험성이 높은 상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>50 [V] 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제4종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위험성이 낮거나 접촉전압이 가해질 우려가 없는 경우</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>제한 없음</u></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t122": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "심전도와 심실세동", "front": "심전도와 심실세동은?", "back": "<ul><li><strong>T 파</strong>다. <strong>심실이 수축을 마치고 쉬면서 회복하는 동안</strong> 나타나며, 이때 전류가 흐르면 심실세동이 가장 잘 일어난다.</li><li><strong>심실이 수축을 마치고 쉬는 때(T 파)</strong>다. 이때가 <strong>취약기(vulnerable period)</strong>로 심실세동이 가장 잘 일어난다.</li></ul><p><strong>◈ 암기</strong> <u>T 파에서 감전되면 가장 위험</u>.</p><p>T 파 구간은 <strong>심근세포가 다시 흥분할 준비를 하는 불안정한 때</strong> 라서 <strong>작은 자극에도 박동이 흐트러진다</strong>. 이를 <strong>취약기(vulnerable period)</strong>라 한다.<br>T 파 구간은 <strong>심근세포가 다시 흥분할 준비를 하는 불안정한 때</strong> 라서 <strong>작은 자극에도 박동이 흐트러진다</strong>. <strong>쉴 때가 오히려 위험</strong> 하다는 점이 뜻밖이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">심전도의 파형</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">파형</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>P 파</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>심방의 수축</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:  "전기위험방지기술", "chapter": "전기설비", "mid": "정전작업 시의 잔류전하 방전", "front": "정전작업 시의 잔류전하 방전은?", "back": "<ul><li><strong>방전 코일</strong>은 애초에 <strong>잔류전하를 빼내려고 붙여 놓은 장치</strong>다. 전하가 남을 가능성이 가장 낮다.</li><li><strong>잔류전하의 방전</strong>이다. <strong>케이블과 콘덴서는 전원을 끊어도 전하를 그대로 품고</strong> 있다.</li><li><strong>전력 콘덴서의 잔류전하 방전</strong>이다. <strong>콘덴서는 전원을 끊어도 전하를 그대로 품고</strong> 있다.</li></ul><p><strong>◈ 암기</strong> <u>방전 코일은 빼내는 쪽</u>. · <u>케이블과 콘덴서는 잔류전하</u>.</p><p><strong>방전 코일(DC)</strong>은 콘덴서와 함께 설치해 <strong>전원을 끊으면 자동으로 전하를 빼내는</strong> 장치다. 그래도 <strong>검전기로 확인하는 절차</strong>는 건너뛰지 않는다.<br><strong>「케이블」과 「콘덴서」라는 낱말이 나오면 잔류전하</strong>를 떠올린다. <strong>전원을 끊고 나서도 만지면 감전</strong> 되므로 <strong>반드시 방전한 뒤 검전</strong> 한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">잔류전하가 남는 곳</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">설비</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">왜 남나</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전력용 콘덴서</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전하를 저장하는 것이 본디 역할</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전력 케이블</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>긴 도체가 정전용량을 갖는다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>용량이 큰 부하기기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>내부에 콘덴서 성분</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>방전 코일</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전하를 빼내는 장치</u> — 남지 않는다</td></tr></tbody></table></div>", "nq": 3}, "card_ele_t185": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "", "mid": "방폭기기의 설치 위치", "front": "방폭기기의 설치 위치는?", "back": "<strong>가스가 나오는 곳 가까이</strong>에 전기기기를 두어서는 안 된다. <strong>검지가 쉽다는 것은 곧 가스가 많다는 뜻</strong>이다.<p><strong>◈ 암기</strong> <u>가스 발산구 가까이는 안 된다</u>.</p><p>세 조건이 <strong>다루기 쉽고 · 상하지 않고 · 손보기 좋은</strong> 자리를 말한다. 보기 ④는 <strong>위험한 곳으로 일부러 다가가는</strong> 것이라 정반대다.</p>", "nq": 1}, "card_ele_t186": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "", "mid": "화재 대비 비상용 동력설비", "front": "화재 대비 비상용 동력설비는?", "back": "<strong>급수 펌프</strong>는 <strong>평소에 물을 대는</strong> 설비다. 화재 대비 비상용이 아니다.<p><strong>◈ 암기</strong> <u>급수 펌프는 비상용이 아니다</u>.</p><p>비상용 동력설비는 <strong>불을 끄거나(소화 펌프 · 스프링클러 펌프) 연기를 빼내거나(배연 송풍기) 사람을 대피시키는(비상용 엘리베이터 · 비상조명)</strong> 것이다. <strong>급수는 평소의 일</strong>이다.</p>", "nq": 1}, "card_ele_t187": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "분진의 최소발화에너지(MIE)", "front": "분진의 최소발화에너지(MIE)는?", "back": "<strong>폴리에틸렌</strong>이다. <strong>약 10 [mJ]</strong>로 보기 가운데 가장 작다.<p><strong>◈ 암기</strong> <u>폴리에틸렌이 가장 작다</u>.</p><p><strong>값이 작을수록 작은 불꽃에도 터진다</strong>. <strong>플라스틱 가루(폴리에틸렌)가 금속분보다 오히려 잘 붙는다</strong>는 점이 뜻밖이다. <strong>정전기 방전 에너지가 이 값을 넘으면 폭발</strong> 한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">분진의 최소발화에너지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">분진</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">최소발화에너지</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;
