<script>const MODE="study";const D={"round": 15, "title": "2023년 3회 산업안전기사 필기", "limit": 10800, "subj": ["안전관리론", "인간공학·시스템", "기계위험방지", "전기위험방지", "화학설비위험방지", "건설안전"], "q": [{"n": 1, "s": 1, "a": 4, "lv": 1, "fq": 1, "kind": "개념형", "t": "산업안전보건법령상 사업 내 안전ㆍ보건교육 중 관리감독자 정기안전ㆍ보건교육 내용으로 틀린 것은? (단, 산업안전보건법 및 일반관리에 관한 사항은 제외한다.)", "c": ["작업공정의 유해ㆍ위험과 재해예방대책에 관한 사항", "표준안전작업방법 및 지도요령에 관한 사항", "유해ㆍ위험 작업환경 관리에 관한 사항", "건강증진 및 질병예방에 관한 사항"], "cond": "", "img": "", "sol": "<strong>건강증진 및 질병예방</strong>은 <strong>근로자 정기교육</strong>의 내용이다. 관리감독자 정기교육에는 없다.<div style=\"margin:12px 0 2px;font-weight:700\">정기교육 — 근로자와 관리감독자</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">근로자 정기교육</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">관리감독자 정기교육</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>산업안전 및 사고 예방</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작업공정의 유해·위험과 재해 예방대책</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>산업보건 및 직업병 예방</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>표준안전작업방법 및 지도 요령</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>건강증진 및 질병 예방</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>관리감독자의 역할과 임무</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>유해·위험 작업환경 관리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>유해·위험 작업환경 관리</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험성 평가에 관한 사항</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위험성 평가에 관한 사항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>직무스트레스 예방 및 관리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>현장근로자와의 의사소통능력 및 강의능력 등</u></td></tr></tbody></table></div>", "w": "① 작업공정의 유해·위험과 재해예방대책은 관리감독자 정기교육 내용이다.<br>② 표준안전작업방법 및 지도요령도 그렇다.<br>③ 유해·위험 작업환경 관리도 그렇다.", "pt": "<strong>산업안전보건법 시행규칙 별표5 — 교육대상별 교육내용</strong><br><strong>근로자는 「내 몸과 내 일자리」, 관리감독자는 「내가 이끄는 사람과 공정」</strong>을 배운다. <strong>「건강증진」은 제 몸을 돌보는 일</strong>이라 근로자 쪽이다.<p><strong>◈ 암기</strong> <u>건강증진은 근로자 정기교육</u>.</p>", "law": "<details class=law><summary>⚖ 근거 법령 — 산업안전보건법 시행규칙 별표 5<span class=eff>산업안전보건법 시행규칙 시행 2026. 8. 1.</span></summary><div class=lawin><div class=lawmiss>· <a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EB%B2%95%EC%8B%9C%ED%96%89%EA%B7%9C%EC%B9%99\" target=\"_blank\">산업안전보건법 시행규칙 별표 5</a> — 별표는 법제처 원문에서 봅니다</div></div></details>", "card": "card_mgt_t123"}, {"n": 2, "s": 1, "a": 1, "lv": 1, "fq": 3, "kind": "개념형", "t": "다음 중 산업안전보건법령상 사업내 안전보건교육에 있어 관리감독자 정기안전ㆍ보건교육의 교육 내용에 해당되지 않은 것은? (단, 산업안전보건법 및 일반관리에 관한 사항은 제외한다.)", "c": ["작업개시 전 점검에 관한 사항", "산업보건 및 직업병 예방에 관한 사항", "유해ㆍ위험 작업환경 관리에 관한 사항", "작업공정의 유해ㆍ위험과 재해 예방대책에 관한 사항"], "cond": "", "img": "", "sol": "<strong>작업개시 전 점검</strong>은 <strong>채용 시·작업내용 변경 시 교육</strong>의 내용이다.", "w": "② 산업보건 및 직업병 예방은 관리감독자 정기교육 내용이다.<br>③ 유해·위험 작업환경 관리도 그렇다.<br>④ 작업공정의 유해·위험과 재해 예방대책도 그렇다.", "pt": "<strong>산업안전보건법 시행규칙 별표5 — 교육대상별 교육내용</strong><br><strong>「작업개시 전 점검」·「정리정돈」·「작업의 순서와 동선」</strong>은 모두 <strong>처음 배치될 때 알려 주는 것</strong>이라 채용 시 교육이다.<p><strong>◈ 암기</strong> <u>작업개시 전 점검은 채용 시 교육</u>.</p>", "law": "<details class=law><summary>⚖ 근거 법령 — 산업안전보건법 시행규칙 별표 5<span class=eff>산업안전보건법 시행규칙 시행 2026. 8. 1.</span></summary><div class=lawin><div class=lawmiss>· <a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EB%B2%95%EC%8B%9C%ED%96%89%EA%B7%9C%EC%B9%99\" target=\"_blank\">산업안전보건법 시행규칙 별표 5</a> — 별표는 법제처 원문에서 봅니다</div></div></details>", "card": "card_mgt_t123"}, {"n": 3, "s": 1, "a": 3, "lv": 1, "fq": 1, "kind": "개념형", "t": "다음 중 산업재해 통계의 활용 용도로 가장 적절하지 않은 것은?", "c": ["제도의 개선 및 시정", "재해의 경향파악", "관리자 수준 향상", "동종업종과의 비교"], "cond": "", "img": "", "sol": "<strong>관리자 수준 향상</strong>은 재해통계의 용도가 아니다. <strong>통계는 사람이 아니라 제도와 설비를 고치는 데</strong> 쓴다.", "w": "① 제도의 개선 및 시정은 재해통계의 용도다.<br>② 재해의 경향파악도 그렇다.<br>④ 동종업종과의 비교도 그렇다.", "pt": "<strong>산업재해 통계의 활용</strong><br>통계의 쓰임은 <strong>「어디가 잘못됐는지 찾아 고친다」</strong>는 한 가지다. <strong>「관리자 평가」·「인책」</strong>처럼 사람을 향하면 통계가 감춰져 오히려 쓸모없어진다.<p><strong>◈ 암기</strong> <u>통계는 제도를 고치는 데 쓴다</u>.</p>", "law": "", "card": "card_mgt_t198"}, {"n": 4, "s": 1, "a": 2, "lv": 2, "fq": 1, "kind": "개념형", "t": "안전교육의 내용에 있어 다음 설명과 가장 관계가 깊은 것은?", "c": ["안전지식의 교육", "안전기능의 교육", "문제해결의 교육", "안전태도의 교육"], "cond": "· 교육대상자가 그것을 스스로 행함으로 얻어진다.<br>· 개인의 반복적 시행착오에 의해서만 얻어진다.", "img": "", "sol": "<strong>안전기능의 교육(제2단계)</strong>이다. <strong>몸으로 되풀이해야만 익혀진다</strong>.<div style=\"margin:12px 0 2px;font-weight:700\">안전교육의 3단계</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 어떻게</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>지식교육</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>알게 한다</u> — 강의 · 시청각 교육</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기능교육</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>할 수 있게 한다</u> — <u>스스로 해 보며 되풀이</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>태도교육</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>하게 만든다</u> — 습관화 · 동기부여</td></tr></tbody></table></div>", "w": "① 안전지식의 교육은 강의로 알게 하는 단계다.<br>③ 「문제해결의 교육」은 3단계 구분에 없는 이름이다.<br>④ 안전태도의 교육은 습관으로 만드는 단계다.", "pt": "<strong>안전교육의 3단계</strong><br><strong>「스스로 행함」·「반복적 시행착오」</strong> 두 낱말이 기능교육을 가리킨다. <strong>남이 말해 주어서는 얻을 수 없고 제 손으로 해 봐야</strong> 익는 것이 기능이다.<p><strong>◈ 암기</strong> <u>지식 · 기능 · 태도</u> 셋.</p>", "law": "", "card": "card_mgt_t053"}, {"n": 5, "s": 1, "a": 2, "lv": 2, "fq": 1, "kind": "개념형", "t": "다음 중 위험예지훈련 4라운드의 진행순서로 옳은 것은?", "c": ["목표설정 → 현상파악 → 대책수립 → 본질추구", "현상파악 → 본질추구 → 대책수립 → 목표설정", "목표설정 → 현상파악 → 본질추구 → 대책수립", "현상파악 → 본질추구 → 목표설정 → 대책수립"], "cond": "", "img": "", "sol": "<strong>현상파악 → 본질추구 → 대책수립 → 목표설정</strong>이다.<div style=\"margin:12px 0 2px;font-weight:700\">위험예지훈련 4라운드</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">라운드</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 하나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">묻는 말</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1R</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>현상파악</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어떤 위험이 있나</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">「어떤 위험이 숨어 있는가?」</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2R</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>본질추구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>무엇이 진짜 문제인가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">「이것이 위험의 요점이다」</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3R</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>대책수립</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어떻게 할 것인가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">「당신이라면 어떻게 하겠는가?」</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4R</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>행동목표 설정</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>무엇을 지킬 것인가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">「우리는 이렇게 한다」</td></tr></tbody></table></div>", "w": "① 목표설정이 맨 앞에 올 수 없다.<br>③ 목표설정이 둘째에 올 수도 없다.<br>④ 목표설정이 대책수립보다 앞설 수 없다.", "pt": "<strong>위험예지훈련 4라운드</strong><br>흐름은 <strong>보고 → 캐고 → 세우고 → 다짐한다</strong>다. <strong>목표설정이 언제나 마지막</strong>이라는 것만 잡아도 보기 셋이 걸러진다.<p><strong>◈ 암기</strong> <u>현상파악 · 본질추구 · 대책수립 · 행동목표</u>.</p>", "law": "", "card": "card_mgt_t005"}, {"n": 6, "s": 1, "a": 1, "lv": 3, "fq": 1, "kind": "계산형", "t": "ABE종 안전모에 대하여 내수성 시험을 할 때 물에 담그기 전의 질량이 400g이고, 물에 담근 후의 질량이 410g 이었다면 질량증가율과 합격여부로 옳은 것은?", "c": ["질량증가율 : 2.5%, 합격여부 : 불합격", "질량증가율 : 2.5%, 합격여부 : 합격", "질량증가율 : 102.5%, 합격여부 : 불합격", "질량증가율 : 102.5%, 합격여부 : 합격"], "cond": "", "img": "", "sol": "$\\text{질량증가율} = \\dfrac{410 - 400}{400} \\times 100 = 2.5$ [%]다. <strong>기준은 1 [%] 미만</strong>이므로 <strong>불합격</strong>이다.<div style=\"margin:12px 0 2px;font-weight:700\">안전모의 내수성 시험</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">내용</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>대상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>AE · ABE종</u> (내전압성이 있는 것)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>방법</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>20 ~ 25 [℃] 물에 24시간 담근다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{담근 뒤 질량} - \\text{담그기 전 질량}}{\\text{담그기 전 질량}} \\times 100$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기준</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 [%] 미만</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>2.5 [%]는 불합격</u></td></tr></tbody></table></div>", "w": "② 2.5 [%]는 맞지만 1 [%] 미만이 아니므로 합격이 아니다.<br>③ 102.5 [%]는 증가율이 아니라 담근 뒤의 비율이다.<br>④ 102.5 [%]라는 값 자체가 어긋난다.", "pt": "<strong>보호구 안전인증 고시 — 안전모의 내수성 시험</strong><br><strong>「증가율」은 늘어난 몫을 처음 값으로 나눈 것</strong>이다. <strong>410 ÷ 400 = 102.5 [%]</strong>는 「담근 뒤가 처음의 몇 [%]인가」이지 증가율이 아니다.<p><strong>◈ 암기</strong> <u>질량 증가율 1 [%] 미만</u>.</p>", "law": "", "card": "card_mgt_t199"}, {"n": 7, "s": 1, "a": 1, "lv": 2, "fq": 1, "kind": "개념형", "t": "리더십의 행동이론 중 관리그리드(managerial grid) 이론에서 리더의 행동유형과 경향을 올바르게 연결한 것은?", "c": ["(1.1)형 - 무관심형", "(1.9)형 - 과업형", "(9.1)형 - 인기형", "(5.5)형 - 이상형"], "cond": "", "img": "", "sol": "<strong>(1,1)형은 무관심형</strong>이 맞다. 나머지 셋은 짝이 어긋난다.<div style=\"margin:12px 0 2px;font-weight:700\">블레이크와 머튼의 관리그리드</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">좌표</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">유형</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>(1, 1)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>무관심형(impoverished)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생산도 사람도 관심 없다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>(1, 9)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>인기형(country club)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사람에만 관심</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>(9, 1)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>과업형(task)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생산에만 관심</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>(5, 5)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>타협형(middle of the road)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>적당히 절충</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>(9, 9)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이상형(team)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생산과 사람 모두 높다</u></td></tr></tbody></table></div>", "w": "② (1,9)형은 과업형이 아니라 인기형이다.<br>③ (9,1)형은 인기형이 아니라 과업형이다.<br>④ (5,5)형은 이상형이 아니라 타협형이다.", "pt": "<strong>관리그리드(managerial grid) 이론</strong><br><strong>앞의 숫자가 「생산(과업)에 대한 관심」, 뒤의 숫자가 「인간에 대한 관심」</strong>이다. <strong>(9,1)은 앞이 크니 과업형, (1,9)는 뒤가 크니 인기형</strong> 이라고 새긴다.<p><strong>◈ 암기</strong> <u>앞은 생산, 뒤는 인간</u>.</p>", "law": "", "card": "card_mgt_t200"}, {"n": 8, "s": 1, "a": 1, "lv": 2, "fq": 1, "kind": "공식형", "t": "동기부여와 관련하여 다음과 같은 레윈(Lewin.K)의 법칙에서 「P」가 의미하는 것은?", "c": ["개체", "인간의 행동", "심리적 환경", "인간관계"], "cond": "B = f(P · E)", "img": "", "sol": "<strong>P는 Person(개체)</strong>다. <strong>나이 · 경험 · 성격 · 지능 · 심신 상태</strong>를 뜻한다.<div style=\"margin:12px 0 2px;font-weight:700\">레빈의 법칙 $B = f ( P \\cdot E )$</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기호</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>B</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>Behavior 행동</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">겉으로 드러나는 행동</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>f</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>function 함수</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">P와 E가 함께 정한다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>P</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>Person 개체(사람)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>나이 · 경험 · 성격 · 지능 · 심신 상태</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>E</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>Environment 환경</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>인간관계 · 작업환경 · 설비</u></td></tr></tbody></table></div>", "w": "② 인간의 행동은 B다.<br>③ 심리적 환경은 E다.<br>④ 인간관계도 E에 든다.", "pt": "<strong>레빈(Lewin)의 인간 행동 법칙</strong><br>이 식의 요지는 <strong>행동은 사람 탓만도 환경 탓만도 아니다</strong>라는 것이다. <strong>사람은 쉽게 못 바꾸지만 환경은 바꿀 수</strong> 있으므로, 안전관리는 <strong>E를 손보는 쪽</strong>으로 간다.<p><strong>◈ 암기</strong> <u>P는 개체, E는 환경</u>.</p>", "law": "", "card": "card_mgt_t131"}, {"n": 9, "s": 1, "a": 1, "lv": 2, "fq": 1, "kind": "개념형", "t": "다음 중 맥그리거(Douglas McGregor)의 X이론과 Y이론에 관한 관리 처방으로 가장 적절한 것은?", "c": ["목표에 의한 관리는 Y이론의 관리 처방에 해당된다.", "직무의 확장은 X이론의 관리 처방에 해당된다.", "상부책임제도의 강화는 Y이론의 관리 처방에 해당된다.", "분권화 및 권한의 위임은 X이론의 관리 처방에 해당된다."], "cond": "", "img": "", "sol": "<strong>목표에 의한 관리(MBO)는 Y이론</strong>의 처방이다. 나머지 셋은 X·Y가 뒤바뀌었다.<div style=\"margin:12px 0 2px;font-weight:700\">X이론과 Y이론의 관리 처방</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">X이론</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">Y이론</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">사람을 보는 눈</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>게으르고 일을 싫어한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>일을 즐기고 스스로 한다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">처방</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>권위주의적 리더십 · 경제적 보상체계의 강화 · 명령과 통제 · 상부책임제도의 강화 · 면밀한 감독</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>목표에 의한 관리(MBO) · 직무의 확장 · 분권화와 권한의 위임 · 비공식적 조직의 활용 · 자율통제</u></td></tr></tbody></table></div>", "w": "② 직무의 확장은 X이론이 아니라 Y이론의 처방이다.<br>③ 상부책임제도의 강화는 Y이론이 아니라 X이론의 처방이다.<br>④ 분권화 및 권한의 위임은 X이론이 아니라 Y이론의 처방이다.", "pt": "<strong>맥그리거(McGregor)의 X·Y 이론</strong><br><strong>X는 「몰아세운다」, Y는 「믿고 맡긴다」</strong>다. <strong>「목표 · 확장 · 분권 · 위임 · 자율」이 Y</strong>, <strong>「권위 · 명령 · 통제 · 상부책임 · 감독」이 X</strong>다.<p><strong>◈ 암기</strong> <u>목표에 의한 관리는 Y이론</u>.</p>", "law": "", "card": "card_mgt_t170"}, {"n": 10, "s": 1, "a": 3, "lv": 1, "fq": 1, "kind": "개념형", "t": "제조물책임법에 명시된 결함의 종류에 해당되지 않는 것은?", "c": ["제조상의 결함", "표시상의 결함", "사용상의 결함", "설계상의 결함"], "cond": "", "img": "", "sol": "<strong>사용상의 결함</strong>은 없다. 셋은 <strong>제조상 · 설계상 · 표시상</strong>의 결함이다.<div style=\"margin:12px 0 2px;font-weight:700\">제조물책임법의 세 가지 결함</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">결함</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제조상의 결함</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>설계대로 만들어지지 않았다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">불량품</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>설계상의 결함</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>설계 자체가 안전하지 않다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">대체설계를 하지 않았다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>표시상의 결함</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>설명·경고를 제대로 하지 않았다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>지시·경고상의 결함</u></td></tr></tbody></table></div>", "w": "① 제조상의 결함은 세 가지에 든다.<br>② 표시상의 결함도 그렇다.<br>④ 설계상의 결함도 그렇다.", "pt": "<strong>제조물책임법의 결함</strong><br>세 결함이 <strong>만들 때(제조) · 그리기 전(설계) · 알릴 때(표시)</strong> 세 단계에 하나씩 걸린다. <strong>「사용」은 쓰는 사람의 몫</strong>이라 제조자의 결함이 아니다.<p><strong>◈ 암기</strong> <u>제조 · 설계 · 표시</u> 셋.</p>", "law": "", "card": "card_mgt_t201"}, {"n": 11, "s": 1, "a": 3, "lv": 2, "fq": 1, "kind": "개념형", "t": "산업안전보건법령상 관리감독자의 업무내용에 해당되는 것은? (단, 기타 해당 작업의 안전ㆍ보건에 관한 사항으로서 고용노동부령으로 정하는 사항은 제외한다.)", "c": ["사업장 순회점검ㆍ지도 및 조치의 건의", "물질안전보건자료의 게시 및 또는 비치에 관한 보좌 및 조언ㆍ지도", "해당 작업의 작업장 정리ㆍ정돈 및 통로확보에 대한 확인ㆍ감독", "근로자의 건강장해의 원인 조사와 재발 방지를 위한 의학적 조치"], "cond": "", "img": "", "sol": "<strong>해당 작업의 작업장 정리·정돈 및 통로확보의 확인·감독</strong>이 관리감독자의 업무다.<div style=\"margin:12px 0 2px;font-weight:700\">관리감독자의 업무 (영 제15조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">업무</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>해당 작업 관련 기계·기구 또는 설비의 안전·보건 점검과 이상 유무의 확인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>소속 근로자의 작업복·보호구 및 방호장치의 점검과 그 착용·사용에 관한 교육·지도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>해당 작업에서 발생한 산업재해에 관한 보고와 응급조치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>해당 작업의 작업장 정리·정돈 및 통로확보에 대한 확인·감독</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전관리자·보건관리자 등의 지도·조언에 대한 협조</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험성평가에 관한 참여</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "w": "① 사업장 순회점검·지도 및 조치의 건의는 안전관리자·보건관리자의 업무다.<br>② 물질안전보건자료의 게시·비치에 관한 보좌 및 조언·지도는 보건관리자의 업무다.<br>④ 근로자 건강장해의 원인 조사와 의학적 조치는 산업보건의·보건관리자의 업무다.", "pt": "<strong>산업안전보건법 시행령 제15조 — 관리감독자의 업무</strong><br><strong>관리감독자는 「해당 작업」의 사람과 물건을 직접 챙긴다</strong>. <strong>「보좌 및 조언·지도」가 붙으면 안전·보건관리자</strong>, <strong>「의학적」이 붙으면 산업보건의</strong>다.<p><strong>◈ 암기</strong> <u>「해당 작업」이 붙으면 관리감독자</u>.</p>", "law": "<details class=law><summary>⚖ 근거 법령 — 산업안전보건법 시행령 제15조<span class=eff>산업안전보건법 시행령 시행 2026. 8. 1.</span></summary><div class=lawin><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EB%B2%95%EC%8B%9C%ED%96%89%EB%A0%B9/%EC%A0%9C15%EC%A1%B0\" target=\"_blank\">제15조(관리감독자의 업무 등)</a><span class=eff>산업안전보건법 시행령 · 시행 2026. 8. 1.</span></div><div class=t><div class=ln>① 법 제16조제1항에서 \"대통령령으로 정하는 업무\"란 다음 각 호의 업무를 말한다. &lt;개정 2021.11.19&gt;</div><div class=ln> 1. 사업장 내 법 제16조제1항에 따른 관리감독자(이하 \"관리감독자\"라 한다)가 지휘ㆍ감독하는 작업(이하 이 조에서 \"해당작업\"이라 한다)과 관련된 기계ㆍ기구 또는 설비의 안전ㆍ보건 점검 및 이상 유무의 확인</div><div class=ln> 2. 관리감독자에게 소속된 근로자의 작업복ㆍ보호구 및 방호장치의 점검과 그 착용ㆍ사용에 관한 교육ㆍ지도</div><div class=ln> 3. 해당작업에서 발생한 산업재해에 관한 보고 및 이에 대한 응급조치</div><div class=\"ln hit\"> 4. <mark>해당작업의 작업장 정리ㆍ정돈 및 통로 확보에 대한 확인ㆍ감독</mark><span class=here>이 문항이 묻는 자리</span></div><div class=ln> 5. 사업장의 다음 각 목의 어느 하나에 해당하는 사람의 지도ㆍ조언에 대한 협조</div><div class=ln> 가. 법 제17조제1항에 따른 안전관리자(이하 \"안전관리자\"라 한다) 또는 같은 조 제5항에 따라 안전관리자의 업무를 같은 항에 따른 안전관리전문기관(이하 \"안전관리전문기관\"이라 한다)에 위탁한 사업장의 경우에는 그 안전관리전문기관의 해당 사업장 담당자</div><div class=ln> 나. 법 제18조제1항에 따른 보건관리자(이하 \"보건관리자\"라 한다) 또는 같은 조 제5항에 따라 보건관리자의 업무를 같은 항에 따른 보건관리전문기관(이하 \"보건관리전문기관\"이라 한다)에 위탁한 사업장의 경우에는 그 보건관리전문기관의 해당 사업장 담당자</div><div class=ln> 다. 법 제19조제1항에 따른 안전보건관리담당자(이하 \"안전보건관리담당자\"라 한다) 또는 같은 조 제4항에 따라 안전보건관리담당자의 업무를 안전관리전문기관 또는 보건관리전문기관에 위탁한 사업장의 경우에는 그 안전관리전문기관 또는 보건관리전문기관의 해당 사업장 담당자</div><div class=ln> 라. 법 제22조제1항에 따른 산업보건의(이하 \"산업보건의\"라 한다)</div><div class=ln> 6. 법 제36조에 따라 실시되는 위험성평가에 관한 다음 각 목의 업무</div><div class=ln> 가. 유해ㆍ위험요인의 파악에 대한 참여</div><div class=ln> 나. 개선조치의 시행에 대한 참여</div><div class=ln> 7. 그 밖에 해당작업의 안전 및 보건에 관한 사항으로서 고용노동부령으로 정하는 사항</div><div class=ln>② 관리감독자에 대한 지원에 관하여는 제14조제2항을 준용한다. 이 경우 \"안전보건관리책임자\"는 \"관리감독자\"로, \"법 제15조제1항\"은 \"제1항\"으로 본다.</div></div></div></div></details>", "card": "card_mgt_t202"}, {"n": 12, "s": 1, "a": 1, "lv": 2, "fq": 1, "kind": "개념형", "t": "다음 중 교육훈련 방법에 있어 OJT(On the Job Training)의 특징이 아닌 것은?", "c": ["다수의 근로자들에게 조직적 훈련이 가능하다.", "개개인에게 적절한 지도 훈련이 가능하다.", "훈련 효과에 의해 상호 신뢰이해도가 높아진다.", "직장의 실정에 맞게 실제적 훈련이 가능하다."], "cond": "", "img": "", "sol": "<strong>다수를 조직적으로 훈련</strong>하는 것은 Off JT의 장점이다.<div style=\"margin:12px 0 2px;font-weight:700\">OJT와 Off JT</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">OJT (직장 안)</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">Off JT (직장 밖)</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">누가</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>직속 상사가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전문 강사가</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">장점</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>직장 실정에 맞다 · 개개인에 맞춘다 · 상호신뢰와 이해가 깊어진다 · 효과가 곧 나타난다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>훈련에만 전념 · 많은 사람을 조직적으로 · 전문가 초빙 · 특별한 교재와 설비 · 여러 직장의 교류</u></td></tr></tbody></table></div>", "w": "② 개개인에게 맞춘 지도훈련은 OJT의 특징이다.<br>③ 상호 신뢰와 이해도가 높아지는 것도 그렇다.<br>④ 직장 실정에 맞는 실제적 훈련도 그렇다.", "pt": "<strong>OJT와 Off JT</strong><br><strong>「많이 · 조직적으로 · 전문가 · 설비 · 교류」는 Off JT</strong>, <strong>「맞춤 · 즉시 · 신뢰 · 실정」은 OJT</strong>다.<p><strong>◈ 암기</strong> <u>다수를 조직적으로면 Off JT</u>.</p>", "law": "", "card": "card_mgt_t133"}, {"n": 13, "s": 1, "a": 2, "lv": 1, "fq": 1, "kind": "개념형", "t": "다음 중 교육 실시 원칙상 한 번에 하나하나씩 나누어 확실하게 이해시켜야 하는 단계는?", "c": ["도입 단계", "제시 단계", "적용 단계", "확인 단계"], "cond": "", "img": "", "sol": "<strong>제시 단계</strong>다. <strong>내용을 알려 주는 단계</strong>이므로 한 번에 하나씩 나누어 준다.<div style=\"margin:12px 0 2px;font-weight:700\">안전교육의 4단계와 실시 원칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 하나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원칙</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>도입</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>마음의 준비를 시킨다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">동기를 부여한다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>제시</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>내용을 알려 준다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>한 번에 하나씩 · 쉬운 것부터</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>적용</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>직접 해 보게 한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">되풀이한다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>확인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>익혔는지 본다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "w": "① 도입 단계는 마음의 준비를 시키는 단계다.<br>③ 적용 단계는 직접 해 보게 하는 단계다.<br>④ 확인 단계는 익혔는지 보는 단계다.", "pt": "<strong>안전교육의 4단계</strong><br><strong>「한 번에 하나씩」</strong>은 교육지도 8원칙의 하나로, <strong>내용을 전달하는 제시 단계</strong>에 해당한다. <strong>한꺼번에 여럿을 주면 아무것도 남지 않는다</strong>.<p><strong>◈ 암기</strong> <u>한 번에 하나씩은 제시 단계</u>.</p>", "law": "", "card": "card_mgt_t134"}, {"n": 14, "s": 1, "a": 3, "lv": 1, "fq": 3, "kind": "개념형", "t": "다음 중 브레인스토밍(brain-storming) 기법에 관한 설명으로 옳은 것은?", "c": ["타인의 의견에 대하여 장, 단점을 표현할 수 있다.", "발언은 순서대로 하거나, 균등한 기회를 부여한다.", "주제와 관련이 없는 사항이라도 발언을 할 수 있다.", "이미 제시된 의견과 유사한 사항은 피하여 발언한다."], "cond": "", "img": "", "sol": "<strong>주제와 관련이 없어 보여도 말할 수</strong> 있다. <strong>자유분방의 원칙</strong>이다.<div style=\"margin:12px 0 2px;font-weight:700\">브레인스토밍의 4원칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원칙</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기와의 대응</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>비판 금지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>남의 생각을 깎아내리지 않는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>①이 어긋난다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>자유 분방</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>엉뚱해도 좋다 · 누구나 말한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>②가 어긋나고 ③이 맞다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>대량 발언</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>질보다 양</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>수정 발언</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>남의 생각에 얹거나 고쳐도 좋다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>④가 어긋난다</u></td></tr></tbody></table></div>", "w": "① 장단점을 표현하는 것은 비판 금지의 원칙에 어긋난다.<br>② 순서대로 하거나 균등한 기회를 주는 것은 자유분방의 원칙에 어긋난다.<br>④ 이미 나온 의견과 비슷해도 좋다 — 오히려 얹어 발전시키라는 것이 수정 발언의 원칙이다.", "pt": "<strong>브레인스토밍의 4원칙</strong><br>네 원칙을 <strong>비 · 자 · 대 · 수</strong>로 새긴다. <strong>네 보기가 원칙 하나씩에 대응</strong>하도록 짜여 있고, <strong>셋은 어긋나게 하나만 맞게</strong> 놓았다.<p><strong>◈ 암기</strong> <u>비판 금지 · 자유 분방 · 대량 발언 · 수정 발언</u>.</p>", "law": "", "card": "card_mgt_t086"}, {"n": 15, "s": 1, "a": 4, "lv": 2, "fq": 1, "kind": "개념형", "t": "다음 중 데이비스(K. Davis)의 동기부여 이론에서 인간의 성과(human performance)를 가장 적합하게 나타낸 것은?", "c": ["지식(knowledge) × 기능(skill)", "기능(skill) × 상황(situation)", "상황(situation) × 태도(attitude)", "능력(ability) × 동기유발(motivation)"], "cond": "", "img": "", "sol": "<strong>인간의 성과 = 능력 × 동기유발</strong>이다.<div style=\"margin:12px 0 2px;font-weight:700\">데이비스의 동기부여 등식</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">등식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>능력 = 지식 × 기능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>무엇을 알고 무엇을 할 줄 아는가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>①</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>동기유발 = 상황 × 태도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어떤 처지에서 어떤 마음인가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>③</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인간의 성과 = 능력 × 동기유발</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>할 수 있음 × 하고 싶음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>④</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>경영의 성과 = 인간의 성과 × 물질적 성과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "w": "① 지식 × 기능은 능력(ability)의 식이다.<br>② 기능 × 상황이라는 등식은 없다.<br>③ 상황 × 태도는 동기유발의 식이다.", "pt": "<strong>데이비스(K. Davis)의 동기부여이론</strong><br>네 등식이 <strong>아래에서 위로 쌓인다</strong> — <strong>지식·기능 → 능력</strong>, <strong>상황·태도 → 동기유발</strong>, <strong>능력·동기유발 → 인간의 성과</strong>, <strong>인간·물질의 성과 → 경영의 성과</strong>.<p><strong>◈ 암기</strong> <u>인간의 성과 = 능력 × 동기유발</u>.</p>", "law": "", "card": "card_mgt_t148"}, {"n": 16, "s": 1, "a": 2, "lv": 2, "fq": 1, "kind": "개념형", "t": "산업안전보건법령에 따라 자율검사프로그램을 인정받기 위한 충족 요건으로 틀린 것은?", "c": ["관련 법에 따른 검사원을 고용하고 있을 것", "관련 법에 따른 검사 주기마다 검사를 할 것", "자율검사프로그램의 검사기준이 안전검사 기준에 충족할 것", "검사를 할 수 있는 장비를 갖추고 이를 유지ㆍ관리할 수 있을 것"], "cond": "", "img": "", "sol": "자율검사프로그램은 <strong>안전검사 주기의 1/2 마다</strong> 검사해야 한다. <strong>같은 주기가 아니라 두 배 자주</strong>한다.<div style=\"margin:12px 0 2px;font-weight:700\">자율검사프로그램의 인정 요건 (규칙 제132조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">요건</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>검사원을 고용하고 있을 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>검사를 할 수 있는 장비를 갖추고 유지·관리할 수 있을 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전검사 주기의 1/2에 해당하는 주기마다 검사할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>같은 주기가 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>자율검사프로그램의 검사기준이 안전검사기준을 충족할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "w": "① 검사원을 고용하고 있어야 하는 것은 맞다.<br>③ 검사기준이 안전검사기준을 충족해야 하는 것도 맞다.<br>④ 검사 장비를 갖추고 유지·관리할 수 있어야 하는 것도 맞다.", "pt": "<strong>산업안전보건법 시행규칙 제132조 — 자율검사프로그램의 인정</strong><br><strong>남의 검사를 받지 않는 대신 스스로 두 배 자주 본다</strong>는 것이 자율검사프로그램의 맞바꿈이다. <strong>인정 유효기간은 2년</strong>이다.<p><strong>◈ 암기</strong> <u>안전검사 주기의 1/2 마다</u>.</p>", "law": "<details class=law><summary>⚖ 근거 법령 — 산업안전보건법 시행규칙 제132조<span class=eff>산업안전보건법 시행규칙 시행 2026. 8. 1.</span></summary><div class=lawin><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EB%B2%95%EC%8B%9C%ED%96%89%EA%B7%9C%EC%B9%99/%EC%A0%9C132%EC%A1%B0\" target=\"_blank\">제132조(자율검사프로그램의 인정 등)</a><span class=eff>산업안전보건법 시행규칙 · 시행 2026. 8. 1.</span></div><div class=t><div class=ln>① 사업주가 법 제98조제1항에 따라 자율검사프로그램을 인정받기 위해서는 다음 각 호의 요건을 모두 충족해야 한다. 다만, 법 제98조제4항에 따른 검사기관(이하 \"자율안전검사기관\"이라 한다)에 위탁한 경우에는 제1호 및 제2호를 충족한 것으로 본다.</div><div class=ln> 1. 검사원을 고용하고 있을 것</div><div class=ln> 2. 고용노동부장관이 정하여 고시하는 바에 따라 검사를 할 수 있는 장비를 갖추고 이를 유지ㆍ관리할 수 있을 것</div><div class=\"ln hit\"> 3. 제126조에 따른 <mark>안전검사 주기의</mark> 2분의 1에 해당하는 주기(영 제78조제1항제3호의 크레인 중 건설현장 외에서 사용하는 크레인의 경우에는 6개월)마다 <mark>검사를 할 것</mark><span class=here>이 문항이 묻는 자리</span></div><div class=ln> 4. 자율검사프로그램의 검사기준이 법 제93조제1항에 따라 고용노동부장관이 정하여 고시하는 검사기준(이하 \"안전검사기준\"이라 한다)을 충족할 것</div><div class=ln>② 자율검사프로그램에는 다음 각 호의 내용이 포함되어야 한다.</div><div class=ln> 1. 안전검사대상기계등의 보유 현황</div><div class=ln> 2. 검사원 보유 현황과 검사를 할 수 있는 장비 및 장비 관리방법(자율안전검사기관에 위탁한 경우에는 위탁을 증명할 수 있는 서류를 제출한다)</div><div class=ln> 3. 안전검사대상기계등의 검사 주기 및 검사기준</div><div class=ln> 4. 향후 2년간 안전검사대상기계등의 검사수행계획</div><div class=ln> 5. 과거 2년간 자율검사프로그램 수행 실적(재신청의 경우만 해당한다)</div><div class=ln>③ 법 제98조제1항에 따라 자율검사프로그램을 인정받으려는 자는 별지 제52호서식의 자율검사프로그램 인정신청서에 제2항 각 호의 내용이 포함된 자율검사프로그램을 확인할 수 있는 서류 2부를 첨부하여 공단에 제출해야 한다.</div><div class=ln>④ 제3항에 따른 자율검사프로그램 인정신청서를 제출받은 공단은 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 다음 각 호의 어느 하나에 해당하는 서류를 확인해야 한다. 다만, 제2호의 서류에 대해서는 신청인이 확인에 동의하지 않는 경우에는 해당 서류를 첨부하도록 해야 한다. &lt;개정 2025.5.30&gt;</div><div class=ln> 1. 법인인 경우: 법인등기사항증명서</div><div class=ln> 2. 개인인 경우: 사업자등록증명</div><div class=ln>⑤ 공단은 제3항에 따라 자율검사프로그램 인정신청서를 제출받은 경우에는 15일 이내에 인정 여부를 결정한다.</div><div class=ln>⑥ 공단은 신청받은 자율검사프로그램을 인정하는 경우에는 별지 제53호서식의 자율검사프로그램 인정서에 인정증명 도장을 찍은 자율검사프로그램 1부를 첨부하여 신청자에게 발급해야 한다.</div><div class=ln>⑦ 공단은 신청받은 자율검사프로그램을 인정하지 않는 경우에는 별지 제54호서식의 자율검사프로그램 부적합 통지서에 부적합한 사유를 밝혀 신청자에게 통지해야 한다.</div></div></div></div></details>", "card": "card_mgt_t203"}, {"n": 17, "s": 1, "a": 2, "lv": 2, "fq": 1, "kind": "개념형", "t": "다음 중 버드(Bird)의 재해발생에 관한 이론에서 1단계에 해당하는 재해발생의 시작이 되는 것은?", "c": ["기본원인", "관리의 부족", "불안전한 행동과 상태", "사회적 환경과 유전적 요소"], "cond": "", "img": "", "sol": "<strong>제어(관리)의 부족</strong>이다. 버드는 <strong>모든 재해의 뿌리를 관리</strong>에서 찾았다.<div style=\"margin:12px 0 2px;font-weight:700\">하인리히와 버드의 도미노 이론</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">하인리히</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">버드</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사회적 환경과 유전적 요소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>제어(관리)의 부족</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>개인적 결함</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기본원인 — 기원</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불안전한 행동과 상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>직접원인 — 징후</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사고</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사고 — 접촉</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>5</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>재해</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>상해 — 손실</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "w": "① 기본원인은 2단계다.<br>③ 불안전한 행동과 상태는 3단계다.<br>④ 사회적 환경과 유전적 요소는 하인리히 이론의 1단계다.", "pt": "<strong>버드(Bird)의 신 도미노 이론</strong><br><strong>하인리히는 3단계(불안전한 행동과 상태)를 없애야</strong> 한다고 보았지만, <strong>버드는 1단계(관리의 부족)를 없애야</strong> 한다고 보았다. <strong>더 근본으로 거슬러 올라간</strong> 것이다.<p><strong>◈ 암기</strong> <u>버드의 1단계는 관리의 부족</u>.</p>", "law": "", "card": "card_mgt_t164"}, {"n": 18, "s": 1, "a": 2, "lv": 3, "fq": 1, "kind": "계산형", "t": "도수율이 24.5이고, 강도율이 1.15인 사업장이 있다. 이 사업장에서 한 근로자가 입사하여 퇴직할 때까지 몇 일간의 근로손실일수가 발생하겠는가?", "c": ["2.45일", "115일", "215일", "245일"], "cond": "", "img": "", "sol": "환산강도율은 $\\text{강도율} \\times \\dfrac{100 {,} 000}{10^{3}} = 1.15 \\times 100 = 115$ 일이다.<div style=\"margin:12px 0 2px;font-weight:700\">환산강도율과 환산도수율</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">환산도수율</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">환산강도율</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">무엇</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>평생 몇 번 다치나</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>평생 며칠을 잃나</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">식</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\text{도수율} \\times \\dfrac{\\text{평생근로시간}}{10^{6}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\text{강도율} \\times \\dfrac{\\text{평생근로시간}}{10^{3}}$</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>평생 10만 시간</u> (표준)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\text{도수율} \\div 10$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\text{강도율} \\times 100$</td></tr></tbody></table></div>", "w": "① 2.45일은 도수율을 10으로 나눈 값(환산도수율)이다.<br>③ 215일은 계산과 맞지 않는다.<br>④ 245일은 도수율에 10을 곱한 값이다.", "pt": "<strong>환산강도율</strong><br><strong>「며칠을 잃나」를 물었으므로 강도율</strong>을 쓴다. <strong>강도율은 천 시간 기준</strong>이므로 <strong>평생 10만 시간이면 ×100</strong>이다. <strong>도수율(24.5)은 쓰이지 않는 미끼</strong>다.<p><strong>◈ 암기</strong> <u>강도율은 ×100, 도수율은 ÷10</u>.</p>", "law": "", "card": "card_mgt_t204"}, {"n": 19, "s": 1, "a": 3, "lv": 3, "fq": 1, "kind": "계산형", "t": "1일 근무시간이 9시간이고, 지난 한 해 동안의 근무일이 300일인 A 사업장의 재해건수는 24건, 의사진단에 의한 총휴업일수는 3650일이었다. 해당 사업장의 도수율과 강도율은 얼마인가? (단, 사업장의 평균근로자수는 450명이다.)", "c": ["도수율 : 0.02, 강도율 : 2.55", "도수율 : 0.19, 강도율 : 0.25", "도수율 : 19.75, 강도율 : 2.47", "도수율 : 20.43, 강도율 : 2.55"], "cond": "", "img": "", "sol": "연근로시간은 $450 \\times 9 \\times 300 = 1 {,} 215 {,} 000$ 시간, 근로손실일수는 $3 {,} 650 \\times \\dfrac{300}{365} = 3 {,} 000$ 일이다. 도수율 $19.75$, 강도율 $2.47$이 나온다.", "w": "① 0.02와 2.55는 도수율에 10⁶ 을 곱하지 않은 값이다.<br>② 0.19와 0.25 도 자릿수가 어긋난다.<br>④ 20.43과 2.55는 휴업일수를 그대로 쓴 값에 가깝다.", "pt": "<strong>도수율과 강도율</strong><br>두 함정이 있다 — <strong>연근로시간에 「1일 시간 × 연 근무일 × 인원」을 모두 곱하는 것</strong>과, <strong>휴업일수에 300/365를 곱해 근로손실일수로 바꾸는 것</strong>이다. 둘 중 하나만 놓쳐도 다른 보기로 빠진다.<p><strong>◈ 암기</strong> <u>휴업일수 × 300/365 = 근로손실일수</u>.</p>", "law": "", "card": "card_mgt_t205"}, {"n": 20, "s": 1, "a": 2, "lv": 1, "fq": 1, "kind": "개념형", "t": "다음 중 산업 재해의 분석 및 평가를 위하여 재해발생 건수 등의 추이에 대해 한계선을 설정하여 목표 관리를 수행하는 재해통계 분석기법은?", "c": ["폴리건(polygon)", "관리도(control chart)", "파레토도(pareto diagram)", "특성요인도(cause &amp; effect diagram)"], "cond": "", "img": "", "sol": "<strong>관리도</strong>다. <strong>위아래 한계선을 그어 그 안에 드는지</strong>로 관리한다.<div style=\"margin:12px 0 2px;font-weight:700\">재해통계 분석기법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>관리도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>한계선을 긋고 추이를 본다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>목표 관리</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>파레토도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>항목별로 크기 순으로 늘어놓는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">중점 관리 대상을 찾는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>특성요인도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생선뼈 모양으로 원인을 갈래지어 그린다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">원인 분석</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>클로즈 분석</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>두 요인의 관계를 표로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>폴리건(도수분포다각형)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>도수분포를 꺾은선으로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "w": "① 폴리건은 도수분포를 꺾은선으로 나타낸 그림이다.<br>③ 파레토도는 항목을 크기 순으로 늘어놓아 중점 대상을 찾는 그림이다.<br>④ 특성요인도는 원인을 갈래지어 그린 생선뼈 그림이다.", "pt": "<strong>재해통계 분석기법</strong><br><strong>「한계선」이라는 말이 관리도</strong>를 가리킨다. 네 기법을 <strong>한계선(관리도) · 크기 순(파레토) · 생선뼈(특성요인도) · 두 요인 표(클로즈)</strong>로 갈라 잡는다.<p><strong>◈ 암기</strong> <u>한계선을 그으면 관리도</u>.</p>", "law": "", "card": "card_mgt_t017"}, {"n": 21, "s": 2, "a": 1, "lv": 1, "fq": 1, "kind": "개념형", "t": "FT 작성에 사용되는 사상 중 시스템의 정상적인 가동상태에서 일어날 것이 기대되는 사상은?", "c": ["통상사상", "기본사상", "생략사상", "결함사상"], "cond": "", "img": "", "sol": "<strong>통상사상</strong>이다. <strong>집 모양 오각형</strong>으로 그리며 <strong>늘 일어나는 정상적인 사상</strong>을 나타낸다.<div style=\"margin:12px 0 2px;font-weight:700\">FTA의 사상기호</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">모양</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>직사각형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>결함사상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">더 분석할 수 있는 사상 — 정상사상과 중간사상</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>원</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기본사상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">더 분석할 수 없는 밑바닥 사상</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>마름모</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생략사상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">자료가 모자라 더 전개하지 않는 사상</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>집 모양 오각형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>통상사상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>늘 일어나는 정상적인 사상</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>삼각형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전이기호</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">다른 곳으로 이어진다는 표시</td></tr></tbody></table></div>", "w": "② 기본사상은 더 분석할 수 없는 밑바닥 사상이다.<br>③ 생략사상은 자료가 모자라 더 전개하지 않는 사상이다.<br>④ 결함사상은 더 분석할 수 있는 사상이다.", "pt": "<strong>FTA의 통상사상</strong><br><strong>통상사상은 「고장이 아니라 정상」</strong>인 사상이다 — <strong>전원이 들어와 있다 · 밸브가 열려 있다</strong> 같은 것이다. <strong>집 모양은 「늘 그 자리에 있다」</strong>는 뜻으로 새긴다.<p><strong>◈ 암기</strong> <u>집 모양은 통상사상</u>.</p>", "law": "", "card": "card_erg_t209"}, {"n": 22, "s": 2, "a": 1, "lv": 2, "fq": 1, "kind": "개념형", "t": "다음 중 결함수분석법(FTA)에서의 미니멀 컷셋과 미니멀 패스셋에 관한 설명으로 옳은 것은?", "c": ["미니멀 컷셋은 정상사상(top event)을 일으키기 위한 최소한의 컷셋이다.", "미니멀 컷셋은 시스템의 신뢰성을 표시하는 것이다.", "미니멀 패스셋은 시스템의 위험성을 표시하는 것이다.", "미니멀 패스셋은 시스템의 고장을 발생시키는 최소의 패스셋이다."], "cond": "", "img": "", "sol": "<strong>미니멀 컷셋은 정상사상을 일으키는 최소한의 컷셋</strong>이다. 나머지 셋은 컷셋과 패스셋을 뒤바꿔 놓았다.<div style=\"margin:12px 0 2px;font-weight:700\">미니멀 컷셋과 미니멀 패스셋</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">미니멀 컷셋</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">미니멀 패스셋</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">무엇</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정상사상을 일으키는 최소한의 컷셋</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정상사상을 일으키지 않게 하는 최소한의 패스셋</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">나타내는 것</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시스템의 위험성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시스템의 신뢰성</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">쓰임</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어디를 고쳐야 하나</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어디를 지켜야 하나</u></td></tr></tbody></table></div>", "w": "② 시스템의 신뢰성을 나타내는 것은 미니멀 패스셋이다.<br>③ 시스템의 위험성을 나타내는 것은 미니멀 컷셋이다.<br>④ 패스셋은 고장을 일으키는 것이 아니라 막는 조합이다.", "pt": "<strong>미니멀 컷셋과 미니멀 패스셋</strong><br><strong>컷은 자른다(고장) → 위험성, 패스는 지나간다(정상) → 신뢰성</strong>이라는 짝을 잡아 두면 보기 셋이 한꺼번에 걸러진다.<p><strong>◈ 암기</strong> <u>컷셋은 위험성, 패스셋은 신뢰성</u>.</p>", "law": "", "card": "card_erg_t121"}, {"n": 23, "s": 2, "a": 2, "lv": 1, "fq": 1, "kind": "개념형", "t": "다음 중 각 기본사상의 발생확률이 증감하는 경우 정상사상의 발생확률에 어느 정도 영향을 미치는가를 반영하는 지표로서 수리적으로는 편미분계수와 같은 의미를 갖는 FTA의 중요도 지수는?", "c": ["구조 중요도", "확률 중요도", "치명 중요도", "비구조 중요도"], "cond": "", "img": "", "sol": "<strong>확률 중요도</strong>다. <strong>기본사상의 확률이 조금 바뀔 때 정상사상의 확률이 얼마나 바뀌는가</strong>를 나타내므로 <strong>편미분계수</strong>와 같다.<div style=\"margin:12px 0 2px;font-weight:700\">FTA의 중요도 지수</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">중요도</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>구조 중요도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>확률과 무관하게 FT의 구조만으로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">어느 자리가 중요한가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>확률 중요도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기본사상의 확률 변화가 정상사상에 미치는 영향</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>편미분계수</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>치명 중요도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기본사상의 확률을 몇 [%] 낮추면 정상사상이 몇 [%] 낮아지나</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">개선 효과의 크기</td></tr></tbody></table></div>", "w": "① 구조 중요도는 확률과 무관하게 구조만으로 따지는 지표다.<br>③ 치명 중요도는 개선 효과의 크기를 나타내는 지표다.<br>④ 「비구조 중요도」라는 지표는 없다.", "pt": "<strong>FTA의 중요도 지수</strong><br><strong>「편미분계수」</strong>라는 말이 곧 <strong>「한 값이 조금 바뀔 때 결과가 얼마나 바뀌나」</strong>다. <strong>확률의 변화를 다루므로 확률 중요도</strong>다.<p><strong>◈ 암기</strong> <u>편미분계수면 확률 중요도</u>.</p>", "law": "", "card": "card_erg_t210"}, {"n": 24, "s": 2, "a": 3, "lv": 1, "fq": 1, "kind": "개념형", "t": "조사연구자가 특정한 연구를 수행하기 위해서는 어떤 상황에서 실시할 것인가를 선택하여야 한다. 즉, 실험실 환경에서도 가능하고, 실제 현장 연구도 가능한데 다음 중 현장 연구를 수행했을 경우 장점으로 가장 적절한 것은?", "c": ["비용 절감", "정확한 자료수집 가능", "일반화가 가능", "실험조건의 조절 용이"], "cond": "", "img": "", "sol": "<strong>일반화가 가능</strong>한 것이 현장 연구의 장점이다. <strong>실제 상황에서 얻은 결과라 그대로 현장에 옮길 수</strong> 있다.<div style=\"margin:12px 0 2px;font-weight:700\">실험실 연구와 현장 연구</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">실험실 연구</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">현장 연구</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">실험조건 조절</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>쉽다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어렵다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">자료의 정확성</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>낮다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">비용</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>적다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>많다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>일반화(현실 적용)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어렵다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>쉽다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">안전성</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>낮다</u></td></tr></tbody></table></div>", "w": "① 비용 절감은 실험실 연구의 장점이다.<br>② 정확한 자료수집도 실험실 연구가 낫다.<br>④ 실험조건의 조절이 쉬운 것도 실험실 연구다.", "pt": "<strong>실험실 연구와 현장 연구</strong><br><strong>실험실은 「깨끗하지만 인위적」, 현장은 「지저분하지만 진짜」</strong>다. <strong>현장 연구의 유일하고 결정적인 장점이 「그대로 쓸 수 있다」</strong>는 것이다.<p><strong>◈ 암기</strong> <u>현장 연구는 일반화가 쉽다</u>.</p>", "law": "", "card": "card_erg_t211"}, {"n": 25, "s": 2, "a": 4, "lv": 1, "fq": 1, "kind": "개념형", "t": "다음 중 소음 발생에 있어 음원에 대한 대책으로 볼 수 없는 것은?", "c": ["설비의 격리", "적절한 재배치", "저소음 설비 사용", "귀마개 및 귀덮개 사용"], "cond": "", "img": "", "sol": "<strong>귀마개와 귀덮개</strong>는 <strong>사람 쪽의 대책(보호구)</strong>이다. 음원에 대한 대책이 아니다.<div style=\"margin:12px 0 2px;font-weight:700\">소음 대책의 세 갈래</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">어디에</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대책</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>음원</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>저소음 설비 사용 · 설비의 격리 · 적절한 재배치 · 방음커버 · 방진</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 근본적</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전파 경로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>차음벽 · 흡음재 · 거리 두기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>수음자(사람)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>귀마개 · 귀덮개 · 작업시간 단축</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>마지막 수단</u></td></tr></tbody></table></div>", "w": "① 설비의 격리는 음원에 대한 대책이다.<br>② 적절한 재배치도 그렇다.<br>③ 저소음 설비 사용도 그렇다.", "pt": "<strong>소음의 방지대책</strong><br>대책은 <strong>나는 곳(음원) → 가는 길(경로) → 듣는 사람(수음자)</strong> 순으로 손댄다. <strong>앞쪽일수록 근본적</strong>이며, <strong>보호구는 언제나 마지막</strong>이다.<p><strong>◈ 암기</strong> <u>귀마개는 사람 쪽 대책</u>.</p>", "law": "", "card": "card_erg_t083"}, {"n": 26, "s": 2, "a": 3, "lv": 3, "fq": 1, "kind": "계산형", "t": "다음 중 불(Bool) 대수의 정리를 나타낸 관계식으로 틀린 것은?", "c": ["Aㆍ0=0", "A+1=1", "AㆍA' = 1", "A(A+B)=A"], "cond": "", "img": "", "sol": "$A \\cdot A ' = 0$이다. <strong>어떤 사상과 그 여사상이 함께 일어날 수는 없다</strong>.<div style=\"margin:12px 0 2px;font-weight:700\">불 대수의 주요 정리</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">정리</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>항등법칙</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$A \\cdot 1 = A$, $A + 0 = A$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지배법칙</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$A \\cdot 0 = 0$, $A + 1 = 1$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>①·②</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>보원법칙</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$A \\cdot A ' = 0$, $A + A ' = 1$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>③은 1이라 어긋난다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>흡수법칙</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$A ( A + B ) = A$, $A + AB = A$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>④</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>동일법칙</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$A \\cdot A = A$, $A + A = A$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "w": "① $A \\cdot 0 = 0$은 지배법칙으로 맞다.<br>② $A + 1 = 1$도 그렇다.<br>④ $A ( A + B ) = A$는 흡수법칙으로 맞다.", "pt": "<strong>불 대수의 정리</strong><br><strong>보원법칙의 두 식이 짝</strong>이다 — <strong>곱하면 0(둘 다 일어날 수 없다), 더하면 1(둘 중 하나는 반드시 일어난다)</strong>. <strong>두 값을 바꿔 놓는 것</strong>이 이 유형의 함정이다.<p><strong>◈ 암기</strong> $A \\cdot A ' = 0$, $A + A ' = 1$.</p>", "law": "", "card": "card_erg_t212"}, {"n": 27, "s": 2, "a": 2, "lv": 1, "fq": 1, "kind": "개념형", "t": "다음 중 인간 오류에 관한 설계기법에 있어 전적으로 오류를 범하지 않게는 할 수 없으므로 오류를 범하기 어렵도록 사물을 설계하는 방법은?", "c": ["배타설계(exclusive design)", "예방설계(prevent design)", "최소설계(minimum design)", "감소설계(reduction design)"], "cond": "", "img": "", "sol": "<strong>예방설계</strong>다. <strong>아예 못 하게 할 수는 없으니 하기 어렵게</strong> 만든다.<div style=\"margin:12px 0 2px;font-weight:700\">인간 오류에 관한 세 가지 설계</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">설계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>배타설계(exclusive)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>오류를 범할 수 없게 원천적으로 막는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>모양이 달라 거꾸로 끼울 수 없는 플러그</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>예방설계(prevent)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>오류를 범하기 어렵게 만든다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>두 손으로 눌러야 열리는 뚜껑</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전설계(fail safe)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>오류가 나도 안전한 쪽으로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>오류를 받아들이고 대비</u></td></tr></tbody></table></div>", "w": "① 배타설계는 아예 오류를 범할 수 없게 막는 설계다.<br>③ 「최소설계」라는 갈래는 없다.<br>④ 「감소설계」도 없다.", "pt": "<strong>인간 오류에 관한 설계기법</strong><br>세 설계가 <strong>못 하게(배타) → 하기 어렵게(예방) → 해도 괜찮게(안전)</strong> 순으로 물러선다. <strong>「전적으로 막을 수 없으므로」</strong>라는 단서가 둘째 단계를 가리킨다.<p><strong>◈ 암기</strong> <u>하기 어렵게 만들면 예방설계</u>.</p>", "law": "", "card": "card_erg_t213"}, {"n": 28, "s": 2, "a": 2, "lv": 1, "fq": 1, "kind": "개념형", "t": "화학설비의 안전성 평가단계 중 「관계 자료의 작성준비」에 있어 관계 자료의 조사항목과 가장 관계가 먼 것은?", "c": ["입지에 관한 도표", "온도, 압력", "공정기기목록", "화학설비 배치도"], "cond": "", "img": "", "sol": "<strong>온도와 압력</strong>은 <strong>제3단계 정량적 평가</strong>의 항목이다. 제1단계에서 모으는 자료가 아니다.<div style=\"margin:12px 0 2px;font-weight:700\">제1단계 — 관계 자료의 작성준비</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">모아야 할 자료</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>입지조건에 관한 도표</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">땅과 둘레의 조건</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>화학설비 배치도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>건조물의 평면도·단면도·입면도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기계실·전기실 등의 배치도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>원재료·중간체·제품 등의 물리·화학적 성질과 위험성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제조공정의 개요 · 공정계통도 · 공정기기목록</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전설비의 종류와 설치 명세</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "w": "① 입지에 관한 도표는 제1단계에서 모으는 자료다.<br>③ 공정기기목록도 그렇다.<br>④ 화학설비 배치도도 그렇다.", "pt": "<strong>화학설비 안전성 평가의 6단계</strong><br><strong>제1단계는 「도면과 목록을 모으는」 단계</strong>다. <strong>온도 · 압력 · 용량 · 취급물질 · 조작</strong> 다섯은 <strong>제3단계 정량적 평가에서 점수를 매기는</strong> 항목이다.<p><strong>◈ 암기</strong> <u>온도와 압력은 정량적 평가</u>.</p>", "law": "", "card": "card_erg_t214"}, {"n": 29, "s": 2, "a": 3, "lv": 2, "fq": 1, "kind": "공식형", "t": "다음 중 신호검출이론(SDT)에서 두 정규분포 곡선이 교차하는 부분에 판별기준이 놓였을 경우 Beta 값으로 옳은 것은?", "c": ["Beta = 0", "Beta &lt; 1", "Beta = 1", "Beta &gt; 1"], "cond": "", "img": "", "sol": "<strong>β = 1</strong>이다. <strong>두 곡선이 만나는 점에서는 신호와 잡음의 확률밀도가 같기</strong> 때문이다.<div style=\"margin:12px 0 2px;font-weight:700\">신호검출이론의 반응기준 β</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">β</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">판별기준의 위치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">반응 경향</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>β = 1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>두 곡선이 교차하는 점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>중립</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>β &lt; 1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>교차점보다 왼쪽</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>허위경보(false alarm)가 는다</u> — 자유로운 반응</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>β &gt; 1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>교차점보다 오른쪽</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>신호 검출 실패(miss)가 는다</u> — 보수적 반응</td></tr></tbody></table></div>", "w": "① β = 0이 되는 위치는 없다.<br>② β &lt; 1은 교차점보다 왼쪽에 기준이 있을 때다.<br>④ β &gt; 1은 교차점보다 오른쪽에 있을 때다.", "pt": "<strong>신호검출이론(SDT)의 반응기준</strong><br>$\\beta = \\dfrac{\\text{신호의 확률밀도}}{\\text{잡음의 확률밀도}}$다. <strong>두 곡선이 만나면 분자와 분모가 같아 1</strong>이 된다. <strong>네 결과(적중 · 허위경보 · 검출실패 · 정기각)</strong>도 함께 잡아 둔다.<p><strong>◈ 암기</strong> <u>교차점이면 β = 1</u>.</p>", "law": "", "card": "card_erg_t215"}, {"n": 30, "s": 2, "a": 1, "lv": 2, "fq": 1, "kind": "개념형", "t": "다음 중 설비보전의 조직 형태에서 집중보전(Central Maintenance)의 장점이 아닌 것은?", "c": ["보전요원은 각 현장에 배치되어 있어 재빠르게 작업할 수 있다.", "전 공장에 대한 판단으로 중점보전이 수행될 수 있다.", "분업/전문화가 진행되어 전문적으로서 고도의 기술을 갖게 된다.", "직종 간의 연락이 좋고, 공사 관리가 쉽다."], "cond": "", "img": "", "sol": "<strong>보전요원이 각 현장에 배치되는</strong> 것은 <strong>부문보전(지역보전)</strong>의 특징이다. 집중보전은 <strong>한곳에 모여</strong> 있다.<div style=\"margin:12px 0 2px;font-weight:700\">보전조직의 형태</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">형태</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">특징</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>집중보전</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>보전요원이 한 부서에 모여 있다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전문화 · 중점보전 · 공사관리가 쉽다</u> / 현장 출동이 늦다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>부문보전</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>보전요원이 각 부서에 소속</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>현장에 빠르다</u> / 전문화가 어렵다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지역보전</u></td><td style=\"border:1
