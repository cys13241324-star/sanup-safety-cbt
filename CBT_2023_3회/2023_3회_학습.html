argin:12px 0 2px;font-weight:700\">압축강도의 셈</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">셈</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>① 단면적</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$A = \\dfrac{\\pi d^{2}}{4} = \\pi \\times 75^{2} = 17 {,} 671$ [mm²]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>반지름 75 [mm]</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>② 하중</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>460 [kN] = 460,000 [N]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>③ 강도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$f = \\dfrac{P}{A} = 26$ [MPa]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 [MPa] = 1 [N/mm²]</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>높이 30 [cm]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>셈에 쓰이지 않는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">공시체 규격일 뿐</td></tr></tbody></table></div>", "w": "① 16.2 [MPa]는 계산과 맞지 않는다.<br>② 21.5 [MPa] 도 그렇다.<br>④ 31.2 [MPa] 도 그렇다.", "pt": "<strong>콘크리트의 압축강도</strong><br><strong>1 [MPa] = 1 [N/mm²]</strong>이라는 관계를 쓰면 <strong>N과 mm로 통일하는 순간 답이 바로 MPa</strong>로 나온다. <strong>높이 30 [cm]는 공시체 규격(지름의 2배)일 뿐 셈에 들어가지 않는다</strong>.<p><strong>◈ 암기</strong> $f = P / A$, 1 [MPa] = 1 [N/mm²].</p>", "law": "", "card": "card_con_t190"}, {"n": 115, "s": 6, "a": 3, "lv": 2, "fq": 1, "kind": "개념형", "t": "히빙(heaving)현상에 대한 안전대책이 아닌 것은?", "c": ["굴착주변을 웰 포인트(well point)공법과 병행한다.", "시트파일(sheet pile) 등의 근입심도를 검토한다.", "굴착저면에 토사 등 인공중력을 감소시킨다.", "굴착배면의 상재하중을 제거하여 토압을 최대한 낮춘다."], "cond": "", "img": "", "sol": "굴착저면의 <strong>인공중력은 늘려야</strong> 한다. <strong>솟아오르려는 흙을 눌러</strong> 주는 것이다.<div style=\"margin:12px 0 2px;font-weight:700\">히빙(heaving)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무엇</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>연약한 점토지반에서 배면 흙의 무게로 굴착저면이 부풀어 오르는 현상</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>굴착배면의 상재하중을 없앤다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">미는 힘을 줄인다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>굴착저면에 인공중력을 늘린다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「감소」가 아니다</u> — 눌러 준다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>흙막이벽의 근입심도를 깊게 한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">단단한 지반까지</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>웰포인트 공법으로 지하수위를 낮춘다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지반을 개량한다 · 부분굴착으로 나누어 판다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "w": "① 웰포인트 공법을 병행하는 것은 히빙 대책이다.<br>② 시트파일의 근입심도를 검토하는 것도 그렇다.<br>④ 굴착배면의 상재하중을 없애는 것도 그렇다.", "pt": "<strong>히빙 현상</strong><br><strong>히빙은 「배면이 눌러 저면이 솟는」</strong> 것이다 — <strong>미는 쪽(배면 하중)은 덜고 솟는 쪽(저면)은 눌러야</strong> 한다. <strong>「감소시킨다」와 「증가시킨다」를 바꿔 놓는 것</strong>이 이 유형의 함정이다.<p><strong>◈ 암기</strong> <u>저면은 누르고 배면은 던다</u>.</p>", "law": "", "card": "card_con_t191"}, {"n": 116, "s": 6, "a": 3, "lv": 1, "fq": 1, "kind": "개념형", "t": "건설공사 시공단계에 있어서 안전관리의 문제점에 해당되는 것은?", "c": ["발주자의 조사, 설계 발주능력 미흡", "용역자의 조사, 설계능력 부실", "발주자의 감독 소홀", "사용자의 시설 운영관리 능력 부족"], "cond": "", "img": "", "sol": "<strong>발주자의 감독 소홀</strong>이다. <strong>짓는 동안</strong>의 문제다.<div style=\"margin:12px 0 2px;font-weight:700\">건설공사 단계별 안전관리의 문제점</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">문제점</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>계획단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>발주자의 조사·설계 발주능력 미흡</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>설계단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>용역자의 조사·설계능력 부실</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>시공단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>발주자의 감독 소홀 · 시공자의 안전관리 미흡</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>유지관리단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사용자의 시설 운영관리 능력 부족</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "w": "① 발주자의 조사·설계 발주능력 미흡은 계획단계의 문제다.<br>② 용역자의 조사·설계능력 부실은 설계단계의 문제다.<br>④ 사용자의 시설 운영관리 능력 부족은 유지관리단계의 문제다.", "pt": "<strong>건설공사의 단계별 안전관리</strong><br><strong>네 보기가 계획 · 설계 · 시공 · 유지관리 네 단계에 하나씩</strong> 놓여 있다. <strong>「짓는 동안 누가 무엇을 못했나」</strong>를 묻는 것이므로 <strong>감독</strong>이 답이다.<p><strong>◈ 암기</strong> <u>시공단계는 감독 소홀</u>.</p>", "law": "", "card": "card_con_t192"}, {"n": 117, "s": 6, "a": 3, "lv": 2, "fq": 1, "kind": "개념형", "t": "건축물의 해체공사에 대한 설명으로 틀린 것은?", "c": ["압쇄기와 대형 브레이커(Breaker)는 파워쇼벨 등에 설치하여 사용한다.", "철제 햄머(Hammer)는 크레인 등에 설치하여 사용한다.", "핸드 브레이커(Hand breaker) 사용 시 수직보다는 경사를 주어 파쇄하는 것이 좋다.", "전단톱의 회전날에는 접촉방지 커버를 설치하여야 한다."], "cond": "", "img": "", "sol": "핸드 브레이커는 <strong>수직으로</strong> 세워 써야 한다. <strong>기울이면 정이 미끄러져 튄다</strong>.<div style=\"margin:12px 0 2px;font-weight:700\">해체용 기구</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기구</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">설치·사용</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>압쇄기 · 대형 브레이커</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>파워쇼벨 등에 붙여 쓴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>철제 해머</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>크레인 등에 매달아 쓴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>핸드 브레이커</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수직으로 세워 쓴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「경사를 주어」가 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전단톱</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>회전날에 접촉방지 커버</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>팽창제 · 화약</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>무진동·무소음 공법</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "w": "① 압쇄기와 대형 브레이커를 파워쇼벨에 붙여 쓰는 것은 맞다.<br>② 철제 해머를 크레인에 매달아 쓰는 것도 맞다.<br>④ 전단톱 회전날에 접촉방지 커버를 다는 것도 맞다.", "pt": "<strong>해체공사용 기구</strong><br><strong>타격은 힘이 한 점에 곧게 실려야</strong> 부서진다 — <strong>기울이면 힘이 옆으로 흘러 정이 미끄러지고 반동이 온다</strong>. <strong>사람이 손으로 잡는 기구일수록 자세가 안전을 가른다</strong>.<p><strong>◈ 암기</strong> <u>핸드 브레이커는 수직으로</u>.</p>", "law": "", "card": "card_con_t193"}, {"n": 118, "s": 6, "a": 3, "lv": 2, "fq": 1, "kind": "개념형", "t": "강풍 시 타워크레인의 운전작업을 중지해야 하는 순간풍속기준은?", "c": ["순간풍속이 초당 5m 초과", "순간풍속이 초당 10m 초과", "순간풍속이 초당 15m 초과", "순간풍속이 초당 20m 초과"], "cond": "", "img": "", "sol": "<strong>순간풍속 초당 15 [m] 초과</strong>면 운전작업을 멈춘다.<div style=\"margin:12px 0 2px;font-weight:700\">순간풍속에 따른 작업중지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">순간풍속</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>초당 10 [m] 초과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>타워크레인의 설치·수리·점검·해체 중지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>초당 15 [m] 초과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>타워크레인의 운전작업 중지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>초당 30 [m] 초과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>옥외 양중기의 이상 유무 점검</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">작업 재개 전</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>초당 35 [m] 초과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>건설용 리프트·승강기 붕괴 방지 조치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "w": "① 초당 5 [m]는 기준에 없다.<br>② 초당 10 [m] 초과는 설치·수리·점검·해체를 멈추는 기준이다.<br>④ 초당 20 [m]는 기준에 없다.", "pt": "<strong>강풍 시 작업중지 기준</strong><br><strong>숫자가 「10 · 15 · 30 · 35」</strong>다 — <strong>올라가서 하는 일(설치·해체)이 가장 낮은 10, 앉아서 하는 운전이 15</strong>다. <strong>30과 35는 지나간 뒤의 점검과 붕괴 방지</strong>다.<p><strong>◈ 암기</strong> <u>운전중지는 15 [m/s] 초과</u>.</p><p><strong>⚠ 주의사항</strong> 타워크레인 운전작업 중지 기준은 <u>2017.3.3 개정</u>으로 순간풍속 <u>초당 15 [m] 초과</u>로 정해졌다.</p>", "law": "", "card": "card_con_t194"}, {"n": 119, "s": 6, "a": 3, "lv": 1, "fq": 1, "kind": "개념형", "t": "흙막이 지보공을 설치하였을 경우 정기적으로 점검해야 하는 사항과 가장 거리가 먼 것은?", "c": ["부재의 접속부ㆍ부착부 및 교차부의 상태", "버팀대의 긴압(緊壓)의 정도", "지표수의 흐름 상태", "부재의 손상ㆍ변형ㆍ부식ㆍ변위 및 탈락의 유무와 상태"], "cond": "", "img": "", "sol": "<strong>지표수의 흐름 상태</strong>는 점검사항에 없다.<div style=\"margin:12px 0 2px;font-weight:700\">흙막이 지보공의 정기점검 사항</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">점검사항</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>부재의 손상·변형·부식·변위 및 탈락의 유무와 상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>버팀대의 긴압의 정도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>부재의 접속부·부착부 및 교차부의 상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>침하의 정도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지표수의 흐름 상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>점검사항이 아니다</u></td></tr></tbody></table></div>", "w": "① 부재의 접속부·부착부 및 교차부의 상태는 점검사항이다.<br>② 버팀대의 긴압 정도도 그렇다.<br>④ 부재의 손상·변형·부식·변위 및 탈락의 유무와 상태도 그렇다.", "pt": "<strong>흙막이 지보공의 점검</strong><br><strong>네 항목이 「부재 자체 · 조인 정도 · 이음매 · 가라앉음」</strong>이다. <strong>흙막이는 「침하의 정도」가 들어가고 터널 지보공은 「기둥침하의 유무와 상태」</strong>로 이름만 다르다.<p><strong>◈ 암기</strong> <u>흙막이는 침하의 정도까지</u>.</p>", "law": "", "card": "card_con_t195"}, {"n": 120, "s": 6, "a": 4, "lv": 1, "fq": 2, "kind": "개념형", "t": "터널 지보공을 설치한 때 수시 점검하여 이상을 발견 시 즉시 보강하거나 보수해야 할 사항이 아닌 것은?", "c": ["부재의 손상ㆍ변형ㆍ부식ㆍ변위ㆍ탈락의 유무 및 상태", "부재의 긴압의 정도", "부재의 접속부 및 교차부의 상태", "계측기 설치상태"], "cond": "", "img": "", "sol": "<strong>계측기 설치상태</strong>는 수시 점검사항에 없다.<div style=\"margin:12px 0 2px;font-weight:700\">터널 지보공의 수시점검 사항</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">점검사항</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>부재의 손상·변형·부식·변위·탈락의 유무 및 상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>부재의 긴압의 정도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>부재의 접속부 및 교차부의 상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기둥침하의 유무 및 상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>계측기 설치상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>점검사항이 아니다</u></td></tr></tbody></table></div>", "w": "① 부재의 손상·변형·부식·변위·탈락의 유무 및 상태는 점검사항이다.<br>② 부재의 긴압 정도도 그렇다.<br>③ 부재의 접속부 및 교차부의 상태도 그렇다.", "pt": "<strong>터널 지보공의 점검</strong><br><strong>흙막이 지보공과 세 항목이 같고 마지막 하나만 「침하의 정도」 대신 「기둥침하의 유무 및 상태」</strong>다. <strong>둘을 나란히 놓고 외우면 두 문항을 한꺼번에</strong> 잡는다.<p><strong>◈ 암기</strong> <u>터널은 기둥침하까지</u>.</p>", "law": "", "card": "card_con_t196"}], "cards": {"card_mgt_t123": {"kind": "단답형", "fq": 3, "subject": "안전관리론", "chapter": "안전보건관리 체제", "mid": "교육대상별 교육내용", "front": "교육대상별 교육내용은?", "back": "<ul><li><strong>작업공정의 유해·위험과 재해 예방대책</strong>은 <strong>관리감독자</strong> 정기교육의 내용이다. 근로자 정기교육에는 들어가지 않는다.</li><li><strong>산업재해보상보험 제도</strong>는 <strong>근로자 채용 시·작업내용 변경 시 교육</strong>의 내용이다. 관리감독자 정기교육에는 없다.</li><li><strong>유해·위험 작업환경 관리</strong>는 <strong>정기교육</strong>의 내용이다. 채용 시 교육에는 없다.</li></ul><p><strong>◈ 암기</strong> <u>「작업공정」과 「지도」는 관리감독자</u>. · <u>산재보험 제도는 채용 시 교육</u>.</p><p><strong>근로자는 「내 몸과 내 일자리」, 관리감독자는 「내가 이끄는 사람과 공정」</strong>을 배운다. <strong>「지도」·「역할과 임무」·「작업공정」</strong>이 붙으면 관리감독자 쪽이다.<br><strong>「산재보험 제도」</strong>는 <strong>처음 들어온 사람에게 알려 주는 제도 안내</strong>다. 정기교육은 <strong>일하면서 되풀이해 익힐 것</strong>을 다룬다는 점에서 결이 다르다.</p><div style=\"margin:12px 0 2px;font-weight:700\">정기교육 — 근로자와 관리감독자</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">근로자 정기교육</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">관리감독자 정기교육</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>산업안전 및 사고 예방</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작업공정의 유해·위험과 재해 예방대책</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>산업보건 및 직업병 예방</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>표준안전작업방법 및 지도 요령</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>건강증진 및 질병 예방</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>관리감독자의 역할과 임무</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>유해·위험 작업환경 관리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>유해·위험 작업환경 관리</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험성 평가에 관한 사항</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위험성 평가에 관한 사항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>직무스트레스 예방 및 관리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>현장근로자와의 의사소통능력 및 강의능력 등</u></td></tr></tbody></table></div><p><em>근거 — 산업안전보건법 시행규칙 별표5</em></p>", "nq": 7}, "card_mgt_t198": {"kind": "단답형", "fq": 1, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "산업재해 통계의 활용", "front": "산업재해 통계의 활용은?", "back": "<strong>관리자 수준 향상</strong>은 재해통계의 용도가 아니다. <strong>통계는 사람이 아니라 제도와 설비를 고치는 데</strong> 쓴다.<p><strong>◈ 암기</strong> <u>통계는 제도를 고치는 데 쓴다</u>.</p><p>통계의 쓰임은 <strong>「어디가 잘못됐는지 찾아 고친다」</strong>는 한 가지다. <strong>「관리자 평가」·「인책」</strong>처럼 사람을 향하면 통계가 감춰져 오히려 쓸모없어진다.</p>", "nq": 1}, "card_mgt_t053": {"kind": "단답형", "fq": 2, "subject": "안전관리론", "chapter": "안전보건교육", "mid": "안전교육의 3단계", "front": "안전교육의 3단계는?", "back": "<ul><li><strong>태도교육</strong>이다. 안전보호구 착용, 작업 전후 점검, 안전수칙 준수처럼 <strong>몸에 밴 습관</strong>을 만드는 것이 태도교육이다.</li><li><strong>기능교육</strong>이다. <strong>되풀이해 몸에 익히는 것</strong>이라 남이 대신 해 줄 수 없다.</li><li><strong>기능교육</strong>이다. <strong>스스로 해 보며 몸에 익히는</strong> 단계다.</li></ul><p><strong>◈ 암기</strong> <u>알고(지식) · 할 수 있고(기능) · 하게 된다(태도)</u>. · <u>되풀이해 몸에 배면 기능교육</u>.</p><p>태도교육의 4단계는 <strong>청취 → 이해·납득 → 모범 → 평가와 권장</strong>이다. <strong>아는 것과 하는 것은 다르다</strong>는 것이 태도교육이 따로 있는 까닭이다.<br><strong>지식은 알게, 기능은 할 수 있게, 태도는 하게</strong> 만든다. <strong>「반복」과 「시행착오」</strong>가 나오면 기능교육이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">안전교육의 3단계</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">어떻게</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제1단계 지식교육</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>알게 한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">강의 · 시청각 — 안전의식, 법규, 재해 사례</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제2단계 기능교육</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>할 수 있게 한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">시범 · 실습 — 반복 훈련이 핵심</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제3단계 태도교육</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>하도록 만든다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>보호구 착용 · 점검 · 수칙 준수</u> — 습관화</td></tr></tbody></table></div>", "nq": 7}, "card_mgt_t005": {"kind": "단답형", "fq": 3, "subject": "안전관리론", "chapter": "무재해운동", "mid": "위험예지훈련 4라운드", "front": "위험예지훈련 4라운드는?", "back": "<ul><li>4라운드의 마지막은 <strong>목표설정</strong>이다. 위험예지훈련은 사고가 난 뒤 원인을 캐는 활동이 아니라, 작업 전에 위험을 짚고 <strong>오늘 지킬 것 하나</strong>를 정하는 활동이다. 원인을 캐는 것은 재해조사다.</li><li><strong>현상파악 → 본질추구 → 대책수립 → 목표설정</strong>이다. 무엇이 위험한지 꺼내고, 그중 핵심을 고르고, 대책을 내고, 오늘 지킬 것 하나를 정한다.</li><li><strong>「안전평가」</strong>라는 라운드는 없다. 넷은 <strong>현상파악 · 본질추구 · 대책수립 · 행동목표 설정</strong>이다.</li></ul><p><strong>◈ 암기</strong> 「<u>현 · 본 · 대 · 목</u>」. · <u>현상파악 · 본질추구 · 대책수립 · 행동목표</u>.</p><p>4R 뒤에 <strong>터치 앤드 콜</strong>로 다짐하며 마무리한다.<br>흐름은 <strong>보고 → 캐고 → 세우고 → 다짐한다</strong>다. 마지막 4R에서 <strong>「~를 하자, 좋아!」라고 소리쳐 확인</strong>하는 것이 이 훈련의 특징이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">위험예지훈련 4라운드</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">라운드</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 하나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">묻는 말</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1R</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>현상파악</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어떤 위험이 있나</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">「어떤 위험이 숨어 있는가?」</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2R</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>본질추구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>무엇이 진짜 문제인가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">「이것이 위험의 요점이다」</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3R</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>대책수립</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어떻게 할 것인가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">「당신이라면 어떻게 하겠는가?」</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4R</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>행동목표 설정</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>무엇을 지킬 것인가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">「우리는 이렇게 한다」</td></tr></tbody></table></div>", "nq": 6}, "card_mgt_t199": {"kind": "공식형", "fq": 1, "subject": "안전관리론", "chapter": "보호구", "mid": "안전모의 내수성 시험", "front": "안전모의 내수성 시험의 식은?", "back": "$\\text{질량증가율} = \\dfrac{410 - 400}{400} \\times 100 = 2.5$ [%]다. <strong>기준은 1 [%] 미만</strong>이므로 <strong>불합격</strong>이다.<p><strong>◈ 암기</strong> <u>질량 증가율 1 [%] 미만</u>.</p><p><strong>「증가율」은 늘어난 몫을 처음 값으로 나눈 것</strong>이다. <strong>410 ÷ 400 = 102.5 [%]</strong>는 「담근 뒤가 처음의 몇 [%]인가」이지 증가율이 아니다.</p><div style=\"margin:12px 0 2px;font-weight:700\">안전모의 내수성 시험</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">내용</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>대상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>AE · ABE종</u> (내전압성이 있는 것)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>방법</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>20 ~ 25 [℃] 물에 24시간 담근다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{담근 뒤 질량} - \\text{담그기 전 질량}}{\\text{담그기 전 질량}} \\times 100$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기준</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 [%] 미만</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>2.5 [%]는 불합격</u></td></tr></tbody></table></div><p><em>근거 — 보호구 안전인증 고시</em></p>", "nq": 1}, "card_mgt_t200": {"kind": "용어형", "fq": 1, "subject": "안전관리론", "chapter": "산업심리", "mid": "관리그리드(managerial grid) 이론", "front": "관리그리드(managerial grid) 이론이란?", "back": "<strong>(1,1)형은 무관심형</strong>이 맞다. 나머지 셋은 짝이 어긋난다.<p><strong>◈ 암기</strong> <u>앞은 생산, 뒤는 인간</u>.</p><p><strong>앞의 숫자가 「생산(과업)에 대한 관심」, 뒤의 숫자가 「인간에 대한 관심」</strong>이다. <strong>(9,1)은 앞이 크니 과업형, (1,9)는 뒤가 크니 인기형</strong> 이라고 새긴다.</p><div style=\"margin:12px 0 2px;font-weight:700\">블레이크와 머튼의 관리그리드</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">좌표</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">유형</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>(1, 1)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>무관심형(impoverished)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생산도 사람도 관심 없다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>(1, 9)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>인기형(country club)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사람에만 관심</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>(9, 1)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>과업형(task)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생산에만 관심</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>(5, 5)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>타협형(middle of the road)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>적당히 절충</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>(9, 9)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이상형(team)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생산과 사람 모두 높다</u></td></tr></tbody></table></div>", "nq": 1}, "card_mgt_t131": {"kind": "공식형", "fq": 1, "subject": "안전관리론", "chapter": "산업심리", "mid": "레빈(Lewin)의 인간 행동 법칙", "front": "레빈(Lewin)의 인간 행동 법칙의 식은?", "back": "<ul><li>$B = f ( P \\cdot E )$에서 <strong>P는 person</strong>이다. <strong>나이 · 경험 · 성격 · 지능 · 심신 상태</strong>를 뜻한다.</li><li>$B = f ( P \\cdot E )$다. <strong>행동은 사람과 환경의 함수</strong>라는 뜻이다.</li><li><strong>P는 Person(개체)</strong>다. <strong>나이 · 경험 · 성격 · 지능 · 심신 상태</strong>를 뜻한다.</li></ul><p><strong>◈ 암기</strong> <u>P는 사람, E는 환경</u>. · $B = f ( P \\cdot E )$.</p><p>이 식의 요지는 <strong>행동은 사람 탓만도 환경 탓만도 아니다</strong>라는 것이다. <strong>사람은 쉽게 못 바꾸지만 환경은 바꿀 수</strong> 있으므로, 안전관리는 <strong>E를 손보는 쪽</strong>으로 간다.<br><strong>「행동(B)이 맨 앞에 오고, 괄호 안에 사람(P)과 환경(E)이 곱해져 있는」 것</strong> 하나만 찾으면 된다. <strong>사람은 쉽게 못 바꾸지만 환경은 바꿀 수</strong> 있으므로 안전관리는 E를 손본다.</p><div style=\"margin:12px 0 2px;font-weight:700\">레빈의 법칙 $B = f ( P \\cdot E )$</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기호</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>B</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>Behavior 행동</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">겉으로 드러나는 행동</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>f</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>function 함수</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">P와 E가 함께 정한다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>P</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>Person 사람</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>나이 · 경험 · 성격 · 지능 · 심신 상태</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>E</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>Environment 환경</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>인간관계 · 작업환경 · 설비</u></td></tr></tbody></table></div>", "nq": 3}, "card_mgt_t170": {"kind": "용어형", "fq": 1, "subject": "안전관리론", "chapter": "산업심리", "mid": "맥그리거(McGregor)의 X·Y 이론", "front": "맥그리거(McGregor)의 X·Y 이론이란?", "back": "<ul><li><strong>권위주의적 리더십</strong>은 <strong>X이론</strong>의 관리방식이다.</li><li><strong>목표에 의한 관리(MBO)는 Y이론</strong>의 처방이다. 나머지 셋은 X·Y가 뒤바뀌었다.</li></ul><p><strong>◈ 암기</strong> <u>권위주의는 X이론</u>. · <u>목표에 의한 관리는 Y이론</u>.</p><p><strong>X는 「몰아세운다」, Y는 「믿고 맡긴다」</strong>다. <strong>「권위 · 명령 · 통제 · 벌」이 X</strong>, <strong>「자율 · 참여 · 확장 · 성취」가 Y</strong>다.<br><strong>X는 「몰아세운다」, Y는 「믿고 맡긴다」</strong>다. <strong>「목표 · 확장 · 분권 · 위임 · 자율」이 Y</strong>, <strong>「권위 · 명령 · 통제 · 상부책임 · 감독」이 X</strong>다.</p><div style=\"margin:12px 0 2px;font-weight:700\">맥그리거의 X이론과 Y이론</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">X이론</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">Y이론</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">사람을 보는 눈</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>게으르고 일을 싫어한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>일을 즐기고 스스로 한다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">동기</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>돈과 벌</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>성취와 자아실현</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">관리방식</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>권위주의적 리더십 · 명령과 통제 · 상부책임제</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>민주적 adding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>적용(application)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>직접 해 보게 한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">10분</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>확인(test)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>익혔는지 본다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">5분</td></tr></tbody></table></div>", "nq": 4}, "card_mgt_t086": {"kind": "단답형", "fq": 3, "subject": "안전관리론", "chapter": "무재해운동", "mid": "브레인스토밍의 4원칙", "front": "브레인스토밍의 4원칙은?", "back": "<ul><li><strong>자유분방 · 비판금지 · 대량발언 · 수정발언</strong>이다. <strong>「비판자유」와 「소량발언」이 들어간 보기는 모두 오답</strong>이다.</li><li><strong>수정발언</strong>이 4원칙의 하나다. 남의 의견에 덧붙이고 고쳐 말할 수 있다.</li><li><strong>누구나 자유롭게 말할 수</strong> 있어야 한다. <strong>지정된 사람만 발언</strong>하는 것은 자유분방의 원칙에 어긋난다.</li></ul><p><strong>◈ 암기</strong> <u>비판은 금지, 발언은 대량</u>. · <u>비판금지 · 자유분방 · 대량발언 · 수정발언</u>.</p><p>틀린 보기를 거르는 요령 — <strong>「비판」이 허용되거나 「소량」이라는 말이 보이면 그 자리에서 탈락</strong>이다. 이것만으로 셋이 걸러진다.<br>네 보기가 <strong>4원칙 하나씩에 정확히 대응</strong>한다. 세 개는 원칙을 뒤집어 놓았고 하나만 그대로다.</p><div style=\"margin:12px 0 2px;font-weight:700\">브레인스토밍의 4원칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원칙</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기와의 대응</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>비판금지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">좋고 나쁨을 <u>평가하지 않는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>②가 어긋난다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>자유분방</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>주제에서 벗어나도 좋다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>①이 어긋난다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>대량발언</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>양을 많이</u> — 횟수를 나누지 않는다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>③이 어긋난다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>수정발언</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>남의 의견을 고치고 덧붙여도 좋다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>④가 맞다</u></td></tr></tbody></table></div>", "nq": 6}, "card_mgt_t148": {"kind": "용어형", "fq": 1, "subject": "안전관리론", "chapter": "안전보건교육", "mid": "데이비스(K. Davis)의 동기부여이론", "front": "데이비스(K. Davis)의 동기부여이론이란?", "back": "<ul><li><strong>동기유발 = 상황 × 태도</strong>다.</li><li><strong>능력 × 동기유발 = 인간의 성과</strong>다.</li><li><strong>인간의 성과 = 능력 × 동기유발</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>능력은 지식×기능, 동기는 상황×태도</u>. · <u>능력 × 동기유발 = 인간의 성과</u>.</p><p><strong>네 낱말이 두 짝으로 나뉜다</strong> — <strong>능력은 「지식 × 기능」, 동기유발은 「상황 × 태도」</strong>. <strong>앞은 머리와 손, 뒤는 환경과 마음</strong>이라는 대비로 잡아 둔다.<br>네 등식이 <strong>아래에서 위로 쌓인다</strong> — <strong>지식·기능 → 능력</strong>, <strong>상황·태도 → 동기유발</strong>, <strong>능력·동기유발 → 인간의 성과</strong>, <strong>인간·물질의 성과 → 경영의 성과</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">데이비스의 동기부여 등식</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">등식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인간의 성과 × 물질적 성과 = 경영의 성과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>능력(ability) = 지식 × 기능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>무엇을 알고 무엇을 할 줄 아는가</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>동기유발(motivation) = 상황 × 태도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어떤 처지에서 어떤 마음인가</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인간의 성과 = 능력 × 동기유발</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>할 수 있음 × 하고 싶음</u></td></tr></tbody></table></div>", "nq": 3}, "card_mgt_t203": {"kind": "단답형", "fq": 1, "subject": "안전관리론", "chapter": "안전점검·인증", "mid": "자율검사프로그램의 인정", "front": "자율검사프로그램의 인정은?", "back": "자율검사프로그램은 <strong>안전검사 주기의 1/2 마다</strong> 검사해야 한다. <strong>같은 주기가 아니라 두 배 자주</strong>한다.<p><strong>◈ 암기</strong> <u>안전검사 주기의 1/2 마다</u>.</p><p><strong>남의 검사를 받지 않는 대신 스스로 두 배 자주 본다</strong>는 것이 자율검사프로그램의 맞바꿈이다. <strong>인정 유효기간은 2년</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">자율검사프로그램의 인정 요건 (규칙 제132조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">요건</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>검사원을 고용하고 있을 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>검사를 할 수 있는 장비를 갖추고 유지·관리할 수 있을 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전검사 주기의 1/2에 해당하는 주기마다 검사할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>같은 주기가 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>자율검사프로그램의 검사기준이 안전검사기준을 충족할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 산업안전보건법 시행규칙 제132조</em></p>", "nq": 1}, "card_mgt_t164": {"kind": "용어형", "fq": 1, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "버드(Bird)의 신 도미노 이론", "front": "버드(Bird)의 신 도미노 이론이란?", "back": "<ul><li><strong>3단계</strong>다. <strong>직접원인(징후)</strong>이 여기에 놓인다.</li><li><strong>제어(관리)의 부족</strong>이다. 버드는 <strong>모든 재해의 뿌리를 관리</strong>에서 찾았다.</li></ul><p><strong>◈ 암기</strong> <u>직접원인은 3단계</u>. · <u>버드의 1단계는 관리의 부족</u>.</p><p><strong>직접원인이 3단계에 놓이는 것은 하인리히와 같다</strong>. 다만 버드는 <strong>1단계를 「관리의 부족」</strong>으로 바꿔, <strong>없애야 할 도미노가 3단계가 아니라 1단계</strong> 라고 보았다.<br><strong>하인리히는 3단계(불안전한 행동과 상태)를 없애야</strong> 한다고 보았지만, <strong>버드는 1단계(관리의 부족)를 없애야</strong> 한다고 보았다. <strong>더 근본으로 거슬러 올라간</strong> 것이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">하인리히와 버드의 도미노 이론</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">하인리히</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">버드</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사회적 환경과 유전적 요소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>제어(통제)의 부족 — 관리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>개인적 결함</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기본원인 — 기원</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불안전한 행동과 상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>직접원인 — 징후</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사고</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사고 — 접촉</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>5</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>재해</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>상해 — 손실</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_mgt_t204": {"kind": "공식형", "fq": 1, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "환산강도율", "front": "환산강도율의 식은?", "back": "<ul><li>환산강도율은 $\\text{강도율} \\times \\dfrac{100 {,} 000}{10^{3}} = 1.15 \\times 100 = 115$ 일이다.</li><li>환산강도율은 <strong>강도율 × 100</strong>이므로 $5 \\times 100 = 500$ 일이다.</li></ul><p><strong>◈ 암기</strong> <u>강도율은 ×100, 도수율은 ÷10</u>.</p><p><strong>「며칠을 잃나」를 물었으므로 강도율</strong>을 쓴다. <strong>강도율은 천 시간 기준</strong>이므로 <strong>평생 10만 시간이면 ×100</strong>이다. <strong>도수율(24.5)은 쓰이지 않는 미끼</strong>다.<br><strong>강도율은 1,000시간 기준이고 평생은 10만 시간</strong>이므로 <strong>100배</strong>다 — <strong>도수율은 100만 시간 기준이라 10분의 1</strong>이 된다. <strong>하나는 곱하고 하나는 나눈다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">환산강도율과 환산도수율</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">환산도수율</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">환산강도율</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">무엇</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>평생 몇 번 다치나</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>평생 며칠을 잃나</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">식</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\text{도수율} \\times \\dfrac{\\text{평생근로시간}}{10^{6}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\text{강도율} \\times \\dfrac{\\text{평생근로시간}}{10^{3}}$</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>평생 10만 시간</u> (표준)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\text{도수율} \\div 10$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\text{강도율} \\times 100$</td></tr></tbody></table></div>", "nq": 2}, "card_mgt_t205": {"kind": "공식형", "fq": 1, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "도수율과 강도율", "front": "도수율과 강도율의 식은?", "back": "연근로시간은 $450 \\times 9 \\times 300 = 1 {,} 215 {,} 000$ 시간, 근로손실일수는 $3 {,} 650 \\times \\dfrac{300}{365} = 3 {,} 000$ 일이다. 도수율 $19.75$, 강도율 $2.47$이 나온다.<p><strong>◈ 암기</strong> <u>휴업일수 × 300/365 = 근로손실일수</u>.</p><p>두 함정이 있다 — <strong>연근로시간에 「1일 시간 × 연 근무일 × 인원」을 모두 곱하는 것</strong>과, <strong>휴업일수에 300/365를 곱해 근로손실일수로 바꾸는 것</strong>이다. 둘 중 하나만 놓쳐도 다른 보기로 빠진다.</p>", "nq": 1}, "card_mgt_t017": {"kind": "단답형", "fq": 2, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "재해통계 분석기법", "front": "재해통계 분석기법은?", "back": "<ul><li><strong>관리도</strong>다. 관리상한선과 관리하한선을 긋고 월별 재해 건수가 그 안에 머무는지 본다.</li><li><strong>관리도</strong>다. <strong>위아래 한계선을 그어 그 안에 드는지</strong>로 관리한다.</li></ul><p><strong>◈ 암기</strong> <u>한계선을 그으면 관리도</u>.</p><p>네 가지. 관리도 · 파레토도 · 특성요인도 · 클로즈 분석.<br><strong>「한계선」이라는 말이 관리도</strong>를 가리킨다. 네 기법을 <strong>한계선(관리도) · 크기 순(파레토) · 생선뼈(특성요인도) · 두 요인 표(클로즈)</strong>로 갈라 잡는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">재해통계 분석기법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>관리도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>한계선을 긋고 추이를 본다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>목표 관리</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>파레토도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>항목별로 크기 순으로 늘어놓는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">중점 관리 대상을 찾는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>특성요인도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생선뼈 모양으로 원인을 갈래지어 그린다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">원인 분석</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>클로즈 분석</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>두 요인의 관계를 표로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>폴리건(도수분포다각형)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>도수분포를 꺾은선으로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t209": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "FTA 의 통상사상", "front": "FTA 의 통상사상은?", "back": "<strong>통상사상</strong>이다. <strong>집 모양 오각형</strong>으로 그리며 <strong>늘 일어나는 정상적인 사상</strong>을 나타낸다.<p><strong>◈ 암기</strong> <u>집 모양은 통상사상</u>.</p><p><strong>통상사상은 「고장이 아니라 정상」</strong>인 사상이다 — <strong>전원이 들어와 있다 · 밸브가 열려 있다</strong> 같은 것이다. <strong>집 모양은 「늘 그 자리에 있다」</strong>는 뜻으로 새긴다.</p><div style=\"margin:12px 0 2px;font-weight:700\">FTA의 사상기호</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">모양</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>직사각형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>결함사상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">더 분석할 수 있는 사상 — 정상사상과 중간사상</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>원</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기본사상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">더 분석할 수 없는 밑바닥 사상</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>마름모</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생략사상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">자료가 모자라 더 전개하지 않는 사상</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>집 모양 오각형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>통상사상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>늘 일어나는 정상적인 사상</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>삼각형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전이기호</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">다른 곳으로 이어진다는 표시</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t121": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "미니멀 컷셋과 미니멀 패스셋", "front": "미니멀 컷셋과 미니멀 패스셋은?", "back": "<ul><li><strong>미니멀 패스셋(minimal path set)</strong>이다. <strong>그 요소들이 모두 살아 있으면 시스템이 돌아가는</strong> 최소한의 집합이다.</li><li><strong>패스셋은 시스템을 살리는 조합</strong>이다. 나머지 셋은 모두 <strong>컷셋</strong>의 설명이다.</li><li><strong>미니멀 컷셋은 정상사상을 일으키는 최소한의 컷셋</strong>이다. 나머지 셋은 컷셋과 패스셋을 뒤바꿔 놓았다.</li></ul><p><strong>◈ 암기</strong> <u>컷은 고장, 패스는 정상</u>. · <u>컷셋은 위험성, 패스셋은 신뢰성</u>.</p><p><strong>컷은 자른다(고장), 패스는 지나간다(정상)</strong>로 새긴다. <strong>미니멀 컷셋은 위험의 크기, 미니멀 패스셋은 시스템의 신뢰성</strong>을 나타낸다.<br><strong>컷은 자른다(고장), 패스는 지나간다(정상)</strong>로 새긴다. <strong>보기 셋이 모두 「고장」쪽</strong>을 말하고 있으므로 나머지 하나가 답이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">컷셋과 패스셋</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">컷셋(cut set)</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">패스셋(path set)</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">무엇</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>모두 일어나면 정상사상이 일어나는</u> 기본사상의 집합</td><td style=\"border:1px solid
