ign:center;\"><u>구조 중요도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>확률과 무관하게 FT의 구조만으로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">어느 자리가 중요한가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>확률 중요도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기본사상의 확률 변화가 정상사상에 미치는 영향</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>편미분계수</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>치명 중요도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기본사상의 확률을 몇 [%] 낮추면 정상사상이 몇 [%] 낮아지나</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">개선 효과의 크기</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t211": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "실험실 연구와 현장 연구", "front": "실험실 연구와 현장 연구는?", "back": "<strong>일반화가 가능</strong>한 것이 현장 연구의 장점이다. <strong>실제 상황에서 얻은 결과라 그대로 현장에 옮길 수</strong> 있다.<p><strong>◈ 암기</strong> <u>현장 연구는 일반화가 쉽다</u>.</p><p><strong>실험실은 「깨끗하지만 인위적」, 현장은 「지저분하지만 진짜」</strong>다. <strong>현장 연구의 유일하고 결정적인 장점이 「그대로 쓸 수 있다」</strong>는 것이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">실험실 연구와 현장 연구</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">실험실 연구</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">현장 연구</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">실험조건 조절</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>쉽다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어렵다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">자료의 정확성</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>낮다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">비용</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>적다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>많다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>일반화(현실 적용)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어렵다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>쉽다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">안전성</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>낮다</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t083": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "기계 일반", "mid": "소음의 방지대책", "front": "소음의 방지대책은?", "back": "<ul><li><strong>음원 대책</strong>이 가장 효과적이다. <strong>소리가 나는 곳 자체를 없애거나 줄이는</strong> 것이라 근본 대책이다.</li><li><strong>귀마개와 귀덮개</strong>는 <strong>수음자(사람) 대책</strong>이다. 가장 소극적인 방법이다.</li><li><strong>「소음의 분배」</strong>라는 대책은 없다. <strong>소음을 나눈다고 줄어들지 않는다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>음원 → 경로 → 사람</u> 순. · <u>귀마개는 사람 쪽 대책</u>.</p><p>위험관리의 우선순위와 같은 논리다 — <strong>위험 자체를 없애는 쪽이 위, 사람이 견디게 하는 쪽이 아래</strong>. 보호구는 언제나 마지막이다.<br><strong>음원 → 전파경로 → 수음자</strong> 순으로 대책을 세운다. <strong>보호구는 언제나 마지막</strong>이며, 위험관리의 우선순위와 같은 논리다.</p><div style=\"margin:12px 0 2px;font-weight:700\">소음 대책의 우선순위</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">순위</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대책</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>음원 대책</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>소음원 제거·대체 · 저소음 기계로 교체 · 방음 커버 · 마찰 감소</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전파경로 대책</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>차음벽 · 흡음재 · 거리 두기 · 지향성 조절</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수음자 대책</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>귀마개 · 귀덮개</u> · 작업시간 단축 — 가장 소극적</td></tr></tbody></table></div>", "nq": 4}, "card_erg_t212": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "불 대수의 정리", "front": "불 대수의 정리의 식은?", "back": "<ul><li>$A \\cdot A ' = 0$이다. <strong>어떤 사상과 그 여사상이 함께 일어날 수는 없다</strong>.</li><li>$A \\cdot \\bar{A} = 0$이다. <strong>A와 A 아님은 동시에 참일 수 없다</strong>.</li></ul><p><strong>◈ 암기</strong> $A \\cdot A ' = 0$, $A + A ' = 1$. · <u>A · Ā = 0, A + Ā = 1</u>.</p><p><strong>보원법칙의 두 식이 짝</strong>이다 — <strong>곱하면 0(둘 다 일어날 수 없다), 더하면 1(둘 중 하나는 반드시 일어난다)</strong>. <strong>두 값을 바꿔 놓는 것</strong>이 이 유형의 함정이다.<br><strong>곱(AND)은 「둘 다 참이라야」</strong> 이니 <strong>A와 A 아님을 곱하면 0</strong>이다 — <strong>합(OR)이라야 1</strong>이 된다. <strong>「·」과 「+」를 바꿔 놓은 함정</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">불 대수의 주요 정리</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">정리</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>항등법칙</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$A \\cdot 1 = A$, $A + 0 = A$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지배법칙</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$A \\cdot 0 = 0$, $A + 1 = 1$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>①·②</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>보원법칙</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$A \\cdot A ' = 0$, $A + A ' = 1$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>③은 1이라 어긋난다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>흡수법칙</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$A ( A + B ) = A$, $A + AB = A$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>④</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>동일법칙</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$A \\cdot A = A$, $A + A = A$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t213": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "인간 오류에 관한 설계기법", "front": "인간 오류에 관한 설계기법은?", "back": "<strong>예방설계</strong>다. <strong>아예 못 하게 할 수는 없으니 하기 어렵게</strong> 만든다.<p><strong>◈ 암기</strong> <u>하기 어렵게 만들면 예방설계</u>.</p><p>세 설계가 <strong>못 하게(배타) → 하기 어렵게(예방) → 해도 괜찮게(안전)</strong> 순으로 물러선다. <strong>「전적으로 막을 수 없으므로」</strong>라는 단서가 둘째 단계를 가리킨다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인간 오류에 관한 세 가지 설계</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">설계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>배타설계(exclusive)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>오류를 범할 수 없게 원천적으로 막는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>모양이 달라 거꾸로 끼울 수 없는 플러그</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>예방설계(prevent)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>오류를 범하기 어렵게 만든다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>두 손으로 눌러야 열리는 뚜껑</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전설계(fail safe)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>오류가 나도 안전한 쪽으로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>오류를 받아들이고 대비</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t214": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "화학설비 안전성 평가의 6단계", "front": "화학설비 안전성 평가의 6단계는?", "back": "<strong>온도와 압력</strong>은 <strong>제3단계 정량적 평가</strong>의 항목이다. 제1단계에서 모으는 자료가 아니다.<p><strong>◈ 암기</strong> <u>온도와 압력은 정량적 평가</u>.</p><p><strong>제1단계는 「도면과 목록을 모으는」 단계</strong>다. <strong>온도 · 압력 · 용량 · 취급물질 · 조작</strong> 다섯은 <strong>제3단계 정량적 평가에서 점수를 매기는</strong> 항목이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">제1단계 — 관계 자료의 작성준비</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">모아야 할 자료</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>입지조건에 관한 도표</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">땅과 둘레의 조건</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>화학설비 배치도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>건조물의 평면도·단면도·입면도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기계실·전기실 등의 배치도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>원재료·중간체·제품 등의 물리·화학적 성질과 위험성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제조공정의 개요 · 공정계통도 · 공정기기목록</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전설비의 종류와 설치 명세</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t215": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "신호검출이론(SDT)의 반응기준", "front": "신호검출이론(SDT)의 반응기준의 식은?", "back": "<strong>β = 1</strong>이다. <strong>두 곡선이 만나는 점에서는 신호와 잡음의 확률밀도가 같기</strong> 때문이다.<p><strong>◈ 암기</strong> <u>교차점이면 β = 1</u>.</p><p>$\\beta = \\dfrac{\\text{신호의 확률밀도}}{\\text{잡음의 확률밀도}}$다. <strong>두 곡선이 만나면 분자와 분모가 같아 1</strong>이 된다. <strong>네 결과(적중 · 허위경보 · 검출실패 · 정기각)</strong>도 함께 잡아 둔다.</p><div style=\"margin:12px 0 2px;font-weight:700\">신호검출이론의 반응기준 β</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">β</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">판별기준의 위치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">반응 경향</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>β = 1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>두 곡선이 교차하는 점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>중립</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>β &lt; 1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>교차점보다 왼쪽</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>허위경보(false alarm)가 는다</u> — 자유로운 반응</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>β &gt; 1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>교차점보다 오른쪽</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>신호 검출 실패(miss)가 는다</u> — 보수적 반응</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t216": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "설비보전의 조직 형태", "front": "설비보전의 조직 형태는?", "back": "<strong>보전요원이 각 현장에 배치되는</strong> 것은 <strong>부문보전(지역보전)</strong>의 특징이다. 집중보전은 <strong>한곳에 모여</strong> 있다.<p><strong>◈ 암기</strong> <u>각 현장 배치는 부문보전</u>.</p><p><strong>집중보전은 「한곳에 모아」</strong> 전문화하는 대신 <strong>현장까지 가는 시간이 걸린다</strong>. <strong>부문보전은 그 반대</strong>다 — <strong>빠르지만 전문화가 어렵다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">보전조직의 형태</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">형태</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">특징</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>집중보전</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>보전요원이 한 부서에 모여 있다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전문화 · 중점보전 · 공사관리가 쉽다</u> / 현장 출동이 늦다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>부문보전</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>보전요원이 각 부서에 소속</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>현장에 빠르다</u> / 전문화가 어렵다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지역보전</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>지역별로 배치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">둘의 절충</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>절충보전</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위 셋을 섞어 쓴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t217": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "평균 작동시간(MTTF)", "front": "평균 작동시간(MTTF)의 식은?", "back": "고장률은 $\\lambda = \\dfrac{5}{1 {,} 000 \\times 100 {,} 000} = 5 \\times 10^{-8}$ /시간이다. $\\mathrm{MTTF} = \\dfrac{1}{\\lambda} = \\dfrac{1}{5 \\times 10^{-8}} = 2 \\times 10^{7}$ 시간이다.<p><strong>◈ 암기</strong> <u>MTTF = 총 가동시간 ÷ 고장 건수</u>.</p><p><strong>총 가동시간은 「개수 × 시간」</strong>이라는 점이 갈림길이다 — <strong>1,000개를 10만 시간 돌렸으면 10⁸ 시간</strong>이다. <strong>그것을 고장 수 5로 나누면</strong> MTTF가 나온다.</p><div style=\"margin:12px 0 2px;font-weight:700\">신뢰도 관련 지표</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">지표</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>고장률 λ</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{고장 건수}}{\\text{총 가동시간}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>총 가동시간 = 개수 × 시간</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>MTTF</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{1}{\\lambda}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수리하지 않는 부품</u> — 평균 수명</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>MTBF</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{1}{\\lambda}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수리하는 설비</u> — 고장 사이의 평균 시간</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>신뢰도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$R ( t ) = e^{-\\lambda t}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t181": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "근전도(EMG)", "front": "근전도(EMG)은?", "back": "<ul><li><strong>근전도(EMG)</strong>다. <strong>근육이 낼 때 나는 전기 신호</strong>를 재므로 <strong>특정 근육 하나</strong>의 활동을 볼 수 있다.</li><li><strong>근전도(EMG)</strong>다. <strong>다리라는 특정 부위</strong>의 부하를 재려면 <strong>국소적 척도</strong>라야 한다.</li></ul><p><strong>◈ 암기</strong> <u>국소적 근육은 근전도</u>.</p><p><strong>「국소적」이라는 말이 갈림길</strong>이다. <strong>혈압과 맥박은 몸 전체의 반응</strong>이라 어느 근육이 힘든지 알 수 없다. <strong>근전도만 특정 근육을 짚어 낸다</strong>.<br><strong>「간헐적」이고 「다리」</strong>라는 두 낱말이 갈림길이다. <strong>띄엄띄엄 하는 작업은 전신 대사에 잘 드러나지 않고, 특정 부위의 부하는 근전도라야 짚어 낼 수</strong> 있다.</p><div style=\"margin:12px 0 2px;font-weight:700\">작업부하의 측정 척도</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 재나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">척도</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>국소적 근육 활동</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>근전도(EMG)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>특정 근육 하나</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전신적 육체 부하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>산소소비량 · 에너지소비량 · 심박수(맥박수) · 혈압</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">몸 전체</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정신적 부하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>점멸융합주파수(CFF) · 뇌전도(EEG) · 부정맥지수 · 눈 깜빡임률</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t147": {"kind": "용어형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "인간공학적 의자 설계의 원리", "front": "인간공학적 의자 설계의 원리란?", "back": "<ul><li>촉진해야 할 것은 <strong>요부전만(腰部前彎)</strong>이다. <strong>요부측만(옆으로 휨)은 오히려 막아야</strong> 한다.</li><li><strong>한 자세로 오래 있게 하면 안 된다</strong>. <strong>자세 고정을 줄여야</strong> 한다.</li></ul><p><strong>◈ 암기</strong> <u>요부전만은 살리고 측만은 막는다</u>. · <u>자세를 고정시키지 않는다</u>.</p><p><strong>전만(前彎)은 앞뒤로 굽는 정상 만곡, 측만(側彎)은 옆으로 휘는 병</strong>이다. 보기 ②는 한 글자만 바꿔 놓았다.<br><strong>한 자세로 오래 있으면 같은 근육만 계속 힘을 써 피로하고 혈류가 막힌다</strong>. 그래서 <strong>자주 자세를 바꿀 수 있게</strong> 만든다 — <strong>「조절이 쉽도록」과 「자세 고정을 줄인다」는 같은 뜻</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인간공학적 의자 설계의 원리</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원리</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>요부전만을 유지한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>허리의 자연스러운 앞굽음</u> — 측만이 아니다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>디스크(추간판)에 걸리는 압력을 줄인다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>등근육의 정적 부하를 줄인다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>자세를 고정시키지 않는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">오래 같은 자세로 있지 않게</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>조정이 쉽도록 한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 3}, "card_erg_t218": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "작업환경관리", "mid": "열교환의 방법과 온열조건", "front": "열교환의 방법과 온열조건의 식은?", "back": "<strong>반사</strong>는 4요소가 아니다. 넷은 <strong>대류 · 전도 · 복사 · 증발</strong>이다.<p><strong>◈ 암기</strong> <u>대류 · 전도 · 복사 · 증발</u> 넷.</p><p>$S = M - E \\pm R \\pm C - W$라는 열균형 방정식에서 <strong>증발(E) · 복사(R) · 대류(C)</strong>가 나온다. <strong>「반사」는 복사의 한 갈래일 뿐</strong> 따로 세지 않는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">열교환의 네 가지 방법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>대류(convection)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>공기의 흐름을 타고</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">선풍기 바람</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전도(conduction)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>맞닿은 물체로 곧장</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">차가운 바닥</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>복사(radiation)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전자기파로 곧바로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">햇빛 · 난로</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>증발(evaporation)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>땀이 마르며 열을 빼앗는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>더울 때 가장 중요</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t219": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "FT 의 작성방법", "front": "FT 의 작성방법은?", "back": "정상사상은 <strong>좁고 구체적으로</strong> 잡아야 한다. <strong>광범위하게 잡으면 나무가 걷잡을 수 없이 커져</strong> 분석이 되지 않는다.<p><strong>◈ 암기</strong> <u>정상사상은 구체적으로</u>.</p><p><strong>정상사상이 넓으면 가지가 끝없이 벌어진다</strong> — <strong>「사고가 난다」가 아니라 「A 밸브에서 가스가 샌다」처럼 좁혀야</strong> 나무가 그려진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">FT 작성의 유의점</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">유의점</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>분석 대상 시스템을 완전히 이해할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정상사상을 구체적이고 명확하게 정의할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「광범위하게」가 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정상사상과 기본사상의 관계를 논리게이트로 그릴 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>해석·평가에 앞서 불 대수로 FT를 간소화할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>같은 수준(level)의 사상끼리 나란히 놓을 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t220": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "THERP(인간 오류율 예측기법)", "front": "THERP(인간 오류율 예측기법)은?", "back": "<ul><li><strong>THERP</strong>다. <strong>Technique for Human Error Rate Prediction</strong>의 줄임말로 <strong>인간 오류의 확률을 셈한다</strong>.</li><li><strong>THERP</strong>다. <strong>사람의 오류 확률을 셈해</strong> 인간공학적 대책을 세운다.</li><li><strong>㉡ 이 틀렸다</strong> — THERP는 <strong>정성적이 아니라 정량적</strong>으로 평가한다. 따라서 <strong>㉠ 과 ㉢</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>인간 과오의 정량 평가는 THERP</u>. · <u>THERP는 정량적</u>.</p><p><strong>THERP 만 사람을 다루고 나머지 셋은 기계의 고장</strong>을 다룬다. <strong>「Human Error Rate Prediction」</strong>이라는 이름 자체가 답을 말해 준다.<br><strong>THERP 만 사람을 다루고 나머지는 기계나 관리를 다룬다</strong>. <strong>「Human Error Rate Prediction」</strong>이라는 이름 자체가 답을 말해 준다.</p><div style=\"margin:12px 0 2px;font-weight:700\">주요 분석기법</div><div style=\"overflow-x:auto\"><table style=\"bo rong>이다. <strong>금형 둘레에 울을 쳐 손이 들어갈 틈을 없앤다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>방호장치는 hand in die</u>. · <u>방호울식이 no-hand in die</u>.</p><p><strong>「손을 넣을 자리가 없게 만드는가(no-hand)」와 「손을 넣되 지키는가(hand)」</strong>로 가른다. <strong>앞쪽이 본질적 안전화</strong>이며 <strong>방호장치라는 이름이 붙으면 대개 뒤쪽</strong>이다.<br><strong>방호울은 「울」이라는 말 그대로 금형을 둘러 막는</strong> 것이라 <strong>손이 들어갈 자리 자체가 없다</strong>. <strong>나머지 셋은 손이 들어간 다음에 작동하는</strong> 장치다.</p><div style=\"margin:12px 0 2px;font-weight:700\">프레스의 방호 — 손을 넣느냐로 가른다</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>no-hand in die</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안전금형 · 금형의 안전 울 · 전용프레스 · 자동송급배출장치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>손이 아예 들어가지 않는다</u> — 본질적 안전화</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>hand in die</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가드식 · 수인식 · 손쳐내기식 · 양수조작식 · 광전자식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>손이 들어가므로 방호장치로 막는다</u></td></tr></tbody></table></div>", "nq": 2}, "card_mac_t180": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "정(chisel) 작업의 안전", "front": "정(chisel) 작업의 안전은?", "back": "<ul><li>끝날 무렵에는 <strong>약하게</strong> 쳐야 한다. <strong>세게 치면 끊어진 조각이 튄다</strong>.</li><li>시작할 때와 끝날 무렵에는 <strong>약하게</strong> 친다. <strong>가운데만 세게</strong> 친다.</li><li>시작할 때와 끝날 무렵에는 <strong>약하게</strong> 친다.</li></ul><p><strong>◈ 암기</strong> <u>마칠 무렵엔 약하게</u>. · <u>시작과 끝은 약하게</u>.</p><p><strong>끊어지기 직전이 가장 위험</strong>하다 — <strong>마지막 한 번의 세기가 조각의 속도</strong>를 정한다. <strong>처음엔 약하게, 가운데는 세게, 마칠 때는 다시 약하게</strong>가 순서다.<br><strong>「약 → 강 → 약」</strong>이 정 작업의 리듬이다 — <strong>처음엔 자리를 잡느라, 마지막엔 조각이 튀지 않게</strong> 약하게 친다.</p><div style=\"margin:12px 0 2px;font-weight:700\">정(chisel) 작업의 안전수칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>보안경을 반드시 쓴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">칩이 튄다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>담금질한 재료는 정으로 치지 않는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">단단해서 정이 깨진다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>모서리는 3R 정도로 둥글린다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>마칠 무렵에는 약하게 친다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「세게」가 아니다</u> — 끊어진 조각이 날아간다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>자루가 튼튼히 박혔는지 확인한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 3}, "card_mac_t181": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "안전인증과 자율안전확인", "front": "안전인증과 자율안전확인은?", "back": "<strong>산업용 로봇 안전매트</strong>는 <strong>자율안전확인대상</strong> 방호장치다.<p><strong>◈ 암기</strong> <u>안전매트는 자율안전확인</u>.</p><p><strong>안전인증은 나라가 확인해 주는 것, 자율안전확인은 스스로 확인하고 신고하는 것</strong>이다. <strong>압력·방폭·절연처럼 터지거나 감전되는 쪽이 안전인증</strong>, <strong>덮개·급정지장치처럼 붙여 쓰는 쪽이 자율안전확인</strong>으로 갈린다.</p><div style=\"margin:12px 0 2px;font-weight:700\">방호장치 — 안전인증대상과 자율안전확인대상</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방호장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전인증대상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>프레스·전단기 방호장치, 양중기용 과부하방지장치, 보일러·압력용기 압력방출용 안전밸브, 압력용기 압력방출용 파열판, 절연용 방호구와 활선작업용 기구, 방폭구조 전기기계·기구 및 부품, 추락·낙하·붕괴 방지용 가설기자재</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시행령 제74조</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>자율안전확인대상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>아세틸렌·가스집합 용접장치용 안전기, 교류 아크용접기용 자동전격방지기, 롤러기 급정지장치, 연삭기 덮개, 목재가공용 둥근톱 반발예방장치와 날접촉예방장치, 동력식 수동대패용 칼날접촉방지장치, 산업용 로봇 안전매트</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시행령 제77조</u></td></tr></tbody></table></div>", "nq": 1}, "card_mac_t182": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "회전 가공물의 방호", "front": "회전 가공물의 방호는?", "back": "<strong>울 또는 덮개</strong>다. <strong>돌출한 채 도는 가공물에 몸이 닿지 않게</strong> 막는다.<p><strong>◈ 암기</strong> <u>돌출 가공물은 울 또는 덮개</u>.</p><p><strong>긴 봉재가 척 뒤로 튀어나온 채 돌면</strong> 옷이나 몸이 감겨 든다. <strong>둘레를 막는 울 · 덮개</strong>가 답이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">회전부의 방호조치</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대상</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방호조치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>선반 등에서 돌출하여 회전하는 가공물</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>울 또는 덮개</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>회전축·기어·풀리·벨트</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>덮개 · 울 · 슬리브 · 건널다리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>띠톱기계의 톱날</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>덮개 또는 울</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>원심기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>덮개</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_mac_t006": {"kind": "공식형", "fq": 2, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "안전율(안전계수)", "front": "안전율(안전계수)의 식은?", "back": "<ul><li>$\\text{안전율} = \\dfrac{\\text{극한강도}}{\\text{허용응력}}$이므로 $\\text{허용응력} = 250 / 4 = 62.5$ [N/mm²]다.</li><li>$\\dfrac{25}{4} = 6.25$ [kg/mm²]이다.</li><li>안전도는 <strong>인장강도 ÷ 내압</strong>이다. $1 \\rightarrow 40 / 50 = 0.80$, $2 \\rightarrow 50 / 60 = 0.83$, $3 \\rightarrow 55 / 70 = 0.79$이므로 <strong>2 - 1 - 3</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>허용응력 = 인장강도 ÷ 안전율</u>. · <u>안전도 = 인장강도 ÷ 내압</u>.</p><p>$S = \\dfrac{\\text{극한강도}}{\\text{허용응력}} = \\dfrac{\\text{파단하중}}{\\text{안전하중}}$. 안전율은 <u>모르는 것에 대한 여유</u>다. 재료가 불균일하거나 하중이 반복되거나 사용 조건이 가혹할수록 크게 잡는다.<br><strong>안전율은 「몇 배로 버티게 해 두었나」</strong>다 — <strong>클수록 안전하지만 재료가 낭비</strong>된다. <strong>허용응력은 그 배수만큼 낮춰 놓은 값</strong>이므로 나눗셈이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">안전율과 허용응력</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전율</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$S = \\dfrac{\\text{극한강도} ( \\text{인장강도} )}{\\text{허용응력}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>허용응력</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{극한강도}}{\\text{안전율}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전율의 다른 꼴</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{파단하중}}{\\text{안전하중}}$, $\\dfrac{\\text{파괴하중}}{\\text{최대사용하중}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 6}, "card_mac_t183": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "양중기의 방호장치", "front": "양중기의 방호장치는?", "back": "<strong>권과방지장치</strong>다. <strong>감을 권(捲), 지나칠 과(過)</strong> — <strong>지나치게 감기는 것을 막는다</strong>.<p><strong>◈ 암기</strong> <u>지나치게 감기는 것은 권과방지장치</u>.</p><p><strong>권과(捲過)는 「지나치게 감김」</strong>이다 — <strong>훅이 붐 끝까지 올라가 로프가 끊어지는 사고</strong>를 막는다. <strong>훅과 드럼 사이를 0.25 [m] 이상(직동식은 0.05 [m] 이상) 떼어</strong> 놓는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">양중기의 방호장치</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"bor 2px;vertical-align:middle;text-align:left;\"><u>내려가는 짐</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_mac_t026": {"kind": "공식형", "fq": 2, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "양수기동식 방호장치의 안전거리", "front": "양수기동식 방호장치의 안전거리의 식은?", "back": "<ul><li>$D_{m} = 1.6 T_{m}$, $T_{m} = ( \\dfrac{1}{\\text{클러치 개소수}} + \\dfrac{1}{2} ) \\times \\dfrac{60 {,} 000}{\\mathrm{SPM}}$이다. $T_{m} = ( 1 / 6 + 1 / 2 ) \\times 60 {,} 000 / 200 = 0.667 \\times 300 = 200$ [ms]이므로 $D_{m} = 1.6 \\times 200 = 320$ [mm]다.</li><li>$D_{m} = 1 {,} 600 \\times T_{m}$이다. $1 {,} 600 \\times 0.5 = 800$ [mm]다.</li><li>$D_{m} = 1 {,} 600 \\times T_{m} = 1 {,} 600 \\times 0.15 = 240$ [mm] = <strong>24 [cm]</strong>다.</li></ul><p><strong>◈ 암기</strong> $D_{m} = 1.6 T_{m}$, $T_{m}$은 <u>(1/개소수 + 1/2) × 60,000/SPM</u>. · <u>1,600 × 시간</u> — 답은 [mm].</p><p>계수 <strong>1.6</strong>은 사람 손의 접근속도 <strong>1.6 [m/s]</strong>에서 왔다. 광전자식은 $D = 1.6 ( T_{l} + T_{s} )$로 식이 다르다.<br>1,600 [mm/s]는 <strong>사람 손이 움직이는 속도</strong>로 잡은 값이다. <strong>손이 위험구역에 닿기 전에 슬라이드가 내려와 버리도록</strong> 두 손 버튼을 그만큼 떨어뜨려 둔다.</p><div style=\"margin:12px 0 2px;font-weight:700\">프레스 방호장치의 안전거리</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방호장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>양수기동식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$D_{m} = 1 {,} 600 T_{m}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$T_{m}$은 <u>하사점 도달시간</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>양수조작식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$D = 1 {,} 600 ( T_{l} + T_{s} )$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">급정지시간</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>광전자식(감응식)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$D = 1 {,} 600 ( T_{l} + T_{s} )$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>손쳐내기식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$D = 0.5 \\times \\text{행정길이}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 7}, "card_mac_t184": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "기계설비의 안전화", "front": "기계설비의 안전화는?", "back": "<ul><li><strong>부품변형</strong>은 <strong>구조의 안전화(강도)</strong>에 속한다. 나머지 셋은 <strong>에너지와 제어신호의 이상</strong>이라 기능의 안전화다.</li><li><strong>열처리로 강도와 인성을 높이는</strong> 것은 <strong>재료 결함을 없애는 구조의 안전화</strong>다.</li><li><strong>재료와 가공의 결함</strong>은 <strong>구조의 안전화</strong>에서 볼 것이다.</li></ul><p><strong>◈ 암기</strong> <u>부품변형은 구조의 안전화</u>. · <u>열처리는 구조의 안전화</u>.</p><p><strong>기능의 안전화는 「신호와 동력이 흐트러졌을 때」</strong>를 다룬다 — <strong>정전 · 전압강하 · 압력변동 · 단락</strong>. <strong>부품이 휘거나 부러지는 것은 강도의 문제라 구조의 안전화</strong>다.<br><strong>구조의 안전화는 「재료 결함 · 설계 결함 · 가공 결함」</strong> 셋을 없애는 것이다 — <strong>열처리는 재료의 성질을 바꾸는 일</strong>이라 여기에 든다.</p><div style=\"margin:12px 0 2px;font-weight:700\">기계설비의 안전화 갈래</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">갈래</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>외관의 안전화</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위험부를 감춘다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">덮개 · 울 · 격리</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기능의 안전화</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>오동작을 막는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전압강하·정전 · 사용압력 변동 · 단락 · 스위치 고장</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>구조의 안전화</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>부서지지 않게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>재료 결함 · 설계 결함 · 가공 결함 · 부품변형</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>작업의 안전화</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작업하기 쉽게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">작업대 높이 · 통로</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>보전작업의 안전화</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>고치기 쉽게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 4}, "card_mac_t014": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "산업용 기계", "mid": "보일러의 방호장치", "front": "보일러의 방호장치는?", "back": "<ul><li><strong>압력제한 스위치</strong>다. 압력이 오르면 <strong>버너의 연소를 끊어</strong> 더 오르지 못하게 한다. 압력을 밖으로 빼는 것이 아니라 <strong>열을 넣는 쪽을 멈추는</strong> 장치라는 점이 갈림길이다.</li><li><strong>언로드밸브</strong>는 <strong>공기압축기</strong>의 부속이다. 압력이 차면 압축기를 무부하로 돌린다.</li><li><strong>급정지장치</strong>는 <strong>롤러기</strong>의 방호장치다.</li></ul><p><strong>◈ 암기</strong> <u>압력제한 스위치는 열을 끊고, 압력방출장치는 압력을 뺀다</u>. · <u>언로드밸브는 공기압축기</u>.</p><p>압력방출장치가 2개 이상이면 하나는 <strong>최고사용압력 이하</strong>, 나머지는 <strong>1.05배 이하</strong>에서 작동한다.<br><strong>압력방출장치는 「넘치면 뿜어낸다」, 압력제한스위치는 「오르면 불을 끈다」</strong>로 갈린다. 앞의 것은 <strong>결과를 막고</strong> 뒤의 것은 <strong>원인을 끊는다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">보일러의 방호장치 넷</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">하는 일</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">작동 방식</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>압력제한 스위치</u></td><td style=\"b n:middle;text-align:center;\"><u>①</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>감전 상황을 판단한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">충전부에 닿아 있는지</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>②</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전원을 끊는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">가장 먼저 할 일</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>③</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>끊을 수 없으면 절연물로 떼어낸다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>마른 막대 · 고무장갑 · 고무장화</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>④</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>구조자도 보호구를 갖춘다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>⑤</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>의식·호흡·맥박을 확인하고 심폐소생술</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t209": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "지락전류와 외함 대지전압", "front": "지락전류와 외함 대지전압의 식은?", "back": "지락회로는 $R_{2}$<strong>와 </strong>$R_{3}$<strong>이 직렬</strong>이다. $I = \\dfrac{200}{10 + 30} = 5$ [A]다.<p><strong>◈ 암기</strong> <u>지락전류는 두 접지저항의 지기술", "chapter": "감전재해", "mid": "퓨즈의 구실", "front": "퓨즈의 구실은?", "back": "<strong>과전류를 끊는</strong> 것이다. <strong>녹아 끊어지며 회로를 연다</strong>.<p><strong>◈ 암기</strong> <u>퓨즈는 과전류</u>.</p><p><strong>퓨즈는 「전선보다 먼저 녹으라고 넣어 둔 약한 고리」</strong>다. <strong>감전을 막는 장치가 아니다</strong> — 감전은 누전차단기가 맡는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">보호장치와 막는 대상</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">막는 것</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>퓨즈 · 배선용 차단기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>과전류(과부하 · 단락)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>누전차단기(ELB)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>누설(지락)전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">정격감도전류 30 [mA], 0.03초 이내</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>피뢰기 · 서지보호기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이상전압(과전압)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>과부하계전기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전동기의 과부하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t212": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "허용접촉전압", "front": "허용접촉전압의 식은?", "back": "<ul><li>제1종은 <strong>2.5 [V] 이하</strong>다. <strong>「초과」가 아니다</strong>.</li><li><strong>제2종 — 25 [V] 이하</strong>다.</li><li>두 발은 병렬이므로 $R_{f} / 2 = 150$ [Ω]이다. $E = I_{k} ( R_{k} + \\dfrac{R_{f}}{2} ) = 0.165 \\times 1 {,} 150 \\fallingdotseq 190$ [V]다.</li></ul><p><strong>◈ 암기</strong> <u>제1종은 2.5 [V] 이하</u>. · <u>땀에 젖으면 25 [V] 이하</u>.</p><p><strong>젖어 있을수록 인체저항이 낮아 같은 전압에도 큰 전류</strong>가 흐른다 — 그래서 <strong>제1종이 가장 낮은 2.5 [V]</strong>다. <strong>2.5 → 25 → 50 → 제한없음</strong> 순으로 느슨해진다.<br><strong>「물에 젖음」과 「땀에 젖음」을 갈라야</strong> 한다 — <strong>물은 제1종(2.5 [V]), 땀은 제2종(25 [V])</strong>. <strong>젖은 정도가 심할수록 값이 낮다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">허용접촉전압의 종별</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종별</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">허용접촉전압</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">어떤 곳</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제1종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>2.5 [V] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>인체가 물에 젖어 있는 상태</u> · 금속제 전기기계에 몸이 늘 닿는 상태</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제2종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>25 [V] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">땀에 젖어 있거나 금속제에 몸이 닿을 수 있는 상태</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제3종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>50 [V] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">제1·2종 외에 통상의 인체상태로 접촉전압이 걸리면 위험한 상태</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제4종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>제한 없음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">접촉전압이 걸릴 우려가 없는 상태</td></tr></tbody></table></div>", "nq": 4}, "card_ele_t213": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "위험한계 에너지", "front": "위험한계 에너지의 식은?", "back": "<ul><li>심실세동전류는 $I = \\dfrac{165}{\\sqrt{T}}$ [mA]이므로 1초에서 165 [mA]다. $W = I^{2} R T = ( 0.165 )^{2} \\times 1 {,} 000 \\times 1 \\fallingdotseq 27.23$ [J]다.</li><li>$I = \\dfrac{165}{\\sqrt{1}} = 165$ [mA]이므로 $W = ( 0.165 )^{2} \\times 500 \\times 1 \\fallingdotseq 13.6$ [J]다.</li><li>$W = I^{2} R T = ( 0.165 )^{2} \\times 500 \\fallingdotseq 13.6$ [J]이다. <strong>통전시간에 따라 대략 6.5 ~ 17.0 [J]</strong> 범위에 든다.</li></ul><p><strong>◈ 암기</strong> <u>1,000 [Ω] 이면 27.23 [J]</u>. · <u>500 [Ω] 이면 13.6 [J]</u>.</p><p>$W = I^{2} R T$에서 $I$에 $165 / \\sqrt{T}$를 넣으면 $T$가 약분되어 $W = ( 0.165 )^{2} R$만 남는다 — <strong>통전시간과 무관하게 저항만으로 정해진다</strong>. <strong>R = 1,000 이면 27.23, R = 500 이면 13.6</strong> 두 값만 외워 두면 된다.<br>$W = I^{2} R T$에 $I = 165 / \\sqrt{T}$를 넣으면 $T$<strong>가 약분되어 저항만으로 정해진다</strong> — <strong>500 이면 13.6, 1,000 이면 27.23</strong> 두 값만 외워 두면 된다.</p><div style=\"margin:12px 0 2px;font-weight:700\">심실세동과 위험한계 에너지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>심실세동전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$I = \\dfrac{165}{\\sqrt{T}}$ [mA]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>T는 통전시간 [초]</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험한계 에너지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$W = I^{2} R T$ [J]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>R = 1,000 [Ω], T = 1초</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>27.23 [J]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>R = 500 [Ω], T = 1초</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>13.6 [J]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">자주 함께 나온다</td></tr></tbody></table></div>", "nq": 3}, "card_ele_t214": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "", "mid": "환기가 충분한 장소", "front": "환기가 충분한 장소는?", "back": "<strong>지붕과 한 면의 벽만 있어 바깥 공기가 드나드는 건축물</strong>은 환기가 충분한 장소로 본다.<p><strong>◈ 암기</strong> <u>하한계의 25%, 계산은 15%</u>.</p><p><strong>25%와 15% 두 숫자</strong>가 갈림길이다 — <strong>쌓이는 것을 막는 일반 기준이 25%, 계산으로 증명할 때가 15%</strong>다. <strong>숫자를 부풀린 보기 셋을 걸러내면</strong> 남는 것이 답이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">환기가 충분한 장소</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보는 기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>폭발하한계의 25%를 넘겨 쌓이지 않을 만큼의 환기량</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「50%」가 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>옥외</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지붕과 한 면의 벽만 있는 건축물</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>바깥 공기 흐름을 막지 않는 구조</u> · 이 문항</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>강제환기방식으로 옥외와 같은 정도의 환기가 보장되는 곳</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「자연 순환방식」이 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>계산으로 폭발하한계의 15%를 넘지 않음이 보장되는 곳</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「35%」가 아니다</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t215": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "금속관 배선의 방폭", "front": "금속관 배선의 방폭은?", "back": "나사 접합은 <strong>내압방폭구조</strong>의 폭발압력 시험에 맞아야 한다. <strong>「유압방폭구조」라는 것은 없다</strong>.<p><strong>◈ 암기</strong> <u>나사 5턱 이상, 내압방폭구조</u>.</p><p><strong>방폭구조의 갈래는 내압(d) · 압력(p) · 유입(o) · 안전증(e) · 본질안전(ia · ib) · 몰드(m) · 충전(q) · 비점화(n)</strong>이다 — <strong>「유압」은 그 안에 없다</strong>. <strong>5턱 이상</strong>이라는 숫자와 함께 잡아 둔다.</p><div style=\"margin:12px 0 2px;font-weight:700\">금속관 방폭형 부속품의 요건</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">요건</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>아연도금 위에 투명 도료를 칠하거나 녹슬지 않게 한 강 또는 가단주철</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안쪽 면과 끝부분은 전선 피복을 다치지 않게 매끈할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접속부분의 나사는 5턱 이상 완전히 물릴 길이일 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>숫자 5턱</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>나사 접합은 내압방폭구조의 폭발압력 시험에 적합할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「유압방폭구조」는 없다</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t216": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "발화도 등급과 온도등급", "front": "발화도 등급과 온도등급은?", "back": "<strong>G1</strong>이다. <strong>발화도는 등급 숫자가 커질수록 발화점가 낮아진다</strong>.<p><strong>◈ 암기</strong> <u>450 · 300 · 200 · 135 · 100 · 85</u>.</p><p><strong>발화도 G1 ~ G6와 기기의 온도등급 T1 ~ T6는 숫자가 같은 칸끼리 짝</strong>이다 — <strong>450 / 300 / 200 / 135 / 100 / 85</strong>이라는 여섯 숫자 하나로 두 표를 다 쓴다. <strong>기기의 최고표면온도가 가스의 발화점보다 낮아야</strong> 한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">가스의 발화도 등급</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">등급</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">발화점</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>G1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>450 [℃] 초과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"borde px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>방전에너지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$W = \\dfrac{1}{2} C V^{2} = \\dfrac{1}{2} Q V$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">[J]</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전위</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$V = \\sqrt{\\dfrac{2 W}{C}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>단위</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 [pF] = 10⁻¹² [F], 1 [mJ] = 10⁻³ [J]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>단위 환산이 갈림길</u></td></tr></tbody></table></div>", "nq": 4}, "card_ele_t218": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기설비", "mid": "감전의 국소증상", "front": "감전의 국소증상은?", "back": "<strong>피부의 광성변화</strong>다. <strong>녹은 금속분자가 피부에 박혀 회백색으로 변한다</strong>.<p><strong>◈ 암기</strong> <u>금속이 박히면 광성변화</u>.</p><p><strong>광성(鑛性)은 「쇳가루의 성질」</strong>이라는 뜻이다 — <strong>금속이 박혔다</strong>는 말이 곧 답을 준다. <strong>전문(電紋)은 무늬 문(紋)</strong>이라 모양을 가리킨다.</p><div style=\"margin:12px 0 2px;font-weight:700\">감전에 의한 국소증상</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #c
