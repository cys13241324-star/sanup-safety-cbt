=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 하나</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>관계 자료의 정비 검토</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">설계도 · 공정도 · 물질 자료</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정성적 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">입지 조건 · 배치 · 건조물 · 소방설비 · 원재료 · 공정</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정량적 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">취급물질 · 용량 · 온도 · 압력 · 조작 — A~D 등급</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안전대책</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>설비 대책과 관리 대책</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>5</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>재해정보에 의한 재평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">비슷한 사고 사례로 다시 본다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>6</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>FTA에 의한 재평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">등급 Ⅰ·Ⅱ 에 적용</td></tr></tbody></table></div>", "nq": 2}, "card_erg_t104": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "FTA 의 특징", "front": "FTA 의 특징은?", "back": "<ul><li>FTA는 <strong>정성적 해석도 정량적 해석도 모두</strong>할 수 있다. 「정성적 해석이 불가능하다」는 틀렸다.</li><li>FTA는 <strong>정성적 분석과 정량적 분석이 모두</strong> 가능하다. 오히려 <strong>정량화가 되는 것이 FTA의 강점</strong>이다.</li><li>FTA는 <strong>톱다운(Top-Down)</strong> 방식이다. <strong>정상사상에서 아래로 내려가며 원인을 찾는다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>FTA는 정성도 정량도 된다</u>. · <u>FTA는 정량도 된다</u>.</p><p><strong>FTA는 정량적 해석까지 되는 것이 강점</strong>이다. FMEA가 정성적에 머무는 것과 대비된다. 「불가능」이라는 말이 붙으면 대개 오답이다.<br><strong>FTA는 정량 가능, FMEA는 정성적</strong>이다. 「정성적만 가능하다」는 FMEA의 특징을 FTA에 갖다 붙인 것이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">FTA의 특징</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">특징</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Top Down 형식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">정상사상에서 아래로 캐 내려간다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>연역적 해석</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">결과에서 원인으로</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>특정 사상에 대한 해석</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">정상사상 하나를 정해 놓고 본다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>논리기호를 사용</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">AND · OR 게이트</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정성적 · 정량적 해석이 모두 가능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「불가능」이 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>컴퓨터 처리가 가능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 4}, "card_erg_t105": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "경보등 설계의 원칙", "front": "경보등 설계의 원칙은?", "back": "<strong>점멸 잡음광이 10 [%] 이상이면 점멸등을 쓰지 않는다</strong>. 배경에 깜박이는 빛이 많으면 경보등이 묻혀 알아볼 수 없기 때문이다.<p><strong>◈ 암기</strong> <u>배경이 깜박이면 점멸등을 쓰지 않는다</u>.</p><p>한 줄로 — <strong>배경과 뚜렷이 구별되게 만든다</strong>. 배경이 밝으면 더 밝게, 배경이 깜박이면 점멸등을 피하고, 노출이 짧으면 더 세게 한다.</p>", "nq": 1}, "card_erg_t017": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "양립성의 네 가지", "front": "양립성의 네 가지는?", "back": "<ul><li><strong>양식(modality) 양립성</strong>은 <strong>자극을 받는 감각과 반응하는 방식이 서로 맞는가</strong>를 말한다. <strong>귀로 들려주고 입으로 답하게 하는 것</strong>이 그 예다. 반대로 소리로 물어보고 손으로 버튼을 누르게 하면 그만큼 반응이 느려진다.</li><li>양립성은 <strong>공간 · 운동 · 개념 · 양식</strong> 네 가지다. 「감성의 양립성」은 없다.</li><li><strong>양식(modality) 양립성</strong>이다. <strong>귀로 들었으면 입으로 답하는</strong> 것처럼 자극과 응답의 <strong>감각 양식이 맞는</strong> 경우다.</li></ul><p><strong>◈ 암기</strong> <u>공간(위치) · 운동(방향) · 개념(뜻) · 양식(감각과 반응)</u>. · 「<u>공 · 운 · 개 · 양</u>」 — 감성은 없다.</p><p>양립성 네 가지. <u>공간(위치) · 운동(방향) · 개념(뜻) · 양식(감각과 반응의 방식)</u>. 양립성이 어긋난 설계는 평소에는 그럭저럭 쓰이다가 <u>급할 때 반드시 실수를 부른다</u>. 이것이 양립성이 안전의 문제인 이유다.<br>양립성이 어긋난 설계는 평소에는 그럭저럭 쓰이다가 <strong>급할 때 반드시 실수를 부른다</strong>. 이것이 양립성이 안전의 문제인 까닭이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">양립성의 네 가지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>공간적 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>배치가 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">오른쪽 버너는 오른쪽 손잡이</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>운동 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>움직임이 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">시계 방향으로 돌리면 증가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>개념적 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>뜻이 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>빨강은 뜨거움, 파랑은 차가움</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>양식 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>자극과 응답의 감각 양식이 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>들으면 말로 답한다</u></td></tr></tbody></table></div>", "nq": 7}, "card_mac_t087": {"kind": "공식형", "fq": 1, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "연삭숫돌의 플랜지", "front": "연삭숫돌의 플랜지의 식은?", "back": "<ul><li>평형플랜지의 지름은 <strong>숫돌 지름의 1/3 이상</strong> 이어야 한다. $180 / 3 = 60$ [mm]다.</li><li>플랜지 지름은 <strong>숫돌 바깥지름의 1/3 이상</strong>이므로 $150 \\times 1 / 3 = 50$ [mm]다.</li><li>플랜지 지름은 <strong>숫돌 바깥지름의 1/3 이상</strong>이므로 $300 \\times 1 / 3 = 100$ [mm]다.</li></ul><p><strong>◈ 암기</strong> <u>숫돌 지름의 1/3 이상</u>. · <u>플랜지는 숫돌 지름의 1/3 이상</u>.</p><p>플랜지가 작으면 <strong>숫돌을 잡아 주는 면이 좁아 깨지기 쉽다</strong>. 연삭기의 숫자 — <strong>플랜지 1/3 이상 · 덮개는 지름 5 [cm] 이상인 숫돌에 · 작업 전 1분, 교체 후 3분 시운전</strong>.<br><strong>플랜지는 숫돌 지름의 1/3 이상</strong>이라야 숫돌을 제대로 붙들어 파괴를 막는다. 연삭기는 이 밖에 <strong>작업 시작 전 1분, 숫돌 교체 뒤 3분 시운전</strong>과 <strong>최고사용 원주속도 초과 금지</strong>가 함께 나온다.</p><p><em>근거 — 안전보건규칙 제120조</em></p>", "nq": 4}, "card_mac_t074": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "밀링 작업의 안전수칙", "front": "밀링 작업의 안전수칙은?", "back": "<ul><li>면장갑을 끼면 <strong>회전하는 커터에 말려들어 손째 끌려 들어간다</strong>. 회전 기계 앞에서는 장갑을 끼지 않는다.</li><li><strong>칩 브레이커는 선반의 바이트에 달린 것</strong>이다. 밀링의 칩은 <strong>기계를 세운 뒤 브러시</strong>로 치운다.</li></ul><p><strong>◈ 암기</strong> <u>회전 기계에 장갑은 금물</u>. · <u>칩 브레이커는 선반 것</u>.</p><p>회전 기계의 공통 원칙 셋 — <strong>장갑을 끼지 않는다 · 돌 때 손대지 않는다 · 칩은 도구로 치운다</strong>. 선반·드릴·밀링 모두 같다. 밀링 커터는 <strong>절단점</strong>을 만드는 대표 부위다.<br><strong>칩 브레이커는 선반, 브러시는 공통</strong>이다. 밀링 커터는 <strong>절단점</strong>을 만들고 회전하므로 <strong>장갑 금지 · 정지 후 작업</strong>이 대원칙이다.</p>", "nq": 2}, "card_mac_t036": {"kind": "공식형", "fq": 2, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "원주속도 V = pi D N", "front": "원주속도 V = pi D N의 식은?", "back": "<ul><li>$V = \\pi D N$다. 지름을 [m]로 바꾸면 $V = \\pi \\times 0.3 \\times 500 \\fallingdotseq 471$ [m/min]이다.</li><li>$V = \\pi D N = \\pi \\times 0.2 \\times 300 \\fallingdotseq 188.5$ [m/min]이다.</li></ul><p><strong>◈ 암기</strong> $V = \\pi D N$ — <u>지름을 미터로 바꾼 뒤 곱한다</u>. · <u>지름을 미터로 바꿔 </u>$\\pi$<u>와 회전수를 곱한다</u>.</p><p>단위를 맞추는 것이 전부다. <strong>[m/min] 이면 D를 [m]로</strong>, <strong>[m/s] 면 </strong>$\\pi D N / 60$이다. 문제에서 [mm]로 준 지름을 그대로 쓰면 1,000배가 틀린다.<br><strong>[m/min] 이면 D를 [m]로</strong>, <strong>[m/s] 면 </strong>$\\pi D N / 60$이다. <strong>반지름이 아니라 지름</strong>을 쓴다는 것도 실수하기 쉬운 자리다.</p>", "nq": 2}, "card_mac_t088": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "정비 등의 작업 시의 운전정지", "front": "정비 등의 작업 시의 운전정지는?", "back": "<strong>열쇠는 그 작업을 하는 사람이 직접 지녀야</strong> 한다. 찾기 쉬운 곳에 두면 잠금장치를 단 뜻이 사라진다.<p><strong>◈ 암기</strong> <u>열쇠는 작업자가 직접 지닌다</u>.</p><p><strong>LOTO(Lock Out, Tag Out)</strong>의 핵심은 <strong>잠그고 · 표찰을 붙이고 · 열쇠는 작업자가 지닌다</strong> 세 가지다. 열쇠를 남이 만질 수 있으면 잠금이 아니다.</p><p><em>근거 — 안전보건규칙 제92조</em></p>", "nq": 1}, "card_mac_t089": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "인장시험과 응력-변형률 선도", "front": "인장시험과 응력-변형률 선도는?", "back": "<strong>인장시험</strong>이다. 시편을 잡아당기며 <strong>응력-변형률 선도</strong>를 그리면 <strong>비례한도 · 탄성한도 · 항복점 · 인장강도 · 파단점</strong>을 모두 읽을 수 있다.<p><strong>◈ 암기</strong> <u>항복점은 인장시험으로</u>.</p><p><strong>항복점</strong>은 <strong>하중을 더 늘리지 않아도 변형이 계속 늘어나기 시작하는 점</strong>이다. 이 점을 넘으면 힘을 빼도 원래대로 돌아가지 않는다(소성변형).</p>", "nq": 1}, "card_mac_t023": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "사출성형기 등의 방호장치", "front": "사출성형기 등의 방호장치는?", "back": "<ul><li>게이트 가드식은 <strong>문을 닫아야만 동작</strong>하는 것이 연동구조다. 「닫지 않아도 동작」하면 방호장치가 아니다.</li><li>게이트 가드식은 <strong>문을 닫아야 비로소 기계가 움직이는</strong> 연동구조라야 한다. 「문을 닫지 않아도 동작」은 정반대다.</li></ul><p><strong>◈ 암기</strong> <u>연동은 「닫아야 돈다」</u> — 반대로 적으면 오답. · <u>문이 닫혀야 움직인다</u>.</p><p><strong>연동(interlock)</strong>은 「조건이 갖춰져야 움직인다」는 뜻이다. 문이 열려 있으면 아예 동작하지 않게 만드는 것이 핵심이다.<br><strong>연동(interlock)</strong>은 <strong>문이 닫혀야 작동하고, 열리면 멈추는</strong> 구조다. 「닫지 않아도 동작한다」면 연동이 아니라 그냥 문이 달린 것일 뿐이다.</p><p><em>근거 — 안전보건규칙 제121조</em></p>", "nq": 2}, "card_mac_t090": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "소음의 방지대책", "front": "소음의 방지대책은?", "back": "<ul><li><strong>보호구 착용</strong>은 <strong>수음자(사람) 대책</strong>이다. 소음원 대책이 아니다.</li><li><strong>「적응」은 참고 견디는 것</strong>이지 대책이 아니다. <strong>귀는 익숙해지는 것이 아니라 나빠진다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>보호구는 사람 쪽 대책</u>. · <u>적응은 대책이 아니다</u>.</p><p><strong>보호구는 언제나 마지막</strong>이다. 위험관리의 우선순위(제거 → 공학적 → 관리적 → 보호구)와 같은 논리다.<br><strong>나는 곳 → 가는 길 → 듣는 사람</strong> 순으로 손댄다. <strong>「적응」 · 「참는다」 · 「익숙해진다」 같은 말은 어떤 유해요인에서도 대책이 되지 않는다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">소음 대책의 우선순위</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">순위</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대책</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>음원 대책</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>설비 밀폐 · 차음벽 · 소음기와 흡음장치 · 저소음 기계로 교체</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전파경로 대책</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">거리 두기 · 차폐물 · 지향성 조절</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수음자 대책</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>귀마개 · 귀덮개</u> · 작업시간 단축</td></tr></tbody></table></div>", "nq": 2}, "card_mac_t026": {"kind": "공식형", "fq": 2, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "양수기동식 방호장치의 안전거리", "front": "양수기동식 방호장치의 안전거리의 식은?", "back": "<ul><li>$D_{m} = 1.6 T_{m}$, $T_{m} = ( \\dfrac{1}{\\text{클러치 개소수}} + \\dfrac{1}{2} ) \\times \\dfrac{60 {,} 000}{\\mathrm{SPM}}$이다. $T_{m} = ( 1 / 6 + 1 / 2 ) \\times 60 {,} 000 / 200 = 0.667 \\times 300 = 200$ [ms]이므로 $D_{m} = 1.6 \\times 200 = 320$ [mm]다.</li><li>$D_{m} = 1 {,} 600 \\times T_{m}$이다. $1 {,} 600 \\times 0.5 = 800$ [mm]다.</li><li>$D_{m} = 1 {,} 600 \\times T_{m} = 1 {,} 600 \\times 0.15 = 240$ [mm] = <strong>24 [cm]</strong>다.</li></ul><p><strong>◈ 암기</strong> $D_{m} = 1.6 T_{m}$, $T_{m}$은 <u>(1/개소수 + 1/2) × 60,000/SPM</u>. · <u>1,600 × 시간</u> — 답은 [mm].</p><p>계수 <strong>1.6</strong>은 사람 손의 접근속도 <strong>1.6 [m/s]</strong>에서 왔다. 광전자식은 $D = 1.6 ( T_{l} + T_{s} )$로 식이 다르다.<br>1,600 [mm/s]는 <strong>사람 손이 움직이는 속도</strong>로 잡은 값이다. <strong>손이 위험구역에 닿기 전에 슬라이드가 내려와 버리도록</strong> 두 손 버튼을 그만큼 떨어뜨려 둔다.</p><div style=\"margin:12px 0 2px;font-weight:700\">프레스 방호장치의 안전거리</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방호장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:cente  · 호흡중추 마비</u> 셋.</p><p>세 가지가 모두 <strong>심장이 멈추거나 숨이 멎는</strong> 것이다. 그래서 응급처치도 <strong>인공호흡과 심폐소생술</strong>로 이어진다.<br>세 가지 모두 <strong>심장이 멈추거나 숨이 멎는</strong> 것이다. <strong>「혈압이 약해져」</strong>라는 표현은 어느 메커니즘에도 없다.</p><div style=\"margin:12px 0 2px;font-weight:700\">감전사(전격사)의 세 가지 메커니즘</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">메커니즘</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇이 멈추나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>심실세동</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>심장의 펌프 기능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 흔하다</u> · $I = 165 / \\sqrt{T}$ [mA]</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>흉부 근육 수축에 의한 질식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>숨쉬기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">가슴 근육이 굳는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>호흡중추신경 마비</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>숨쉬기(뇌 쪽)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">머리를 지나는 통전</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t096": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "이동식 전기기기의 감전 방지", "front": "이동식 전기기기의 감전 방지는?", "back": "<strong>접지설비</strong>다. 누전된 전류를 <strong>대지로 흘려보내</strong> 사람 쪽으로 가지 못하게 한다.<p><strong>◈ 암기</strong> <u>누전 전류의 길을 대지로</u>.</p><p>이동식 기기는 <strong>코드가 끌리며 피복이 상하기 쉬워</strong> 누전 위험이 크다. 그래서 <strong>접지 + 누전차단기</strong>를 함께 갖추고, <strong>이중절연 구조</strong> 라면 접지를 생략할 수 있다.</p>", "nq": 1}, "card_ele_t070": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "누전차단기의 설치와 생략", "front": "누전차단기의 설치와 생략은?", "back": "<ul><li><strong>도전성이 높은 장소</strong>는 물기나 금속이 많아 감전 위험이 크므로 <strong>반드시 누전차단기를 달아야</strong> 한다. 나머지 셋은 생략할 수 있는 경우다.</li><li><strong>대지전압 150 [V]를 넘으면</strong> 반드시 누전차단기를 달아야 한다. 나머지 셋은 생략할 수 있는 경우다.</li></ul><p><strong>◈ 암기</strong> <u>도전성이 높으면 반드시 설치</u>. · <u>150 [V] 초과면 설치</u>.</p><p>생략의 논리는 하나다 — <strong>누전차단기가 없어도 감전될 길이 없는 경우</strong>. 거꾸로 <strong>물기나 도전성이 높으면 그 길이 활짝 열려</strong> 있으므로 반드시 달아야 한다.<br><strong>150 [V]</strong>라는 숫자가 갈림길이다. 생략의 논리는 하나 — <strong>누전차단기가 없어도 감전될 길이 없는 경우</strong>다.</p><div style=\"margin:12px 0 2px;font-weight:700\">누전차단기를 생략할 수 있는 경우</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">경우</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>이중절연 구조의 기계·기구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>절연이 두 겹</u>이라 사람에게 닿지 않는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>비접지식 전로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>대지로 흐르는 길</u>이 없다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>절연대 위에서 사용</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사람이 대지와 끊겨</u> 있다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>대지전압 150 [V] 이하</u>를 물기 없는 곳에</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">위험이 낮다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>건조한 장소</u>에 시설</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">위험이 낮다</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t097": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "전격 위험도의 결정 인자", "front": "전격 위험도의 결정 인자는?", "back": "<ul><li><strong>전압</strong>은 직접 인자가 아니다. 전격의 정도를 정하는 것은 <strong>전류의 크기 · 통전시간 · 통전경로</strong> 세 가지다.</li><li><strong>전압</strong>은 주된 인자가 아니다. 셋은 <strong>통전전류 · 통전시간 · 통전경로</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>전압이 아니라 전류</u>. · <u>전압이 아니라 전류 · 시간 · 경로</u>.</p><p>전압은 <strong>인체저항과 함께 전류를 만드는 재료</strong>일 뿐, 위험을 결정하는 것은 <strong>실제로 몸에 흐른 전류</strong>다. 같은 전압이라도 젖어 있으면 전류가 훨씬 커진다.<br>전압은 <strong>인체저항과 함께 전류를 만드는 재료</strong>일 뿐이다. 같은 전압이라도 <strong>젖어 있으면 전류가 25배</strong>로 커진다. 결국 <strong>몸에 실제로 흐른 전류</strong>가 위험을 정한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">감전 위험도를 정하는 인자</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">인자</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>통전전류의 크기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 중요한 1차 인자</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>통전시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$I = 165 / \\sqrt{T}$ — 짧을수록 견딘다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>통전경로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>왼손 → 가슴이 가장 위험(1.5)</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전원의 종류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">교류가 직류보다 위험</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>주파수와 파형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">상용주파수(60 [Hz])가 위험</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t038": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "교류 아크 용접기의 자동전격방지장치", "front": "교류 아크 용접기의 자동전격방지장치는?", "back": "<ul><li><strong>25 [V] 이하</strong>로 떨어뜨린다. 용접하지 않는 동안 홀더에 걸린 <strong>무부하 전압 60~95 [V]</strong>가 그대로 남아 있으면 감전 위험이 크기 때문이다.</li><li>거꾸로다. <strong>용접할 때는 주회로를 닫고(ON), 용접하지 않을 때 연다(OFF)</strong>. 아크가 끊긴 뒤 <strong>1초 이내에 25 [V] 이하</strong>로 떨어뜨린다.</li><li>접점방식(Magnet식)은 <strong>지동시간 1 ± 0.3초, 무부하전압 25 [V] 이하</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>1초 안에 25 [V] 아래로</u>. · <u>쉴 때 끊고, 용접할 때 붙인다</u>.</p><p><strong>1초 이내, 25 [V] 이하</strong> 두 숫자가 함께 나온다. 습윤한 장소나 철골 위처럼 위험한 곳에서는 <strong>반드시 설치</strong>해야 한다.<br>교류 아크 용접기의 무부하 전압은 <strong>60~95 [V]</strong>로 감전 위험이 크다. 그래서 <strong>쉬는 동안만 전압을 낮춰 두었다가, 용접봉이 모재에 닿는 순간 정상 전압을 공급</strong>한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">자동전격방지장치의 방식별 성능</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">지동시간</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무부하전압</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접점방식(Magnet식)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 ± 0.3초</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>25 [V] 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무접점방식(SCR·TRIAC식)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 ± 0.3초</u> 또는 <u>1.5 ± 0.06초</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>25 [V] 이하</u> (30 [V] 이하인 것도)</td></tr></tbody></table></div>", "nq": 3}, "card_ele_t098": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "누전차단기의 시설방법", "front": "누전차단기의 시설방법은?", "back": "인체감전보호형은 <strong>0.03초 이내</strong>에 동작해야 한다. 0.05초가 아니다.<p><strong>◈ 암기</strong> <u>0.05초가 아니라 0.03초</u>.</p><p><strong>인체감전보호용은 30 [mA] · 0.03초</strong>다. 물기 있는 곳은 <strong>15 [mA] · 0.03초</strong>다. <strong>시간은 두 경우 모두 0.03초</strong>로 같다.</p>", "nq": 1}, "card_ele_t099": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "", "mid": "과전류차단장치", "front": "과전류차단장치는?", "back": "<strong>직렬</strong>이다. 전류가 반드시 차단장치를 지나가야 끊을 수 있으므로 <strong>전로에 직렬</strong>로 넣는다.<p><strong>◈ 암기</strong> <u>전로에 직렬, 접지선에는 금지</u>.</p><p><strong>접지선에는 절대 달지 않는다</strong>. 접지선에 차단장치를 달면 그것이 끊겼을 때 <strong>접지 자체가 사라져</strong> 오히려 위험해진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">안전보건규칙 제305조 — 과전류차단장치</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">요건</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접지선이 아닌 전로에 직렬로 연결</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>병렬이면 전류가 우회한다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>차단기·퓨즈는 계통에서 발생하는 최대 과전류에 견딜 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>동일 회로에 둘 이상 설치하는 경우 순차적으로 차단되게 할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">선택 차단</td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제305조</em></p>", "nq": 1}, "card_ele_t100": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "안전전압과 충전부 방호", "front": "안전전압과 충전부 방호는?", "back": "<strong>대지전압 30 [V] 이하</strong>면 전기위험 방지조치를 하지 않아도 된다. 우리나라의 <strong>안전전압</strong>이 30 [V]다.<p><strong>◈ 암기</strong> <u>우리나라 안전전압은 30 [V]</u>.</p><p>세 숫자를 갈라 둔다 — <strong>30 [V]는 안전전압(방호조치 생략)</strong>, <strong>50 [V] 초과는 누전차단기 시설 대상</strong>, <strong>150 [V] 초과는 접지 대상</strong>이다.</p>", "nq": 1}, "card_ele_t101": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "내압(耐壓) 방폭구조의 시험", "front": "내압(耐壓) 방폭구조의 시험은?", "back": "<strong>절연시험</strong>은 내압방폭구조의 주요 시험항목이 아니다. <strong>폭발강도 · 인화시험 · 기계적 강도시험</strong> 셋이다.<p><strong>◈ 암기</strong> <u>폭발강도 · 인화 · 기계적 강도</u> 셋.</p><p>세 시험이 곧 내압방폭구조의 세 요건과 나란하다 — <strong>압력에 견딘다(폭발강도) · 화염이 새지 않는다(인화시험) · 튼튼하다(기계적 강도)</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">내압방폭구조의 주요 시험</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">시험</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 보나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>폭발강도 시험</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안에서 터진 압력에 견디는가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">용기가 깨지면 안 된다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인화시험</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>화염이 밖으로 새어 불을 붙이는가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">화염일주한계의 확인</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기계적 강도시험</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>충격에 견디는가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">외부 충격</td></tr></tbody></table></div>", "nq": 1}, "card_ele_t075": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "폭발위험장소의 구분", "front": "폭발위험장소의 구분은?", "back": "<ul><li><strong>탱크 안 액면 위의 공간</strong>은 <strong>늘 증기로 차 있으므로 0종 장소</strong>다.</li><li><strong>2종 장소</strong>다. <strong>평소에는 없고, 이상이 생겼을 때만 잠깐</strong> 생기는 곳이다.</li><li><strong>「23종 장소」는 없다</strong>. 분진은 <strong>20 · 21 · 22종</strong> 셋뿐이다.</li></ul><p><strong>◈ 암기</strong> <u>액면 위 공간은 0종</u>. · <u>늘 0종, 가끔 1종, 이상 시 2종</u>.</p><p><strong>「탱크 안」이면 0종, 「탱크 밖 개구부 부근」이면 1종</strong>으로 가르면 대부분 맞는다. <strong>0종 장소에는 본질안전 방폭구조 ia 만</strong> 쓸 수 있다.<br>세 장소를 시간으로 가른다 — <strong>0종은 늘, 1종은 가끔(정상 운전 중), 2종은 이상 시에만 잠깐</strong>. <strong>2종 장소에는 n(비점화) 방폭구조</strong>까지 쓸 수 있다.</p><div style=\"margin:12px 0 2px;font-weight:700\">위험장소의 구분</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">가스가 있는 정도</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>0종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>계속 또는 장시간 존재</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>탱크 안 액면 상부의 공간부</u> · 개방용기 내부</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정상 운전 중 때때로 생김</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>벤트 개구부 부근 · 점검수리 시 밸브 부근 · 충전 중 개구부 부근</u> · 맨홀 부근</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이상 시에만 잠깐</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">환기가 잘 되는 곳 · 밀폐 용기가 손상될 때만</td></tr></tbody></table></div>", "nq": 6}, "card_ele_t102": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "방폭기기의 온도등급", "front": "방폭기기의 온도등급은?", "back": "<ul><li><strong>T2는 300 [℃] 이하</strong>다.</li><li><strong>T1은 450 [℃] 이하</strong>가 맞다. 나머지 셋은 값이 어긋난다.</li><li><strong>200 [℃] 초과 300 [℃] 이하가 T2</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>450 · 300 · 200 · 135 · 100 · 85</u>. · <u>T2는 200 ~ 300 [℃]</u>.</p><p><strong>숫자가 클수록 허용온도가 낮다</strong>. 기기 표면이 <strong>그 가스의 발화점보다 낮아야</strong> 하므로, 발화점이 낮은 가스일수록 높은 등급(T5·T6)이 필요하다.<br>여섯 값을 <strong>450 · 300 · 200 · 135 · 100 · 85</strong>로 통째로 외운다. <strong>숫자를 조금씩 비틀어 놓는 것</strong>이 이 유형의 함정이라, 정확히 외우지 않으면 걸린다.</p><div style=\"margin:12px 0 2px;font-weight:700\">온도등급과 최고표면온도</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">등급</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">최고표면온도</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">등급</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">최고표면온도</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>T1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>450 [℃]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>T4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>135 [℃]</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>T2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>300 [℃]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>T5</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>100 [℃]</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>T3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>200 [℃]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>T6</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>85 [℃]</u></td></tr></tbody></table></div>", "nq": 5}, "card_ele_t103": {"kind": "공식형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기 일반", "mid": "정전기 에너지 W = {1} over {2} C V^2", "front": "정전기 에너지 W = {1} over {2} C V^2의 식은?", "back": "$W = \\dfrac{1}{2} C V^{2} = \\dfrac{1}{2} \\times 20 \\times 10^{-6} \\times ( 2 \\times 10^{3} )^{2} = \\dfrac{1}{2} \\times 20 \\times 10^{-6} \\times 4 \\times 10^{6} = 40$ [J]이다.<p><strong>◈ 암기</strong> $W = \\dfrac{1}{2} C V^{2}$ — <u>1/2을 잊지 않는다</u>.</p><p><strong>[μF]는 </strong>$10^{-6}$<strong>, [kV]는 </strong>$10^{3}$이고 <strong>전압은 제곱</strong>된다. $1 / 2$를 빠뜨려 두 배로 답하는 것이 가장 흔한 실수다.</p>", "nq": 1}, "card_ele_t028": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기설비", "mid": "차단기의 종류와 소호 방식", "front": "차단기의 종류와 소호 방식은?", "back": "<ul><li><strong>MCCB(배선용 차단기)</strong>다. 이름 그대로 <strong>몰드(절연물) 케이스</strong> 안에 개폐기구가 통째로 들어 있다.</li><li><strong>ACB(Air Circuit Breaker)</strong>다. <strong>대기(Air) 중에서 아크를 끄는</strong> 저압 대용량 차단기다.</li></ul><p><strong>◈ 암기</strong> <u>몰드 케이스면 MCCB</u>. · <u>기중 차단기 = ACB</u>.</p><p><strong>MCCB는 과부하와 단락</strong>, <strong>ELB(누전차단기)는 누전</strong>을 맡는다. 역할이 다르다.<br><strong>「기중(氣中)」은 「공기 중」</strong>이라는 뜻이다. 이름 그대로 옮기면 Air Circuit Breaker다.</p><div style=\"margin:12px 0 2px;font-weight:700\">차단기 — 아크를 무엇으로 끄는가</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기호</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">소호 매질</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">전압</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>OCB</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">기름</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">고압</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">화재 위험</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>VCB</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">진공</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">고압</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">가장 널리 쓰임</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>GCB</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">SF6 가스</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">특고압</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>ACB</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">공기</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">저압 대용량</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>MCCB</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">몰드 케이스</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>저압</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>과부하·단락 차단</u></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t104": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기설비", "mid": "단로기(DS)와 차단기(CB)의 조작 순서", "front": "단로기(DS)와 차단기(CB)의 조작 순서는?", "back": "<strong>단로기(DS)는 부하전류를 끊지 못한다</strong>. 그래서 <strong>차단할 때는 차단기 ㉯(OCB)를 먼저 열고</strong> 부하측 ㉰, 전원측 ㉮ 순으로 단로기를 연다 — <strong>㉯ → ㉰ → ㉮</strong>. 투입은 그 반대로 <strong>단로기 ㉰ → ㉮ 를 먼저 닫고 차단기 ㉯ 를 마지막에</strong> 닫는다 — <strong>㉰ → ㉮ → ㉯</strong>다.<p><strong>◈ 암기</strong> <u>끊을 때는 차단기가 먼저, 넣을 때는 차단기가 마지막</u>.</p><p><strong>단로기(DS)는 전류를 끊는 기기가 아니다</strong>. 무부하 상태에서 회로를 눈에 보이게 갈라 놓는 것이 역할이다. 부하가 걸린 채 열면 <strong>아크가 크게 튀어</strong> 화상과 화재로 이어진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">차단기(CB)와 단로기(DS)의 조작 순서</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">차단할 때</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">투입할 때</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">무엇이 먼저</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>차단기를 먼저 연다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>단로기를 먼저 닫는다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">순서</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>㉯(OCB) → ㉰(부하측 DS) → ㉮(전원측 DS)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>㉰(부하측 DS) → ㉮(전원측 DS) → ㉯(OCB)</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">까닭</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>단로기는 무부하에서만 조작한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">같은 이유</td></tr></tbody></table></div>", "nq": 1}, "card_ele_t105": {"kind": "단답형", "fq": 1, "subject": " e=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>금속 나트륨 · 칼륨</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수소 H₂</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">격렬한 발열</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>수소화리튬 LiH</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수소 H₂</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>알루미늄 분말</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수소 H₂</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 3}, "card_chm_t081": {"kind": "공식형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "최소산소농도(MOC)", "front": "최소산소농도(MOC)의 식은?", "back": "<ul><li>$\\mathrm{MOC} = \\text{폭발하한계} \\times \\text{산소의 양론계수}$다. $C_{4} H_{10} + 6.5 O_{2} \\rightarrow 4 CO_{2} + 5 H_{2} O$이므로 계수는 6.5다. $1.6 \\times 6.5 = 10.4$ [vol%]다.</li><li>$C_{3} H_{8} + 5 O_{2} \\rightarrow 3 CO_{2} + 4 H_{2} O$이므로 산소의 양론계수는 5다. $\\mathrm{MOC} = 2.2 \\times 5 = 11.0$ [vol%]다.</li><li>프로판은 $C_{3} H_{8} + 5 O_{2} \\rightarrow 3 CO_{2} + 4 H_{2} O$이다. $\\mathrm{MOC} = \\mathrm{LFL} \\times \\dfrac{\\text{산소 몰수}}{\\text{연료 몰수}} = 2.2 \\times 5 = 11$ [vol%]다.</li></ul><p><strong>◈ 암기</strong> $\\mathrm{MOC} = \\mathrm{LFL} \\times ( n + m / 4 )$. · $\\mathrm{MOC} = \\mathrm{LFL} \\times \\text{산소 양론계수}$.</p><p>산소의 양론계수는 $n + m / 4$로 구한다. 부탄은 $4 + 10 / 4 = 6.5$다. 실무에 까지</u></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제270조</em></p>", "nq": 2}, "card_chm_t103": {"kind": "단답형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "유해화학물질", "mid": "독성가스와 불연성가스", "front": "독성가스와 불연성가스는?", "back": "<strong>질소</strong>는 <strong>불연성이자 무독성</strong> 가스다. 다만 <strong>산소를 밀어내 질식</strong>을 일으킬 수는 있다.<p><strong>◈ 암기</strong> <u>질소는 무독성</u>.</p><p><strong>암모니아와 황화수소는 가연성이면서 독성</strong>이라는 점이 특징이다. <strong>질소는 어느 쪽도 아니지만 질식성</strong>이라 밀폐공간에서는 위험하다.</p><div style=\"margin:12px 0 2px;font-weight:700\">가스의 성질에 따른 분류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">갈래</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>가연성 가스</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">스스로 탄다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">수소 · 메탄 · 아세틸렌 · <u>일산화탄소</u> · <u>암모니아</u> · <u>황화수소</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>조연성 가스</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">남을 태운다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">산소 · 오존 · 염소 · 불소</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>불연성 가스</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">타지도 태우지도 않는다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>질소 · 아르곤 · 이산화탄소 · 헬륨</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>독성 가스</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">적은 양으로 해롭다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>포스겐 0.1 · 황화수소 10 · 암모니아 25 · 일산화탄소 30</u> [ppm]</td></tr></tbody></table></div>", "nq": 1}, "card_chm_t104": {"kind": "단답형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "유해화학물질", "mid": "가연성이면서 독성인 가스", "front": "가연성이면서 독성인 가스는?", "back": "<strong>일산화탄소</strong>다. <strong>폭발범위 12.5 ~ 74 [vol%]의 가연성</strong> 이면서 <strong>허용농도 30 [ppm]의 독성</strong>이다.<p><strong>◈ 암기</strong> <u>일산화탄소는 가연성 + 독성</u>.</p><p><strong>일산화탄소 · 암모니아 · 황화수소 · 산화에틸렌 · 시안화수소</strong>가 대표적으로 두 성질을 함께 지닌다. 이런 가스는 <strong>가스누출감지경보기를 독성 기준(허용농도 이하)</strong>으로 맞춘다.</p>", "nq": 1}, "card_chm_t025": {"kind": "단답형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "분말소화약제의 종류와 적응 화재", "front": "분말소화약제의 종류와 적응 화재는?", "back": "<ul><li><strong>제1종은 탄산수소나트륨(NaHCO₃)</strong>이다. 백색이며 <strong>B·C급</strong>에 쓴다.</li><li><strong>제1인산암모늄(NH₄H₂PO₄)</strong>은 <strong>제3종 분말소화약제</strong>다. <strong>A·B·C 급 모두</strong>에 쓸 수 있어 가장 널리 쓰인다.</li><li><strong>제1인산암모늄(NH₄H₂PO₄)</strong>이다. <strong>제3종 분말소화약제</strong>로 <strong>A·B·C 급 모두</strong>에 쓸 수 있다.</li></ul><p><strong>◈ 암기</strong> <u>1종 나트륨 · 2종 칼륨 · 3종 인산암모늄(ABC) · 4종 칼륨+요소</u>. · <u>ABC 급이면 제1인산암모늄</u>.</p><p><strong>제3종만 A급까지 통한다</strong>. 그래서 일반 건물의 소화기가 대부분 ABC 분말이다.<br><strong>제3종만 A급까지 통한다</strong>. 인산암모늄이 열을 받으면 <strong>메타인산(HPO₃)</strong>이 되어 <strong>타는 물질 표면에 막을 만들어</strong> 산소를 끊기 때문이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">분말소화약제의 종류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:1 lid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제4종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">탄산수소칼륨 + 요소</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">회색</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">B · C</td></tr></tbody></table></div>", "nq": 3}, "card_chm_t093": {"kind": "단답형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "화재·소화", "mid": "차단밸브의 설치 금지", "front": "차단밸브의 설치 금지는?", "back": "<ul><li>파열판과 안전밸브를 <strong>직렬</strong>로 설치한 경우가 아니라 <strong>병렬로 설치한 경우</strong>다.</li><li>자동압력조절밸브와 안전밸브는 <strong>직렬이 아니라 병렬</strong>로 연결되어야 한다. 직렬이면 한쪽이 막혔을 때 압력을 뺄 길이 사라진다.</li></ul><p><strong>◈ 암기</strong> <u>직렬이 아니라 병렬</u>. · <u>1/2 이상, 병렬로</u>.</p><p>예외의 공통점은 하나다 — <strong>하나를 잠가도 압력을 뺄 다른 길이 남아 있는가</strong>. <strong>직렬이면 하나만 막혀도 길이 끊기므로</strong> 예외가 될 수 없다.<br>예외의 공통점은 하나 — <strong>하나를 잠가도 압력을 뺄 다른 길이 남아 있는가</strong>. <strong>직렬이면 길이 하나뿐</strong>이라 예외가 될 수 없다. <strong>1/4과 1/2, 직렬과 병렬</strong> 두 군데가 바뀌어 있다.</p><div style=\"margin:12px 0 2px;font-weight:700\">차단밸브를 달 수 있는 예외 (규칙 제266조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">경우</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전밸브등이 복수방식으로 설치되어 있는 경우</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">하나를 잠가도 다른 하나가 남는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>예비용 설비를 설치하고 각각에 안전밸브등이 설치된 경 g>한다. 물보다 무겁고 물에 녹지 않아 물이 위를 덮으면 증발이 막힌다. 인화점이 −30 [℃]로 매우 낮아 증기를 막는 것이 관건이다.</li><li><strong>니트로셀룰로오스는 오히려 물이나 알코올로 적셔 보관</strong>한다. 건조하면 마찰과 충격만으로도 분해·발화하기 때문이다.</li></ul><p><strong>◈ 암기</strong> <u>이황화탄소는 물속에 저장</u> — 위험이 아니라 대책. · <u>니트로셀룰로오스는 적셔서 보관</u>.</p><p>저장법이 정반대인 것들을 짝으로 외운다 — <strong>황린과 이황화탄소는 물속</strong>, <strong>나트륨·칼륨은 석유 속</strong>, <strong>카바이드는 건조한 밀폐</strong>.<br>위험한 조합의 뿌리는 <strong>산화성 + 가연성</strong>이다. <strong>니트로셀룰로오스와 물</strong>은 그 조합이 아니라 <strong>보관 방법</strong>이다. 100번 유형에서는 <strong>물속·물에 적셔 두는 물질</strong>이 답인 경우가 많다.</p>", "nq": 2}, "card_con_t024": {"kind": "단답형", "fq": 3, "subject": "건설안전기술", "chapter": "가시설물", "mid": "거푸집 동바리 조립 시 안전조치", "front": "거푸집 동바리 조립 시 안전조치는?", "back": "<ul><li>파이프서포트는 <strong>3개 이상 이어서 쓰지 않는다</strong>. 4개가 아니다. 이을수록 좌굴에 약해지기 때문이다.</li><li>동바리의 이음은 <strong>맞댄이음이나 장부이음으로 하여야</strong> 한다. 「피할 것」은 반대다.</li><li><strong>3개 이상 이어서 쓰지 않는다</strong>. 이을수록 <strong>좌굴에 약해지기</strong> 때문이다.</li></ul><p><strong>◈ 암기</strong> <u>파이프서포트는 3개 이상 이으면 안 된다</u>. · <u>맞댄이음·장부이음은 「하라」는 것</u>.</p><p>파이프서포트를 이을 때는 <strong>볼트 또는 전용철물 4개 이상</strong>으로 조인다. 「<strong>3개 금지, 4개 조임</strong>」 두 숫자가 함께 나온다.<br><strong>맞댄이음과 장부이음</strong>은 축력이 <strong>한 직선으로 곧게 전달되는</strong> 이음이다. 어긋나게 잇거나 겹쳐 대면 <strong>편심이 생겨 좌굴</strong>한다. 그래서 이 둘로 하라는 것이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">파이프서포트 동바리의 기준</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-alig le=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>5억원 이상 50억원 미만</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>대상액 × 비율 + 기초액</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기초액이 붙는 구간</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>50억원 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>대상액 × 비율</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>대상액이 구분되지 않을 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>총 공사금액의 70 [%]</u>를 대상액으로</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_con_t100": {"kind": "공식형", "fq": 1, "subject": "건설안전기술", "chapter": "건설공사 안전개요", "mid": "권상용 와이어로프의 안전계수", "front": "권상용 와이어로프의 안전계수의 식은?", "back": "<ul><li>권상용 와이어로프의 안전계수는 <strong>5 이상</strong>이다. 4가 아니다.</li><li>항타기·항발기 권상용 와이어로프의 <strong>안전계수는 5 이상</strong>이므로 $\\dfrac{100}{5} = 20$ [t] 까지다.</li></ul><p><strong>◈ 암기</strong> <u>권상용 와이어로프는 5 이상</u>. · <u>권상용 와이어로프는 안전계수 5</u>.</p><p><strong>사람이 매달리는 줄일수록 안전계수가 크다</strong> — <strong>달비계 와이어로프 10 · 달기 체인과 권상용 와이어로프 5 · 훅과 섀클 3 · 그 밖의 것 4</strong>. 항타기의 권상용은 <strong>5</strong>다.<br><strong>항타기·항발기의 권상용 와이어로프는 안전계수 5 이상</strong>이다. <strong>양중기의 「화물의 하중을 직접 지지하는 달기 와이어로프」도 5 이상</strong>이라 같은 값이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">항타기·항발기의 와이어로프 기준</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>권상용 와이어로프의 안전계수</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>5 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>4가 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>드럼에 남는 감김 수</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>2회 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>끊어진 소선의 수</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>10 [%] 이상이면 사용 금지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">필러선 제외</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지름의 감소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>공칭지름의 7 [%] 초과면 사용 금지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제210조</em></p>", "nq": 2}}};</script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const STUDY=MODE==='study';
const KEY=(STUDY?'safestudy_':'safecbt_')+D.round;
let S={i:0,ans:{},open:{},started:STUDY?1:0,elapsed:0,done:false};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
if(!S.open)S.open={};
if(STUDY)S.started=1;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function kx(el){if(window.renderMathInElement)renderMathInElement(el,{delimiters:[
 {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}

const MARK=['①','②','③','④'];
const LV={1:['#10b981','쉬움'],2:['#f59e0b','보통'],3:['#ef4444','어려움']};

function fmt(s){const m=Math.floor(s/60),x=s%60;
 return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+':'+String(x).padStart(2,'0');}

let tick=null;
function startTimer(){
 if(STUDY)return;
 clearInterval(tick);tick=setInterval(()=>{
  if(S.done)return;
  S.elapsed++;const left=D.limit-S.elapsed;
  const t=$('#timer'); if(!t)return;
  t.textContent=left>0?fmt(left):'00:00:00';
  t.classList.toggle('warn',left<600);
  if(left<=0)submit();
  if(S.elapsed%10===0)save();
 },1000);}

function intro(){
 $('#app').innerHTML=`<div class="wrap intro">
  <h2>${D.title}</h2>
  <p>6과목 120문항 · 시험시간 3시간</p>
  <p>합격 기준 — 과목당 40점 이상, 전 과목 평균 60점 이상</p>
  <p style="margin-top:14px;font-size:13px">답만 고르고 끝에 제출합니다.
   해설과 암기카드는 채점한 뒤에 열립니다.</p>
  <button class="big" id="go">시험 시작</button>
  ${Object.keys(S.ans).length?'<div style="margin-top:12px;font-size:13px;color:#64748b">이어서 풀면 지난번 답안이 그대로 살아 있습니다</div>':''}
 </div>`;
 $('#go').onclick=()=>{S.started=1;save();render();startTimer();};
}

// 해설이 열려 있는가 — 직접 여닫은 적이 있으면 그 뜻을 따른다
function solOpen(q){
 if(S.open[q.n]!==undefined)return S.open[q.n];
 return S.done||(STUDY&&!!S.ans[q.n]);
}

function qHTML(q){
 const a=S.ans[q.n], graded=(STUDY&&a)||S.done, show=STUDY||S.done;
 let h=`<div class="wrap"><div class="qh"><span class="qno">${String(q.n).padStart(3,'0')}</span>
  <span class="tag" style="background:${LV[q.lv][0]}">난이도 ${q.lv}·${LV[q.lv][1]}</span>
  <span class="tag" style="background:#6366f1">${q.kind}</span>
  <span class="tag" style="background:#f59e0b">빈출 ${'★'.repeat(q.fq)+'☆'.repeat(3-q.fq)}</span>
  <span class="subj">제${q.s}과목 ${D.subj[q.s-1]}</span>`;
 if(show){
   h+=`<span class="acts">
    <button class="mini${solOpen(q)?' on':''}" id="tsol">📖 해설 ${solOpen(q)?'닫기':'보기'}</button>
    ${q.card&&D.cards[q.card]?'<button class="mini cd" id="tcard">🃏 암기카드</button>':''}
   </span>`;
 }
 h+=`</div><div class="stem">${q.t}</div>`;
 if(q.cond)h+=`<div class="cond">${q.cond}</div>`;
 if(q.img)h+=`<img class="stemimg" src="img/${q.img}">`;
 for(let k=0;k<4;k++){
   let cls='opt';
   if(a===k+1)cls+=' sel';
   if(graded){ if(k+1===q.a)cls='opt right'; else if(a===k+1)cls='opt wrong'; }
   h+=`<button class="${cls}" data-k="${k+1}"><span class="n">${MARK[k]}</span><span>${q.c[k]}</span></button>`;
 }
 if(graded){
   h+= a===q.a ? `<div class="vline o">정답입니다 · 정답 ${q.a}번</div>`
              : `<div class="vline x">${a?'틀렸습니다 · 고른 답 '+a+'번 · ':'미응답 · '}정답 ${q.a}번</div>`;
 }
 if(show&&solOpen(q)){
   h+=`<div class="sol"><div class="lbl">해설</div><div>${q.sol}</div>`;
   if(q.w)h+=`<div class="lbl">오답 분석</div><div>${q.w}</div>`;
   if(q.pt)h+=`<div class="lbl g">관련 개념 · 암기</div><div class="box">${q.pt}</div>`;
   if(q.law)h+=q.law;
   h+=`</div>`;
 }
 return h+'</div>';
}

function render(){
 if(!S.started){intro();return;}
 if(!STUDY&&S.done&&S.i<0){result();return;}
 const q=D.q[S.i];
 $('#app').innerHTML=qHTML(q);
 $$('.opt').forEach(b=>b.onclick=()=>{
   S.ans[q.n]=+b.dataset.k;
   if(STUDY&&S.open[q.n]===undefined)S.open[q.n]=true;
   save();
   if(STUDY||S.done){render();}
   else{$$('.opt').forEach(x=>x.classList.toggle('sel',x===b));paint();}
 });
 const ts=$('#tsol'); if(ts)ts.onclick=()=>{S.open[q.n]=!solOpen(q);save();render();};
 const tc=$('#tcard'); if(tc)tc.onclick=()=>openCard(q.card);
 kx($('#app'));
 stat();
 $('#prev').disabled=S.i===0; $('#next').disabled=S.i===119;
 paint();
 window.scrollTo(0,0);
}

function stat(){
 const n=Object.keys(S.ans).length;
 if(STUDY){
   let ok=0; D.q.forEach(q=>{if(S.ans[q.n]===q.a)ok++;});
   $('#prog').innerHTML=`<b>${S.i+1}</b> / 120 · 푼 문항 <b>${n}</b> · 맞힘 <b>${ok}</b>`;
   const r=$('#rate');
   if(r)r.textContent=n?`정답률 ${Math.round(ok/n*100)}%`:'정답률 —';
 }else{
   $('#prog').innerHTML=S.done?`채점 완료`:`<b>${S.i+1}</b> / 120 · 푸는 중 <b>${n}</b>`;
 }
}

/* 암기카드 팝업 */
let mflip=false;
function openCard(id){
 const c=D.cards[id]; if(!c)return;
 mflip=false;
 $('#mbody').innerHTML=`<button class="mx" id="mx">✕</button>
  <div class="mcard" id="mcard">
   <div class="mface">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span class="stars">${'★'.repeat(c.fq)+'☆'.repeat(3-c.fq)}</span>
     <span>${c.subject}${c.chapter?' · '+c.chapter:''}</span>
     <span class="mcid">${id}</span></div>
    <div class="mq">${c.front}</div>
    <div class="mhint">카드를 누르면 뒤집힙니다 · Esc 닫기</div>
   </div>
   <div class="mface back">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span>${c.mid}</span><span class="mcid">${id}</span></div>
    <div class="ma">${c.back}</div>
    <div class="mfoot"><span>이 개념을 묻는 문항 ${c.nq}개</span>
     <a href="../_암기카드.html#${id}" target="_blank">카드 전체 보기 →</a></div>
   </div>
  </div>`;
 $('#modal').classList.add('on');
 kx($('#mbody'));
 fitCard(); setTimeout(fitCard,260);
 $('#mcard').onclick=()=>{mflip=!mflip;$('#mcard').classList.toggle('flip',mflip);};
 $('#mx').onclick=e=>{e.stopPropagation();closeCard();};
}
function fitCard(){
 const mc=$('#mcard'); if(!mc)return;
 mc.style.height='120px';
 const h=Math.max(...[...mc.querySelectorAll('.mface')].map(f=>f.scrollHeight));
 mc.style.height=Math.min(window.innerHeight*0.78,Math.max(300,h+4))+'px';
}
function closeCard(){$('#modal').classList.remove('on');}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeCard();};
window.addEventListener('resize',()=>{if($('#modal').classList.contains('on'))fitCard();});

function paint(){
 $$('.pg').forEach(b=>{
   const n=+b.dataset.n, q=D.q[n-1];
   const marked=STUDY?!!S.ans[n]:S.done;
   let c='pg';
   if(marked&&(STUDY||S.done))c+=(S.ans[n]===q.a?' ok':' no');
   else if(S.ans[n])c+=' done';
   if(n-1===S.i)c+=' cur';
   b.className=c;
 });
}

function submit(){
 if(STUDY||S.done)return;
 const un=120-Object.keys(S.ans).length;
 if(un>0&&!confirm('안 푼 문제가 '+un+'개 있습니다. 제출할까요?'))return;
 S.done=true;clearInterval(tick);save();S.i=-1;result();
}

function result(){
 const per=[0,0,0,0,0,0],tot=[0,0,0,0,0,0];
 let right=0;
 D.q.forEach(q=>{tot[q.s-1]++;if(S.ans[q.n]===q.a){per[q.s-1]++;right++;}});
 const scores=per.map((v,i)=>Math.round(v/tot[i]*100));
 const avg=Math.round(right/120*100);
 const pass=avg>=60&&scores.every(s=>s>=40);
 let h=`<div class="result"><div style="text-align:center;color:#64748b;font-size:13px">${D.title} · 채점 결과</div>
  <div class="score">${avg}<span style="font-size:20px;color:#94a3b8">점</span></div>
  <div style="text-align:center;color:#64748b;font-size:14px">120문항 중 <b>${right}</b>문항 정답 · 소요 ${fmt(S.elapsed)}</div>
  <div class="verdict ${pass?'pass':'fail'}">${pass?'합격':'불합격'}</div>
  <table class="stab"><tr><th>과목</th><th>맞힌 문항</th><th>점수</th></tr>`;
 for(let i=0;i<6;i++){
   h+=`<tr><td style="text-align:left">제${i+1}과목 ${D.subj[i]}</td>
    <td>${per[i]} / ${tot[i]}</td><td class="${scores[i]<40?'bad':''}">${scores[i]}</td></tr>`;
 }
 h+=`</table><div style="font-size:12.5px;color:#64748b;text-align:center">합격 — 과목당 40점 이상, 평균 60점 이상</div>
  <div class="rowbtns">
   <button class="nbtn pri" id="rw">틀린 문제만 다시 보기</button>
   <button class="nbtn" id="rall">전체 해설 보기</button>
   <button class="nbtn" id="rst">다시 풀기</button>
  </div></div>`;
 $('#app').innerHTML=h;
 paint(); stat();
 $('#rw').onclick=()=>{const bad=D.q.findIndex(q=>S.ans[q.n]!==q.a);S.i=bad<0?0:bad;render();};
 $('#rall').onclick=()=>{S.i=0;render();};
 $('#rst').onclick=()=>{if(confirm('답안을 지우고 처음부터 다시 풀까요?')){
   S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();startTimer();}};
}

function build(){
 let p='';
 for(let s=1;s<=6;s++){
   p+=`<div class="palhd">제${s}과목 ${D.subj[s-1]}</div><div class="palgrid">`;
   D.q.filter(q=>q.s===s).forEach(q=>{p+=`<button class="pg" data-n="${q.n}">${q.n}</button>`;});
   p+='</div>';
 }
 $('#pal').innerHTML=p;
 $$('.pg').forEach(b=>b.onclick=()=>{S.i=+b.dataset.n-1;save();render();$('#pal').classList.remove('open');});
}

$('#prev').onclick=()=>{if(S.i>0){S.i--;save();render();}};
$('#next').onclick=()=>{if(S.i<119){S.i++;save();render();}};
$('#palbtn').onclick=()=>$('#pal').classList.toggle('open');
const sb=$('#sub'); if(sb)sb.onclick=submit;
const rs=$('#reset'); if(rs)rs.onclick=()=>{if(confirm('푼 기록을 모두 지울까요?')){
 S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();}};
document.addEventListener('keydown',e=>{
 if($('#modal').classList.contains('on')){
   if(e.key==='Escape')closeCard();
   if(e.key===' '){e.preventDefault();$('#mcard').click();}
   return;
 }
 if(e.key==='ArrowLeft')$('#prev').click();
 if(e.key==='ArrowRight')$('#next').click();
 if('1234'.includes(e.key)){const b=$$('.opt')[+e.key-1];if(b)b.click();}
 if(e.key==='s'||e.key==='S'){const t=$('#tsol');if(t)t.click();}
 if(e.key==='c'||e.key==='C'){const t=$('#tcard');if(t)t.click();}
});
build();
const hm=location.hash.match(/^#q(\d+)/);
if(hm){S.started=1;S.i=Math.max(0,Math.min(119,+hm[1]-1));save();}
if(!STUDY&&S.done){if(hm){render();}else{S.i=-1;result();}}
else{render();if(S.started)startTimer();}
</script>
</body></html>
