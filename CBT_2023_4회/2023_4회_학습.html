ext-align:center;\"><u>우선적 AND</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정해진 순서대로 일어날 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>조합 AND</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>입력 n 개 중 m 개가 일어날 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">2 out of 3 등</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>배타적 OR</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>입력 가운데 하나만 일어날 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">동시에 일어나면 출력 없음</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>억제 게이트</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>조건이 만족될 때만 입력이 출력으로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">조건은 육각형으로</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험지속 게이트</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>입력이 일정 시간 이어질 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t227": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "시성능기준함수(VLB)", "front": "시성능기준함수(VLB)는?", "back": "<strong>언제 어디에 나타날지 「모르는」 경우</strong>를 기준으로 잡는다. <strong>알고 있다면 실제 상황과 어긋나기</strong> 때문이다.<p><strong>◈ 암기</strong> <u>언제 어디인지 모르는 경우</u>.</p><p><strong>실제 작업에서는 무엇이 언제 어디서 나타날지 모른다</strong> — <strong>기준함수는 그 「모르는」 상태를 전제</strong>로 조명수준을 정해야 쓸모가 있다.</p><div style=\"margin:12px 0 2px;font-weight:700\">시성능기준함수(VLB)의 수준 설정</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">설정</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>현실 상황에 맞는 조명수준</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>표적 탐지 활동은 50 ~ 99%</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>표적은 정적인 과녁에서 동적인 과녁으로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>언제 어디에 과녁이 나타날지 모르는 경우</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「아는 경우」가 아니다</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t228": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "연구 기준의 요건", "front": "연구 기준의 요건은?", "back": "<ul><li><strong>민감도</strong>의 설명만 옳다. <strong>①②③은 세 요건의 뜻을 서로 바꿔</strong> 놓았다.</li><li>넷은 <strong>적절성 · 신뢰성 · 무오염성 · 기준척도의 민감도</strong>다. <strong>「다양성」은 들지 않는다</strong>.</li><li><strong>민감도</strong>만 바르게 이어졌다. <strong>앞의 셋은 이름과 내용이 서로 엇갈려</strong> 있다.</li></ul><p><strong>◈ 암기</strong> <u>적절성 · 신뢰성 · 무오염성 · 민감도</u>. · <u>적절성·무오염성·신뢰성·민감도</u>.</p><p><strong>네 요건이 「맞는 것을 재나(적절성) · 늘 같게 재나(신뢰성) · 딴 것이 섞이지 않았나(무오염성) · 차이를 가려내나(민감도)」</strong>다. <strong>설명을 서로 바꿔 놓는 것</strong>이 이 유형의 함정이다.<br><strong>네 요건은 모두 「하나를 제대로 재는가」</strong>를 따진다 — <strong>「여러 가지를 재는가(다양성)」는 애초에 방향이 다른</strong> 말이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">연구(측정) 기준의 네 요건</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">요건</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>적절성(타당성)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>의도한 목적에 들어맞는가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>③이 이 설명이다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>신뢰성(반복성)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>되풀이해도 같은 값이 나오는가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>①이 이 설명이다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무오염성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>재려는 것 말고 다른 변수가 끼어들지 않는가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>②가 이 설명이다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기준척도의 민감도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>차이를 가려낼 만큼 눈금이 잘게 나뉘어 있는가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>④ — 이 문항</u></td></tr></tbody></table></div>", "nq": 3}, "card_erg_t229": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "위험조정기술", "front": "위험조정기술은?", "back": "<ul><li>넷은 <strong>회피 · 감축 · 보류 · 전가</strong>다. <strong>「확인」은 들지 않는다</strong>.</li><li>넷은 <strong>회피 · 감축 · 보류 · 전가</strong>다. <strong>「책임」은 들지 않는다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>회피 · 감축 · 보류 · 전가</u>.</p><p><strong>「피하고 · 줄이고 · 떠안고 · 넘긴다」</strong> 넷이다. <strong>「확인」은 위험을 찾아내는 일(위험분석)이지 조정하는 방법이 아니다</strong>.<br><strong>「피하고 · 줄이고 · 떠안고 · 넘긴다」</strong> 넷이다 — <strong>네 낱말이 모두 「위험을 어떻게 다룰까」</strong> 인데 <strong>「책임」은 그 결과를 누가 지느냐</strong>의 문제다.</p><div style=\"margin:12px 0 2px;font-weight:700\">위험조정기술 네 가지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기술</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>회피(avoidance)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위험한 일을 아예 하지 않는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>감축(reduction)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>일어날 확률이나 크기를 줄인다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">방호장치 · 교육</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>보류(retention)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작은 위험은 스스로 떠안는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">자가보험</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전가(transfer)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>남에게 넘긴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>보험 가입 · 도급</u></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t230": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "인간 오류확률(HEP)", "front": "인간 오류확률(HEP)의 식은?", "back": "<strong>HEP(인간 오류확률)</strong>이다. <strong>시작과 끝이 뚜렷한 하나의 일</strong>을 단위로 삼는다.<p><strong>◈ 암기</strong> <u>셀 수 있는 직무는 HEP</u>.</p><p><strong>일이 「한 번, 두 번」으로 셀 수 있으면 HEP, 「몇 시간 동안」으로 이어지면 </strong>$\\lambda$를 쓴다. <strong>이 문항의 단서 「명확한 시작과 끝」</strong>이 그 갈림선이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인간 신뢰도의 표시</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>HEP</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{인간 오류의 수}}{\\text{오류가 날 수 있었던 기회의 수}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시작과 끝이 뚜렷한 직무</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인간 신뢰도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$R = 1 - \\mathrm{HEP}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>시간에 따라 이어지는 직무</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$R ( t ) = e^{-\\lambda t}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>λ 는 시간당 오류율</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>직렬 작업</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$R = R_{1} \\times R_{2} \\times \\cdots$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t220": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "THERP(인간 오류율 예측기법)", "front": "THERP(인간 오류율 예측기법)은?", "back": "<ul><li><strong>THERP</strong>다. <strong>Technique for Human Error Rate Prediction</strong>의 줄임말로 <strong>인간 오류의 확률을 셈한다</strong>.</li><li><strong>THERP</strong>다. <strong>사람의 오류 확률을 셈해</strong> 인간공학적 대책을 세운다.</li><li><strong>㉡ 이 틀렸다</strong> — THERP는 <strong>정성적이 아니라 정량적</strong>으로 평가한다. 따라서 <strong>㉠ 과 ㉢</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>인간 과오의 정량 평가는 THERP</u>. · <u>THERP는 정량적</u>.</p><p><strong>THERP 만 사람을 다루고 나머지 셋은 기계의 고장</strong>을 다룬다. <strong>「Human Error Rate Prediction」</strong>이라는 이름 자체가 답을 말해 준다.<br><strong>THERP 만 사람을 다루고 나머지는 기계나 관리를 다룬다</strong>. <strong>「Human Error Rate Prediction」</strong>이라는 이름 자체가 답을 말해 준다.</p><div style=\"margin:12px 0 2px;font-weight:700\">주요 분석기법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>THERP</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>인간 오류율을 예측한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사건나무로 인간의 행동을 갈래지어 확률을 매긴다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>FMEA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>부품의 고장 형태와 영향</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기계 쪽</u> · 정성적</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>CA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>치명도 분석</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">고장의 심각성을 등급으로</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>FMECA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>FMEA + CA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 3}, "card_erg_t231": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "시스템 수명주기와 안전", "front": "시스템 수명주기와 안전은?", "back": "<strong>교육훈련을 시작하는 것</strong>은 <strong>생산단계</strong>다.<p><strong>◈ 암기</strong> <u>교육훈련은 생산단계</u>.</p><p><strong>개발은 「도면과 모형으로 따지는」 단계, 생산은 「사람이 실물을 다루기 시작하는」</strong> 단계다 — <strong>사람이 들어오면 교육훈련</strong>이 필요해진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">시스템 수명주기 5단계</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>구상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시스템 안전성에 관한 기본 방침</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">PHA</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정의</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안전성 있는 시스템으로 구체화</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">SSHA</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>개발</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>설계의 수용가능성 검토 · FMEA · OHA의 입력자료</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>생산</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>교육훈련 시작 · 품질관리 · 안전점검</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「교육훈련」은 여기</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>운전(배치)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>운영·유지보수 · 사고조사</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t232": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "평균 고장간격(MTBF)", "front": "평균 고장간격(MTBF)의 식은?", "back": "실제로 돌아간 시간은 $120 - 18 = 102$ 시간이다. $\\mathrm{MTBF} = \\dfrac{102}{9} \\fallingdotseq 11.33$ 시간이다.<p><strong>◈ 암기</strong> <u>MTBF = 가동시간 ÷ 고장 횟수</u>.</p><p><strong>「고장 사이의 시간」이므로 고쳐 세워 둔 18시간은 빼야</strong> 한다. <strong>120을 그대로 9로 나누면 13.33이 나와 보기에 없는</strong> 값이 된다.</p><div style=\"margin:12px 0 2px;font-weight:700\">MTBF · MTTR · 가용도</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>MTBF</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{총 가동시간}}{\\text{고장 횟수}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수리시간을 뺀 가동시간</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>MTTR</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{총 수리시간}}{\\text{고장 횟수}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항이면 2시간</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>MTTF</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{1}{\\lambda}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">수리하지 않는 부품</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>가용도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$A = \\dfrac{\\mathrm{MTBF}}{\\mathrm{MTBF} + \\mathrm{MTTR}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항이면 0.85</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t161": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "인간공학의 가치", "front": "인간공학의 가치는?", "back": "<ul><li>경제성은 <strong>감소가 아니라 증대</strong> 되어야 한다. 방향이 반대다.</li><li>경제성은 <strong>증대</strong> 되어야 한다. <strong>「감소」로 뒤집어</strong> 놓았다.</li></ul><p><strong>◈ 암기</strong> <u>경제성은 증대</u>.</p><p><strong>「비용 · 손실」은 줄고, 「성능 · 이용률 · 경제성 · 수용도」는 늘어나야</strong> 한다. <strong>늘어야 할 것을 「감소」로 뒤집어</strong> 놓는 것이 이 유형의 함정이다.<br><strong>여섯 가운데 「감소」해야 하는 것은 훈련 비용과 손실 둘뿐</strong>이다 — <strong>나머지는 모두 향상·증대</strong>다. <strong>좋은 것을 「감소」로 바꿔 놓는</strong> 것이 이 유형의 함정이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인간공학의 가치 여섯</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">가치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>성능의 향상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>훈련비용의 절감</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인력 이용률의 향상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>사고 및 오용으로부터의 손실 감소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>생산 및 보전의 경제성 증대</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>감소가 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>사용자의 수용도 향상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t233": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "인체측정 자료의 응용원칙", "front": "인체측정 자료의 응용원칙은?", "back": "<ul><li><strong>평균치 설계</strong>다. <strong>누구에게나 두루 맞춰야 하고 극단치로 잡을 까닭이 없는</strong> 경우다.</li><li><strong>5 ~ 95 백분위수</strong>를 잡는다. <strong>쓰는 사람의 90%</strong>를 아우른다.</li></ul><p><strong>◈ 암기</strong> <u>창구·계산대는 평균치 설계</u>. · <u>조절식은 5 ~ 95 %tile</u>.</p><p><strong>순서는 「조절식 → 극단치 → 평균치」</strong>다 — <strong>평균치는 맨 마지막에 어쩔 수 없을 때</strong> 쓴다. <strong>창구는 조절할 수도 없고 극단에 맞출 까닭도 없어</strong> 평균치가 남는다.<br><strong>양 끝의 5%씩을 뺀 90%</strong>를 담는다 — <strong>그 바깥까지 맞추려면 값이 지나치게 커지거나 작아져 비용이 급하게 오르기</strong> 때문이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인체측정 자료의 응용원칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원칙</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">언제 쓰나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최대집단치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작으면 못 쓰는 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">출입문 높이 · 통로 폭 · 비상구</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최소집단치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>멀면 못 닿는 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">선반 높이 · 조종장치까지의 거리</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>조절식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 좋다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">의자 · 책상 · 자동차 좌석</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>평균치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위 셋이 모두 마땅하지 않을 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>은행 창구 · 슈퍼마켓 계산대</u> · 이 문항</td></tr></tbody></table></div>", "nq": 2}, "card_erg_t163": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "작업공간 설계의 요건", "front": "작업공간 설계의 요건은?", "back": "<ul><li><strong>접근제한요건</strong>은 <strong>손이 닿지 못하게 일부러 멀리 두는</strong> 설계다. 미술품 앞의 난간이 그 보기다.</li><li><strong>접근제한요건</strong>은 <strong>닿지 못하게 거리를 두는</strong> 것이다. <strong>박물관에서 그림 앞에 난간을 두는</strong> 것이 그 보기다.</li></ul><p><strong>◈ 암기</strong> <u>닿지 못하게 하면 접근제한</u>. · <u>접근제한은 닿지 못하게</u>.</p><p><strong>「접근」은 닿게 하는 것, 「접근제한」은 닿지 못하게 하는 것</strong>이다. 두 낱말이 비슷해 보이지만 <strong>방향이 정반대</strong>다.<br><strong>나머지 셋은 「닿게 하려는」 설계이고 접근제한요건만 「닿지 못하게 하려는」</strong> 설계다. <strong>방향이 반대</strong>라는 점만 잡으면 갈린다.</p><div style=\"margin:12px 0 2px;font-weight:700\">작업공간 설계의 세 요건</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">요건</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>조절 요건</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사람마다 맞출 수 있게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">조절식 의자</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접근 요건(작업공간 포락면)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>닿을 수 있게 · 들어갈 수 있게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">비상벨 위치 · 수리 공간</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접근제한 요건</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>닿지 못하게 멀리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>미술품 전시의 거리 확보</u></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t234": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "작업환경관리", "mid": "음원 방향의 지각", "front": "음원 방향의 지각은?", "back": "<strong>두 귀에 닿는 소리의 세기 차이와 위상(시간) 차이</strong>로 방향을 안다.<p><strong>◈ 암기</strong> <u>강도차와 위상차</u>.</p><p><strong>귀가 둘이라서 방향을 안다</strong> — <strong>두 귀에 닿는 「세기」와 「때」의 차이</strong>가 전부다. <strong>정면과 정후면은 두 차이가 모두 0이라 헷갈린다</strong>는 것도 여기서 나온다.</p><div style=\"margin:12px 0 2px;font-weight:700\">음원 방향을 아는 단서</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단서</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>강도차(양이 강도차)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가까운 쪽 귀에 더 크게 들린다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높은 소리에서 뚜렷</u> — 머리가 소리를 가린다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위상차(양이 시간차)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가까운 쪽 귀에 먼저 닿는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>낮은 소리에서 뚜렷</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>머리를 돌리는 동작</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>차이를 크게 만들어 방향을 좁힌다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t235": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "조종-반응비율(C/R비)", "front": "조종-반응비율(C/R비)는?", "back": "<strong>C/R비가 클수록 둔감</strong>하다. <strong>많이 돌려야 조금 움직이기</strong> 때문이다.<p><strong>◈ 암기</strong> <u>C/R비가 크면 둔감</u>.</p><p><strong>분모가 표시장치</strong>이므로 <strong>C/R비가 커진다는 것은 표시장치가 덜 움직인다</strong>는 뜻이다 — <strong>곧 둔감</strong>하다. <strong>민감과 둔감을 뒤집어 놓는 것</strong>이 이 유형의 함정이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">조종-반응비율(C/R비)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$C / R = \\dfrac{\\text{조종장치의 변위량}}{\\text{표시장치의 변위량}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>C/R비가 크면</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>많이 돌려야 조금 움직인다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>둔감</u> · 미세조종 시간이 짧다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>C/R비가 작으면</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>조금만 돌려도 크게 움직인다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>민감</u> · 이동시간이 짧다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최적값</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이동시간과 미세조종시간의 합이 가장 작은 곳</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">장치 종류·표시장치 크기·허용오차에 따라 달라진다</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t017": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "양립성의 네 가지", "front": "양립성의 네 가지는?", "back": "<ul><li><strong>양식(modality) 양립성</strong>은 <strong>자극을 받는 감각과 반응하는 방식이 서로 맞는가</strong>를 말한다. <strong>귀로 들려주고 입으로 답하게 하는 것</strong>이 그 예다. 반대로 소리로 물어보고 손으로 버튼을 누르게 하면 그만큼 반응이 느려진다.</li><li>양립성은 <strong>공간 · 운동 · 개념 · 양식</strong> 네 가지다. 「감성의 양립성」은 없다.</li><li><strong>양식(modality) 양립성</strong>이다. <strong>귀로 들었으면 입으로 답하는</strong> 것처럼 자극과 응답의 <strong>감각 양식이 맞는</strong> 경우다.</li></ul><p><strong>◈ 암기</strong> <u>공간(위치) · 운동(방향) · 개념(뜻) · 양식(감각과 반응)</u>. · 「<u>공 · 운 · 개 · 양</u>」 — 감성은 없다.</p><p>양립성 네 가지. <u>공간(위치) · 운동(방향) · 개념(뜻) · 양식(감각과 반응의 방식)</u>. 양립성이 어긋난 설계는 평소에는 그럭저럭 쓰이다가 <u>급할 때 반드시 실수를 부른다</u>. 이것이 양립성이 안전의 문제인 이유다.<br>양립성이 어긋난 설계는 평소에는 그럭저럭 쓰이다가 <strong>급할 때 반드시 실수를 부른다</strong>. 이것이 양립성이 안전의 문제인 까닭이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">양립성의 네 가지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>공간적 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>배치가 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">오른쪽 버너는 오른쪽 손잡이</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>운동 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>움직임이 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">시계 방향으로 돌리면 증가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>개념적 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>뜻이 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>빨강은 뜨거움, 파랑은 차가움</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>양식 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>자극과 응답의 감각 양식이 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>들으면 말로 답한다</u></td></tr></tbody></table></div>", "nq": 7}, "card_erg_t236": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "소음의 노출기준", "front": "소음의 노출기준은?", "back": "15분(1/4시간)의 기준은 <strong>115 [dB(A)]</strong>다. <strong>120 [dB(A)]가 아니다</strong>.<p><strong>◈ 암기</strong> <u>5 [dB] 오르면 시간은 절반</u>.</p><p><strong>90 [dB]에서 시작해 5 [dB] 오를 때마다 시간이 절반</strong>으로 준다 — <strong>90-8, 95-4, 100-2, 105-1, 110-1/2, 115-1/4</strong>. <strong>115 [dB(A)]가 끝이고 그 위로는 잠깐도 안 된다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">소음의 1일 노출기준</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">노출시간</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">소음강도</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>8시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>90 [dB(A)]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>95 [dB(A)]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>100 [dB(A)]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>105 [dB(A)]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>30분</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>110 [dB(A)]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>15분</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>115 [dB(A)]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「120」이 아니다</u> · 최대 기준</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t237": {"kind": "용어형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "힉-하이만 법칙", "front": "힉-하이만 법칙이란?", "back": "<strong>힉-하이만 법칙</strong>이다. <strong>고를 것이 많을수록 결정에 걸리는 시간이 길어진다</strong>.<p><strong>◈ 암기</strong> <u>고르는 시간은 힉-하이만</u>.</p><p><strong>「고르는 시간」은 힉-하이만, 「닿는 시간」은 피츠</strong>다. <strong>이 문항은 세 색 가운데 무엇을 눌러야 할지 「고르는」 단계</strong>를 묻는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인간공학의 주요 법칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">법칙</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>힉-하이만</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>선택지 수와 반응시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$RT = a + b \\log_{2} N$</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>피츠</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>움직여 닿는 데 걸리는 시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$MT = a + b \\log_{2} ( \\dfrac{2 D}{W} )$</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>웨버</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>차이를 느끼는 최소 변화량</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\Delta I}{I} = \\text{일정}$</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>학습효과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>되풀이할수록 시간이 준다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t222": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "점멸융합주파수(CFF)", "front": "점멸융합주파수(CFF)는?", "back": "<ul><li><strong>피로하면 주파수 값이 내려간다</strong>. <strong>깜박임을 구별하는 힘이 떨어지기</strong> 때문이다.</li><li>조명 강도의 대수치에 <strong>선형적으로 「비례」</strong>한다. <strong>밝을수록 깜박임을 잘 가려낸다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>피로하면 CFF가 내려간다</u>. · <u>조명 강도에 비례</u>.</p><p><strong>밝고 또렷할수록 깜박임을 잘 구별</strong>하므로 CFF가 높다. <strong>어둡거나(암조응) 지치면(피로) 내려간다</strong>. <strong>「피로하면 내려간다」</strong> 하나만 잡아도 풀린다.<br><strong>밝고 또렷할수록 깜박임을 잘 구별</strong>하므로 CFF가 높다. <strong>VFF · CFF · 플리커치는 모두 같은 값</strong>을 가리키는 다른 이름이다. <strong>피로하거나 어두우면 내려간다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">점멸융합주파수(CFF)의 성질</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조건</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">CFF</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정신적으로 피로하면</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>내려간다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>피로의 척도</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>암조응(어두운 곳에 익숙해지면)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>내려간다</u 치제한형</u>. · <u>포집형은 위험원 쪽</u>.</p><p>다섯 갈래를 <strong>무엇으로 막는가</strong>로 새긴다 — <strong>막는다(격리) · 못 가게 한다(위치제한) · 밀어낸다(접근거부) · 멈춘다(접근반응) · 받는다(포집)</strong>.<br><strong>사람이 가는 것을 막는가, 위험이 오는 것을 막는가</strong>로 갈린다. <strong>포집형만 뒤쪽</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">방호장치의 분류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">분류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원리</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>격리형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사이를 막는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">완전차단형 · 덮개형 · <u>게이트 가드식</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위치제한형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>손이 갈 수 없는 자리에 둔다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>양수조작식</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접근거부형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>손을 밀어내거나 당긴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>손쳐내기식 · 수인식</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접근반응형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>다가가면 멈춘다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>광전자식(감응식)</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>포집형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>날아오는 것을 받는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">연삭기 덮개 · 반발예방장치</td></tr></tbody></table></div>", "nq": 5}, "card_mac_t191": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "프레스·전단기", "mid": "금형의 설치와 조정", "front": "금형의 설치와 조정은?", "back": "<ul><li>부착 전에 확인할 것은 <strong>하사점</strong>이다. <strong>슬라이드가 가장 내려온 자리에서 금형의 높이와 다이 높이를 맞춘다</strong>.</li><li>안전블록은 <strong>제거가 아니라 설치</strong>한다. <strong>슬라이드가 제 무게로 떨어지는 것을 받쳐</strong> 준다.</li></ul><p><strong>◈ 암기</strong> <u>금형 부착 전엔 하사점</u>. · <u>안전블록은 설치한다</u>.</p><p><strong>하사점은 슬라이드가 가장 내려온 자리</strong>로, <strong>그 자리에서 상형과 하형이 맞물리므로</strong> 높이를 맞출 기준이 된다. <strong>안전블록은 「전원을 껐어도 슬라이드는 제 무게로 떨어진다」</strong>는 데 대한 대비다.<br><strong>안전블록은 「전원을 껐어도 슬라이드는 제 무게로 떨어진다」</strong>는 데 대한 대비다 — <strong>빼는 것이 아니라 반드시 끼워</strong> 넣는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">금형 설치·조정의 안전수칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>부착 전에 하사점을 확인한다</u></td><td style=\"border:1px solid #cbd5e e=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전율</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$S = \\dfrac{\\text{극한강도} ( \\text{인장강도} )}{\\text{허용응력}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>허용응력</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{극한강도}}{\\text{안전율}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전율의 다른 꼴</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{파단하중}}{\\text{안전하중}}$, $\\dfrac{\\text{파괴하중}}{\\text{최대사용하중}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 6}, "card_mac_t196": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "회전부의 위험방지", "front": "회전부의 위험방지는?", "back": "감김통에도 <strong>덮개 또는 울</strong>을 설치한다. <strong>「마개 또는 비상구」가 아니다</strong>.<p><strong>◈ 암기</strong> <u>감김통에도 덮개 또는 울</u>.</p><p><strong>회전부의 방호는 거의 모두 「덮개 또는 울」</strong>로 /td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전원 차단 · 「조정 중」 표지 · 잠금장치</u></td></tr></tbody></table></div>", "nq": 2}, "card_mac_t158": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "프레스·전단기", "mid": "금형의 안전화", "front": "금형의 안전화는?", "back": "<ul><li>맞춤 핀은 <strong>억지 끼워맞춤</strong>으로 해야 한다. <strong>헐겁게 하면 빠져 떨어진다</strong>.</li><li>맞춤 핀은 <strong>억지 끼워맞춤</strong>으로 한다. <strong>헐거우면 빠져 떨어진다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>맞춤 핀은 억지 끼워맞춤</u>.</p><p><strong>핀이 헐거우면 떨어진다</strong>는 상식으로 걸러진다. <strong>억지 끼워맞춤(억지로 눌러 박는 것)</strong>이라야 빠지지 않는다. <strong>8 [mm]는 손가락이 들어가지 못하는 크기</strong>다.<br><strong>「8 [mm] 이하」</strong>라는 숫자가 금형 안전화의 중심이다 — <strong>손가락이 들어가지 못하는 틈</strong>이다. <strong>맞춤 핀은 위치를 잡는 부품이라 헐거우면 구실 자체를 못 한다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">금형의 안전화</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>T홈 안길이</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>설치 볼트 지름의 2배 이상</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>맞춤 핀</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>억지 끼워맞춤</u> · 상형에 쓸 때는 낙하방지 대책 — <u>「헐거움」이 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>이동 스트리퍼와 다이의 간격</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>8 [mm] 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>금형 사이의 틈</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>8 [mm] 이하</u> (손가락이 들어가지 못하게)</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>대형 금형의 생크</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생크만으로 설치하지 말고 볼트로 조인다</u></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t225": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "자동전격방지기", "front": "자동전격방지기는?", "back": "<ul><li><strong>500 [Ω]</strong>을 상한으로 잡는다. <strong>그보다 높으면 사람 몸을 용접봉으로 잘못 알아</strong> 전압을 올려 버린다.</li><li><strong>제3종 접지공사</strong>와 <strong>보조변압기 · 주회로변압기 · 제어장치</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>시동감도 상한은 500 [Ω]</u>. · <u>보조변압기 · 주회로변압기 · 제어장치</u>.</p><p><strong>시동감도는 「몇 옴까지를 용접 시작으로 볼 것인가」</strong>다 — <strong>사람의 몸 저항은 그보다 훨씬 크므로 500 [Ω]을 넘겨 잡으면 사람에 닿았을 때도 전압을 올린다</strong>.<br><strong>「변압기 둘 + 제어장치 하나」</strong>가 뼈대다 — <strong>계기(전압계 · 전류계)는 구성품이 아니다</strong>. <strong>접지는 저압이므로 제3종</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">자동전격방지기의 성능</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>시동감도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>500 [Ω] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높을수록 좋지만 상한이 500</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지동시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1.0초 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">아크가 끊긴 뒤</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>출력측 무부하전압</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>25 [V] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">보통 때는 낮게 눌러 둔다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>시동시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.06초 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t226": {"kind": "용어형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "자동전격방지기의 원리", "front": "자동전격방지기의 원리란?", "back": "<strong>용접봉이 모재에 닿으면 2차측이 닫힌 회로가 되고, 그때 흐르는 전류를 감지</strong> 해 전압을 올린다.<p><strong>◈ 암기</strong> <u>닿으면 폐회로, 전류를 감지</u>.</p><p><strong>「쉴 때는 낮추고, 일할 때만 올린다」</strong>가 이 장치의 전부다. <strong>용접공이 감전하는 것은 대부분 쉬는 사이 무부하전압에 닿았을 때</strong>이므로 그 시간을 겨눈 장치다.</p><div style=\"margin:12px 0 2px;font-weight:700\">자동전격방지기의 동작</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>평상시</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>출력측 무부하전압을 25 [V] 이하로 눌러 둔다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>용접봉이 모재에 닿으면</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>2차측이 폐회로가 되고 전류가 흐른다 — 이를 감지한다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>감지하면</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.06초 안에 정상 용접전압을 걸어 준다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>아크가 끊기면</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1.0초 안에 다시 25 [V] 이하로 낮춘다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>방식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>SCR 등 반도체를 쓴 무접점방식</u> — 「유접점」이 아니다</td></tr></tbody></table></div>", "nq": 1}, "card_ele_t227": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "전격의 위험요인", "front": "전격의 위험요인은?", "back": "<ul><li>주파수가 높을수록 <strong>최소감지전류는 커진다</strong> — <strong>고주파일수록 덜 위험</strong>하다.</li><li><strong>전류가 크고 · 오래 흐르고 · 심장 같은 주요 부위를 지날수록</strong> 위험하다.</li></ul><p><strong>◈ 암기</strong> <u>주파수가 높으면 덜 위험</u>. · <u>전류 크고 · 오래 · 심장을 지나면</u>.</p><p><strong>상용주파수 60 [Hz] 부근이 사람에게 가장 나쁘다</strong> — <strong>더 높아지면 표피효과로 몸 속을 덜 지나므로 감지전류가 오히려 커진다</strong>. <strong>「감소한다」로 뒤집어 놓는 것</strong>이 이 유형의 함정이다.<br><strong>①②는 「주파수가 높을수록 위험」</strong>이라 걸러지고 <strong>④는 「인체저항이 높을수록 위험」</strong>이라 걸러진다. <strong>남는 ③이 세 축을 모두 바르게</strong> 말한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">전격의 위험을 좌우하는 것</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">요인</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>통전전류의 크기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1차적 요인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">가장 크게 좌우한다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>통전시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>길수록 위험</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>통전경로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>심장을 지날수록 위험</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">왼손-가슴이 가장 위험</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전원의 종류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>교류가 직류보다 위험</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">극성이 바뀌어 근육이 경련</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>주파수</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높을수록 덜 위험</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>최소감지전류가 커진다</u> · 상용 60 [Hz]가 가장 위험</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t071": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "접지의 목적", "front": "접지의 목적은?", "back": "<ul><li>접지는 <strong>대지전위 상승을 억제</strong>하는 것까지는 맞지만, <strong>절연강도를 「낮춰도 되게」</strong>해 주는 것이지 <strong>올려 주는 것이 아니다</strong>.</li><li>접지는 <strong>대지전위 상승을 억제</strong>하고 <strong>절연강도를 낮출 수 있게</strong> 해 준다. <strong>「상승유도」와 「증가」로 뒤집어</strong> 놓았다.</li></ul><p><strong>◈ 암기</strong> <u>전위는 낮추지 절연강도를 올리지 않는다</u>. · <u>대지전위 상승을 억제한다</u>.</p><p>네 가지 — <strong>감전 방지 · 대지전위 상승 억제 · 보호계전기의 확실한 동작 · 낙뢰와 이상전압으로부터 보호</strong>. <strong>대지전위가 덜 오르니 절연을 그만큼 낮게 설계할 수 있다</strong>는 것이 실제 효과다.<br><strong>접지는 「전위를 낮추고 전류가 흘러갈 길을 만드는」</strong> 일이다 — <strong>전위를 올리거나 절연을 더 두껍게 하는 것은 정반대</strong>다.</p><div style=\"margin:12px 0 2px;font-weight:700\">접지의 목적</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">목적</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>누설전류로 인한 감전 방지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>낙뢰로 인한 피해 방지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;verti kground:#f1f5f9;font-weight:700;\">동작시간</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">쓰는 곳</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>감전보호용</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.03초 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 빠르다</u> — 인체 감전 방지</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>고속형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.1초 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>시연형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.1초 초과 2초 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">선택 차단 — 아래 차단기가 먼저 끊게</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>반한시형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.2 ~ 1초</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">전류가 클수록 빨리 끊긴다</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t228": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "감전방지용 누전차단기", "front": "감전방지용 누전차단기는?", "back": "<strong>정격감도전류 30 [mA] 이하, 동작시간 0.03초 이내</strong>다.<p><strong>◈ 암기</strong> <u>30 [mA], 0.03초</u>.</p><p><strong>30 [mA]는 「사람이 스스로 손을 뗄 수 있는 한계」</strong> 근처이고 <strong>0.03초는 「심실세동에 이르기 전」</strong>이다 — <strong> xt-align:center;\"><u>가시광선</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>눈부심 · 시력 저하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>마이크로파</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>체온 상승 · 백내장</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t231": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "위험장소의 등급과 방폭구조", "front": "위험장소의 등급과 방폭구조는?", "back": "<strong>0종 장소에는 본질안전 방폭구조(ia)</strong>만 쓸 수 있다.<p><strong>◈ 암기</strong> <u>0종은 본질안전</u>.</p><p><strong>0종은 늘 폭발분위기가 있는 곳</strong>이라 <strong>「불꽃 에너지 자체가 발화에 못 미치는」 본질안전</strong> 말고는 믿을 수 없다. <strong>다른 구조는 모두 불꽃이 나되 밖으로 새지 않게 하는</strong> 것이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">위험장소와 쓸 수 있는 방폭구조</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">언제 위험한가</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방폭구조</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>0종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>늘 또는 오랜 시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>본질안전(ia)</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정상 운전 중 가끔</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>본질안전(ia · ib) · 내압(d) · 압력(p) · 유입(o) · 안전증(e) · 몰드(m) · 충전(q)</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이상 시에만 잠깐</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1종에 쓸 수 있는 것 모두 + 비점화(n)</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t232": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "위험장소의 분류", "front": "위험장소의 분류는?", "back": "<ul><li><strong>장소에 걸맞은 방폭구조를 고르고 과하지도 모자라지도 않게 맞추기</strong> 위해서다.</li><li><strong>2종 장소</strong>다. <strong>이상이 생겼을 때에만 잠깐 폭발분위기가 만들어진다</strong>.</li><li><strong>0종 장소</strong>다. <strong>「지속적으로 또는 장기간」</strong>이라는 말이 곧 0종이다.</li></ul><p><strong>◈ 암기</strong> <u>방폭설비 선정과 방폭 협조</u>. · <u>이상 시에만 위험하면 2종</u>.</p><p><strong>0종에 값싼 설비를 두면 위험하고, 2종에 본질안전을 다 깔면 낭비</strong>다 — <strong>「균형 있는 방폭 협조」</strong>라는 말이 그 뜻이다.<br><strong>「늘 · 가끔 · 이상 시」</strong> 세 마디로 갈린다. <strong>「부식 · 열화 · 파손 · 고장」처럼 정상이 아닌 사태를 전제하는 말이 붙으면 2종</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">위험장소를 나누는 까닭</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>목적</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>장소마다 알맞은 방폭전기설비를 고르기 위해</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;te :7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>가연성 분진</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>금속관 공사, 합성수지관 공사, 케이블 공사</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>가연성 가스</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>금속관 공사, 케이블 공사</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>금속관 접속</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>5턱 이상 나사 결합</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t234": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 일반", "mid": "인체의 정전용량과 대전전하", "front": "인체의 정전용량과 대전전하의 식은?", "back": "$V = IR = 0.003 \\times 5 {,} 000 = 15$ [V]이므로 $Q = CV = 0.1 \\times 15 = 1.5$ [μC]다.<p><strong>◈ 암기</strong> $Q = CV$.</p><p><strong>두 단계로 나눠 풀면 단위 걱정이 없다</strong> — <strong>먼저 </strong>$V = IR$<strong>로 전압, 그다음 </strong>$Q = CV$. <strong>[μF]와 [μC]는 접두어가 같아 그대로 곱하면</strong> 된다.</p><div style=\"margin:12px 0 2px;font-weight:700\">전하 · 전압 · 정전용량</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center 락접지</u>. · <u>3상 3선식은 3선 모두 단락접지</u>.</p><p><strong>검전기는 「지금 없다」를 확인할 뿐 「앞으로도 없다」를 보장하지 못한다</strong> — <strong>단락접지는 들어오는 전기를 그 자리에서 흘려보내 사람에게 오지 못하게</strong> 한다.<br><strong>단락접지의 뜻은 「세 선을 한 덩어리로 묶어 대지와 같은 전위로 만든다」</strong>는 것이다 — <strong>전위가 같으면 사람 몸에 전류가 흐를 까닭이 없다</strong>. <strong>한 선만 빠져도 그 선과 나머지 사이에 전위차가 남는다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">정전작업 5대 안전수칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">차례</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작업 전 전원 차단</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전원투입 방지(잠금장치·표지판)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작업 장소의 무전압 확인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">검전기로</td></tr><tr><td style=\"border:1px sol
