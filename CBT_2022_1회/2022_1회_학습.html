{"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "FMEA(고장형태와 영향분석)", "front": "FMEA(고장형태와 영향분석)은?", "back": "<ul><li><strong>FMEA</strong>다. <strong>고장 형태(Failure Mode)</strong>라는 말이 나오면 FMEA로 보면 된다.</li><li>FMEA는 <strong>한 번에 부품 하나의 고장</strong>만 본다. <strong>둘 이상이 동시에 고장 나는 경우에는 맞지 않는다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>「고장 형태」가 나오면 FMEA</u>. · <u>FMEA는 동시 고장에 약하다</u>.</p><p>FMEA는 <strong>귀납적이고 정성적</strong>이며 <strong>밑에서 위로</strong> 올라간다. FTA는 <strong>연역적이고 정량적</strong>이며 <strong>위에서 아래로</strong> 내려간다. 방향이 정반대다.<br><strong>FMEA는 부품 목록을 한 줄씩 짚어 「이것이 고장 나면?」</strong>을 묻는다 — <strong>표의 한 줄이 부품 하나이므로 동시 고장은 담기지 않는다</strong>. <strong>그것을 다루려면 FTA</strong>로 간다.</p><div style=\"margin:12px 0 2px;font-weight:700\">FMEA의 특징</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무엇</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>부품의 고장 형태와 그것이 시스템에 미치는 영향을 표로 정리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정성적 · 귀납적</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>장점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>양식이 간단하고 특별한 훈련 없이 쓸 수 있다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td rowspan=\"2\" style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>단점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>두 가지 이상이 동시에 고장 나는 경우에는 맞지 않는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>①</u></td></tr><tr  000 \\times 60}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항이면 0.785</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>주의</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>D는 [mm], N은 [rpm]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_mac_t197": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "프레스 방호장치의 성능기준", "front": "프레스 방호장치의 성능기준은?", "back": "<ul><li><strong>정상동작표시램프는 녹색, 위험표시램프는 붉은색</strong>이다. <strong>두 색을 바꿔</strong> 놓았다.</li><li>수인끈은 <strong>지름 4 [mm] 이상</strong>이라야 한다.</li></ul><p><strong>◈ 암기</strong> <u>정상은 녹색, 위험은 붉은색</u>. · <u>수인끈은 지름 4 [mm] 이상</u>.</p><p><strong>신호등과 같다 — 녹색이 정상, 붉은색이 위험</strong>이다. <strong>색을 서로 바꿔 놓는 것</strong>이 이 유형의 함정이다.<br><strong>수인끈이 가늘면 끊어진다</strong> — <strong>손을 끌어낼 만큼 튼튼해야 하므로 4 [mm]</strong>다. <strong>「300 · 120 · 4」</strong> 세 숫자가 이 문항의 뼈대를 이룬다.</p><div style=\"margin:12px 0 2px;font-weight:700\">프레스 방호장치의 세부 기준</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>수인식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수인끈은 합성섬유로 지름 4 [mm] 이상</u></td><td s k)」</strong>는 뜻이다 — <strong>덮개가 열리면 기계가 서고, 기계가 돌면 덮개가 열리지 않는</strong> 두 방향이 모두 걸려 있어야 한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">비슷한 기구 가르기</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기구</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인터록</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>조건이 갖춰져야만 움직인다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>문이 닫혀야 기계가 돈다</u> · 이 문항</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>트립기구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위험할 때 곧 멈춘다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">급정지</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>오버런기구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>스위치를 꺼도 관성으로 도는 동안 문이 열리지 않게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>과부하방지장치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정 ddle;text-align:center;\"><u>하역작업 — 전후</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>4 [%] 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">5톤 이상은 <u>3.5 [%]</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>하역작업 — 좌우</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>6 [%] 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>주행 — 전후</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>18 [%] 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>주행 — 좌우</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>(15 + 1.1V) [%] 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>V는 [km/h]</u></td></tr></tbody></table></div>", "nq": 8}, "card_mac_t118": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "프레스·전단기", "mid": "롤러기의 급정지장치", "front": "롤러기의 급정지장치는?", "back": "<ul><li><strong>급정지장치</strong>다. 두 롤 사이에 말려 들어갈 때 <strong>곧바로 세우는</strong> 장치다.</li><li>무릎조작식은 <strong>밑면에서 0.4 [m] 이상 0.6 [m] 이내</strong>다.</li><li><strong>손 조작식은 밑면으로부터 1.8m 이내</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>롤러기는 급정지장치</u>. · <u>무릎은 0.4 ~ 0.6 [m]</u>.</p><p>급정지거리는 <strong>표면속도 30 [m/min] 미만이면 원주의 1/3, 30 [m/min] 이상이면 1/2.5</strong> 이내다. <strong>느릴수록 짧게 세워야</strong> 한다는 것이 뜻밖이지만, 느린 기계일수록 사람이 말려 들어갈 여지가 크기 때문이다.<br><strong>몸에서 그 부위가 있는 높이 그대로</strong>다 — <strong>손  style=\"margin:12px 0 2px;font-weight:700\">프레스 작업시작 전 점검사항</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">점검사항</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>클러치 및 브레이크의 기능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>크랭크축·플라이휠·슬라이드·연결봉 및 연결 나사의 풀림 유무</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1행정 1정지기구·급정지장치 및 비상정지장치의 기능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>슬라이드 또는 칼날에 의한 위험방지 기구의 기능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>프레스의 금형 및 고정볼트 상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>방호장치의 기능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:m 치의 전부다 — <strong>1분에 95%, 4분이면 절반</strong>이다. <strong>옮기거나 부르는 데 쓸 시간이 없다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">감전 시간과 소생률</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">소생술 시작 시간</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">소생률</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1분 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>95%</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3분 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>75%</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4분 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>50%</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>5분 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>25%</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>6분 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>10% 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>뇌 손상이 굳어진다</u></td></tr></tbody></table></div>", "nq": 3}, "card_ele_t213": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "위험한계 에너지", "front": "위험한계 에너지의 식은?", "back": "<ul><li>심실세동전류는 $I = \\dfrac{165}{\\sqrt{T}}$ [mA]이므로 1초에서 165 [mA]다. $W = I^{2} R T = ( 0.165 )^{2} \\times 1 {,} 000 \\times 1 \\fallingdotseq 27.23$ [J]다.</li><li>$I = \\dfrac{165}{\\sqrt{1}} = 165$ [mA]이므로 $W = ( 0.165 )^{2} \\times 500 \\times 1 \\fallingdotseq 13.6$ [J]다.</li><li>$W = I^{2} R T = ( 0.165 )^{2} \\times 500 \\fallingdotseq 13.6$ [J]이다. <strong>통전시간에 따라 대략 6.5 ~ 17.0 [J]</strong> 범위에 든다.</li></ul><p><strong>◈ 암기</strong> <u>1,000 [Ω] 이면 27.23 [J]</u>. · <u>500 [Ω] 이면 13.6 [J]</u>.</p><p>$W = I^{2} R T$에서 $I$에 $165 / \\sqrt{T}$를 넣으면 $T$가 약분되어 $W = ( 0.165 )^{2} R$만 남는다 — <strong>통전시간과 무관하게 저항만으로 정해진다</strong>. <strong>R = 1,000 이면 27.23, R = 500 이면 13.6</strong> 두 값만 외워 두면 된다.<br>$W = I^{2} R T$에 $I = 165 / \\sqrt{T}$를 넣으면 $T$<strong>가 약분되어 저항만으로 정해진다</strong> — <strong>500 이면 13.6, 1,000 이면 27.23</strong> 두 값만 외워 두면 된다.</p><div style=\"margin:12px 0 2px;font-weight:700\">심실세동과 위험한계 에너지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>심실세동전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$I = \\dfrac{165}{\\sqrt{T}}$ [mA]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>T는 통전시간 [초]</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험한계 에너지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$W = I^{2} R T$ [J]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>R = 1,000 [Ω], T = 1초</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>27.23 [J]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>R = 500 [Ω], T = 1초</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>13.6 [J]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">자주 함께 나온다</td></tr></tbody></table></div>", "nq": 3}, "card_ele_t135": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "누전차단기의 정격감도전류", "front": "누전차단기의 정격감도전류의 식은?", "back": "<ul><li><strong>30 [mA], 0.1초</strong>다. 감전의 위험한계는 <strong>전류 × 시간 = 50 [mA·s]</strong> 인데, $30 \\times 0.1 = 3$ [mA·s]로 넉넉히 아래에 든다. 60 [mA] 이상은 <strong>심실세동 영역</strong>에 들어 위험하다.</li><li><strong>감전을 막으려면 정격감도전류가 30 [mA] 이하</strong>라야 한다. <strong>값이 클수록 사람이 다친 뒤에야 끊긴다</strong>.</li><li><strong>30mA 이하, 0.03초 이내</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>일반 30, 물기 15</u>. · <u>감전방지는 30 [mA]</u>.</p><p><strong>일반 장소 30 [mA] 이하, 물기 있는 장소 15 [mA] 이하</strong>이고 <strong>동작시간은 어느 쪽이든 0.03초 이내</strong>다. 이 문항은 보기의 시간이 모두 같으므로 <strong>전류 하나로 갈린다</strong>.<br><strong>보기 넷이 동작시간은 모두 같고 감도전류만 다르다</strong> — <strong>사람을 지키는 값은 가장 작은 30 [mA]</strong>다. <strong>그보다 크면 사람이 감전된 뒤에야 끊긴다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">통전전류의 크기와 인체 반응</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">전류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">몸에 일어나는 일</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>약 1 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>최소감지전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">찌릿함을 느낀다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>7 ~ 8 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>고통한계전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">견딜 수는 있다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>10 ~ 15 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가수전류(이탈전류)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>스스로 손을 뗄 수 있는 한계</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>20 ~ 50 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불수전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>근육이 굳어 손을 못 뗀다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>50 [mA] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>심실세동전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>목숨이 위태롭다</u></td></tr></tbody></table></div>", "nq": 3}, "card_ele_t246": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "직접접촉에 의한 감전방지", "front": "직접접촉에 의한 감전방지는?", "back": "<ul><li><strong>출입이 어려운 곳</strong>에 두고 <strong>관계자 외의 출입을 금지</strong> 해야 한다. <strong>「출입이 용이한」이 뒤집혀</strong> 있다.</li><li><strong>관계자 외의 출입을 막은 곳</strong>에 두어야 한다. <strong>「쉽게 출입이 가능한」이 뒤집혀</strong> 있다.</li></ul><p><strong>◈ 암기</strong> <u>출입을 막는 곳에 둔다</u>.</p><p><strong>다섯 방법이 모두 「사람과 충전부를 떼어 놓는」</strong> 것이다 — <strong>덮거나 · 가두거나 · 막거나 · 못 들어오게 하거나 · 높이 올리거나</strong>. <strong>「출입이 쉬운 곳에 두고 표지로 알린다」는 정반대</strong>다.<br><strong>다섯 방법이 모두 「사람과 충전부를 떼어 놓는」</strong> 것이다 — <strong>「쉽게 출입이 가능하게」는 그 반대</strong>라 보자마자 걸러진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">직접접촉에 의한 감전방지 방법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px s 는 <strong>마르면 자연발화</strong>한다. <strong>물이나 알코올로 적셔서 저장</strong>해야 한다. <strong>물과 반응해 폭발하는 것이 아니다</strong>.</li><li>니트로셀룰로오스는 <strong>마르면 위험</strong>하다. <strong>물이나 알코올에 적셔 보관</strong>한다.</li><li><strong>마르면 스스로 열을 내며 분해·폭발</strong>하므로 <strong>알코올로 적셔</strong> 둔다.</li></ul><p><strong>◈ 암기</strong> <u>니트로셀룰로오스는 적셔서 보관</u>. · <u>니트로셀룰로오스는 적셔서 저장</u>.</p><p><strong>보기 ③이 이미 「에탄올·메탄올로 자연발화를 막는다」</strong>고 말하고 있다. <strong>적셔서 보관한다는 뜻</strong>이므로, <strong>「건조 상태를 유지」라는 ②와 어긋난다</strong>.<br><strong>「적셔 둔다」와 「말려 둔다」는 물질마다 정반대</strong>다 — <strong>금수성 물질은 말리고, 자기반응성 물질은 적신다</strong>. <strong>니트로셀룰로오스는 마르면 조그만 마찰에도 터진다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">니트로셀룰로오스(질화면)의 취급</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">내용</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>분류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>제5류 자기반응성 물질</u> (질산에스테르류)</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>저장</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>물이나 알코올(에탄올·메탄올)로 적셔서</u> — 건조는 금물</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>건조하면 분해열로 자연발화</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>소화</u></td><td style=\"border:1px // 해설이 열려 있는가 — 직접 여닫은 적이 있으면 그 뜻을 따른다
function solOpen(q){
 if(S.open[q.n]!==undefined)return S.open[q.n];
 return S.done||(STUDY&&!!S.ans[q.n]);
}

function qHTML(q){
 const a=S.ans[q.n], graded=(STUDY&&a)||S.done, show=STUDY||S.done;
 let h=`<div class="wrap"><div class="qh"><span class="qno">${String(q.n).padStart(3,'0')}</span>
  <span class="tag" style="background:${LV[q.lv][0]}">난이도 ${q.lv}·${LV[q.lv][1]}</span>
  <span class="tag" style="background:#6366f1">${q.kind}</span>
  <span class="tag" style="background:#f59e0b">빈출 ${'★'.repeat(q.fq)+'☆'.repeat(3-q.fq)}</span>
  <span class="subj">제${q.s}과목 ${D.subj[q.s-1]}</span>`;
 if(show){
   h+=`<span class="acts">
    <button class="mini${solOpen(q)?' on':''}" id="tsol">📖 해설 ${solOpen(q)?'닫기':'보기'}</button>
    ${q.card&&D.cards[q.card]?'<button class="mini cd" id="tcard">🃏 암기카드</button>':''}
   </span>`;
 }
 h+=`</div><div class="stem">${q.t}</div>`;
 if(q.cond)h+=`<div class="cond">${q.cond}</div>`;
 if(q.img)h+=`<img class="stemimg" src="img/${q.img}">`;
 for(let k=0;k<4;k++){
   let cls='opt';
   if(a===k+1)cls+=' sel';
   if(graded){ if(k+1===q.a)cls='opt right'; else if(a===k+1)cls='opt wrong'; }
   h+=`<button class="${cls}" data-k="${k+1}"><span class="n">${MARK[k]}</span><span>${q.c[k]}</span></button>`;
 }
 if(graded){
   h+= a===q.a ? `<div class="vline o">정답입니다 · 정답 ${q.a}번</div>`
              : `<div class="vline x">${a?'틀렸습니다 · 고른 답 '+a+'번 · ':'미응답 · '}정답 ${q.a}번</div>`;
 }
 if(show&&solOpen(q)){
   h+=`<div class="sol"><div class="lbl">해설</div><div>${q.sol}</div>`;
   if(q.w)h+=`<div class="lbl">오답 분석</div><div>${q.w}</div>`;
   if(q.pt)h+=`<div class="lbl g">관련 개념 · 암기</div><div class="box">${q.pt}</div>`;
   if(q.law)h+=q.law;
   h+=`</div>`;
 }
 return h+'</div>';
}

function render(){
 if(!S.started){intro();return;}
 if(!STUDY&&S.done&&S.i<0){result();return;}
 const q=D.q[S.i];
 $('#app').innerHTML=qHTML(q);
 $$('.opt').forEach(b=>b.onclick=()=>{
   S.ans[q.n]=+b.dataset.k;
   if(STUDY&&S.open[q.n]===undefined)S.open[q.n]=true;
   save();
   if(STUDY||S.done){render();}
   else{$$('.opt').forEach(x=>x.classList.toggle('sel',x===b));paint();}
 });
 const ts=$('#tsol'); if(ts)ts.onclick=()=>{S.open[q.n]=!solOpen(q);save();render();};
 const tc=$('#tcard'); if(tc)tc.onclick=()=>openCard(q.card);
 kx($('#app'));
 stat();
 $('#prev').disabled=S.i===0; $('#next').disabled=S.i===119;
 paint();
 window.scrollTo(0,0);
}

function stat(){
 const n=Object.keys(S.ans).length;
 if(STUDY){
   let ok=0; D.q.forEach(q=>{if(S.ans[q.n]===q.a)ok++;});
   $('#prog').innerHTML=`<b>${S.i+1}</b> / 120 · 푼 문항 <b>${n}</b> · 맞힘 <b>${ok}</b>`;
   const r=$('#rate');
   if(r)r.textContent=n?`정답률 ${Math.round(ok/n*100)}%`:'정답률 —';
 }else{
   $('#prog').innerHTML=S.done?`채점 완료`:`<b>${S.i+1}</b> / 120 · 푸는 중 <b>${n}</b>`;
 }
}

/* 암기카드 팝업 */
let mflip=false;
function openCard(id){
 const c=D.cards[id]; if(!c)return;
 mflip=false;
 $('#mbody').innerHTML=`<button class="mx" id="mx">✕</button>
  <div class="mcard" id="mcard">
   <div class="mface">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span class="stars">${'★'.repeat(c.fq)+'☆'.repeat(3-c.fq)}</span>
     <span>${c.subject}${c.chapter?' · '+c.chapter:''}</span>
     <span class="mcid">${id}</span></div>
    <div class="mq">${c.front}</div>
    <div class="mhint">카드를 누르면 뒤집힙니다 · Esc 닫기</div>
   </div>
   <div class="mface back">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span>${c.mid}</span><span class="mcid">${id}</span></div>
    <div class="ma">${c.back}</div>
    <div class="mfoot"><span>이 개념을 묻는 문항 ${c.nq}개</span>
     <a href="../_암기카드.html#${id}" target="_blank">카드 전체 보기 →</a></div>
   </div>
  </div>`;
 $('#modal').classList.add('on');
 kx($('#mbody'));
 fitCard(); setTimeout(fitCard,260);
 $('#mcard').onclick=()=>{mflip=!mflip;$('#mcard').classList.toggle('flip',mflip);};
 $('#mx').onclick=e=>{e.stopPropagation();closeCard();};
}
function fitCard(){
 const mc=$('#mcard'); if(!mc)return;
 mc.style.height='120px';
 const h=Math.max(...[...mc.querySelectorAll('.mface')].map(f=>f.scrollHeight));
 mc.style.height=Math.min(window.innerHeight*0.78,Math.max(300,h+4))+'px';
}
function closeCard(){$('#modal').classList.remove('on');}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeCard();};
window.addEventListener('resize',()=>{if($('#modal').classList.contains('on'))fitCard();});

function paint(){
 $$('.pg').forEach(b=>{
   const n=+b.dataset.n, q=D.q[n-1];
   const marked=STUDY?!!S.ans[n]:S.done;
   let c='pg';
   if(marked&&(STUDY||S.done))c+=(S.ans[n]===q.a?' ok':' no');
   else if(S.ans[n])c+=' done';
   if(n-1===S.i)c+=' cur';
   b.className=c;
 });
}

function submit(){
 if(STUDY||S.done)return;
 const un=120-Object.keys(S.ans).length;
 if(un>0&&!confirm('안 푼 문제가 '+un+'개 있습니다. 제출할까요?'))return;
 S.done=true;clearInterval(tick);save();S.i=-1;result();
}

function result(){
 const per=[0,0,0,0,0,0],tot=[0,0,0,0,0,0];
 let right=0;
 D.q.forEach(q=>{tot[q.s-1]++;if(S.ans[q.n]===q.a){per[q.s-1]++;right++;}});
 const scores=per.map((v,i)=>Math.round(v/tot[i]*100));
 const avg=Math.round(right/120*100);
 const pass=avg>=60&&scores.every(s=>s>=40);
 let h=`<div class="result"><div style="text-align:center;color:#64748b;font-size:13px">${D.title} · 채점 결과</div>
  <div class="score">${avg}<span style="font-size:20px;color:#94a3b8">점</span></div>
  <div style="text-align:center;color:#64748b;font-size:14px">120문항 중 <b>${right}</b>문항 정답 · 소요 ${fmt(S.elapsed)}</div>
  <div class="verdict ${pass?'pass':'fail'}">${pass?'합격':'불합격'}</div>
  <table class="stab"><tr><th>과목</th><th>맞힌 문항</th><th>점수</th></tr>`;
 for(let i=0;i<6;i++){
   h+=`<tr><td style="text-align:left">제${i+1}과목 ${D.subj[i]}</td>
    <td>${per[i]} / ${tot[i]}</td><td class="${scores[i]<40?'bad':''}">${scores[i]}</td></tr>`;
 }
 h+=`</table><div style="font-size:12.5px;color:#64748b;text-align:center">합격 — 과목당 40점 이상, 평균 60점 이상</div>
  <div class="rowbtns">
   <button class="nbtn pri" id="rw">틀린 문제만 다시 보기</button>
   <button class="nbtn" id="rall">전체 해설 보기</button>
   <button class="nbtn" id="rst">다시 풀기</button>
  </div></div>`;
 $('#app').innerHTML=h;
 paint(); stat();
 $('#rw').onclick=()=>{const bad=D.q.findIndex(q=>S.ans[q.n]!==q.a);S.i=bad<0?0:bad;render();};
 $('#rall').onclick=()=>{S.i=0;render();};
 $('#rst').onclick=()=>{if(confirm('답안을 지우고 처음부터 다시 풀까요?')){
   S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();startTimer();}};
}

function build(){
 let p='';
 for(let s=1;s<=6;s++){
   p+=`<div class="palhd">제${s}과목 ${D.subj[s-1]}</div><div class="palgrid">`;
   D.q.filter(q=>q.s===s).forEach(q=>{p+=`<button class="pg" data-n="${q.n}">${q.n}</button>`;});
   p+='</div>';
 }
 $('#pal').innerHTML=p;
 $$('.pg').forEach(b=>b.onclick=()=>{S.i=+b.dataset.n-1;save();render();$('#pal').classList.remove('open');});
}

$('#prev').onclick=()=>{if(S.i>0){S.i--;save();render();}};
$('#next').onclick=()=>{if(S.i<119){S.i++;save();render();}};
$('#palbtn').onclick=()=>$('#pal').classList.toggle('open');
const sb=$('#sub'); if(sb)sb.onclick=submit;
const rs=$('#reset'); if(rs)rs.onclick=()=>{if(confirm('푼 기록을 모두 지울까요?')){
 S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();}};
document.addEventListener('keydown',e=>{
 if($('#modal').classList.contains('on')){
   if(e.key==='Escape')closeCard();
   if(e.key===' '){e.preventDefault();$('#mcard').click();}
   return;
 }
 if(e.key==='ArrowLeft')$('#prev').click();
 if(e.key==='ArrowRight')$('#next').click();
 if('1234'.includes(e.key)){const b=$$('.opt')[+e.key-1];if(b)b.click();}
 if(e.key==='s'||e.key==='S'){const t=$('#tsol');if(t)t.click();}
 if(e.key==='c'||e.key==='C'){const t=$('#tcard');if(t)t.click();}
});
build();
const hm=location.hash.match(/^#q(\d+)/);
if(hm){S.started=1;S.i=Math.max(0,Math.min(119,+hm[1]-1));save();}
if(!STUDY&&S.done){if(hm){render();}else{S.i=-1;result();}}
else{render();if(S.started)startTimer();}
</script>
</body></html>
