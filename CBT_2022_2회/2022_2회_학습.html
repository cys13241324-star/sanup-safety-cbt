n:12px 0 2px;font-weight:700\">프레스 방호장치의 안전거리</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방호장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">안전거리 식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>광전자식(감응식)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$D = 1.6 ( T_{l} + T_{s} )$ [mm]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$T$<u> 는 [ms]</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>양수조작식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$D = 1.6 ( T_{l} + T_{s} )$ [mm]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>양수기동식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$D = 1.6 T_{m}$ [mm]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$T_{m} = ( 1 / 2 + \\dfrac{1}{\\text{클러치 맞물림 개소 수}} ) \\times \\dfrac{60 {,} 000}{\\text{매분 행정수}}$</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>손쳐내기식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$D = 0.5 \\times \\text{행정길이}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_mac_t007": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "선반의 방호장치", "front": "선반의 방호장치는?", "back": "<ul><li><strong>칩 브레이커</strong>다. 바이트에 홈이나 턱을 만들어 칩이 길게 이어지지 못하고 짧게 부러지도록 한다. 길게 감긴 칩은 뜨겁고 날카로워 손을 베거나 몸에 감긴다.</li><li><strong>쉴드(실드)</strong>다. 투명한 가림막으로 칩과 절삭유가 튀는 것을 막는다.</li><li><strong>슬라이딩</strong>은 미끄러져 움직이는 동작을 가리키는 말이지 방호장치가 아니다.</li></ul><p><strong>◈ 암기</strong> <u>튀는 것을 막으면 쉴드</u>. · <u>쉴드 · 척 커버 · 칩 브레이커 · 브레이크</u>.</p><p>네 가지. <u>칩 브레이커(칩을 끊음) · 척 커버(척을 덮음) · 실드(칩 비산 방지) · 브레이크(급정지)</u>. 여기에 가늘고 긴 공작물을 받치는 <u>방진구</u>가 더해진다.<br>네 가지 — <strong>칩 브레이커(칩을 끊음) · 척 커버(척을 덮음) · 쉴드(비산 방지) · 브레이크(급정지)</strong>. 가늘고 긴 공작물에는 <strong>방진구</strong>를 쓴다.</p><div style=\"margin:12px 0 2px;font-weight:700\">선반의 방호장치</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 막나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>쉴드</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>칩과 절삭유 튐</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">투명판</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>척 커버</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>척과 공작물 회전부</u> 접촉</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">덮개</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>칩 브레이커</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>길게 이어지는 칩</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">칩을 잘게 끊는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>브레이크</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">관성 회전</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">급정지</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>덮개·울</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">돌출 회전부</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 9}, "card_mac_t180": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "정(chisel) 작업의 안전", "front": "정(chisel) 작업의 안전은?", "back": "<ul><li>끝날 무렵에는 <strong>약하게</strong> 쳐야 한다. <strong>세게 치면 끊어진 조각이 튄다</strong>.</li><li>시작할 때와 끝날 무렵에는 <strong>약하게</strong> 친다. <strong>가운데만 세게</strong> 친다.</li><li>시작할 때와 끝날 무렵에는 <strong>약하게</strong> 친다.</li></ul><p><strong>◈ 암기</strong> <u>마칠 무렵엔 약하게</u>. · <u>시작과 끝은 약하게</u>.</p><p><strong>끊어지기 직전이 가장 위험</strong> 하다 — <strong>마지막 한 번의 세기가 조각의 속도</strong>를 정한다. <strong>처음엔 약하게, 가운데는 세게, 마칠 때는 다시 약하게</strong>가 순서다.<br><strong>「약 → 강 → 약」</strong>이 정 작업의 리듬이다 — <strong>처음엔 자리를 잡느라, 마지막엔 조각이 튀지 않게</strong> 약하게 친다.</p><div style=\"margin:12px 0 2px;font-weight:700\">정(chisel) 작업의 안전수칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>보안경을 반드시 쓴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">칩이 튄다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>담금질한 재료는 정으로 치지 않는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">단단해서 정이 깨진다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>모서리는 3R 정도로 둥글린다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>마칠 무렵에는 약하게 친다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「세게」가 아니다</u> — 끊어진 조각이 날아간다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>자루가 튼튼히 박혔는지 확인한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 3}, "card_mac_t006": {"kind": "공식형", "fq": 2, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "안전율(안전계수)", "front": "안전율(안전계수)의 식은?", "back": "<ul><li>$\\text{안전율} = \\dfrac{\\text{극한강도}}{\\text{허용응력}}$ 이므로 $\\text{허용응력} = 250 / 4 = 62.5$ [N/mm²] 다.</li><li>$\\dfrac{25}{4} = 6.25$ [kg/mm²] 이다.</li><li>안전도는 <strong>인장강도 ÷ 내압</strong>이다. $1 \\rightarrow 40 / 50 = 0.80$, $2 \\rightarrow 50 / 60 = 0.83$, $3 \\rightarrow 55 / 70 = 0.79$ 이므로 <strong>2 - 1 - 3</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>허용응력 = 인장강도 ÷ 안전율</u>. · <u>안전도 = 인장강도 ÷ 내압</u>.</p><p>$S = \\dfrac{\\text{극한강도}}{\\text{허용응력}} = \\dfrac{\\text{파단하중}}{\\text{안전하중}}$. 안전율은 <u>모르는 것에 대한 여유</u>다. 재료가 불균일하거나 하중이 반복되거나 사용 조건이 가혹할수록 크게 잡는다.<br><strong>안전율은 「몇 배로 버티게 해 두었나」</strong>다 — <strong>클수록 안전하지만 재료가 낭비</strong> 된다. <strong>허용응력은 그 배수만큼 낮춰 놓은 값</strong>이므로 나눗셈이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">안전율과 허용응력</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전율</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$S = \\dfrac{\\text{극한강도} ( \\text{인장강도} )}{\\text{허용응력}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>허용응력</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{극한강도}}{\\text{안전율}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전율의 다른 꼴</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px; ext-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>건조한 곳에 시설하고 건조한 곳에서 조작하며 제어용 전압이 교류 30 [V]·직류 40 [V] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「습한 장소에서 조작」이 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>유도전동기의 2차측 전로에 접속된 저항기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>이중절연구조의 기계기구 · 절연변압기(2차 300 [V] 이하)로 공급하는 경우</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t258": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "누전차단기의 동작시간", "front": "누전차단기의 동작시간의 식은?", "back": "<strong>30 [mA], 0.03초</strong>다. <strong>감전을 막으려면 심실세동에 이르기 전에 끊어야</strong> 한다.<p><strong>◈ 암기</strong> <u>감전방지용은 30 [mA], 0.03초</u>.</p><p><strong>보기 넷이 감도전류는 모두 같고 시간만 다르다</strong> — <strong>가장 빠른 0.03초</strong>가 답이다. <strong>심실세동전류가 </strong>$165 / \\sqrt{T}$<strong> 이므로 시간이 짧을수록 사람이 견딘다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">감전방지용 누전차단기</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정격감도전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>30 [mA] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>동작시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.03초 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물기가 있는 장소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>15 [mA] 이하, 0.03초 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>까닭</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>심실세동전류 </u>$I = 165 / \\sqrt{T}$<u> [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">T 가 짧을수록 견딜 수 있는 전류가 크다</td></tr></tbody></table></div>", "nq": 1}, "card_ele_t246": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "직접접촉에 의한 감전방지", "front": "직접접촉에 의한 감전방지는?", "back": "<ul><li><strong>출입이 어려운 곳</strong>에 두고 <strong>관계자 외의 출입을 금지</strong> 해야 한다. <strong>「출입이 용이한」이 뒤집혀</strong> 있다.</li><li><strong>관계자 외의 출입을 막은 곳</strong>에 두어야 한다. <strong>「쉽게 출입이 가능한」이 뒤집혀</strong> 있다.</li></ul><p><strong>◈ 암기</strong> <u>출입을 막는 곳에 둔다</u>.</p><p><strong>다섯 방법이 모두 「사람과 충전부를 떼어 놓는」</strong> 것이다 — <strong>덮거나 · 가두거나 · 막거나 · 못 들어오게 하거나 · 높이 올리거나</strong>. <strong>「출입이 쉬운 곳에 두고 표지로 알린다」는 정반대</strong>다.<br><strong>다섯 방법이 모두 「사람과 충전부를 떼어 놓는」</strong> 것이다 — <strong>「쉽게 출입이 가능하게」는 그 반대</strong>라 보자마자 걸러진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">직접접촉에 의한 감전방지 방법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>충전부를 내구성 있는 절연물로 완전히 덮어 감쌀 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>충전부를 내부에 둔 폐쇄형 외함이 있는 구조로 할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>충전부에 충분한 절연효과가 있는 방호망이나 절연덮개를 설치할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>발전소·변전소처럼 관계자 외 출입을 금지한 곳에 설치할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「출입이 용이한 전개된 장소」가 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전주 위·철탑 위 등 사람이 접촉할 우려가 없는 곳에 설치할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t259": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "누전차단기의 설치대상", "front": "누전차단기의 설치대상은?", "back": "<strong>건조한 곳</strong>은 감전될 여지가 적어 면제된다. <strong>나머지 셋은 물기·발열·임시배선</strong>이라 설치해야 한다.<p><strong>◈ 암기</strong> <u>건조한 곳은 면제</u>.</p><p><strong>「물기 · 도전성 · 임시 · 발열」</strong>이라는 낱말이 붙으면 설치해야 한다 — <strong>「건조」 하나만 면제 쪽</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">누전차단기의 설치와 면제</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><tbody><tr><td rowspan=\"5\" style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>설치해야 하는 곳</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>대지전압 150 [V] 를 넘는 이동형·휴대형 기계기구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>물 등 도전성 액체가 있는 습윤장소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>대지전압에 관계없이</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>철판·철골 위 등 도전성이 높은 장소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>임시배선의 전원</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">콘크리트 직접 매설 케이블 포함</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>파이프라인 등 발열장치에 공급하는 전로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>면제되는 곳</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>건조한 곳에 시설하고 건조한 곳에서 조작하는 경우</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t260": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "가수전류와 불수전류", "front": "가수전류와 불수전류는?", "back": "<strong>가수(可離)전류</strong>는 <strong>스스로 손을 뗄 수 있는 한계</strong>의 전류다.<p><strong>◈ 암기</strong> <u>가수전류는 스스로 뗄 수 있는 전류</u>.</p><p><strong>「가(可) 수(手)」는 「손을 뗄 수 있다」</strong>는 뜻이고 <strong>「불수(不手)」는 그 반대</strong>다. <strong>감전방지용 누전차단기를 30 [mA] 로 잡는 것도 이 한계 언저리</strong> 이기 때문이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">통전전류의 이름</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">전류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최소감지전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">찌릿함을 느낀다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>고통한계전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>7 ~ 8 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">참을 수 있는 한계</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>가수(이탈가능)전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>10 ~ 15 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>스스로 손을 뗄 수 있다</u> · 이 문항</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>불수(이탈불능)전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>20 ~ 50 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">근육이 굳어 손을 뗄 수 없다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>심실세동전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>50 ~ 100 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">심장이 잔떨림</td></tr></tbody></table></div>", "nq": 1}, "card_ele_t261": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "", "mid": "지중전선로의 매설깊이", "front": "지중전선로의 매설깊이는?", "back": "<strong>60 [cm] 이상</strong>이다. <strong>차량이 지나지 않는 곳</strong>이므로 얕아도 된다.<p><strong>◈ 암기</strong> <u>압력을 받지 않으면 0.6 [m] 이상</u>.</p><p><strong>「1.0 과 0.6」</strong> 두 값이다 — <strong>차가 지나면 1 [m], 아니면 0.6 [m]</strong>. <strong>KEC 로 바뀌면서 옛 1.2 [m] 가 1.0 [m] 로 낮아졌다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">지중전선로의 매설깊이 (직접 매설식)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">깊이</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>차량 등 중량물의 압력을 받는 장소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1.0 [m] 이상</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>그 밖의 장소(압력을 받지 않는 곳)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.6 [m] 이상</u> · 이 문항</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>보호</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>견고한 트로프나 관에 넣거나 콤바인덕트 케이블 사용</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t262": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기설비", "mid": "누설전류의 한도", "front": "누설전류의 한도의 식은?", "back": "<ul><li>누설전류는 <strong>최대공급전류의 1/2,000 이하</strong> 라야 하므로 $\\dfrac{200}{2 {,} 000} = 0.1$ [A] 다.</li><li>누설전류는 <strong>최대공급전류의 1/2,000 이하</strong> 라야 한다.$200 \\, A \\times \\dfrac{1}{2 {,} 000} = 0.1 \\, A = 100 \\, \\mathrm{mA}$</li></ul><p><strong>◈ 암기</strong> <u>누설전류는 최대공급전류의 1/2,000 이하</u>.</p><p><strong>「2,000분의 1」</strong>이라는 분수 하나면 풀린다 — <strong>200 [A] 의 2,000분의 1 은 0.1 [A]</strong>. <strong>감전방지용 누전차단기의 30 [mA] 와는 다른 기준</strong>이라는 점도 갈라 둔다.<br><strong>2,000 으로 나눈 뒤 A 를 mA 로 바꾸느라 1,000 을 곱한다</strong> — <strong>결국 전류값의 절반(200 → 100)</strong>이 되는 셈이라 계산이 간단하다.</p><div style=\"margin:12px 0 2px;font-weight:700\">누설전류의 한도</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기준</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>누설전류는 최대공급전류의 1/2,000 을 넘지 않을 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>이 문항</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>200 ÷ 2,000 = 0.1 [A]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">= 100 [mA]</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>절연저항으로 보면</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$R = \\dfrac{V}{I_{g}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">누설전류가 작을수록 절연저항이 크다</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t263": {"kind": "단답형", "fq": 3, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "방폭구조의 종류", "front": "방폭구조의 종류는?", "back": "<ul><li><strong>안전증 방폭구조(e)</strong>다. <strong>애초에 불꽃이 나지 않는 기기의 안전도를 더 높인</strong> 것이다.</li><li><strong>「고압 방폭구조」라는 것은 없다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>불꽃이 안 나는 기기는 안전증</u>. · <u>고압 방폭구조는 없다</u>.</p><p><strong>나머지 셋은 「불꽃이 난다」는 것을 전제</strong>로 그것을 가두거나 막는다 — <strong>안전증만 「애초에 불꽃이 나지 않는 기기」</strong>를 다룬다. <strong>「불꽃이 발생하지 않는」</strong>이라는 단서가 그대로 답이다.<br><strong>「내압」과 「압력」이 따로 있어 헷갈리기 쉬운데 「고압」은 아예 없다</strong> — <strong>내압(d)은 터져도 견디는 것, 압력(p)은 안을 눌러 못 들어오게 하는 것</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">방폭구조의 종류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구조</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기호</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원리</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>내압 방폭구조</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>d</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안에서 터져도 밖으로 번지지 않게 튼튼한 용기</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>압력 방폭구조</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>p</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안에 공기를 밀어 넣어 폭발성 가스가 못 들어오게</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>유입 방폭구조</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>o</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불꽃이 나는 부분을 기름에 담근다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전증 방폭구조</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>e</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불꽃이 나지 않는 기기의 안전도를 더 높인다</u> · 이 문항</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>본질안전 방폭구조</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>ia · ib</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불꽃 에너지 자체가 발화에 못 미치게</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>몰드 · 충전 · 비점화</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>m · q · n</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t264": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "위험장소의 판정", "front": "위험장소의 판정은?", "back": "<strong>습도</strong>는 판정 기준에 들지 않는다.<p><strong>◈ 암기</strong> <u>습도는 판정 기준이 아니다</u>.</p><p><strong>판정은 「폭발분위기가 얼마나 자주 · 오래 생기는가」</strong> 하나로 모인다 — <strong>가스가 있느냐 · 얼마나 나오느냐 · 얼마나 빠져나가느냐 · 어떤 가스냐</strong>. <strong>습도는 정전기 쪽의 낱말</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">위험장소 판정의 기준</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험가스의 현존 가능성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">얼마나 자주, 얼마나 오래</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험가스의 방출 정도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>통풍(환기)의 정도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">환기가 잘되면 등급이 내려간다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험가스의 특성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">증기밀도 · 폭발범위 · 발화점</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>작업자에 의한 영향</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>습도의 정도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>판정 기준이 아니다</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t217": {"kind": "공식형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기 일반", "mid": "정전기 방전에너지", "front": "정전기 방전에너지의 식은?", "back": "<ul><li>$W = \\dfrac{1}{2} C V^{2}$ 이므로 $V = \\sqrt{\\dfrac{2 W}{C}} = \\sqrt{\\dfrac{2 \\times 1.15 \\times 10^{-3}}{100 \\times 10^{-12}}} \\fallingdotseq 4 {,} 800$ [V] 다.</li><li>$W = \\dfrac{1}{2} C V^{2}$ 이므로 $C = \\dfrac{2 W}{V^{2}} = \\dfrac{2 \\times 0.25 \\times 10^{-3}}{3 {,} 000^{2}} = 5.6 \\times 10^{-11}$ [F] = 56 [pF] 다.</li><li>정전용량은 $0.02 \\times 5 {,} 000 = 100$ [pF] 다. $W = \\dfrac{1}{2} C V^{2} = \\dfrac{1}{2} \\times 10^{-10} \\times 3 {,} 300^{2} \\fallingdotseq 5.445 \\times 10^{-4}$ [J] 다.</li></ul><p><strong>◈ 암기</strong> $V = \\sqrt{2 W / C}$. · $C = 2 W / V^{2}$.</p><p><strong>방전에너지가 최소발화에너지보다 작아야 안전</strong> 하다는 것이 이 셈의 바탕이다. <strong>pF 과 mJ 의 지수를 맞추는 데서 대부분 틀린다</strong> — <strong>10⁻³ 과 10⁻¹² 를 나누면 10⁹</strong>이 남는다.<br>$C = 2 W / V^{2}$ 에서 <strong>분모가 3,000의 제곱 = 9 × 10⁶</strong>이다 — <strong>분자 5 × 10⁻⁴ 를 나누면 5.6 × 10⁻¹¹ [F]</strong>. <strong>[F] 를 [pF] 로 바꿀 때 10¹² 를 곱한다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">정전기 에너지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>방전에너지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$W = \\dfrac{1}{2} C V^{2} = \\dfrac{1}{2} Q V$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">[J]</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전위</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$V = \\sqrt{\\dfrac{2 W}{C}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>단위</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 [pF] = 10⁻¹² [F], 1 [mJ] = 10⁻³ [J]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>단위 환산이 갈림길</u></td></tr></tbody></table></div>", "nq": 4}, "card_ele_t265": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기설비", "mid": "본질안전 방폭구조", "front": "본질안전 방폭구조는?", "back": "<ul><li><strong>본질안전 방폭구조는 통전 중에도 외함을 열 수</strong> 있다. <strong>에너지 자체가 발화에 못 미치기</strong> 때문이다.</li><li><strong>2중 안전 보장으로 0종 장소에 쓸 수 있는 것은 ia</strong>다. <strong>ib 는 1중 보장으로 1종·2종</strong> 에만 쓴다.</li></ul><p><strong>◈ 암기</strong> <u>본질안전은 통전 중에도 열 수 있다</u>. · <u>0종에 쓸 수 있는 것은 ia 뿐</u>.</p><p><strong>본질안전은 「불꽃이 나더라도 그 에너지가 최소발화에너지에 못 미친다」</strong>는 구조다 — <strong>그래서 열어 두고 손대도 폭발하지 않는다</strong>. <strong>0종 장소에 쓸 수 있는 유일한 구조인 까닭</strong>도 여기 있다.<br><strong>「ia 는 0종까지, ib 는 1종부터」</strong>가 갈림선이다 — <strong>0종 장소에 쓸 수 있는 것은 lid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>알칼리·알칼리토금속 질산염</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>바륨 · 칼슘 · 칼륨의 질산염은 빛에 안정하다</u></td></tr></tbody></table></div>", "nq": 1}, "card_chm_t241": {"kind": "단답형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "혼합 가스의 위험", "front": "혼합 가스의 위험은?", "back": "<strong>염소는 산화성, 아세틸렌은 가연성</strong>이다. <strong>주는 쪽과 받는 쪽이 만나</strong> 가장 위험하다.<p><strong>◈ 암기</strong> <u>염소 + 아세틸렌이 가장 위험</u>.</p><p><strong>위험한 짝은 늘 「태워 주는 것 + 타는 것」</strong>이다 — <strong>염소는 산소가 아니면서도 조연성</strong>이라는 점을 놓치기 쉽다. <strong>나머지 셋은 불연성이나 불활성끼리</strong>라 아무 일도 없다.</p><div style=\"margin:12px 0 2px;font-weight:700\">가스의 성질과 혼합 위험</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">가스</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">성질</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>염소(Cl₂)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>산화성(조연성)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">산소처럼 태워 준다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>아세틸렌(C₂H₂)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가연성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>2.5 ~ 8 -x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>침하 우려가 없는 튼튼한 기반 위에 적재할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>칸막이나 벽이 화물의 압력에 견디지 못하면 기대어 쌓지 말 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>불안정할 만큼 높이 쌓지 말 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>하중이 한쪽으로 치우치지 않게 쌓을 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「치우치더라도 효율적으로」가 아니다</u></td></tr></tbody></table></div>", "nq": 1}, "card_con_t236": {"kind": "단답형", "fq": 1, "subject": "건설안전기술", "chapter": "건설재해 대책", "mid": "낙하물 방지망", "front": "낙하물 방지망은?", "back": "<strong>수평면과 20° ~ 30°</strong>로 설치한다.<p><strong>◈ 암기</strong> <u>수평면과 20° ~ 30°</u>.</p><p><strong>「20 ~ 30° · 10 [m] · 2 [m]」</strong> 세 숫자다 — <strong>각도를 주는 까닭은 떨어진 물건이 안쪽으로 굴러들게 하기</strong> 위해서다. <strong>추락방호망의 「10 [m] · 3 [m]」와 갈라</strong> 둔다.</p><div style=\"margin:12px 0 2px;font-weight:700\">낙하물 방지망·방호선반의 설치기준</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>설치 각도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수평면과 20° ~ 30°</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>설치 높이</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>첫 단은 지상에서 10 [m] 이내, 그다음 10 [m] 이내마다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>내민 길이</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>벽면에서 2 [m] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>그 밖</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수직보호망 · 방호선반 · 출입금지구역 · 안전모</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}}};</script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const STUDY=MODE==='study';
const KEY=(STUDY?'safestudy_':'safecbt_')+D.round;
let S={i:0,ans:{},open:{},started:STUDY?1:0,elapsed:0,done:false};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
if(!S.open)S.open={};
if(STUDY)S.started=1;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function kx(el){if(window.renderMathInElement)renderMathInElement(el,{delimiters:[
 {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}

const MARK=['①','②','③','④'];
const LV={1:['#10b981','쉬움'],2:['#f59e0b','보통'],3:['#ef4444','어려움']};

function fmt(s){const m=Math.floor(s/60),x=s%60;
 return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+':'+String(x).padStart(2,'0');}

let tick=null;
function startTimer(){
 if(STUDY)return;
 clearInterval(tick);tick=setInterval(()=>{
  if(S.done)return;
  S.elapsed++;const left=D.limit-S.elapsed;
  const t=$('#timer'); if(!t)return;
  t.textContent=left>0?fmt(left):'00:00:00';
  t.classList.toggle('warn',left<600);
  if(left<=0)submit();
  if(S.elapsed%10===0)save();
 },1000);}

function intro(){
 $('#app').innerHTML=`<div class="wrap intro">
  <h2>${D.title}</h2>
  <p>6과목 120문항 · 시험시간 3시간</p>
  <p>합격 기준 — 과목당 40점 이상, 전 과목 평균 60점 이상</p>
  <p style="margin-top:14px;font-size:13px">답만 고르고 끝에 제출합니다.
   해설과 암기카드는 채점한 뒤에 열립니다.</p>
  <button class="big" id="go">시험 시작</button>
  ${Object.keys(S.ans).length?'<div style="margin-top:12px;font-size:13px;color:#64748b">이어서 풀면 지난번 답안이 그대로 살아 있습니다</div>':''}
 </div>`;
 $('#go').onclick=()=>{S.started=1;save();render();startTimer();};
}

// 해설이 열려 있는가 — 직접 여닫은 적이 있으면 그 뜻을 따른다
function solOpen(q){
 if(S.open[q.n]!==undefined)return S.open[q.n];
 return S.done||(STUDY&&!!S.ans[q.n]);
}

function qHTML(q){
 const a=S.ans[q.n], graded=(STUDY&&a)||S.done, show=STUDY||S.done;
 let h=`<div class="wrap"><div class="qh"><span class="qno">${String(q.n).padStart(3,'0')}</span>
  <span class="tag" style="background:${LV[q.lv][0]}">난이도 ${q.lv}·${LV[q.lv][1]}</span>
  <span class="tag" style="background:#6366f1">${q.kind}</span>
  <span class="tag" style="background:#f59e0b">빈출 ${'★'.repeat(q.fq)+'☆'.repeat(3-q.fq)}</span>
  <span class="subj">제${q.s}과목 ${D.subj[q.s-1]}</span>`;
 if(show){
   h+=`<span class="acts">
    <button class="mini${solOpen(q)?' on':''}" id="tsol">📖 해설 ${solOpen(q)?'닫기':'보기'}</button>
    ${q.card&&D.cards[q.card]?'<button class="mini cd" id="tcard">🃏 암기카드</button>':''}
   </span>`;
 }
 h+=`</div><div class="stem">${q.t}</div>`;
 if(q.cond)h+=`<div class="cond">${q.cond}</div>`;
 if(q.img)h+=`<img class="stemimg" src="img/${q.img}">`;
 for(let k=0;k<4;k++){
   let cls='opt';
   if(a===k+1)cls+=' sel';
   if(graded){ if(k+1===q.a)cls='opt right'; else if(a===k+1)cls='opt wrong'; }
   h+=`<button class="${cls}" data-k="${k+1}"><span class="n">${MARK[k]}</span><span>${q.c[k]}</span></button>`;
 }
 if(graded){
   h+= a===q.a ? `<div class="vline o">정답입니다 · 정답 ${q.a}번</div>`
              : `<div class="vline x">${a?'틀렸습니다 · 고른 답 '+a+'번 · ':'미응답 · '}정답 ${q.a}번</div>`;
 }
 if(show&&solOpen(q)){
   h+=`<div class="sol"><div class="lbl">해설</div><div>${q.sol}</div>`;
   if(q.w)h+=`<div class="lbl">오답 분석</div><div>${q.w}</div>`;
   if(q.pt)h+=`<div class="lbl g">관련 개념 · 암기</div><div class="box">${q.pt}</div>`;
   if(q.law)h+=q.law;
   h+=`</div>`;
 }
 return h+'</div>';
}

function render(){
 if(!S.started){intro();return;}
 if(!STUDY&&S.done&&S.i<0){result();return;}
 const q=D.q[S.i];
 $('#app').innerHTML=qHTML(q);
 $$('.opt').forEach(b=>b.onclick=()=>{
   S.ans[q.n]=+b.dataset.k;
   if(STUDY&&S.open[q.n]===undefined)S.open[q.n]=true;
   save();
   if(STUDY||S.done){render();}
   else{$$('.opt').forEach(x=>x.classList.toggle('sel',x===b));paint();}
 });
 const ts=$('#tsol'); if(ts)ts.onclick=()=>{S.open[q.n]=!solOpen(q);save();render();};
 const tc=$('#tcard'); if(tc)tc.onclick=()=>openCard(q.card);
 kx($('#app'));
 stat();
 $('#prev').disabled=S.i===0; $('#next').disabled=S.i===119;
 paint();
 window.scrollTo(0,0);
}

function stat(){
 const n=Object.keys(S.ans).length;
 if(STUDY){
   let ok=0; D.q.forEach(q=>{if(S.ans[q.n]===q.a)ok++;});
   $('#prog').innerHTML=`<b>${S.i+1}</b> / 120 · 푼 문항 <b>${n}</b> · 맞힘 <b>${ok}</b>`;
   const r=$('#rate');
   if(r)r.textContent=n?`정답률 ${Math.round(ok/n*100)}%`:'정답률 —';
 }else{
   $('#prog').innerHTML=S.done?`채점 완료`:`<b>${S.i+1}</b> / 120 · 푸는 중 <b>${n}</b>`;
 }
}

/* 암기카드 팝업 */
let mflip=false;
function openCard(id){
 const c=D.cards[id]; if(!c)return;
 mflip=false;
 $('#mbody').innerHTML=`<button class="mx" id="mx">✕</button>
  <div class="mcard" id="mcard">
   <div class="mface">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span class="stars">${'★'.repeat(c.fq)+'☆'.repeat(3-c.fq)}</span>
     <span>${c.subject}${c.chapter?' · '+c.chapter:''}</span>
     <span class="mcid">${id}</span></div>
    <div class="mq">${c.front}</div>
    <div class="mhint">카드를 누르면 뒤집힙니다 · Esc 닫기</div>
   </div>
   <div class="mface back">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span>${c.mid}</span><span class="mcid">${id}</span></div>
    <div class="ma">${c.back}</div>
    <div class="mfoot"><span>이 개념을 묻는 문항 ${c.nq}개</span>
     <a href="../_암기카드.html#${id}" target="_blank">카드 전체 보기 →</a></div>
   </div>
  </div>`;
 $('#modal').classList.add('on');
 kx($('#mbody'));
 fitCard(); setTimeout(fitCard,260);
 $('#mcard').onclick=()=>{mflip=!mflip;$('#mcard').classList.toggle('flip',mflip);};
 $('#mx').onclick=e=>{e.stopPropagation();closeCard();};
}
function fitCard(){
 const mc=$('#mcard'); if(!mc)return;
 mc.style.height='120px';
 const h=Math.max(...[...mc.querySelectorAll('.mface')].map(f=>f.scrollHeight));
 mc.style.height=Math.min(window.innerHeight*0.78,Math.max(300,h+4))+'px';
}
function closeCard(){$('#modal').classList.remove('on');}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeCard();};
window.addEventListener('resize',()=>{if($('#modal').classList.contains('on'))fitCard();});

function paint(){
 $$('.pg').forEach(b=>{
   const n=+b.dataset.n, q=D.q[n-1];
   const marked=STUDY?!!S.ans[n]:S.done;
   let c='pg';
   if(marked&&(STUDY||S.done))c+=(S.ans[n]===q.a?' ok':' no');
   else if(S.ans[n])c+=' done';
   if(n-1===S.i)c+=' cur';
   b.className=c;
 });
}

function submit(){
 if(STUDY||S.done)return;
 const un=120-Object.keys(S.ans).length;
 if(un>0&&!confirm('안 푼 문제가 '+un+'개 있습니다. 제출할까요?'))return;
 S.done=true;clearInterval(tick);save();S.i=-1;result();
}

function result(){
 const per=[0,0,0,0,0,0],tot=[0,0,0,0,0,0];
 let right=0;
 D.q.forEach(q=>{tot[q.s-1]++;if(S.ans[q.n]===q.a){per[q.s-1]++;right++;}});
 const scores=per.map((v,i)=>Math.round(v/tot[i]*100));
 const avg=Math.round(right/120*100);
 const pass=avg>=60&&scores.every(s=>s>=40);
 let h=`<div class="result"><div style="text-align:center;color:#64748b;font-size:13px">${D.title} · 채점 결과</div>
  <div class="score">${avg}<span style="font-size:20px;color:#94a3b8">점</span></div>
  <div style="text-align:center;color:#64748b;font-size:14px">120문항 중 <b>${right}</b>문항 정답 · 소요 ${fmt(S.elapsed)}</div>
  <div class="verdict ${pass?'pass':'fail'}">${pass?'합격':'불합격'}</div>
  <table class="stab"><tr><th>과목</th><th>맞힌 문항</th><th>점수</th></tr>`;
 for(let i=0;i<6;i++){
   h+=`<tr><td style="text-align:left">제${i+1}과목 ${D.subj[i]}</td>
    <td>${per[i]} / ${tot[i]}</td><td class="${scores[i]<40?'bad':''}">${scores[i]}</td></tr>`;
 }
 h+=`</table><div style="font-size:12.5px;color:#64748b;text-align:center">합격 — 과목당 40점 이상, 평균 60점 이상</div>
  <div class="rowbtns">
   <button class="nbtn pri" id="rw">틀린 문제만 다시 보기</button>
   <button class="nbtn" id="rall">전체 해설 보기</button>
   <button class="nbtn" id="rst">다시 풀기</button>
  </div></div>`;
 $('#app').innerHTML=h;
 paint(); stat();
 $('#rw').onclick=()=>{const bad=D.q.findIndex(q=>S.ans[q.n]!==q.a);S.i=bad<0?0:bad;render();};
 $('#rall').onclick=()=>{S.i=0;render();};
 $('#rst').onclick=()=>{if(confirm('답안을 지우고 처음부터 다시 풀까요?')){
   S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();startTimer();}};
}

function build(){
 let p='';
 for(let s=1;s<=6;s++){
   p+=`<div class="palhd">제${s}과목 ${D.subj[s-1]}</div><div class="palgrid">`;
   D.q.filter(q=>q.s===s).forEach(q=>{p+=`<button class="pg" data-n="${q.n}">${q.n}</button>`;});
   p+='</div>';
 }
 $('#pal').innerHTML=p;
 $$('.pg').forEach(b=>b.onclick=()=>{S.i=+b.dataset.n-1;save();render();$('#pal').classList.remove('open');});
}

$('#prev').onclick=()=>{if(S.i>0){S.i--;save();render();}};
$('#next').onclick=()=>{if(S.i<119){S.i++;save();render();}};
$('#palbtn').onclick=()=>$('#pal').classList.toggle('open');
const sb=$('#sub'); if(sb)sb.onclick=submit;
const rs=$('#reset'); if(rs)rs.onclick=()=>{if(confirm('푼 기록을 모두 지울까요?')){
 S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();}};
document.addEventListener('keydown',e=>{
 if($('#modal').classList.contains('on')){
   if(e.key==='Escape')closeCard();
   if(e.key===' '){e.preventDefault();$('#mcard').click();}
   return;
 }
 if(e.key==='ArrowLeft')$('#prev').click();
 if(e.key==='ArrowRight')$('#next').click();
 if('1234'.includes(e.key)){const b=$$('.opt')[+e.key-1];if(b)b.click();}
 if(e.key==='s'||e.key==='S'){const t=$('#tsol');if(t)t.click();}
 if(e.key==='c'||e.key==='C'){const t=$('#tcard');if(t)t.click();}
});
build();
const hm=location.hash.match(/^#q(\d+)/);
if(hm){S.started=1;S.i=Math.max(0,Math.min(119,+hm[1]-1));save();}
if(!STUDY&&S.done){if(hm){render();}else{S.i=-1;result();}}
else{render();if(S.started)startTimer();}
</script>
</body></html>
