계 「제어(관리)의 부족」</strong>이 근원적 원인이다. 모든 사슬이 여기서 시작한다.<p><strong>◈ 암기</strong> <u>버드는 관리의 부족부터</u>.</p><p><strong>하인리히는 「불안전한 행동과 상태(제3요인)」를 없애라</strong>했고, <strong>버드는 「관리의 부족(제1단계)」을 없애라</strong>했다. <strong>뿌리를 어디로 보느냐</strong>가 두 이론의 차이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">버드의 신연쇄성 이론 5단계</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>제어(관리)의 부족</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>근원적 원인</u> — 안전관리 계획·조직·실행의 부족</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기본원인(기원)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">개인적 요인 · 작업상 요인 — <u>4M</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>직접원인(징후)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불안전한 행동과 상태</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사고(접촉)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">에너지나 유해물질과의 접촉</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>5</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>상해(손실)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_mgt_t121": {"kind": "공식형", "fq": 1, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "도수율과 연근로시간", "front": "도수율과 연근로시간의 식은?", "back": "연근로시간은 $1 {,} 000 \\times 2 {,} 400 = 2 {,} 400 {,} 000$ 시간이다. $\\text{도수율} = \\dfrac{\\text{재해건수}}{\\text{연근로시간}} \\times 10^{6}$이므로 $\\text{재해건수} = 10 \\times 2 {,} 400 {,} 000 / 10^{6} = 24$ 건이다.<p><strong>◈ 암기</strong> <u>한 사람 2,400시간</u>.</p><p><strong>한 사람의 연간 근로시간을 2,400시간</strong>으로 보는 것이 관행이다(하루 8시간 × 300일). 이 값을 모르면 풀 수 없다. <strong>연천인율 = 도수율 × 2.4</strong>도 여기서 나온다.</p>", "nq": 1}, "card_mgt_t122": {"kind": "단답형", "fq": 1, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "불안전한 행동과 불안전한 상태", "front": "불안전한 행동과 불안전한 상태는?", "back": "<strong>불안전한 인양</strong>은 <strong>사람이 하는 행동</strong>이므로 <strong>불안전한 행동</strong>이다.<p><strong>◈ 암기</strong> <u>사람이 하면 행동, 물건이면 상태</u>.</p><p><strong>「~한다」로 끝나면 행동, 「~하다/~있다」로 끝나면 상태</strong>다. <strong>보호구를 안 쓰는 것은 행동, 보호구 자체가 나쁜 것은 상태</strong> — 이 대비가 갈림길이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">불안전한 행동과 불안전한 상태</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">불안전한 행동 (인적 원인)</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">불안전한 상태 (물적 원인)</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">무엇</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사람이 하는 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>물건이 놓인 상태</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">보기</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불안전한 인양 · 보호구 미착용 · 안전장치 기능 제거 · 위험한 자세 · 기계의 잘못된 사용</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>부적절한 보호구 · 결함 있는 기계설비 · 불안전한 방호장치 · 작업환경 결함 · 정리정돈 불량</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t080": {"kind": "단답형", "fq": 3, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "조합 AND 게이트", "front": "조합 AND 게이트는?", "back": "<ul><li><strong>조합 AND 게이트</strong>다. <strong>n 개 가운데 k 개가 일어나면 출력</strong>이 나온다. 여기서는 3개 중 2개다.</li><li><strong>조합 AND 게이트</strong>다. <strong>n 개 가운데 정해진 k 개가 일어나면</strong> 출력이 난다.</li></ul><p><strong>◈ 암기</strong> <u>몇 개 중 몇 개면 조합 AND</u>. · <u>3개 중 2개면 조합 AND</u>.</p><p>앞 문항과 짝이다. <strong>「3개 중 2개」처럼 개수 조건이 붙으면 조합 AND</strong>, <strong>「동시에 겹치면 안 됨」이면 배타적 OR</strong>이다.<br><strong>「몇 개 중 몇 개」면 조합 AND</strong>, <strong>「순서대로」면 우선적 AND</strong>, <strong>「동시에 겹치면 안 됨」이면 배타적 OR</strong>이다. 세 낱말로 갈린다.</p><div style=\"margin:12px 0 2px;font-weight:700\">FTA의 수정게이트</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">게이트</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조건</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>조합 AND</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>n 개 가운데 k 개가 일어나면 출력</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">「어느 것이든 2개」</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>우선적 AND</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정해진 순서대로</u> 일어나야 출력</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>배타적 OR</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>입력이 둘 이상 겹치면 출력이 없다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">「동시 발생이 없음」</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>억제 게이트</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>조건이 만족될 때만</u> 출력</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>육각형</u> 안에 조건</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험지속 기호</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>입력이 일정 시간 이어져야</u> 출력</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t106": {"kind": "용어형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "FTA 의 기대효과", "front": "FTA 의 기대효과란?", "back": "<strong>시간에 따른 원인 분석</strong>은 FTA의 기대효과가 아니다. FTA는 <strong>특정 시점의 논리 구조</strong>를 보는 것이지 시간의 흐름을 따라가지 않는다.<p><strong>◈ 암기</strong> <u>시간 흐름은 ETA 쪽</u>.</p><p><strong>시간의 흐름을 따라가는 것은 ETA(사건수 분석)</strong>다. 초기 사건에서 시작해 <strong>성공과 실패로 갈라지며 시간 순으로</strong> 전개한다. FTA와 결이 다르다.</p><div style=\"margin:12px 0 2px;font-weight:700\">FTA의 기대효과</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기대효과</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>사고원인 규명의 간편화</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">논리기호로 한눈에</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>사고원인 분석의 일반화</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">같은 틀로 여러 사고를</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>사고원인 분석의 정량화</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>확률 계산이 된다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>노력과 시간의 절감</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>시스템의 결함 진단</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전점검 체크리스트 작성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t107": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "억제 게이트", "front": "억제 게이트는?", "back": "<ul><li><strong>억제 게이트</strong>다. <strong>육각형에 조건(P)을 옆으로 매달아</strong> 그 조건이 만족될 때만 입력이 출력으로 넘어간다.</li><li><strong>억제 게이트</strong>다. <strong>조건이 만족될 때만</strong> 입력이 출력으로 넘어간다.</li><li><strong>억제 게이트</strong>다. <strong>육각형 옆에 조건을 적는 상자</strong>가 붙어 있다.</li></ul><p><strong>◈ 암기</strong> <u>육각형에 조건이 붙으면 억제 게이트</u>. · <u>조건부 사건이 붙으면 억제 게이트</u>.</p><p><strong>육각형은 「조건」을 뜻하는 수정기호</strong>다. 그 안에 무슨 조건을 적느냐에 따라 <strong>억제 · 배타적 OR · 조합 AND · 우선적 AND</strong>로 갈린다. 억제 게이트는 <strong>조건 자체가 게이트가 된</strong> 경우다.<br><strong>「억제(抑制)」는 조건이 안 맞으면 막는다</strong>는 뜻이다 — <strong>「조건부」라는 낱말이 곧 억제 게이트</strong>다. <strong>게이트 옆의 육각형 안에 조건을 적는다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">FTA 게이트의 생김새</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">게이트</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">모양</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">특징</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>AND</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>반원 아래가 평평</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">입력이 모두 있어야</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>OR</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>아래가 오목한 곡선</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">하나만 있어도</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>억제</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>육각형 + 옆에 조건</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>조건이 만족될 때만</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>부정</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작은 동그라미</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">값을 뒤집는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>수정기호</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>육각형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">조건을 적어 매단다</td></tr></tbody></table></div>", "nq": 3}, "card_erg_t108": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "인간공학의 목적", "front": "인간공학의 목적은?", "back": "<strong>안전의 극대화와 생산능률의 향상</strong>이다. 인간공학의 궁극적 목적이 바로 이것이다.<p><strong>◈ 암기</strong> <u>안전 극대화 + 생산능률 향상</u>.</p><p>인간공학은 <strong>「기계를 사람에게 맞춘다(fitting the task to the man)」</strong>는 생각에서 출발한다. 그 결과가 <strong>안전과 능률</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인간공학의 목적</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">목적</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전성 향상과 사고 방지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사람이 다치지 않게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>첫째 목적</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기계 조작의 능률성과 생산성 향상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>일이 잘되게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>쾌적성 향상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>편하게 일하게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t109": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "위험처리 기술", "front": "위험처리 기술은?", "back": "<strong>Rearrange(재배열)</strong>는 <strong>작업개선의 원리 ECRS</strong>에 속하는 말이지 위험처리 기술이 아니다.<p><strong>◈ 암기</strong> <u>회피 · 감축 · 보류 · 전가</u> 넷.</p><p>네 가지를 <strong>피하거나 · 줄이거나 · 떠안거나 · 넘긴다</strong>로 새긴다. <strong>ECRS(없애고 · 합치고 · 순서 바꾸고 · 단순하게)</strong>는 작업개선 쪽이라 결이 다르다.</p><div style=\"margin:12px 0 2px;font-weight:700\">위험처리 기술 네 가지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기술</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Avoidance(회피)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위험한 일을 아예 하지 않는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">공정 자체를 없앤다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Reduction(감축·경감)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위험을 줄인다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">방호장치 · 교육</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Retention(보류)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>스스로 떠안는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">자가보험 · 준비금</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Transfer(전가)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>남에게 넘긴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">보험 가입 · 외주</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t110": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "근육의 활주설(sliding filament theory)", "front": "근육의 활주설(sliding filament theory)는?", "back": "<strong>A는 근원섬유(근절), B는 액틴, C는 마이오신</strong>이다. <strong>가는 액틴이 굵은 마이오신 사이로 미끄러져 들어가</strong> 근육이 줄어든다.<p><strong>◈ 암기</strong> <u>액틴이 마이오신 사이로</u>.</p><p><strong>가는 것(액틴)이 굵은 것(마이오신) 사이로 미끄러진다</strong> — 방향을 거꾸로 적은 보기가 함정이다. <strong>근막 → 근섬유 → 근원섬유 → 필라멘트</strong> 순으로 작아진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">근육의 구조와 수축</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>근막</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>근육 전체를 싸는 막</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">수축단위가 아니다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>근섬유</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>근육을 이루는 세포 하나</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>근원섬유(근절)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수축의 기본 단위</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>A</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>액틴</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가는 필라멘트</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>B</u> — 미끄러져 들어간다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>마이오신</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>굵은 필라멘트</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>C</u> — 그 사이로</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t083": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "기계 일반", "mid": "소음의 방지대책", "front": "소음의 방지대책은?", "back": "<ul><li><strong>음원 대책</strong>이 가장 효과적이다. <strong>소리가 나는 곳 자체를 없애거나 줄이는</strong> 것이라 근본 대책이다.</li><li><strong>귀마개와 귀덮개</strong>는 <strong>수음자(사람) 대책</strong>이다. 가장 소극적인 방법이다.</li><li><strong>「소음의 분배」</strong>라는 대책은 없다. <strong>소음을 나눈다고 줄어들지 않는다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>음원 → 경로 → 사람</u> 순. · <u>귀마개는 사람 쪽 대책</u>.</p><p>위험관리의 우선순위와 같은 논리다 — <strong>위험 자체를 없애는 쪽이 위, 사람이 견디게 하는 쪽이 아래</strong>. 보호구는 언제나 마지막이다.<br><strong>음원 → 전파경로 → 수음자</strong> 순으로 대책을 세운다. <strong>보호구는 언제나 마지막</strong>이며, 위험관리의 우선순위와 같은 논리다.</p><div style=\"margin:12px 0 2px;font-weight:700\">소음 대책의 우선순위</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">순위</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대책</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>음원 대책</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>소음원 제거·대체 · 저소음 기계로 교체 · 방음 커버 · 마찰 감소</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전파경로 대책</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>차음벽 · 흡음재 · 거리 두기 · 지향성 조절</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수음자 대책</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>귀마개 · 귀덮개</u> · 작업시간 단축 — 가장 소극적</td></tr></tbody></table></div>", "nq": 4}, "card_erg_t111": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "예비위험분석(PHA)의 위험 범주", "front": "예비위험분석(PHA)의 위험 범주는?", "back": "<strong>「예비조처상태」</strong>라는 범주는 없다. 네 범주는 <strong>파국적 · 위기적(중대) · 한계적 · 무시가능</strong>이다.<p><strong>◈ 암기</strong> <u>파국 · 위기 · 한계 · 무시가능</u> 넷.</p><p>PHA는 <strong>시스템 수명주기의 맨 처음(구상단계)</strong>에 하는 <strong>정성적</strong> 분석이다. 그래서 이름에 <strong>「예비(preliminary)」</strong>가 붙었다.</p><div style=\"margin:12px 0 2px;font-weight:700\">PHA의 위험 4범주</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">범주</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>파국적(catastrophic)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사망 또는 시스템 완전 손실</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">가장 심각</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위기적·중대(critical)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>중대한 상해나 시스템 중대 손상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">즉시 조치 필요</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>한계적(marginal)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>경미한 상해, 제어 가능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무시가능(negligible)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>상해나 손상이 거의 없다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t112": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "인간 신뢰도의 평가 방법", "front": "인간 신뢰도의 평가 방법은?", "back": "<strong>FMECA</strong>는 <strong>설비의 고장</strong>을 분석하는 기법이다. 사람의 신뢰도를 재는 방법이 아니다.<p><strong>◈ 암기</strong> <u>FMECA 만 설비 쪽</u>.</p><p><strong>FMEA·FMECA·FTA는 물적 요소</strong>를 다루고, <strong>THERP·HCR·SLIM은 인적 요소</strong>를 다룬다. <strong>「사람인가 물건인가」</strong>로 가른다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인간 신뢰도 평가 방법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>THERP</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>인간 과오율 예측기법</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">사건나무로 과오 확률을 계산</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>HCR</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>인간 인지 신뢰도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">주어진 시간 안에 알아채고 대응할 확률</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>SLIM</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>성공가능성 지수법</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">전문가 판단으로 지수를 매긴다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>CIT · TCRAM</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">기타 인간 신뢰도 기법</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>FMECA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>고장형태·영향·치명도 분석</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>설비 쪽</u> — 사람이 아니다</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t113": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "욕조곡선과 초기고장 대책", "front": "욕조곡선과 초기고장 대책은?", "back": "<strong>디버깅 기간</strong>이다. <strong>초기결함을 찾아 없애</strong> 고장률을 안정시킨다.<p><strong>◈ 암기</strong> <u>초기결함을 없애면 디버깅</u>.</p><p>세 방법 모두 <strong>쓰기 전에 불량품을 걸러 낸다</strong>는 한 가지다. <strong>마모고장 대책은 예방보전(PM)</strong> 하나로 잡아 둔다.</p><div style=\"margin:12px 0 2px;font-weight:700\">초기고장을 걸러 내는 방법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>디버깅(debugging)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>초기결함을 찾아 없앤다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">고장률을 안정시킨다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>번인(burn-in)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>고온에서 미리 돌려 본다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">불량품을 미리 태워 낸다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>스크리닝(screening)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>선별해 걸러 낸다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t114": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "보전기록 자료", "front": "보전기록 자료는?", "back": "<strong>MTBF 분석표</strong>다. <strong>평균고장간격</strong>을 기록해 두어야 신뢰성과 보전성을 개선할 수 있다.<p><strong>◈ 암기</strong> <u>설비이력카드 · MTBF 분석표 · 고장원인 대책표</u>.</p><p>세 가지가 대표다 — <strong>설비이력카드 · MTBF 분석표 · 고장원인 대책표</strong>. 모두 <strong>언제 왜 고장 났는가</strong>를 남긴다. <strong>자재·재고·주유는 관리 문서</strong>이지 신뢰성 자료가 아니다.</p>", "nq": 1}, "card_erg_t115": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "Murrell 의 휴식시간 산정식", "front": "Murrell 의 휴식시간 산정식의 식은?", "back": "산소 1 [L]는 약 5 [kcal]이므로 작업 에너지는 $1.3 \\times 5 = 6.5$ [kcal/min]이다. $R = \\dfrac{T ( E - S )}{E - 1.5}$에 $T = 480$, $S = 5$, $E = 6.5$을 넣으면 $R = \\dfrac{480 \\times ( 6.5 - 5 )}{6.5 - 1.5} = \\dfrac{720}{5} = 144$ 분이다.<p><strong>◈ 암기</strong> <u>산소 1 [L]는 5 [kcal]</u>.</p><p>$R = \\dfrac{T ( E - S )}{E - 1.5}$다. <strong>T는 총 작업시간(분), E는 작업의 에너지소비량, S는 표준 에너지소비량(남성 5 [kcal/min]), 1.5는 휴식 중 에너지소비량</strong>이다. <strong>산소 1 [L] = 5 [kcal]</strong>이라는 환산이 앞에 온다.</p>", "nq": 1}, "card_erg_t032": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "인체계측 자료의 응용원칙", "front": "인체계측 자료의 응용원칙은?", "back": "<ul><li><strong>출입문</strong>은 가장 큰 사람이 지날 수 있어야 하므로 <strong>최대집단치(95 %tile)</strong>로 잡는다.</li><li><strong>평균치 설계</strong>다. 불특정 다수가 잠깐씩 쓰고 조절할 수도 없는 시설이라, 평균에 맞추는 것이 그나마 나은 선택이다.</li><li><strong>구조적 치수</strong>는 인체를 재는 <strong>방법</strong>을 가리키는 말이지 설계 원칙이 아니다. 응용원칙은 <strong>조절식 · 극단치 · 평균치</strong> 셋뿐이다.</li></ul><p><strong>◈ 암기</strong> <u>닿아야 하면 작은 사람(5), 지나가야 하면 큰 사람(95)</u>. · <u>조절이 안 되고 여럿이 잠깐 쓰면 평균치</u>.</p><p>우선순위는 <strong>조절식 &gt; 극단치 &gt; 평균치</strong>다. 평균치 설계는 어쩔 수 없을 때만 쓴다.<br>평균치 설계는 <strong>아무에게도 꼭 맞지 않는다</strong>는 약점이 있다. 그래서 조절식이 가능하면 언제나 조절식이 낫다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인체측정치 응용의 세 원칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원칙</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최대집단치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">95 %tile — 큰 사람 기준</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>출입문</u> · 통로 · 비상구 · 침대 길이</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최소집단치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">5 %tile — 작은 사람 기준</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">선반 높이 · 조작 버튼까지의 거리</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>조절식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">5~95 %tile을 담게</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">의자 높이 · 자동차 시트 · 책상</td></tr></tbody></table></div>", "nq": 6}, "card_erg_t103": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "작업환경관리", "mid": "실내 표면의 추천반사율", "front": "실내 표면의 추천반사율은?", "back": "<ul><li><strong>바닥 &lt; 가구 &lt; 벽 &lt; 천장</strong>이므로 <strong>㉠ &lt; ㉢ &lt; ㉣ &lt; ㉡</strong>이다. <strong>위로 갈수록 밝게</strong> 한다.</li><li><strong>바닥 &lt; 가구 &lt; 벽 &lt; 천장</strong>이므로 <strong>A &lt; C &lt; D &lt; B</strong>다. <strong>위로 갈수록 밝게</strong> 한다.</li></ul><p><strong>◈ 암기</strong> <u>위로 갈수록 밝게</u>.</p><p><strong>천장 → 벽 → 가구 → 바닥</strong> 순으로 낮아진다. 위쪽을 밝게 해야 <strong>빛이 아래로 고루 퍼지고</strong> , 바닥이 너무 밝으면 <strong>반사 눈부심</strong>이 생긴다.</p><div style=\"margin:12px 0 2px;font-weight:700\">실내 표면의 추천반사율</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">표면</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">추천반사율</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>천장</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>80 ~ 90 [%]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 밝게</u> — 빛을 아래로 되돌린다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>벽</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>40 ~ 60 [%]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>가구 · 사무기기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>25 ~ 45 [%]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>바닥</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>20 ~ 40 [%]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 어둡게</u> — 눈부심을 막는다</td></tr></tbody></table></div>", "nq": 2}, "card_erg_t116": {"kind": "공식형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "반사율과 소요조명", "front": "반사율과 소요조명의 식은?", "back": "$\\text{소요조명} = \\dfrac{\\text{휘도}}{\\text{반사율}} \\times 100 = \\dfrac{90}{60} \\times 100 = 150$ [fc]다.<p><strong>◈ 암기</strong> <u>휘도 ÷ 반사율 × 100</u>.</p><p>$\\text{반사율} [ \\% ] = \\dfrac{\\text{휘도}}{\\text{조도}} \\times 100$을 조도에 대해 푼 식이다. <strong>반사율이 낮은 대상일수록 더 밝게 비춰야</strong> 같은 휘도를 얻는다.</p>", "nq": 1}, "card_erg_t117": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "청각적 경보신호의 설계지침", "front": "청각적 경보신호의 설계지침은?", "back": "장거리용으로는 <strong>1,000 [Hz] 아래</strong>를 써야 한다. <strong>높은 주파수는 공기 중에서 빨리 줄어들어</strong> 멀리 못 간다.<p><strong>◈ 암기</strong> <u>멀리 보내려면 낮은 소리</u>.</p><p>핵심은 <strong>거리가 멀수록 · 장애물이 많을수록 낮은 소리</strong>를 쓴다는 것이다. 낮은 소리는 <strong>덜 줄어들고 잘 휘어 들기</strong> 때문이다. 뱃고동이 낮은 것도 같은 이유다.</p><div style=\"margin:12px 0 2px;font-weight:700\">경계 및 경보신호의 설계지침</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">상황</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">쓰는 진동수</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>일반</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>500 ~ 3,000 [Hz]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>귀가 가장 민감한 대역</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>300 [m] 이상 장거리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1,000 [Hz] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높은 소리는 멀리 못 간다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>장애물을 돌아가야 할 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>500 [Hz] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">낮은 소리가 잘 휘어 든다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>주의 환기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>변조된 신호</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">1초에 1~8회 오르내리게</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>배경소음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>다른 진동수</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">묻히지 않게</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t118": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "정량적 표시장치의 종류", "front": "정량적 표시장치의 종류는?", "back": "<strong>동목형</strong>은 <strong>눈금이 움직이고 바늘이 고정</strong>되어 있어, <strong>창(窓)만큼만 보이면 되므로 면적을 줄일 수 있다</strong>.<p><strong>◈ 암기</strong> <u>동목형은 면적을 아낀다</u>.</p><p><strong>정확한 값은 디지털, 변화 추세는 아날로그</strong>다. 아날로그 안에서는 <strong>동침형이 변화를 잘 보여 주고, 동목형이 자리를 덜 차지한다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">정량적 표시장치의 종류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇이 움직이나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">특징</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>동침형(moving pointer)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>바늘이 움직이고 눈금이 고정</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>변화의 방향과 속도를 알기 쉽다</u> — 가장 olid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Top Down 형식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">정상사상에서 아래로 캐 내려간다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>연역적 해석</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">결과에서 원인으로</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>특정 사상에 대한 해석</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">정상사상 하나를 정해 놓고 본다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>논리기호를 사용</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">AND · OR 게이트</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정성적 · 정량적 해석이 모두 가능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「불가능」이 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>컴퓨터 처리가 가능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 4}, "card_erg_t119": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "초음파 소음", "front": "초음파 소음은?", "back": "초음파 소음은 <strong>3 [dB]이 아니라 하루 노출한도가 따로</strong> 정해진다. 우리 기준에서 <strong>5 [dB] 오를 때마다 허용시간이 절반</strong>이 되는 것은 <strong>가청 소음</strong>이다.<p><strong>◈ 암기</strong> <u>5 [dB] 마다 절반</u> — 3이 아니다.</p><p><strong>5 [dB] 마다 절반</strong>이라는 규칙은 <strong>가청 소음</strong>의 것이다. 보기는 이 숫자만 3으로 바꿔 놓았다.</p><div style=\"margin:12px 0 2px;font-weight:700\">소음의 허용기준</div><div style=\"overflow-x:auto\"><table style=\"border-colla 1 {,} 000 \\times 1 = 0.027225 \\times 1 {,} 000 \\fallingdotseq 27.2$ [J]이다.</li></ul><p><strong>◈ 암기</strong> <u>T가 약분된다</u> — 답은 13.6 [J] 하나. · <u>500 [Ω] 이면 13.6 [J]</u>.</p><p>핵심은 <strong>통전시간 </strong>$T$<strong>가 약분되어 사라진다</strong>는 점이다. 그래서 <strong>시간과 무관하게 약 13.6 [J]</strong>이라는 하나의 값이 나온다. 이것이 <strong>감전의 위험한계에너지</strong>다.<br>$I = 165 / \\sqrt{T}$를 넣으면 $T$<strong>가 약분되어 사라진다</strong>. 그래서 <strong>통전시간과 무관하게 저항 500 [Ω] 에서는 언제나 약 13.6 [J]</strong>이 나온다.</p>", "nq": 4}, "card_ele_t072": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "인체의 전기저항", "front": "인체의 전기저항은?", "back": "<ul><li><strong>통전경로</strong>는 <strong>전류가 어디로 흐르는가</strong>를 말할 뿐, <strong>피부 저항 자체를 바꾸지는 않는다</strong>. 위험도에는 영향을 주지만 저항의 인자는 아니다.</li><li>물에 젖으면 <strong>약 1/25로</strong> 떨어진다. 1/12는 <strong>땀에 젖었을 때</strong>의 값이다.</li><li><strong>인가전압이 클수록 피부저항은 크게 떨어진다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>통전경로는 위험도를 가르지 저항을 바꾸지 않는다</u>. · <u>땀 1/12, 물 1/25</u>.</p><p>인체 저항의 어림값 — <strong>피부 저항 약 2,500 [Ω], 내부 저항 약 500 [Ω]</strong>. <strong>젖으면 1/25까지</strong> 떨어져 같은 전압에서도 훨씬 위험해진다.<br><strong>땀은 1/12, 물은 1/25</strong> 두 숫자를 짝으로 잡아 둔다. <strong>젖을수록 훨씬 위험</strong> 하다는 것이 요지이며, 물기 있는 장소의 누전차단기를 <strong>15 [mA]</strong>로 낮추는 근거이기도 하다.</p><div style=\"margin:12px 0 2px;font-weight:700\">피부 전기저항에 영향을 주는 것</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">인자</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방향</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접촉면적</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>넓을수록 저항이 작다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">전류가 지날 길이 넓어진다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인가전압</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높을수록 저항이 작다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">각질층이 뚫린다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인가시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>길수록 저항이 작다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">땀이 나고 각질이 젖는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접촉부위</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">부위마다 다르다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">손바닥·발바닥은 두껍다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>수분(땀)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>젖을수록 저항이 작다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">1/12 ~ 1/25로 떨어진다</td></tr></tbody></table></div>", "nq": 3}, "card_ele_t002": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "누전차단기의 시설", "front": "누전차단기의 시설의 식은?", "back": "<ul><li><strong>50 [V]를 초과</strong>하는 저압 기계기구로서 사람이 쉽게 접촉할 우려가 있는 곳에 시설하는 것에는 누전차단기를 설치한다. 50 [V]는 국제적으로 <strong>교류에서 사람이 견딜 수 있다고 보는 한계</strong>로 삼는 값이다.</li><li>물기가 있는 곳은 <strong>인체 저항이 크게 떨어져</strong> 더 엄격하게 잡는다. 일반 장소의 30 [mA] 대신 <strong>15 [mA] 이하</strong>, 동작시간은 <strong>0.03초 이하</strong>다.</li><li><strong>사용전압 50 [V]를 넘으면</strong> 누전차단기를 달아야 한다. 50 [V] 아래는 감전되어도 위험이 낮다고 본다.</li></ul><p><strong>◈ 암기</strong> <u>일반 30, 물기 15</u> — 시간은 둘 다 0.03초. · <u>50 [V] 넘으면 누전차단기</u>.</p><p>「<u>50 [V] 초과</u>」가 기준값이다. 안전보건규칙 제304조가 정하는 <u>대상 장소(물기·도전성 높은 장소, 임시배선 등)</u> 와는 별개의 규정이니 섞지 않는다.<br>30 [mA]·0.03초는 Dalziel의 심실세동 한계 $I = 165 / \\sqrt{T}$에서 나온 값이다. 물기가 있으면 그 여유가 사라진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">누전차단기의 정격감도전류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">설치 장소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">정격감도전류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">동작시간</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">일반 장소</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>30 [mA] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.03초 이내</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물기 있는 장소</u> (욕실·화장실 등)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>15 [mA] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.03초 이내</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">인체 감전보호용</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">30 [mA] 이하</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">0.03초 이내</td></tr></tbody></table></div><p><em>근거 — 한국전기설비규정(KEC) 211.2.4</em></p>", "nq": 6}, "card_ele_t097": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "전격 위험도의 결정 인자", "front": "전격 위험도의 결정 인자는?", "back": "<ul><li><strong>전압</strong>은 직접 인자가 아니다. 전격의 정도를 정하는 것은 <strong>전류의 크기 · 통전시간 · 통전경로</strong> 세 가지다.</li><li><strong>전압</strong>은 주된 인자가 아니다. 셋은 <strong>통전전류 · 통전시간 · 통전경로</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>전압이 아니라 전류</u>. · <u>전압이 아니라 전류 · 시간 · 경로</u>.</p><p>전압은 <strong>인체저항과 함께 전류를 만드는 재료</strong>일 뿐, 위험을 결정하는 것은 <strong>실제로 몸에 흐른 전류</strong>다. 같은 전압이라도 젖어 있으면 전류가 훨씬 커진다.<br>전압은 <strong>인체저항과 함께 전류를 만드는 재료</strong>일 뿐이다. 같은 전압이라도 <strong>젖어 있으면 전류가 25배</strong>로 커진다. 결국 <strong>몸에 실제로 흐른 전류</strong>가 위험을 정한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">감전 위험도를 정하는 인자</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">인자</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>통전전류의 크기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 중요한 1차 인자</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>통전시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$I = 165 / \\sqrt{T}$ — 짧을수록 견딘다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>통전경로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>왼손 → 가슴이 가장 위험(1.5)</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전원의 종류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">교류가 직류보다 위험</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>주파수와 파형</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">상용주파수(60 [Hz])가 위험</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t095": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "감전사의 메커니즘", "front": "감전사의 메커니즘은?", "back": "<ul><li><strong>내장파열</strong>은 부딪히거나 눌렸을 때 생기는 기계적 손상이다. 전류가 흘러 죽는 메커니즘이 아니다.</li><li><strong>흉골에 전류가 흘러 혈압이 약해진다</strong>는 메커니즘은 없다. 세 가지는 <strong>심실세동 · 흉부수축에 의한 질식 · 호흡중추신경 마비</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>심실세동 · 흉부수축 · 호흡중추 마비</u> 셋.</p><p>세 가지가 모두 <strong>심장이 멈추거나 숨이 멎는</strong> 것이다. 그래서 응급처치도 <strong>인공호흡과 심폐소생술</strong>로 이어진다.<br>세 가지 모두 <strong>심장이 멈추거나 숨이 멎는</strong> 것이다. <strong>「혈압이 약해져」</strong>라는 표현은 어느 메커니즘에도 없다.</p><div style=\"margin:12px 0 2px;font-weight:700\">감전사(전격사)의 세 가지 메커니즘</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">메커니즘</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇이 멈추나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>심실세동</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>심장의 펌프 기능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 흔하다</u> · $I = 165 / \\sqrt{T}$ [mA]</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>흉부 근육 수축에 의한 질식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>숨쉬기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">가슴 근육이 굳는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>호흡중추신경 마비</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>숨쉬기(뇌 쪽)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">머리를 지나는 통전</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t109": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "아크용접 작업의 감전 방지", "front": "아크용접 작업의 감전 방지는?", "back": "<strong>용접봉은 절연하면 안 된다</strong>. 용접봉은 <strong>전류가 흘러 아크를 만드는 전극</strong>이라 절연하면 용접 자체가 되지 않는다.<p><strong>◈ 암기</strong> <u>홀더는 절연, 용접봉은 아니다</u>.</p><p><strong>절연해야 하는 것은 사람이 잡는 부분</strong>이다 — <strong>홀더 · 장갑 · 케이블 피복</strong>. <strong>용접봉 자체는 전극</strong>이라 절연 대상이 아니다. 여기에 <strong>자동전격방지장치</strong>를 더한다.</p>", "nq": 1}, "card_ele_t110": {"kind": "용어형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "방폭의 기본 개념", "front": "방폭의 기본 개념이란?", "back": "<ul><li><strong>주위 공기의 절연능력을 높인다</strong>는 개념은 없다. 세 가지는 <strong>격리 · 증강 · 억제</strong>다.</li><li><strong>유입 방폭구조는 「점화원의 격리」</strong>다. <strong>「폭발성 위험분위기 해소」에 해당하는 것은 압력 방폭구조</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>격리 · 증강 · 억제</u> 셋. · <u>위험분위기 해소는 압력 방폭구조</u>.</p><p>세 개념을 <strong>가두거나 · 안 나게 하거나 · 힘을 뺀다</strong>로 새긴다. <strong>공기의 절연능력은 사람이 바꿀 수 없다</strong>는 점에서도 보기 ;text-align:left;\">이을수록 좌굴에 약하다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">이을 때 볼트·전용철물</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>4개 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">이음부가 벌어지지 않게</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">높이 3.5 [m] 초과 시</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>2 [m] 이내마다 수평연결재 2방향</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">중간을 잡아 준다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">강관(파이프서포트 제외)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">2 [m] 마다 수평연결재 2방향</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제332조</em></p>", "nq": 4}, "card_con_t081": {"kind": "단답형", "fq": 3, "subject": "건설안전기술", "chapter": "건설공구·장비", "mid": "굴착기계의 종류와 용도", "front": "굴착기계의 종류와 용도는?", "back": "<ul><li><strong>백호(드래그 셔블)</strong>다. 버킷이 <strong>안쪽으로 당겨지며</strong> 기계보다 낮은 곳을 판다.</li><li><strong>백호우</strong>다. 기계보다 낮은 곳을 파며 <strong>수중굴착</strong>도 할 수 있다.</li><li><strong>파워 쇼벨</strong>이다. 버킷이 <strong>바깥으로 밀리며</strong> 기계보다 높은 곳을 판다.</li></ul><p><strong>◈ 암기</strong> <u>낮은 곳은 백호</u>. · <u>낮은 곳과 물속은 백호</u>.</p><p><strong>파워 셔블은 위, 백호는 아래</strong>다. 버킷이 <strong>바깥으로 밀리는가 안으로 당겨지는가</strong>로 갈린다.<br>105번과 짝이다. <strong>백호는 아래, 파워 셔블은 위</strong>다. <strong>수중굴착이 가능한 것</strong>은 백호·드래그라인·클램셸이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">굴착기계 — 어디를 파는가</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">파는 위치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">특징</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>백호(드래그 셔블)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기계보다 낮은 곳</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 널리 쓰인다</u> · 수중굴착도 가능</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>파워 셔블</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기계보다 높은 곳</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">버킷이 바깥으로 밀린다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>드래그라인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기계보다 낮고 넓은 곳</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">연약지반 · 수중</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>클램셸</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>좁고 깊은 수직 굴착</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">우물통 · 잠함</td></tr></tbody></table></div>", "nq": 3}, "card_con_t102": {"kind": "단답형", "fq": 1, "subject": "건설안전기술", "chapter": "건설공사 안전개요", "mid": "와이어로프 등 달기구의 안전계수", "front": "와이어로프 등 달기구의 안전계수는?", "back": "<strong>5 이상</strong>이다. 양중기 달기구의 기본 안전계수다.<p><strong>◈ 암기</strong> <u>사람 10 · 화물 5 · 훅 3 · 그 밖 4</u>.</p><p><strong>사람이 타면 10, 짐만 걸면 5, 금속 부속은 3, 나머지는 4</strong>다. <strong>사람이 매달릴수록 여유를 크게</strong> 잡는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">양중기 달기구의 안전계수 (규칙 제163조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">부재</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">안전계수</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>근로자가 탑승하는 운반구를 지지하는 달기 와이어로프·달기 체인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>10 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사람이 타면 10</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>화물의 하중을 직접 지지하는 달기 와이어로프·달기 체인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>5 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>훅 · 섀클 · 클램프 · 리프팅 빔</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>3 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>그 밖의 경우</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>4 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제163조</em></p>", "nq": 1}, "card_con_t020": {"kind": "단답형", "fq": 3, "subject": "건설안전기술", "chapter": "건설공사 안전개요", "mid": "콘크리트 타설작업", "front": "콘크리트 타설작업은?", "back": "<ul><li>이상이 발견되면 <strong>작업을 중지하고</strong> 근로자를 대피시킨 뒤 보강한다. 「중지하지 아니하고 보강」은 사람을 위험 속에 두는 것이라 조문과 반대다.</li><li>진동기를 지나치게 쓰면 <strong>재료가 분리되어 오히려 품질이 떨어지고, 거푸집에 측압이 커져</strong> 터질 수 있다. 「많을수록 좋다」는 틀렸다.</li><li><strong>A는 변형, B는 지반의 침하 유무</strong>다.</li></ul><p><strong>◈ 암기</strong> 이상이 보이면 <u>먼저 멈추고 대피</u>, 보강은 그다음. · <u>진동기는 적당히</u> — 많이 쓰면 재료가 갈린다.</p><p>거푸집 붕괴의 대표 원인이 <strong>집중 타설과 과속 타설</strong>이다. 한 곳에 몰아 부으면 측압이 급격히 커진다.<br>거푸집에 걸리는 <strong>측압</strong>은 <strong>타설 속도가 빠를수록 · 온도가 낮을수록 · 슬럼프가 클수록 · 다짐이 셀수록</strong> 커진다. 진동기를 과하게 쓰면 이 가운데 마지막 항이 커진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">콘크리트 타설작업 시의 준수사항 (규칙 제334조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">준수사항</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>작업 시작 전 거푸집동바리등의 변형·변위 및 지반의 침하 유무를 점검하고 이상이 있으면 보수할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>A: 변형, B: 지반의 침하 유무</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>작업 중에는 , "nq": 1}, "card_con_t052": {"kind": "공식형", "fq": 1, "subject": "건설안전기술", "chapter": "건설공사 안전개요", "mid": "굴착면의 기울기 기준", "front": "굴착면의 기울기 기준의 식은?", "back": "<ul><li>출제 당시 기준으로 연암은 <strong>1 : 0.5</strong> 였다. 다만 <strong>현행 기준은 다르다</strong>. 아래 주의사항을 반드시 함께 보아야 한다.</li><li>출제 당시 기준으로 <strong>보통흙 습지는 1 : 1 ~ 1 : 1.5</strong> 였다. 다만 <strong>현행 기준은 다르다</strong>. 아래 주의사항을 반드시 함께 보아야 한다.</li><li>옛 기준으로 보통흙 건지는 <strong>1 : 0.5 ~ 1 : 1</strong>이다. 1 : 0.3이 아니다. 다만 <strong>현행 기준은 「보통흙」 구분 자체가 없다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>1.8 · 1.0 · 0.5 · 1.2</u> — 모래 · 연암풍화암 · 경암 · 그 밖의 흙. · <u>1.8 · 1.0 · 0.5 · 1.2</u> 네 줄.</p><p>현행 기준은 네 줄로 단순해졌다 — <strong>모래 1:1.8 · 연암 및 풍화암 1:1.0 · 경암 1:0.5 · 그 밖의 흙 1:1.2</strong>. <strong>연암이 1:0.5에서 1:1.0으로 완만해진 것</strong>이 가장 큰 변화다.<br>현행 기준은 네 줄뿐이다 — <strong>모래 1:1.8 · 연암 및 풍화암 1:1.0 · 경암 1:0.5 · 그 밖의 흙 1:1.2</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">굴착면의 기울기 — 현행 기준</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">지반의 종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기울기</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">옛 기준</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>모래</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 : 1.8</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">1 : 1.8</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>연암 및 풍화암</u></td><td style=\"border:1px solid #cb \"margin:12px 0 2px;font-weight:700\">공사 진척에 따른 산업안전보건관리비 사용기준</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">공정률</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">최소 사용기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>50 [%] 이상 70 [%] 미만</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>50 [%] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">공정률 65 [%]가 여기 든다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>70 [%] 이상 90 [%] 미만</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>70 [%] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>90 [%] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>90 [%] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 7}, "card_con_t112": {"kind": "단답형", "fq": 1, "subject": "건설안전기술", "chapter": "건설공사 안전개요", "mid": "차량계 하역운반기계", "front": "차량계 하역운반기계는?", "back": "<strong>안전관리자 선임</strong>은 <strong>사업장 전체의 안전관리 체제</strong>에 관한 일이지, 그 작업에서 고려할 사항이 아니다.<p><strong>◈ 암기</strong> <u>안전관리자 선임은 사업장 ft;\">같은 조문</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전관리자의 선임</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사업장 전체의 관리 체제</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">해당하지 않는다</td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제171조·제177조</em></p>", "nq": 1}}};</script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const STUDY=MODE==='study';
const KEY=(STUDY?'safestudy_':'safecbt_')+D.round;
let S={i:0,ans:{},open:{},started:STUDY?1:0,elapsed:0,done:false};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
if(!S.open)S.open={};
if(STUDY)S.started=1;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function kx(el){if(window.renderMathInElement)renderMathInElement(el,{delimiters:[
 {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}

const MARK=['①','②','③','④'];
const LV={1:['#10b981','쉬움'],2:['#f59e0b','보통'],3:['#ef4444','어려움']};

function fmt(s){const m=Math.floor(s/60),x=s%60;
 return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+':'+String(x).padStart(2,'0');}

let tick=null;
function startTimer(){
 if(STUDY)return;
 clearInterval(tick);tick=setInterval(()=>{
  if(S.done)return;
  S.elapsed++;const left=D.limit-S.elapsed;
  const t=$('#timer'); if(!t)return;
  t.textContent=left>0?fmt(left):'00:00:00';
  t.classList.toggle('warn',left<600);
  if(left<=0)submit();
  if(S.elapsed%10===0)save();
 },1000);}

function intro(){
 $('#app').innerHTML=`<div class="wrap intro">
  <h2>${D.title}</h2>
  <p>6과목 120문항 · 시험시간 3시간</p>
  <p>합격 기준 — 과목당 40점 이상, 전 과목 평균 60점 이상</p>
  <p style="margin-top:14px;font-size:13px">답만 고르고 끝에 제출합니다.
   해설과 암기카드는 채점한 뒤에 열립니다.</p>
  <button class="big" id="go">시험 시작</button>
  ${Object.keys(S.ans).length?'<div style="margin-top:12px;font-size:13px;color:#64748b">이어서 풀면 지난번 답안이 그대로 살아 있습니다</div>':''}
 </div>`;
 $('#go').onclick=()=>{S.started=1;save();render();startTimer();};
}

// 해설이 열려 있는가 — 직접 여닫은 적이 있으면 그 뜻을 따른다
function solOpen(q){
 if(S.open[q.n]!==undefined)return S.open[q.n];
 return S.done||(STUDY&&!!S.ans[q.n]);
}

function qHTML(q){
 const a=S.ans[q.n], graded=(STUDY&&a)||S.done, show=STUDY||S.done;
 let h=`<div class="wrap"><div class="qh"><span class="qno">${String(q.n).padStart(3,'0')}</span>
  <span class="tag" style="background:${LV[q.lv][0]}">난이도 ${q.lv}·${LV[q.lv][1]}</span>
  <span class="tag" style="background:#6366f1">${q.kind}</span>
  <span class="tag" style="background:#f59e0b">빈출 ${'★'.repeat(q.fq)+'☆'.repeat(3-q.fq)}</span>
  <span class="subj">제${q.s}과목 ${D.subj[q.s-1]}</span>`;
 if(show){
   h+=`<span class="acts">
    <button class="mini${solOpen(q)?' on':''}" id="tsol">📖 해설 ${solOpen(q)?'닫기':'보기'}</button>
    ${q.card&&D.cards[q.card]?'<button class="mini cd" id="tcard">🃏 암기카드</button>':''}
   </span>`;
 }
 h+=`</div><div class="stem">${q.t}</div>`;
 if(q.cond)h+=`<div class="cond">${q.cond}</div>`;
 if(q.img)h+=`<img class="stemimg" src="img/${q.img}">`;
 for(let k=0;k<4;k++){
   let cls='opt';
   if(a===k+1)cls+=' sel';
   if(graded){ if(k+1===q.a)cls='opt right'; else if(a===k+1)cls='opt wrong'; }
   h+=`<button class="${cls}" data-k="${k+1}"><span class="n">${MARK[k]}</span><span>${q.c[k]}</span></button>`;
 }
 if(graded){
   h+= a===q.a ? `<div class="vline o">정답입니다 · 정답 ${q.a}번</div>`
              : `<div class="vline x">${a?'틀렸습니다 · 고른 답 '+a+'번 · ':'미응답 · '}정답 ${q.a}번</div>`;
 }
 if(show&&solOpen(q)){
   h+=`<div class="sol"><div class="lbl">해설</div><div>${q.sol}</div>`;
   if(q.w)h+=`<div class="lbl">오답 분석</div><div>${q.w}</div>`;
   if(q.pt)h+=`<div class="lbl g">관련 개념 · 암기</div><div class="box">${q.pt}</div>`;
   if(q.law)h+=q.law;
   h+=`</div>`;
 }
 return h+'</div>';
}

function render(){
 if(!S.started){intro();return;}
 if(!STUDY&&S.done&&S.i<0){result();return;}
 const q=D.q[S.i];
 $('#app').innerHTML=qHTML(q);
 $$('.opt').forEach(b=>b.onclick=()=>{
   S.ans[q.n]=+b.dataset.k;
   if(STUDY&&S.open[q.n]===undefined)S.open[q.n]=true;
   save();
   if(STUDY||S.done){render();}
   else{$$('.opt').forEach(x=>x.classList.toggle('sel',x===b));paint();}
 });
 const ts=$('#tsol'); if(ts)ts.onclick=()=>{S.open[q.n]=!solOpen(q);save();render();};
 const tc=$('#tcard'); if(tc)tc.onclick=()=>openCard(q.card);
 kx($('#app'));
 stat();
 $('#prev').disabled=S.i===0; $('#next').disabled=S.i===119;
 paint();
 window.scrollTo(0,0);
}

function stat(){
 const n=Object.keys(S.ans).length;
 if(STUDY){
   let ok=0; D.q.forEach(q=>{if(S.ans[q.n]===q.a)ok++;});
   $('#prog').innerHTML=`<b>${S.i+1}</b> / 120 · 푼 문항 <b>${n}</b> · 맞힘 <b>${ok}</b>`;
   const r=$('#rate');
   if(r)r.textContent=n?`정답률 ${Math.round(ok/n*100)}%`:'정답률 —';
 }else{
   $('#prog').innerHTML=S.done?`채점 완료`:`<b>${S.i+1}</b> / 120 · 푸는 중 <b>${n}</b>`;
 }
}

/* 암기카드 팝업 */
let mflip=false;
function openCard(id){
 const c=D.cards[id]; if(!c)return;
 mflip=false;
 $('#mbody').innerHTML=`<button class="mx" id="mx">✕</button>
  <div class="mcard" id="mcard">
   <div class="mface">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span class="stars">${'★'.repeat(c.fq)+'☆'.repeat(3-c.fq)}</span>
     <span>${c.subject}${c.chapter?' · '+c.chapter:''}</span>
     <span class="mcid">${id}</span></div>
    <div class="mq">${c.front}</div>
    <div class="mhint">카드를 누르면 뒤집힙니다 · Esc 닫기</div>
   </div>
   <div class="mface back">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span>${c.mid}</span><span class="mcid">${id}</span></div>
    <div class="ma">${c.back}</div>
    <div class="mfoot"><span>이 개념을 묻는 문항 ${c.nq}개</span>
     <a href="../_암기카드.html#${id}" target="_blank">카드 전체 보기 →</a></div>
   </div>
  </div>`;
 $('#modal').classList.add('on');
 kx($('#mbody'));
 fitCard(); setTimeout(fitCard,260);
 $('#mcard').onclick=()=>{mflip=!mflip;$('#mcard').classList.toggle('flip',mflip);};
 $('#mx').onclick=e=>{e.stopPropagation();closeCard();};
}
function fitCard(){
 const mc=$('#mcard'); if(!mc)return;
 mc.style.height='120px';
 const h=Math.max(...[...mc.querySelectorAll('.mface')].map(f=>f.scrollHeight));
 mc.style.height=Math.min(window.innerHeight*0.78,Math.max(300,h+4))+'px';
}
function closeCard(){$('#modal').classList.remove('on');}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeCard();};
window.addEventListener('resize',()=>{if($('#modal').classList.contains('on'))fitCard();});

function paint(){
 $$('.pg').forEach(b=>{
   const n=+b.dataset.n, q=D.q[n-1];
   const marked=STUDY?!!S.ans[n]:S.done;
   let c='pg';
   if(marked&&(STUDY||S.done))c+=(S.ans[n]===q.a?' ok':' no');
   else if(S.ans[n])c+=' done';
   if(n-1===S.i)c+=' cur';
   b.className=c;
 });
}

function submit(){
 if(STUDY||S.done)return;
 const un=120-Object.keys(S.ans).length;
 if(un>0&&!confirm('안 푼 문제가 '+un+'개 있습니다. 제출할까요?'))return;
 S.done=true;clearInterval(tick);save();S.i=-1;result();
}

function result(){
 const per=[0,0,0,0,0,0],tot=[0,0,0,0,0,0];
 let right=0;
 D.q.forEach(q=>{tot[q.s-1]++;if(S.ans[q.n]===q.a){per[q.s-1]++;right++;}});
 const scores=per.map((v,i)=>Math.round(v/tot[i]*100));
 const avg=Math.round(right/120*100);
 const pass=avg>=60&&scores.every(s=>s>=40);
 let h=`<div class="result"><div style="text-align:center;color:#64748b;font-size:13px">${D.title} · 채점 결과</div>
  <div class="score">${avg}<span style="font-size:20px;color:#94a3b8">점</span></div>
  <div style="text-align:center;color:#64748b;font-size:14px">120문항 중 <b>${right}</b>문항 정답 · 소요 ${fmt(S.elapsed)}</div>
  <div class="verdict ${pass?'pass':'fail'}">${pass?'합격':'불합격'}</div>
  <table class="stab"><tr><th>과목</th><th>맞힌 문항</th><th>점수</th></tr>`;
 for(let i=0;i<6;i++){
   h+=`<tr><td style="text-align:left">제${i+1}과목 ${D.subj[i]}</td>
    <td>${per[i]} / ${tot[i]}</td><td class="${scores[i]<40?'bad':''}">${scores[i]}</td></tr>`;
 }
 h+=`</table><div style="font-size:12.5px;color:#64748b;text-align:center">합격 — 과목당 40점 이상, 평균 60점 이상</div>
  <div class="rowbtns">
   <button class="nbtn pri" id="rw">틀린 문제만 다시 보기</button>
   <button class="nbtn" id="rall">전체 해설 보기</button>
   <button class="nbtn" id="rst">다시 풀기</button>
  </div></div>`;
 $('#app').innerHTML=h;
 paint(); stat();
 $('#rw').onclick=()=>{const bad=D.q.findIndex(q=>S.ans[q.n]!==q.a);S.i=bad<0?0:bad;render();};
 $('#rall').onclick=()=>{S.i=0;render();};
 $('#rst').onclick=()=>{if(confirm('답안을 지우고 처음부터 다시 풀까요?')){
   S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();startTimer();}};
}

function build(){
 let p='';
 for(let s=1;s<=6;s++){
   p+=`<div class="palhd">제${s}과목 ${D.subj[s-1]}</div><div class="palgrid">`;
   D.q.filter(q=>q.s===s).forEach(q=>{p+=`<button class="pg" data-n="${q.n}">${q.n}</button>`;});
   p+='</div>';
 }
 $('#pal').innerHTML=p;
 $$('.pg').forEach(b=>b.onclick=()=>{S.i=+b.dataset.n-1;save();render();$('#pal').classList.remove('open');});
}

$('#prev').onclick=()=>{if(S.i>0){S.i--;save();render();}};
$('#next').onclick=()=>{if(S.i<119){S.i++;save();render();}};
$('#palbtn').onclick=()=>$('#pal').classList.toggle('open');
const sb=$('#sub'); if(sb)sb.onclick=submit;
const rs=$('#reset'); if(rs)rs.onclick=()=>{if(confirm('푼 기록을 모두 지울까요?')){
 S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();}};
document.addEventListener('keydown',e=>{
 if($('#modal').classList.contains('on')){
   if(e.key==='Escape')closeCard();
   if(e.key===' '){e.preventDefault();$('#mcard').click();}
   return;
 }
 if(e.key==='ArrowLeft')$('#prev').click();
 if(e.key==='ArrowRight')$('#next').click();
 if('1234'.includes(e.key)){const b=$$('.opt')[+e.key-1];if(b)b.click();}
 if(e.key==='s'||e.key==='S'){const t=$('#tsol');if(t)t.click();}
 if(e.key==='c'||e.key==='C'){const t=$('#tcard');if(t)t.click();}
});
build();
const hm=location.hash.match(/^#q(\d+)/);
if(hm){S.started=1;S.i=Math.max(0,Math.min(119,+hm[1]-1));save();}
if(!STUDY&&S.done){if(hm){render();}else{S.i=-1;result();}}
else{render();if(S.started)startTimer();}
</script>
</body></html>
