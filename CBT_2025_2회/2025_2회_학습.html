ding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t082": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "인간 전달함수(Human Transfer Function)", "front": "인간 전달함수(Human Transfer Function)은?", "back": "<strong>정신운동의 묘사성</strong>은 결점이 아니다. 세 가지 결점은 <strong>입력의 협소성 · 시점적 제약성 · 불충분한 직무 묘사</strong>다.<p><strong>◈ 암기</strong> <u>입력 협소 · 시점 제약 · 직무 묘사 불충분</u> 셋.</p><p>인간 전달함수는 <strong>사람의 반응을 수식으로 모형화</strong> 한 것이다. 결점 셋은 모두 <strong>실제 사람을 다 담아내지 못한다</strong>는 한 가지를 가리킨다.</p>", "nq": 1}, "card_erg_t083": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "기계 일반", "mid": "소음의 방지대책", "front": "소음의 방지대책은?", "back": "<ul><li><strong>음원 대책</strong>이 가장 효과적이다. <strong>소리가 나는 곳 자체를 없애거나 줄이는</strong> 것이라 근본 대책이다.</li><li><strong>귀마개와 귀덮개</strong>는 <strong>수음자(사람) 대책</strong>이다. 가장 소극적인 방법이다.</li><li><strong>「소음의 분배」</strong>라는 대책은 없다. <strong>소음을 나눈다고 줄어들지 않는다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>음원 → 경로 → 사람</u> 순. · <u>귀마개는 사람 쪽 대책</u>.</p><p>위험관리의 우선순위와 같은 논리다 — <strong>위험 자체를 없애는 쪽이 위, 사람이 견디게 하는 쪽이 아래</strong>. 보호구는 언제나 마지막이다.<br><strong>음원 → 전파경로 → 수음자</strong> 순으로 대책을 세운다. <strong>보호구는 언제나 마지막</strong>이며, 위험관리의 우선순위와 같은 논리다.</p><div style=\"margin:12px 0 2px;font-weight:700\">소음 대책의 우선순위</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">순위</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대책</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>음원 대책</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>소음원 제거·대체 · 저소음 기계로 교체 · 방음 커버 · 마찰 감소</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전파경로 대책</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>차음벽 · 흡음재 · 거리 두기 · 지향성 조절</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>수음자 대책</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>귀마개 · 귀덮개</u> · 작업시간 단축 — 가장 소극적</td></tr></tbody></table></div>", "nq": 4}, "card_erg_t084": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "공정안전", "mid": "공정안전보고서의 제출 대상", "front": "공정안전보고서의 제출 대상은?", "back": "<strong>차량 등의 운송설비업</strong>은 PSM 적용 대상이 아니다. 나머지 셋은 모두 <strong>화학물질을 만드는 업종</strong>이다.<p><strong>◈ 암기</strong> <u>운송업은 제조업이 아니다</u>.</p><p>일곱 업종은 모두 <strong>위험물질을 대량으로 다루는 화학 제조업</strong>이다. 업종에 들지 않아도 <strong>규정량 이상의 유해·위험물질을 취급하면</strong> 대상이 된다.</p><div style=\"margin:12px 0 2px;font-weight:700\">공정안전보고서 제출 대상 업종 (시행령 제43조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">업종</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>원유 정제처리업</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기타 석유정제물 재처리업</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>석유화학계 기초화학물질 제조업 · 합성수지 및 기타 플라스틱물질 제조업</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>질소·인산 및 칼리질 비료 제조업 · 복합비료 제조업</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">단순 혼합·배합은 제외</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>화학 살균·살충제 및 농업용 약제 제조업(농약 원제 제조)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>화약 및 불꽃제품 제조업</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 시행령 제43조</em></p>", "nq": 1}, "card_erg_t085": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "FMEA 의 평가요소", "front": "FMEA 의 평가요소는?", "back": "<strong>「고장의 영향크기」</strong>라는 평가요소는 없다. 다섯 요소는 <strong>기능적 고장 영향의 중요도 · 영향을 미치는 시스템의 범위 · 고장발생의 빈도 · 고장방지의 가능성 · 신규 설계의 정도</strong>다.<p><strong>◈ 암기</strong> <u>중요도 · 범위 · 빈도 · 방지 가능성 · 신규 설계</u> 다섯.</p><p>FMEA 는 <strong>귀납적·정성적</strong>이며 <strong>아래에서 위로</strong> 올라간다. <strong>치명도까지 숫자로 매기면 CA</strong>이고, 둘을 합친 것이 <strong>FMECA</strong>다.</p><div style=\"margin:12px 0 2px;font-weight:700\">FMEA 의 다섯 평가요소</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">평가요소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 보나</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기능적 고장 영향의 중요도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">그 고장이 기능에 얼마나 치명적인가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>영향을 미치는 시스템의 범위</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">어디까지 번지는가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>고장발생의 빈도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">얼마나 자주 나는가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>고장방지의 가능성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">막을 수 있는가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>신규 설계의 정도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">검증되지 않은 새 설계인가</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t008": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "시스템 수명주기와 위험분석 기법", "front": "시스템 수명주기와 위험분석 기법은?", "back": "<ul><li><strong>PHA(예비위험분석)</strong>다. 시스템을 어떻게 만들지 아직 구상만 하고 있는 <strong>개념 형성 단계</strong>에서 「이 시스템에 어떤 위험이 있을 수 있는가」를 크게 훑어보는 최초의 분석이다.</li><li><strong>운전단계(운용단계)</strong>가 마지막이다. 만들어 쓰기 시작한 뒤가 가장 나중이다.</li></ul><p><strong>◈ 암기</strong> <u>예비(P)가 가장 먼저</u> — 구상기 PHA → 설계기 FHA·FMEA·FTA → 운용기 O&amp;SHA. · <u>구 · 정 · 개 · 생 · 운</u> — 운전이 마지막.</p><p>시스템 수명주기와 분석기법의 짝. <u>구상기 PHA → 설계·개발기 FHA·FMEA·FTA → 생산기 안전성 검토 → 운용기 O&amp;SHA</u>. 「<u>예비(P)가 가장 먼저</u>」라는 이름 자체가 힌트다.<br><strong>단계마다 알맞은 분석기법</strong>이 있다. <strong>PHA 는 맨 처음(구상단계)</strong>에 하는 것이 특징이라 「예비(preliminary)」라는 이름이 붙었다.</p><div style=\"margin:12px 0 2px;font-weight:700\">시스템 수명주기의 다섯 단계와 위험분석</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">주요 분석</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>구상단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>PHA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 먼저 하는 개략 분석</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정의(사양결정)단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>FHA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">분담 제작 부분의 위험</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>개발단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>FMEA · FTA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">설계 확정</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생산단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">품질관리</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">제조</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>5</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>운전(운용)단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안전점검 · O&amp;SHA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>마지막</u></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t086": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "가용도(availability)", "front": "가용도(availability)의 식은?", "back": "<ul><li>$A = \\dfrac{\\mathrm{MTBF}}{\\mathrm{MTBF} + \\mathrm{MTTR}}$ 다. $0.9 = \\dfrac{\\mathrm{MTBF}}{\\mathrm{MTBF} + 2}$ 이므로 $0.9 \\mathrm{MTBF} + 1.8 = \\mathrm{MTBF}$, $0.1 \\mathrm{MTBF} = 1.8$, $\\mathrm{MTBF} = 18$ 시간이다.</li><li>$\\text{가용도} A = \\dfrac{\\mu}{\\lambda + \\mu} = \\dfrac{0.5}{0.001 + 0.5} = \\dfrac{0.5}{0.501} \\fallingdotseq 0.998$</li></ul><p><strong>◈ 암기</strong> $A = \\mathrm{MTBF} \\div ( \\mathrm{MTBF} + \\mathrm{MTTR} )$. · <u>가용도 = 수리율 ÷ (고장률 + 수리율)</u>.</p><p>$A = \\dfrac{\\mathrm{MTBF}}{\\mathrm{MTBF} + \\mathrm{MTTR}} = \\dfrac{\\mathrm{MTBF}}{\\mathrm{MTTF} + \\mathrm{MTTR}}$ 다. <strong>전체 시간 가운데 쓸 수 있는 시간의 비율</strong>을 뜻한다. <strong>MTBF = MTTF + MTTR</strong>이라는 관계도 함께 나온다.<br><strong>고장률이 수리율보다 훨씬 작으므로 가용도는 1 에 아주 가깝다</strong> — <strong>네 보기 중 가장 큰 값</strong>을 고르면 된다. <strong>분자에 수리율이 오는 것</strong>만 헷갈리지 않으면 된다.</p><div style=\"margin:12px 0 2px;font-weight:700\">가용도(가동성)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>고장률로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$A = \\dfrac{\\mu}{\\lambda + \\mu}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>μ 는 수리율, λ 는 고장률</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>시간으로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$A = \\dfrac{\\mathrm{MTBF}}{\\mathrm{MTBF} + \\mathrm{MTTR}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>이 문항</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{0.5}{0.501} \\fallingdotseq 0.998$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t070": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "욕조곡선(bathtub curve)", "front": "욕조곡선(bathtub curve)는?", "back": "<ul><li><strong>스크리닝(선별)</strong>은 <strong>초기고장</strong>을 걸러 내는 방법이다. 마모고장 대책이 아니다.</li><li><strong>우발고장기간은 고장률이 낮고 일정</strong> 하다. 그래서 <strong>일정형(CFR)</strong>이라 부르며, 이 구간이 <strong>설비의 실제 사용 기간</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>걸러 내면 초기, 미리 갈면 마모</u>. · <u>감소 · 일정 · 증가</u>.</p><p><strong>초기고장 대책 셋(번인 · 디버깅 · 스크리닝)</strong>은 모두 <strong>쓰기 전에 불량품을 걸러 낸다</strong>는 한 가지다. <strong>마모고장 대책은 예방보전</strong> 하나뿐이라고 잡아 두면 된다.<br><strong>처음에는 떨어지고(불량품이 걸러져) · 가운데는 평평하고(우연한 고장만) · 끝에는 올라간다(닳아서)</strong>. 이 세 구간의 모양이 곧 이름의 유래다.</p><div style=\"margin:12px 0 2px;font-weight:700\">욕조곡선의 세 구간</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구간</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">고장률</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원인</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대책</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>초기고장</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>감소형(DFR)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">설계·제조 결함</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>번인 · 디버깅 · 스크리닝</u> — 미리 걸러 낸다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>우발고장</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>일정형(CFR)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">우연한 과부하</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>예비품 준비</u> · 안전계수 확보</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>마모고장</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>증가형(IFR)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">마모·피로·노화</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>예방보전(PM)</u> · 정기 교체</td></tr></tbody></table></div>", "nq": 2}, "card_erg_t087": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "의자 설계의 일반 원칙", "front": "의자 설계의 일반 원칙은?", "back": "<strong>요부 전만(前彎)</strong>을 유지해야 한다. 허리뼈는 본디 <strong>앞으로 살짝 굽은</strong> 모양인데, 이를 지켜 주어야 디스크 부담이 줄어든다.<p><strong>◈ 암기</strong> <u>전만이 정상, 후만이 문제</u>.</p><p><strong>요부 전만(lumbar lordosis)</strong>은 허리뼈가 앞으로 볼록한 정상 곡선이다. 의자에 오래 앉으면 이 곡선이 펴지거나 뒤로 굽어(후만) <strong>디스크 앞쪽이 눌린다</strong>. 그래서 등받이 아래쪽을 볼록하게 만든다.</p><div style=\"margin:12px 0 2px;font-weight:700\">의자 설계의 원칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원칙</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>요부 전만을 유지한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>허리의 앞굽음을 지킨다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「후만」이 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>디스크가 받는 압력을 줄인다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">체중을 고루 분산</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>등근육의 정적부하를 줄인다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">등받이로 받쳐 준다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">같은 자세를 오래 유지하지 않게</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>자세 고정을 줄인다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">자세를 바꿀 수 있게</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>조정이 용이해야 한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사람마다 맞춰 쓸 수 있게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">조절식 설계</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t032": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "인체계측 자료의 응용원칙", "front": "인체계측 자료의 응용원칙은?", "back": "<ul><li><strong>출입문</strong>은 가장 큰 사람이 지날 수 있어야 하므로 <strong>최대집단치(95 %tile)</strong>로 잡는다.</li><li><strong>평균치 설계</strong>다. 불특정 다수가 잠깐씩 쓰고 조절할 수도 없는 시설이라, 평균에 맞추는 것이 그나마 나은 선택이다.</li><li><strong>구조적 치수</strong>는 인체를 재는 <strong>방법</strong>을 가리키는 말이지 설계 원칙이 아니다. 응용원칙은 <strong>조절식 · 극단치 · 평균치</strong> 셋뿐이다.</li></ul><p><strong>◈ 암기</strong> <u>닿아야 하면 작은 사람(5), 지나가야 하면 큰 사람(95)</u>. · <u>조절이 안 되고 여럿이 잠깐 쓰면 평균치</u>.</p><p>우선순위는 <strong>조절식 &gt; 극단치 &gt; 평균치</strong>다. 평균치 설계는 어쩔 수 없을 때만 쓴다.<br>평균치 설계는 <strong>아무에게도 꼭 맞지 않는다</strong>는 약점이 있다. 그래서 조절식이 가능하면 언제나 조절식이 낫다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인체측정치 응용의 세 원칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원칙</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최대집단치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">95 %tile — 큰 사람 기준</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>출입문</u> · 통로 · 비상구 · 침대 길이</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최소집단치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">5 %tile — 작은 사람 기준</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">선반 높이 · 조작 버튼까지의 거리</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>조절식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">5~95 %tile 을 담게</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">의자 높이 · 자동차 시트 · 책상</td></tr></tbody></table></div>", "nq": 6}, "card_erg_t088": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "작업환경관리", "mid": "국소진동에 의한 레이노 병", "front": "국소진동에 의한 레이노 병은?", "back": "<strong>레이노 병</strong>이다. <strong>손가락이 하얗게 질린다</strong> 하여 <strong>백랍병(白蠟病)</strong> 이라고도 한다. 착암기·그라인더 같은 <strong>진동공구</strong>를 오래 쓰면 생긴다.<p><strong>◈ 암기</strong> <u>손가락이 하얘지면 레이노</u>.</p><p>진동 장해는 둘로 갈린다 — <strong>국소진동(손·팔)은 레이노 병</strong>, <strong>전신진동(온몸)은 요통과 내장 하수</strong>. <strong>공구를 손에 쥐는가</strong>로 가르면 된다.</p><div style=\"margin:12px 0 2px;font-weight:700\">작업환경 요인과 대표 질환</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">요인</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">질환</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">증상</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>국소진동</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>레이노 병(백랍병)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>손가락이 창백해지고 아프다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전신진동</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">요통 · 내장 하수</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">저주파 진동</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>소음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>C5-dip 현상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>4,000 [Hz] 에서 청력이 먼저 떨어진다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>분진(유리규산)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>규폐증</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">폐 섬유화</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>망간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">파킨슨 유사 증상</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">중추신경 장해</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>고열</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">열사병 · 열경련</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t036": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "화학설비의 안전성 평가", "front": "화학설비의 안전성 평가는?", "back": "<ul><li><strong>취급물질</strong>은 <strong>정량적 평가</strong>의 항목이다. 양을 재어 점수를 매기기 때문이다.</li><li>정량적 평가 항목은 <strong>취급물질 · 화학설비의 용량 · 온도 · 압력 · 조작</strong> 다섯이다. <strong>훈련</strong>은 여기 없다.</li><li><strong>공정</strong>은 <strong>정성적 평가</strong> 항목이다. 정량적 평가는 <strong>취급물질 · 용량 · 온도 · 압력 · 조작</strong> 다섯이다.</li></ul><p><strong>◈ 암기</strong> 정량적 평가 다섯은 「<u>물 · 용 · 온 · 압 · 조</u>」. · <u>물 · 용 · 온 · 압 · 조</u>.</p><p>6단계는 <strong>관계 자료의 정비 → 정성적 평가 → 정량적 평가 → 안전대책 → 재해정보에 의한 재평가 → FTA 에 의한 재평가</strong>다.<br>정량적 평가 다섯 항목은 <strong>물질 · 용량 · 온도 · 압력 · 조작</strong>이다. <strong>모두 숫자로 잴 수 있는 것</strong> 들이라 정량적이다. 훈련은 숫자로 재기 어렵다.</p><div style=\"margin:12px 0 2px;font-weight:700\">화학설비 안전성 평가의 항목</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">성격</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정성적 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">입지 조건 · 공장 내 배치 · 건조물 · 소방설비</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">있는가 없는가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정성적 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">원재료 · 중간재 · 제품 · 공정 · 수송과 저장</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">절차가 갖춰졌는가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정량적 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>취급물질</u> · 용량 · 온도 · 압력 · 조작</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">점수를 매긴다</td></tr></tbody></table></div>", "nq": 8}, "card_erg_t005": {"kind": "공식형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "phon 과 sone", "front": "phon 과 sone의 식은?", "back": "<ul><li><strong>1 sone 은 1,000 [Hz] 순음이 40 [dB] 일 때의 음량</strong>으로 정의한다. 「천 헤르츠, 사십 데시벨」을 묶어 외운다.</li><li>1,000 [Hz] 에서는 <strong>dB = phon</strong>이다. $\\mathrm{sone} = 2^{( \\mathrm{phon} - 40 ) / 10}$ 이므로 60 [phon] 은 $2^{2} = 4$ [sone] 이다. 4배면 16 [sone] 이고, $16 = 2^{4}$ 이므로 $\\mathrm{phon} = 40 + 40 = 80$ 이다.</li><li><strong>1,000 [Hz] 에서는 dB 과 phon 이 같다</strong>. 70 [dB] 이면 <strong>70 [phon]</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>1,000 [Hz] · 40 [dB] = 1 sone</u>. phon 10 오르면 sone 2배. · <u>10 phon 오르면 크기는 2배</u>.</p><p>음량의 두 척도. <u>phon 은 1,000 [Hz] 순음과 같게 들리는 음압수준(dB)</u>이고, <u>sone 은 그 크기를 비율로 나타낸 값</u>이다. 관계식은 $\\mathrm{sone} = 2^{( \\mathrm{phon} - 40 ) / 10}$ 이며, <u>phon 이 10 오를 때마다 sone 은 2배</u>가 된다. 40 phon = 1 sone 이 출발점이다.<br><strong>10 [phon] 이 오를 때마다 sone 은 두 배</strong>가 된다. 「몇 배 크게 들린다」는 문제는 반드시 <strong>sone</strong>으로 옮겨 풀어야 한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">phon 과 sone</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">phon</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">sone</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">40</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1,000 [Hz] 순음 40 [dB]</u>가 기준</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">50</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">2</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">phon 이 10 오르면 sone 은 2배</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">60</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">4</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">70</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">8</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">80</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">16</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 음량의 척도</em></p>", "nq": 4}, "card_erg_t089": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "정신적 작업부하의 생리적 척도", "front": "정신적 작업부하의 생리적 척도는?", "back": "<strong>근전도(EMG)</strong>는 <strong>근육의 활동</strong>을 재는 것이라 <strong>육체적 부하</strong>의 척도다.<p><strong>◈ 암기</strong> <u>근전도만 육체적 척도</u>.</p><p>가르는 물음 — <strong>머리를 재는가 근육을 재는가</strong>. <strong>근전도와 산소소비량만 육체 쪽</strong>이고 나머지는 대개 정신 쪽이 d #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>115 [dB]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>15분</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t017": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "양립성의 네 가지", "front": "양립성의 네 가지는?", "back": "<ul><li><strong>양식(modality) 양립성</strong>은 <strong>자극을 받는 감각과 반응하는 방식이 서로 맞는가</strong>를 말한다. <strong>귀로 들려주고 입으로 답하게 하는 것</strong>이 그 예다. 반대로 소리로 물어보고 손으로 버튼을 누르게 하면 그만큼 반응이 느려진다.</li><li>양립성은 <strong>공간 · 운동 · 개념 · 양식</strong> 네 가지다. 「감성의 양립성」은 없다.</li><li><strong>양식(modality) 양립성</strong>이다. <strong>귀로 들었으면 입으로 답하는</strong> 것처럼 자극과 응답의 <strong>감각 양식이 맞는</strong> 경우다.</li></ul><p><strong>◈ 암기</strong> <u>공간(위치) · 운동(방향) · 개념(뜻) · 양식(감각과 반응)</u>. · 「<u>공 · 운 · 개 · 양</u>」 — 감성은 없다.</p><p>양립성 네 가지. <u>공간(위치) · 운동(방향) · 개념(뜻) · 양식(감각과 반응의 방식)</u>. 양립성이 어긋난 설계는 평소에는 그럭저럭 쓰이다가 <u>급할 때 반드시 실수를 부른다</u>. 이것이 양립성이 안전의 문제인 이유다.<br>양립성이 어긋난 설계는 평소에는 그럭저럭 쓰이다가 <strong>급할 때 반드시 실수를 부른다</strong>. 이것이 양립성이 안전의 문제인 까닭이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">양립성의 네 가지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>공간적 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>배치가 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">오른쪽 버너는 오른쪽 손잡이</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>운동 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>움직임이 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">시계 방향으로 돌리면 증가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>개념적 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>뜻이 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>빨강은 뜨거움, 파랑은 차가움</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>양식 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>자극과 응답의 감각 양식이 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>들으면 말로 답한다</u></td></tr></tbody></table></div>", "nq": 7}, "card_erg_t091": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "귀의 구조와 기능", "front": "귀의 구조와 기능은?", "back": "고막은 <strong>외이와 중이의 경계</strong>에 있다. 중이와 내이의 경계가 아니다.<p><strong>◈ 암기</strong> <u>고막은 외이와 중이의 경계</u>.</p><p><strong>와우(달팽이관)가 청각</strong>, <strong>전정기관과 반규관이 평형감각</strong>이다. 보기 ④는 이 둘을 뒤바꿔 적었다 — 그래서 확정답안이 ②④를 모두 정답으로 처리했다.</p><div style=\"margin:12px 0 2px;font-weight:700\">귀의 구조</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">부위</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font- 이다. 파괴 원인이 되는 것은 오히려 <strong>측면을 쓰는 것</strong>이다.</li><li>플랜지가 <strong>작을 때</strong>가 파괴 원인이다. 크면 숫돌을 더 넓게 잡아 주므로 오히려 안전하다.</li></ul><p><strong>◈ 암기</strong> <u>플랜지는 1/3 이상이 정상</u> — 모자라야 위험. · <u>정면은 옳고 측면이 위험하다</u>.</p><p>파괴 원인 — <strong>속도 초과 · 균열 · 충격 · 편심 · 무리한 측면 연삭 · 플랜지 부족</strong>. 일반 숫돌은 <strong>측면 연삭용이 아니다</strong>.<br>연삭기의 숫자 — <strong>작업 시작 전 1분 이상, 교체 후 3분 이상 시운전</strong>, <strong>플랜지 지름은 숫돌 지름의 1/3 이상</strong>, <strong>덮개는 지름 5 [cm] 이상인 숫돌에 설치</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">연삭숫돌의 파괴 원인</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">파괴 원인</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>회전속도가 너무 빠를 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">원심력이 강도를 넘는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>숫돌의 측면을 사용할 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정면(원주면)이 정상 사용면</u>이다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>큰 충격을 줬을 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">취성 재료라 충격에 약하다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>회전중심이 어긋났을 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">편심 진동이 생긴다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;ve 류(이탈전류)</strong>는 <strong>스스로 손을 뗄 수 있는 최대 전류</strong>다. 이 값을 넘으면 근육이 굳어 손을 뗄 수 없게 된다.<p><strong>◈ 암기</strong> <u>가수는 뗄 수 있고, 불수는 못 뗀다</u>.</p><p><strong>가수(可離)</strong>는 「뗄 수 있다」, <strong>불수(不隨)</strong>는 「말을 듣지 않는다」는 뜻이다. 이 두 낱말의 뜻만 알면 헷갈리지 않는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">통전전류의 구분</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">크기</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">몸에 일어나는 일</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최소감지전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>찌릿함을 느끼는 정도</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>고통한계전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>7 ~ 8 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">참을 수 있는 한계</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>가수전류(이탈전류)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>남 9 [mA] · 여 6 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>스스로 손을 뗄 수 있는 한계</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;p ng> <u>40 · 43 · 60 · 120</u> — 발화는 60~120.</p><p>네 단계를 <strong>불씨가 있어야 붙는가(인화) → 스스로 붙는가(착화) → 심선까지 녹는가(발화) → 순식간에 끊기는가(순간용단)</strong>로 새긴다. <strong>40 · 43 · 60 · 120</strong>이 경계값이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">과전류에 의한 전선의 변화 단계</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">전류밀도</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무슨 일이 일어나나</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인화단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>40 ~ 43 [A/mm²]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>외부 불씨가 닿으면</u> 절연물에 불이 붙는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>착화단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>43 ~ 60 [A/mm²]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>절연물이 스스로 타기 시작</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>발화단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>60 ~ 120 [A/mm²]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>화구 없이 발화하고 심선이 용단</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>순간용단단계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>120 [A/mm²] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>순식간에 심선이 녹아 끊어진다</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t092": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기화재", "mid": "피뢰기의 정격전압", "front": "피뢰기의 정격전압은?", "back": "<strong>실효값</strong>으로 나타낸다. 교류전압을 말할 때 별다른 단서가 없으면 실효값이다.<p><strong>◈ 암기</strong> <u>교류 정격은 실효값</u>.</p><p><strong>속류(續流)</strong>는 벼락이 지나간 뒤에도 계속 흐르는 상용주파 전류다. 피뢰기는 이 속류를 끊어야 다시 정상으로 돌아간다. 피뢰기의 구비조건 — <strong>충격방전 개시전압이 낮을 것 · 제한전압이 낮을 것 · 속류 차단능력이 클 것 · 상용주파 방전개시전압이 높을 것 · 반복 동작이 가능할 것</strong>.</p>", "nq": 1}, "card_ele_t036": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "기계기구 외함 접지의 생략", "front": "기계기구 외함 접지의 생략은?", "back": "<ul><li>생략하려면 누전차단기가 <strong>정격감도전류 30 [mA] 이하, 동작시간 0.03초 이하</strong> 여야 한다. <strong>40 [mA] · 2초</strong>는 둘 다 기준을 넘으므로 <strong>접지를 해야 한다</strong>.</li><li>생략할 수 있는 것은 <strong>교류 대지전압 150 [V] 이하</strong>를 건조한 곳에 시설하는 경우다. <strong>300 [V]</strong>는 기준을 크게 넘는다.</li></ul><p><strong>◈ 암기</strong> <u>30 [mA] · 0.03초</u> 라야 생략 — 40 [mA] · 2초는 안 된다. · <u>교류는 150 [V] 이하라야 생략</u>.</p><p>30 [mA] · 0.03초는 <strong>심실세동을 일으키지 않는 한계</strong>다. 이 값을 넘는 차단기는 접지를 대신할 수 없다.<br><strong>150 [V]</strong>라는 숫자가 두 곳에 나온다 — <strong>접지 대상의 기준</strong>과 <strong>접지 생략의 기준</strong>. 둘 다 대지전압 기준이며, <strong>교류 150 [V] / 직류 300 [V]</strong>로 다르다.</p><div style=\"margin:12px 0 2px;font-weight:700\">외함 접지를 생략할 수 있는 경우</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">경우</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>교류 대지전압 150 [V] 이하 · 직류 300 [V] 이하</u>를 건조한 곳에</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>300 [V] 교류가 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>저압용 기계기구를 건조한 목재의 마루 위에서 취급</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">사람이 대지와 끊겨 있다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>외함 주위에 절연대를 설치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">사람이 대지와 끊겨 있다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2중 절연구조의 기계기구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">절연이 두 겹</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>비접지식 전로에 절연변압기(2차 300 [V] 이하)를 써서 공급</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">대지로 흐르는 길이 없다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정격감도전류 30 [mA] 이하 · 동작시간 0.03초 이하</u>의 누전차단기 설치</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">차단기가 대신한다</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t093": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "접지", "mid": "접지공사의 종별 (옛 전기설비기술기준)", "front": "접지공사의 종별 (옛 전기설비기술기준)은?", "back": "<ul><li>제2종 접지선은 <strong>공칭단면적 16 [㎟] 이상</strong>이다. 2.5 [㎟] 가 아니다. 다만 <strong>이 종별 구분 자체가 지금은 폐지되었다</strong>. 아래 주의사항을 함께 보아야 한다.</li><li>옛 기준으로 <strong>피뢰기는 제1종 접지공사(10 [Ω] 이하)</strong>가 맞다.</li></ul><p><strong>◈ 암기</strong> <u>제2종만 16 [㎟]</u>. · <u>피뢰기는 제1종, 10 [Ω] 이하</u>.</p><p><strong>제2종만 접지선이 굵다(16 [㎟])</strong>. 변압기 중성점 접지라 <strong>1선 지락 시 큰 전류가 흐르기</strong> 때문이다.<br>네 종별을 <strong>제1종 10 [Ω](고압 기기·피뢰기) · 제2종 150/지락전류(변압기 중성점) · 제3종 100 [Ω](400 [V] 미만) · 특별 제3종 10 [Ω](400 [V] 이상)</strong>으로 잡는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">옛 접지공사의 종별 (지금은 폐지)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종별</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">접지저항</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">접지선 굵기</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">적용</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제1종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>10 [Ω] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>6 [㎟] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">고압·특고압 기기 외함</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제2종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>150 / 1선지락전류 [Ω] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>16 [㎟] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>변압기 중성점</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제3종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>100 [Ω] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>2.5 [㎟] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">400 [V] 미만 저압 기기</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>특별 제3종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>10 [Ω] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>2.5 [㎟] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">400 [V] 이상 저압 기기</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t094": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "정전기", "mid": "정전기로 인한 화재 폭발 등 방지", "front": "정전기로 인한 화재 폭발 등 방지는?", "back": "<strong>제전설비</strong>는 정전기를 <strong>없애는 장치</strong>다. 조치를 받아야 할 대상이 아니라 조치 그 자체다.<p><strong>◈ 암기</strong> <u>제전설비는 조치 자체</u>.</p><p>목록의 설비들은 모두 <strong>유동 · 마찰 · 분출 대전</strong>이 크게 일어나는 곳이다. 조치는 <strong>접지 · 도전성 재료 사용 · 가습 · 제전장치 사용</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">정전기 재해 방지 조치가 필요한 설비 (규칙 제325조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">설비</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험물을 탱크로리·탱크차·드럼 등에 주입하는 설비</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">유동 대전</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>탱크로리·탱크차·드럼 등 위험물 저장설비</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인화성 액체를 함유하는 도료·접착제를 도포하는 설비</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험물 건조설비 또는 그 부속설비</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인화성 고체를 저장·취급하는 설비</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>드라이클리닝 설비 · 염색가공 설비 · 모피류 등을 씻는 설비</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">마찰 대전</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>공기중 부유 화약류·유기과산화물 취급 설비</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>화약류 제조설비</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>고압가스를 이송하거나 저장·취급하는 설비</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">분출 대전</td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제325조</em></p>", "nq": 1}, "card_ele_t081": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "정전기", "mid": "정전기 대전의 종류", "front": "정전기 대전의 종류는?", "back": "<ul><li><strong>「전도 대전」이라는 것은 없다</strong>. 대전 현상은 <strong>마찰 · 박리 · 유동 · 분출 · 충돌 · 파괴 · 교반 · 침강</strong> 대전이다.</li><li><strong>「유체대전」</strong>이라는 이름은 쓰지 않는다. 액체가 관을 흐를 때 생기는 것은 <strong>유동대전</strong>이다.</li><li><strong>물체가 파괴될 때</strong> 생기는 것은 <strong>파괴대전</strong>이다. <strong>박리대전은 붙어 있던 두 물체가 떨어질 때</strong> 생긴다.</li></ul><p><strong>◈ 암기</strong> <u>마 · 박 · 유 · 분 · 충 · 파 · 교 · 침</u> — 전도는 없다. · <u>유동대전이지 유체대전이 아니다</u>.</p><p><strong>박리 대전이 가장 크다</strong>는 것이 자주 물어진다. 붙어 있던 두 면이 떨어질 때 전하가 한쪽에 몰리기 때문이다.<br><strong>「유동」이지 「유체」가 아니다</strong>. 이름 한 글자를 바꿔 놓는 것이 이 유형의 함정이다. <strong>박리 대전이 가장 크다</strong>는 것도 함께 나온다.</p><div style=\"margin:12px 0 2px;font-weight:700\">정전기 대전의 종류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">언제 생기나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>마찰 대전</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>문지를 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">옷을 벗을 때</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>박리 대전</u></td>< /table></div>", "nq": 4}, "card_chm_t084": {"kind": "단답형", "fq": 3, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "분진폭발의 위험 인자", "front": "분진폭발의 위험 인자는?", "back": "<strong>수분이 적을수록</strong> 잘 탄다. 물기가 있으면 <strong>증발에 열을 뺏기고 입자끼리 뭉쳐</strong> 떠오르지 못한다.<p><strong>◈ 암기</strong> <u>수분만 적을수록 위험</u>.</p><p>한 줄로 — <strong>잘 타는 조건이면 다 위험하다</strong>. <strong>수분만 「적을수록」</strong>이고 나머지는 모두 「클수록·높을수록」이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">분진폭발의 위험을 키우는 조건</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">인자</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방향</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>분진의 온도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높을수록</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">반응이 빨라진다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>산소 농도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>클수록</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">연소가 활발해진다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>수분</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>적을수록</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertica n:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_chm_t086": {"kind": "단답형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "분진폭발의 불활성화", "front": "분진폭발의 불활성화는?", "back": "<strong>마그네슘</strong>은 그 자체가 <strong>가연성 금속 분진</strong>이다. 넣으면 오히려 폭발 위험이 커진다.<p><strong>◈ 암기</strong> <u>마그네슘은 타는 금속</u>.</p><p>불활성 첨가물은 <strong>타지 않으면서 열을 빼앗고 분진 사이를 갈라 놓는</strong> 것이라야 한다. <strong>탄산칼슘 · 모래 · 석분 · 규조토</strong>가 그렇다.</p>", "nq": 1}, "card_chm_t087": {"kind": "공식형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "화학양론조성(C_{st})", "front": "화학양론조성(C_{st})의 식은?", "back": "<ul><li>$C_{\\mathrm{st}} = \\dfrac{100}{1 + 4.773 ( n + \\dfrac{m}{4} - \\dfrac{l}{2} )}$ 다. 메탄은 $n = 1 , m = 4$ 이므로 $n + m / 4 = 2$ 다. $C_{\\mathrm{st}} = 100 / ( 1 + 4.773 \\times 2 ) = 100 / 10.546 \\fallingdotseq 9.48 \\fallingdotseq 9.50$ [vol%] 다.</li><li>$C_{\\mathrm{st}} = \\dfrac{100}{1 + 4.773 ( n + \\dfrac{m}{4} )}$ 다. 프로판은 $3 + 8 / 4 = 5$ 이므로 $C_{\\mathrm{st}} = 100 / ( 1 + 4.773 \\times 5 ) = 100 / 24.87 \\fallingdotseq 4.02$ [vol%] 다.</li><li>$C_{\\mathrm{st}} = \\dfrac{100}{1 + 4.773 ( n + m / 4 )}$ 이다. <strong>부탄은 </strong>$n + m / 4 = 4 + 2.5 = 6.5$<strong> 로 가장 커서 </strong>$C_{\\mathrm{st}}$<strong> 가 가장 낮다</strong>(약 3.1 [%]).</li></ul><p><strong>◈ 암기</strong> $C_{\\mathrm{st}} = 100 \\div ( 1 + 4.773 \\times ( n + m / 4 ) )$. · <u>분자가 클수록 </u>$C_{\\mathrm{st}}$<u> 가 낮다</u>.</p><p>4.773 은 <strong>공기 중 산소가 21 [%] 이므로 </strong>$1 / 0.21$에서 나온 값이다. <strong>최소산소농도(MOC)</strong>나 <strong>폭발하한계 어림값(</strong>$0.55 C_{\\mathrm{st}}$<strong>)</strong>을 구할 때도 쓴다.<br>4.773 은 $1 / 0.21$ 에서 나왔다. <strong>메탄은 9.5, 프로판은 4.0</strong>으로 <strong>탄소가 많을수록 낮아진다</strong> — 산소가 더 많이 필요하기 때문이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">보기 물질의 완전조성농도</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;backgrou id #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>표면연소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>표면에서 불꽃 없이 탄다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>숯 · 코크스 · 목탄 · 금속분</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>분해연소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>열분해로 나온 가스가 탄다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>목재 · 석탄 · 종이 · 플라스틱</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>증발연소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>녹아 증발한 증기가 탄다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>황 · 나프탈렌 · 파라핀 · 왁스</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>자기연소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>산소를 스스로 지녀 분해되며 탄다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>니트로화합물 · 질산에스테르류</u></td></tr></tbody></table></div>", "nq": 2}, "card_chm_t003": {"kind": "공식형", "fq": 3, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "르 샤틀리에의 혼합가스 폭발범위", "front": "르 샤틀리에의 혼합가스 폭발범위의 식은?", "back": "<ul><li>$\\dfrac{100}{L} = \\sum \\dfrac{V_{i}}{L_{i}}$ 이므로, 하한이 높은 <strong>메탄이 적게 섞일수록</strong> 혼합가스의 하한이 낮아진다. 메탄 20 [%] 인 ①이 가장 낮다. $100 / L = 20 / 5 + 30 / 2 + 50 / 2.1 = 42.81$ 이므로 $L = 2.34$ [%] 다.</li><li>르 샤틀리에 식 $\\dfrac{100}{L} = \\sum \\dfrac{V_{i}}{L_{i}}$ 다. 3:1 이므로 75 [%] 와 25 [%] 다. $\\dfrac{100}{L} = \\dfrac{75}{2.5} + \\dfrac{25}{5.0} = 30 + 5 = 35$ 이므로 $L = 100 / 35 \\fallingdotseq 2.9$ [vol%] 다.</li><li>가연성 가스만 100 [%] 로 환산한다. 합이 5 [%] 이므로 메탄 20, 헥산 40, 에틸렌 40 [%] 다. $\\dfrac{100}{L} = \\dfrac{20}{5.0} + \\dfrac{40}{1.1} + \\dfrac{40}{2.7} = 4 + 36.36 + 14.81 = 55.17$ 이므로 $L = 100 / 55.17 \\fallingdotseq 1.8$ [vol%] 다.</li></ul><p><strong>◈ 암기</strong> <u>하한이 낮은 가스가 많이 섞일수록 혼합가스의 하한도 낮아진다</u>. · $\\dfrac{100}{L} = \\sum \\dfrac{V_{i}}{L_{i}}$ — <u>몫을 더한 뒤 뒤집는다</u>.</p><p>르 샤틀리에 식. <u>분모에 각 성분의 폭발범위</u>를 넣고 부피분율을 나눠 더한다. 직관으로는 <u>「하한이 낮은 가스가 많이 섞일수록 혼합가스의 하한도 낮아진다」</u>는 방향만 알아도 선택지를 고를 수 있어 계산을 아낄 수 있다.<br><strong>분모에 각 성분의 폭발범위</strong>가 들어간다. 그래서 <strong>하한이 낮은 성분이 결과를 크게 끌어내린다</strong>. 단순 평균으로 구하면 반드시 틀린다.</p>", "nq": 6}, "card_chm_t025": {"kind": "단답형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "분말소화약제의 종류와 적응 화재", "front": "분말소화약제의 종류와 적응 화재는?", "back": "<ul><li><strong>제1종은 탄산수소나트륨(NaHCO₃)</strong>이다. 백색이며 <strong>B·C급</strong>에 쓴다.</li><li><strong>제1인산암모늄(NH₄H₂PO₄)</strong>은 <strong>제3종 분말소화약제</strong>다. <strong>A·B·C 급 모두</strong>에 쓸 수 있어 가장 널리 쓰인다.</li><li><strong>제1인산암모늄(NH₄H₂PO₄)</strong>이다. <strong>제3종 분말소화약제</strong>로 <strong>A·B·C 급 모두</strong>에 쓸 수 있다.</li></ul><p><strong>◈ 암기</strong> <u>1종 나트륨 · 2종 칼륨 · 3종 인산암모늄(ABC) · 4종 칼륨+요소</u>. · <u>ABC 급이면 제1인산암모늄</u>.</p><p><strong>제3종만 A급까지 통한다</strong>. 그래서 일반 건물의 소화기가 대부분 ABC 분말이다.<br><strong>제3종만 A급까지 통한다</strong>. 인산암모늄이 열을 받으면 <strong>메타인산(HPO₃)</strong>이 되어 <strong>타는 물질 표면에 막을 만들어</strong> 산소를 끊기 때문이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">분말소화약제의 종류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종별</th><th style=\"border:1px solid #cbd5e1;pa :1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">회색</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">B · C</td></tr></tbody></table></div>", "nq": 3}, "card_chm_t090": {"kind": "단답형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "위험물", "mid": "내화기준", "front": "내화기준은?", "back": "<ul><li>건축물의 보는 <strong>지상 1층까지</strong>다. 지상 2층이 아니다. <strong>기둥과 보 모두 지상 1층(6 [m]) 까지</strong>로 같다.</li><li><strong>「1시간 이상」이 아니라 「2시간 이상」</strong>이다. 스프링클러 등 자동소화설비를 설치해 <strong>2시간 이상 안전성을 유지</strong> 할 수 있으면 내화구조로 하지 않아도 된다.</li></ul><p><strong>◈ 암기</strong> <u>기둥도 보도 지상 1층까지</u>. · <u>2시간 이상이라야 갈음</u>.</p><p><strong>6 [m]</strong>라는 숫자가 두 곳에 나온다 — <strong>기둥·보의 1층 높이</strong>와 <strong>지지대의 1단 높이</strong>. 다만 <strong>보를 「지상 2층」으로 늘려 놓은</strong> 것이 이 문항의 함정이다.<br>숫자를 갈라 둔다 — <strong>기둥과 보는 지상 1층(6 [m])까지 · 지지대는 끝부분 또는 1단(6 [m])까지 · 자동소화설비로 갈음하려면 2시간 이상</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">내화구조로 해야 하는 부분 (규칙 제270조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">부분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">범위</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>건축물의 기둥 및 보</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>지상 1층까지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1층 높이가 6 [m] 를 넘으면 6 [m] 까지</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12p lign:left;\">우물통 · 잠함</td></tr></tbody></table></div>", "nq": 3}, "card_con_t070": {"kind": "단답형", "fq": 1, "subject": "건설안전기술", "chapter": "건설공사 안전개요", "mid": "전도 등의 방지", "front": "전도 등의 방지는?", "back": "<ul><li><strong>경보장치</strong>는 알리는 장치이지 <strong>넘어지는 것을 막는 조치</strong>가 아니다.</li><li><strong>작업반경 유지</strong>는 <strong>접촉 방지</strong>를 위한 조치다. 전도·전락을 막는 조치가 아니다.</li><li><strong>출입금지</strong>는 조문에 없다. 세 가지는 <strong>유도자 배치 · 지반의 부동침하 방지 · 갓길 붕괴 방지</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>유도자 · 부동침하 · 갓길</u> 셋. · <u>유도자 · 부동침하 · 갓길 · 도로 폭</u> 넷.</p><p>세 가지뿐이다 — <strong>유도자 배치 · 지반의 부동침하 방지 · 갓길의 붕괴 방지</strong>. 모두 <strong>기계가 설 자리를 단단히 하거나 길을 안내하는</strong> 것이다.<br>네 조치가 모두 <strong>기계가 서고 지나갈 자리를 안전하게</strong> 만든다. <strong>작업반경은 사람이 다가가지 못하게 하는</strong> 별개의 조치(제200조 접촉 방지)다.</p><div style=\"margin:12px 0 2px;font-weight:700\">차량계 건설기계의 전도 방지 (규칙 제199조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 하나</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>유도자 배치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">길을 안내한다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지반의 부동침하 방지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">설 자리를 단단히</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>갓길의 붕괴 방지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">길 가장자리가 무너지지 않게</td>< ng:7px 12px;vertical-align:middle;text-align:center;\">연면적 기준 시설</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">3만 [㎡] 이상 / 5천 [㎡] 이상(냉동냉장창고 등)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>다리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>최대 지간길이 50 [m] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">전체길이가 아니다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">터널</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>모든 터널 건설공사</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">댐</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">저수용량 2천만 [t] 이상</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">굴착</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">깊이 <u>10 [m] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 시행령 제42조</em></p>", "nq": 8}, "card_con_t082": {"kind": "단답형", "fq": 1, "subject": "건설안전기술", "chapter": "건설공사 안전개요", "mid": "보일링(boiling) 현상", "front": "보일링(boiling) 현상은?", "back": "<ul><li><strong>지하수위의 수두차</strong>다. 배면 쪽 물이 높으면 그 압력으로 <strong>굴착 바닥에서 물이 모래와 함께 솟구친다</strong>.</li><li><strong>연약 점토질 지반에서 배면토의 무게로 바닥이 부풀어 오르는</strong> 것은 <strong>히빙</strong>이다. 보일링이 아니다.</li></ul><p><strong>◈ 암기</strong> <u>보일링은 수두차, 히빙은 중량차</u>. · <u>점토에서 흙 무게로 부풀면 히빙</u>.</p><p><strong>물의 문제인가 흙 무게의 문제인가</strong>로 가른다. <strong>보일링은 물(수두차), 히빙은 흙 무게</strong>다. 이 한 줄이 두 현상을 완전히 갈라 준다.<br>가르는 물음 — <strong>모래인가 점토인가, 물이 밀어 올리는가 흙 무게가 밀어 올리는가</strong>. <strong>보일링은 모래·물, 히빙은 점토·무게</strong>다.</p><div style=\"margin:12px 0 2px;font-weight:700\">보일링과 히빙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보일링(boiling)</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">히빙(heaving)</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">지반</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>모래(사질토)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>연약한 점토</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">원인</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>지하수위의 수두차</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>배면 흙의 중량</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">현상</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>물이 모래와 함께 솟구친다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>굴착 바닥이 부풀어 오른다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">대책</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>지하수위 저하 · 차수 · 근입깊이 증가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>근입깊이 증가 · 배면 흙 제거 · 지반 개량</u></td></tr></tbody></table></div>", "nq": 2}, "card_con_t083": {"kind": "단답형", "fq": 1, "subject": "건설안전기술", "chapter": "건설공사 안전개요", "mid": "흙막이 계측과 터널 계측", "front": "흙막이 계측과 터널 계측은?", "back": "<strong>내공변위 측정</strong>은 <strong>터널(NATM)</strong>의 계측이다. 개착식 흙막이에는 안쪽 공간이라는 것이 없다.<p><strong>◈ 암기</strong> <u>내공변위는 터널 것</u>.</p><p><strong>「내공(內空)」은 터널 안쪽 빈 공간</strong>을 뜻한다. 이 낱말이 보이면 터널 계측이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">어느 공사의 계측인가</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">개착식 흙막이</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">터널(NATM)</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">계측</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>지중경사계 · 지하수위계 · 간극수압계 · 변형률계 · 하중계 · 지표침하계 · 건물경사계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>내공변위 측정 · 천단침하 측정 · 록볼트 축력 · 지중변위</u></td></tr></tbody></table></div>", "nq": 1}, "card_con_t084": {"kind": "공식형", "fq": 1, "subject": "건설안전기술", "chapter": "건설공사 안전개요", "mid": "흙의 간극비와 간극률", "front": "흙의 간극비와 간극률의 식은?", "back": "간극비는 $e = \\dfrac{\\text{간극의 부피}}{\\text{흙 입자의 부피}} = \\dfrac{V_{v}}{V_{s}}$ 다. 간극은 <strong>공기 + 물</strong>이고, 분모는 <strong>흙 입자만</strong>이다.<p><strong>◈ 암기</strong> <u>간극비의 분모는 흙 입자</u>.</p><p><strong>간극비는 흙 입자로 나누고, 간극률은 전체로 나눈다</strong>. 그래서 <strong>간극비는 1을 넘을 수 있고 간극률은 넘지 못한다</strong>. 이 차이가 두 용어를 가른다.</p><div style=\"margin:12px 0 2px;font-weight:700\">흙의 기본 성질</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">용어</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>간극비 e</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{공기} + \\text{물}}{\\text{흙}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>분모가 흙 입자</u> — 1을 넘을 수 있다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>간극률 n</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{공기} + \\text{물}}{\\text{공기} + \\text{흙} + \\text{물}} \\times 100$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>분모가 전체</u> — 100 [%] 를 넘지 못한다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>포화도 S</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{물}}{\\text{공기} + \\text{물}} \\times 100$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">간극 가운데 물이 찬 비율</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>함수비 w</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{\\text{물의 무게}}{\\text{흙 입자의 무게}} \\times 100$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>부피가 아니라 무게</u></td></tr></tbody></table></div>", "nq": 1}, "card_con_t085": {"kind": "단답형", "fq": 2, "subject": "건설안전기술", "chapter": "건설공사 안전개요", "mid": "지반조사의 간격과 깊이", "front": "지반조사의 간격과 깊이는?", "back": "절토·개착·터널 구간은 <strong>기반암의 심도 2 ~ 3 [m] 까지</strong> 확인한다. 5~6 [m] 가 아니다.<p><strong>◈ 암기</strong> <u>기반암 심도 2 ~ 3 [m]</u>.</p><p><strong>기반암에 2~3 [m] 만 들어가면</strong> 그 아래는 같은 암반이 이어진다고 본다. 더 파는 것은 비용만 늘 뿐 얻는 정보가 적다.</p>", "nq": 1}, "card_con_t086": {"kind": "단답형", "fq": 1, "subject": "건설안전기술", "chapter": "건설재해 대책", "mid": "안전난간의 구조", "front": "안전난간의 구조는?", "back": "<ul><li>상부 난간대가 <strong>120 [cm] 를 넘으면 중간 난간대를 2단 이상</strong> 균등하게 설치한다. 이때 난간대 사이 간격은 <strong>60 [cm] 이하</strong> 여야 한다.</li><li>난간대는 <strong>지름 2.7 [cm] 이상</strong> 이라야 한다. <strong>「1.5 [cm]」가 아니다</strong>.</li><li><strong>100kg 이상</strong>의 하중에 견뎌야 한다.</li></ul><p><strong>◈ 암기</strong> <u>120 [cm] 넘으면 2단 이상</u>. · <u>난간대는 지름 2.7 [cm] 이상</u>.</p><p>핵심은 <strong>난간대 사이 간격을 60 [cm] 이하로 유지</strong> 하는 것이다. 상부 난간대가 높아질수록 그 사이를 메울 중간 난간대가 더 필요해진다.<br><strong>「90 ~ 120 · 60 · 10 · 2.7 · 100」</strong> 다섯 숫자다 — <strong>2.7 [cm] 는 손으로 쥘 만한 굵기</strong>라 1.5 [cm] 로는 잡기도 어렵고 휘어진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">상부 난간대 높이에 따른 중간 난간대</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weigh
