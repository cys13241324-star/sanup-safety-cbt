e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>긴급처리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기계 정지 → 피해자 응급조치 → 관계자 통보 → 2차 재해 방지 → 현장 보존</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>재해조사</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>잠재 위험요인의 색출</u> · 사실 수집</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>원인강구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">사람 · 물체 · 관리의 세 갈래로</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>대책수립</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">이유가 분명한 대책</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>5</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>대책실시계획</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">5W1H 로</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>6</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>실시</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>7</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_mgt_t072": {"kind": "공식형", "fq": 2, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "종합재해지수(FSI)", "front": "종합재해지수(FSI)의 식은?", "back": "<ul><li><strong>종합재해지수(FSI)</strong>다. $\\mathrm{FSI} = \\sqrt{\\text{도수율} \\times \\text{강도율}}$ 로 <strong>얼마나 자주(도수율)</strong>와 <strong>얼마나 크게(강도율)</strong>를 하나로 묶는다.</li><li>도수율은 $\\dfrac{12}{1 {,} 200 {,} 000} \\times 10^{6} = 10$ 이다. 종합재해지수는 $\\mathrm{FSI} = \\sqrt{\\text{도수율} \\times \\text{강도율}} = \\sqrt{10 \\times 2.5} = \\sqrt{25} = 5.0$ 이다.</li><li><strong>종합재해지수(FSI)</strong>다. $\\mathrm{FSI} = \\sqrt{\\text{도수율} \\times \\text{강도율}}$ 로 <strong>빈도와 강도를 함께</strong> 본다.</li></ul><p><strong>◈ 암기</strong> $\\mathrm{FSI} = \\sqrt{FR \\times SR}$ — <u>곱한 뒤 제곱근</u>. · $\\mathrm{FSI} = \\sqrt{\\text{도수율} \\times \\text{강도율}}$.</p><p><strong>도수율은 백만, 강도율은 천</strong>을 곱한다. 이 두 수를 바꿔 쓰는 것이 가장 흔한 실수다.<br><strong>빈도(도수율)와 심도(강도율)를 곱한 뒤 제곱근</strong>을 씌운 것이다. <strong>둘 다 낮아야 지수가 낮아지므로</strong> 한쪽만 좋은 사업장을 걸러 낸다.</p><div style=\"margin:12px 0 2px;font-weight:700\">재해 지표</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">지표</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 보나</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>도수율(FR)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\text{재해건수} / \\text{연근로시간} \\times 10^{6}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>얼마나 자주</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>강도율(SR)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\text{근로손실일수} / \\text{연근로시간} \\times 10^{3}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>얼마나 크게</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>종합재해지수(FSI)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\sqrt{\\text{도수율} \\times \\text{강도율}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>둘을 합쳐</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>연천인율</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\text{재해자수} / \\text{평균근로자수} \\times 1 {,} 000$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">도수율 × 2.4</td></tr></tbody></table></div>", "nq": 4}, "card_erg_t121": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "미니멀 컷셋과 미니멀 패스셋", "front": "미니멀 컷셋과 미니멀 패스셋은?", "back": "<ul><li><strong>미니멀 패스셋(minimal path set)</strong>이다. <strong>그 요소들이 모두 살아 있으면 시스템이 돌아가는</strong> 최소한의 집합이다.</li><li><strong>패스셋은 시스템을 살리는 조합</strong>이다. 나머지 셋은 모두 <strong>컷셋</strong>의 설명이다.</li><li><strong>미니멀 컷셋은 정상사상을 일으키는 최소한의 컷셋</strong>이다. 나머지 셋은 컷셋과 패스셋을 뒤바꿔 놓았다.</li></ul><p><strong>◈ 암기</strong> <u>컷은 고장, 패스는 정상</u>. · <u>컷셋은 위험성, 패스셋은 신뢰성</u>.</p><p><strong>컷은 자른다(고장), 패스는 지나간다(정상)</strong>로 새긴다. <strong>미니멀 컷셋은 위험의 크기, 미니멀 패스셋은 시스템의 신뢰성</strong>을 나타낸다.<br><strong>컷은 자른다(고장), 패스는 지나간다(정상)</strong>로 새긴다. <strong>보기 셋이 모두 「고장」쪽</strong>을 말하고 있으므로 나머지 하나가 답이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">컷셋과 패스셋</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">컷셋(cut set)</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">패스셋(path set)</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">무엇</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>모두 일어나면 정상사상이 일어나는</u> 기본사상의 집합</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>모두 일어나지 않으면 정상사상이 일어나지 않는</u> 기본사상의 집합</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">뜻</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시스템을 고장 내는 조합</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시스템을 살리는 조합</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">최소</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>미니멀 컷셋 — 위험의 크기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>미니멀 패스셋 — 신뢰성</u></td></tr></tbody></table></div>", "nq": 5}, "card_erg_t122": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "FTA 의 진행순서", "front": "FTA 의 진행순서는?", "back": "<strong>㉠ → ㉣ → ㉡ → ㉢</strong>이다. <strong>무엇을 볼지 정하고 → 원인을 캐고 → 그림으로 그려 분석하고 → 고칠 계획을 세운다</strong>.<p><strong>◈ 암기</strong> <u>정상사상 · 원인 규명 · FT도 · 개선 계획</u>.</p><p><strong>원인을 캐야 그림을 그릴 수 있고, 그림을 분석해야 무엇을 고칠지 알 수</strong> 있다. <strong>개선 계획이 언제나 마지막</strong>이라는 것만 잡아도 보기 둘이 걸러진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">FTA 에 의한 재해사례 연구순서</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">순서</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">하는 일</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정상사상의 선정</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>막고 싶은 재해를 톱에 놓는다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>각 사상의 재해원인 규명</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>한 단계씩 아래로 캐내려간다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>FT도 작성 및 분석</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>게이트로 이어 그리고 컷셋을 구한다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>개선 계획의 작성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>중요도가 큰 곳부터 고친다</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t123": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "라스무센의 인간행동 3분류", "front": "라스무센의 인간행동 3분류는?", "back": "<ul><li><strong>지식에 기초한 행동</strong>이다. <strong>처음 겪는 상황에서 따져 판단하다가 잘못</strong> 하는 경우다.</li><li><strong>지식에 기초한 행동</strong>이다. <strong>처음 겪는 낯선 상황에서 따져 판단하다가 잘못</strong> 하는 경우다.</li><li><strong>「경험 기반 행동」</strong>은 없다. 셋은 <strong>숙련(기능) · 규칙 · 지식</strong> 기반이다.</li></ul><p><strong>◈ 암기</strong> <u>분석과 의사결정이면 지식 기반</u>. · <u>낯선 상황의 분석 오류면 지식 기반</u>.</p><p>세 가지가 <strong>몸으로(기능) → 규칙으로(규칙) → 머리로(지식)</strong> 순으로 <strong>생각이 깊어지고 시간이 오래 걸린다</strong>. 물음에 붙은 <strong>「분석」·「의사결정」</strong>이 지식 기반을 가리킨다.<br>세 가지가 <strong>몸으로(기능) → 규칙으로(규칙) → 머리로(지식)</strong> 순으로 <strong>생각이 깊어지고 시간이 오래 걸린다</strong>. <strong>「친숙하지 않은」·「분석」·「의사결정」</strong>이 지식 기반을 가리킨다.</p><div style=\"margin:12px 0 2px;font-weight:700\">라스무센(Rasmussen)의 인간행동 3분류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">행동</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">언제</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">오류의 성격</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:  2}, "card_erg_t130": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "기초대사량(BMR)", "front": "기초대사량(BMR)은?", "back": "<strong>기초대사량(BMR)</strong>이다. <strong>아무것도 하지 않고 누워 있어도 목숨을 잇는 데 드는</strong> 에너지다.<p><strong>◈ 암기</strong> <u>목숨을 잇는 데만 드는 것이 기초대사량</u>.</p><p><strong>RMR = 작업대사량 ÷ 기초대사량</strong>이 실무에서 쓰인다. <strong>기초대사량이 분모</strong>이므로, 같은 일이라도 <strong>몸집이 큰 사람은 RMR 이 낮게</strong> 나온다.</p><div style=\"margin:12px 0 2px;font-weight:700\">에너지 대사</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기초대사량 BMR</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생명 유지에 드는 최소 에너지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">성인 남자 약 1,500 ~ 1,800 [kcal/일]</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안정 시 대사량</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기초대사량의 약 1.2배</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>작업 대사량</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>일하느라 더 쓰는 에너 <p><strong>◈ 암기</strong> <u>접촉 면적은 작게</u>.</p><p>네 조건이 모두 <strong>저항을 줄여 힘을 덜 들인다</strong>는 한 가지다. <strong>접촉 면적을 키우면 마찰이 커지므로</strong> 보기 ②만 방향이 반대다. <strong>③과 ②가 서로 어긋난다</strong>는 점으로도 찾을 수 있다.</p>", "nq": 1}, "card_erg_t133": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "전달정보량 T(X;Y)", "front": "전달정보량 T(X;Y)의 식은?", "back": "$T = H ( X ) + H ( Y ) - H ( X {,} Y )$ 다. 자극 A 50 · B 50 이므로 $H ( X ) = 1.0$, 반응 1 이 60 · 2 가 40 이므로 $H ( Y ) \\fallingdotseq 0.971$, 세 칸(50 · 10 · 40)에서 $H ( X {,} Y ) \\fallingdotseq 1.361$ 이다. 따라서 $T = 1.0 + 0.971 - 1.361 = 0.610$ 이다.<p><strong>◈ 암기</strong> $T = H ( X ) + H ( Y ) - H ( X {,} Y )$.</p><p>$H = \\sum p_{i} \\log_{2} ( 1 / p_{i} )$ 이다. <strong>보낸 정보와 받은 정보를 더한 뒤 둘을 합친 것을 빼면 겹치는 부분</strong>이 남는데, 그것이 <strong>제대로 전달된 양</strong>이다. 오류가 없으면 $T = H ( X )$ 가 된다.</p>", "nq": 1}, "card_erg_t017": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "양립성의 네 가지", "front": "양립성의 네 가지는?", "back": "<ul><li><strong>양식(modality) 양립성</strong>은 <strong>자극을 받는 감각과 반응하는 방식이 서로 맞는가</strong>를 말한다. <strong>귀로 들려주고 입으로 답하게 하는 것</strong>이 그 예다. 반대로 소리로 물어보고 손으로 버튼을 누르게 하면 그만큼 반응이 느려진다.</li><li>양립성은 <strong>공간 · 운동 · 개념 · 양식</strong> 네 가지다. 「감성의 양립성」은 없다.</li><li><strong>양식(modality) 양립성</strong>이다. <strong>귀로 들었으면 입으로 답하는</strong> 것처럼 자극과 응답의 <strong>감각 양식이 맞는</strong> 경우다.</li></ul><p><strong>◈ 암기</strong> <u>공간(위치) · 운동(방향) · 개념(뜻) · 양식(감각과 반응)</u>. · 「<u>공 · 운 · 개 · 양</u>」 — 감성은 없다.</p><p>양립성 네 가지. <u>공간(위치) · 운동(방향) · 개념(뜻) · 양식(감각과 반응의 방식)</u>. 양립성이 어긋난 설계는 평소에는 그럭저럭 쓰이다가 <u>급할 때 반드시 실수를 부른다</u>. 이것이 양립성이 안전의 문제인 이유다.<br>양립성이 어긋난 설계는 평소에는 그럭저럭 쓰이다가 <strong>급할 때 반드시 실수를 부른다</strong>. 이것이 양립성이 안전의 문제인 까닭이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">양립성의 네 가지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>공간적 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>배치가 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">오른쪽 버너는 오른쪽 손잡이</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>운동 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>움직임이 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">시계 방향으로 돌리면 증가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>개념적 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>뜻이 기대와 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>빨강은 뜨거움, 파랑은 차가움</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>양식 양립성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>자극과 응답의 감각 양식이 맞음</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>들으면 말로 답한다</u></td></tr></tbody></table></div>", "nq": 7}, "card_erg_t134": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "시각적 부호의 유형", "front": "시각적 부호의 유형은?", "back": "<ul><li><strong>해골과 뼈는 임의적 부호</strong>다. 「명시적 부호」라는 갈래 자체가 없다.</li><li><strong>임의적 부호</strong>다. <strong>약속으로 정해 놓았으므로 배워야 안다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>묘사 · 추상 · 임의</u> 셋뿐. · <u>배워야 알면 임의적 부호</u>.</p><p><strong>묘사적은 보면 알고, 추상적은 짐작할 수 있고, 임의적은 배워야 안다</strong>. <strong>해골 그림이 「독」을 뜻한다는 것은 약속</strong> 일 뿐 그림 자체에서 나오지 않는다.<br><strong>묘사적은 보면 알고, 추상적은 짐작하고, 임의적은 배워야 안다</strong>. <strong>「삼각형이 경고」라는 것은 그림 자체에서 나오지 않는 약속</strong>이므로 임의적이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">시각적 부호의 세 갈래</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">갈래</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>묘사적 부호</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>실제를 본떠 그린 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">걷는 사람 · 사슴 그림</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>추상적 부호</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>본디 모습을 줄여 간략하게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>12궁도</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>임의적 부호</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>약속으로 정한 것 — 배워야 안다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>삼각형은 주의 · 해골과 뼈는 독성</u></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t135": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "명료도 지수(articulation index)", "front": "명료도 지수(articulation index)의 식은?", "back": "<ul><li><strong>명료도 지수(AI)</strong>다. <strong>옥타브대마다 신호와 잡음의 [dB] 차이에 가중치를 곱해 더한</strong> 값이다.</li><li>$AI = \\sum ( \\log ( S / N ) \\times \\text{가중치} ) = (-0.7 \\times 1 ) + ( 0.18 \\times 1 ) + ( 0.6 \\times 2 ) + ( 0.7 \\times 1 ) =-0.7 + 0.18 + 1.2 + 0.7 = 1.38$ 이다.</li></ul><p><strong>◈ 암기</strong> <u>가중치를 곱해 더하면 명료도 지수</u>. · $\\log ( S / N )$<u> × 가중치의 합</u>.</p><p><strong>「가중치를 곱해 합계」</strong>라는 말이 명료도 지수를 가리킨다. <strong>PSIL 은 그냥 평균</strong>이라 가중치가 없다. 이 한 낱말로 둘이 갈린다.<br><strong>각 옥타브대의 </strong>$\\log ( S / N )$<strong> 에 가중치를 곱해 모두 더한다</strong>. <strong>Ⅰ대의 값이 음수(−0.7)</strong>라 그냥 더하면 값이 줄어드는데, <strong>이 부호를 놓치면 다른 보기로 빠진다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">통화이해도의 척도</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">척도</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>명료도 지수 AI</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>옥타브대별 [dB] 차이 × 가중치의 합</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>통화 간섭 수준 PSIL</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>500 · 1,000 · 2,000 [Hz] 잡음의 평균</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>이해도 점수</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>올바로 알아들은 낱말의 백분율</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>소음 기준 곡선 NC</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>실내 소음을 평가하는 곡선</u></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t136": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "조도와 거리의 관계", "front": "조도와 거리의 관계의 식은?", "back": "조도는 <strong>거리의 제곱에 반비례</strong> 한다. $E_{2} = 120 \\times ( \\dfrac{5}{2} )^{2} = 120 \\times 6.25 = 750$ [lux] 다.<p><strong>◈ 암기</strong> <u>조도는 거리 제곱에 반비례</u>.</p><p>$\\text{조도} = \\dfrac{\\text{광도}}{\\text{거리}}^{2}$ 다. <strong>가까워지면 밝아지고, 그 배수는 거리비의 제곱</strong>이다. 5 → 2 로 <strong>2.5배 가까워졌으니 6.25배 밝아진다</strong>.</p>", "nq": 1}, "card_erg_t137": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "작업부하의 생리적 측정", "front": "작업부하의 생리적 측정은?", "back": "<strong>점멸융합주파수(CFF)</strong>는 <strong>정신적 피로</strong>를 재는 척도다. 육체작업의 부하를 재는 것이 아니다.<p><strong>◈ 암기</strong> <u>CFF 는 정신적 피로</u>.</p><p><strong>몸을 쓰면 산소와 심장, 머리를 쓰면 눈과 뇌</strong>를 본다. <strong>점멸융합주파수는 눈이 깜박임을 하나로 느끼기 시작하는 주파수</strong>로, 피로하면 낮아진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">작업부하의 측정 척도</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 재나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">척도</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>육체적(생리적) 부하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>산소소비량 · 에너지소비량 · 심박수(맥박수) · 근전도(EMG) · 산소소비율</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정신적 부하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>점멸융합주파수(CFF) · 뇌전도(EEG) · 부정맥지수 · 동공반응 · 눈 깜빡임률</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>주관적 척도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>NASA-TLX · Borg 척도</u></td></tr></tbody></table></div>", "nq": 1}, "card_mac_t110": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "연삭기 덮개의 노출각도", "front": "연삭기 덮개의 노출각도는?", "back": "<ul><li><strong>180° 이내</strong>다. 손에 들고 쓰는 연삭기는 <strong>작업면을 넓게 열어야</strong> 하므로 덮개 각도가 가장 크다.</li><li><strong>60° 이내</strong>다. <strong>숫돌 위쪽을 쓰는</strong> 탁상용 연삭기는 <strong>수평면 아래로 연삭하므로</strong> 노출을 가장 좁게 잡는다.</li><li><strong>60° 이내</strong>다. <strong>위쪽을 쓰는 것이므로 그만큼만 열어</strong> 둔다.</li></ul><p><strong>◈ 암기</strong> <u>휴대용은 180° 이내</u>. · <u>상부 사용 탁상용은 60° 이내</u>.</p><p><strong>손으로 들고 쓸수록 넓게 연다</strong>는 흐름으로 잡는다 — <strong>60 → 125 → 150 → 180</strong>. 연삭기는 이 밖에도 <strong>작업 시작 전 1분, 숫돌 교체 뒤 3분 시운전</strong>이 함께 나온다.<br><strong>60 → 125 → 150 → 180</strong> 네 값이다. <strong>아래를 향해 갈수록 좁게, 손에 들수록 넓게</strong>라는 흐름으로 잡는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">연삭기 덮개의 노출각도</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">연삭기의 종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">노출각도</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>탁상용 — 일반</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>125° 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">숫돌 중심 위 65° 이내</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>탁상용 — 수평 이하 연삭</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>60° 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>원통·센터리스·평면 연삭기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>150° 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>휴대용 연삭기 · 스윙 연삭기 · 슬래브 연삭기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>180° 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>절단 및 조정 연삭기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>180° 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 별표</em></p>", "nq": 4}, "card_mac_t111": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "휴대용 동력드릴의 안전수칙", "front": "휴대용 동력드릴의 안전수칙은?", "back": "<ul><li><strong>금속성 망치로 두드리면 안 된다</strong>. 날이 상하고 조각이 튈 수 있으므로 <strong>나무나 플라스틱 망치</strong>를 쓴다.</li><li><strong>금속성 망치를 쓰면 안 된다</strong>. 날이 상하고 조각이 튀므로 <strong>나무나 플라스틱 망치</strong>를 쓴다.</li></ul><p><strong>◈ 암기</strong> <u>드릴에 금속 망치는 금물</u>.</p><p>공구를 다룰 때 <strong>「금속 망치」가 보기에 나오면 대개 오답</strong>이다. 정밀한 공구는 <strong>충격에 약하고 조각이 튄다</strong>. 드릴은 이 밖에도 <strong>장갑을 끼지 않는다</strong>는 수칙이 중요하다.<br>정밀한 공구에 <strong>금속 망치를 대는 보기는 대개 오답</strong>이다. 드릴 작업에서는 <strong>장갑을 끼지 않는 것</strong>도 중요한 수칙인데, 회전부에 말려 들어가기 때문이다.</p>", "nq": 2}, "card_mac_t112": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "침투탐상검사(PT, penetrant testing)", "front": "침투탐상검사(PT, penetrant testing)은?", "back": "<strong>전처리 → 침투 → 세척 → 현상 → 관찰 → 후처리</strong>다.<p><strong>◈ 암기</strong> <u>전 · 침 · 세 · 현 · 관 · 후</u>.</p><p>원리는 <strong>틈에 물감을 넣었다가 겉을 닦고 빨아올려 본다</strong>는 것이다. 이 흐름대로 생각하면 순서를 외우지 않아도 된다. 다만 <strong>표면에 열린 결함만 찾을 수 있다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">침투탐상검사(PT)의 순서</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">순서</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 하나</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전처리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">기름과 때를 닦아 낸다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>침투처리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>침투액을 발라 틈으로 스며들게</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>세척처리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>겉에 남은 침투액만 씻어 낸다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>현상처리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>현상액을 발라 틈 속 침투액을 빨아올린다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>5</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>관찰</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">드러난 무늬로 결함을 판정</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>6</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>후처리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">약품을 제거한다</td></tr></tbody></table></div>", "nq": 1}, "card_mac_t113": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "프레스의 방호장치", "front": "프레스의 방호장치는?", "back": "<ul><li><strong>양수조작식</strong>은 <strong>급정지기구가 있어야</strong> 쓸 수 있다. 손을 떼면 슬라이드를 곧바로 멈춰 세워야 하기 때문이다.</li><li><strong>양수조작식</strong>이다. <strong>손을 떼면 슬라이드를 곧바로 멈춰 세워야</strong> 하기 때문이다.</li></ul><p><strong>◈ 암기</strong> <u>양수조작식과 광전자식만 급정지기구가 필요</u>.</p><p>가르는 물음 — <strong>멈출 수 있는 기계인가, 멈출 수 없는 기계인가</strong>. <strong>확동식 클러치 프레스는 한 번 내려오면 못 멈추므로</strong> 손이 들어가지 못하게 막는 장치만 쓴다.<br>가르는 물음 — <strong>멈출 수 있는 기계인가, 멈출 수 없는 기계인가</strong>. <strong>급정지기구가 필요한 것은 양수조작식과 광전자식 둘뿐</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">프레스 방호장치와 급정지기구</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방호장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원리</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>급정지기구가 있어야 (마찰식)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>양수조작식 · 광전자식(감응식)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위험하면 곧바로 멈춘다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>급정지기구가 없어도 (확동식)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>양수기동식 · 가드식 · 손쳐내기식 · 수인식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>애초에 손이 못 들어가게 한다</u></td></tr></tbody></table></div>", "nq": 2}, "card_mac_t114": {"kind": "공식형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "안전율과 허용응력", "front": "안전율과 허용응력의 식은?", "back": "$\\text{허용응력} = \\dfrac{\\text{인장강도}}{\\text{안전율}} = \\dfrac{350}{4} = 87.5$ [N/㎟] 다. <strong>1 [MPa] = 1 [N/㎟]</strong>이므로 단위를 바꿀 필요가 없다.<p><strong>◈ 암기</strong> <u>허용응력 = 인장강도 ÷ 안전율</u>.</p><p>$\\text{안전율} = \\dfrac{\\text{기준강도}}{\\text{허용응력}}$ 다. <strong>연성 재료는 항복점, 취성 재료는 극한강도</strong>를 기준강도로 삼는다. <strong>1 [MPa] = 1 [N/㎟]</strong>라는 환산은 자주 쓰이니 외워 둔다.</p>", "nq": 1}, "card_mac_t115": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "프레스 방호장치의 선정", "front": "프레스 방호장치의 선정은?", "back": "<ul><li><strong>수인식</strong>이다. 손목에 끈을 매어 <strong>슬라이드가 내려올 때 손을 끌어낸다</strong>.</li><li><strong>행정길이 50 [mm] 이상, 행정수 100 [spm] 이하</strong>다.</li><li><strong>수인식</strong>은 <strong>확동식 클러치 프레스</strong>에 쓰는 장치다. 마찰 클러치 프레스에는 알맞지 않다.</li></ul><p><strong>◈ 암기</strong> <u>100 [spm] 이하면 수인식·손쳐내기식</u>. · <u>수인식은 확동식 클러치용</u>.</p><p>수인식과 손쳐내기식은 <strong>슬라이드가 느리게 내려와야(100 [spm] 이하) 손을 뺄 틈</strong>이 있고, <strong>행정이 깊어야 끈을 당길 거리</strong>가 나온다. 두 조건 모두 그래서 붙는다.<br>수인식은 <strong>끈으로 손을 끌어내는</strong> 장치다. <strong>슬라이드가 느려야(100 [spm] 이하) 손을 뺄 틈</strong>이 있고, <strong>행정이 깊어야 끈을 당길 거리</strong>가 나온다. 두 조건이 그래서 붙는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">프레스 방호장치의 적용 조건</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방호장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조건</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>수인식 · 손쳐내기식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>행정수 100 [spm] 이하</u>이고 <u>행정길  0 2px;font-weight:700\">컨베이어 작업시작 전 점검사항 (규칙 별표3)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">점검사항</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>원동기 및 풀리 기능의 이상 유무</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>이탈 등의 방지장치 기능의 이상 유무</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>비상정지장치 기능의 이상 유무</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>원동기·회전축·기어 및 풀리 등의 덮개 또는 울 등의 이상 유무</u></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 별표3</em></p>", "nq": 2}, "card_mac_t009": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "방호장치의 조정", "front": "방호장치의 조정은?", "back": "<ul><li><strong>「자동보수장치」라는 방호장치는 없다.</strong> 방호장치는 사고를 막는 장치이지 스스로 고치는 장치가 아니다.</li><li><strong>파이널 리미트 스위치</strong>는 <strong>승강기</strong>의 방호장치다. 이동식 크레인에는 해당하지 않는다.</li><li><strong>비상정지장치</strong>다. <strong>모든 전원을 끊어 즉시 세운다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>파이널 리미트는 승강기 몫</u>. · <u>전원을 끊어 세우면 비상정지장치</u>.</p><p>안전보건규칙 제134조(방호장치의 조정). 양중기의 방호장치는 <u>과부하방지장치 · 권과방지장치 · 비상정지장치 · 제동장치</u>이며, 승강기에는 여기에 <u>파이널 리미트 스위치 · 속도조절기 · 출입문 인터록</u>이 더해진다.<br><strong>파이널 리미트 스위치가 나오면 승강기</strong>다. 이 한 가지만으로 문제가 갈린다.</p><div style=\"margin:12px 0 2px;font-weight:700\">양중기별 방호장치</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">설비</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vert le;text-align:center;\"><u>승강기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>적재하중 0.25 [t] 이상</u></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제132조</em></p>", "nq": 1}, "card_mac_t073": {"kind": "공식형", "fq": 2, "subject": "기계위험방지기술", "chapter": "프레스·전단기", "mid": "롤러기 급정지장치", "front": "롤러기 급정지장치의 식은?", "back": "<ul><li><strong>지름 4 [mm] 이상의 와이어로프</strong>다. 합성섬유로프를 쓴다면 <strong>지름 6 [mm] 이상</strong> 이어야 한다.</li><li>표면속도는 $V = \\dfrac{\\pi D N}{1 {,} 000} = \\dfrac{\\pi \\times 300 \\times 30}{1 {,} 000} \\fallingdotseq 28.3$ [m/min] 로 <strong>30 [m/min] 미만</strong>이다. 따라서 급정지거리는 <strong>원주의 1/3</strong> 이내이므로 $\\pi \\times 300 \\times \\dfrac{1}{3} \\fallingdotseq 314$ [mm] 다.</li><li>표면속도 <strong>30 [m/min] 미만이면 원주의 1/3 이내</strong>다. <strong>1/2.5 는 30 [m/min] 이상</strong> 일 때다.</li></ul><p><strong>◈ 암기</strong> <u>와이어 4, 섬유 6</u>. · <u>30 [m/min] 미만이면 1/3</u>.</p><p>조작부의 위치도 함께 나온다 — <strong>손 조작식 밑면에서 1.8 [m] 이내 · 복부 조작식 0.8~1.1 [m] · 무릎 조작식 0.6 [m] 이내</strong>. 급정지거리는 <strong>30 [m/min] 미만 1/3, 이상 1/2.5</strong>다.<br><strong>먼저 표면속도를 구해 30 [m/min] 을 넘는지 보고</strong> 나서 1/3 이냐 1/2.5 냐를 정한다. 순서를 건너뛰고 곧바로 나누면 377 을 골라 틀린다.</p><div style=\"margin:12px 0 2px;font-weight:700\">급정지장치 조작부 로프의 기준</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">재질</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">지름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>와이어로프</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>4 [mm] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">이 문항</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>합성섬유로프</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>6 [mm] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 방호장치 안전인증 고시</em></p>", "nq": 4}, "card_mac_t124": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "프레스·전단기", "mid": "프레스의 분류", "front": "프레스의 분류는?", "back": "<ul><li><strong>액압 프레스</strong>는 <strong>동력의 종류</strong>로 나눈 것이다. 슬라이드 운동기구에 따른 분류가 아니다.</li><li><strong>푸트(foot) 프레스</strong>는 <strong>발로 밟아 움직이는 수동 프레스</strong>다. 동력프레스가 아니다.</li></ul><p><strong>◈ 암기</strong> <u>액압은 동력에 따른 분류</u>. · <u>푸트 프레스는 수동</u>.</p><p><strong>「무엇이 슬라이드를 움직이는가(크랭크·너클·마찰)」와 「무엇으로 힘을 내는가(기계·액압)」</strong>는 다른 물음이다. <strong>액압만 힘의 종류</strong>를 가리킨다.<br><strong>「푸트(발)」라는 이름 자체가 사람의 힘</strong>을 가리킨다. 동력프레스는 <strong>크랭크 · 토글(너클) · 마찰 · 액압</strong>처럼 <strong>기계나 유체가 힘을 낸다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">프레스의 분류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>슬라이드 운동기구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>크랭크 · 너클 · 마찰 · 캠 · 링크 · 나사 프레스</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>동력의 종류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기계 프레스 · 액압(유압·수압) 프레스</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>클러치의 종류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>확동식 · 마찰식</u></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t119": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "퓨즈의 기능", "front": "퓨즈의 기능은?", "back": "<strong>회로에 흐르는 과전류를 끊는</strong> 것이 퓨즈의 목적이다. 전류가 지나치면 <strong>가용체가 녹아</strong> 회로를 연다.<p><strong>◈ 암기</strong> <u>퓨즈는 과전류</u>.</p><p><strong>퓨즈는 「많이 흐르면」 끊고, 누전차단기는 「새면」 끊는다</strong>. 두 장치는 서로 대신하지 못하므로 <strong>함께 설치</strong> 한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">보호장치가 막는 것</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">막는 것</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>퓨즈 · 배선용 차단기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>과전류(과부하 · 단락)</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>누전차단기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>누설전류(지락)</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>피뢰기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이상 전압(뇌서지 · 개폐서지)</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>고장 시 외함의 대지전압 상승</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t120": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "교류아크용접기의 자동전격방지장치", "front": "교류아크용접기의 자동전격방지장치는?", "back": "<ul><li><strong>용접을 쉬는 동안</strong>이다. 아크가 끊긴 직후부터 <strong>다음 아크가 생길 때까지</strong> 전압을 25 [V] 이하로 낮춰 둔다.</li><li><strong>25 ~ 30 [V] 이하</strong>로, <strong>1초 이내</strong>에 낮춰야 한다.</li></ul><p><strong>◈ 암기</strong> <u>쉬는 동안만 25 [V] 이하</u>. · <u>1초 이내 25 [V] 이하</u>.</p><p>감전은 <strong>용접하는 순간이 아니라 쉬는 동안 홀더를 만질 때</strong> 일어난다. 그래서 <strong>쉬는 동안만 전압을 낮춘다</strong>. <strong>아크 중단 후 1초 이내</strong>에 작동해야 한다.<br>교류아크용접기의 무부하전압은 <strong>보통 60 ~ 95 [V]</strong>로 감전 위험이 크다. 이를 <strong>1초 이내에 25 ~ 30 [V] 이하</strong>로 떨어뜨리는 것이 이 장치다. <strong>두 숫자(1초, 25 [V])</strong>를 짝으로 잡아 둔다.</p><div style=\"margin:12px 0 2px;font-weight:700\">자동전격방지장치가 하는 일</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">때</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">2차 전압</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>용접 중(아크 발생 중)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>무부하전압 그대로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>낮추면 용접이 안 된다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>용접을 쉴 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>25 [V] 이하로 낮춘다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>홀더를 만져도 안전하게</u></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t121": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "누전차단기에 의한 감전방지", "front": "누전차단기에 의한 감전방지는?", "back": "<ul><li><strong>대지전압 150 [V] 를 넘는</strong> 이동형·휴대형 전기기계기구에는 누전차단기를 달아야 한다. 220 [V] 는 여기에 든다.</li><li><strong>30 [mA] 이하, 0.03초 이내</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>대지전압 150 [V] 넘으면 설치</u>. · <u>일반 30, 물기 15 — 시간은 둘 다 0.03초</u>.</p><p>면제 사유가 모두 <strong>사람과 대지 사이에 전류가 돌아갈 길이 없다</strong>는 한 가지다. 보기 ②만 <strong>그 길이 열려 있어</strong> 설치해야 한다.<br><strong>전류는 장소에 따라 달라지지만 시간은 언제나 0.03초</strong>다. <strong>30 [mA] × 0.03초 = 0.9 [mA·s]</strong>로 <strong>위험한계 50 [mA·s]</strong>보다 훨씬 작다.</p><div style=\"margin:12px 0 2px;font-weight:700\">누전차단기를 설치하지 않아도 되는 경우</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">면제 사유</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2중 절연구조의 기계기구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>절연이 두 겹이라 감전 우려가 없다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>절연대 위에서 사용하는 경우</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">대지와 끊어져 있다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>비접지방식의 전로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">돌아갈 길이 없다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전원측에 절연변압기(2차 300 [V] 이하)를 시설한 경우</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전원이 대지와 끊어져 있다</u></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제304조</em></p>", "nq": 2}, "card_ele_t122": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "심전도와 심실세동", "front": "심전도와 심실세동은?", "back": "<ul><li><strong>T 파</strong>다. <strong>심실이 수축을 마치고 쉬면서 회복하는 동안</strong> 나타나며, 이때 전류가 흐르면 심실세동이 가장 잘 일어난다.</li><li><strong>심실이 수축을 마치고 쉬는 때(T 파)</strong>다. 이때가 <strong>취약기(vulnerable period)</strong>로 심실세동이 가장 잘 일어난다.</li></ul><p><strong>◈ 암기</strong> <u>T 파에서 감전되면 가장 위험</u>.</p><p>T 파 구간은 <strong>심근세포가 다시 흥분할 준비를 하는 불안정한 때</strong> 라서 <strong>작은 자극에도 박동이 흐트러진다</strong>. 이를 <strong>취약기(vulnerable period)</strong>라 한다.<br>T 파 구간은 <strong>심근세포가 다시 흥분할 준비를 하는 불안정한 때</strong> 라서 <strong>작은 자극에도 박동이 흐트러진다</strong>. <strong>쉴 때가 오히려 위험</strong> 하다는 점이 뜻밖이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">심전도의 파형</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">파형</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>P 파</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>심방의 수축</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>QRS 군</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>심실의 수축</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>T 파</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>심실의 수축이 끝나고 회복(휴식)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>여기서 감전되면 가장 위험</u></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t039": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "전기 기계·기구 등의 충전부 방호", "front": "전기 기계·기구 등의 충전부 방호는?", "back": "<ul><li>충전부는 <strong>출입이 어려운 곳</strong>에 두어야 한다. <strong>드나들기 쉬운 트인 곳</strong>에 두고 표지만 붙이는 것은 방호가 아니다.</li><li><strong>관계자 외에도 쉽게 드나들 수 있는 곳</strong>에 충전부를 두는 것은 감전 위험을 키운다. 조문은 <strong>충전부를 관계자 외 출입금지 장소에 설치</strong> 하도록 한다.</li></ul><p><strong>◈ 암기</strong> <u>숨기고 덮는다</u> — 드러내고 표지만 붙이지 않는다. · <u>덮거나 멀리 두거나</u>.</p><p>다섯 가지 방법 — <strong>절연물로 감싼다 · 폐쇄형 외함 · 방호망이나 절연 덮개 · 대지전압 30 [V] 이하의 충전부 · 출입이 어려운 곳에 두고 위험표시</strong>. <strong>「출입이 용이한」이 아니라 「어려운」</strong>이다.<br>대책은 두 갈래다 — <strong>덮거나(외함·방호망·절연물) 멀리 두거나(출입금지 장소·전주 위)</strong>. 보기 ④는 <strong>두 갈래 어디에도 들지 않고 오히려 반대</strong>다.</p><div style=\"margin:12px 0 2px;font-weight:700\">직접 접촉에 의한 감전방지 (규칙 제301조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead  12px;vertical-align:middle;text-align:left;\"><u>흔들어 촘촘하게 만든다</u></td></tr></tbody></table></div>", "nq": 3}, "card_con_t118": {"kind": "단답형", "fq": 1, "subject": "건설안전기술", "chapter": "건설공사 안전개요", "mid": "히빙(heaving) 현상", "front": "히빙(heaving) 현상은?", "back": "<ul><li><strong>히빙(heaving)</strong>이다. <strong>연약 점토 지반에서 흙막이 뒤의 흙 무게에 밀려 굴착 바닥이 부풀어 오르는</strong> 현상이다.</li><li><strong>굴착 둘레의 상재하중을 늘리면</strong> 배면 흙의 무게가 커져 <strong>히빙이 더 심해진다</strong>. 줄여야 한다.</li><li><strong>히빙(heaving)</strong>이다. <strong>점토지반에서 바깥 흙의 무게에 밀려 안쪽 바닥이 부풀어 오른다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>점토에서 바닥이 부풀면 히빙</u>. · <u>바깥 하중은 줄인다</u>.</p><p><strong>「전면의 굴착부분을 남겨 둔다」</strong>는 대책이 곧 <strong>안쪽 흙의 무게로 바깥 흙의 무게에 맞선다</strong>는 뜻이다. 히빙이 <strong>무게 싸움</strong>이라는 점을 말해 준다.<br>히빙은 <strong>바깥 흙의 무게가 안쪽을 밀어 올리는 무게 싸움</strong>이다. <strong>바깥은 덜고 안쪽은 남긴다</strong>는 방향으로 대책이 모인다. 보기 ①만 정반대다.</p><div style=\"margin:12px 0 2px;font-weight:700\">히빙 · 보일링 · 파이핑</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">히빙</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보일링</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">파이핑</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">지반</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>연약 점토</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사질토</u></td><td style=\"border:1px soli function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function kx(el){if(window.renderMathInElement)renderMathInElement(el,{delimiters:[
 {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}

const MARK=['①','②','③','④'];
const LV={1:['#10b981','쉬움'],2:['#f59e0b','보통'],3:['#ef4444','어려움']};

function fmt(s){const m=Math.floor(s/60),x=s%60;
 return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+':'+String(x).padStart(2,'0');}

let tick=null;
function startTimer(){
 if(STUDY)return;
 clearInterval(tick);tick=setInterval(()=>{
  if(S.done)return;
  S.elapsed++;const left=D.limit-S.elapsed;
  const t=$('#timer'); if(!t)return;
  t.textContent=left>0?fmt(left):'00:00:00';
  t.classList.toggle('warn',left<600);
  if(left<=0)submit();
  if(S.elapsed%10===0)save();
 },1000);}

function intro(){
 $('#app').innerHTML=`<div class="wrap intro">
  <h2>${D.title}</h2>
  <p>6과목 120문항 · 시험시간 3시간</p>
  <p>합격 기준 — 과목당 40점 이상, 전 과목 평균 60점 이상</p>
  <p style="margin-top:14px;font-size:13px">답만 고르고 끝에 제출합니다.
   해설과 암기카드는 채점한 뒤에 열립니다.</p>
  <button class="big" id="go">시험 시작</button>
  ${Object.keys(S.ans).length?'<div style="margin-top:12px;font-size:13px;color:#64748b">이어서 풀면 지난번 답안이 그대로 살아 있습니다</div>':''}
 </div>`;
 $('#go').onclick=()=>{S.started=1;save();render();startTimer();};
}

// 해설이 열려 있는가 — 직접 여닫은 적이 있으면 그 뜻을 따른다
function solOpen(q){
 if(S.open[q.n]!==undefined)return S.open[q.n];
 return S.done||(STUDY&&!!S.ans[q.n]);
}

function qHTML(q){
 const a=S.ans[q.n], graded=(STUDY&&a)||S.done, show=STUDY||S.done;
 let h=`<div class="wrap"><div class="qh"><span class="qno">${String(q.n).padStart(3,'0')}</span>
  <span class="tag" style="background:${LV[q.lv][0]}">난이도 ${q.lv}·${LV[q.lv][1]}</span>
  <span class="tag" style="background:#6366f1">${q.kind}</span>
  <span class="tag" style="background:#f59e0b">빈출 ${'★'.repeat(q.fq)+'☆'.repeat(3-q.fq)}</span>
  <span class="subj">제${q.s}과목 ${D.subj[q.s-1]}</span>`;
 if(show){
   h+=`<span class="acts">
    <button class="mini${solOpen(q)?' on':''}" id="tsol">📖 해설 ${solOpen(q)?'닫기':'보기'}</button>
    ${q.card&&D.cards[q.card]?'<button class="mini cd" id="tcard">🃏 암기카드</button>':''}
   </span>`;
 }
 h+=`</div><div class="stem">${q.t}</div>`;
 if(q.cond)h+=`<div class="cond">${q.cond}</div>`;
 if(q.img)h+=`<img class="stemimg" src="img/${q.img}">`;
 for(let k=0;k<4;k++){
   let cls='opt';
   if(a===k+1)cls+=' sel';
   if(graded){ if(k+1===q.a)cls='opt right'; else if(a===k+1)cls='opt wrong'; }
   h+=`<button class="${cls}" data-k="${k+1}"><span class="n">${MARK[k]}</span><span>${q.c[k]}</span></button>`;
 }
 if(graded){
   h+= a===q.a ? `<div class="vline o">정답입니다 · 정답 ${q.a}번</div>`
              : `<div class="vline x">${a?'틀렸습니다 · 고른 답 '+a+'번 · ':'미응답 · '}정답 ${q.a}번</div>`;
 }
 if(show&&solOpen(q)){
   h+=`<div class="sol"><div class="lbl">해설</div><div>${q.sol}</div>`;
   if(q.w)h+=`<div class="lbl">오답 분석</div><div>${q.w}</div>`;
   if(q.pt)h+=`<div class="lbl g">관련 개념 · 암기</div><div class="box">${q.pt}</div>`;
   if(q.law)h+=q.law;
   h+=`</div>`;
 }
 return h+'</div>';
}

function render(){
 if(!S.started){intro();return;}
 if(!STUDY&&S.done&&S.i<0){result();return;}
 const q=D.q[S.i];
 $('#app').innerHTML=qHTML(q);
 $$('.opt').forEach(b=>b.onclick=()=>{
   S.ans[q.n]=+b.dataset.k;
   if(STUDY&&S.open[q.n]===undefined)S.open[q.n]=true;
   save();
   if(STUDY||S.done){render();}
   else{$$('.opt').forEach(x=>x.classList.toggle('sel',x===b));paint();}
 });
 const ts=$('#tsol'); if(ts)ts.onclick=()=>{S.open[q.n]=!solOpen(q);save();render();};
 const tc=$('#tcard'); if(tc)tc.onclick=()=>openCard(q.card);
 kx($('#app'));
 stat();
 $('#prev').disabled=S.i===0; $('#next').disabled=S.i===119;
 paint();
 window.scrollTo(0,0);
}

function stat(){
 const n=Object.keys(S.ans).length;
 if(STUDY){
   let ok=0; D.q.forEach(q=>{if(S.ans[q.n]===q.a)ok++;});
   $('#prog').innerHTML=`<b>${S.i+1}</b> / 120 · 푼 문항 <b>${n}</b> · 맞힘 <b>${ok}</b>`;
   const r=$('#rate');
   if(r)r.textContent=n?`정답률 ${Math.round(ok/n*100)}%`:'정답률 —';
 }else{
   $('#prog').innerHTML=S.done?`채점 완료`:`<b>${S.i+1}</b> / 120 · 푸는 중 <b>${n}</b>`;
 }
}

/* 암기카드 팝업 */
let mflip=false;
function openCard(id){
 const c=D.cards[id]; if(!c)return;
 mflip=false;
 $('#mbody').innerHTML=`<button class="mx" id="mx">✕</button>
  <div class="mcard" id="mcard">
   <div class="mface">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span class="stars">${'★'.repeat(c.fq)+'☆'.repeat(3-c.fq)}</span>
     <span>${c.subject}${c.chapter?' · '+c.chapter:''}</span>
     <span class="mcid">${id}</span></div>
    <div class="mq">${c.front}</div>
    <div class="mhint">카드를 누르면 뒤집힙니다 · Esc 닫기</div>
   </div>
   <div class="mface back">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span>${c.mid}</span><span class="mcid">${id}</span></div>
    <div class="ma">${c.back}</div>
    <div class="mfoot"><span>이 개념을 묻는 문항 ${c.nq}개</span>
     <a href="../_암기카드.html#${id}" target="_blank">카드 전체 보기 →</a></div>
   </div>
  </div>`;
 $('#modal').classList.add('on');
 kx($('#mbody'));
 fitCard(); setTimeout(fitCard,260);
 $('#mcard').onclick=()=>{mflip=!mflip;$('#mcard').classList.toggle('flip',mflip);};
 $('#mx').onclick=e=>{e.stopPropagation();closeCard();};
}
function fitCard(){
 const mc=$('#mcard'); if(!mc)return;
 mc.style.height='120px';
 const h=Math.max(...[...mc.querySelectorAll('.mface')].map(f=>f.scrollHeight));
 mc.style.height=Math.min(window.innerHeight*0.78,Math.max(300,h+4))+'px';
}
function closeCard(){$('#modal').classList.remove('on');}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeCard();};
window.addEventListener('resize',()=>{if($('#modal').classList.contains('on'))fitCard();});

function paint(){
 $$('.pg').forEach(b=>{
   const n=+b.dataset.n, q=D.q[n-1];
   const marked=STUDY?!!S.ans[n]:S.done;
   let c='pg';
   if(marked&&(STUDY||S.done))c+=(S.ans[n]===q.a?' ok':' no');
   else if(S.ans[n])c+=' done';
   if(n-1===S.i)c+=' cur';
   b.className=c;
 });
}

function submit(){
 if(STUDY||S.done)return;
 const un=120-Object.keys(S.ans).length;
 if(un>0&&!confirm('안 푼 문제가 '+un+'개 있습니다. 제출할까요?'))return;
 S.done=true;clearInterval(tick);save();S.i=-1;result();
}

function result(){
 const per=[0,0,0,0,0,0],tot=[0,0,0,0,0,0];
 let right=0;
 D.q.forEach(q=>{tot[q.s-1]++;if(S.ans[q.n]===q.a){per[q.s-1]++;right++;}});
 const scores=per.map((v,i)=>Math.round(v/tot[i]*100));
 const avg=Math.round(right/120*100);
 const pass=avg>=60&&scores.every(s=>s>=40);
 let h=`<div class="result"><div style="text-align:center;color:#64748b;font-size:13px">${D.title} · 채점 결과</div>
  <div class="score">${avg}<span style="font-size:20px;color:#94a3b8">점</span></div>
  <div style="text-align:center;color:#64748b;font-size:14px">120문항 중 <b>${right}</b>문항 정답 · 소요 ${fmt(S.elapsed)}</div>
  <div class="verdict ${pass?'pass':'fail'}">${pass?'합격':'불합격'}</div>
  <table class="stab"><tr><th>과목</th><th>맞힌 문항</th><th>점수</th></tr>`;
 for(let i=0;i<6;i++){
   h+=`<tr><td style="text-align:left">제${i+1}과목 ${D.subj[i]}</td>
    <td>${per[i]} / ${tot[i]}</td><td class="${scores[i]<40?'bad':''}">${scores[i]}</td></tr>`;
 }
 h+=`</table><div style="font-size:12.5px;color:#64748b;text-align:center">합격 — 과목당 40점 이상, 평균 60점 이상</div>
  <div class="rowbtns">
   <button class="nbtn pri" id="rw">틀린 문제만 다시 보기</button>
   <button class="nbtn" id="rall">전체 해설 보기</button>
   <button class="nbtn" id="rst">다시 풀기</button>
  </div></div>`;
 $('#app').innerHTML=h;
 paint(); stat();
 $('#rw').onclick=()=>{const bad=D.q.findIndex(q=>S.ans[q.n]!==q.a);S.i=bad<0?0:bad;render();};
 $('#rall').onclick=()=>{S.i=0;render();};
 $('#rst').onclick=()=>{if(confirm('답안을 지우고 처음부터 다시 풀까요?')){
   S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();startTimer();}};
}

function build(){
 let p='';
 for(let s=1;s<=6;s++){
   p+=`<div class="palhd">제${s}과목 ${D.subj[s-1]}</div><div class="palgrid">`;
   D.q.filter(q=>q.s===s).forEach(q=>{p+=`<button class="pg" data-n="${q.n}">${q.n}</button>`;});
   p+='</div>';
 }
 $('#pal').innerHTML=p;
 $$('.pg').forEach(b=>b.onclick=()=>{S.i=+b.dataset.n-1;save();render();$('#pal').classList.remove('open');});
}

$('#prev').onclick=()=>{if(S.i>0){S.i--;save();render();}};
$('#next').onclick=()=>{if(S.i<119){S.i++;save();render();}};
$('#palbtn').onclick=()=>$('#pal').classList.toggle('open');
const sb=$('#sub'); if(sb)sb.onclick=submit;
const rs=$('#reset'); if(rs)rs.onclick=()=>{if(confirm('푼 기록을 모두 지울까요?')){
 S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();}};
document.addEventListener('keydown',e=>{
 if($('#modal').classList.contains('on')){
   if(e.key==='Escape')closeCard();
   if(e.key===' '){e.preventDefault();$('#mcard').click();}
   return;
 }
 if(e.key==='ArrowLeft')$('#prev').click();
 if(e.key==='ArrowRight')$('#next').click();
 if('1234'.includes(e.key)){const b=$$('.opt')[+e.key-1];if(b)b.click();}
 if(e.key==='s'||e.key==='S'){const t=$('#tsol');if(t)t.click();}
 if(e.key==='c'||e.key==='C'){const t=$('#tcard');if(t)t.click();}
});
build();
const hm=location.hash.match(/^#q(\d+)/);
if(hm){S.started=1;S.i=Math.max(0,Math.min(119,+hm[1]-1));save();}
if(!STUDY&&S.done){if(hm){render();}else{S.i=-1;result();}}
else{render();if(S.started)startTimer();}
</script>
</body></html>
