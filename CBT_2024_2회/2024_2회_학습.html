u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">정량적 · 귀납적</td></tr></tbody></table></div>", "nq": 3}, "card_erg_t151": {"kind": "단답형", "fq": 3, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "인간-기계 시스템의 설계 원칙", "front": "인간-기계 시스템의 설계 원칙은?", "back": "<ul><li><strong>기계적 성능에 맞추는</strong> 것은 인간공학의 방향과 반대다. 인간공학은 <strong>기계를 사람에게 맞춘다</strong>.</li><li>인터페이스는 <strong>기계의 효율이 아니라 사람을 먼저</strong> 고려해야 한다. 인간공학의 방향과 정반대다.</li></ul><p><strong>◈ 암기</strong> <u>기계를 사람에게 맞춘다</u>.</p><p>인간공학의 한 문장은 <strong>「사람을 기계에 맞추지 말고 기계를 사람에게 맞춘다」</strong>다. <strong>「기계적 성능에 적합하게」</strong>는 그 반대이므로 곧바로 걸러진다.<br>인간공학의 한 문장은 <strong>「사람을 기계에 맞추지 말고 기계를 사람에게 맞춘다」</strong>다. <strong>「기계의 효율이 우선」</strong>이라는 표현이 나오면 곧바로 걸러진다.</p>", "nq": 2}, "card_erg_t005": {"kind": "공식형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "phon 과 sone", "front": "phon 과 sone의 식은?", "back": "<ul><li><strong>1 sone은 1,000 [Hz] 순음이 40 [dB] 일 때의 음량</strong>으로 정의한다. 「천 헤르츠, 사십 데시벨」을 묶어 외운다.</li><li>1,000 [Hz] 에서는 <strong>dB = phon</strong>이다. $\\mathrm{sone} = 2^{( \\mathrm{phon} - 40 ) / 10}$이므로 60 [phon]은 $2^{2} = 4$ [sone]이다. 4배면 16 [sone]이고, $16 = 2^{4}$이므로 $\\mathrm{phon} = 40 + 40 = 80$이다.</li><li><strong>1,000 [Hz] 에서는 dB과 phon이 같다</strong>. 70 [dB] 이면 <strong>70 [phon]</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>1,000 [Hz] · 40 [dB] = 1 sone</u>. phon 10 오르면 sone 2배. · <u>10 phon 오르면 크기는 2배</u>.</p><p>음량의 두 척도. <u>phon은 1,000 [Hz] 순음과 같게 들리는 음압수준(dB)</u>이고, <u>sone은 그 크기를 비율로 나타낸 값</u>이다. 관계식은 $\\mathrm{sone} = 2^{( \\mathrm{phon} - 40 ) / 10}$이며, <u>phon이 10 오를 때마다 sone은 2배</u>가 된다. 40 phon = 1 sone이 출발점이다.<br><strong>10 [phon]이 오를 때마다 sone은 두 배</strong>가 된다. 「몇 배 크게 들린다」는 문제는 반드시 <strong>sone</strong>으로 옮겨 풀어야 한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">phon과 sone</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">phon</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">sone</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">40</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1,000 [Hz] 순음 40 [dB]</u>가 기준</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">50</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">2</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">phon이 10 오르면 sone은 2배</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">60</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">4</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">70</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">8</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">80</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertica tyle=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>눈금에 적어 놓은 이웃한 수치 사이의 차</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>눈금간격</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>최소 눈금선 사이의 값 차</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「최대」가 아니다</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t036": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "화학설비의 안전성 평가", "front": "화학설비의 안전성 평가는?", "back": "<ul><li><strong>취급물질</strong>은 <strong>정량적 평가</strong>의 항목이다. 양을 재어 점수를 매기기 때문이다.</li><li>정량적 평가 항목은 <strong>취급물질 · 화학설비의 용량 · 온도 · 압력 · 조작</strong> 다섯이다. <strong>훈련</strong>은 여기 없다.</li><li><strong>공정</strong>은 <strong>정성적 평가</strong> 항목이다. 정량적 평가는 <strong>취급물질 · 용량 · 온도 · 압력 · 조작</strong> 다섯이다.</li></ul><p><strong>◈ 암기</strong> 정량적 평가 다섯은 「<u>물 · 용 · 온 · 압 · 조</u>」. · <u>물 · 용 · 온 · 압 · 조</u>.</p><p>6단계는 <strong>관계 자료의 정비 → 정성적 평가 → 정량적 평가 → 안전대책 → 재해정보에 의한 재평가 → FTA에 의한 재평가</strong>다.<br>정량적 평가 다섯 항목은 <strong>물질 · 용량 · 온도 · 압력 · 조작</strong>이다. <strong>모두 숫자로 잴 수 있는 것</strong> 들이라 정량적이다. 훈련은 숫자로 재기 어렵다.</p><div style=\"margin:12px 0 2px;font-weight:700\">화학설비 안전성 평가의 항목</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">성격</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정성적 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">입지 조건 · 공장 내 배치 · 건조물 · 소방설비</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">있는가 없는가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정성적 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">원재료 · 중간재 · 제품 · 공정 · 수송과 저장</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">절차가 갖춰졌는가</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정량적 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>취급물질</u> · 용량 · 온도 · 압력 · 조작</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">점수를 매긴다</td></tr></tbody></table></div>", "nq": 8}, "card_erg_t153": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "인간-기계 시스템의 신뢰도", "front": "인간-기계 시스템의 신뢰도의 식은?", "back": "경계 효과에 따른 신뢰도는 $R_{1} = e^{-0.01 \\times 4} = e^{-0.04} \\fallingdotseq 0.9608$이다. 스위치는 <strong>2·3·4·5시 네 번</strong> 작동하므로 $R_{2} = ( 1 - 0.001 )^{4} \\fallingdotseq 0.996$이다. 전체는 $0.9608 \\times 0.996 \\fallingdotseq 0.957$이다.<p><strong>◈ 암기</strong> $R = e^{-\\lambda t} \\times ( 1 - \\mathrm{HEP} )^{n}$.</p><p>두 갈래를 곱한다 — <strong>시간에 따라 줄어드는 경계 효과(지수함수)</strong>와 <strong>작동 횟수만큼 곱해지는 인간오류(</strong>$( 1 - \\mathrm{HEP} )^{n}$<strong>)</strong>. <strong>4시간 동안 네 번</strong>이라는 셈을 놓치지 않는 것이 갈림길이다.</p>", "nq": 1}, "card_mac_t110": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "연삭기 덮개의 노출각도", "front": "연삭기 덮개의 노출각도는?", "back": "<ul><li><strong>180° 이내</strong>다. 손에 들고 쓰는 연삭기는 <strong>작업면을 넓게 열어야</strong> 하므로 덮개 각도가 가장 크다.</li><li><strong>60° 이내</strong>다. <strong>숫돌 위쪽을 쓰는</strong> 탁상용 연삭기는 <strong>수평면 아래로 연삭하므로</strong> 노출을 가장 좁게 잡는다.</li><li><strong>60° 이내</strong>다. <strong>위쪽을 쓰는 것이므로 그만큼만 열어</strong> 둔다.</li></ul><p><strong>◈ 암기</strong> <u>휴대용은 180° 이내</u>. · <u>상부 사용 탁상용은 60° 이내</u>.</p><p><strong>손으로 들고 쓸수록 넓게 연다</strong>는 흐름으로 잡는다 — <strong>60 → 125 → 150 → 180</strong>. 연삭기는 이 밖에도 <strong>작업 시작 전 1분, 숫돌 교체 뒤 3분 시운전</strong>이 함께 나온다.<br><strong>60 → 125 → 150 → 180</strong> 네 값이다. <strong>아래를 향해 갈수록 좁게, 손에 들수록 넓게</strong>라는 흐름으로 잡는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">연삭기 덮개의 노출각도</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">연삭기의 종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">노출각도</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>탁상용 — 일반</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>125° 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">숫돌 중심 위 65° 이내</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>탁상용 — 수평 이하 연삭</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>60° 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>원통·센터리스·평면 연삭기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>150° 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>휴대용 연삭기 · 스윙 연삭기 · 슬래브 연삭기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>180° 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>절단 및 조정 연삭기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>180° 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 별표</em></p>", "nq": 4}, "card_mac_t087": {"kind": "공식형", "fq": 1, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "연삭숫돌의 플랜지", "front": "연삭숫돌의 플랜지의 식은?", "back": "<ul><li>평형플랜지의 지름은 <strong>숫돌 지름의 1/3 이상</strong> 이어야 한다. $180 / 3 = 60$ [mm]다.</li><li>플랜지 지름은 <strong>숫돌 바깥지름의 1/3 이상</strong>이므로 $150 \\times 1 / 3 = 50$ [mm]다.</li><li>플랜지 지름은 <strong>숫돌 바깥지름의 1/3 이상</strong>이므로 $300 \\times 1 / 3 = 100$ [mm]다.</li></ul><p><strong>◈ 암기</strong> <u>숫돌 지름의 1/3 이상</u>. · <u>플랜지는 숫돌 지름의 1/3 이상</u>.</p><p>플랜지가 작으면 <strong>숫돌을 잡아 주는 면이 좁아 깨지기 쉽다</strong>. 연삭기의 숫자 — <strong>플랜지 1/3 이상 · 덮개는 지름 5 [cm] 이상인 숫돌에 · 작업 전 1분, 교체 후 3분 시운전</strong>.<br><strong>플랜지는 숫돌 지름의 1/3 이상</strong>이라야 숫돌을 제대로 붙들어 파괴를 막는다. 연삭기는 이 밖에 <strong>작업 시작 전 1분, 숫돌 교체 뒤 3분 시운전</strong>과 <strong>최고사용 원주속도 초과 금지</strong>가 함께 나온다.</p><p><em>근거 — 안전보건규칙 제120조</em></p>", "nq": 4}, "card_mac_t111": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "휴대용 동력드릴의 안전수칙", "front": "휴대용 동력드릴의 안전수칙은?", "back": "<ul><li><strong>금속성 망치로 두드리면 안 된다</strong>. 날이 상하고 조각이 튈 수 있으므로 <strong>나무나 플라스틱 망치</strong>를 쓴다.</li><li><strong>금속성 망치를 쓰면 안 된다</strong>. 날이 상하고 조각이 튀므로 <strong>나무나 플라스틱 망치</strong>를 쓴다.</li></ul><p><strong>◈ 암기</strong> <u>드릴에 금속 망치는 금물</u>.</p><p>공구를 다룰 때 <strong>「금속 망치」가 보기에 나오면 대개 오답</strong>이다. 정밀한 공구는 <strong>충격에 약하고 조각이 튄다</strong>. 드릴은 이 밖에도 <strong>장갑을 끼지 않는다</strong>는 수칙이 중요하다.<br>정밀한 공구에 <strong>금속 망치를 대는 보기는 대개 오답</strong>이다. 드릴 작업에서는 <strong>장갑을 끼지 않는 것</strong>도 중요한 수칙인데, 회전부에 말려 들어가기 때문이다.</p>", "nq": 2}, "card_mac_t125": {"kind": "공식형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "가드 개구부 간격(ISO 및 안전인증 기준)", "front": "가드 개구부 간격(ISO 및 안전인증 기준)의 식은?", "back": "<ul><li>비전동체이므로 $Y = 6 + 0.15 X = 6 + 0.15 \\times 60 = 6 + 9 = 15$ [mm]다.</li><li>풀리는 <strong>전동체</strong>이므로 $Y = 6 + 0.15 X = 6 + 0.15 \\times 50 = 13.5$ [mm]다.</li></ul><p><strong>◈ 암기</strong> <u>비전동체는 </u>$6 + 0.15 X$. · <u>전동체는 </u>$6 + 0.15 X$.</p><p><strong>6 [mm]는 손가락이 들어가지 못하는 최소값</strong>이고, <strong>거리에 비례해 조금씩 넓혀 준다</strong>. <strong>전동체는 0.1, 비전동체는 0.15</strong>라는 계수 차이가 갈림길이다.<br><strong>6 [mm]는 손가락이 들어가지 못하는 최소값</strong>이고, <strong>거리에 비례해 조금씩 넓혀 준다</strong>. 계수는 <strong>전동체 0.15, 비전동체 0.1</strong>로 <strong>전동체 쪽이 크다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">가드 개구부 간격의 식</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">적용</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험점이 전동체</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$Y = 6 + 0.1 X$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$X &lt; 760$<u> [mm] 일 때</u></td></tr><tr><td rowspan=\"2\" style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험점이 비전동체</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$Y = 6 + 0.15 X$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$X &lt; 160$<u> [mm] 일 때</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$Y = 30$<u> [mm]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$X \\ge 160$ [mm] 이면</td></tr></tbody></table></div>", "nq": 2}, "card_mac_t115": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "프레스 방호장치의 선정", "front": "프레스 방호장치의 선정은?", "back": "<ul><li><strong>수인식</strong>이다. 손목에 끈을 매어 <strong>슬라이드가 내려올 때 손을 끌어낸다</strong>.</li><li><strong>행정길이 50 [mm] 이상, 행정수 100 [spm] 이하</strong>다.</li><li><strong>수인식</strong>은 <strong>확동식 클러치 프레스</strong>에 쓰는 장치다. 마찰 클러치 프레스에는 알맞지 않다.</li></ul><p><strong>◈ 암기</strong> <u>100 [spm] 이하면 수인식·손쳐내기식</u>. · <u>수인식은 확동식 클러치용</u>.</p><p>수인식과 손쳐내기식은 <strong>슬라이드가 느리게 내려와야(100 [spm] 이하) 손을 뺄 틈</strong>이 있고, <strong>행정이 깊어야 끈을 당길 거리</strong>가 나온다. 두 조건 모두 그래서 붙는다.<br>수인식은 <strong>끈으로 손을 끌어내는</strong> 장치다. <strong>슬라이드가 느려야(100 [spm] 이하) 손을 뺄 틈</strong>이 있고, <strong>행정이 깊어야 끈을 당길 거리</strong>가 나온다. 두 조건이 그래서 붙는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">프레스 방호장치의 적용 조건</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방호장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조건</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>수인식 · 손쳐내기식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>행정수 100 [spm] 이하</u>이고 <u>행정길이 40 [mm] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>느리고 깊게 내려오는 기계</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>양수조작식 · 광전자식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>급정지기구가 있는 마찰식 클러치 프레스</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>양수기동식 · 가드식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>확동식 클러치 프레스</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 3}, "card_mac_t126": {"kind": "공식형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "안전율(safety factor)", "front": "안전율(safety factor)의 식은?", "back": "$\\text{안전율} = \\dfrac{\\text{기초강도} ( \\text{인장강도} )}{\\text{허용응력}}$다. <strong>센 쪽을 위에, 견디게 할 쪽을 아래에</strong> 둔다.<p><strong>◈ 암기</strong> <u>센 쪽이 분자</u>.</p><p><strong>안전율은 반드시 1보다 크다</strong>. 그러려면 <strong>큰 값(재료가 버티는 힘)이 분자</strong> 여야 한다. 이 한 가지로 뒤집힌 보기 셋이 걸러진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">안전율의 여러 표현</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">$\\text{안전율} = \\dfrac{\\text{기초강도}}{\\text{허용응력}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">가장 기본</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">$\\text{안전율} = \\dfrac{\\text{극한강도}}{\\text{최대 설계응력}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">$\\text{안전율} = \\dfrac{\\text{파단하중}}{\\text{최대 사용하중}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">$\\text{안전율} = \\dfrac{\\text{극한하중}}{\\text{정격하중}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_mac_t007": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "선반의 방호장치", "front": "선반의 방호장치는?", "back": "<ul><li><strong>칩 브레이커</strong>다. 바이트에 홈이나 턱을 만들어 칩이 길게 이어지지 못하고 짧게 부러지도록 한다. 길게 감긴 칩은 뜨겁고 날카로워 손을 베거나 몸에 감긴다.</li><li><strong>쉴드(실드)</strong>다. 투명한 가림막으로 칩과 절삭유가 튀는 것을 막는다.</li><li><strong>슬라이딩</strong>은 미끄러져 움직이는 동작을 가리키는 말이지 방호장치가 아니다.</li></ul><p><strong>◈ 암기</strong> <u>튀는 것을 막으면 쉴드</u>. · <u>쉴드 · 척 커버 · 칩 브레이커 · 브레이크</u>.</p><p>네 가지. <u>칩 브레이커(칩을 끊음) · 척 커버(척을 덮음) · 실드(칩 비산 방지) · 브레이크(급정지)</u>. 여기에 가늘고 긴 공작물을 받치는 <u>방진구</u>가 더해진다.<br px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>소선(wire)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 가는 강선</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">여러 가닥이 모여 스트랜드가 된다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>스트랜드(strand)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>소선을 꼬아 만든 다발</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">여러 다발이 심강을 감싼다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>심강(core)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가운데 심</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">섬유심 · 강심</td></tr></tbody></table></div>", "nq": 1}, "card_mac_t124": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "프레스·전단기", "mid": "프레스의 분류", "front": "프레스의 분류는?", "back": "<ul><li><strong>액압 프레스</strong>는 <strong>동력의 종류</strong>로 나눈 것이다. 슬라이드 운동기구에 따른 분류가 아니다.</li><li><strong>푸트(foot) 프레스</strong>는 <strong>발로 밟아 움직이는 수동 프레스</strong>다. 동력프레스가 아니다.</li></ul><p><strong>◈ 암기</strong> <u>액압은 동력에 따른 분류</u>. · <u>푸트 프레스는 수동</u>.</p><p><strong>「무엇이 슬라이드를 움직이는가(크랭크·너클·마찰)」와 「무엇으로 힘을 내는가(기계·액압)」</strong>는 다른 물음이다. <strong>액압만 힘의 종류</strong>를 가리킨다.<br><strong>「푸트(발)」라는 이름 자체가 사람의 힘</strong>을 가리킨다. 동력프레스는 <strong>크랭크 · 토글(너클) · 마찰 · 액압</strong>처럼 <strong>기계나 유체가 힘을 낸다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">프레스의 분류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>슬라이드 운동기구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>크랭크 · 너클 · 마찰 · 캠 · 링크 · 나사 프레스</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>동력의 종류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기계 프레스 · 액압(유압·수압) 프레스</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>클러치의 종류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>확동식 · 마찰식</u></td></tr></tbody></table></div>", "nq": 2}, "card_mac_t135": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "프레스·전단기", "mid": "급정지장치의 조작부", "front": "급정지장치의 조작부는?", "back": "<ul><li>무릎조작식은 <strong>밑면에서 0.6 [m] 이내</strong>다. 0.8 [m]가 아니다.</li><li><strong>「어깨조작식」</strong>은 없다. 셋은 <strong>손 · 복부 · 무릎</strong> 조작식이다.</li><li><strong>밑면에서 0.8 [m] 이상 1.1 [m] 이내</strong>다. <strong>배 높이</strong>에 맞춘 값이다.</li></ul><p><strong>◈ 암기</strong> <u>손 1.8 · 복부 0.8~1.1 · 무릎 0.6</u>. · <u>손 · 복부 · 무릎</u> 셋.</p><p><strong>손(1.8) → 배(0.8 ~ 1.1) → 무릎(0.6)</strong> 순으로 <strong>몸의 높이를 따라 내려간다</strong>. <strong>복부의 아래끝 0.8을 무릎 값으로 옮겨 놓는 것</strong>이 이 문항의 함정이다.<br>셋이 <strong>손(1.8) → 배(0.8 ~ 1.1) → 무릎(0.6)</strong>으로 <strong>몸의 높이를 따라 내려간다</strong>. <strong>말려 들어가는 순간 어느 부위로든 칠 수 있게</strong> 세 높이에 둔 것이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">롤러기 급정지장치 조작부의 위치 (규칙 제148조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">설치 위치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>손 조작식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>밑면에서 1.8 [m] 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>복부 조작식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>밑면에서 0.8 [m] 이상 1.1 [m] 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무릎 조작식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>밑면에서 0.6 [m] 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.8 [m]가 아니다</u></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제148조</em></p>", "nq": 3}, "card_ele_t135": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "누전차단기의 정격감도전류", "front": "누전차단기의 정격감도전류의 식은?", "back": "<ul><li><strong>30 [mA], 0.1초</strong>다. 감전의 위험한계는 <strong>전류 × 시간 = 50 [mA·s]</strong> 인데, $30 \\times 0.1 = 3$ [mA·s]로 넉넉히 아래에 든다. 60 [mA] 이상은 <strong>심실세동 영역</strong>에 들어 위험하다.</li><li><strong>감전을 막으려면 정격감도전류가 30 [mA] 이하</strong>라야 한다. <strong>값이 클수록 사람이 다친 뒤에야 끊긴다</strong>.</li><li><strong>30mA 이하, 0.03초 이내</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>일반 30, 물기 15</u>. · <u>감전방지는 30 [mA]</u>.</p><p><strong>일반 장소 30 [mA] 이하, 물기 있는 장소 15 [mA] 이하</strong>이고 <strong>동작시간은 어느 쪽이든 0.03초 이내</strong>다. 이 문항은 보기의 시간이 모두 같으므로 <strong>전류 하나로 갈린다</strong>.<br><strong>보기 넷이 동작시간은 모두 같고 감도전류만 다르다</strong> — <strong>사람을 지키는 값은 가장 작은 30 [mA]</strong>다. <strong>그보다 크면 사람이 감전된 뒤에야 끊긴다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">통전전류의 크기와 인체 반응</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">전류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">몸에 일어나는 일</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>약 1 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>최소감지전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">찌릿함을 느낀다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>7 ~ 8 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>고통한계전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">견딜 수는 있다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>10 ~ 15 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가수전류(이탈전류)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>스스로 손을 뗄 수 있는 한계</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>20 ~ 50 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불수전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>근육이 굳어 손을 못 뗀다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>50 [mA] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>심실세동전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>목숨이 위태롭다</u></td></tr></tbody></table></div>", "nq": 3}, "card_ele_t136": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "허용접촉전압의 종별", "front": "허용접촉전압의 종별은?", "back": "<ul><li><strong>제2종, 25 [V] 이하</strong>다. <strong>몸이 늘 금속에 닿아 있는</strong> 상태다.</li><li><strong>제2종, 25 [V] 이하</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>2.5 · 25 · 50 · 무제한</u>.</p><p>네 값이 <strong>2.5 → 25 → 50 → 무제한</strong>으로 <strong>젖은 정도와 닿는 정도가 덜할수록 커진다</strong>. 네 종별이 보기 넷과 하나씩 대응하도록 짜여 있다.<br><strong>2.5 → 25 → 50 → 무제한</strong>으로 <strong>젖은 정도와 닿는 정도가 덜할수록 커진다</strong>. <strong>「대부분 젖음」은 제1종, 「현저히 젖음」은 제2종</strong>이라는 정도 차이에 유의한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">허용접촉전압의 종별</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종별</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">어떤 상태</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">허용접촉전압</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제1종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>인체의 대부분이 물에 젖어 있는 상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>2.5 [V] 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제2종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>금속제 기계장치나 구조물에 몸의 일부가 늘 닿아 있는 상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>25 [V] 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제3종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>통상의 인체 상태로 접촉전압이 가해지면 위험성이 높은 상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>50 [V] 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제4종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위험성이 낮거나 접촉전압이 가해질 우려가 없는 경우</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>제한 없음</u></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t137": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "통전전류의 크기와 인체 반응", "front": "통전전류의 크기와 인체 반응은?", "back": "<strong>7 ~ 8 [mA]</strong>다. <strong>아프지만 견딜 수는 있는</strong> 정도의 전류다.<p><strong>◈ 암기</strong> <u>고통한계는 7 ~ 8 [mA]</u>.</p><p>네 보기가 <strong>최소감지(1) → 고통한계(7~8) → 가수(10~15) → 불수(20~50)</strong>를 하나씩 짚고 있다. <strong>「아프다」는 고통한계, 「못 뗀다」는 불수</strong>로 갈린다.</p>", "nq": 1}, "card_ele_t013": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기설비", "mid": "정전전로에서의 전기작업", "front": "정전전로에서의 전기작업은?", "back": "<ul><li><strong>검전기</strong>다. 전기가 살아 있는지(충전 여부)를 확인하는 기구이며, 정전작업 순서에서 <strong>잔류전하 방전 뒤</strong>에 쓴다.</li><li><strong>실수로 송전되거나 다른 선과 닿아 전기가 들어와도</strong> 단락접지가 전류를 대지로 흘려 작업자를 지킨다.</li><li>순서가 거꾸로다. <strong>전원을 먼저 차단한 뒤 단로기를 개방</strong>한다. 부하가 걸린 채 단로기를 열면 <strong>아크가 크게 튀어</strong> 화상과 화재로 이어진다.</li></ul><p><strong>◈ 암기</strong> 정전작업 5단계 — <u>차단 · 잠금표찰 · 방전 · 검전 · 단락접지</u>. · <u>차단이 먼저, 단로기 개방이 나중</u>.</p><p>안전보건규칙 제319조(정전전로에서의 전기작업). 정전작업 순서는 <u>① 전로 차단 → ② 개폐기 잠금과 표찰 부착 → ③ 잔류전하 방전 → ④ 검전기로 충전 여부 확인 → ⑤ 단락접지</u>다. 검전기는 반드시 <u>정격 전압에 맞는 것</u>을 쓰고, 사용 전후에 알려진 충전부에서 동작을 확인한다.<br>정전작업은 「<strong>전기가 다시 올 수 있다</strong>」는 전제 위에 선다. 그래서 잠금·표찰로 막고, 그래도 들어올 경우를 대비해 단락접지를 건다.</p><div style=\"margin:12px 0 2px;font-weight:700\">정전작업의 절차 (규칙 제319조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">순서</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>①</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>모든 전원을 도면·배선도로 확인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">빠뜨린 전원이 없게</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>②</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전원을 차단</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>차단기로 먼저 끊는다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>③</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>각 단로기를 개방하고 확인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>부하 차단 뒤에 연다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>④</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>잠금장치와 꼬리표 부착</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">남이 못 넣게</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>⑤</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>잔류전하 방전</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">콘덴서·케이블</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>⑥</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>검전기로 충전 여부 확인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">눈으로 믿지 않는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>⑦</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>단락 접지기구로 단락 접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">그래도 들어올 경우를 대비</td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제319조</em></p>", "nq": 5}, "card_ele_t138": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "누전에 의한 감전의 방지", "front": "누전에 의한 감전의 방지는?", "back": "<strong>배선용차단기(MCCB)</strong>는 <strong>과전류</strong>를 끊는 장치다. 누전에는 <strong>누전차단기(ELB)</strong>를 써야 한다.<p><strong>◈ 암기</strong> <u>누전은 ELB, 과전류는 MCCB</u>.</p><p><strong>MCCB는 「많이 흐르면」, ELB는 「새면」</strong> 끊는다. <strong>누전 전류는 수십 [mA]에 지나지 않아 MCCB 로는 감지되지 않는다</strong> — 그래서 서로 대신하지 못한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">누전에 의한 감전 방지대책</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대책</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원리</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>보호접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>새는 전류를 땅으로 보낸다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>누전차단기(ELB)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>새면 곧바로 끊는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>MCCB가 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전전압(30 [V] 이하)의 사용</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>애초에 위험한 전압을 쓰지 않는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>비접지식 전로의 채용</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>돌아갈 길을 없앤다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>이중절연기기의 사용</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>절연을 두 겹으로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t139": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "저압 방폭구조 배선의 보호접지", "front": "저압 방폭구조 배선의 보호접지는?", "back": "<strong>전선관이 최대지락전류를 안전하게 흘릴 수 있으면 접지선으로 쓸 수</strong> 있다.<p><strong>◈ 암기</strong> <u>접지선은 녹색</u>.</p><p><strong>접지선의 색은 어디서나 녹색(또는 녹황 줄무늬)</strong>이다. <strong>흰색은 중성선, 검정색은 상선</strong>이므로 보기 ③은 곧바로 걸러진다.</p>", "nq": 1}, "card_ele_t140": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "", "mid": "폭발 위험분위기의 생성방지", "front": "폭발 위험분위기의 생성방지는?", "back": "<strong>옥내에 가스를 머물게 하는</strong> 것은 위험분위기를 만드는 짓이다. 셋은 <strong>새지 않게 · 나오지 않게 · 고이지 않게</strong>다.<p><strong>◈ 암기</strong> <u>새지 않게 · 나오지 않게 · 고이지 않게</u>.</p><p>세 대책이 <strong>새지 않게(누설) → 나오지 않게(방출) → 고이지 않게(체류)</strong>로 이어진다. 보기 ④는 <strong>셋째를 그대로 뒤집어</strong> 놓았다.</p>", "nq": 1}, "card_ele_t141": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "", "mid": "전압의 구분", "front": "전압의 구분은?", "back": "<ul><li><strong>저압은 교류 1,000 [V] 이하, 직류 1,500 [V] 이하</strong>다.</li><li><strong>특고압은 교류·직류 모두 7,000 [V] 초과</strong>다. 이 값만은 개정 전후로 바뀌지 않았다.</li><li>저압은 <strong>직류 1.5kV 이하</strong>다. <strong>「1kV 이하」는 교류 쪽</strong> 값이다.</li></ul><p><strong>◈ 암기</strong> <u>교류 1,000 · 직류 1,500 · 특고압 7,000</u>. · <u>특고압은 교직 모두 7,000 [V] 초과</u>.</p><p>세 값만 잡으면 된다 — <strong>교류 1,000 · 직류 1,500 · 공통 7,000</strong>. <strong>저압과 고압의 경계만 교직이 다르고, 특고압 경계는 둘 다 7,000 [V]</strong>로 같다.<br><strong>특고압의 경계 7,000 [V]는 교직 공통이며 개정에도 그대로</strong>다. 그래서 <strong>개정 전 문항이라도 보기 ③은 지금도 맞는다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">전압의 구분 (KEC)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">교류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">직류</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>저압</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1,000 [V] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1,500 [V] 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>고압</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1,000 [V] 초과 7,000 [V] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1,500 [V] 초과 7,000 [V] 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>특고압</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>7,000 [V] 초과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>7,000 [V] 초과</u></td></tr></tbody></table></div><p><em>근거 — 한국전기설비규정(KEC)</em></p>", "nq": 4}, "card_ele_t142": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "위험장소의 저압 옥내배선", "front": "위험장소의 저압 옥내배선은?", "back": "<strong>금속관 공사</strong>다. 폭연성 분진 장소에서는 <strong>금속관 공사 또는 케이블 공사(캡타이어 케이블은 제외)</strong>만 할 수 있다.<p><strong>◈ 암기</strong> <u>폭연성 분진은 금속관</u>.</p><p><strong>위험할수록 단단한 금속관</strong>이다. <strong>합성수지관은 가연성 분진까지만</strong>, <strong>폭연성 분진에는 금속관과 케이블뿐</strong>이다. <strong>캡타이어는 움직이는 곳에 쓰는 유연 케이블</strong>이라 제외된다.</p><div style=\"margin:12px 0 2px;font-weight:700\">위험장소별 저압 옥내배선 공사</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">가능한 공사</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>폭연성 분진 · 화약류 분말</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>금속관 공사 · 케이블 공사(캡타이어 제외)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 엄하다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>가연성 분진</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>금속관 · 케이블 · 합성수지관 공사</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>가연성 가스</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>금속관 · 케이블 공사</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t143": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "스파크에 의한 화재의 방지", "front": "스파크에 의한 화재의 방지는?", "back": "<ul><li>유입 개폐기 둘레에 세우는 것은 <strong>내수벽이 아니라 내화벽</strong>이다. 물이 아니라 <strong>불을 막아야</strong> 한다.</li><li><strong>포장 퓨즈(통형 퓨즈)</strong>를 써야 한다. <strong>비포장 퓨즈는 끊어질 때 불꽃이 그대로 튄다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>유입 개폐기 둘레에는 내화벽</u>. · <u>포장 퓨즈를 쓴다</u>.</p><p>유입 개폐기 안에는 <strong>기름(절연유)</strong>이 들어 있어 <strong>불이 나면 크게 번진다</strong>. 그래서 <strong>내화벽</strong>을 두른다. <strong>「내수」와 「내화」</strong>한 글자를 바꿔 놓은 것이 이 문항의 함정이다.<br>대책이 모두 <strong>불꽃을 가두거나 · 애초에 나지 않게</strong> 한다 — <strong>방폭형 · 불연성 상자 · 포장 퓨즈 · 접촉저항 관리</strong>. <strong>「비포장」은 가두지 않겠다</strong>는 말이라 정반대다.</p>", "nq": 3}, "card_ele_t125": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "내압(耐壓) 방폭구조", "front": "내압(耐壓) 방폭구조는?", "back": "<ul><li><strong>내압(耐壓) 방폭구조 d</strong>다. <strong>안에서 터져도 그 압력을 견디고 불꽃을 밖으로 내보내지 않는다</strong>.</li><li><strong>내압(耐壓) 방폭구조 d</strong>다. <strong>안에서 터져도 견디고 밖으로 불을 내보내지 않는다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>터져도 견디고 새지 않으면 내압</u>. · <u>안에서 터져도 밖으로 안 번지면 내압</u>.</p><p><strong>내압의 「내」는 안이 아니라 견딜 내(耐)</strong>다. 핵심 값은 <strong>최대안전틈새(MESG)</strong>로, <strong>틈이 좁고 길수록 화염이 식어 밖으로 나가지 못한다</strong>.<br><strong>내압의 「내」는 견딜 내(耐)</strong>다. 핵심 값은 <strong>최대안전틈새(MESG)</strong>로, <strong>틈이 좁고 길수록 화염이 식어 밖으로 나가지 못한다</strong>. <strong>폭발등급 ⅡA · ⅡB · ⅡC</strong>는 이 값으로 나눈다.</p><div style=\"margin:12px 0 2px;font-weight:700\">방폭구조의 원리 비교</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구조</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기호</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원리</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>내압</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>d</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안에서 터져도 견디고 밖으로 불을 내보내지 않는다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>압력</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>p</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>깨끗한 공기를 밀어 넣어 가스가 못 들어오게 한다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>유입</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>o</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전기 부분을 기름에 담근다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>본질안전</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>ia · ib</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>에너지 자체를 점화 아래로 낮춘다</u></td></tr></tbody></table></div>", "nq": 3}, "card_ele_t144": {"kind": "공식형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기 일반", "mid": "쿨롱의 법칙", "front": "쿨롱의 법칙의 식은?", "back": "$F = \\dfrac{1}{4 \\pi \\varepsilon_{0}} \\times \\dfrac{Q_{1} Q_{2}}{r^{2}} = 9 \\times 10^{9} \\times \\dfrac{1 \\times 1}{1^{2}} = 9 \\times 10^{9}$ [N]이다.<p><strong>◈ 암기</strong> $F = 9 \\times 10^{9} \\times \\dfrac{Q_{1} Q_{2}}{r^{2}}$.</p><p>$\\dfrac{1}{4 \\pi \\varepsilon_{0}} = 9 \\times 10^{9}$라는 값을 통째로 외워 둔다. <strong>1 [C]은 실제로는 엄청나게 큰 전하량</strong>이라 이런 터무니없는 힘이 나온다 — <strong>정전기가 왜 위험한지</strong>를 보여 준다.</p>", "nq": 1}, "card_ele_t145": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기설비", "mid": "누전경보기의 설치", "front": "누전경보기의 설치는?", "back": "<strong>차단기구를 갖춘 수신기</strong>다. 가연성 증기가 있는 곳에서는 <strong>알리는 데 그치지 않고 곧바로 전원을 끊어야</strong> 한다.<p><strong>◈ 암기</strong> <u>가연성 증기가 있으면 차단기구까지</u>.</p><p>일반 장소에서는 <strong>알리는 것(경보)</strong>으로 충분하지만, <strong>불붙을 것이 이미 깔려 있는 곳에서는 끊어야(차단)</strong>한다. <strong>위험이 클수록 대책이 한 단계 더 나아간다</strong>는 일관된 얼개다.</p>", "nq": 1}, "card_ele_t146": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기설비", "mid": "감전에 의한 피부의 병변", "front": "감전에 의한 피부의 병변은?", "back": "<strong>피부의 광성변화</strong>다. <strong>녹은 금속 알갱이가 피부에 박혀 광택을 띤 흉터</strong>를 남긴다.<p><strong>◈ 암기</strong> <u>금속이 박혀 번들거리면 광성변화</u>.</p><p><strong>「광성(光性)」이라는 말이 곧 「광택이 난다」</strong>는 뜻이다. <strong>금속이 녹아 박혔으니 번들거린다</strong>는 이름 그대로의 현상이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">감전에 의한 피부 상해</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7 이 가장 많다</u>.</p><p><strong>충전부에 가까이 갈수록 사고가 많다</strong>는 것이 이 통계의 요지다. 그래서 <strong>정전작업 절차(차단 → 잠금·표시 → 방전 → 검전 → 단락접지)</strong>가 그토록 까다롭게 정해져 있다.</p>", "nq": 1}, "card_ele_t067": {"kind": "공식형", "fq": 3, "subject": "전기위험방지기술", "chapter": "전기화재", "mid": "피뢰기의 보호여유도", "front": "피뢰기의 보호여유도의 식은?", "back": "<ul><li>$\\text{여유도} = \\dfrac{\\text{충격절연강도} - \\text{제한전압}}{\\text{제한전압}} \\times 100$이다. $( 1 {,} 050 - 752 ) / 752 \\times 100 = 298 / 752 \\times 100 \\fallingdotseq 39.6 \\fallingdotseq 40$ [%]다.</li><li>$\\text{여유도} = \\dfrac{\\text{충격절연강도} - \\text{제한전압}}{\\text{제한전압}} \\times 100 = \\dfrac{1 {,} 000 - 800}{800} \\times 100 = 25$ [%]다.</li><li>$\\text{여유도} = \\dfrac{\\text{충격절연강도} - \\text{제한전압}}{\\text{제한전압}} \\times 100$이므로 $0.33 = \\dfrac{1 {,} 000 - V}{V}$다. $1.33 V = 1 {,} 000$에서 $V \\fallingdotseq 752$ [kV]다.</li></ul><p><strong>◈ 암기</strong> <u>(BIL − 제한전압) ÷ 제한전압</u>. · $\\text{제한전압} = \\mathrm{BIL} \\div ( 1 + \\text{여유도} )$.</p><p><strong>분모가 제한전압</strong>이라는 점이 갈림길이다. 보호여유도는 실무에서 <strong>20 [%] 이상</strong>을 확보하는 것이 보통이다.<br><strong>분모가 제한전압</strong>이라는 점이 갈림길이다. 충격절연강도로 나누면 20 [%]가 나와 오답이 된다. 실무에서는 <strong>20 [%] 이상</strong>을 확보한다.</p>", "nq": 3}, "card_ele_t148": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "접지", "mid": "정전작업 전의 조치", "front": "정전작업 전의 조치는?", "back": "<strong>보호구 수리</strong>는 평소에 해 두어야 할 일이다. <strong>정전작업 직전의 절차</strong>가 아니다.<p><strong>◈ 암기</strong> <u>끊고 · 잠그고 · 빼고 · 확인하고 · 접지</u>.</p><p>다섯 절차가 <strong>끊고 → 잠그고 → 빼고 → 확인하고 → 접지한다</strong>로 이어진다. <strong>보호구를 「수리」한다는 것은 그 보호구가 이미 성한 것이 아니라는 뜻</strong>이라 작업 직전에 할 일이 아니다.</p><div style=\"margin:12px 0 2px;font-weight:700\">정전작업 전의 절차</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">순서</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text  안전보건규칙 제319조</em></p>", "nq": 1}, "card_ele_t149": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "접지", "mid": "저압 방폭전기의 배관", "front": "저압 방폭전기의 배관은?", "back": "유효 접속면의 깊이는 <strong>5산 이상(약 8 [mm] 이상)</strong>이라야 한다. <strong>5 [mm] 로는 화염이 새어 나갈</strong> 수 있다.<p><strong>◈ 암기</strong> <u>나사 접속은 5산 이상</u>.</p><p>나사 접속부의 깊이는 <strong>내압 방폭구조의 화염일주 한계</strong>와 이어져 있다. <strong>틈이 좁고 길수록 화염이 식으므로</strong> 나사산을 여러 개 물려야 한다.</p>", "nq": 1}, "card_ele_t150": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "정전기", "mid": "정전기 재해방지를 위한 유속 제한", "front": "정전기 재해방지를 위한 유속 제한은?", "back": "<ul><li>이황화탄소처럼 위험한 것은 <strong>1 [m/s] 이하</strong>로 제한한다. 5 [m/s]는 너무 빠르다.</li><li><strong>도전성 위험물은 7 [m/s] 이하</strong>가 맞다. 나머지 셋은 값이 어긋난다.</li></ul><p><strong>◈ 암기</strong> <u>이황화탄소는 1 [m/s] 이하</u>. · <u>도전성만 7 [m/s], 나머지는 1 [m/s]</u>.</p><p><strong>빠를수록 정전기가 많이 생긴다</strong>. 그래서 <strong>전하가 잘 빠지는 도전성은 7, 안 빠지는 것은 느리게, 가장 위험한 것은 1 [m/s]</strong>로 조인다. <strong>이황화탄소는 최소발화에너지 0.009 [mJ]</strong>로 가장 낮다.<br><strong>전하가 잘 빠지는 도전성만 7 [m/s]로 넉넉하고, 나머지는 1 [m/s] 안팎</strong>으로 조인다. <strong>빠를수록 정전기가 많이 생긴다</strong>는 것이 이 규정의 바탕이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">위험물 주입 시의 유속 제한</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대상</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">유속</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>저항률 </u>$10^{10}$<u> [Ω·cm] 미만의 도전성 위험물</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>7 [m/s] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">전하가 잘 빠진다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>저항률 </u>$10^{10}$<u> [Ω·cm] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>관 내경에 따라</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">0.05 [m] 면 3.5 [m/s] 이하</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물이나 기체를 혼합하는 비수용성 위험물</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 [m/s] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>에테르 · 이황화탄소 등 위험성이 높은 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1 [m/s] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>5 [m/s]가 아니다</u></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t133": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "정전기", "mid": "정전기 발생량의 영향 인자", "front": "정전기 발생량의 영향 인자는?", "back": "<ul><li><strong>되풀이할수록 오히려 작아진다</strong>. 처음 접촉·분리할 때가 가장 크고, 여러 번 하면 <strong>표면 상태가 안정되어</strong> 발생량이 줄어든다.</li><li><strong>표면이 오염되면 발생량이 커진다</strong>. 나머지 셋은 모두 방향이 반대다.</li><li><strong>접촉시간</strong>은 다섯 인자에 들지 않는다. 다섯은 <strong>물체의 특성 · 표면상태 · 이력 · 접촉면적과 압력 · 분리속도(분리력)</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>되풀이하면 오히려 줄어든다</u>. · <u>오염될수록 크다</u>.</p><p>다섯 인자 가운데 <strong>「이력」만 되풀이할수록 줄어드는</strong> 쪽이다. 나머지 넷은 모두 <strong>「~할수록 크다」</strong> 라서, 이 하나만 기억하면 어느 보기를 물어도 갈린다.<br>다섯 인자 가운데 <strong>「이력」만 되풀이할수록 줄어들고 나머지는 모두 「~할수록 크다」</strong>이다. 이 규칙 하나 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>분리 속도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>빠를수록 크다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 4}, "card_chm_t035": {"kind": "공식형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "탄화칼슘(카바이드)과 물의 반응", "front": "탄화칼슘(카바이드)과 물의 반응의 식은?", "back": "<ul><li>$\\mathrm{CaC}_{2} + 2 H_{2} O \\rightarrow \\mathrm{Ca} ( OH )_{2} + C_{2} H_{2}$로 <strong>수산화칼슘과 아세틸렌</strong>이 나온다. 아세틸렌은 폭발범위가 <strong>2.5~81 [%]</strong>로 대단히 넓어 곧바로 폭발로 이어진다.</li><li><strong>탄화칼슘(CaC₂, 카바이드)</strong>이다. $\\mathrm{CaC}_{2} + 2 H_{2} O \\rightarrow \\mathrm{Ca} ( OH )_{2} + C_{2} H_{2}$로 <strong>아세틸렌</strong>이 난다.</li><li><strong>아세틸렌</strong>이다. $\\mathrm{CaC}_{2} + 2 H_{2} O \\rightarrow \\mathrm{Ca} ( OH )_{2} + C_{2} H_{2}$다.</li></ul><p><strong>◈ 암기</strong> <u>카바이드 + 물 → 아세틸렌</u>.</p><p>반응이 발열이라 아세틸렌이 곧바로 불붙기 쉽다. 그래서 카바이드는 <strong>밀폐 용기에 넣어 건조한 곳</strong>에 둔다.<br><strong>탄화물 가운데 「칼슘」이면 아세틸렌, 「알루미늄」이면 메탄</strong>이다. <strong>금속 그 자체(Na · K · Mg · Al)는 모두 수소</strong>를 낸다. 두 갈래로 나누어 잡아 둔다.</p><div style=\"margin:12px 0 2px;font-weight:700\">금수성 물질과 물의 반응 생성물</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">물질</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">생성 가스</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">반응식</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7 "건설공사 안전개요", "mid": "무너짐의 방지", "front": "무너짐의 방지는?", "back": "버팀줄만으로 세울 때는 <strong>3개 이상</strong>이라야 한다. 2개로는 <strong>한 방향으로 넘어가는 것을 막지 못한다</strong>.<p><strong>◈ 암기</strong> <u>버팀대도 버팀줄도 3개 이상</u>.</p><p><strong>버팀대든 버팀줄이든 3개 이상</strong>이다. <strong>세 방향으로 잡아야 어느 쪽으로도 넘어가지 않는다</strong> — 삼각대가 흔들리지 않는 것과 같은 이치다.</p><div style=\"margin:12px 0 2px;font-weight:700\">항타기·항발기의 무너짐 방지 (규칙 제209조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>연약한 지반에는 깔판·깔목 등을 사용해 침하를 막을 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>시설이나 가설물 위에 설치할 때는 그 내력을 확인하고 부족하면 보강할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>각부나 가대가 미끄러질 우려가 있으면 말뚝이나 쐐기로 고정할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>버팀대만으로 상단을 안정시킬 때는 버팀대를 3개 이상으로 할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>버팀줄만으로 상단을 안정시킬 때는 버팀줄을 3개 이상으로 하고 같은 간격으로 배치할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>2개가 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>평형추는 이동하지 않도록 가대에 견고히 부착할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제209조</em></p>", "nq": 1}}};</script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const STUDY=MODE==='study';
const KEY=(STUDY?'safestudy_':'safecbt_')+D.round;
let S={i:0,ans:{},open:{},started:STUDY?1:0,elapsed:0,done:false};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
if(!S.open)S.open={};
if(STUDY)S.started=1;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function kx(el){if(window.renderMathInElement)renderMathInElement(el,{delimiters:[
 {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}

const MARK=['①','②','③','④'];
const LV={1:['#10b981','쉬움'],2:['#f59e0b','보통'],3:['#ef4444','어려움']};

function fmt(s){const m=Math.floor(s/60),x=s%60;
 return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+':'+String(x).padStart(2,'0');}

let tick=null;
function startTimer(){
 if(STUDY)return;
 clearInterval(tick);tick=setInterval(()=>{
  if(S.done)return;
  S.elapsed++;const left=D.limit-S.elapsed;
  const t=$('#timer'); if(!t)return;
  t.textContent=left>0?fmt(left):'00:00:00';
  t.classList.toggle('warn',left<600);
  if(left<=0)submit();
  if(S.elapsed%10===0)save();
 },1000);}

function intro(){
 $('#app').innerHTML=`<div class="wrap intro">
  <h2>${D.title}</h2>
  <p>6과목 120문항 · 시험시간 3시간</p>
  <p>합격 기준 — 과목당 40점 이상, 전 과목 평균 60점 이상</p>
  <p style="margin-top:14px;font-size:13px">답만 고르고 끝에 제출합니다.
   해설과 암기카드는 채점한 뒤에 열립니다.</p>
  <button class="big" id="go">시험 시작</button>
  ${Object.keys(S.ans).length?'<div style="margin-top:12px;font-size:13px;color:#64748b">이어서 풀면 지난번 답안이 그대로 살아 있습니다</div>':''}
 </div>`;
 $('#go').onclick=()=>{S.started=1;save();render();startTimer();};
}

// 해설이 열려 있는가 — 직접 여닫은 적이 있으면 그 뜻을 따른다
function solOpen(q){
 if(S.open[q.n]!==undefined)return S.open[q.n];
 return S.done||(STUDY&&!!S.ans[q.n]);
}

function qHTML(q){
 const a=S.ans[q.n], graded=(STUDY&&a)||S.done, show=STUDY||S.done;
 let h=`<div class="wrap"><div class="qh"><span class="qno">${String(q.n).padStart(3,'0')}</span>
  <span class="tag" style="background:${LV[q.lv][0]}">난이도 ${q.lv}·${LV[q.lv][1]}</span>
  <span class="tag" style="background:#6366f1">${q.kind}</span>
  <span class="tag" style="background:#f59e0b">빈출 ${'★'.repeat(q.fq)+'☆'.repeat(3-q.fq)}</span>
  <span class="subj">제${q.s}과목 ${D.subj[q.s-1]}</span>`;
 if(show){
   h+=`<span class="acts">
    <button class="mini${solOpen(q)?' on':''}" id="tsol">📖 해설 ${solOpen(q)?'닫기':'보기'}</button>
    ${q.card&&D.cards[q.card]?'<button class="mini cd" id="tcard">🃏 암기카드</button>':''}
   </span>`;
 }
 h+=`</div><div class="stem">${q.t}</div>`;
 if(q.cond)h+=`<div class="cond">${q.cond}</div>`;
 if(q.img)h+=`<img class="stemimg" src="img/${q.img}">`;
 for(let k=0;k<4;k++){
   let cls='opt';
   if(a===k+1)cls+=' sel';
   if(graded){ if(k+1===q.a)cls='opt right'; else if(a===k+1)cls='opt wrong'; }
   h+=`<button class="${cls}" data-k="${k+1}"><span class="n">${MARK[k]}</span><span>${q.c[k]}</span></button>`;
 }
 if(graded){
   h+= a===q.a ? `<div class="vline o">정답입니다 · 정답 ${q.a}번</div>`
              : `<div class="vline x">${a?'틀렸습니다 · 고른 답 '+a+'번 · ':'미응답 · '}정답 ${q.a}번</div>`;
 }
 if(show&&solOpen(q)){
   h+=`<div class="sol"><div class="lbl">해설</div><div>${q.sol}</div>`;
   if(q.w)h+=`<div class="lbl">오답 분석</div><div>${q.w}</div>`;
   if(q.pt)h+=`<div class="lbl g">관련 개념 · 암기</div><div class="box">${q.pt}</div>`;
   if(q.law)h+=q.law;
   h+=`</div>`;
 }
 return h+'</div>';
}

function render(){
 if(!S.started){intro();return;}
 if(!STUDY&&S.done&&S.i<0){result();return;}
 const q=D.q[S.i];
 $('#app').innerHTML=qHTML(q);
 $$('.opt').forEach(b=>b.onclick=()=>{
   S.ans[q.n]=+b.dataset.k;
   if(STUDY&&S.open[q.n]===undefined)S.open[q.n]=true;
   save();
   if(STUDY||S.done){render();}
   else{$$('.opt').forEach(x=>x.classList.toggle('sel',x===b));paint();}
 });
 const ts=$('#tsol'); if(ts)ts.onclick=()=>{S.open[q.n]=!solOpen(q);save();render();};
 const tc=$('#tcard'); if(tc)tc.onclick=()=>openCard(q.card);
 kx($('#app'));
 stat();
 $('#prev').disabled=S.i===0; $('#next').disabled=S.i===119;
 paint();
 window.scrollTo(0,0);
}

function stat(){
 const n=Object.keys(S.ans).length;
 if(STUDY){
   let ok=0; D.q.forEach(q=>{if(S.ans[q.n]===q.a)ok++;});
   $('#prog').innerHTML=`<b>${S.i+1}</b> / 120 · 푼 문항 <b>${n}</b> · 맞힘 <b>${ok}</b>`;
   const r=$('#rate');
   if(r)r.textContent=n?`정답률 ${Math.round(ok/n*100)}%`:'정답률 —';
 }else{
   $('#prog').innerHTML=S.done?`채점 완료`:`<b>${S.i+1}</b> / 120 · 푸는 중 <b>${n}</b>`;
 }
}

/* 암기카드 팝업 */
let mflip=false;
function openCard(id){
 const c=D.cards[id]; if(!c)return;
 mflip=false;
 $('#mbody').innerHTML=`<button class="mx" id="mx">✕</button>
  <div class="mcard" id="mcard">
   <div class="mface">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span class="stars">${'★'.repeat(c.fq)+'☆'.repeat(3-c.fq)}</span>
     <span>${c.subject}${c.chapter?' · '+c.chapter:''}</span>
     <span class="mcid">${id}</span></div>
    <div class="mq">${c.front}</div>
    <div class="mhint">카드를 누르면 뒤집힙니다 · Esc 닫기</div>
   </div>
   <div class="mface back">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span>${c.mid}</span><span class="mcid">${id}</span></div>
    <div class="ma">${c.back}</div>
    <div class="mfoot"><span>이 개념을 묻는 문항 ${c.nq}개</span>
     <a href="../_암기카드.html#${id}" target="_blank">카드 전체 보기 →</a></div>
   </div>
  </div>`;
 $('#modal').classList.add('on');
 kx($('#mbody'));
 fitCard(); setTimeout(fitCard,260);
 $('#mcard').onclick=()=>{mflip=!mflip;$('#mcard').classList.toggle('flip',mflip);};
 $('#mx').onclick=e=>{e.stopPropagation();closeCard();};
}
function fitCard(){
 const mc=$('#mcard'); if(!mc)return;
 mc.style.height='120px';
 const h=Math.max(...[...mc.querySelectorAll('.mface')].map(f=>f.scrollHeight));
 mc.style.height=Math.min(window.innerHeight*0.78,Math.max(300,h+4))+'px';
}
function closeCard(){$('#modal').classList.remove('on');}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeCard();};
window.addEventListener('resize',()=>{if($('#modal').classList.contains('on'))fitCard();});

function paint(){
 $$('.pg').forEach(b=>{
   const n=+b.dataset.n, q=D.q[n-1];
   const marked=STUDY?!!S.ans[n]:S.done;
   let c='pg';
   if(marked&&(STUDY||S.done))c+=(S.ans[n]===q.a?' ok':' no');
   else if(S.ans[n])c+=' done';
   if(n-1===S.i)c+=' cur';
   b.className=c;
 });
}

function submit(){
 if(STUDY||S.done)return;
 const un=120-Object.keys(S.ans).length;
 if(un>0&&!confirm('안 푼 문제가 '+un+'개 있습니다. 제출할까요?'))return;
 S.done=true;clearInterval(tick);save();S.i=-1;result();
}

function result(){
 const per=[0,0,0,0,0,0],tot=[0,0,0,0,0,0];
 let right=0;
 D.q.forEach(q=>{tot[q.s-1]++;if(S.ans[q.n]===q.a){per[q.s-1]++;right++;}});
 const scores=per.map((v,i)=>Math.round(v/tot[i]*100));
 const avg=Math.round(right/120*100);
 const pass=avg>=60&&scores.every(s=>s>=40);
 let h=`<div class="result"><div style="text-align:center;color:#64748b;font-size:13px">${D.title} · 채점 결과</div>
  <div class="score">${avg}<span style="font-size:20px;color:#94a3b8">점</span></div>
  <div style="text-align:center;color:#64748b;font-size:14px">120문항 중 <b>${right}</b>문항 정답 · 소요 ${fmt(S.elapsed)}</div>
  <div class="verdict ${pass?'pass':'fail'}">${pass?'합격':'불합격'}</div>
  <table class="stab"><tr><th>과목</th><th>맞힌 문항</th><th>점수</th></tr>`;
 for(let i=0;i<6;i++){
   h+=`<tr><td style="text-align:left">제${i+1}과목 ${D.subj[i]}</td>
    <td>${per[i]} / ${tot[i]}</td><td class="${scores[i]<40?'bad':''}">${scores[i]}</td></tr>`;
 }
 h+=`</table><div style="font-size:12.5px;color:#64748b;text-align:center">합격 — 과목당 40점 이상, 평균 60점 이상</div>
  <div class="rowbtns">
   <button class="nbtn pri" id="rw">틀린 문제만 다시 보기</button>
   <button class="nbtn" id="rall">전체 해설 보기</button>
   <button class="nbtn" id="rst">다시 풀기</button>
  </div></div>`;
 $('#app').innerHTML=h;
 paint(); stat();
 $('#rw').onclick=()=>{const bad=D.q.findIndex(q=>S.ans[q.n]!==q.a);S.i=bad<0?0:bad;render();};
 $('#rall').onclick=()=>{S.i=0;render();};
 $('#rst').onclick=()=>{if(confirm('답안을 지우고 처음부터 다시 풀까요?')){
   S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();startTimer();}};
}

function build(){
 let p='';
 for(let s=1;s<=6;s++){
   p+=`<div class="palhd">제${s}과목 ${D.subj[s-1]}</div><div class="palgrid">`;
   D.q.filter(q=>q.s===s).forEach(q=>{p+=`<button class="pg" data-n="${q.n}">${q.n}</button>`;});
   p+='</div>';
 }
 $('#pal').innerHTML=p;
 $$('.pg').forEach(b=>b.onclick=()=>{S.i=+b.dataset.n-1;save();render();$('#pal').classList.remove('open');});
}

$('#prev').onclick=()=>{if(S.i>0){S.i--;save();render();}};
$('#next').onclick=()=>{if(S.i<119){S.i++;save();render();}};
$('#palbtn').onclick=()=>$('#pal').classList.toggle('open');
const sb=$('#sub'); if(sb)sb.onclick=submit;
const rs=$('#reset'); if(rs)rs.onclick=()=>{if(confirm('푼 기록을 모두 지울까요?')){
 S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();}};
document.addEventListener('keydown',e=>{
 if($('#modal').classList.contains('on')){
   if(e.key==='Escape')closeCard();
   if(e.key===' '){e.preventDefault();$('#mcard').click();}
   return;
 }
 if(e.key==='ArrowLeft')$('#prev').click();
 if(e.key==='ArrowRight')$('#next').click();
 if('1234'.includes(e.key)){const b=$$('.opt')[+e.key-1];if(b)b.click();}
 if(e.key==='s'||e.key==='S'){const t=$('#tsol');if(t)t.click();}
 if(e.key==='c'||e.key==='C'){const t=$('#tcard');if(t)t.click();}
});
build();
const hm=location.hash.match(/^#q(\d+)/);
if(hm){S.started=1;S.i=Math.max(0,Math.min(119,+hm[1]-1));save();}
if(!STUDY&&S.done){if(hm){render();}else{S.i=-1;result();}}
else{render();if(S.started)startTimer();}
</script>
</body></html>
