:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기계배치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>건물 안에 기계를 어떻게 놓을 것인가</u></td></tr></tbody></table></div>", "nq": 2}, "card_mac_t156": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "운반·양중기", "mid": "비파괴검사방법의 선택", "front": "비파괴검사방법의 선택은?", "back": "<strong>액체침투탐상검사(PT)</strong>다. <strong>장비가 간단하고 현장에서 바로 쓸 수</strong> 있으며 <strong>표면에 열린 균열</strong>을 잘 찾는다.<p><strong>◈ 암기</strong> <u>표면 균열을 현장에서 보면 PT</u>.</p><p><strong>「표면 균열」과 「현장에서 간편하게」</strong> 두 조건이 겹치면 침투탐상이다. <strong>안을 봐야 하면 UT·RT, 겉이면 PT·MT</strong>로 먼저 가른다.</p><div style=\"margin:12px 0 2px;font-weight:700\">현장에서의 비파괴검사 선택</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">검사</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">특징</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">현장 적용</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>침투탐상(PT)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>약품만 있으면 된다 · 재질을 가리지 않는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 간편</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>자분탐상(MT)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>자화 장치가 필요 · 강자성체만</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">보통</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>초음파탐상(UT)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>장비와 숙련이 필요</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">내부 결함용</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>방사선투과(RT)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>방사선 차폐와 자격이 필요</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>현장에서 어렵다</u></td></tr></tbody></table></div>", "nq": 1}, "card_mac_t157": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "운반·양중기", "mid": "탑승의 제한", "front": "탑승의 제한은?", "back": "<strong>승차석 외 탑승 제한</strong>은 <strong>차량계 하역운반기계</strong>의 조치다. 전용탑승설비를 쓰는 이 상황과 어긋난다.<p><strong>◈ 암기</strong> <u>내릴 때도 동력하강</u>.</p><p><strong>「동력하강방법」</strong>은 <strong>브레이크를 풀어 자유낙하시키지 말라</strong>는 뜻이다. 사람이 타고 있으므로 <strong>내려올 때도 힘으로 붙들어</strong> 야 한다.</p><div style=\"margin:12px 0 2px;font-weight:700\">크레인 탑승설비 사용 시의 조치 (규칙 제86조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>탑승설비가 뒤집히거나 떨어지지 않도록 필요한 조치를 할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전대나 구명줄을 설치하고, 안전난간을 설치할 수 있는 구조면 안전난간을 설치할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>탑승설비를 하강시킬 때에는 동력하강방법으로 할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>자유낙하 금지</u></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제86조</em></p>", "nq": 1}, "card_mac_t014": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "산업용 기계", "mid": "보일러의 방호장치", "front": "보일러의 방호장치는?", "back": "<ul><li><strong>압력제한 스위치</strong>다. 압력이 오르면 <strong>버너의 연소를 끊어</strong> 더 오르지 못하게 한다. 압력을 밖으로 빼는 것이 아니라 <strong>열을 넣는 쪽을 멈추는</strong> 장치라는 점이 갈림길이다.</li><li><strong>언로드밸브</strong>는 <strong>공기압축기</strong>의 부속이다. 압력이 차면 압축기를 무부하로 돌린다.</li><li><strong>급정지장치</strong>는 <strong>롤러기</strong>의 방호장치다.</li></ul><p><strong>◈ 암기</strong> <u>압력제한 스위치는 열을 끊고, 압력방출장치는 압력을 뺀다</u>. · <u>언로드밸브는 공기압축기</u>.</p><p>압력방출장치가 2개 이상이면 하나는 <strong>최고사용압력 이하</strong>, 나머지는 <strong>1.05배 이하</strong>에서 작동한다.<br><strong>압력방출장치는 「넘치면 뿜어낸다」, 압력제한스위치는 「오르면 불을 끈다」</strong>로 갈린다. 앞의 것은 <strong>결과를 막고</strong> 뒤의 것은 <strong>원인을 끊는다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">보일러의 방호장치 넷</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">하는 일</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">작동 방식</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>압력제한 스위치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">압력이 오르기 전 연소를 차단</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">열을 끊는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>압력방출장치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">최고사용압력에서 증기를 뺀다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">압력을 뺀다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>고저수위 조절장치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">수위가 낮아지면 경보·차단</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">물을 본다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>화염검출기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">화염이 꺼지면 연료 차단</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">불을 본다</td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제116조·제117조</em></p>", "nq": 5}, "card_mac_t158": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "프레스·전단기", "mid": "금형의 안전화", "front": "금형의 안전화는?", "back": "<ul><li>맞춤 핀은 <strong>억지 끼워맞춤</strong>으로 해야 한다. <strong>헐겁게 하면 빠져 떨어진다</strong>.</li><li>맞춤 핀은 <strong>억지 끼워맞춤</strong>으로 한다. <strong>헐거우면 빠져 떨어진다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>맞춤 핀은 억지 끼워맞춤</u>.</p><p><strong>핀이 헐거우면 떨어진다</strong>는 상식으로 걸러진다. <strong>억지 끼워맞춤(억지로 눌러 박는 것)</strong>이라야 빠지지 않는다. <strong>8 [mm]는 손가락이 들어가지 못하는 크기</strong>다.<br><strong>「8 [mm] 이하」</strong>라는 숫자가 금형 안전화의 중심이다 — <strong>손가락이 들어가지 못하는 틈</strong>이다. <strong>맞춤 핀은 위치를 잡는 부품이라 헐거우면 구실 자체를 못 한다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">금형의 안전화</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>T홈 안길이</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>설치 볼트 지름의 2배 이상</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>맞춤 핀</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>억지 끼워맞춤</u> · 상형에 쓸 때는 낙하방지 대책 — <u>「헐거움」이 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>이동 스트리퍼와 다이의 간격</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>8 [mm] 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>금형 사이의 틈</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>8 [mm] 이하</u> (손가락이 들어가지 못하게)</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>대형 금형의 생크</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생크만으로 설치하지 말고 볼트로 조인다</u></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t005": {"kind": "단답형", "fq": 3, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "감전사고의 방지대책", "front": "감전사고의 방지대책은?", "back": "<ul><li><strong>정격표시</strong>는 그 기기를 어떤 조건에서 쓰라고 알려 주는 <strong>사용 정보</strong>이지 감전을 막는 조치가 아니다. 표시를 붙였다고 해서 사람이 충전부에 닿는 것이 막히지는 않는다.</li><li>충전부에는 <strong>통전망이 아니라 절연 덮개나 방호망</strong>을 씌워야 한다. <strong>전기가 통하는 망</strong>을 씌우면 오히려 감전 위험이 커진다.</li><li><strong>사고가 난 뒤의 처리 절차</strong>는 <strong>사후 대응</strong>이다. 감전을 막는 예방 대책이 아니다.</li></ul><p><strong>◈ 암기</strong> <u>통전망이 아니라 절연망</u>. · <u>사후 처리는 예방이 아니다</u>.</p><p>의 두 갈래. <u>직접 접촉 방지(절연 · 방호 · 격리 · 폐쇄형 외함)</u>와 <u>간접 접촉 방지(보호접지 · 누전차단기 · 이중절연 · 등전위본딩 · 비접지 전원)</u>. 표지·교육은 이 조치들에 <u>더해서</u> 붙이는 것이지 대신할 수 없다.<br>충전부 방호의 다섯 가지 — <strong>절연물로 감싼다 · 폐쇄형 외함 · 방호망이나 절연 덮개 · 대지전압 30 [V] 이하 · 출입이 어려운 곳에 두고 위험표시</strong>. <strong>모두 「전기가 안 통하게」</strong>하는 쪽이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">감전 방지대책</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대책</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원리</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>보호접지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>새는 전류를 땅으로 보낸다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>누전차단기 설치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>새면 곧바로 끊는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>절연방호구 사용</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>충전부와 사람 사이를 가로막는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>이중절연기기 · 안전전압 사용</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>애초에 위험을 없앤다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정격 표시</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>성능을 알린다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>감전 방지가 아니다</u></td></tr></tbody></table></div>", "nq": 4}, "card_ele_t167": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "활선작업용 기구", "front": "활선작업용 기구는?", "back": "<ul><li><strong>활선 시메라</strong>다. <strong>전선을 잡아당겨 붙들어 두는</strong> 장구로, 애자를 갈 때 전선을 옆으로 옮겨 둘 수 있다.</li><li><strong>배전선용 후크봉(COS 조작봉)</strong>이다. <strong>긴 절연봉으로 멀리서 여닫아</strong> 아크를 피한다.</li></ul><p><strong>◈ 암기</strong> <u>애자 교환에는 활선 시메라</u>. · <u>COS 개폐는 후크봉으로</u>.</p><p><strong>「시메(締め)」는 「죈다 · 붙든다」</strong>는 뜻이다. <strong>애자를 갈려면 그 애자에 걸린 전선을 잠시 다른 데로 붙들어 두어야</strong> 하므로 이 장구를 쓴다.<br><strong>「멀리서 조작한다」는 것이 활선작업 기구의 뼈대</strong>다 — <strong>사람과 충전부 사이에 절연봉의 길이만큼 거리를 두는</strong> 것이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">주요 활선장구</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장구</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 하나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>활선 시메라</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전선을 잡아당겨 붙든다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>애자 교환 · 전선 변경</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>점프선(바이패스 코드)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전류를 우회시킨다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>활선커터</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>충전된 전선을 자른다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>디스콘스위치 조작봉</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>단로기를 멀리서 조작한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t168": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "지락차단장치 설치의 예외 (옛 전기설비기술기준)", "front": "지락차단장치 설치의 예외 (옛 전기설비기술기준)은?", "back": "옛 기준으로 <strong>제3종 접지공사의 접지저항은 100 [Ω] 이하</strong>다. 10 [Ω]은 제1종의 값이다.<p><strong>◈ 암기</strong> <u>제3종은 100 [Ω] 이하</u>.</p><p><strong>제1종과 특별 제3종이 10 [Ω], 제3종이 100 [Ω]</strong>이다. <strong>10과 100을 바꿔 놓는 것</strong>이 이 유형의 함정이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">옛 접지공사의 종별과 접지저항 (지금은 폐지)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종별</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">접지저항</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">적용</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제1종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>10 [Ω] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">고압·특고압 기기 외함 · 피뢰기</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제2종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{150}{1 \\text{선 지락전류}}$<u> [Ω] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">변압기 중성점</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제3종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>100 [Ω] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>400 [V] 미만 저압 기기 외함</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>특별 제3종</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>10 [Ω] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">400 [V] 이상 저압 기기 외함</td></tr></tbody></table></div>", "nq": 1}, "card_ele_t169": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "지락 시 인체 통과 전류", "front": "지락 시 인체 통과 전류의 식은?", "back": "인체(3,000 [Ω])와 $R_{2}$(100 [Ω])의 병렬값은 $\\dfrac{100 \\times 3 {,} 000}{3 {,} 100} \\fallingdotseq 96.8$ [Ω]이다. 지락전류는 $200 / ( 10 + 96.8 ) \\fallingdotseq 1.873$ [A]이고, 인체로는 $1.873 \\times \\dfrac{100}{3 {,} 100} \\fallingdotseq 0.0604$ [A] = <strong>60.4 [mA]</strong>가 흐른다.<p><strong>◈ 암기</strong> <u>전체 전류를 구하고 저항에 반비례해 나눈다</u>.</p><p>두 단계다 — <strong>전체 지락전류를 구하고, 그것을 인체와 </strong>$R_{2}$<strong>가 저항에 반비례해 나눠 가진다</strong>. <strong>인체 저항이 훨씬 커서 대부분은 </strong>$R_{2}$<strong>로 흐르지만</strong>, 남은 60 [mA] 만으로도 <strong>심실세동 영역</strong>에 든다.</p>", "nq": 1}, "card_ele_t170": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "제2종 접지공사의 접지저항 (옛 전기설비기술기준)", "front": "제2종 접지공사의 접지저항 (옛 전기설비기술기준)의 식은?", "back": "옛 기준으로 <strong>제2종 접지공사</strong>의 저항은 $\\dfrac{150}{1 \\text{선 지락전류}} = \\dfrac{150}{15} = 10$ [Ω] 이하다.<p><strong>◈ 암기</strong> $150 \\div 1 \\text{선 지락전류}$.</p><p>$\\dfrac{150}{1 \\text{선 지락전류}}$라는 식을 기억한다. <strong>고압이 저압으로 흘러넘쳤을 때 저압측 대지전압이 150 [V]를 넘지 않게</strong> 하려는 값이다. <strong>차단 시간에 따라 300 이나 600을 쓰기도</strong>한다.</p>", "nq": 1}, "card_ele_t171": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "자동전격방지장치의 시동감도", "front": "자동전격방지장치의 시동감도는?", "back": "<ul><li><strong>시동감도</strong>는 <strong>아크를 낼 수 있는 2차측 최대저항</strong>이다. <strong>값이 클수록 잘 시동되지만 너무 크면 사람 몸에도 반응</strong>한다.</li><li><strong>시동감도는 아크를 낼 수 있는 2차측 최대저항</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>시동감도는 2차측 최대저항</u>.</p><p><strong>시동감도가 지나치게 높으면 사람 몸(약 3,000 [Ω])에도 반응해 위험</strong>하므로 <strong>500 [Ω] 이하</strong>로 제한한다. <strong>「감도」는 저항, 「시간」은 초</strong>로 나뉜다는 점만 잡아도 갈린다.<br><strong>「감도」는 「얼마나 나쁜 조건에서도 알아채나」</strong>다 — <strong>저항이 클수록 아크가 잘 안 붙는데, 그래도 작동하는 저항의 한계</strong>가 시동감도다. <strong>「시간」이 나오면 시동시간이나 지동시간</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">자동전격방지장치의 용어</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">용어</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>시동감도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>아크를 낼 수 있는 2차측 최대저항</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>보통 500 [Ω] 이하</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지동시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>용접봉을 뗀 뒤 무부하전압이 25 [V] 이하로 될 때까지의 시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1초 이내</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>시동시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>용접봉을 대고 아크가 날 때까지의 시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.06초 이내</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무부하전압</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>아크를 쉴 때의 2차 전압</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">25 ~ 30 [V] 이하</td></tr></tbody></table></div>", "nq": 2}, "card_ele_t172": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "접지", "mid": "방폭지역의 케이블 선정", "front": "방폭지역의 케이블 선정은?", "back": "<strong>고무 캡타이어 케이블</strong>은 쓸 수 없다. <strong>부드러워 상하기 쉽고 기름과 열에 약하다</strong>.<p><strong>◈ 암기</strong> <u>캡타이어는 방폭지역에서 못 쓴다</u>.</p><p><strong>방폭지역에서는 튼튼하고 잘 상하지 않는 케이블</strong>을 쓴다. <strong>캡타이어는 움직이는 기기에 쓰는 유연 케이블</strong>이라 <strong>상처가 나기 쉬워</strong> 제외된다. 11회 69번의 <strong>폭연성 분진에서 캡타이어 제외</strong>와 같은 이유다.</p><div style=\"margin:12px 0 2px;font-weight:700\">방폭지역의 저압케이블</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">케이블</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">쓸 수 있나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>MI 케이블(광물절연)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>쓸 수 있다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">불에 강하다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>연피 케이블</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>쓸 수 있다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">납으로 감쌌다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>폴리에틸렌 외장케이블</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>쓸 수 있다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>고무 캡타이어 케이블</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>쓸 수 없다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>상하기 쉽다</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t173": {"kind": "공식형", "fq": 2, "subject": "전기위험방지기술", "chapter": "", "mid": "3상 전력과 전류", "front": "3상 전력과 전류의 식은?", "back": "$P = \\sqrt{3} V I \\cos \\theta$에서 $I = \\dfrac{P}{\\sqrt{3} V \\cos \\theta} = \\dfrac{50 {,} 000}{1.732 \\times 380 \\times 0.8} \\fallingdotseq 94.96$ [A]다.<p><strong>◈ 암기</strong> $I = P \\div ( \\sqrt{3} V \\cos \\theta )$.</p><p>$P = \\sqrt{3} V I \\cos \\theta$에서 <strong>√3과 역률을 모두 나눈다</strong>. <strong>둘 중 하나만 빠뜨려도 보기 ③ 이나 ④</strong>로 빠지도록 짜여 있다.</p>", "nq": 1}, "card_ele_t174": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "폭연성 분진과 가연성 분진", "front": "폭연성 분진과 가연성 분진은?", "back": "<strong>알루미늄</strong>이다. <strong>공기 중 산소가 없어도 발열 반응을 이어 가는 금속 분진</strong>이 폭연성 분진이다.<p><strong>◈ 암기</strong> <u>금속 분진이면 폭연성</u>.</p><p><strong>「금속」이면 폭연성</strong> 이라고 어림잡아도 대체로 맞는다. <strong>금속은 제 산화열로 계속 타므로 산소를 끊어도 멈추지 않는다</strong> — 그래서 가장 위험한 갈래다.</p><div style=\"margin:12px 0 2px;font-weight:700\">분진의 분류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>폭연성 분진</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>산소가 적어도 폭발하는 금속 분진</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>마그네슘 · 알루미늄 · 티타늄 · 지르코늄</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>가연성 분진 — 도전성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전기가 통하는 가연성 분진</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>카본블랙 · 코크스 · 그을음</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>가연성 분진 — 비도전성</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전기가 통하지 않는 가연성 분진</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>밀가루 · 전분 · 설탕 · 합성수지</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t125": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "내압(耐壓) 방폭구조", "front": "내압(耐壓) 방폭구조는?", "back": "<ul><li><strong>내압(耐壓) 방폭구조 d</strong>다. <strong>안에서 터져도 그 압력을 견디고 불꽃을 밖으로 내보내지 않는다</strong>.</li><li><strong>내압(耐壓) 방폭구조 d</strong>다. <strong>안에서 터져도 견디고 밖으로 불을 내보내지 않는다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>터져도 견디고 새지 않으면 내압</u>. · <u>안에서 터져도 밖으로 안 번지면 내압</u>.</p><p><strong>내압의 「내」는 안이 아니라 견딜 내(耐)</strong>다. 핵심 값은 <strong>최대안전틈새(MESG)</strong>로, <strong>틈이 좁고 길수록 화염이 식어 밖으로 나가지 못한다</strong>.<br><strong>내압의 「내」는 견딜 내(耐)</strong>다. 핵심 값은 <strong>최대안전틈새(MESG)</strong>로, <strong>틈이 좁고 길수록 화염이 식어 밖으로 나가지 못한다</strong>. <strong>폭발등급 ⅡA · ⅡB · ⅡC</strong>는 이 값으로 나눈다.</p><div style=\"margin:12px 0 2px;font-weight:700\">방폭구조의 원리 비교</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구조</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기호</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원리</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>내압</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>d</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안에서 터져도 견디고 밖으로 불을 내보내지 않는다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>압력</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>p</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>깨끗한 공기를 밀어 넣어 가스가 못 들어오게 한다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>유입</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>o</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전기 부분을 기름에 담근다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>본질안전</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>ia · ib</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>에너지 자체를 점화 아래로 낮춘다</u></td></tr></tbody></table></div>", "nq": 3}, "card_ele_t175": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "안전초저압(SELV · PELV)", "front": "안전초저압(SELV · PELV)는?", "back": "<strong>교류 50 [V], 직류 120 [V]</strong>를 넘지 않는다.<p><strong>◈ 암기</strong> <u>교류 50 [V], 직류 120 [V]</u>.</p><p><strong>교류 50 · 직류 120</strong> 두 값을 짝으로 잡는다. <strong>직류가 더 높은 까닭은 같은 크기라도 직류가 덜 위험</strong>하기 때문이다. <strong>PELV는 접지된 초저압</strong>으로 SELV와 값은 같다.</p><div style=\"margin:12px 0 2px;font-weight:700\">안전초저압(SELV)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">한계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>교류(실효값)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>50 [V] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>직류(리플프리)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>120 [V] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>교류의  12px;vertical-align:middle;text-align:left;\"><u>1.0 [MΩ] 이상</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>500 [V] 초과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">1,000 [V]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1.0 [MΩ] 이상</u></td></tr></tbody></table></div><p><em>근거 — 한국전기설비규정(KEC) 132</em></p>", "nq": 4}, "card_ele_t179": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기화재", "mid": "전기화재의 통계", "front": "전기화재의 통계는?", "back": "<strong>전기배선 및 배선기구</strong>가 가장 큰 비중을 차지한다. <strong>벽 속과 천장에 숨어 있어 살피기 어렵다</strong>.<p><strong>◈ 암기</strong> <u>발화원은 배선, 경과는 단락</u>.</p><p><strong>발화원은 「배선과 배선기구」, 출화의 경과는 「단락」</strong>이 각각 첫째다. 두 물음을 섞어 놓는 일이 잦으니 <strong>「무엇에서 났나」와 「어떻게 났나」</strong>를 갈라 잡아 둔다.</p><div style=\"margin:12px 0 2px;font-weight:700\">전기화재의 발화원과 경로</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">가장 큰 것</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>발화원</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전기배선 및 배선기구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">이동식 전열기구 · 주방기기 순</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>출화의 경과(경로)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>단락(합선)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">누전 · 접촉부 과열 · 절연열화 · 과전류 순</td></tr></tbody></table></div>", "nq": 1}, "card_ele_t180": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "접지", "mid": "접지저항의 구성", "front": "접지저항의 구성은?", "back": "<strong>접지전극과 주회로 사이의 절연저항</strong>은 <strong>접지저항과 다른 값</strong>이다. 접지저항을 이루는 세 저항에 들지 않는다.<p><strong>◈ 암기</strong> <u>도체 · 접촉 · 대지</u> 세 저항.</p><p>세 저항 가운데 <strong>흙이 나타내는 저항이 압도적으로 크다</strong>. 그래서 <strong>접지극을 깊고 넓게 묻거나 접지저항 저감제를 쓰는</strong> 것이 대책이 된다.</p><div style=\"margin:12px 0 2px;font-weight:700\">접지저항을 이루는 세 저항</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">저항</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접지선과 접지극 자체의 도체저항</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>금속의 저항</u> — 셋 가운데 가장 작다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접지극 표면과 흙 사이의 접촉저항</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">닿는 정도</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접지극 둘레 흙이 나타내는 저항(대지저항)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 크다</u> — 대지저항률에 좌우된다</td></tr></tbody></table></div>", "nq": 1}, "card_ele_t181": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "접지", "mid": "접지극의 매설 깊이", "front": "접지극의 매설 깊이는?", "back": "<strong>접촉전압(보폭전압)을 낮추기</strong> 위해서다. <strong>접지극이 얕으면 지표면의 전위가 크게 오르내려</strong> 그 위를 지나는 사람이 위험해진다.<p><strong>◈ 암기</strong> <u>깊이 묻으면 접촉전압이 낮아진다</u>.</p><p>깊이 묻으면 <strong>지표면의 전위 분포가 완만해져</strong> <strong>접촉전압과 보폭전압이 낮아진다</strong>. <strong>접지저항도 함께 낮아지지만</strong>, 보기 ③은 <strong>「증가」</strong>라 방향이 반대다.</p>", "nq": 1}, "card_ele_t133": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "정전기", "mid": "정전기 발생량의 영향 인자", "front": "정전기 발생량의 영향 인자는?", "back": "<ul><li><strong>되풀이할수록 오히려 작아진다</strong>. 처음 접촉·분리할 때가 가장 크고, 여러 번 하면 <strong>표면 상태가 안정되어</strong> 발생량이 줄어든다.</li><li><strong>표면이 오염되면 발생량이 커진다</strong>. 나머지 셋은 모두 방향이 반대다.</li><li><strong>접촉시간</strong>은 다섯 인자에 들지 않는다. 다섯은 <strong>물체의 특성 · 표면상태 · 이력 · 접촉면적과 압력 · 분리속도(분리력)</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>되풀이하면 오히려 줄어든다</u>. · <u>오염될수록 크다</u>.</p><p>다섯 인자 가운데 <strong>「이력」만 되풀이할수록 줄어드는</strong> 쪽이다. 나머지 넷은 모두 <strong>「~할수록 크다」</strong> 라서, 이 하나만 기억하면 어느 보기를 물어도 갈린다.<br>다섯 인자 가운데 <strong>「이력」만 되풀이할수록 줄어들고 나머지는 모두 「~할수록 크다」</strong>이다. 이 규칙 하나로 보기 셋의 방향이 뒤집혀 있음을 알 수 있다.</p><div style=\"margin:12px 0 2px;font-weight:700\">정전기 발생량에 영향을 주는 인자</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">인자</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">발생량</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물질의 특성(대전서열)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:le d #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>봉상수(막대 모양 물) · 포</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>쓸 수 없다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>물줄기를 타고 전기가 흐른다</u></td></tr></tbody></table></div>", "nq": 1}, "card_chm_t161": {"kind": "단답형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "인화점의 뜻", "front": "인화점의 뜻은?", "back": "온도가 <strong>인화점 아래면 증기 농도가 폭발하한계에 못 미쳐</strong> 인화하지 않는다. <strong>「위험이 있다」</strong>는 정반대다.<p><strong>◈ 암기</strong> <u>인화점 아래면 증기가 모자라 안 붙는다</u>.</p><p><strong>인화점은 「증기 농도가 폭발하한계에 이르는 온도」</strong>다. 그러므로 <strong>그보다 낮으면 증기가 모자라 불이 붙지 않는다</strong>. 이 정의만 잡으면 보기 ③이 곧바로 걸러진다.</p>", "nq": 1}, "card_chm_t162": {"kind": "단답형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "전기화재(C급)의 소화", "front": "전기화재(C급)의 소화는?", "back": "<strong>이산화탄소소화기</strong>다. <strong>전기가 통하지 않고 오염도 남기지 않는다</strong>.<p><strong>◈ 암기</strong> <u>C급에는 이산화탄소</u>.</p><p><strong>C급은 「전기」</strong>다. <strong>이산화탄소는 부도체이고 뒤에 아무것도 남기지 않아</strong> 전기설비에 가장 알맞다. 83번과 같은 결의 물음이다.</p>", "nq": 1}, "card_chm_t009": {"kind": "단답형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "화염방지기의 설치", "front": "화염방지기의 설치는?", "back": "<ul><li><strong>설비의 상단</strong>에 설치한다. 증기와 가스는 위로 올라가 통기관을 통해 대기로 나가므로, 밖에서 들어오려는 화염을 막을 자리도 그 통기관 끝, 곧 <strong>설비의 상단</strong>이다.</li><li><strong>설비의 상단</strong>에 설치한다. 증기와 가스는 위로 올라가 통기관으로 빠져나가므로, 밖에서 들어오려는 화염을 막을 자리도 그 끝이다.</li><li><strong>화염방지기(flame arrester)</strong>다. 숨을 쉬듯 증기를 내보내고 공기를 들이는 통기구에 달아 <strong>밖의 불이 안으로 들어오지 못하게</strong> 한다.</li></ul><p><strong>◈ 암기</strong> <u>증기는 위로 간다</u> — 그래서 상단. · <u>숨 쉬는 구멍에 달면 화염방지기</u>.</p><p>안전보건규칙 제269조(화염방지기의 설치 등). 원리는 내압 방폭구조와 같다 — <u>좁은 틈(금속망·다공판)을 지나며 화염이 식어</u> 안쪽으로 번지지 못한다. 다만 <u>인화점이 섭씨 60도 이상인 액체</u>를 저장하는 탱크에는 화염방지기 대신 <u>통기밸브</u>를 달 수 있다.<br>원리는 내압 방폭구조와 같다. <strong>좁은 틈(금속망·다공판)을 지나며 화염이 식어</strong> 안쪽으로 번지지 못한다. <strong>인화점 60 [℃] 이상인 액체</strong> 탱크에는 화염방지기 대신 <strong>통기밸브</strong>를 달 수 있다.</p><p><em>근거 — 안전보건규칙 제269조</em></p>", "nq": 5}, "card_chm_t163": {"kind": "공식형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "버제스-휠러(Burgess-Wheeler)의 법칙", "front": "버제스-휠러(Burgess-Wheeler)의 법칙의 식은?", "back": "$X \\times Q = 1 {,} 100$ (일정)이므로 $X = \\dfrac{1 {,} 100}{635.4} \\fallingdotseq 1.73$ [vol%]다.<p><strong>◈ 암기</strong> <u>하한계 × 연소열 = 1,100</u>.</p><p><strong>포화탄화수소는 「폭발하한계 × 연소열 = 약 1,100」</strong>이라는 값이 거의 일정하다. <strong>연소열이 클수록(분자가 클수록) 하한계는 낮아진다</strong>는 뜻이기도 하다.</p>", "nq": 1}, "card_chm_t164": {"kind": "공식형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "Jones 식과 화학양론조성", "front": "Jones 식과 화학양론조성의 식은?", "back": "<ul><li>에틸렌은 $n = 2$, $m = 4$이므로 $C_{\\mathrm{st}} = \\dfrac{100}{1 + 4.773 ( 2 + 4 / 4 )} = \\dfrac{100}{1 + 4.773 \\times 3} = \\dfrac{100}{15.32} \\fallingdotseq 6.53$ [vol%]다. 따라서 $\\mathrm{LFL} = 0.55 \\times 6.53 \\fallingdotseq 3.6$ [vol%]다.</li><li>반응식에서 <strong>산소 5몰</strong>이 필요하므로 $C_{\\mathrm{st}} = \\dfrac{100}{1 + 4.773 \\times 5} = \\dfrac{100}{24.865} \\fallingdotseq 4.02$ [vol%]다. 따라서 $\\mathrm{LFL} = 0.55 \\times 4.02 \\fallingdotseq 2.21$ [vol%]다.</li></ul><p><strong>◈ 암기</strong> <u>LFL = 0.55 × </u>$C_{\\mathrm{st}}$<u>, UFL = 3.50 × </u>$C_{\\mathrm{st}}$. · <u>LFL = 0.55 × </u>$C_{\\mathrm{st}}$.</p><p>두 단계다 — <strong>먼저 </strong>$C_{\\mathrm{st}} = \\dfrac{100}{1 + 4.773 ( n + m / 4 )}$<strong>를 구하고, 0.55를 곱한다</strong>. <strong>상한계는 </strong>$\\mathrm{UFL} = 3.50 \\times C_{\\mathrm{st}}$로 구한다.<br><strong>반응식에 산소 계수가 이미 적혀 있으면 </strong>$n + m / 4$<strong>를 따로 구할 필요가 없다</strong> — <strong>그 계수를 그대로 4.773에 곱하면</strong> 된다. <strong>상한계는 </strong>$\\mathrm{UFL} = 3.50 \\times C_{\\mathrm{st}}$다.</p>", "nq": 2}, "card_chm_t141": {"kind": "단답형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "위험물", "mid": "위험물의 유별 분류", "front": "위험물의 유별 분류는?", "back": "<ul><li><strong>니트로글리세린</strong>은 <strong>제5류 자기반응성 물질</strong const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const STUDY=MODE==='study';
const KEY=(STUDY?'safestudy_':'safecbt_')+D.round;
let S={i:0,ans:{},open:{},started:STUDY?1:0,elapsed:0,done:false};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
if(!S.open)S.open={};
if(STUDY)S.started=1;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function kx(el){if(window.renderMathInElement)renderMathInElement(el,{delimiters:[
 {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}

const MARK=['①','②','③','④'];
const LV={1:['#10b981','쉬움'],2:['#f59e0b','보통'],3:['#ef4444','어려움']};

function fmt(s){const m=Math.floor(s/60),x=s%60;
 return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+':'+String(x).padStart(2,'0');}

let tick=null;
function startTimer(){
 if(STUDY)return;
 clearInterval(tick);tick=setInterval(()=>{
  if(S.done)return;
  S.elapsed++;const left=D.limit-S.elapsed;
  const t=$('#timer'); if(!t)return;
  t.textContent=left>0?fmt(left):'00:00:00';
  t.classList.toggle('warn',left<600);
  if(left<=0)submit();
  if(S.elapsed%10===0)save();
 },1000);}

function intro(){
 $('#app').innerHTML=`<div class="wrap intro">
  <h2>${D.title}</h2>
  <p>6과목 120문항 · 시험시간 3시간</p>
  <p>합격 기준 — 과목당 40점 이상, 전 과목 평균 60점 이상</p>
  <p style="margin-top:14px;font-size:13px">답만 고르고 끝에 제출합니다.
   해설과 암기카드는 채점한 뒤에 열립니다.</p>
  <button class="big" id="go">시험 시작</button>
  ${Object.keys(S.ans).length?'<div style="margin-top:12px;font-size:13px;color:#64748b">이어서 풀면 지난번 답안이 그대로 살아 있습니다</div>':''}
 </div>`;
 $('#go').onclick=()=>{S.started=1;save();render();startTimer();};
}

// 해설이 열려 있는가 — 직접 여닫은 적이 있으면 그 뜻을 따른다
function solOpen(q){
 if(S.open[q.n]!==undefined)return S.open[q.n];
 return S.done||(STUDY&&!!S.ans[q.n]);
}

function qHTML(q){
 const a=S.ans[q.n], graded=(STUDY&&a)||S.done, show=STUDY||S.done;
 let h=`<div class="wrap"><div class="qh"><span class="qno">${String(q.n).padStart(3,'0')}</span>
  <span class="tag" style="background:${LV[q.lv][0]}">난이도 ${q.lv}·${LV[q.lv][1]}</span>
  <span class="tag" style="background:#6366f1">${q.kind}</span>
  <span class="tag" style="background:#f59e0b">빈출 ${'★'.repeat(q.fq)+'☆'.repeat(3-q.fq)}</span>
  <span class="subj">제${q.s}과목 ${D.subj[q.s-1]}</span>`;
 if(show){
   h+=`<span class="acts">
    <button class="mini${solOpen(q)?' on':''}" id="tsol">📖 해설 ${solOpen(q)?'닫기':'보기'}</button>
    ${q.card&&D.cards[q.card]?'<button class="mini cd" id="tcard">🃏 암기카드</button>':''}
   </span>`;
 }
 h+=`</div><div class="stem">${q.t}</div>`;
 if(q.cond)h+=`<div class="cond">${q.cond}</div>`;
 if(q.img)h+=`<img class="stemimg" src="img/${q.img}">`;
 for(let k=0;k<4;k++){
   let cls='opt';
   if(a===k+1)cls+=' sel';
   if(graded){ if(k+1===q.a)cls='opt right'; else if(a===k+1)cls='opt wrong'; }
   h+=`<button class="${cls}" data-k="${k+1}"><span class="n">${MARK[k]}</span><span>${q.c[k]}</span></button>`;
 }
 if(graded){
   h+= a===q.a ? `<div class="vline o">정답입니다 · 정답 ${q.a}번</div>`
              : `<div class="vline x">${a?'틀렸습니다 · 고른 답 '+a+'번 · ':'미응답 · '}정답 ${q.a}번</div>`;
 }
 if(show&&solOpen(q)){
   h+=`<div class="sol"><div class="lbl">해설</div><div>${q.sol}</div>`;
   if(q.w)h+=`<div class="lbl">오답 분석</div><div>${q.w}</div>`;
   if(q.pt)h+=`<div class="lbl g">관련 개념 · 암기</div><div class="box">${q.pt}</div>`;
   if(q.law)h+=q.law;
   h+=`</div>`;
 }
 return h+'</div>';
}

function render(){
 if(!S.started){intro();return;}
 if(!STUDY&&S.done&&S.i<0){result();return;}
 const q=D.q[S.i];
 $('#app').innerHTML=qHTML(q);
 $$('.opt').forEach(b=>b.onclick=()=>{
   S.ans[q.n]=+b.dataset.k;
   if(STUDY&&S.open[q.n]===undefined)S.open[q.n]=true;
   save();
   if(STUDY||S.done){render();}
   else{$$('.opt').forEach(x=>x.classList.toggle('sel',x===b));paint();}
 });
 const ts=$('#tsol'); if(ts)ts.onclick=()=>{S.open[q.n]=!solOpen(q);save();render();};
 const tc=$('#tcard'); if(tc)tc.onclick=()=>openCard(q.card);
 kx($('#app'));
 stat();
 $('#prev').disabled=S.i===0; $('#next').disabled=S.i===119;
 paint();
 window.scrollTo(0,0);
}

function stat(){
 const n=Object.keys(S.ans).length;
 if(STUDY){
   let ok=0; D.q.forEach(q=>{if(S.ans[q.n]===q.a)ok++;});
   $('#prog').innerHTML=`<b>${S.i+1}</b> / 120 · 푼 문항 <b>${n}</b> · 맞힘 <b>${ok}</b>`;
   const r=$('#rate');
   if(r)r.textContent=n?`정답률 ${Math.round(ok/n*100)}%`:'정답률 —';
 }else{
   $('#prog').innerHTML=S.done?`채점 완료`:`<b>${S.i+1}</b> / 120 · 푸는 중 <b>${n}</b>`;
 }
}

/* 암기카드 팝업 */
let mflip=false;
function openCard(id){
 const c=D.cards[id]; if(!c)return;
 mflip=false;
 $('#mbody').innerHTML=`<button class="mx" id="mx">✕</button>
  <div class="mcard" id="mcard">
   <div class="mface">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span class="stars">${'★'.repeat(c.fq)+'☆'.repeat(3-c.fq)}</span>
     <span>${c.subject}${c.chapter?' · '+c.chapter:''}</span>
     <span class="mcid">${id}</span></div>
    <div class="mq">${c.front}</div>
    <div class="mhint">카드를 누르면 뒤집힙니다 · Esc 닫기</div>
   </div>
   <div class="mface back">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span>${c.mid}</span><span class="mcid">${id}</span></div>
    <div class="ma">${c.back}</div>
    <div class="mfoot"><span>이 개념을 묻는 문항 ${c.nq}개</span>
     <a href="../_암기카드.html#${id}" target="_blank">카드 전체 보기 →</a></div>
   </div>
  </div>`;
 $('#modal').classList.add('on');
 kx($('#mbody'));
 fitCard(); setTimeout(fitCard,260);
 $('#mcard').onclick=()=>{mflip=!mflip;$('#mcard').classList.toggle('flip',mflip);};
 $('#mx').onclick=e=>{e.stopPropagation();closeCard();};
}
function fitCard(){
 const mc=$('#mcard'); if(!mc)return;
 mc.style.height='120px';
 const h=Math.max(...[...mc.querySelectorAll('.mface')].map(f=>f.scrollHeight));
 mc.style.height=Math.min(window.innerHeight*0.78,Math.max(300,h+4))+'px';
}
function closeCard(){$('#modal').classList.remove('on');}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeCard();};
window.addEventListener('resize',()=>{if($('#modal').classList.contains('on'))fitCard();});

function paint(){
 $$('.pg').forEach(b=>{
   const n=+b.dataset.n, q=D.q[n-1];
   const marked=STUDY?!!S.ans[n]:S.done;
   let c='pg';
   if(marked&&(STUDY||S.done))c+=(S.ans[n]===q.a?' ok':' no');
   else if(S.ans[n])c+=' done';
   if(n-1===S.i)c+=' cur';
   b.className=c;
 });
}

function submit(){
 if(STUDY||S.done)return;
 const un=120-Object.keys(S.ans).length;
 if(un>0&&!confirm('안 푼 문제가 '+un+'개 있습니다. 제출할까요?'))return;
 S.done=true;clearInterval(tick);save();S.i=-1;result();
}

function result(){
 const per=[0,0,0,0,0,0],tot=[0,0,0,0,0,0];
 let right=0;
 D.q.forEach(q=>{tot[q.s-1]++;if(S.ans[q.n]===q.a){per[q.s-1]++;right++;}});
 const scores=per.map((v,i)=>Math.round(v/tot[i]*100));
 const avg=Math.round(right/120*100);
 const pass=avg>=60&&scores.every(s=>s>=40);
 let h=`<div class="result"><div style="text-align:center;color:#64748b;font-size:13px">${D.title} · 채점 결과</div>
  <div class="score">${avg}<span style="font-size:20px;color:#94a3b8">점</span></div>
  <div style="text-align:center;color:#64748b;font-size:14px">120문항 중 <b>${right}</b>문항 정답 · 소요 ${fmt(S.elapsed)}</div>
  <div class="verdict ${pass?'pass':'fail'}">${pass?'합격':'불합격'}</div>
  <table class="stab"><tr><th>과목</th><th>맞힌 문항</th><th>점수</th></tr>`;
 for(let i=0;i<6;i++){
   h+=`<tr><td style="text-align:left">제${i+1}과목 ${D.subj[i]}</td>
    <td>${per[i]} / ${tot[i]}</td><td class="${scores[i]<40?'bad':''}">${scores[i]}</td></tr>`;
 }
 h+=`</table><div style="font-size:12.5px;color:#64748b;text-align:center">합격 — 과목당 40점 이상, 평균 60점 이상</div>
  <div class="rowbtns">
   <button class="nbtn pri" id="rw">틀린 문제만 다시 보기</button>
   <button class="nbtn" id="rall">전체 해설 보기</button>
   <button class="nbtn" id="rst">다시 풀기</button>
  </div></div>`;
 $('#app').innerHTML=h;
 paint(); stat();
 $('#rw').onclick=()=>{const bad=D.q.findIndex(q=>S.ans[q.n]!==q.a);S.i=bad<0?0:bad;render();};
 $('#rall').onclick=()=>{S.i=0;render();};
 $('#rst').onclick=()=>{if(confirm('답안을 지우고 처음부터 다시 풀까요?')){
   S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();startTimer();}};
}

function build(){
 let p='';
 for(let s=1;s<=6;s++){
   p+=`<div class="palhd">제${s}과목 ${D.subj[s-1]}</div><div class="palgrid">`;
   D.q.filter(q=>q.s===s).forEach(q=>{p+=`<button class="pg" data-n="${q.n}">${q.n}</button>`;});
   p+='</div>';
 }
 $('#pal').innerHTML=p;
 $$('.pg').forEach(b=>b.onclick=()=>{S.i=+b.dataset.n-1;save();render();$('#pal').classList.remove('open');});
}

$('#prev').onclick=()=>{if(S.i>0){S.i--;save();render();}};
$('#next').onclick=()=>{if(S.i<119){S.i++;save();render();}};
$('#palbtn').onclick=()=>$('#pal').classList.toggle('open');
const sb=$('#sub'); if(sb)sb.onclick=submit;
const rs=$('#reset'); if(rs)rs.onclick=()=>{if(confirm('푼 기록을 모두 지울까요?')){
 S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();}};
document.addEventListener('keydown',e=>{
 if($('#modal').classList.contains('on')){
   if(e.key==='Escape')closeCard();
   if(e.key===' '){e.preventDefault();$('#mcard').click();}
   return;
 }
 if(e.key==='ArrowLeft')$('#prev').click();
 if(e.key==='ArrowRight')$('#next').click();
 if('1234'.includes(e.key)){const b=$$('.opt')[+e.key-1];if(b)b.click();}
 if(e.key==='s'||e.key==='S'){const t=$('#tsol');if(t)t.click();}
 if(e.key==='c'||e.key==='C'){const t=$('#tcard');if(t)t.click();}
});
build();
const hm=location.hash.match(/^#q(\d+)/);
if(hm){S.started=1;S.i=Math.max(0,Math.min(119,+hm[1]-1));save();}
if(!STUDY&&S.done){if(hm){render();}else{S.i=-1;result();}}
else{render();if(S.started)startTimer();}
</script>
</body></html>
