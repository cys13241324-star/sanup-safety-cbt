지식×기능, 동기는 상황×태도</u>. · <u>능력 × 동기유발 = 인간의 성과</u>.</p><p><strong>네 낱말이 두 짝으로 나뉜다</strong> — <strong>능력은 「지식 × 기능」, 동기유발은 「상황 × 태도」</strong>. <strong>앞은 머리와 손, 뒤는 환경과 마음</strong>이라는 대비로 잡아 둔다.<br>네 등식이 <strong>아래에서 위로 쌓인다</strong> — <strong>지식·기능 → 능력</strong>, <strong>상황·태도 → 동기유발</strong>, <strong>능력·동기유발 → 인간의 성과</strong>, <strong>인간·물질의 성과 → 경영의 성과</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">데이비스의 동기부여 등식</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">등식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인간의 성과 × 물질적 성과 = 경영의 성과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>능력(ability) = 지식 × 기능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>무엇을 알고 무엇을 할 줄 아는가</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>동기유발(motivation) = 상황 × 태도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어떤 처지에서 어떤 마음인가</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인간의 성과 = 능력 × 동기유발</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>할 수 있음 × 하고 싶음</u></td></tr></tbody></table></div>", "nq": 3}, "card_mgt_t174": {"kind": "단답형", "fq": 1, "subject": "안전관리론", "chapter": "안전점검·인증", "mid": "안전인증 대상 기계 등", "front": "안전인증 대상 기계 등은?", "back": "<strong>연삭기</strong>는 안전인증 대상이 아니다. <strong>덮개는 방호장치 안전인증 대상</strong> 이지만 기계 자체는 아니다.<p><strong>◈ 암기</strong> <u>프 · 전 · 크 · 리 · 압 · 롤 · 사 · 고 · 곤</u> 아홉.</p><p>아홉을 <strong>프 · 전 · 크 · 리 · 압 · 롤 · 사 · 고 · 곤</strong>으로 새긴다. <strong>연삭기는 「자율안전확인 신고」 대상</strong>이라 한 단계 아래다.</p><div style=\"margin:12px 0 2px;font-weight:700\">안전인증 대상 기계 아홉 (영 제74조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>프레스</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전단기 및 절곡기</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>크레인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>리프트</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>압력용기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>롤러기</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>사출성형기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>고소작업대</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>곤돌라</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>연삭기는 들지 않는다</u></td></tr></tbody></table></div><p><em>근거 — 산업안전보건법 시행령 제74조</em></p>", "nq": 1}, "card_mgt_t153": {"kind": "단답형", "fq": 2, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "시몬즈(Simonds)의 재해손실비 산정", "front": "시몬즈(Simonds)의 재해손실비 산정은?", "back": "<ul><li><strong>영구 전노동불능 상해</strong>와 <strong>사망</strong>은 <strong>보험 코스트</strong>로 다룬다. 비보험 코스트의 네 갈래에 들지 않는다.</li><li><strong>A · B · C · D는 각 상해 갈래의 비보험 코스트 평균치</strong>다. <strong>건수에 곱해 더하면 비보험 코스트 총액</strong>이 나온다.</li><li><strong>보험 코스트 + 비보험 코스트</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>사망과 영구 전노동불능은 보험 코스트</u>. · <u>A·B·C·D는 비보험 코스트 평균치</u>.</p><p>비보험 코스트 네 갈래에 <strong>사망과 영구 전노동불능이 빠져 있다</strong>는 것이 요점이다. <strong>그 둘은 보험금으로 크게 메워지므로</strong> 따로 셈하지 않는다.<br><strong>보험 코스트는 그대로 더하고, 비보험 코스트는 갈래별 평균치에 건수를 곱해</strong> 더한다. <strong>사망과 영구 전노동불능은 네 갈래에 들지 않는다</strong> — 보험으로 크게 메워지기 때문이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">시몬즈의 재해손실비</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보험 코스트</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비보험 코스트</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">무엇</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>산재보험료</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>보험으로 메워지지 않는 실제 손실</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">갈래</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사망 · 영구 전노동불능</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>영구 부분노동불능 · 일시 전노동불능 · 일시 부분노동불능 · 응급조치(8시간 미만 휴업) · 무상해 사고</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">식</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>총 재해손실비 = 보험 코스트 + 비보험 코스트</u></td></tr></tbody></table></div>", "nq": 3}, "card_mgt_t175": {"kind": "단답형", "fq": 2, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "시몬즈 방식의 비보험 코스트", "front": "시몬즈 방식의 비보험 코스트는?", "back": "<strong>산재보험법으로 보상된 금액</strong>은 <strong>보험 코스트</strong>다. 비보험 코스트가 아니다.<p><strong>◈ 암기</strong> <u>보험으로 받은 돈은 보험 코스트</u>.</p><p>17번과 짝이다. 가르는 물음 하나 — <strong>보험금으로 돌려받는가</strong>. <strong>돌려받으면 보험 코스트, 회사가 고스란히 떠안으면 비보험 코스트</strong>다.</p>", "nq": 1}, "card_mgt_t095": {"kind": "단답형", "fq": 1, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "직접비와 간접비", "front": "직접비와 간접비는?", "back": "<ul><li><strong>병상위문금</strong>은 회사가 임의로 주는 돈이라 <strong>간접비</strong>다. 직접비는 <strong>산재보험법에 따라 지급되는 보상금</strong>이다.</li><li><strong>생산손실</strong>은 <strong>간접비</strong>다. 산재보험에서 나오는 돈이 아니다.</li><li><strong>「생산손실급여」</strong>라는 산재보험 급여는 없다. <strong>생산손실은 간접비</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>위문금은 간접비</u>. · <u>생산손실은 간접비</u>.</p><p>가르는 물음 하나 — <strong>산재보험에서 나오는 돈인가</strong>. <strong>「위문금」·「조의금」처럼 회사가 마음으로 주는 돈은 간접비</strong>다. 총 손실은 <strong>직접비의 5배</strong>다.<br>가르는 물음 하나 — <strong>산재보험에서 나오는 돈인가</strong>. <strong>「생산」·「손실」·「위문금」</strong>이 붙으면 간접비다. 총 손실은 <strong>직접비의 5배</strong>다.</p><div style=\"margin:12px 0 2px;font-weight:700\">하인리히 방식의 직접비와 간접비</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">직접비 (산재보험 급여)</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">간접비</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">무엇</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>법으로 정해 지급되는 보상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>그 밖의 모든 손실</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">보기</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>요양급여 · 휴업급여 · 장해급여 · 유족급여 · 장례비 · 상병보상연금 · 간병급여 · 직업재활급여</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>병상위문금</u> · 시간손실 · 생산중단 · 기계손실 · 신규채용과 교육 · 소송비</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">비율</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>4</u></td></tr></tbody></table></div><p><em>근거 — 하인리히의 재해손실비</em></p>", "nq": 4}, "card_mgt_t176": {"kind": "용어형", "fq": 1, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "하인리히의 도미노 이론", "front": "하인리히의 도미노 이론이란?", "back": "<ul><li><strong>제3단계 불안전한 행동과 상태</strong>다. <strong>이 도미노 하나를 빼면 뒤가 넘어지지 않는다</strong>.</li><li><strong>사회적 환경과 유전적 요소 → 개인적 결함 → 불안전한 행동·상태 → 사고 → 재해</strong> 순이다.</li></ul><p><strong>◈ 암기</strong> <u>핵심은 제3단계</u>. · <u>사회적 환경 · 개인적 결함 · 불안전 행동 · 사고 · 재해</u>.</p><p>핵심은 <strong>「없앨 수 있는 도미노가 3단계뿐」</strong>이라는 것이다. <strong>1·2단계는 타고난 것이라 손대기 어렵고, 4·5단계는 이미 늦다</strong>. <strong>버드는 이를 뒤집어 1단계(관리)를 핵심</strong>으로 보았다.<br><strong>「먼 원인 → 사람 → 행동 → 사고 → 다침」</strong>으로 점점 가까워진다 — <strong>사고가 먼저고 재해(다침)가 나중</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">하인리히의 도미노 이론 5단계</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사회적 환경과 유전적 요소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">바꾸기 어렵다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>개인적 결함</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">바꾸기 어렵다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불안전한 행동과 불안전한 상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>직접원인 · 없앨 수 있다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사고</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>5</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>재해(상해)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t121": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "미니멀 컷셋과 미니멀 패스셋", "front": "미니멀 컷셋과 미니멀 패스셋은?", "back": "<ul><li><strong>미니멀 패스셋(minimal path set)</strong>이다. <strong>그 요소들이 모두 살아 있으면 시스템이 돌아가는</strong> 최소한의 집합이다.</li><li><strong>패스셋은 시스템을 살리는 조합</strong>이다. 나머지 셋은 모두 <strong>컷셋</strong>의 설명이다.</li><li><strong>미니멀 컷셋은 정상사상을 일으키는 최소한의 컷셋</strong>이다. 나머지 셋은 컷셋과 패스셋을 뒤바꿔 놓았다.</li></ul><p><strong>◈ 암기</strong> <u>컷은 고장, 패스는 정상</u>. · <u>컷셋은 위험성, 패스셋은 신뢰성</u>.</p><p><strong>컷은 자른다(고장), 패스는 지나간다(정상)</strong>로 새긴다. <strong>미니멀 컷셋은 위험의 크기, 미니멀 패스셋은 시스템의 신뢰성</strong>을 나타낸다.<br><strong>컷은 자른다(고장), 패스는 지나간다(정상)</strong>로 새긴다. <strong>보기 셋이 모두 「고장」쪽</strong>을 말하고 있으므로 나머지 하나가 답이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">컷셋과 패스셋</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">컷셋(cut set)</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">패스셋(path set)</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">무엇</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>모두 일어나면 정상사상이 일어나는</u> 기본사상의 집합</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>모두 일어나지 않으면 정상사상이 일어나지 않는</u> 기본사상의 집합</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">뜻</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시스템을 고장 내는 조합</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>시스템을 살리는 조합</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">최소</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>미니멀 컷셋 — 위험의 크기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>미니멀 패스셋 — 신뢰성</u></td></tr></tbody></table></div>", "nq": 5}, "card_erg_t078": {"kind": "단답형", "fq": 3, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "FTA 의 수정게이트", "front": "FTA 의 수정게이트는?", "back": "<ul><li><strong>배타적 OR 게이트</strong>다. <strong>둘 이상이 겹치면 출력이 나오지 않는다</strong>는 조건이 붙는다.</li><li><strong>조합 AND 게이트</strong>다. <strong>입력 여러 개 가운데 정해진 수 이상이 일어나면</strong> 출력이 난다는 조건이 옆의 육각형에 적힌다.</li><li><strong>조합 AND 게이트</strong>다. <strong>「n개 중 k개가 일어나면」</strong>이라는 조건이 붙는다.</li></ul><p><strong>◈ 암기</strong> <u>동시에 겹치면 안 되면 배타적 OR</u>. · <u>AND 몸통에 옆 조건이면 조합 AND</u>.</p><p>수정게이트는 <strong>AND 나 OR에 조건을 덧붙인 것</strong>이다. 육각형 안에 조건을 적어 옆에 매단다.<br><strong>그림의 몸통이 AND 모양(아래가 평평한 반원)인지 OR 모양(위가 둥근 방패꼴)인지</strong>를 먼저 보고, <strong>옆에 붙은 육각형이 무슨 조건인지</strong>로 갈린다. 이 그림은 <strong>AND 몸통 + 옆 조건</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">FTA의 수정게이트</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><t u>한국산업안전보건공단</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제출 시기 — 제조업</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>해당 작업 시작 15일 전까지</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제출 시기 — 건설업</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>해당 공사 착공 전날까지</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>부수</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>2부</u></td></tr></tbody></table></div><p><em>근거 — 산업안전보건법 시행규칙 제42조</em></p>", "nq": 1}, "card_erg_t173": {"kind": "용어형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "", "mid": "인간공학의 기대효과", "front": "인간공학의 기대효과란?", "back": "<ul><li><strong>노사 간 신뢰는 저하가 아니라 향상</strong>된다. 방향이 반대다.</li><li>신뢰는 <strong>높아진다</strong>. <strong>「저하」가 아니다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>신뢰는 향상</u>. · <u>인간공학은 노사 신뢰를 높인다</u>.</p><p><strong>좋은 것은 늘고(질 · 안전 · 생산성 · 신뢰), 나쁜 것은 줄어야(산재 · 이직률 · 손실시간)</strong>한다. 보기 ①만 <strong>좋은 것을 줄인다</strong>고 해 놓았다.<br><strong>보기 셋이 모두 좋아지는 쪽</strong> 인데 <strong>하나만 나빠지는 쪽</strong>이다 — <strong>사람을 위하는 일이 노사 신뢰를 떨어뜨릴 까닭이 없다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">인간공학 적용의 기대효과</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">효과</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>작업자의 건강과 안전 향상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>산재와 직업병 감소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>작업손실시간의 감소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>이직률과 결근율의 감소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제품과 작업의 질 향상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>생산성 향상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>노사 간의 신뢰 향상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>「저하」가 아니다</u></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t174": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "FTA(결함수분석)", "front": "FTA(결함수분석)은?", "back": "<strong>FTA</strong>다. <strong>정상사상(결과)에서 시작해 아래로 원인을 캐 내려간다</strong>.<p><strong>◈ 암기</strong> <u>FTA는 하향식 연역</u>.</p><p><strong>FTA 만 하향식·연역적</strong>이고 나머지는 대체로 상향식·귀납적이다. <strong>「일반에서 개별로」가 연역, 「개별에서 일반으로」가 귀납</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">위험분석 기법의 방향</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방향</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">성격</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇에서 시작하나</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>FTA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>하향식(top-down)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>연역적 · 정량적</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>결과(정상사상)에서</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>FMEA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>상향식(bottom-up)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>귀납적 · 정성적</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>부품의 고장에서</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>ETA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>상향식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>귀납적 · 정량적</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>초기 사건에서</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>HAZOP</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>—</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정성적</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가이드워드로 훑는다</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t175": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "시스템 위험분석", "mid": "시스템 안전(system safety)", "front": "시스템 안전(system safety)는?", "back": "시스템 안전은 <strong>시행착오를 겪기 전에 미리 따져 보는</strong> 방법이다. <strong>한 번의 실패도 용납되지 않는 분야에서 나왔다</strong>.<p><strong>◈ 암기</strong> <u>시행착오 전에 미리 따진다</u>.</p><p><strong>미사일과 우주선은 시행착오로 배울 수 없다</strong> — 한 번 실패하면 끝이다. 그래서 <strong>설계 단계에서 미리 위험을 따지는</strong> 방법이 태어났다. <strong>「시행착오」는 그 정신과 정반대</strong>다.</p>", "nq": 1}, "card_erg_t176": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "보전예방(MP)", "front": "보전예방(MP)는?", "back": "<strong>보전예방(MP, maintenance prevention)</strong>이다. <strong>설계 단계에서 아예 고장 나지 않게</strong> 만든다.<p><strong>◈ 암기</strong> <u>설계 단계면 보전예방</u>.</p><p><strong>「설계 단계에서」</strong>라는 말이 보전예방을 가리킨다. <strong>고장이 난 뒤에 손보는 것이 아니라, 애초에 고장 날 일을 없앤다</strong>는 점에서 가장 앞선 방식이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">보전의 갈래</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보전</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">언제·무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>보전예방(MP)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>설계 단계에서 보전이 필요 없게 만든다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 앞선다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>예방보전(PM)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>고장 나기 전에 미리 점검·교체</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">마모고장 대책</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>개량보전(CM)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>고장 난 뒤 더 낫게 고친다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>사후보전(BM)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>고장 난 뒤 고친다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>생산보전(PM)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위 넷을 아우르는 큰 틀</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t177": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "지수분포의 신뢰도", "front": "지수분포의 신뢰도의 식은?", "back": "$R = e^{-\\lambda t}$에서 $0.95 = e^{-8 {,} 000 \\lambda}$다. 양변에 자연로그를 취하면 $\\ln 0.95 =-0.0513 =-8 {,} 000 \\lambda$이므로 $\\lambda = 6.4 \\times 10^{-6}$ /시간이다.<p><strong>◈ 암기</strong> $\\lambda =-\\ln R \\div t$.</p><p>$R = e^{-\\lambda t}$를 뒤집으면 $\\lambda =-\\dfrac{\\ln R}{t}$다. $\\ln 0.95 \\fallingdotseq - 0.0513$이라는 값만 알면 한 줄로 끝난다. <strong>평균수명 </strong>$\\mathrm{MTBF} = 1 / \\lambda$도 함께 나온다.</p>", "nq": 1}, "card_erg_t164": {"kind": "용어형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "인체측정치의 응용 원리", "front": "인체측정치의 응용 원리란?", "back": "<ul><li>거꾸로다. <strong>넓이는 큰 사람에게(최대집단값), 깊이는 작은 사람에게(최소집단값)</strong> 맞춘다.</li><li><strong>의자 너비만 최대 집단치</strong>다. 나머지 셋은 모두 조절식이거나 최소 집단치로 잡는다.</li><li><strong>최대 집단치</strong>다. <strong>가장 큰 사람도 넘거나 빠져나가지 못하게</strong> 해야 한다.</li></ul><p><strong>◈ 암기</strong> <u>너비는 큰 사람, 깊이는 작은 사람</u>. · <u>너비는 최대, 깊이는 최소, 높이는 조절식</u>.</p><p>원칙은 하나 — <strong>모자라면 곤란한 치수는 큰 사람에게, 넘치면 곤란한 치수는 작은 사람에게</strong> 맞춘다. <strong>너비는 넓어도 탈이 없지만 깊이는 깊으면 오금이 눌려</strong> 탈이 난다.<br>원칙은 하나 — <strong>모자라면 곤란하면 큰 사람에게, 넘치면 곤란하면 작은 사람에게, 맞출 수 있으면 조절식</strong>이다. <strong>너비는 넓어도 탈이 없지만 깊이는 깊으면 오금이 눌린다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">의자 좌판의 설계 기준</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">치수</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">맞추는 대상</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>좌판의 너비</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>큰 사람</u> (최대집단값)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>넓으면 작은 사람도 앉을 수 있다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>좌판의 깊이</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작은 사람</u> (최소집단값)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>깊으면 작은 사람의 오금이 눌린다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>좌판의 높이</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작은 사람</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">발이 바닥에 닿아야 한다</td></tr></tbody></table></div>", "nq": 3}, "card_erg_t178": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "작업대 높이의 설계", "front": "작업대 높이의 설계는?", "back": "<strong>팔꿈치 높이보다 15 ~ 20 [cm] 낮게</strong> 잡는다. <strong>힘을 쓰려면 팔을 아래로 뻗을 수 있어야</strong> 한다.<p><strong>◈ 암기</strong> <u>중작업은 팔꿈치보다 낮게</u>.</p><p>기준은 언제나 <strong>팔꿈치 높이</strong>다. <strong>정밀할수록 높게(눈 가까이), 힘을 쓸수록 낮게(체중을 싣게)</strong>라는 흐름으로 잡는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">작업의 종류와 작업대 높이</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">작업</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">작업대 높이</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정밀작업</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>팔꿈치 높이보다 5 ~ 10 [cm] 높게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>눈에 가까이</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>보통(경)작업</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>팔꿈치 높이와 같게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>중(重)작업</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>팔꿈치 높이보다 10 ~ 20 [cm] 낮게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>힘을 싣기 좋게</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t048": {"kind": "단답형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "작업환경관리", "mid": "실효온도(감각온도)", "front": "실효온도(감각온도)는?", "back": "<ul><li>실효온도는 <strong>온도 · 습도 · 공기 유동</strong> 세 가지로 정해진다. <strong>복사열은 들어가지 않는다</strong>. 복사열까지 넣은 것은 <strong>수정 실효온도(CET)</strong>다.</li><li><strong>실효온도(감각온도, effective temperature)</strong>다. <strong>온도 · 습도 · 기류</strong> 세 가지를 하나로 묶은 지수다.</li><li>실효온도는 <strong>몸의 온도가 아니라 둘레 환경의 온도</strong>를 다룬다. <strong>체온계로 입안을 재는</strong> 것과 관계없다.</li></ul><p><strong>◈ 암기</strong> <u>실효온도에 복사열은 없다</u>. · <u>온도 · 습도 · 기류 셋이면 실효온도</u>.</p><p><strong>실효온도는 셋, 수정 실효온도는 넷</strong>이다. 옥외 작업의 WBGT에 건구온도가 들어가는 것과 같은 이치로, <strong>햇볕(복사열)이 있으면 항목이 하나 늘어난다</strong>.<br><strong>「온도 · 습도 · 기류 셋을 묶었다」</strong>는 말이 실효온도를 가리킨다. <strong>옥스포드 지수와 불쾌지수는 기류를 넣지 않는다</strong>는 점에서 갈린다.</p><div style=\"margin:12px 0 2px;font-weight:700\">온열지수</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">지수</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 묶었나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>실효온도(감각온도)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>온도 · 습도 · 기류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>상대습도 100 [%] 기준</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>옥스포드 지수 WD</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>건구 · 습구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$0.85 W + 0.15 D$</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>WBGT</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>자연습구 · 흑구 · (건구)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">복사열까지</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>불쾌지수</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>건구 · 습구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>열압박지수 HSI</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>필요 발한량 대비 최대 발한량</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 3}, "card_erg_t179": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "밀러(Miller)의 매직넘버", "front": "밀러(Miller)의 매직넘버는?", "back": "<strong>7 ± 2</strong>다. <strong>밀러(Miller)의 매직넘버</strong>라 한다.<p><strong>◈ 암기</strong> <u>매직넘버는 7 ± 2</u>.</p><p><strong>사람이 한 번에 머릿속에 담을 수 있는 항목은 대여섯에서 아홉 남짓</strong>이다. 그래서 <strong>전화번호를 마디로 끊고, 메뉴를 일곱 개 안팎으로</strong> 만든다.</p><div style=\"margin:12px 0 2px;font-weight:700\">절대식별의 한계</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">한계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>매직넘버(밀러)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>7 ± 2 (5 ~ 9)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>단기기억의 항목 수</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>순음의 절대식별</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>약 5개</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr>< dding:7px 12px;vertical-align:middle;text-align:center;\"><u>전반조명</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작업장 전체를 고르게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">일반 사무실</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>국부적 전반조명</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>구역별로 다르게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>완화조명</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>밝기가 갑자기 바뀌지 않게 사이를 이어 준다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">터널 입구</td></tr></tbody></table></div>", "nq": 1}, "card_erg_t183": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "템퍼 프루프(temper proof)", "front": "템퍼 프루프(temper proof)는?", "back": "<strong>템퍼 프루프(temper proof)</strong>다. <strong>일부러 손대어 무력화하는 것까지 막는</strong> 설계다.<p><strong>◈ 암기</strong> <u>일부러 떼는 것까지 막으면 템퍼 프루프</u>.</p><p>세 개념이 <strong>기계가 고장 나도(fail safe) · 사람이 몰라도(fool proof) · 사람이 일부러 해도(temper proof)</strong> 안전하도록 한 단계씩 나아간다.</p><div style=\"margin:12px 0 2px;font-weight:700\">안전설계의 세 개념</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">개념</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 막나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>페일 세이프(fail safe)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>고장이 나도 안전한 쪽으로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">기계의 고장</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>풀 프루프(fool proof)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>모르고 잘못 다루어도 안전하게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사람의 실수</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>템퍼 프루프(temper proof)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>일부러 떼어 내지 못하게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사람의 고의</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t184": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "청각적 표시장치의 설계", "front": "청각적 표시장치의 설계는?", "back": "장애물을 돌아가야 할 때도 <strong>낮은 주파수</strong>를 써야 한다. <strong>파장이 길어야 잘 휘어 돈다(회절)</strong>.<p><strong>◈ 암기</strong> <u>멀리도 돌아서도 낮은 주파수</u>.</p><p><strong>멀리 가는 것도 돌아가는 것도 모두 낮은 주파수</strong>다. <strong>천둥소리가 멀리서도 「우르릉」 낮게 들리는</strong> 것이 그 예다. <strong>「돌아갈 때만 높게」</strong>로 바꿔 놓은 것이 보기 ③이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">청각적 표시장치의 주파수 선택</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">상황</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">주파수</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>멀리 보낼 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>낮게 (1,000 [Hz] 이하)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>멀리 갈수록 고음이 먼저 줄어든다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>장애물을 돌아갈 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>낮게 (500 [Hz] 이하)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>파장이 길어야 잘 휘어 돈다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>배경 소음이 있을 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>소음과 다른 주파수로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>주의를 끌 때</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>변조하거나 단속음으로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_mac_t087": {"kind": "공식형", "fq": 1, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "연삭숫돌의 플랜지", "front": "연삭숫돌의 플랜지의 식은?", "back": "<ul><li>평형플랜지의 지름은 <strong>숫돌 지름의 1/3 이상</strong> 이어야 한다. $180 / 3 = 60$ [mm]다.</li><li>플랜지 지름은 <strong>숫돌 바깥지름의 1/3 이상</strong>이므로 $150 \\times 1 / 3 = 50$ [mm]다.</li><li>플랜지 지름은 <strong>숫돌 바깥지름의 1/3 이상</strong>이므로 $300 \\times 1 / 3 = 100$ [mm]다.</li></ul><p><strong>◈ 암기</strong> <u>숫돌 지름의 1/3 이상</u>. · <u>플랜지는 숫돌 지름의 1/3 이상</u>.</p><p>플랜지가 작으면 <strong>숫돌을 잡아 주는 면이 좁아 깨지기 쉽다</strong>. 연삭기의 숫자 — <strong>플랜지 1/3 이상 · 덮개는 지름 5 [cm] 이상인 숫돌에 · 작업 전 1분, 교체 후 3분 시운전</strong>.<br><strong>플랜지는 숫돌 지름의 1/3 이상</strong>이라야 숫돌을 제대로 붙들어 파괴를 막는다. 연삭기는 이 밖에 <strong>작업 시작 전 1분, 숫돌 교체 뒤 3분 시운전</strong>과 <strong>최고사용 원주속도 초과 금지</strong>가 함께 나온다.</p><p><em>근거 — 안전보건규칙 제120조</em></p>", "nq": 4}, "card_mac_t149": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "드릴작업의 안전수칙", "front": "드릴작업의 안전수칙은?", "back": "<ul><li>작은 물건은 <strong>플라이어가 아니라 바이스로 고정</strong>해야 한다. 손으로 쥐는 공구로 무는 순간 <strong>일감이 함께 돌아가며 손을 친다</strong>.</li><li><strong>척 렌치를 빼고 시작</strong>해야 한다. <strong>꽂아 둔 채 돌리면 렌치가 튕겨 나가</strong> 사람을 친다.</li></ul><p><strong>◈ 암기</strong> <u>작은 일감은 바이스로 고정</u>. · <u>척 렌치는 반드시 뺀다</u>.</p><p>원칙은 하나 — <strong>일감은 반드시 바이스나 클램프로 고정</strong>한다. <strong>손으로 잡거나 플라이어로 무는 것</strong>은 모두 금지다. <strong>장갑을 끼지 않는다</strong>도 함께 나온다.<br>네 보기가 <strong>드릴 작업의 3금기(장갑 · 손으로 잡기 · 손 넣기)</strong>와 <strong>1필수(척 렌치 빼기)</strong>로 짜여 있다. <strong>회전하는 기계 앞에서는 손과 옷을 멀리</strong>라는 한 가지다.</p>", "nq": 2}, "card_mac_t064": {"kind": "단답형", "fq": 2, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "압력제한스위치", "front": "압력제한스위치는?", "back": "<ul><li><strong>압력제한스위치</strong>다. <strong>압력이 오르면 버너의 불을 끄는</strong> 장치다. <strong>압력방출장치는 넘친 압력을 밖으로 빼는</strong> 것이라 역할이 다르다.</li><li><strong>압력제한스위치</strong>다. <strong>버너 연소를 차단</strong> 한다는 말이 이 장치를 가리킨다.</li><li><strong>압력제한스위치</strong>다. <strong>「버너 연소를 차단」</strong>이라는 말이 이 장치를 가리킨다.</li></ul><p><strong>◈ 암기</strong> <u>불을 끄면 압력제한, 빼내면 압력방출</u>. · <u>버너를 끄면 압력제한스위치</u>.</p><p>순서로 보면 <strong>압력제한스위치가 먼저 불을 끄고, 그래도 오르면 압력방출장치가 열린다</strong>. <strong>앞의 것은 예방, 뒤의 것은 최후 수단</strong>이다.<br><strong>「버너 연소를 차단」이면 압력제한스위치, 「밖으로 뿜어낸다」면 압력방출장치</strong>다. 조문의 이 한 구절만으로 두 -align:middle;text-align:center;\"><u>가공물이 길면 심압대로 지지한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>일감의 길이가 지름의 12배 이상이면 방진구를 쓴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>5배가 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>칩 브레이커로 칩이 길게 이어지지 않게 한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 6}, "card_mac_t125": {"kind": "공식형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "가드 개구부 간격(ISO 및 안전인증 기준)", "front": "가드 개구부 간격(ISO 및 안전인증 기준)의 식은?", "back": "<ul><li>비전동체이므로 $Y = 6 + 0.15 X = 6 + 0.15 \\times 60 = 6 + 9 = 15$ [mm]다.</li><li>풀리는 <strong>전동체</strong>이므로 $Y = 6 + 0.15 X = 6 + 0.15 \\times 50 = 13.5$ [mm]다.</li></ul><p><strong>◈ 암기</strong> <u>비전동체는 </u>$6 + 0.15 X$. · <u>전동체는 </u>$6 + 0.15 X$.</p><p><strong>6 [mm]는 손가락이 들어가지 못하는 최소값</strong>이고, <strong>거리에 비례해 조금씩 넓혀 준다</strong>. <strong>전동체는 0.1, 비전동체는 0.15</strong>라는 계수 차이가 갈림길이다.<br><strong>6 [mm]는 손가락이 들어가지 못하는 최소값</strong>이고, <strong>거리에 비례해 조금씩 넓혀 준다</strong>. 계수는 <strong>전동체 0.15, 비전동체 0.1</strong>로 <strong>전동체 쪽이 크다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">가드 개구부 간격의 식</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">적용</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험점이 전동체</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$Y = 6 + 0.1 X$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$X &lt; 760$<u> [mm] 일 때</u></td></tr><tr><td rowspan=\"2\" style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험점이 비전동체</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$Y = 6 + 0.15 X$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$X &lt; 160$<u> [mm] 일 때</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$Y = 30$<u> [mm]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$X \\ge 160$ [mm] 이면</td></tr></tbody></table></div>", "nq": 2}, "card_mac_t135": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "프레스·전단기", "mid": "급정지장치의 조작부", "front": "급정지장치의 조작부는?", "back": "<ul><li>무릎조작식은 <strong>밑면에서 0.6 [m] 이내</strong>다. 0.8 [m]가 아니다.</li><li><strong>「어깨조작식」</strong>은 없다. 셋은 <strong>손 · 복부 · 무릎</strong> 조작식이다.</li><li><strong>밑면에서 0.8 [m] 이상 1.1 [m] 이내</strong>다. <strong>배 높이</strong>에 맞춘 값이다.</li></ul><p><strong>◈ 암기</strong> <u>손 1.8 · 복부 0.8~1.1 · 무릎 0.6</u>. · <u>손 · 복부 · 무릎</u> 셋.</p><p><strong>손(1.8) → 배(0.8 ~ 1.1) → 무릎(0.6)</strong> 순으로 <strong>몸의 높이를 따라 내려간다</strong>. <strong>복부의 아래끝 0.8을 무릎 값으로 옮겨 놓는 것</strong>이 이 문항의 함정이다.<br>셋이 <strong>손(1.8) → 배(0.8 ~ 1.1) → 무릎(0.6)</strong>으로 <strong>몸의 높이를 따라 내려간다</strong>. <strong>말려 들어가는 순간 어느 부위로든 칠 수 있게</strong> 세 높이에 둔 것이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">롤러기 급정지장치 조작부의 위치 (규칙 제148조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">설치 위치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>손 조작식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>밑면에서 1.8 [m] 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>복부 조작식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>밑면에서 0.8 [m] 이상 1.1 [m] 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무릎 조작식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>밑면에서 0.6 [m] 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.8 [m]가 아니다</u></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제148조</em></p>", "nq": 3}, "card_mac_t008": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "광전자식 방호장치", "front": "광전자식 방호장치는?", "back": "<ul><li>전원전압 변동에 대한 허용 범위는 <strong>±(100분의 20)</strong>이다. 100분의 10이 아니다. 현장의 전압은 생각보다 크게 흔들리므로, 방호장치가 그 정도 변동에는 흔들림 없이 작동해야 한다는 뜻이다.</li><li><strong>핀 클러치는 확동식</strong>이라 급정지기구가 없다. <strong>광전자식은 마찰식 클러치 프레스에만</strong> 쓸 수 있다.</li></ul><p><strong>◈ 암기</strong> <u>±20 [%]</u> — 100분의 10이 아니다. · <u>광전자식은 마찰식 클러치에만</u>.</p><p>산업안전보건법 제84조(안전인증), 「방호장치 안전인증 고시」. <u>±20 [%]</u>라는 숫자가 갈림길이다. 광전자식은 <u>확동식 클러치 프레스에는 쓸 수 없다</u>는 점도 함께 외운다. 한 번 물리면 멈출 수 없기 때문이다.<br><strong>광전자식은 「손이 들어오면 멈춘다」</strong>는 장치라 <strong>멈출 수 있는 기계(마찰식 클러치)</strong>라야 뜻이 있다. <strong>핀 클러치(확동식)는 한 번 내려오면 못 멈춘다</strong>.</p><p><em>근거 — 방호장치 안전인증 고시</em></p>", "nq": 2}, "card_mac_t119": {"kind": "단답형", "fq": 3, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "비파괴검사(NDT)", "front": "비파괴검사(NDT)는?", "back": "<ul><li><strong>피로시험</strong>은 <strong>하중을 되풀이 걸어 부러뜨리는</strong> 파괴시험이다.</li><li><strong>인장시험</strong>은 시편을 <strong>잡아당겨 끊는</strong> 파괴시험이다.</li></ul><p><strong>◈ 암기</strong> <u>피로시험은 파괴시험</u>. · <u>인장시험은 파괴시험</u>.</p><p><strong>「~탐상」과 「~투과」가 붙으면 비파괴</strong>, <strong>「인장 · 압축 · 굽힘 · 충격 · 피로 · 경도」는 파괴</strong> 시험이다(경도는 흠집만 내므로 준파괴로 보기도 한다). <strong>안을 보려면 RT·UT, 겉을 보려면 MT·PT</strong>다.<br><strong>「~탐상」·「~투과」는 비파괴</strong>, <strong>「인장 · 압축 · 굽힘 · 충격 · 피로」는 파괴</strong> 시험이다. 비파괴는 <strong>RT · UT · MT · PT · ET · AE</strong> 여섯을 잡아 둔다.</p><div style=\"margin:12px 0 2px;font-weight:700\">비파괴검사의 종류</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기호</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">찾을 수 있는 결함</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>RT</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>방사선투과시험</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>내부 결함</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>UT</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>초음파탐상시험</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>내부 결함</u> · 두께 측정</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>MT</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>자분탐상시험</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>표면과 표면 바로 아래</u> · 강자성체만</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>PT</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>침투탐상시험</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>표면에 열린 결함</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>ET</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>와류탐상시험</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">표면 · 도전성 재료</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>AE</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>음향방출시험</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">진행 중인 균열</td></tr></tbody></table></div>", "nq": 3}, "card_mac_t151": {"kind": "공식형", "fq": 3, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "광전자식 방호장치의 안전거리", "front": "광전자식 방호장치의 안전거리의 식은?", "back": "<ul><li>$D = 1.6 ( T_{l} + T_{s} )$에서 $96 = 1.6 \\times ( 40 + T_{s} )$다. $40 + T_{s} = 60$이므로 $T_{s} = 20$ [ms]다.</li><li>$D = 1 {,} 600 ( T_{c} + T_{s} ) = 1 {,} 600 \\times ( 0.05 + 0.15 ) = 320$ [mm]다.</li></ul><p><strong>◈ 암기</strong> $D = 1.6 ( T_{l} + T_{s} )$. · $D = 1 {,} 600 ( T_{c} + T_{s} )$.</p><p><strong>1.6은 사람 손이 움직이는 속도 1.6 [m/s]</strong>에서 나왔다. <strong>[ms]를 넣으면 [mm]가 나오도록</strong> 단위가 맞춰져 있어 환산이 필요 없다.<br><strong>두 시간을 반드시 더해야</strong> 한다 — <strong>하나만 넣으면 160 이나 240이 나와 보기에 그대로 놓여</strong> 있다. <strong>「총 소요시간」</strong>이라는 점을 놓치지 않는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">프레스 방호장치의 안전거리</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방호장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">안전거리 식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>광전자식(감응식)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$D = 1.6 ( T_{l} + T_{s} )$ [mm]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$T$<u>는 [ms]</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>양수조작식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$D = 1.6 ( T_{l} + T_{s} )$ [mm]</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-al
