;\"><u>「4개소 미만」이 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>와이어로프와 그 고정부위는 충분한 강도와 장력을 갖도록 할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>와이어로프가 가공전선에 근접하지 않도록 할 것</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "w": "① 전용 지지프레임을 사용하는 것은 맞다.<br>③ 고정부위가 충분한 강도와 장력을 갖도록 하는 것도 맞다.<br>④ 가공전선에 근접하지 않도록 하는 것도 맞다.", "pt": "<strong>안전보건규칙 제142조 — 타워크레인의 지지</strong><br><strong>각도가 클수록 옆으로 잡아 주는 힘이 작아진다</strong>. 그래서 <strong>60° 이내</strong>로 눕혀 잡고, <strong>네 방향 이상</strong>에서 붙든다. 11회 120번의 <strong>버팀줄 3개 이상</strong>과 같은 이치다.<p><strong>◈ 암기</strong> <u>60° 이내, 지지점 4개소 이상</u>.</p>", "law": "<details class=law><summary>⚖ 근거 법령 — 산업안전보건기준에 관한 규칙 제142조<span class=eff>산업안전보건기준에 관한 규칙 시행 2026. 3. 2.</span></summary><div class=lawin><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C142%EC%A1%B0\" target=\"_blank\">제142조(타워크레인의 지지)</a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.</span></div><div class=t><div class=ln>① 사업주는 타워크레인을 자립고(自立高) 이상의 높이로 설치하는 경우 건축물 등의 벽체에 지지하도록 하여야 한다. 다만, 지지할 벽체가 없는 등 부득이한 경우에는 와이어로프에 의하여 지지할 수 있다. &lt;개정 2013.3.21&gt;</div><div class=ln>② 사업주는 타워크레인을 벽체에 지지하는 경우 다음 각 호의 사항을 준수하여야 한다. &lt;개정 2019.1.31, 2019.12.26&gt;</div><div class=ln> 1. 「산업안전보건법 시행규칙」 제110조제1항제2호에 따른 서면심사에 관한 서류(「건설기계관리법」 제18조에 따른 형식승인서류를 포함한다) 또는 제조사의 설치작업설명서 등에 따라 설치할 것</div><div class=ln> 2. 제1호의 서면심사 서류 등이 없거나 명확하지 아니한 경우에는 「국가기술자격법」에 따른 건축구조ㆍ건설기계ㆍ기계안전ㆍ건설안전기술사 또는 건설안전분야 산업안전지도사의 확인을 받아 설치하거나 기종별ㆍ모델별 공인된 표준방법으로 설치할 것</div><div class=ln> 3. 콘크리트구조물에 고정시키는 경우에는 매립이나 관통 또는 이와 같은 수준 이상의 방법으로 충분히 지지되도록 할 것</div><div class=ln> 4. 건축 중인 시설물에 지지하는 경우에는 그 시설물의 구조적 안정성에 영향이 없도록 할 것</div><div class=ln>③ 사업주는 타워크레인을 와이어로프로 지지하는 경우 다음 각 호의 사항을 준수해야 한다. &lt;개정 2013.3.21, 2019.10.15, 2022.10.18&gt;</div><div class=ln> 1. 제2항제1호 또는 제2호의 조치를 취할 것</div><div class=ln> 2. 와이어로프를 고정하기 위한 전용 지지프레임을 사용할 것</div><div class=\"ln hit\"> 3. <mark>와이어로프 설치각도는 수평면에서</mark> 60도 이내로 하되, 지지점은 <mark>4개소 이상</mark>으로 하고, 같은 각도로 설치할 것<span class=here>이 문항이 묻는 자리</span></div><div class=ln> 4. 와이어로프와 그 고정부위는 충분한 강도와 장력을 갖도록 설치하고, 와이어로프를 클립ㆍ샤클(shackle, 연결고리) 등의 고정기구를 사용하여 견고하게 고정시켜 풀리지 않도록 하며, 사용 중에는 충분한 강도와 장력을 유지하도록 할 것. 이 경우 클립ㆍ샤클 등의 고정기구는 한국산업표준 제품이거나 한국산업표준이 없는 제품의 경우에는 이에 준하는 규격을 갖춘 제품이어야 한다.</div><div class=ln> 5. 와이어로프가 가공전선(架空電線)에 근접하지 않도록 할 것</div></div></div></div></details>", "card": "card_con_t078"}, {"n": 118, "s": 6, "a": 4, "lv": 2, "fq": 1, "kind": "개념형", "t": "크레인 등 건설장비의 가공전선로 접근 시 안전대책으로 거리가 먼 것은?", "c": ["안전 이격거리를 유지하고 작업한다.", "장비의 조립, 준비시부터 가공전선로에 대한 감전 방지 수단을 강구한다.", "장비 사용 현장의 장애물, 위험물 등을 점검 후 작업계획을 수립한다.", "장비를 가공전선로 밑에 보관한다."], "cond": "", "img": "", "sol": "<strong>전선로 밑에 장비를 세워 두면</strong> 붐이 스치거나 바람에 흔들려 <strong>감전과 아크의 위험</strong>이 있다.", "w": "① 안전 이격거리를 유지하는 것은 옳은 대책이다.<br>② 조립·준비 때부터 감전 방지 수단을 마련하는 것도 그렇다.<br>③ 장애물과 위험물을 점검한 뒤 작업계획을 세우는 것도 그렇다.", "pt": "<strong>가공전선로 부근의 건설장비 작업</strong><br>세 대책이 모두 <strong>전선에서 멀리 떨어져 있게</strong> 한다. 보기 ④는 <strong>아예 그 아래에 두겠다</strong>는 것이라 정반대다. <strong>22.9 [kV]는 접근한계거리 90 [cm]</strong>다.<p><strong>◈ 암기</strong> <u>전선로 밑에 두지 않는다</u>.</p>", "law": "", "card": "card_con_t153"}, {"n": 119, "s": 6, "a": 2, "lv": 2, "fq": 2, "kind": "개념형", "t": "건설업 중 교량건설 공사의 경우 유해위험방지계획서를 제출하여야 하는 기준으로 옳은 것은?", "c": ["최대지간 길이가 40m 이상인 교량건설시", "최대지간 길이가 50m 이상인 교량건설시", "최대지간 길이가 60m 이상인 교량건설시", "최대지간 길이가 70m 이상인 교량건설시"], "cond": "", "img": "", "sol": "<strong>최대 지간길이 50 [m] 이상</strong>이다.<div style=\"margin:12px 0 2px;font-weight:700\">건설공사 계획서 제출 대상 (영 제42조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">대상 공사</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>지상높이 31 [m] 이상인 건축물 또는 인공구조물</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>31 [m]</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>연면적 3만 [㎡] 이상인 건축물</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>3만 [㎡]</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>연면적 5천 [㎡] 이상인 문화·집회시설, 판매·운수시설, 종합병원, 관광숙박시설, 지하도상가, 냉동·냉장 창고시설</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>5천 [㎡]</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>최대 지간길이 50 [m] 이상인 교량 건설공사</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>터널 건설공사</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">크기와 무관</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>다목적댐·발전용댐, 저수용량 2천만 [t] 이상의 용수 전용댐</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>깊이 10 [m] 이상인 굴착공사</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>10 [m]</u></td></tr></tbody></table></div>", "w": "① 40 [m]라는 기준은 없다.<br>③ 60 [m] 도 아니다.<br>④ 70 [m] 도 아니다.", "pt": "<strong>산업안전보건법 시행령 제42조 — 유해위험방지계획서 제출 대상 건설공사</strong><br>숫자를 묶어 둔다 — <strong>31 [m] · 3만 [㎡] · 5천 [㎡] · 50 [m] · 10 [m] · 2천만 [t]</strong>. <strong>「최대 지간길이」는 교각과 교각 사이의 가장 긴 거리</strong>를 말한다.<p><strong>◈ 암기</strong> <u>교량은 최대 지간길이 50 [m]</u>.</p>", "law": "<details class=law><summary>⚖ 근거 법령 — 산업안전보건법 시행령 제42조<span class=eff>산업안전보건법 시행령 시행 2026. 8. 1.</span></summary><div class=lawin><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EB%B2%95%EC%8B%9C%ED%96%89%EB%A0%B9/%EC%A0%9C42%EC%A1%B0\" target=\"_blank\">제42조(유해위험방지계획서 제출 대상)</a><span class=eff>산업안전보건법 시행령 · 시행 2026. 8. 1.</span></div><div class=t><div class=ln>① 법 제42조제1항제1호에서 \"대통령령으로 정하는 사업의 종류 및 규모에 해당하는 사업\"이란 다음 각 호의 어느 하나에 해당하는 사업으로서 전기 계약용량이 300킬로와트 이상인 경우를 말한다.</div><div class=ln> 1. 금속가공제품 제조업; 기계 및 가구 제외</div><div class=ln> 2. 비금속 광물제품 제조업</div><div class=ln> 3. 기타 기계 및 장비 제조업</div><div class=ln> 4. 자동차 및 트레일러 제조업</div><div class=ln> 5. 식료품 제조업</div><div class=ln> 6. 고무제품 및 플라스틱제품 제조업</div><div class=ln> 7. 목재 및 나무제품 제조업</div><div class=ln> 8. 기타 제품 제조업</div><div class=ln> 9. 1차 금속 제조업</div><div class=ln> 10. 가구 제조업</div><div class=ln> 11. 화학물질 및 화학제품 제조업</div><div class=ln> 12. 반도체 제조업</div><div class=ln> 13. 전자부품 제조업</div><div class=ln>② 법 제42조제1항제2호에서 \"대통령령으로 정하는 기계ㆍ기구 및 설비\"란 다음 각 호의 어느 하나에 해당하는 기계ㆍ기구 및 설비를 말한다. 이 경우 다음 각 호에 해당하는 기계ㆍ기구 및 설비의 구체적인 범위는 고용노동부장관이 정하여 고시한다. &lt;개정 2021.11.19&gt;</div><div class=ln> 1. 금속이나 그 밖의 광물의 용해로</div><div class=ln> 2. 화학설비</div><div class=ln> 3. 건조설비</div><div class=ln> 4. 가스집합 용접장치</div><div class=ln> 5. 근로자의 건강에 상당한 장해를 일으킬 우려가 있는 물질로서 고용노동부령으로 정하는 물질의 밀폐ㆍ환기ㆍ배기를 위한 설비</div><div class=ln> 6. 삭제&lt;2021.11.19&gt;</div><div class=ln>③ 법 제42조제1항제3호에서 \"대통령령으로 정하는 크기 높이 등에 해당하는 건설공사\"란 다음 각 호의 어느 하나에 해당하는 공사를 말한다.</div><div class=ln> 1. 다음 각 목의 어느 하나에 해당하는 건축물 또는 시설 등의 건설ㆍ개조 또는 해체(이하 \"건설등\"이라 한다) 공사</div><div class=ln> 가. 지상높이가 31미터 이상인 건축물 또는 인공구조물</div><div class=ln> 나. 연면적 3만제곱미터 이상인 건축물</div><div class=ln> 다. 연면적 5천제곱미터 이상인 시설로서 다음의 어느 하나에 해당하는 시설</div><div class=ln> 1) 문화 및 집회시설(전시장 및 동물원ㆍ식물원은 제외한다)</div><div class=ln> 2) 판매시설, 운수시설(고속철도의 역사 및 집배송시설은 제외한다)</div><div class=ln> 3) 종교시설</div><div class=ln> 4) 의료시설 중 종합병원</div><div class=ln> 5) 숙박시설 중 관광숙박시설</div><div class=ln> 6) 지하도상가</div><div class=ln> 7) 냉동ㆍ냉장 창고시설</div><div class=ln> 2. 연면적 5천제곱미터 이상인 냉동ㆍ냉장 창고시설의 설비공사 및 단열공사</div><div class=\"ln hit\"> 3. 최대 지간(支間)길이(다리의 기둥과 기둥의 중심사이의 거리)가 <mark>50미터</mark> 이상인 다리의 건설등 공사<span class=here>이 문항이 묻는 자리</span></div><div class=ln> 4. 터널의 건설등 공사</div><div class=ln> 5. 다목적댐, 발전용댐, 저수용량 2천만톤 이상의 용수 전용 댐 및 지방상수도 전용 댐의 건설등 공사</div><div class=ln> 6. 깊이 10미터 이상인 굴착공사</div></div></div></div></details>", "card": "card_con_t025"}, {"n": 120, "s": 6, "a": 1, "lv": 2, "fq": 1, "kind": "개념형", "t": "백호우(Backhoe)의 운행방법에 대한 설명으로 옳지 않은 것은?", "c": ["경사로나 연약지반에서는 무한궤도식 보다는 타이어식이 안전하다.", "작업계획서를 작성하고 계획에 따라 작업을 실시하여야 한다.", "작업장소의 지형 및 지반상태 등에 적합한 제한속도를 정하고 운전자로 하여금 이를 준수하도록 하여야 한다.", "작업 중 승차석 외의 위치에 근로자를 탑승시켜서는 안 된다."], "cond": "", "img": "", "sol": "거꾸로다. <strong>경사로와 연약지반에서는 무한궤도식이 더 안전</strong>하다. <strong>접지면적이 넓어 덜 빠지고 덜 미끄러진다</strong>.<div style=\"margin:12px 0 2px;font-weight:700\">무한궤도식과 타이어식</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무한궤도식(크롤러)</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">타이어식(휠)</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">접지압</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>낮다(넓게 닿는다)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">연약지반·경사로</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안정적</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>빠지거나 미끄러지기 쉽다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">이동 속도</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>느리다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>빠르다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">도로 주행</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어렵다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>쉽다</u></td></tr></tbody></table></div>", "w": "② 작업계획서를 작성하고 그에 따라 작업하는 것은 맞다.<br>③ 지형과 지반에 맞는 제한속도를 정하는 것도 맞다.<br>④ 승차석 외에 근로자를 태우지 않는 것도 맞다.", "pt": "<strong>차량계 건설기계의 주행장치</strong><br><strong>넓게 닿을수록 덜 가라앉는다</strong> — 눈밭에서 스키가 빠지지 않는 것과 같은 이치다. 대신 <strong>무한궤도식은 느리고 도로 주행이 어렵다</strong>.<p><strong>◈ 암기</strong> <u>연약지반은 무한궤도식</u>.</p>", "law": "", "card": "card_con_t154"}], "cards": {"card_mgt_t154": {"kind": "용어형", "fq": 1, "subject": "안전관리론", "chapter": "", "mid": "성인학습의 원리", "front": "성인학습의 원리란?", "back": "성인교육은 <strong>간접경험이 아니라 직접 겪은 일에서 배운다</strong>. 네 원리는 <strong>자발학습 · 상호학습 · 참여교육 · 자기주도적 학습</strong>이다.<p><strong>◈ 암기</strong> <u>자발 · 상호 · 참여</u> 셋.</p><p>성인은 <strong>살아온 경험이 곧 학습 자원</strong>이므로 <strong>스스로 · 서로에게서 · 참여하며</strong> 배운다. <strong>「간접경험」은 어린이 교육의 방식</strong>에 가깝다.</p>", "nq": 1}, "card_mgt_t133": {"kind": "단답형", "fq": 1, "subject": "안전관리론", "chapter": "안전보건교육", "mid": "OJT 와 Off JT", "front": "OJT 와 Off JT는?", "back": "<ul><li><strong>직장의 실정에 맞는 구체적이고 실제적인 지도</strong>가 OJT의 장점이다. 나머지 셋은 모두 Off JT의 장점이다.</li><li><strong>훈련에만 전념할 수 있는</strong> 것이 Off JT의 장점이다. 일터를 떠나 있으므로 <strong>일에 끌려다니지 않는다</strong>.</li><li><strong>많은 지식과 경험을 주고받을 수 있는</strong> 것이 Off JT의 특징이다. <strong>여러 직장에서 모이기</strong> 때문이다.</li></ul><p><strong>◈ 암기</strong> <u>맞춤과 즉시는 OJT</u>. · <u>전념할 수 있으면 Off JT</u>.</p><p><strong>「많이 · 전문가 · 특별한 설비 · 교류」 넷은 모두 Off JT</strong>다. OJT의 장점은 <strong>「맞춤」과 「즉시」</strong> 두 낱말로 모인다.<br><strong>「전념 · 많이 · 전문가 · 설비 · 교류」는 Off JT</strong>, <strong>「맞춤 · 즉시 · 신뢰」는 OJT</strong>다. 이 낱말 묶음만 잡으면 어느 쪽을 물어도 갈린다.</p><div style=\"margin:12px 0 2px;font-weight:700\">OJT와 Off JT</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">OJT (직장 안)</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">Off JT (직장 밖)</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">누가</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>직속 상사가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전문 강사가</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">장점</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>직장 실정에 맞다 · 개개인에 맞춘다 · 곧바로 실무에 쓴다 · 효과가 곧 나타난다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>많은 사람을 한꺼번에 · 전문가 초빙 · 특별한 교재와 설비 · 다른 직장 사람과 교류</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">단점</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">한 번에 많이 못 한다 · 상사의 능력에 좌우된다</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">현장에 바로 맞지 않을 수 있다</td></tr></tbody></table></div>", "nq": 11}, "card_mgt_t155": {"kind": "단답형", "fq": 2, "subject": "안전관리론", "chapter": "", "mid": "적응기제(適應機制)", "front": "적응기제(適應機制)는?", "back": "<strong>고립</strong>은 <strong>도피기제</strong>다. 어려움에서 물러나 스스로를 가두는 것이다.<p><strong>◈ 암기</strong> <u>고 · 억 · 퇴 · 백은 도피기제</u>.</p><p><strong>방어는 「메운다」, 도피는 「달아난다」, 공격은 「터뜨린다」</strong>로 새긴다. <strong>「고 · 억 · 퇴 · 백」</strong> 넷만 도피기제로 따로 외워 두면 갈린다.</p><div style=\"margin:12px 0 2px;font-weight:700\">적응기제의 세 갈래</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">갈래</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>방어기제</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>열등감을 다른 것으로 메운다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;te ding:7px 12px;vertical-align:middle;text-align:left;\"><u>자존심의 손상 · 업무상 죄책감 · 지나친 경쟁심과 욕심 · 자기 능력의 과신</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>대인관계 갈등 · 죽음과 질병 · 경제적 어려움 · 소음 · 진동 · 조명</u></td></tr></tbody></table></div>", "nq": 1}, "card_mgt_t047": {"kind": "용어형", "fq": 3, "subject": "안전관리론", "chapter": "산업심리", "mid": "매슬로우의 욕구단계 이론", "front": "매슬로우의 욕구단계 이론이란?", "back": "<ul><li>안전욕구는 <strong>제2단계</strong>다. 생리적 욕구 바로 위다.</li><li><strong>제2단계는 안전에 대한 욕구</strong>다. 생리적 욕구 바로 위다.</li><li><strong>제2단계</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>생 · 안 · 사 · 존 · 자</u> — 생리, 안전, 사회적, 존경, 자아실현. · <u>생 · 안 · 사 · 존 · 자</u>.</p><p>아래 단계가 채워져야 위 단계로 올라간다. 그래서 <strong>먹고사는 문제가 해결되어야 안전에 관심이 생긴다</strong>는 것이 안전관리에 주는 함의다.<br>아래 단계가 채워져야 위로 올라간다. <strong>알더퍼의 ERG 이론</strong>은 이를 셋으로 줄였다 — <strong>존재(E) · 관계(R) · 성장(G)</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">매슬로우의 욕구 5단계</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">욕구</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생리적 욕구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>먹고 자고 숨 쉬는 것</u> — 가장 기본</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안전 욕구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>자기 보존</u> · 위험에서 벗어나려는 마음</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사회적 욕구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">소속감과 사랑</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>존경 욕구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">인정받고 싶은 마음 · 자기 존중</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>5</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>자아실현 욕구</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>잠재력을 다 펴려는 마음</u></td></tr></tbody></table></div>", "nq": 4}, "card_mgt_t145": {"kind": "단답형", "fq": 1, "subject": "안전관리론", "chapter": "안전보건관리 체제", "mid": "안전보건관리조직의 유형", "front": "안전보건관리조직의 유형은?", "back": "<ul><li><strong>생산부문에 책임과 권한이 없다</strong>는 것은 <strong>스태프형</strong>의 특징이다. 라인·스태프형은 <strong>생산라인이 실행 책임을 진다</strong>.</li><li><strong>명령계통과 조언의 혼동</strong>은 <strong>라인·스태프형</strong>의 단점이다. 스태프형에는 애초에 두 계통이 겹치지 않는다.</li><li><strong>계획·평가·조사는 스태프가, 실행은 라인이</strong> 맡는 것이 라인·스태프형(직계–참모식)의 요체다.</li></ul><p><strong>◈ 암기</strong> <u>계획은 스태프, 실행은 라인</u>. · <u>명령계통 혼동은 라인·스태프형</u>.</p><p>라인·스태프형의 요체는 <strong>「계획은 스태프가, 실행은 라인이」</strong>다. 그래서 <strong>생산부문이 반드시 책임을 진다</strong>. 이 점이 스태프형과 정면으로 갈린다.<br><strong>스태프형은 안전만 따로 떼어 놓아 생산과 겉돌고, 라인·스태프형은 두 계통이 겹쳐 혼동된다</strong>. <strong>「따로 논다」와 「겹쳐 헷갈린다」</strong>는 서로 다른 단점이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">안전관리 조직의 세 형태</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">라인형</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">스태프형</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">라인·스태프형</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">규모</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>100명 미만</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>100 ~ 1,000명</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1,000명 이상</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">누가 세우나</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생산라인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안전 스태프</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안전 스태프</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">누가 실행하나</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>생산라인</u></td><td style=\"bo , "back": "<ul><li><strong>3단계</strong>다. <strong>직접원인(징후)</strong>이 여기에 놓인다.</li><li><strong>제어(관리)의 부족</strong>이다. 버드는 <strong>모든 재해의 뿌리를 관리</strong>에서 찾았다.</li></ul><p><strong>◈ 암기</strong> <u>직접원인은 3단계</u>. · <u>버드의 1단계는 관리의 부족</u>.</p><p><strong>직접원인이 3단계에 놓이는 것은 하인리히와 같다</strong>. 다만 버드는 <strong>1단계를 「관리의 부족」</strong>으로 바꿔, <strong>없애야 할 도미노가 3단계가 아니라 1단계</strong> 라고 보았다.<br><strong>하인리히는 3단계(불안전한 행동과 상태)를 없애야</strong> 한다고 보았지만, <strong>버드는 1단계(관리의 부족)를 없애야</strong> 한다고 보았다. <strong>더 근본으로 거슬러 올라간</strong> 것이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">하인리히와 버드의 도미노 이론</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">단계</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">하인리히</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">버드</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사회적 환경과 유전적 요소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>제어(통제)의 부족 — 관리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>개인적 결함</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>기본원인 — 기원</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불안전한 행동과 상태</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>직접원인 — 징후</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사고</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사고 — 접촉</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>5</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>재해</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>상해 — 손실</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_mgt_t082": {"kind": "공식형", "fq": 2, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "근로손실일수의 산정", "front": "근로손실일수의 산정의 식은?", "back": "<ul><li><strong>영구 일부 노동불능(4~14급)</strong>은 <strong>등급별 근로손실일수를 그대로</strong> 쓴다. <strong>300/365를 곱하는 것은 일시 전노동불능(휴업)</strong>뿐이다.</li><li><strong>25년</strong>이다. <strong>연 300일 × 25년 = 7,500일</strong>이 사망의 근로손실일수다.</li><li><strong>영구일부노동불능은 등급별 손실일수를 그대로 쓴다</strong>. <strong>300/365를 곱하는 것은 일시적 노동불능(휴업일수)</strong>뿐이다.</li></ul><p><strong>◈ 암기</strong> <u>휴업일수에만 300/365</u>. · <u>사망은 25년 · 7,500일</u>.</p><p>$\\text{강도율} = \\dfrac{\\text{근로손실일수}}{\\text{연근로시간}} \\times 1 {,} 000$이다. <strong>300/365는 「연간 근로일수 ÷ 연간 일수」</strong>로, <strong>실제로 일했을 날만 세려고</strong> 곱하는 것이다. 이미 일수로 정해진 장해등급에는 곱하지 않는다.<br><strong>사망은 7,500일</strong>이라는 값이 <strong>연 300 근로일 × 25년</strong>에서 나왔다. 25년은 <strong>평균 잔여 근로연수</strong>로 잡은 것이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">근로손실일수의 환산</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">근로손실일수</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비고</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>사망 · 영구 전노동불능 (1~3급)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>7,500일</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>300/365를 곱하지 않는다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>영구 일부 노동불능 (4~14급)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>등급별 일수 그대로</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">14급은 <u>50일</u> · 4급은 5,500일</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>일시 전노동불능 (휴업)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>휴업일수 × 300/365</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>여기에만 곱한다</u></td></tr></tbody></table></div>", "nq": 3}, "card_mgt_t137": {"kind": "공식형", "fq": 1, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "하인리히의 재해구성비율", "front": "하인리히의 재해구성비율의 식은?", "back": "<ul><li><strong>1 : 29 : 300</strong>이므로 경상 29가 58 이면 <strong>2배</strong>다. 무상해 사고는 $300 \\times 2 = 600$ 건이다.</li><li><strong>1 : 29 : 300</strong>의 합이 330이므로 660은 <strong>2배</strong>다. 경상은 $29 \\times 2 = 58$ 명이다.</li><li>전체는 330건이므로 $\\dfrac{29}{330} \\times 100 \\fallingdotseq 8.8$ [%]다.</li></ul><p><strong>◈ 암기</strong> <u>1 : 29 : 300</u>. · <u>1 : 29 : 300, 합은 330</u>.</p><p><strong>1 : 29 : 300</strong>이 뜻하는 바는 <strong>중상 하나 뒤에 329 번의 사고가 있었다</strong>는 것이다. 그래서 <strong>무상해 사고(아차사고)를 줄이는 것</strong>이 곧 중상을 막는 길이다.<br><strong>먼저 합(330)으로 나누어 배수를 구한 뒤</strong> 각 항에 곱한다. 660 ÷ 330 = 2이므로 <strong>중상 2 · 경상 58 · 무상해 600</strong>이다. 세 값을 더하면 660이 되어 검산된다.</p><div style=\"margin:12px 0 2px;font-weight:700\">하인리히의 1 : 29 : 300</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">건수</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">비율</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>중상 또는 사망</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.3%</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>경상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>29</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>8.8%</u> — 이 문항</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무상해사고(아차사고)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>300</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>90.9%</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>합계</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>330</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>100%</u></td></tr></tbody></table></div>", "nq": 5}, "card_mgt_t165": {"kind": "단답형", "fq": 1, "subject": "안전관리론", "chapter": "재해조사 및 분석", "mid": "재해통계의 목적", "front": "재해통계의 목적은?", "back": "<strong>관리자를 문책하는 자료</strong>로 쓰는 것은 재해통계의 목적이 아니다.<p><strong>◈ 암기</strong> <u>문책 자료가 아니다</u>.</p><p>19번의 재해조사와 같은 결이다. <strong>책임을 묻기 시작하면 통계가 감춰진다</strong>. 통계의 목적은 <strong>설비 · 행동 · 관리를 고치는 것</strong>뿐이다. <strong>「인책」·「문책」</strong>이 나오면 대개 답이다.</p>", "nq": 1}, "card_erg_t151": {"kind": "단답형", "fq": 3, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "인간-기계 시스템의 설계 원칙", "front": "인간-기계 시스템의 설계 원칙은?", "back": "<ul><li><strong>기계적 성능에 맞추는</strong> 것은 인간공학의 방향과 반대다. 인간공학은 <strong>기계를 사람에게 맞춘다</strong>.</li><li>인터페이스는 <strong>기계의 효율이 아니라 사람을 먼저</strong> 고려해야 한다. 인간공학의 방향과 정반대다.</li></ul><p><strong>◈ 암기</strong> <u>기계를 사람에게 맞춘다</u>.</p><p>인간공학의 한 문장은 <strong>「사람을 기계에 맞추지 말고 기계를 사람에게 맞춘다」</strong>다. <strong>「기계적 성능에 적합하게」</strong>는 그 반대이므로 곧바로 걸러진다.<br>인간공학의 한 문장은 <strong>「사람을 기계에 맞추지 말고 기계를 사람에게 맞춘다」</strong>다. <strong>「기계의 효율이 우선」</strong>이라는 표현이 나오면 곧바로 걸러진다.</p>", "nq": 2}, "card_erg_t154": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "작업 개선의 원칙 ECRS", "front": "작업 개선의 원칙 ECRS는?", "back": "<strong>S는 Standard가 아니라 Simplify(단순화)</strong>다.<p><strong>◈ 암기</strong> <u>S는 Simplify</u>.</p><p>네 물음을 <strong>「없애고 · 합치고 · 바꾸고 · 줄인다」</strong> 순으로 던진다. <strong>없애는 것이 가장 확실한 개선</strong>이라 E가 맨 앞에 온다.</p><div style=\"margin:12px 0 2px;font-weight:700\">작업 개선의 ECRS</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기호</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">영문</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">우리말</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 하나</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>E</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>Eliminate</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>제거</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>없앨 수 없는가</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>C</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>Combine</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>결합</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>합칠 수 없는가</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>R</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>Rearrange</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>재배열</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>순서를 바꿀 수 없는가</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>S</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>Simplify</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>단순화</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>더 간단히 할 수 없는가</u></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t121": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "결함수분석", "mid": "미니멀 컷셋과 미니멀 패스셋", "front": "미니멀 컷셋과 미니멀 패스셋은?", "back": "<ul><li><strong>미니멀 패스셋(minimal path set)</strong>이다. <strong>그 요소들이 모두 살아 있으면 시스템이 돌아가는</strong> 최소한의 집합이다.</li><li><strong>패스셋은 시스템을 살리는 조합</strong>이다. 나머지 셋은 모두 <strong>컷셋</strong>의 설명이다.</li><li><strong>미니멀 컷셋은 정상사상을 일으키는 최소한의 컷셋</strong>이다. 나머지 셋은 컷셋과 패스셋을 뒤바꿔 놓았다.</li></ul><p><strong>◈ 암기</strong> <u>컷은 고장, 패스는 정상</u>. · <u>컷셋은 위험성, 패스셋은 신뢰성</u>.</p><p><strong>컷은 자른다(고장), 패스는 지나간다(정상)</strong>로 새긴다. <strong>미니멀 컷셋은 위험의 크기, 미니멀 패스셋은 시스템의 신뢰성</strong>을 나타낸다.<br><strong>컷은 자른다(고장), 패스는 지나간다(정상)</strong>로 새긴다. <strong>보기 셋이 모두 「고장」쪽</strong>을 말하고 있으므로 나머지 하나가 답이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">컷셋과 패스셋</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:1 cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇을 하나</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위험의 파악(발견·확인·측정)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어떤 위험이 있는가</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위험의 분석 및 평가</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>얼마나 큰 손실을 낳는가</u> — 강도 중심</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>위험 처리방법의 선정</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>피하거나 · 줄이거나 · 넘기거나 · 떠안거나</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>선정된 처리방법의 실행</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t161": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "인간공학의 가치", "front": "인간공학의 가치는?", "back": "<ul><li>경제성은 <strong>감소가 아니라 증대</strong> 되어야 한다. 방향이 반대다.</li><li>경제성은 <strong>증대</strong> 되어야 한다. <strong>「감소」로 뒤집어</strong> 놓았다.</li></ul><p><strong>◈ 암기</strong> <u>경제성은 증대</u>.</p><p><strong>「비용 · 손실」은 줄고, 「성능 · 이용률 · 경제성 · 수용도」는 늘어나야</strong> 한다. <strong>늘어야 할 것을 「감소」로 뒤집어</strong> 놓는 것이 이 유형의 함정이다.<br><strong>여섯 가운데 「감소」해야 하는 것은 훈련 비용과 손실 둘뿐</strong>이다 — <strong>나머지는 모두 향상·증대</strong>다. <strong>좋은 것을 「감소」로 바꿔 놓는</strong> 것이 이 유형의 함정이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인간공학의 가치 여섯</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">가치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>성능의 향상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>훈련비용의 절감</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인력 이용률의 향상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>사고 및 오용으로부터의 손실 감소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>생산 및 보전의 경제성 증대</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>감소가 아니다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>사용자의 수용도 향상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t162": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "신뢰성", "mid": "병렬 결합의 신뢰도", "front": "병렬 결합의 신뢰도의 식은?", "back": "$R = 1 - ( 1 - 0.7 ) ( 1 - 0.7 ) = 1 - 0.3 \\times 0.3 = 1 - 0.09 = 0.91$이다.<p><strong>◈ 암기</strong> $R = 1 - ( 1 - R_{1} ) ( 1 - R_{2} )$.</p><p><strong>병렬은 두 요소가 모두 고장 나야 시스템이 멈춘다</strong>. 그래서 <strong>「둘 다 고장 날 확률(0.09)」을 1에서 뺀다</strong>. <strong>병렬은 늘 개별 요소보다 신뢰도가 높다(0.91 &gt; 0.7)</strong>는 것으로 검산된다.</p>", "nq": 1}, "card_erg_t163": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "작업공간 설계의 요건", "front": "작업공간 설계의 요건은?", "back": "<ul><li><strong>접근제한요건</strong>은 <strong>손이 닿지 못하게 일부러 멀리 두는</strong> 설계다. 미술품 앞의 난간이 그 보기다.</li><li><strong>접근제한요건</strong>은 <strong>닿지 못하게 거리를 두는</strong> 것이다. <strong>박물관에서 그림 앞에 난간을 두는</strong> 것이 그 보기다.</li></ul><p><strong>◈ 암기</strong> <u>닿지 못하게 하면 접근제한</u>. · <u>접근제한은 닿지 못하게</u>.</p><p><strong>「접근」은 닿게 하는 것, 「접근제한」은 닿지 못하게 하는 것</strong>이다. 두 낱말이 비슷해 보이지만 <strong>방향이 정반대</strong>다.<br><strong>나머지 셋은 「닿게 하려는」 설계이고 접근제한요건만 「닿지 못하게 하려는」</strong> 설계다. <strong>방향이 반대</strong>라는 점만 잡으면 갈린다.</p><div style=\"margin:12px 0 2px;font-weight:700\">작업공간 설계의 세 요건</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">요건</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보기</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>조절 요건</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사람마다 맞출 수 있게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">조절식 의자</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접근 요건(작업공간 포락면)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>닿을 수 있게 · 들어갈 수 있게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">비상벨 위치 · 수리 공간</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접근제한 요건</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>닿지 못하게 멀리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>미술품 전시의 거리 확보</u></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t164": {"kind": "용어형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "인간계측·작업공간", "mid": "인체측정치의 응용 원리", "front": "인체측정치의 응용 원리란?", "back": "<ul><li>거꾸로다. <strong>넓이는 큰 사람에게(최대집단값), 깊이는 작은 사람에게(최소집단값)</strong> 맞춘다.</li><li><strong>의자 너비만 최대 집단치</strong>다. 나머지 셋은 모두 조절식이거나 최소 집단치로 잡는다.</li><li><strong>최대 집단치</strong>다. <strong>가장 큰 사람도 넘거나 빠져나가지 못하게</strong> 해야 한다.</li></ul><p><strong>◈ 암기</strong> <u>너비는 큰 사람, 깊이는 작은 사람</u>. · <u>너비는 최대, 깊이는 최소, 높이는 조절식</u>.</p><p>원칙은 하나 — <strong>모자라면 곤란한 치수는 큰 사람에게, 넘치면 곤란한 치수는 작은 사람에게</strong> 맞춘다. <strong>너비는 넓어도 탈이 없지만 깊이는 깊으면 오금이 눌려</strong> 탈이 난다.<br>원칙은 하나 — <strong>모자라면 곤란하면 큰 사람에게, 넘치면 곤란하면 작은 사람에게, 맞출 수 있으면 조절식</strong>이다. <strong>너비는 넓어도 탈이 없지만 깊이는 깊으면 오금이 눌린다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">의자 좌판의 설계 기준</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">치수</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">맞추는 대상</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>좌판의 너비</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>큰 사람</u> (최대집단값)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>넓으면 작은 사람도 앉을 수 있다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>좌판의 깊이</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작은 사람</u> (최소집단값)</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>깊으면 작은 사람의 오금이 눌린다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>좌판의 높이</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>작은 사람</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">발이 바닥에 닿아야 한다</td></tr></tbody></table></div>", "nq": 3}, "card_erg_t165": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "작업환경관리", "mid": "옥스포드 지수(습건지수)", "front": "옥스포드 지수(습건지수)의 식은?", "back": "$WD = 0.85 W + 0.15 D = 0.85 \\times 35 + 0.15 \\times 30 = 29.75 + 4.5 = 34.25$ [℃]다.<p><strong>◈ 암기</strong> <u>습구 0.85, 건구 0.15</u>.</p><p><strong>습구에 0.85, 건구에 0.15</strong>다. <strong>사람은 땀이 마르며 열을 버리므로 습도(습구온도)가 훨씬 중요</strong>하다 — 그래서 습구 쪽 계수가 크다.</p><div style=\"margin:12px 0 2px;font-weight:700\">온열지수</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">지수</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>옥스포드 지수 WD</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$0.85 \\times \\text{습구} + 0.15 \\times \\text{건구}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>습구에 0.85</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>실내 WBGT</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$0.7 \\times \\text{자연습구} + 0.3 \\times \\text{흑구}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>옥외 WBGT</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$0.7 \\times \\text{자연습구} + 0.2 \\times \\text{흑구} + 0.1 \\times \\text{건구}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_erg_t014": {"kind": "공식형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "작업환경관리", "mid": "습구흑구온도지수(WBGT)", "front": "습구흑구온도지수(WBGT)의 식은?", "back": "<ul><li><strong>햇볕이 있는 옥외</strong>는 건구온도까지 넣는 식을 쓴다. $\\mathrm{WBGT} = 0.7 \\times \\text{자연습구} + 0.2 \\times \\text{흑구} + 0.1 \\times \\text{건구}$이므로 $0.7 \\times 20 + 0.2 \\times 18 + 0.1 \\times 30 = 14 + 3.6 + 3 = 20.6$ [℃]다.</li><li>옥내 또는 햇볕 없는 옥외는 $0.7 \\times \\text{자연습구} + 0.3 \\times \\text{흑구}$다. 두 계수의 합이 <strong>1</strong>이 되어야 한다.</li><li>실내(태양광선이 없는 곳)는 $\\mathrm{WBGT} = 0.7 \\mathrm{NWB} + 0.3 GT$다.</li></ul><p><strong>◈ 암기</strong> <u>자연습구 0.7은 언제나 같고, 건구 0.1은 햇볕이 있을 때만</u>. · <u>실내는 0.7 + 0.3, 옥외는 0.7 + 0.2 + 0.1</u>.</p><p>WBGT 두 가지 식. <u>옥내 또는 햇볕 없는 옥외 : 0.7 자연습구 + 0.3 흑구</u>, <u>햇볕 있는 옥외 : 0.7 자연습구 + 0.2 흑구 + 0.1 건구</u>. <u>자연습구의 가중치 0.7은 어느 경우에나 같고, 건구는 햇볕이 있을 때만 0.1로 들어간다</u>는 점이 갈림길이다.<br>햇볕이 있는 옥외는 $0.7 \\times \\text{자연습구} + 0.2 \\times \\text{흑구} + 0.1 \\times \\text{건구}$다.</p><div style=\"margin:12px 0 2px;font-weight:700\">WBGT의 두 식</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>실내 · 옥외(태양광선 없음)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$0.7 \\mathrm{NWB} + 0.3 GT$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>두 항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>옥외(태양광선 있음)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$0.7 \\mathrm{NWB} + 0.2 GT + 0.1 DB$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>세 항</u></td></tr></tbody></table></div>", "nq": 3}, "card_erg_t166": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "충격소음작업", "front": "충격소음작업은?", "back": "<strong>140 [dB(A)]</strong>다. 1일 100회면 이 값을 넘어서는 안 된다.<p><strong>◈ 암기</strong> <u>120/1만 · 130/1천 · 140/1백</u>.</p><p><strong>소리가 10 [dB] 세질 때마다 허용 횟수가 1/10</strong>로 준다 — <strong>120/1만 · 130/1천 · 140/1백</strong>. 이 규칙으로 잡으면 세 값이 한꺼번에 외워진다.</p><div style=\"margin:12px 0 2px;font-weight:700\">충격소음 작업의 기준 (규칙 제512조)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">최대 음압수준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">1일 노출횟수</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>120 [dB]을 초과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1만 회 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>130 [dB]을 초과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1천 회 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>140 [dB]을 초과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1백 회 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제512조</em></p>", "nq": 1}, "card_erg_t167": {"kind": "단답형", "fq": 1, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "정보의 촉각적 암호화", "front": "정보의 촉각적 암호화는?", "back": "<strong>점자 · 진동 · 온도</strong> 셋 모두 <strong>피부로 느끼는</strong> 것이다.<p><strong>◈ 암기</strong> <u>점자 · 진동 · 온도는 촉각</u>.</p><p>촉각 암호는 <strong>손이 바쁘지 않고 눈과 귀가 이미 꽉 찼을 때</strong> 쓴다. <strong>조종장치의 모양을 다르게 만드는 것(형상 암호화)</strong>도 촉각 암호의 하나다.<br>촉각 암호는 <strong>손이 바쁘지 않고 눈과 귀가 이미 꽉 찼을 때</strong> 쓴다. <strong>조종장치의 모양을 다르게 만드는 형상 암호화</strong>도 촉각 암호의 하나다.</p><div style=\"margin:12px 0 2px;font-weight:700\">정보의 암호화 방법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">감각</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>시각</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>신호등 · 점멸등 · 연기 · 색 · 모양</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>청각</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>경보음 · 초인종 · 모스부호</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>촉각</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>점자 · 진동 · 온도 · 표면 촉감 · 모양</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>후각</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>냄새(가스에 넣는 부취제)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_erg_t168": {"kind": "공식형", "fq": 2, "subject": "인간공학 및 시스템안전공학", "chapter": "정보입력표시", "mid": "Fitts 의 법칙", "front": "Fitts 의 법칙의 식은?", "back": "<ul><li><strong>표적이 작고 멀수록 오래 걸린다</strong>. $MT = a + b \\log_{2} ( \\dfrac{2 A}{W} )$에서 $A$는 거리, $W$는 표적의 너비다.</li><li><strong>표적의 색상</strong>은 식에 들어가지 않는다. $MT = a + b \\log_{2} ( \\dfrac{2 A}{W} )$에는 <strong>거리 </strong>$A$<strong>와 너비 </strong>$W$만 나온다.</li></ul><p><strong>◈ 암기</strong> <u>작고 멀수록 오래 걸린다</u>. · <u>거리와 너비 둘뿐</u>.</p><p>상식과 같다 — <strong>멀고 작은 과녁일수록 맞히기 어렵고 오래 걸린다</strong>. 그래서 <strong>자주 쓰는 버튼은 크고 가까이</strong> 두어야 한다는 설계 지침이 나온다.<br><strong>거리와 크기, 두 가지뿐</strong>이다. <strong>색상 · 모양 · 밝기는 「찾는 데」 영향을 주지만 「손을 옮기는 시간」에는 들어가지 않는다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">Fitts의 법칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조건</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이동시간</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9; table></div>", "nq": 8}, "card_mac_t136": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "공작기계", "mid": "밀링작업의 안전수칙", "front": "밀링작업의 안전수칙은?", "back": "<ul><li>커터는 <strong>컬럼에 가깝게</strong> 설치해야 한다. 멀수록 <strong>아버가 휘어 진동이 커진다</strong>.</li><li><strong>날끝과 같은 높이에서 들여다보면</strong> 튀는 칩이 <strong>곧바로 눈으로</strong> 온다. <strong>옆쪽에서</strong> 보아야 한다.</li><li><strong>짧게 물려야</strong> 한다. <strong>길게 물리면 절삭저항에 일감이 흔들리고 튀어나온다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>커터는 컬럼에 가깝게</u>. · <u>날끝 높이에서 보지 않는다</u>.</p><p><strong>받치는 곳에서 멀어질수록 흔들린다</strong>는 것은 기계의 일반 원리다. 밀링은 이 밖에 <strong>칩은 반드시 브러시로 · 장갑은 끼지 않는다 · 보안경을 쓴다</strong>가 함께 나온다.<br><strong>칩이 나오는 방향에 눈·손을 두지 않는다</strong>는 것이 절삭작업 전체를 꿰는 원칙이다. <strong>회전하는 공작기계에서 장갑을 끼지 않는다</strong>는 것도 같은 줄기다.</p><div style=\"margin:12px 0 2px;font-weight:700\">밀링작업의 안전수칙</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>주축 변속</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>주축이 완전히 멈춘 뒤</u> 변환한다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>공구 설치·해체</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전원을 끄고</u> 한다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>가공물 확인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>날끝과 같은 높이에서 보지 않는다</u> — 칩이 눈으로 온다</td></tr><tr><td :10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">설치 위치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>손 조작식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>밑면에서 1.8 [m] 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>복부 조작식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>밑면에서 0.8 [m] 이상 1.1 [m] 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무릎 조작식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>밑면에서 0.6 [m] 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>0.8 [m]가 아니다</u></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제148조</em></p>", "nq": 3}, "card_ele_t151": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "최소감지전류", "front": "최소감지전류는?", "back": "<ul><li><strong>상용주파수 60 [Hz] 교류에서 약 1 [mA]</strong>다. <strong>교류가 기준</strong>이라는 점이 갈림길이다.</li><li><strong>남자는 직류 5.2 [mA], 교류(실효치) 1.1 [mA]</strong>다. <strong>여자는 그 3분의 2쯤</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>최소감지전류는 교류 1 [mA]</u>. · <u>남자 직류 <u>1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전원을 끊는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>구조자가 함께 감전되지 않게</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안전한 곳으로 옮긴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>의식·호흡·맥박을 확인한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>심폐소생술을 실시한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1분 이내면 소생률 95 [%]</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>5</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>병원으로 옮긴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t154": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "활선작업용 보호구", "front": "활선작업용 보호구는?", "back": "<ul><li><strong>대전방지용 구두</strong>는 <strong>정전기를 빼내려고 전기가 조금 통하게</strong> 만든 것이다. 감전 방지와는 정반대다.</li><li><strong>대전방지용 구두</strong>는 <strong>정전기를 대지로 흘려보내는</strong> 신이다. <strong>활선작업에서는 오히려 위험</strong>하다.</li></ul><p><strong>◈ 암기</strong> <u>대전방지화는 전기를 흘려보낸다</u>. · <u>대전방지화는 정전기용</u>.</p><p><strong>절연 보호구는 전기를 막고, 대전방지 보호구는 전기를 흘려보낸다</strong> — 목적이 정반대다. 대전방지화는 <strong>반도체 공장처럼 정전기가 문제 되는 곳</strong>에서 신는다.<br><strong>활선작업은 전기를 「끊어야」 하고 정전기 대책은 전기를 「흘려야」</strong>한다 — <strong>정반대</strong>다. <strong>대전방지화는 저항이 낮아 감전경로를 만들어 준다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">활선작업의 보호구</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">보호구</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>절연용 안전모</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>머리의 감전과 충격</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>절연장갑(고무장갑)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>손의 감전</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>절연화·절연장화</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>발쪽 통전경로를 끊는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>절연복·절연 어깨받이</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>대전방지용 구두</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>정전기를 대지로 흘린다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>활선작업에는 맞지 않는다</u></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t155": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "감전전류의 계산과 위험성", "front": "감전전류의 계산과 위험성의 식은?", "back": "$I = \\dfrac{V}{R} = \\dfrac{220}{1 {,} 000} = 0.22 \\, A = 220 \\, \\mathrm{mA}$<strong>220mA는 심실세동을 일으키는 수준</strong>이라 위험하다.<p><strong>◈ 암기</strong> <u>220V·1,000Ω → 220mA, 위험</u>.</p><p>$I = \\dfrac{V}{R}$로 먼저 셈한다 — <strong>220 ÷ 1,000 = 0.22A = 220mA</strong>다. <strong>50mA 만 넘어도 심실세동</strong> 이니 220mA는 두말할 것 없이 위험하다.</p><div style=\"margin:12px 0 2px;font-weight:700\">통전전류와 인체의 반응</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">전류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">반응</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1 mA</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;t  "fq": 2, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "옴의 법칙과 감전 위험", "front": "옴의 법칙과 감전 위험의 식은?", "back": "$I = V / R = 220 / 1 {,} 000 = 0.22$ [A] = <strong>220 [mA]</strong>다. <strong>심실세동전류(50 [mA])를 훨씬 넘어 위험</strong>하다.<p><strong>◈ 암기</strong> <u>220 [V] ÷ 1,000 [Ω] = 220 [mA]</u>.</p><p>$I = V / R$로 곧바로 나온다. <strong>220 [mA]는 심실세동전류의 네 배가 넘어</strong> 목숨이 위태롭다. <strong>우리가 늘 쓰는 220 [V]가 얼마나 위험한지</strong>를 보여 주는 계산이다.</p>", "nq": 1}, "card_ele_t157": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "", "mid": "충전전로에 대한 접근한계거리", "front": "충전전로에 대한 접근한계거리는?", "back": "<strong>90 [cm]</strong>다. 22.9 [kV]는 <strong>15 [kV] 초과 37 [kV] 이하</strong> 구간에 든다.<p><strong>◈ 암기</strong> <u>22.9 [kV]는 90 [cm]</u>.</p><p>앞부분을 <strong>30 · 45 · 60 · 90 · 110</strong>으로 잡고, 구간 경계를 <strong>0.75 · 2 · 15 · 37 · 88 [kV]</strong>로 짝지어 둔다. <strong>22.9 [kV]는 우리나라 배전선로의 표준전압</strong>이라 자주 나온다.</p><div style=\"margin:12px 0 2px;font-weight:700\">충전전로에 대한 접근한계거리 (규칙 별표5)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">충전전로의 선간전압</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">접근한계거리</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>0.3 [kV] 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>접촉금지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>0.3 초과 V] 초과</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>7,000 [V] 초과</u></td></tr></tbody></table></div><p><em>근거 — 한국전기설비규정(KEC)</em></p>", "nq": 4}, "card_ele_t158": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "가스증기 위험장소의 금속관 배선", "front": "가스증기 위험장소의 금속관 배선은?", "back": "<strong>5턱(5산) 이상</strong>이다. <strong>나사산을 여러 개 물려야 화염이 새어 나가지 못한다</strong>.<p><strong>◈ 암기</strong> <u>나사 접속은 5턱 이상</u>.</p><p>나사 접속부의 깊이는 <strong>내압 방폭구조의 최대안전틈새(MESG)</strong>와 같은 원리다. <strong>틈이 좁고 길수록 화염이 식어</strong> 밖으로 나가지 못한다. <strong>5턱은 약 8 [mm]</strong>에 해당한다.</p>", "nq": 1}, "card_ele_t102": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "방폭기기의 온도등급", "front": "방폭기기의 온도등급은?", "back": "<ul><li><strong>T2는 300 [℃] 이하</strong>다.</li><li><strong>T1은 450 [℃] 이하</strong>가 맞다. 나머지 셋은 값이 어긋난다.</li><li><strong>200 [℃] 초과 300 [℃] 이하가 T2</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>450 · 300 · 200 · 135 · 100 · 85</u>. · <u>T2는 200 ~ 300 [℃]</u>.</p><p><strong>숫자가 클수록 허용온도가 낮다</strong>. 기기 표면이 <strong>그 가스의 발화점보다 낮아야</strong> 하므로, 발화점이 낮은 가스일수록 높은 등급(T5·T6)이 필요하다.<br>여섯 값을 <strong>450 · 300 · 200 · 135 · 100 · 85</strong>로 통째로 외운다. <strong>숫자를 조금씩 비틀어 놓는 것</strong>이 이 유형의 함정이라, 정확히 외우지 않으면 걸린다.</p><div style=\"margin:12px 0 2px;font-weight:700\">온도등급과 최고표면온도</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">등급</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">최고표면온도</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">등급</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">최고표면온도</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>T1</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>450 [℃]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>T4</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>135 [℃]</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>T2</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>300 [℃]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>T5</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>100 [℃]</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>T3</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>200 [℃]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>T6</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>85 [℃]</u></td></tr></tbody></table></div>", "nq": 5}, "card_ele_t159": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "방폭전기설비의 계획 수립", "front": "방폭전기설비의 계획 수립은?", "back": "<strong>전기설비의 선정 및 결정</strong>은 <strong>계획을 세운 뒤에 하는 실행</strong>이다. 기본 방침이 아니다.<p><strong>◈ 암기</strong> <u>설비 선정은 계획 다음</u>.</p><p>계획은 <strong>「무엇이 · 어디서 · 어디까지 위험한가」</strong>를 정하는 데까지다. <strong>설비를 고르는 것은 그 결과에 따라 하는 일</strong>이라 다음 단계다.</p><div style=\"margin:12px 0 2px;font-weight:700\">방폭전기설비 계획 수립의 기본 방침</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방침</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>가연성 가스 및 가연성 액체의 위험특성 확인</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>무엇이 위험한가</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>시설장소의 제조건 검토</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어떤 곳인가</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>위험장소 종별 및 범위의 결정</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어디까지 위험한가</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전기설비의 배치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어디에 놓을 것인가</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>전기설비의 선정 및 결정</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>계획이 아니라 실행 단계</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t160": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 일반", "mid": "정전기의 성질", "front": "정전기의 성질은?", "back": "정전기는 <strong>전하가 거의 움직이지 않아 자계는 무시할 만하고 전계만 남는</strong> 전기다.<p><strong>◈ 암기</strong> <u>정전기는 전계만, 자계는 무시</u>.</p><p><strong>「정(靜)」이라는 글자가 곧 「머물러 있다」</strong>는 뜻이다. <strong>움직이지 않으니 자기장이 생기지 않는다</strong>. 그래서 <strong>전계만 남는다</strong>.</
