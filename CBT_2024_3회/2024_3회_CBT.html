iv>", "nq": 1}, "card_ele_t143": {"kind": "단답형", "fq": 2, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "스파크에 의한 화재의 방지", "front": "스파크에 의한 화재의 방지는?", "back": "<ul><li>유입 개폐기 둘레에 세우는 것은 <strong>내수벽이 아니라 내화벽</strong>이다. 물이 아니라 <strong>불을 막아야</strong> 한다.</li><li><strong>포장 퓨즈(통형 퓨즈)</strong>를 써야 한다. <strong>비포장 퓨즈는 끊어질 때 불꽃이 그대로 튄다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>유입 개폐기 둘레에는 내화벽</u>. · <u>포장 퓨즈를 쓴다</u>.</p><p>유입 개폐기 안에는 <strong>기름(절연유)</strong>이 들어 있어 <strong>불이 나면 크게 번진다</strong>. 그래서 <strong>내화벽</strong>을 두른다. <strong>「내수」와 「내화」</strong>한 글자를 바꿔 놓은 것이 이 문항의 함정이다.<br>대책이 모두 <strong>불꽃을 가두거나 · 애초에 나지 않게</strong> 한다 — <strong>방폭형 · 불연성 상자 · 포장 퓨즈 · 접촉저항 관리</strong>. <strong>「비포장」은 가두지 않겠다</strong>는 말이라 정반대다.</p>", "nq": 3}, "card_ele_t161": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기설비", "mid": "활선작업의 작업지휘자", "front": "활선작업의 작업지휘자는?", "back": "<strong>활선에 다가가면 즉시 경고하는</strong> 것이 가장 중요하다. <strong>작업자는 제 뒤와 옆을 볼 수 없기</strong> 때문이다.<p><strong>◈ 암기</strong> <u>다가가면 즉시 경고</u>.</p><p>활선작업에서 <strong>접근한계거리를 지키는지 볼 수 있는 사람은 옆에서 지켜보는 사람뿐</strong>이다. 그래서 <strong>감시와 경고</strong>가 작업지휘자의 첫째 임무다.</p>", "nq": 1}, "card_ele_t162": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기설비", "mid": "누설전류의 허용값", "front": "누설전류의 허용값의 식은?", "back": "<ul><li>최대공급전류는 $I = \\dfrac{50 {,} 000}{\\sqrt{3} \\times 380} \\fallingdotseq 76$ [A]다. 누설전류 허용값은 <strong>최대공급전류의 1/2,000</strong>이므로 $76 / 2 {,} 000 = 0.038$ [A] = <strong>38 [mA]</strong>다.</li><li>최대공급전류는 $I = \\dfrac{15 {,} 000}{100} = 150$ [A]다. 허용 누설전류는 <strong>최대공급전류의 1/2,000</strong>이므로 $150 / 2 {,} 000 = 0.075$ [A]다.</li><li>허용 누설전류는 <strong>최대공급전류의 1/2,000</strong>이므로 $\\dfrac{300}{2 {,} 000} = 0.15$ [A] = <strong>150 [mA]</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>누설전류는 최대공급전류의 1/2,000</u>.</p><p>두 단계다 — <strong>3상 전류 </strong>$I = P / ( \\sqrt{3} V )$<strong>로 76 [A]를 구하고, 1/2,000을 곱한다</strong>. <strong>「1/2,000」</strong>이라는 값을 기억하는 것이 갈림길이다.<br><strong>저압측 전압 100 [V]</strong>를 써야 한다 — <strong>6,600 [V]는 1차측</strong>이라 미끼다. <strong>1/2,000</strong>이라는 비율을 외워 두면 두 줄로 끝난다.</p>", "nq": 3}, "card_ele_t163": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기화재", "mid": "피뢰기의 직렬 갭과 특성요소", "front": "피뢰기의 직렬 갭과 특성요소는?", "back": "<strong>이상전압을 신속히 대지로 흘려보내고, 뒤따라오는 속류를 즉시 끊는</strong> 것이 직렬 갭의 목적이다.<p><strong>◈ 암기</strong> <u>직렬 갭은 방전과 속류 차단</u>.</p><p><strong>직렬 갭은 「문」, 특성요소는 「저항」</strong>이다. 문은 <strong>열고 닫는 일(방전과 속류 차단)</strong>, 저항은 <strong>흘려보내되 전압을 억누르는 일</strong>을 맡는다.</p><div style=\"margin:12px 0 2px;font-weight:700\">피뢰기의 구성</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">부분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">하는 일</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>직렬 갭</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>평소에는 전류를 막고, 이상전압이 오면 방전시킨 뒤 속류를 끊는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>특성요소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>방전전류를 크게 흘리면서 제한전압을 낮게 억누른다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">비직선 저항체</td></tr></tbody></table></div>", "nq": 1}, "card_ele_t164": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "접지", "mid": "누전화재의 3요소", "front": "누전화재의 3요소는?", "back": "<ul><li><strong>접속점</strong>은 3요소에 들지 않는다. 셋은 <strong>누전점 · 발화점(출화점) · 접지점</strong>이다.</li><li>셋은 <strong>누전점 · 발화점 · 접지점</strong>이다. <strong>「혼촉점」은 들지 않는다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>누전점 · 발화점 · 접지점</u> 셋. · <u>누전화재 3요소는 누전점·발화점·접지점</u>.</p><p><strong>새어 나온 곳(누전점) → 지나가며 불이 붙은 곳(발화점) → 땅으로 빠진 곳(접지점)</strong>이라는 <strong>전류의 여정</strong> 그대로다. <strong>「접속점」은 전선을 이은 자리</strong>를 뜻하는 다른 말이다.<br><strong>「새고(누전점) → 타고(발화점) → 빠져나간다(접지점)」</strong> 세 자리를 찾는다 — <strong>혼촉은 고압과 저압이 닿는 다른 사고</strong>다.</p><div style=\"margin:12px 0 2px;font-weight:700\">누전화재의 3요소</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">요소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>누전점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전류가 새어 나온 자리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>들어오는 곳</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>발화점(출화점)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불이 붙은 자리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>타는 곳</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>접지점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>전류가 땅으로 흘러 들어간 자리</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>나가는 곳</u></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t165": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "접지", "mid": "피뢰기의 접지저항 (옛 전기설비기술기준)", "front": "피뢰기의 접지저항 (옛 전기설비기술기준)은?", "back": "옛 기준으로 <strong>10 [Ω] 이하</strong>다. <strong>피뢰기의 접지는 제1종 접지공사</strong>에 해당했다.<p><strong>◈ 암기</strong> <u>피뢰기 접지는 10 [Ω] 이하</u>.</p><p><strong>벼락 전류를 땅으로 빨리 흘려보내려면 접지저항이 낮아야</strong> 한다. 그래서 <strong>가장 엄한 10 [Ω]</strong>을 요구했다.</p>", "nq": 1}, "card_ele_t054": {"kind": "공식형", "fq": 2, "subject": "전기위험방지기술", "chapter": "정전기", "mid": "도체구의 전위", "front": "도체구의 전위의 식은?", "back": "<ul><li>도체구의 전위는 $V = \\dfrac{1}{4 \\pi \\varepsilon_{0}} \\times \\dfrac{Q}{r} = 9 \\times 10^{9} \\times \\dfrac{Q}{r}$다. $9 \\times 10^{9} \\times 2 \\times 10^{-7} / 0.25 = 1 {,} 800 / 0.25 = 7 {,} 200$ [V] = <strong>7.2 [kV]</strong>다.</li><li>$V = 9 \\times 10^{9} \\times \\dfrac{Q}{r}$다. $r = 6 {,} 367 \\times 10^{3}$ [m]이므로 $V = 9 \\times 10^{9} \\times 1 / ( 6.367 \\times 10^{6} ) \\fallingdotseq 1 {,} 414$ [V]다.</li><li>$V = \\dfrac{1}{4 \\pi \\varepsilon_{0}} \\times \\dfrac{Q}{r} = 9 \\times 10^{9} \\times \\dfrac{2 \\times 10^{-7}}{0.25} = 7 {,} 200$ [V] = <strong>7.2 [kV]</strong>다.</li></ul><p><strong>◈ 암기</strong> $V = 9 \\times 10^{9} Q / r$ — <u>반지름은 미터로</u>. · $V = 9 \\times 10^{9} Q / r$.</p><p>$9 \\times 10^{9}$은 쿨롱 상수 $1 / 4 \\pi \\varepsilon_{0}$다. <strong>반지름을 [m]로 바꾸는 것</strong>이 실수하기 쉬운 자리다.<br>$V = \\dfrac{1}{4 \\pi \\varepsilon_{0}} \\times \\dfrac{Q}{r} = 9 \\times 10^{9} \\times \\dfrac{Q}{r}$다. <strong>반지름을 [m]로 바꾸는 것</strong>이 실수하기 쉬운 자리다 — 6,367 [km]는 $6.367 \\times 10^{6}$ [m]다.</p>", "nq": 3}, "card_ele_t166": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "정전기", "mid": "가습에 의한 정전기 대전방지", "front": "가습에 의한 정전기 대전방지는?", "back": "< </td></tr></tbody></table></div>", "nq": 1}, "card_chm_t091": {"kind": "단답형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "위험물", "mid": "부식성 물질", "front": "부식성 물질은?", "back": "<ul><li><strong>수산화칼륨</strong>이다. <strong>부식성 염기류는 농도 40 [%] 이상</strong>이 기준이다. 나머지 셋은 모두 <strong>부식성 산류</strong>다.</li><li>인산은 <strong>농도 60 [%] 이상</strong>이라야 부식성 산류다. 40 [%]는 들지 않는다.</li><li><strong>수산화칼륨</strong>이다. <strong>염기류는 농도 40% 이상</strong>이라야 부식성 물질로 본다.</li></ul><p><strong>◈ 암기</strong> <u>20 · 60 · 40</u> — 염기는 40. · <u>강산 20, 그 밖의 산 60, 염기 40</u>.</p><p>세 숫자를 갈라 둔다 — <strong>강산 20 · 약산 60 · 염기 40</strong>. <strong>「~수산화」가 보이면 염기이므로 40</strong>이다.<br>세 숫자를 잡는다 — <strong>강산 20 · 그 밖의 산 60 · 염기 40</strong>. <strong>염산·황산·질산은 강해서 20 [%]부터, 인산·아세트산·불산은 약해서 60 [%]부터</strong>다.</p><div style=\"margin:12px 0 2px;font-weight:700\">부식성 물질의 농도 기준 (별표1)</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">갈래</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">농도</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">해당 물질</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>부식성 산류 (강산)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>20 [%] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>염산 · 황산 · 질산</u> 및 이와 같은 정도 이상의 부식성을 가지는 물질</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>부식성 산류 (그 밖)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text 도의 크기 관계. <u>인화점 &lt; 연소점 &lt; 발화점</u>. 인화점은 「점화원이 있으면 붙는 온도」, 발화점은 「점화원이 없어도 붙는 온도」라는 점이 결정적 차이다. 인화성 액체의 위험도를 가르는 첫 기준이 인화점이다.<br>세 온도가 모두 <strong>「최저온도」</strong>다. <strong>「최고온도」로 바꿔 놓는 것</strong>이 이 유형의 함정이다. 크기는 <strong>인화점 &lt; 연소점 &lt; 발화점</strong> 순이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">인화점 · 연소점 · 발화점</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">용어</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무엇</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">관계</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>인화점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불씨를 대면 순간 불이 붙는 최저온도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 낮다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>연소점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>붙은 불이 계속 타는 최저온도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>인화점보다 5 ~ 10 [℃] 높다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>발화점</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불씨 없이 스스로 불붙는 최저온도</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가장 높다</u></td></tr></tbody></table></div>", "nq": 2}, "card_chm_t149": {"kind": "단답형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "증기폭발(vapor explosion)", "front": "증기폭발(vapor explosion)은?", "back": "고온액이 <strong>응고되어 굳으면 열이 전해지지 않아</strong> 오히려 폭발 가능성이 <strong>낮아진다</strong>.<p><strong>◈ 암기</strong> <u>굳으면 오히려 덜 위험</u>.</p><p>증기폭발은 <strong>뜨거운 액체가 차가운 액체에 열을 순식간에 넘겨 한꺼번에 끓게</strong> 만드는 현상이다. <strong>사이에 굳은 껍질이 생기면 열이 못 건너가므로</strong> 오히려 안전해진다.</p>", "nq": 1}, "card_chm_t150": {"kind": "단답형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "자연발화의 방지", "front": "자연발화의 방지는?", "back": "<ul><li>밀폐하면 <strong>열이 빠져나가지 못해 쌓인다</strong>. <strong>통풍을 잘 시켜 열을 흩어 놓아야</strong> 한다.</li><li><strong>자연발화는 점화원 없이 스스로 일어난다</strong>. 그래서 <strong>점화원만 없애서는 막을 수 없다</strong>.</li><li><strong>자연발화는 점화원 없이 스스로 일어난다</strong>. <strong>점화원 제거는 방지법이 될 수 없다</strong>.</li></ul><p><strong>◈ 암기</strong> <u>밀폐가 아니라 통풍</u>. · <u>점화원 없이 일어나므로 점화원 관리로는 못 막는다</u>.</p><p>자연발화는 <strong>발열 &gt; 방열</strong>일 때 일어난다. <strong>방열을 늘리는 것(통풍)이 가장 확실한 대책</strong> 인데, <strong>밀폐는 그 반대</strong>다.<br><strong>자연발화의 정의 자체가 「점화원 없이」</strong>다. 그러므로 <strong>점화원 관리는 자연발화 대책이 될 수 없다</strong>. 대책은 <strong>열이 쌓이지 않게(온도 · 통풍 · 퇴적법)</strong>하는 쪽이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">자연발화의 방지법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방지법</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">까닭</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>주위 온도를 낮춘다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>반응이 느려진다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>통풍을 잘 시킨다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>쌓인 열을 흩어 놓는다</u> — 밀폐가 아니다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>습도가 높은 곳을 피한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">적당한 수분이 반응을 돕는다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>퇴적 방법에 주의한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">두껍게 쌓으면 안쪽에 열이 갇힌다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>산소와의 접촉을 피한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">황린 등</td></tr></tbody></table></div>", "nq": 3}, "card_chm_t151": {"kind": "공식형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "완전연소 반응식", "front": "완전연소 반응식의 식은?", "back": "<ul><li>$C_{2} H_{5} OH + 3 O_{2} \\rightarrow 2 CO_{2} + 3 H_{2} O$다. <strong>탄소 2개는 CO₂ 2몰, 수소 6개는 H₂O 3몰</strong>이 된다.</li><li>$C_{2} H_{5} OH + 3 O_{2} \\rightarrow 2 CO_{2} + 3 H_{2} O$탄소가 <strong>2개</strong>이므로 CO₂ 도 <strong>2몰</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>C 개수는 CO₂, H 개수 절반은 H₂O</u>. · <u>CO₂ 몰수 = 탄소 원자 수</u>.</p><p><strong>탄소 개수 = CO₂ 몰수, 수소 개수 ÷ 2 = H₂O 몰수</strong>다. <strong>분자식만 보면 곧바로 나온다</strong> — 반응식을 다 맞출 필요가 없다.<br><strong>탄소 개수 = CO₂ 몰수, 수소 개수 ÷ 2 = H₂O 몰수</strong>다. <strong>에틸알코올의 수소는 5 + 1 = 6개</strong>이므로 물은 3몰이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">완전연소 생성물의 몰수</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">원소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">분자 속 개수</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">생성물</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>탄소 C</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>2개</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>CO₂ 2몰</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>수소 H</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>6개</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>H₂O 3몰</u> (H 2개당 물 1몰)</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>산소 O</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1개</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">반응식의 산소 계수를 줄인다</td></tr></tbody></table></div>", "nq": 3}, "card_chm_t133": {"kind": "공식형", "fq": 2, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "르 샤틀리에(Le Chatelier)의 법칙", "front": "르 샤틀리에(Le Chatelier)의 법칙의 식은?", "back": "<ul><li><strong>가연성 가스만으로 다시 비율을 잡는다</strong>. 합이 5 [vol%]이므로 헥산 20, 메탄 40, 에틸렌 40 [%]다. $\\dfrac{100}{L} = \\dfrac{20}{1.1} + \\dfrac{40}{5.0} + \\dfrac{40}{2.7} = 18.18 + 8 + 14.81 = 40.99$이므로 $L = 100 / 40.99 \\fallingdotseq 2.44$ [vol%]다.</li><li>$\\dfrac{100}{L} = \\dfrac{75}{1.9} + \\dfrac{25}{4.3} = 39.47 + 5.81 = 45.28$이므로 $L = 100 / 45.28 \\fallingdotseq 2.21$ [vol%]다.</li><li>가연성 가스만으로 다시 100 [%]로 잡는다. 합이 12 [vol%]이므로 헥산 66.7, 메탄 25, 에틸렌 8.3 [%]다. $\\dfrac{100}{L} = \\dfrac{66.7}{1.1} + \\dfrac{25}{5.0} + \\dfrac{8.3}{2.7} = 60.6 + 5 + 3.09 = 68.7$이므로 $L = 100 / 68.7 \\fallingdotseq 1.45$ [vol%]다.</li></ul><p><strong>◈ 암기</strong> <u>공기를 빼고 다시 100 [%]로</u>. · $\\dfrac{100}{L} = \\sum \\dfrac{V_{i}}{L_{i}}$.</p><p>$\\dfrac{100}{L} = \\sum \\dfrac{V_{i}}{L_{i}}$다. <strong>공기가 섞여 있으면 반드시 가연성 가스끼리 다시 100 [%]로 환산</strong>한 뒤에 넣어야 한다. 이 한 단계를 건너뛰면 12.89를 골라 틀린다.<br>98번과 같은 식이다. <strong>여기서는 이미 몰비로 주어져 100 [%] 환산이 끝나 있으므로</strong> 곧바로 넣으면 된다. <strong>결과는 늘 두 하한값 사이</strong>에 놓이므로(1.9 &lt; 2.21 &lt; 4.3) 검산이 된다.</p>", "nq": 4}, "card_chm_t152": {"kind": "단답형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "연소·폭발", "mid": "소염거리(quenching distance)", "front": "소염거리(quenching distance)는?", "back": "<strong>안전밸브</strong>는 <strong>압력을 빼는</strong> 장치다. 소염거리와 관계없다.<p><strong>◈ 암기</strong> <u>좁은 틈으로 화염을 식힌다</u>.</p><p><strong>불꽃이 좁은 틈을 지나면 벽에 열을 빼앗겨 꺼진다</strong> — 그 한계 간격이 소염거리다. <strong>화염방지기 · 역화방지기 · 내압 방폭구조</strong>가 모두 이 하나의 원리를 쓴다.</p><div style=\"margin:12px 0 2px;font-weight:700\">소염거리를 이용한 장치</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장치</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">어떻게 쓰나</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>화염방지기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가는 금망의 좁은 틈으로 화염의 열을 빼앗는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>역화방지기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>같은 원리로 역화를 막는다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>내압 방폭구조 기기</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>접합면의 좁고 긴 틈(최대안전틈새)으로 화염을 식힌다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전밸브</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>압력을 방출한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>소염과 무관</u></td></tr></tbody></table></div>", "nq": 1}, "card_chm_t153": {"kind": "단답형", "fq": 1, "subject": "화학설비위험방지기술", "chapter": "위험물", "mid": "위험물의 저장방법", "front": "위험물의 저장방법은?", "back": "<ul><li>니트로글리세린은 <strong>제5류 자기반응성 물질</strong>이다. <strong>강산화제와 함께 두면 폭발 위험이 커진다</strong>. <strong>찬 곳에 안정제와 함께</strong> 저장한다.</li><li><strong>탄화칼슘은 물과 만나 아세틸렌</strong>을 낸다. <strong>밀폐용기에 넣어 물기 없는 곳</strong>에 둔다.</li></ul><p><strong>◈ 암기</strong> <u>산화제와 함께 두지 않는다</u>. · <u>탄화칼슘은 물기 없는 곳에</u>.</p><p><strong>「산화제와 함께」라는 표현이 나오면 대개 오답</strong>이다. 산화제는 <strong>남을 태우는 것</strong>이라 <strong>가연물이나 자기반응성 물질과는 반드시 떼어</strong> 놓는다.<br><strong>「물속」에 넣는 것은 황린 하나</strong>이고 <strong>탄화칼슘은 정반대</strong>다. <strong>두 물질의 저장법을 서로 바꿔 놓는 것</strong>이 이 유형의 함정이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">위험물의 저장방법</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middl vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">무한궤도식(크롤러)</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">타이어식(휠)</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">접지압</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>낮다(넓게 닿는다)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">연약지반·경사로</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안정적</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>빠지거나 미끄러지기 쉽다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">이동 속도</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>느리다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>빠르다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\">도로 주행</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어렵다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>쉽다</u></td></tr></tbody></table></div>", "nq": 1}}};</script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const STUDY=MODE==='study';
const KEY=(STUDY?'safestudy_':'safecbt_')+D.round;
let S={i:0,ans:{},open:{},started:STUDY?1:0,elapsed:0,done:false};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
if(!S.open)S.open={};
if(STUDY)S.started=1;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function kx(el){if(window.renderMathInElement)renderMathInElement(el,{delimiters:[
 {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}

const MARK=['①','②','③','④'];
const LV={1:['#10b981','쉬움'],2:['#f59e0b','보통'],3:['#ef4444','어려움']};

function fmt(s){const m=Math.floor(s/60),x=s%60;
 return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+':'+String(x).padStart(2,'0');}

let tick=null;
function startTimer(){
 if(STUDY)return;
 clearInterval(tick);tick=setInterval(()=>{
  if(S.done)return;
  S.elapsed++;const left=D.limit-S.elapsed;
  const t=$('#timer'); if(!t)return;
  t.textContent=left>0?fmt(left):'00:00:00';
  t.classList.toggle('warn',left<600);
  if(left<=0)submit();
  if(S.elapsed%10===0)save();
 },1000);}

function intro(){
 $('#app').innerHTML=`<div class="wrap intro">
  <h2>${D.title}</h2>
  <p>6과목 120문항 · 시험시간 3시간</p>
  <p>합격 기준 — 과목당 40점 이상, 전 과목 평균 60점 이상</p>
  <p style="margin-top:14px;font-size:13px">답만 고르고 끝에 제출합니다.
   해설과 암기카드는 채점한 뒤에 열립니다.</p>
  <button class="big" id="go">시험 시작</button>
  ${Object.keys(S.ans).length?'<div style="margin-top:12px;font-size:13px;color:#64748b">이어서 풀면 지난번 답안이 그대로 살아 있습니다</div>':''}
 </div>`;
 $('#go').onclick=()=>{S.started=1;save();render();startTimer();};
}

// 해설이 열려 있는가 — 직접 여닫은 적이 있으면 그 뜻을 따른다
function solOpen(q){
 if(S.open[q.n]!==undefined)return S.open[q.n];
 return S.done||(STUDY&&!!S.ans[q.n]);
}

function qHTML(q){
 const a=S.ans[q.n], graded=(STUDY&&a)||S.done, show=STUDY||S.done;
 let h=`<div class="wrap"><div class="qh"><span class="qno">${String(q.n).padStart(3,'0')}</span>
  <span class="tag" style="background:${LV[q.lv][0]}">난이도 ${q.lv}·${LV[q.lv][1]}</span>
  <span class="tag" style="background:#6366f1">${q.kind}</span>
  <span class="tag" style="background:#f59e0b">빈출 ${'★'.repeat(q.fq)+'☆'.repeat(3-q.fq)}</span>
  <span class="subj">제${q.s}과목 ${D.subj[q.s-1]}</span>`;
 if(show){
   h+=`<span class="acts">
    <button class="mini${solOpen(q)?' on':''}" id="tsol">📖 해설 ${solOpen(q)?'닫기':'보기'}</button>
    ${q.card&&D.cards[q.card]?'<button class="mini cd" id="tcard">🃏 암기카드</button>':''}
   </span>`;
 }
 h+=`</div><div class="stem">${q.t}</div>`;
 if(q.cond)h+=`<div class="cond">${q.cond}</div>`;
 if(q.img)h+=`<img class="stemimg" src="img/${q.img}">`;
 for(let k=0;k<4;k++){
   let cls='opt';
   if(a===k+1)cls+=' sel';
   if(graded){ if(k+1===q.a)cls='opt right'; else if(a===k+1)cls='opt wrong'; }
   h+=`<button class="${cls}" data-k="${k+1}"><span class="n">${MARK[k]}</span><span>${q.c[k]}</span></button>`;
 }
 if(graded){
   h+= a===q.a ? `<div class="vline o">정답입니다 · 정답 ${q.a}번</div>`
              : `<div class="vline x">${a?'틀렸습니다 · 고른 답 '+a+'번 · ':'미응답 · '}정답 ${q.a}번</div>`;
 }
 if(show&&solOpen(q)){
   h+=`<div class="sol"><div class="lbl">해설</div><div>${q.sol}</div>`;
   if(q.w)h+=`<div class="lbl">오답 분석</div><div>${q.w}</div>`;
   if(q.pt)h+=`<div class="lbl g">관련 개념 · 암기</div><div class="box">${q.pt}</div>`;
   if(q.law)h+=q.law;
   h+=`</div>`;
 }
 return h+'</div>';
}

function render(){
 if(!S.started){intro();return;}
 if(!STUDY&&S.done&&S.i<0){result();return;}
 const q=D.q[S.i];
 $('#app').innerHTML=qHTML(q);
 $$('.opt').forEach(b=>b.onclick=()=>{
   S.ans[q.n]=+b.dataset.k;
   if(STUDY&&S.open[q.n]===undefined)S.open[q.n]=true;
   save();
   if(STUDY||S.done){render();}
   else{$$('.opt').forEach(x=>x.classList.toggle('sel',x===b));paint();}
 });
 const ts=$('#tsol'); if(ts)ts.onclick=()=>{S.open[q.n]=!solOpen(q);save();render();};
 const tc=$('#tcard'); if(tc)tc.onclick=()=>openCard(q.card);
 kx($('#app'));
 stat();
 $('#prev').disabled=S.i===0; $('#next').disabled=S.i===119;
 paint();
 window.scrollTo(0,0);
}

function stat(){
 const n=Object.keys(S.ans).length;
 if(STUDY){
   let ok=0; D.q.forEach(q=>{if(S.ans[q.n]===q.a)ok++;});
   $('#prog').innerHTML=`<b>${S.i+1}</b> / 120 · 푼 문항 <b>${n}</b> · 맞힘 <b>${ok}</b>`;
   const r=$('#rate');
   if(r)r.textContent=n?`정답률 ${Math.round(ok/n*100)}%`:'정답률 —';
 }else{
   $('#prog').innerHTML=S.done?`채점 완료`:`<b>${S.i+1}</b> / 120 · 푸는 중 <b>${n}</b>`;
 }
}

/* 암기카드 팝업 */
let mflip=false;
function openCard(id){
 const c=D.cards[id]; if(!c)return;
 mflip=false;
 $('#mbody').innerHTML=`<button class="mx" id="mx">✕</button>
  <div class="mcard" id="mcard">
   <div class="mface">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span class="stars">${'★'.repeat(c.fq)+'☆'.repeat(3-c.fq)}</span>
     <span>${c.subject}${c.chapter?' · '+c.chapter:''}</span>
     <span class="mcid">${id}</span></div>
    <div class="mq">${c.front}</div>
    <div class="mhint">카드를 누르면 뒤집힙니다 · Esc 닫기</div>
   </div>
   <div class="mface back">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span>${c.mid}</span><span class="mcid">${id}</span></div>
    <div class="ma">${c.back}</div>
    <div class="mfoot"><span>이 개념을 묻는 문항 ${c.nq}개</span>
     <a href="../_암기카드.html#${id}" target="_blank">카드 전체 보기 →</a></div>
   </div>
  </div>`;
 $('#modal').classList.add('on');
 kx($('#mbody'));
 fitCard(); setTimeout(fitCard,260);
 $('#mcard').onclick=()=>{mflip=!mflip;$('#mcard').classList.toggle('flip',mflip);};
 $('#mx').onclick=e=>{e.stopPropagation();closeCard();};
}
function fitCard(){
 const mc=$('#mcard'); if(!mc)return;
 mc.style.height='120px';
 const h=Math.max(...[...mc.querySelectorAll('.mface')].map(f=>f.scrollHeight));
 mc.style.height=Math.min(window.innerHeight*0.78,Math.max(300,h+4))+'px';
}
function closeCard(){$('#modal').classList.remove('on');}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeCard();};
window.addEventListener('resize',()=>{if($('#modal').classList.contains('on'))fitCard();});

function paint(){
 $$('.pg').forEach(b=>{
   const n=+b.dataset.n, q=D.q[n-1];
   const marked=STUDY?!!S.ans[n]:S.done;
   let c='pg';
   if(marked&&(STUDY||S.done))c+=(S.ans[n]===q.a?' ok':' no');
   else if(S.ans[n])c+=' done';
   if(n-1===S.i)c+=' cur';
   b.className=c;
 });
}

function submit(){
 if(STUDY||S.done)return;
 const un=120-Object.keys(S.ans).length;
 if(un>0&&!confirm('안 푼 문제가 '+un+'개 있습니다. 제출할까요?'))return;
 S.done=true;clearInterval(tick);save();S.i=-1;result();
}

function result(){
 const per=[0,0,0,0,0,0],tot=[0,0,0,0,0,0];
 let right=0;
 D.q.forEach(q=>{tot[q.s-1]++;if(S.ans[q.n]===q.a){per[q.s-1]++;right++;}});
 const scores=per.map((v,i)=>Math.round(v/tot[i]*100));
 const avg=Math.round(right/120*100);
 const pass=avg>=60&&scores.every(s=>s>=40);
 let h=`<div class="result"><div style="text-align:center;color:#64748b;font-size:13px">${D.title} · 채점 결과</div>
  <div class="score">${avg}<span style="font-size:20px;color:#94a3b8">점</span></div>
  <div style="text-align:center;color:#64748b;font-size:14px">120문항 중 <b>${right}</b>문항 정답 · 소요 ${fmt(S.elapsed)}</div>
  <div class="verdict ${pass?'pass':'fail'}">${pass?'합격':'불합격'}</div>
  <table class="stab"><tr><th>과목</th><th>맞힌 문항</th><th>점수</th></tr>`;
 for(let i=0;i<6;i++){
   h+=`<tr><td style="text-align:left">제${i+1}과목 ${D.subj[i]}</td>
    <td>${per[i]} / ${tot[i]}</td><td class="${scores[i]<40?'bad':''}">${scores[i]}</td></tr>`;
 }
 h+=`</table><div style="font-size:12.5px;color:#64748b;text-align:center">합격 — 과목당 40점 이상, 평균 60점 이상</div>
  <div class="rowbtns">
   <button class="nbtn pri" id="rw">틀린 문제만 다시 보기</button>
   <button class="nbtn" id="rall">전체 해설 보기</button>
   <button class="nbtn" id="rst">다시 풀기</button>
  </div></div>`;
 $('#app').innerHTML=h;
 paint(); stat();
 $('#rw').onclick=()=>{const bad=D.q.findIndex(q=>S.ans[q.n]!==q.a);S.i=bad<0?0:bad;render();};
 $('#rall').onclick=()=>{S.i=0;render();};
 $('#rst').onclick=()=>{if(confirm('답안을 지우고 처음부터 다시 풀까요?')){
   S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();startTimer();}};
}

function build(){
 let p='';
 for(let s=1;s<=6;s++){
   p+=`<div class="palhd">제${s}과목 ${D.subj[s-1]}</div><div class="palgrid">`;
   D.q.filter(q=>q.s===s).forEach(q=>{p+=`<button class="pg" data-n="${q.n}">${q.n}</button>`;});
   p+='</div>';
 }
 $('#pal').innerHTML=p;
 $$('.pg').forEach(b=>b.onclick=()=>{S.i=+b.dataset.n-1;save();render();$('#pal').classList.remove('open');});
}

$('#prev').onclick=()=>{if(S.i>0){S.i--;save();render();}};
$('#next').onclick=()=>{if(S.i<119){S.i++;save();render();}};
$('#palbtn').onclick=()=>$('#pal').classList.toggle('open');
const sb=$('#sub'); if(sb)sb.onclick=submit;
const rs=$('#reset'); if(rs)rs.onclick=()=>{if(confirm('푼 기록을 모두 지울까요?')){
 S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();}};
document.addEventListener('keydown',e=>{
 if($('#modal').classList.contains('on')){
   if(e.key==='Escape')closeCard();
   if(e.key===' '){e.preventDefault();$('#mcard').click();}
   return;
 }
 if(e.key==='ArrowLeft')$('#prev').click();
 if(e.key==='ArrowRight')$('#next').click();
 if('1234'.includes(e.key)){const b=$$('.opt')[+e.key-1];if(b)b.click();}
 if(e.key==='s'||e.key==='S'){const t=$('#tsol');if(t)t.click();}
 if(e.key==='c'||e.key==='C'){const t=$('#tcard');if(t)t.click();}
});
build();
const hm=location.hash.match(/^#q(\d+)/);
if(hm){S.started=1;S.i=Math.max(0,Math.min(119,+hm[1]-1));save();}
if(!STUDY&&S.done){if(hm){render();}else{S.i=-1;result();}}
else{render();if(S.started)startTimer();}
</script>
</body></html>
