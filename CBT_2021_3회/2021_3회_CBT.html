, "chapter": "프레스·전단기", "mid": "롤러기의 급정지장치", "front": "롤러기의 급정지장치는?", "back": "<ul><li><strong>급정지장치</strong>다. 두 롤 사이에 말려 들어갈 때 <strong>곧바로 세우는</strong> 장치다.</li><li>무릎조작식은 <strong>밑면에서 0.4 [m] 이상 0.6 [m] 이내</strong>다.</li><li><strong>손 조작식은 밑면으로부터 1.8m 이내</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>롤러기는 급정지장치</u>. · <u>무릎은 0.4 ~ 0.6 [m]</u>.</p><p>급정지거리는 <strong>표면속도 30 [m/min] 미만이면 원주의 1/3, 30 [m/min] 이상이면 1/2.5</strong> 이내다. <strong>느릴수록 짧게 세워야</strong> 한다는 것이 뜻밖이지만, 느린 기계일수록 사람이 말려 들어갈 여지가 크기 때문이다.<br><strong>몸에서 그 부위가 있는 높이 그대로</strong>다 — <strong>손은 위(1.8), 배는 가운데(0.8 ~ 1.1), 무릎은 아래(0.4 ~ 0.6)</strong>. <strong>외울 것이 아니라 몸을 떠올리면</strong> 된다.</p><div style=\"margin:12px 0 2px;font-weight:700\">롤러기 급정지장치의 조작부</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">종류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">설치 위치</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>손 조작식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>밑면에서 1.8 [m] 이내</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>복부 조작식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>밑면에서 0.8 [m] 이상 1.1 [m] 이내</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>무릎 조작식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>밑면에서 0.6 [m] 이내</u></td></tr></tbody></table></div><p><em>근거 — 안전보건규칙 제147조</em></p>", "nq": 6}, "card_mac_t254": {"kind": "단답형", "fq": 1, "subject": "기계위험방지기술", "chapter": "기계 일반", "mid": "프레스의 no hand in die", "front": "프레스의 no hand in die는?", "back": "<ul><li><strong>방호울식</strong>이다. <strong>아예 손이 들어갈 틈을 없앤</strong> 것이다.</li><li><strong>양수조작식</strong>은 <strong>손이 금형에 들어가는 것을 전제</strong>로 한 hand in die 방식이다.</li></ul><p><strong>◈ 암기</strong> <u>방호울식이 no hand in die</u>. · <u>양수조작식은 hand in die</u>.</p><p><strong>「금형 안에 손이 없다」는 이름 그대로</strong>다 — <strong>손이 들어가는 것을 전제로 하는 장치(수인 · 손쳐내기 · 광전자)는 모두 hand in die</strong>다.<br><strong>「손이 아예 못 들어가게」 만드는 것이 No hand in die</strong>다 — <strong>양수조작식은 두 손을 밖에 두게 할 뿐, 금형 안은 여전히 열려 있다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">No hand in die와 Hand in die</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구분</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">방식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>No hand in die</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>안전울(방호울) 부착 · 안전금형 · 전용 프레스 · 자동송급장치</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>손이 들어갈 수 없다</u> · 본질적 안전화</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>Hand in die</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가드식 · 수인식 · 손쳐내기식 · 양수조작식 · 광전자식</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>손은 들어가되 다치지 않게</u></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t329": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "누전차단기의 기준", "front": "누전차단기의 기준은?", "back": "물기가 있는 곳은 <strong>15mA 이하, 0.03초 이하</strong>다.<p><strong>◈ 암기</strong> <u>물기 있는 곳은 15mA 이하, 0.03초 이하</u>.</p><p><strong>젖으면 인체저항이 뚝 떨어져 같은 전압에도 전류가 커진다</strong> — <strong>그래서 감도전류만 절반(30 → 15mA)</strong>으로 낮춘다. <strong>동작시간 0.03초는 그대로</strong>다.</p><div style=\"margin:12px 0 2px;font-weight:700\">누전차단기의 정격감도전류와 동작시간</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">장소</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>일반 장소</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>30mA 이하, 0.03초 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>물기가 있는 장소(욕실 등)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>15mA 이하, 0.03초 이하</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>동작시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>어디서나 0.03초</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>감도전류만 절반으로 낮춘다</u></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t315": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "위험한계에너지", "front": "위험한계에너지의 식은?", "back": "<ul><li>$W = I^{2} R T = ( 0.165 )^{2} \\times 500 \\times 1 \\fallingdotseq 13.6 \\, J$</li><li>$W = ( 0.165 )^{2} \\times 5 {,} 000 \\times 1 \\fallingdotseq 136 \\, J$</li><li>$W = I^{2} R T = ( 0.165 )^{2} \\times 800 \\times 1 \\fallingdotseq 21.8 \\, J$약 <strong>22 J</strong>이다.</li></ul><p><strong>◈ 암기</strong> <u>500Ω · 1초의 위험한계에너지는 13.6 J</u>. · <u>5,000Ω 이면 136 J</u>.</p><p><strong>mA를 A로 고치는 것</strong>이 유일한 함정이다 — <strong>165mA = 0.165A</strong>다. <strong>「13.6 J」이라는 값은 통째로 외워 두면 검산에 쓸 수 있다</strong>.<br><strong>500Ω 일 때 13.6 J</strong>을 외워 두면 <strong>5,000Ω 은 그 10배인 136 J</strong>로 곧장 나온다 — <strong>저항만 바꿔 되풀이 출제</strong>되는 문항이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">심실세동의 위험한계에너지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>심실세동전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$I = \\dfrac{165}{\\sqrt{T}} \\, [ \\mathrm{mA} ]$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">T = 1초 → 165 mA</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>에너지</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$W = I^{2} R T$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>계산</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$( 0.165 )^{2} \\times 500 = 13.61$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>약 13.6 J</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>같은 조건 5,000Ω</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>136 J</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">저항이 10배면 에너지도 10배</td></tr></tbody></table></div>", "nq": 3}, "card_ele_t135": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "누전차단기의 정격감도전류", "front": "누전차단기의 정격감도전류의 식은?", "back": "<ul><li><strong>30 [mA], 0.1초</strong>다. 감전의 위험한계는 <strong>전류 × 시간 = 50 [mA·s]</strong> 인데, $30 \\times 0.1 = 3$ [mA·s]로 넉넉히 아래에 든다. 60 [mA] 이상은 <strong>심실세동 영역</strong>에 들어 위험하다.</li><li><strong>감전을 막으려면 정격감도전류가 30 [mA] 이하</strong>라야 한다. <strong>값이 클수록 사람이 다친 뒤에야 끊긴다</strong>.</li><li><strong>30mA 이하, 0.03초 이내</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>일반 30, 물기 15</u>. · <u>감전방지는 30 [mA]</u>.</p><p><strong>일반 장소 30 [mA] 이하, 물기 있는 장소 15 [mA] 이하</strong>이고 <strong>동작시간은 어느 쪽이든 0.03초 이내</strong>다. 이 문항은 보기의 시간이 모두 같으므로 <strong>전류 하나로 갈린다</strong>.<br><strong>보기 넷이 동작시간은 모두 같고 감도전류만 다르다</strong> — <strong>사람을 지키는 값은 가장 작은 30 [mA]</strong>다. <strong>그보다 크면 사람이 감전된 뒤에야 끊긴다</strong>.</p><div style=\"margin:12px 0 2px;font-weight:700\">통전전류의 크기와 인체 반응</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">전류</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">이름</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">몸에 일어나는 일</th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>약 1 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>최소감지전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">찌릿함을 느낀다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>7 ~ 8 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>고통한계전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">견딜 수는 있다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>10 ~ 15 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>가수전류(이탈전류)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>스스로 손을 뗄 수 있는 한계</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>20 ~ 50 [mA]</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>불수전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>근육이 굳어 손을 못 뗀다</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>50 [mA] 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>심실세동전류</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>목숨이 위태롭다</u></td></tr></tbody></table></div>", "nq": 3}, "card_ele_t301": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "감전재해", "mid": "변압기 중성점 접지저항", "front": "변압기 중성점 접지저항의 식은?", "back": "<ul><li>$R = \\dfrac{150}{I_{1}} = \\dfrac{150}{15} = 10 \\, \\Omega$</li><li>1초를 넘고 2초 이내에 차단하면 <strong>300/I</strong>이다.$R = \\dfrac{300}{10} = 30 \\, \\Omega$</li></ul><p><strong>◈ 암기</strong> <u>중성점 접지저항 = 150 ÷ 1선지락전류</u>. · <u>1초 초과 2초 이내는 300 ÷ 1선지락전류</u>.</p><p><strong>150 · 300 · 600 세 수는 「차단이 빠를수록 크게 허용」</strong> 한다는 뜻이다 — <strong>빨리 끊으면 위험한 시간이 짧으니 저항이 커도 된다</strong>.<br><strong>빨리 끊을수록 저항을 크게 허용</strong>한다 — <strong>150 → 300 → 600</strong>으로 두 배씩 커진다. <strong>위험한 시간이 짧으니 조건을 늦춰 주는 것</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">변압기 중성점 접지저항</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">조건</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>원칙</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$R = \\dfrac{150}{I_{1}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1초를 넘고 2초 이내에 차단</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$R = \\dfrac{300}{I_{1}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>1초 이내에 차단</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$R = \\dfrac{600}{I_{1}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>계산</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\dfrac{150}{15} = 10$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_ele_t102": {"kind": "단답형", "fq": 1, "subject": "전기위험방지기술", "chapter": "전기 방폭", "mid": "방폭기기의 온도등급", "front": "방폭기기의 온도등급은?", "back": "<ul><li><strong>T2는 300 [℃] 이하</strong>다.</li><li><strong>T1은 450 [℃] 이하</strong>가 맞다. 나머지 셋은 값이 어긋난다.</li><li><strong>200 [℃] 초과 300 [℃] 이하가 T2</strong>다.</li></ul><p><strong>◈ 암기</strong> <u>450 · 300 · 200 · 135 · 100 · 85</u>. · <u>T2는 200 ~ 300 [℃]</u>.</p><p><strong>숫자가 클수록 허용온도가 낮다</strong>. 기기 표면이 <strong>그 가스의 발화점보다 낮아야</strong> 하므로, 발화점이 낮은 가스일수록 높은 등급(T5·T6)이 필요하다.<br>여섯 값을 <strong>450 · 300 · 200 · 135 · 100 · 85</strong>로 통째로 외운다. <strong>숫자를 조금씩 비틀어 놓는 것</strong>이 이 유형의 함정이라, 정확히 외우지 않으면 걸린다.</p><div style=\"margin:12px 0 2px;font-weight:700\">온도등급과 최고표면온도</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 기술", "chapter": "감전재해", "mid": "자동전격방지장치", "front": "자동전격방지장치는?", "back": "<strong>25 ~ 30V 이하</strong>로 낮춘다. <strong>안전전압 수준까지 떨어뜨리는</strong> 것이다.<p><strong>◈ 암기</strong> <u>아크 중단 후 25 ~ 30V 이하, 1초 이내</u>.</p><p><strong>평상시 60 ~ 95V를 아크가 끊긴 뒤 25 ~ 30V로</strong> 떨어뜨린다 — <strong>안전전압(30V) 언저리까지 내리는 것</strong>이 목적이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">교류 아크용접기의 자동전격방지장치</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">항목</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">기준</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>평상시 무부하 전압</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>60 ~ 95V</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">감전 위험이 있다</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>아크 중단 후</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>25 ~ 30V 이하로 낮춘다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>작동 시간</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>1초 이내</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td s e=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>(1,260 − 800) ÷ 800 × 100</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>= 57.5%</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>기준</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>일반적으로 20% 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">여유가 클수록 안전</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>제한전압</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>피뢰기가 방전 중에도 남겨 두는 전압</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_ele_t332": {"kind": "공식형", "fq": 1, "subject": "전기위험방지기술", "chapter": "", "mid": "전자파의 에너지", "front": "전자파의 에너지의 식은?", "back": "<strong>가시광선</strong>이다. <strong>주파수가 높을수록 광량자 에너지가 크다</strong>.<p><strong>◈ 암기</strong> <u>주파수가 높을수록 광량자 에너지가 크다</u>.</p><p>$E = h \\nu$— <strong>주파수가 높을수록 에너지가 크다</strong> . <strong>극저주파 → 마이크로파 → 적외선 → 가시광선</strong> 순으로 주파수가 올라간다.</p><div style=\"margin:12px 0 2px;font-weight:700\">전자파의 광량자 에너지</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">전자파</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">주파수</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid er:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>높이 1.8m 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>발끝막이판</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>바닥면에서 10cm 이상</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_con_t303": {"kind": "공식형", "fq": 1, "subject": "건설안전기술", "chapter": "가시설물", "mid": "허용응력과 안전율", "front": "허용응력과 안전율의 식은?", "back": "$\\text{허용응력} = \\dfrac{\\text{인장강도}}{\\text{안전계수}} = \\dfrac{2 {,} 000}{4} = 500 \\, \\mathrm{kg} / \\mathrm{cm}^{2}$<p><strong>◈ 암기</strong> <u>허용응력 = 인장강도 ÷ 안전계수</u>.</p><p><strong>안전율이 크면 허용응력은 작아진다</strong> — <strong>나누는 것</strong>이라 방향이 뚜렷하다. <strong>2,000을 그대로 답으로 고르면 안전율을 쓰지 않은 셈</strong>이다.</p><div style=\"margin:12px 0 2px;font-weight:700\">안전율과 허용응력</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">식</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>안전율</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$S = \\dfrac{\\text{기초강도}}{\\text{허용응력}}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>허용응력</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">$\\text{허용응력} = \\dfrac{\\text{기초강도}}{S}$</td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>이 문항</u></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>계산</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>2,000 ÷ 4 = 500</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>뜻</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>실제로는 견디는 힘의 1/4 까지만 쓴다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}, "card_con_t273": {"kind": "단답형", "fq": 1, "subject": "건설안전기술", "chapter": "운반·하역", "mid": "정격하중", "front": "정격하중은?", "back": "<strong>정격하중</strong>이다. <strong>최대하중에서 달기구 무게를 뺀 값</strong>이다.<p><strong>◈ 암기</strong> <u>정격하중 = 최대하중 − 달기구 중량</u>.</p><p><strong>후크와 로프도 무게가 있으니 그만큼은 짐을 못 싣는다</strong> — <strong>그 몫을 뺀 것이 정격하중</strong>이다. <strong>「정격」이 붙으면 늘 「실제로 쓸 수 있는 값」</strong>이다.<br><strong>후크와 로프도 무게가 있어 그만큼은 짐을 못 싣는다</strong> — <strong>그 몫을 뺀 것이 정격하중</strong>이다. <strong>「정격」은 늘 「실제로 쓸 수 있는 값」</strong>을 가리킨다.</p><div style=\"margin:12px 0 2px;font-weight:700\">양중기의 하중 용어</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">용어</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">뜻</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>정격하중</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>최대하중에서 달기구의 중량을 뺀 하중</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>실제로 들 수 있는 짐의 무게</u> · 이 문항</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>권상하중(최대하중)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>들어 올릴 수 있는 최대의 하중</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">달기구 무게를 포함</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>적재하중</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>승강기·리프트에 실을 수 있는 최대 하중</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>임계하중</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>좌굴이 일어나는 하중</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 2}, "card_con_t304": {"kind": "단답형", "fq": 1, "subject": "건설안전기술", "chapter": "건설재해 대책", "mid": "발끝막이판(폭목)", "front": "발끝막이판(폭목)은?", "back": "<strong>발끝막이판(폭목)</strong>은 <strong>발판 위의 물건이 굴러떨어지지 않게</strong> 막는다.<p><strong>◈ 암기</strong> <u>폭목은 물체의 낙하를 막는다</u>.</p><p><strong>「폭목(toe board)」은 발끝(toe) 높이의 판</strong>이다 — <strong>사람이 아니라 물건을 막는 것</strong>이라는 데서 다른 셋과 갈린다.</p><div style=\"margin:12px 0 2px;font-weight:700\">안전난간의 구성과 구실</div><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:.96em\"><thead><tr><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구성</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\">구실</th><th style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;background:#f1f5f9;font-weight:700;\"></th></tr></thead><tbody><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>상부난간대</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>사람이 떨어지지 않게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\">바닥면에서 90 ~ 120cm</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>중간난간대</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>몸이 빠져나가지 않게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>발끝막이판(폭목)</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>물체가 굴러떨어지지 않게</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>바닥면에서 10cm 이상</u> · 이 문항</td></tr><tr><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:center;\"><u>난간기둥</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"><u>난간대를 지탱한다</u></td><td style=\"border:1px solid #cbd5e1;padding:7px 12px;vertical-align:middle;text-align:left;\"></td></tr></tbody></table></div>", "nq": 1}}};</script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const STUDY=MODE==='study';
const KEY=(STUDY?'safestudy_':'safecbt_')+D.round;
let S={i:0,ans:{},open:{},started:STUDY?1:0,elapsed:0,done:false};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
if(!S.open)S.open={};
if(STUDY)S.started=1;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function kx(el){if(window.renderMathInElement)renderMathInElement(el,{delimiters:[
 {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}

const MARK=['①','②','③','④'];
const LV={1:['#10b981','쉬움'],2:['#f59e0b','보통'],3:['#ef4444','어려움']};

function fmt(s){const m=Math.floor(s/60),x=s%60;
 return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+':'+String(x).padStart(2,'0');}

let tick=null;
function startTimer(){
 if(STUDY)return;
 clearInterval(tick);tick=setInterval(()=>{
  if(S.done)return;
  S.elapsed++;const left=D.limit-S.elapsed;
  const t=$('#timer'); if(!t)return;
  t.textContent=left>0?fmt(left):'00:00:00';
  t.classList.toggle('warn',left<600);
  if(left<=0)submit();
  if(S.elapsed%10===0)save();
 },1000);}

function intro(){
 $('#app').innerHTML=`<div class="wrap intro">
  <h2>${D.title}</h2>
  <p>6과목 120문항 · 시험시간 3시간</p>
  <p>합격 기준 — 과목당 40점 이상, 전 과목 평균 60점 이상</p>
  <p style="margin-top:14px;font-size:13px">답만 고르고 끝에 제출합니다.
   해설과 암기카드는 채점한 뒤에 열립니다.</p>
  <button class="big" id="go">시험 시작</button>
  ${Object.keys(S.ans).length?'<div style="margin-top:12px;font-size:13px;color:#64748b">이어서 풀면 지난번 답안이 그대로 살아 있습니다</div>':''}
 </div>`;
 $('#go').onclick=()=>{S.started=1;save();render();startTimer();};
}

// 해설이 열려 있는가 — 직접 여닫은 적이 있으면 그 뜻을 따른다
function solOpen(q){
 if(S.open[q.n]!==undefined)return S.open[q.n];
 return S.done||(STUDY&&!!S.ans[q.n]);
}

function qHTML(q){
 const a=S.ans[q.n], graded=(STUDY&&a)||S.done, show=STUDY||S.done;
 let h=`<div class="wrap"><div class="qh"><span class="qno">${String(q.n).padStart(3,'0')}</span>
  <span class="tag" style="background:${LV[q.lv][0]}">난이도 ${q.lv}·${LV[q.lv][1]}</span>
  <span class="tag" style="background:#6366f1">${q.kind}</span>
  <span class="tag" style="background:#f59e0b">빈출 ${'★'.repeat(q.fq)+'☆'.repeat(3-q.fq)}</span>
  <span class="subj">제${q.s}과목 ${D.subj[q.s-1]}</span>`;
 if(show){
   h+=`<span class="acts">
    <button class="mini${solOpen(q)?' on':''}" id="tsol">📖 해설 ${solOpen(q)?'닫기':'보기'}</button>
    ${q.card&&D.cards[q.card]?'<button class="mini cd" id="tcard">🃏 암기카드</button>':''}
   </span>`;
 }
 h+=`</div><div class="stem">${q.t}</div>`;
 if(q.cond)h+=`<div class="cond">${q.cond}</div>`;
 if(q.img)h+=`<img class="stemimg" src="img/${q.img}">`;
 for(let k=0;k<4;k++){
   let cls='opt';
   if(a===k+1)cls+=' sel';
   if(graded){ if(k+1===q.a)cls='opt right'; else if(a===k+1)cls='opt wrong'; }
   h+=`<button class="${cls}" data-k="${k+1}"><span class="n">${MARK[k]}</span><span>${q.c[k]}</span></button>`;
 }
 if(graded){
   h+= a===q.a ? `<div class="vline o">정답입니다 · 정답 ${q.a}번</div>`
              : `<div class="vline x">${a?'틀렸습니다 · 고른 답 '+a+'번 · ':'미응답 · '}정답 ${q.a}번</div>`;
 }
 if(show&&solOpen(q)){
   h+=`<div class="sol"><div class="lbl">해설</div><div>${q.sol}</div>`;
   if(q.w)h+=`<div class="lbl">오답 분석</div><div>${q.w}</div>`;
   if(q.pt)h+=`<div class="lbl g">관련 개념 · 암기</div><div class="box">${q.pt}</div>`;
   if(q.law)h+=q.law;
   h+=`</div>`;
 }
 return h+'</div>';
}

function render(){
 if(!S.started){intro();return;}
 if(!STUDY&&S.done&&S.i<0){result();return;}
 const q=D.q[S.i];
 $('#app').innerHTML=qHTML(q);
 $$('.opt').forEach(b=>b.onclick=()=>{
   S.ans[q.n]=+b.dataset.k;
   if(STUDY&&S.open[q.n]===undefined)S.open[q.n]=true;
   save();
   if(STUDY||S.done){render();}
   else{$$('.opt').forEach(x=>x.classList.toggle('sel',x===b));paint();}
 });
 const ts=$('#tsol'); if(ts)ts.onclick=()=>{S.open[q.n]=!solOpen(q);save();render();};
 const tc=$('#tcard'); if(tc)tc.onclick=()=>openCard(q.card);
 kx($('#app'));
 stat();
 $('#prev').disabled=S.i===0; $('#next').disabled=S.i===119;
 paint();
 window.scrollTo(0,0);
}

function stat(){
 const n=Object.keys(S.ans).length;
 if(STUDY){
   let ok=0; D.q.forEach(q=>{if(S.ans[q.n]===q.a)ok++;});
   $('#prog').innerHTML=`<b>${S.i+1}</b> / 120 · 푼 문항 <b>${n}</b> · 맞힘 <b>${ok}</b>`;
   const r=$('#rate');
   if(r)r.textContent=n?`정답률 ${Math.round(ok/n*100)}%`:'정답률 —';
 }else{
   $('#prog').innerHTML=S.done?`채점 완료`:`<b>${S.i+1}</b> / 120 · 푸는 중 <b>${n}</b>`;
 }
}

/* 암기카드 팝업 */
let mflip=false;
function openCard(id){
 const c=D.cards[id]; if(!c)return;
 mflip=false;
 $('#mbody').innerHTML=`<button class="mx" id="mx">✕</button>
  <div class="mcard" id="mcard">
   <div class="mface">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span class="stars">${'★'.repeat(c.fq)+'☆'.repeat(3-c.fq)}</span>
     <span>${c.subject}${c.chapter?' · '+c.chapter:''}</span>
     <span class="mcid">${id}</span></div>
    <div class="mq">${c.front}</div>
    <div class="mhint">카드를 누르면 뒤집힙니다 · Esc 닫기</div>
   </div>
   <div class="mface back">
    <div class="mmeta"><span class="badge b-${c.kind}">${c.kind}</span>
     <span>${c.mid}</span><span class="mcid">${id}</span></div>
    <div class="ma">${c.back}</div>
    <div class="mfoot"><span>이 개념을 묻는 문항 ${c.nq}개</span>
     <a href="../_암기카드.html#${id}" target="_blank">카드 전체 보기 →</a></div>
   </div>
  </div>`;
 $('#modal').classList.add('on');
 kx($('#mbody'));
 fitCard(); setTimeout(fitCard,260);
 $('#mcard').onclick=()=>{mflip=!mflip;$('#mcard').classList.toggle('flip',mflip);};
 $('#mx').onclick=e=>{e.stopPropagation();closeCard();};
}
function fitCard(){
 const mc=$('#mcard'); if(!mc)return;
 mc.style.height='120px';
 const h=Math.max(...[...mc.querySelectorAll('.mface')].map(f=>f.scrollHeight));
 mc.style.height=Math.min(window.innerHeight*0.78,Math.max(300,h+4))+'px';
}
function closeCard(){$('#modal').classList.remove('on');}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeCard();};
window.addEventListener('resize',()=>{if($('#modal').classList.contains('on'))fitCard();});

function paint(){
 $$('.pg').forEach(b=>{
   const n=+b.dataset.n, q=D.q[n-1];
   const marked=STUDY?!!S.ans[n]:S.done;
   let c='pg';
   if(marked&&(STUDY||S.done))c+=(S.ans[n]===q.a?' ok':' no');
   else if(S.ans[n])c+=' done';
   if(n-1===S.i)c+=' cur';
   b.className=c;
 });
}

function submit(){
 if(STUDY||S.done)return;
 const un=120-Object.keys(S.ans).length;
 if(un>0&&!confirm('안 푼 문제가 '+un+'개 있습니다. 제출할까요?'))return;
 S.done=true;clearInterval(tick);save();S.i=-1;result();
}

function result(){
 const per=[0,0,0,0,0,0],tot=[0,0,0,0,0,0];
 let right=0;
 D.q.forEach(q=>{tot[q.s-1]++;if(S.ans[q.n]===q.a){per[q.s-1]++;right++;}});
 const scores=per.map((v,i)=>Math.round(v/tot[i]*100));
 const avg=Math.round(right/120*100);
 const pass=avg>=60&&scores.every(s=>s>=40);
 let h=`<div class="result"><div style="text-align:center;color:#64748b;font-size:13px">${D.title} · 채점 결과</div>
  <div class="score">${avg}<span style="font-size:20px;color:#94a3b8">점</span></div>
  <div style="text-align:center;color:#64748b;font-size:14px">120문항 중 <b>${right}</b>문항 정답 · 소요 ${fmt(S.elapsed)}</div>
  <div class="verdict ${pass?'pass':'fail'}">${pass?'합격':'불합격'}</div>
  <table class="stab"><tr><th>과목</th><th>맞힌 문항</th><th>점수</th></tr>`;
 for(let i=0;i<6;i++){
   h+=`<tr><td style="text-align:left">제${i+1}과목 ${D.subj[i]}</td>
    <td>${per[i]} / ${tot[i]}</td><td class="${scores[i]<40?'bad':''}">${scores[i]}</td></tr>`;
 }
 h+=`</table><div style="font-size:12.5px;color:#64748b;text-align:center">합격 — 과목당 40점 이상, 평균 60점 이상</div>
  <div class="rowbtns">
   <button class="nbtn pri" id="rw">틀린 문제만 다시 보기</button>
   <button class="nbtn" id="rall">전체 해설 보기</button>
   <button class="nbtn" id="rst">다시 풀기</button>
  </div></div>`;
 $('#app').innerHTML=h;
 paint(); stat();
 $('#rw').onclick=()=>{const bad=D.q.findIndex(q=>S.ans[q.n]!==q.a);S.i=bad<0?0:bad;render();};
 $('#rall').onclick=()=>{S.i=0;render();};
 $('#rst').onclick=()=>{if(confirm('답안을 지우고 처음부터 다시 풀까요?')){
   S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();startTimer();}};
}

function build(){
 let p='';
 for(let s=1;s<=6;s++){
   p+=`<div class="palhd">제${s}과목 ${D.subj[s-1]}</div><div class="palgrid">`;
   D.q.filter(q=>q.s===s).forEach(q=>{p+=`<button class="pg" data-n="${q.n}">${q.n}</button>`;});
   p+='</div>';
 }
 $('#pal').innerHTML=p;
 $$('.pg').forEach(b=>b.onclick=()=>{S.i=+b.dataset.n-1;save();render();$('#pal').classList.remove('open');});
}

$('#prev').onclick=()=>{if(S.i>0){S.i--;save();render();}};
$('#next').onclick=()=>{if(S.i<119){S.i++;save();render();}};
$('#palbtn').onclick=()=>$('#pal').classList.toggle('open');
const sb=$('#sub'); if(sb)sb.onclick=submit;
const rs=$('#reset'); if(rs)rs.onclick=()=>{if(confirm('푼 기록을 모두 지울까요?')){
 S={i:0,ans:{},open:{},started:1,elapsed:0,done:false};save();render();}};
document.addEventListener('keydown',e=>{
 if($('#modal').classList.contains('on')){
   if(e.key==='Escape')closeCard();
   if(e.key===' '){e.preventDefault();$('#mcard').click();}
   return;
 }
 if(e.key==='ArrowLeft')$('#prev').click();
 if(e.key==='ArrowRight')$('#next').click();
 if('1234'.includes(e.key)){const b=$$('.opt')[+e.key-1];if(b)b.click();}
 if(e.key==='s'||e.key==='S'){const t=$('#tsol');if(t)t.click();}
 if(e.key==='c'||e.key==='C'){const t=$('#tcard');if(t)t.click();}
});
build();
const hm=location.hash.match(/^#q(\d+)/);
if(hm){S.started=1;S.i=Math.max(0,Math.min(119,+hm[1]-1));save();}
if(!STUDY&&S.done){if(hm){render();}else{S.i=-1;result();}}
else{render();if(S.started)startTimer();}
</script>
</body></html>
